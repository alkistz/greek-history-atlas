# Events. v0 corpus: eleven events chosen so each one anchors a moment the map shows.
#
# Dates are proleptic Gregorian. Where a source gives the Old Style (Julian) date,
# `as_written` records it, because Greek historiography uses both and the twelve or
# thirteen day offset is the commonest error in the literature.
#
# Titles and summaries use the {en, el} shape from the start. Only `en` is populated
# in v0; the Greek follows later.

- id: revolution-outbreak
  title:
    en: Outbreak of the Greek Revolution
  summary:
    en: >
      Risings against Ottoman rule broke out across the Peloponnese and Central Greece
      in the spring of 1821. The 25th of March is the date the Greek state later chose
      to commemorate, though the first actions came earlier and in several places at
      once, including Alexandros Ypsilantis crossing the Pruth into Moldavia in February.
  period: [1821-03-25, 1821-03-26]
  precision: day
  as_written: {date: 1821-03-13, calendar: julian}
  atom: peloponnese
  significance: 5

- id: fall-of-tripolitsa
  title:
    en: The Fall of Tripolitsa
  summary:
    en: >
      Greek forces took the Ottoman administrative capital of the Morea after a long
      siege. The capture was followed by the massacre of much of the Muslim and Jewish
      population of the town. It secured the Peloponnese for the revolution and set a
      pattern of reprisal that ran through the war on both sides.
  period: [1821-09-23, 1821-09-24]
  precision: day
  atom: peloponnese
  significance: 4

- id: chios-massacre
  title:
    en: The Massacre of Chios
  summary:
    en: >
      Ottoman forces landed on Chios in response to a rising encouraged from Samos, and
      destroyed the island's population by killing, enslavement and flight. The scale of
      it turned European opinion toward the Greek cause, most visibly through Delacroix's
      painting of 1824.
  period: [1822-04-11, 1822-05-01]
  precision: span
  atom: chios
  significance: 4

- id: exodus-of-messolonghi
  title:
    en: The Exodus of Messolonghi
  summary:
    en: >
      After a year under siege by Ottoman and Egyptian forces, the garrison and civilian
      population of Messolonghi attempted a mass breakout by night. Most were killed or
      taken. The town had already become the symbol of the revolution abroad, where Byron
      had died two years earlier, and its fall did more for Greek diplomacy than its
      defence had done for Greek arms.
  period: [1826-04-22, 1826-04-24]
  precision: day
  as_written: {date: 1826-04-10, calendar: julian}
  atom: aitoloakarnania
  significance: 5

- id: battle-of-navarino
  title:
    en: The Battle of Navarino
  summary:
    en: >
      A combined British, French and Russian fleet destroyed the Ottoman and Egyptian
      fleet in Navarino Bay. The engagement was not intended as a battle and no power had
      declared war. It nonetheless ended Ottoman capacity to hold the Peloponnese by sea
      and made Greek independence a question of terms rather than of outcome.
  period: [1827-10-20, 1827-10-21]
  precision: day
  atom: peloponnese
  significance: 5

- id: treaty-of-constantinople-1832
  title:
    en: The Treaty of Constantinople
  summary:
    en: >
      The Ottoman Empire recognised an independent Greek kingdom and accepted a frontier
      running from the Gulf of Arta to the Pagasetic Gulf. This was a more generous line
      than the London Protocol of 1830 had drawn. The new state held the Peloponnese,
      Attica, Central Greece, Euboea and the Cyclades, and roughly a third of the Greek
      speaking population of the region lived inside it.
  period: [1832-07-21, 1832-07-22]
  precision: day
  atom: sterea
  significance: 5

- id: union-of-the-ionian-islands
  title:
    en: The Union of the Ionian Islands
  summary:
    en: >
      Britain ceded the United States of the Ionian Islands to Greece, a protectorate it
      had held since 1815. The transfer was tied to the accession of George I and was the
      first enlargement of the kingdom. It was also the only one achieved by diplomacy
      alone, without a war.
  period: [1864-06-02, 1864-06-03]
  precision: day
  atom: ionian
  significance: 4

- id: cession-of-thessaly-1881
  title:
    en: The Cession of Thessaly and Arta
  summary:
    en: >
      Following the Congress of Berlin, the Ottoman Empire ceded Thessaly and the district
      of Arta to Greece without a war. Greece had mobilised but had not fought. The
      settlement left Elassona on the Ottoman side of the new line, where it stayed until
      1912.
  period: [1881-07-02, 1881-07-03]
  precision: day
  as_written: {date: 1881-05-24, calendar: julian}
  atom: thessaly
  significance: 4

- id: treaty-of-bucharest-1913
  title:
    en: The Treaty of Bucharest
  summary:
    en: >
      The settlement of the Second Balkan War divided Ottoman Macedonia between Greece,
      Serbia and Bulgaria. Greece gained Epirus, most of Macedonia including Thessaloniki,
      and the northern Aegean islands. In two campaigns the kingdom had roughly doubled in
      both territory and population, and had absorbed a population that was not
      predominantly Greek speaking.
  period: [1913-08-10, 1913-08-11]
  precision: day
  atom: macedonia-central
  significance: 5

- id: treaty-of-lausanne-1923
  title:
    en: The Treaty of Lausanne and the Exchange of Populations
  summary:
    en: >
      After the collapse of the Greek campaign in Asia Minor, Lausanne fixed the frontier
      with the new Turkish republic and provided for a compulsory exchange of populations
      on religious criteria. Roughly 1.2 million Orthodox Christians moved to Greece and
      around 400,000 Muslims moved the other way. It ended the Greek presence in Anatolia
      and reshaped the demography of Macedonia and Thrace within a few years.
  period: [1923-07-24, 1923-07-25]
  precision: day
  atom: macedonia-central
  significance: 5

- id: axis-invasion-1941
  title:
    en: The Axis Invasion and the Triple Occupation
  summary:
    en: >
      German forces invaded on 6 April 1941 after the Italian attack from Albania had
      failed. Athens fell on 27 April and Crete followed in May. The country was then
      divided into German, Italian and Bulgarian zones of occupation while the Greek state
      continued to exist in exile, which is why the map shows occupation as a layer over
      sovereignty rather than in place of it.
  period: [1941-04-06, 1941-06-01]
  precision: span
  atom: attica
  significance: 5

- id: union-of-the-dodecanese
  title:
    en: The Union of the Dodecanese
  summary:
    en: >
      The Paris Peace Treaty transferred the Dodecanese from Italy, which had held the
      islands since 1912, to Greece. Greek administration began in March 1947 and the
      formal union followed on 7 March 1948. It was the last enlargement of the Greek
      state.
  period: [1947-02-10, 1947-02-11]
  precision: day
  atom: dodecanese
  significance: 4
