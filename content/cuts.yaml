- id: thessaly-1881
  name: {en: The Thessalian frontier of 1881, el: Το θεσσαλικό σύνορο του 1881}
  note: >
    North of the line ceded in 1881, which left Elassona and the hills beyond Kalambaka
    Ottoman until 1912. The vertices are OpenHistoricalMap's for the Kingdom of Greece,
    1881-1913 (relation 2692556), with one moved: that relation passes south of Tyrnavos,
    which was ceded in 1881, so its vertex there is put at the Melouna pass, where the
    Tyrnavos-Elassona road crossed the frontier and the war of 1897 began. Nine vertices
    over two hundred kilometres: right about which towns fell where, rough between them.
    The small rectification after 1897 is not drawn.
  polygon:
    [[21.094, 39.513], [21.39, 39.758], [21.522, 39.821], [21.791, 39.682],
     [22.094, 39.762], [22.25, 39.86], [22.775, 39.872], [22.808, 39.883],
     [23.6, 39.883], [23.6, 40.7], [20.9, 40.7], [20.9, 39.513]]

- id: north-cyprus-1974
  name: {en: The ceasefire line of 1974, el: Η γραμμή κατάπαυσης του πυρός του 1974}
  ohm: 2801348
  note: >
    The area held by the Turkish army since the ceasefire of 16 August 1974, as
    OpenHistoricalMap draws Northern Cyprus. The relation is flagged there as needing a
    source for its lines; it follows the present Green Line, which is the 1974
    ceasefire line.
