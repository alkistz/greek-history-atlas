# Who held what, when.
#
# Periods are half-open [from, to): a transfer date belongs to the new holder, so no
# atom is ever held twice on a boundary day. `to: null` means open-ended.
#
# `kind` is one of: sovereign, occupied, administered, autonomous, insurgent.
# A sovereign row and an occupied row may coexist over the same atom. That is the
# point of the model: in 1941-44 Greece remains sovereign while others occupy.
#
# Dates are proleptic Gregorian. Where a transfer was de facto before it was de jure,
# v0 uses the treaty date and notes the gap.

# ---------------------------------------------------------------- Ottoman baseline
- {atom: peloponnese,       polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1832-07-21}
- {atom: attica,            polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1832-07-21}
- {atom: sterea,            polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1832-07-21}
- {atom: evvoia,            polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1832-07-21}
- {atom: aitoloakarnania,   polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1832-07-21}
- {atom: cyclades,          polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1832-07-21}
- {atom: thessaly,          polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1881-07-02}
- {atom: arta-preveza,      polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1881-07-02}
- {atom: epirus,            polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-08-10}
- {atom: macedonia-west,    polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-08-10}
- {atom: macedonia-central, polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-08-10}
- {atom: macedonia-east,    polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-08-10}
- {atom: thrace-west,       polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-08-10}
- {atom: crete,             polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1898-12-09}
- {atom: lesvos-limnos,     polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-05-30}
- {atom: chios,             polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1913-05-30}
- {atom: samos-ikaria,      polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1834-01-01}
- {atom: dodecanese,        polity: ottoman, kind: sovereign, from: 1821-01-01, to: 1912-05-20}

# ------------------------------------------------- Revolution 1821-1832: insurgency
# Rendered as insurgency, never as sovereignty. Ottoman sovereignty persists above.
# v0 simplification: Ibrahim's reconquest of most of the Peloponnese in 1825-27 is
# not modelled, so the insurgent extent is shown as static across the whole decade.
- {atom: peloponnese,     polity: gr-provisional, kind: insurgent, from: 1821-03-25, to: 1832-07-21}
- {atom: sterea,          polity: gr-provisional, kind: insurgent, from: 1821-03-25, to: 1832-07-21}
- {atom: aitoloakarnania, polity: gr-provisional, kind: insurgent, from: 1821-05-01, to: 1832-07-21}
- {atom: evvoia,          polity: gr-provisional, kind: insurgent, from: 1821-04-01, to: 1832-07-21}
- {atom: cyclades,        polity: gr-provisional, kind: insurgent, from: 1821-04-01, to: 1832-07-21}

# ------------------------------------------------------------ Ionian Islands to 1864
# The United States of the Ionian Islands was nominally sovereign under a British
# protectorate. Two layers again: sovereignty and the administering power.
- {atom: ionian, polity: ionian-state, kind: sovereign,    from: 1821-01-01, to: 1864-06-02}
- {atom: ionian, polity: britain,      kind: administered, from: 1821-01-01, to: 1864-06-02,
   instrument: "Treaty of Paris, 1815"}

