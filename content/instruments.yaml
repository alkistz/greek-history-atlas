# Treaties, protocols and conventions that moved a frontier on this map.
# Referenced by id from control.yaml and from events. `parties` lists the
# signatories that matter to this atlas, not every plenipotentiary present.

- id: paris-1815
  name: {en: Treaty of Paris, el: Συνθήκη των Παρισίων}
  kind: treaty
  signed: 1815-11-05
  parties: [britain, russia, austria, prussia]
  summary:
    en: >
      Placed the Ionian Islands under the exclusive protection of Britain as the United
      States of the Ionian Islands, a nominally sovereign state run by a British Lord
      High Commissioner.
    el: >
      Έθεσε τα Επτάνησα υπό την αποκλειστική προστασία της Βρετανίας ως Ηνωμένο Κράτος των
      Ιονίων Νήσων, ένα κατ' όνομα κυρίαρχο κράτος που διοικούσε βρετανός αρμοστής.
  sources: [{id: clogg-2021}]

- id: london-protocol-1830
  name: {en: London Protocol, el: Πρωτόκολλο του Λονδίνου}
  kind: protocol
  signed: 1830-02-03
  parties: [britain, france, russia]
  summary:
    en: >
      Declared Greece an independent state under the guarantee of the three Powers.
      The frontier it drew, along the Aspropotamos and Spercheios rivers, was narrower
      than the line finally agreed in 1832.
    el: >
      Ανακήρυξε την Ελλάδα ανεξάρτητο κράτος υπό την εγγύηση των τριών Δυνάμεων. Το σύνορο που
      χάραξε, στον Ασπροπόταμο και τον Σπερχειό, ήταν στενότερο από τη γραμμή που συμφωνήθηκε
      τελικά το 1832.
  sources: [{id: clogg-2021}]

- id: constantinople-1832
  name: {en: Treaty of Constantinople, el: Συνθήκη της Κωνσταντινούπολης}
  kind: treaty
  signed: 1832-07-21
  parties: [britain, france, russia, ottoman]
  summary:
    en: >
      The Ottoman Empire recognised the independent Kingdom of Greece and accepted a
      frontier from the Gulf of Arta to the Gulf of Volos, in return for an indemnity.
    el: >
      Η Οθωμανική Αυτοκρατορία αναγνώρισε το ανεξάρτητο Βασίλειο της Ελλάδας και δέχθηκε
      σύνορο από τον Αμβρακικό ως τον Παγασητικό κόλπο, με αντάλλαγμα αποζημίωση.
  sources: [{id: clogg-2021}]

- id: london-1864
  name: {en: Treaty of London, el: Συνθήκη του Λονδίνου}
  kind: treaty
  signed: 1864-03-29
  parties: [britain, france, russia, gr-kingdom]
  summary:
    en: >
      Britain ceded the Ionian Islands to Greece on condition of their perpetual
      neutrality. The transfer took effect on 2 June 1864.
    el: >
      Η Βρετανία παραχώρησε τα Επτάνησα στην Ελλάδα με όρο τη διαρκή ουδετερότητά τους. Η
      μεταβίβαση τέθηκε σε ισχύ στις 2 Ιουνίου 1864.
  sources: [{id: clogg-2021}]

- id: constantinople-1881
  name: {en: Convention of Constantinople, el: Σύμβαση της Κωνσταντινούπολης}
  kind: convention
  signed: 1881-07-02
  parties: [ottoman, gr-kingdom]
  summary:
    en: >
      Following the Congress of Berlin, the Ottoman Empire ceded Thessaly and the
      district of Arta to Greece. Elassona and Preveza stayed Ottoman.
    el: >
      Μετά το Συνέδριο του Βερολίνου, η Οθωμανική Αυτοκρατορία παραχώρησε στην Ελλάδα τη
      Θεσσαλία και την επαρχία της Άρτας. Η Ελασσόνα και η Πρέβεζα έμειναν οθωμανικές.
  sources: [{id: clogg-2021}, {id: koliopoulos-veremis-2010}]

- id: london-1913
  name: {en: Treaty of London, el: Συνθήκη του Λονδίνου}
  kind: treaty
  signed: 1913-05-30
  parties: [ottoman, gr-kingdom, bulgaria, serbia, montenegro]
  summary:
    en: >
      Ended the First Balkan War. The Ottoman Empire gave up all its European territory
      west of a line from Enos to Midia, and left the fate of the Aegean islands and of
      Albania to the Great Powers.
    el: >
      Τερμάτισε τον Α΄ Βαλκανικό Πόλεμο. Η Οθωμανική Αυτοκρατορία παραιτήθηκε από όλα τα
      ευρωπαϊκά της εδάφη δυτικά της γραμμής Αίνου Μηδείας και άφησε την τύχη των νησιών του
      Αιγαίου και της Αλβανίας στις Μεγάλες Δυνάμεις.
  sources: [{id: hall-2000}]

- id: bucharest-1913
  name: {en: Treaty of Bucharest, el: Συνθήκη του Βουκουρεστίου}
  kind: treaty
  signed: 1913-08-10
  parties: [gr-kingdom, serbia, montenegro, romania, bulgaria]
  summary:
    en: >
      Ended the Second Balkan War and divided Ottoman Macedonia. Greece received southern
      Macedonia with Thessaloniki and Kavala; Bulgaria kept an outlet to the Aegean in
      Western Thrace.
    el: >
      Τερμάτισε τον Β΄ Βαλκανικό Πόλεμο και μοίρασε την οθωμανική Μακεδονία. Η Ελλάδα πήρε τη
      νότια Μακεδονία με τη Θεσσαλονίκη και την Καβάλα· η Βουλγαρία κράτησε διέξοδο στο Αιγαίο
      μέσα από τη Δυτική Θράκη.
  text_url: https://en.wikisource.org/wiki/Treaty_of_Bucharest
  sources: [{id: hall-2000}]

- id: neuilly-1919
  name: {en: Treaty of Neuilly, el: Συνθήκη του Νεϊγύ}
  kind: treaty
  signed: 1919-11-27
  parties: [bulgaria, britain, france, italy, gr-kingdom]
  summary:
    en: >
      The peace with Bulgaria after the First World War. Bulgaria ceded Western Thrace
      to the Allied Powers, who passed it to Greece in May 1920.
    el: >
      Η ειρήνη με τη Βουλγαρία μετά τον Α΄ Παγκόσμιο Πόλεμο. Η Βουλγαρία παραχώρησε τη Δυτική
      Θράκη στις Συμμαχικές Δυνάμεις, οι οποίες την παρέδωσαν στην Ελλάδα τον Μάιο του 1920.
  text_url: https://en.wikisource.org/wiki/Treaty_of_Neuilly
  sources: [{id: clogg-2021}]

- id: sevres-1920
  name: {en: Treaty of Sèvres, el: Συνθήκη των Σεβρών}
  kind: treaty
  signed: 1920-08-10
  parties: [ottoman, britain, france, italy, gr-kingdom]
  summary:
    en: >
      Awarded Greece Eastern Thrace and the administration of the Smyrna zone, with a
      plebiscite on sovereignty after five years. Never ratified, and overtaken by the
      Turkish victory of 1922.
    el: >
      Επιδίκασε στην Ελλάδα την Ανατολική Θράκη και τη διοίκηση της ζώνης της Σμύρνης, με
      δημοψήφισμα για την κυριαρχία έπειτα από πέντε χρόνια. Δεν επικυρώθηκε ποτέ και
      ξεπεράστηκε από την τουρκική νίκη του 1922.
  text_url: https://en.wikisource.org/wiki/Treaty_of_S%C3%A8vres
  sources: [{id: clogg-2021}, {id: clark-2006}]

- id: lausanne-1923
  name: {en: Treaty of Lausanne, el: Συνθήκη της Λωζάνης}
  kind: treaty
  signed: 1923-07-24
  parties: [turkey, gr-kingdom, britain, france, italy]
  summary:
    en: >
      Replaced Sèvres. Fixed the Greek-Turkish frontier on the Evros, returned Eastern
      Thrace, Imbros and Tenedos to Turkey, and gave the Dodecanese to Italy. The
      convention on the exchange of populations was signed alongside it in January.
    el: >
      Αντικατέστησε τις Σέβρες. Καθόρισε το ελληνοτουρκικό σύνορο στον Έβρο, επέστρεψε στην
      Τουρκία την Ανατολική Θράκη, την Ίμβρο και την Τένεδο, και έδωσε τα Δωδεκάνησα στην
      Ιταλία. Η σύμβαση για την ανταλλαγή των πληθυσμών είχε υπογραφεί παράλληλα, τον
      Ιανουάριο.
  text_url: https://en.wikisource.org/wiki/Treaty_of_Lausanne
  sources: [{id: clogg-2021}, {id: clark-2006}]

- id: paris-1947
  name: {en: Paris Peace Treaty with Italy, el: Συνθήκη Ειρήνης των Παρισίων}
  kind: treaty
  signed: 1947-02-10
  parties: [italy, britain, france, gr-kingdom]
  summary:
    en: >
      The peace with Italy after the Second World War. Italy ceded the Dodecanese to
      Greece; the formal union followed on 7 March 1948.
    el: >
      Η ειρήνη με την Ιταλία μετά τον Δεύτερο Παγκόσμιο Πόλεμο. Η Ιταλία παραχώρησε τα
      Δωδεκάνησα στην Ελλάδα· η επίσημη ενσωμάτωση ακολούθησε στις 7 Μαρτίου 1948.
  sources: [{id: clogg-2021}]

- id: cyprus-convention-1878
  name: {en: Cyprus Convention, el: Σύμβαση της Κύπρου}
  kind: convention
  signed: 1878-06-04
  parties: [britain, ottoman]
  summary:
    en: >
      Britain took over the administration of Cyprus in return for a defensive alliance
      against Russia. Ottoman sovereignty was preserved on paper until Britain annexed
      the island on the outbreak of war with the Ottoman Empire in November 1914.
    el: >
      Η Βρετανία ανέλαβε τη διοίκηση της Κύπρου με αντάλλαγμα αμυντική συμμαχία εναντίον της
      Ρωσίας. Η οθωμανική κυριαρχία διατηρήθηκε τυπικά ώσπου η Βρετανία προσάρτησε το νησί με
      την έναρξη του πολέμου με την Οθωμανική Αυτοκρατορία τον Νοέμβριο του 1914.
  sources: [{id: clogg-2021}]

- id: mudanya-1922
  name: {en: Armistice of Mudanya, el: Ανακωχή των Μουδανιών}
  kind: armistice
  signed: 1922-10-11
  parties: [turkey, gr-kingdom, britain, france, italy]
  summary:
    en: >
      Ended the fighting in Anatolia and required Greece to evacuate Eastern Thrace
      within thirty days, ahead of the settlement at Lausanne.
    el: >
      Τερμάτισε τις εχθροπραξίες στην Ανατολία και υποχρέωσε την Ελλάδα να εκκενώσει την
      Ανατολική Θράκη μέσα σε τριάντα ημέρες, πριν από τη διευθέτηση της Λωζάνης.
  sources: [{id: clark-2006}]

- id: zurich-london-1959
  name: {en: Zürich and London Agreements, el: Συμφωνίες Ζυρίχης και Λονδίνου}
  kind: treaty
  signed: 1959-02-19
  parties: [britain, gr-kingdom, turkey]
  summary:
    en: >
      Settled the constitution and guarantee of an independent Cyprus. The Republic was
      proclaimed on 16 August 1960, with Britain retaining two sovereign base areas.
    el: >
      Ρύθμισαν το σύνταγμα και το καθεστώς εγγυήσεων μιας ανεξάρτητης Κύπρου. Η Δημοκρατία
      ανακηρύχθηκε στις 16 Αυγούστου 1960, με τη Βρετανία να διατηρεί δύο κυρίαρχες βάσεις.
  sources: [{id: clogg-2021}]

# ------------------------------------------------------------------- 1832-1897
# New instruments for the era 1832 to 1897. `constantinople-1832`, `london-1864`,
# `constantinople-1881` and `cyprus-convention-1878` already exist and are not repeated.

- id: berlin-1878
  name: {en: Treaty of Berlin, el: Συνθήκη του Βερολίνου}
  kind: treaty
  signed: 1878-07-13
  parties: [britain, russia, france, germany, austria, italy, ottoman]
  summary:
    en: >
      Revised the Treaty of San Stefano and broke up the Greater Bulgaria it had created.
      Greece was not a party. Article 24 and Protocol 13 of 5 July invited the Porte to
      rectify the Greek frontier in Thessaly and Epirus, with Great Power mediation if
      the two could not agree, and bound nobody to anything. The cession of Thessaly and
      Arta took three more years to extract.
    el: >
      Αναθεώρησε τη Συνθήκη του Αγίου Στεφάνου και διέλυσε τη Μεγάλη Βουλγαρία που είχε
      δημιουργήσει. Η Ελλάδα δεν ήταν συμβαλλόμενο μέρος. Το άρθρο 24 και το Πρωτόκολλο 13
      της 5ης Ιουλίου καλούσαν την Πύλη να διορθώσει τα ελληνικά σύνορα στη Θεσσαλία και
      την Ήπειρο, με μεσολάβηση των Δυνάμεων σε περίπτωση διαφωνίας, χωρίς να δεσμεύουν
      κανέναν. Η παραχώρηση της Θεσσαλίας και της Άρτας χρειάστηκε άλλα τρία χρόνια.
  sources: [{id: clogg-2021}, {id: koliopoulos-veremis-2010}]

- id: halepa-1878
  name: {en: Pact of Halepa, el: Σύμβαση της Χαλέπας}
  kind: convention
  signed: 1878-10-27
  parties: [ottoman]
  summary:
    en: >
      Agreed between the Porte and the Cretan revolutionary committee, which is not a
      polity this atlas lists. It moved no frontier but gave Crete a constitutional
      charter: a governor-general on a five-year term, a General Assembly with a
      Christian majority, Greek as the language of the courts, a local gendarmerie, tax
      concessions and an amnesty. Its abrogation around 1889 set off the chain of revolts
      that ended in the war of 1897.
    el: >
      Συμφωνήθηκε ανάμεσα στην Πύλη και την κρητική επαναστατική επιτροπή, που δεν
      περιλαμβάνεται στις πολιτειακές οντότητες του άτλαντα. Δεν μετακίνησε σύνορα, αλλά
      έδωσε στην Κρήτη συνταγματικό χάρτη: γενικό διοικητή με πενταετή θητεία, Γενική
      Συνέλευση με χριστιανική πλειοψηφία, την ελληνική ως γλώσσα των δικαστηρίων, τοπική
      χωροφυλακή, φορολογικές ελαφρύνσεις και αμνηστία. Η κατάργησή της γύρω στο 1889
      άνοιξε την αλυσίδα των εξεγέρσεων που κατέληξε στον πόλεμο του 1897.
  sources: [{id: clogg-2021}, {id: gallant-2016}]

- id: tatarna-1897
  name: {en: Armistice Protocol of Tatarna, el: Πρωτόκολλο ανακωχής της Τατάρνας}
  kind: armistice
  signed: 1897-05-20
  parties: [gr-kingdom, ottoman]
  summary:
    en: >
      Signed near Lamia under Great Power pressure after the intervention of Tsar
      Nicholas II, it ended the fighting of the Thirty Days' War and froze the Ottoman
      army in the Thessaly it had overrun, pending a settlement.
    el: >
      Υπογράφηκε κοντά στη Λαμία υπό την πίεση των Δυνάμεων, μετά τη μεσολάβηση του τσάρου
      Νικολάου Β΄. Τερμάτισε τις εχθροπραξίες του Πολέμου των Τριάντα Ημερών και καθήλωσε
      τον οθωμανικό στρατό στη Θεσσαλία που είχε καταλάβει, ως τη ρύθμιση της ειρήνης.
  sources: [{id: clogg-2021}, {id: koliopoulos-veremis-2010}]

- id: constantinople-1897
  name: {en: Treaty of Constantinople, el: Συνθήκη της Κωνσταντινούπολης}
  kind: treaty
  signed: 1897-12-04
  parties: [gr-kingdom, ottoman]
  summary:
    en: >
      The peace after the Thirty Days' War. Thessaly was returned, but the frontier moved
      south in the Ottomans' favour through the mountain passes. Greece paid an indemnity
      of four million Turkish pounds, Ottoman troops stayed in Thessaly until it was
      paid, and Greek revenues passed under international control. The Porte was bound in
      return to grant Crete autonomy.
    el: >
      Η ειρήνη μετά τον Πόλεμο των Τριάντα Ημερών. Η Θεσσαλία επιστράφηκε, αλλά τα σύνορα
      μετακινήθηκαν νοτιότερα υπέρ των Οθωμανών μέσα από τα ορεινά περάσματα. Η Ελλάδα
      πλήρωσε αποζημίωση τεσσάρων εκατομμυρίων τουρκικών λιρών, οθωμανικά στρατεύματα
      έμειναν στη Θεσσαλία ώσπου να εξοφληθεί και τα ελληνικά έσοδα πέρασαν σε διεθνή
      έλεγχο. Ως αντάλλαγμα η Πύλη δεσμεύθηκε να παραχωρήσει αυτονομία στην Κρήτη.
  sources: [{id: clogg-2021}, {id: koliopoulos-veremis-2010}]

# ------------------------------------------------------------------- 1898-1913
- id: ouchy-1912
  name: {en: Treaty of Ouchy, el: Συνθήκη του Ουσί}
  kind: treaty
  signed: 1912-10-18
  parties: [italy, ottoman]
  summary:
    en: >
      Ended the Italo-Turkish War. Tripolitania and Cyrenaica passed to Italy, and Italy
      undertook to evacuate the Dodecanese, occupied that spring, once Ottoman forces left
      Libya. The condition was loose enough to be ignored: Italy stayed in the islands
      until 1943 and they reached Greece only in 1947.
    el: >
      Τερμάτισε τον ιταλοτουρκικό πόλεμο. Η Τριπολίτιδα και η Κυρηναϊκή πέρασαν στην
      Ιταλία, ενώ η Ιταλία ανέλαβε να εκκενώσει τη Δωδεκάνησο, που είχε καταλάβει την ίδια
      άνοιξη, μόλις αποχωρούσαν από τη Λιβύη τα οθωμανικά στρατεύματα. Ο όρος ήταν αρκετά
      χαλαρός ώστε να αγνοηθεί: η Ιταλία παρέμεινε στα νησιά ως το 1943 και εκείνα
      περιήλθαν στην Ελλάδα μόλις το 1947.
  sources: [{id: hall-2000}, {id: gallant-2016}]

- id: thessaloniki-1913
  name: {en: Greco-Serbian Treaty of Alliance, el: Ελληνοσερβική Συνθήκη Συμμαχίας}
  kind: treaty
  signed: 1913-06-01
  parties: [gr-kingdom, serbia]
  summary:
    en: >
      A treaty of peace, friendship and mutual protection signed at Thessaloniki four weeks
      before Bulgaria attacked both signatories. Article 3 fixed the Greek and Serbian
      frontier on the demarcation line between the two armies, which is the origin of
      Greece's northern border in western Macedonia, and a military convention committed
      each to the other's defence with 40,000 and 50,000 men respectively. Greek sources
      give the Old Style date as 19 May 1913; the conversion should be checked against the
      Greek text.
    el: >
      Συνθήκη ειρήνης, φιλίας και αμοιβαίας προστασίας που υπογράφηκε στη Θεσσαλονίκη
      τέσσερις εβδομάδες πριν η Βουλγαρία επιτεθεί και στα δύο συμβαλλόμενα μέρη. Το άρθρο 3
      καθόριζε το ελληνοσερβικό σύνορο πάνω στη γραμμή επαφής των δύο στρατών, και από εκεί
      προέρχεται το βόρειο σύνορο της Ελλάδας στη δυτική Μακεδονία, ενώ στρατιωτική σύμβαση
      δέσμευε την καθεμιά στην άμυνα της άλλης με 40.000 και 50.000 άνδρες αντίστοιχα. Οι
      ελληνικές πηγές δίνουν ως παλαιό ημερολογιακό στίγμα τη 19η Μαΐου 1913, που χρειάζεται
      επαλήθευση στο ελληνικό κείμενο.
  sources: [{id: hall-2000}, {id: koliopoulos-veremis-2010}]

- id: london-albania-1913
  name: {en: Conference of Ambassadors decision on Albania, el: Απόφαση της Διάσκεψης των Πρεσβευτών για την Αλβανία}
  kind: protocol
  signed: 1913-07-29
  parties: [britain, france, russia, italy, austria, germany]
  summary:
    en: >
      The six Great Powers resolved in London to constitute Albania as an autonomous
      sovereign principality under their guarantee. The decision removed from Greek hands
      the Epirot districts the Greek army had occupied during the First Balkan War, and it
      is the reason the Greek gain in Epirus stopped where it did.
    el: >
      Οι έξι Μεγάλες Δυνάμεις αποφάσισαν στο Λονδίνο τη σύσταση της Αλβανίας ως αυτόνομης
      κυρίαρχης ηγεμονίας υπό την εγγύησή τους. Η απόφαση αφαιρούσε από τα ελληνικά χέρια
      τις ηπειρωτικές περιοχές που είχε καταλάβει ο ελληνικός στρατός στον Α΄ Βαλκανικό
      Πόλεμο και εξηγεί γιατί το ελληνικό κέρδος στην Ήπειρο σταμάτησε εκεί που σταμάτησε.
  sources: [{id: hall-2000}, {id: clogg-2021}]

- id: athens-1913
  name: {en: Treaty of Athens, el: Συνθήκη των Αθηνών}
  kind: treaty
  signed: 1913-11-14
  parties: [gr-kingdom, ottoman]
  summary:
    en: >
      The bilateral peace between Greece and the Ottoman Empire after the Balkan Wars. The
      Porte recognised Greek possession of Thessaloniki, Ioannina and their hinterlands and
      Greek sovereignty over Crete, and minority rights were guaranteed to the Muslims of
      the new territories. The north-eastern Aegean islands were left unresolved: the
      Powers awarded most of them to Greece in February 1914 and the Porte refused to
      accept the award.
    el: >
      Η διμερής ειρήνη Ελλάδας και Οθωμανικής Αυτοκρατορίας μετά τους Βαλκανικούς Πολέμους.
      Η Πύλη αναγνώρισε την ελληνική κατοχή της Θεσσαλονίκης, των Ιωαννίνων και των
      ενδοχωρών τους, καθώς και την ελληνική κυριαρχία στην Κρήτη, ενώ κατοχυρώθηκαν
      δικαιώματα για τους μουσουλμάνους των νέων χωρών. Τα νησιά του βορειοανατολικού
      Αιγαίου έμειναν αρρύθμιστα: οι Δυνάμεις τα επιδίκασαν στο μεγαλύτερο μέρος τους στην
      Ελλάδα τον Φεβρουάριο του 1914 και η Πύλη αρνήθηκε να αποδεχθεί την επιδίκαση.
  sources: [{id: hall-2000}, {id: clogg-2021}]

# ------------------------------------------------------------------- 1914-1923
# New instruments introduced by the 1914-1923 era.

- id: exchange-convention-1923
  name:
    en: Convention concerning the Exchange of Greek and Turkish Populations
    el: Σύμβαση περί ανταλλαγής των ελληνικών και τουρκικών πληθυσμών
  kind: convention
  signed: 1923-01-30
  parties: [gr-kingdom, turkey]
  summary:
    en: >
      Signed at Lausanne six months before the peace treaty, between Greece and the Grand
      National Assembly of Turkey. It made the removal of Greek Orthodox Christians from
      Turkey and of Muslims from Greece compulsory, on religious criteria, and forbade
      return without government permission. The Greeks of Constantinople and the Muslims
      of Western Thrace were exempted. Transfers were to begin on 1 May 1923 and a Mixed
      Commission under the League of Nations supervised them.
    el: >
      Υπογράφηκε στη Λωζάνη έξι μήνες πριν από τη συνθήκη ειρήνης, ανάμεσα στην Ελλάδα και τη
      Μεγάλη Εθνοσυνέλευση της Τουρκίας. Κατέστησε υποχρεωτική, με κριτήριο το θρήσκευμα, τη
      μετακίνηση των ορθόδοξων χριστιανών από την Τουρκία και των μουσουλμάνων από την Ελλάδα,
      και απαγόρευσε την επιστροφή χωρίς κυβερνητική άδεια. Εξαιρέθηκαν οι Έλληνες της
      Κωνσταντινούπολης και οι μουσουλμάνοι της Δυτικής Θράκης. Οι μεταφορές θα άρχιζαν την 1η
      Μαΐου 1923 και τις επέβλεψε Μεικτή Επιτροπή υπό την Κοινωνία των Εθνών.
  text_url: https://en.wikisource.org/wiki/Convention_Concerning_the_Exchange_of_Greek_and_Turkish_Populations
  sources: [{id: clark-2006}, {id: clogg-2021}]

# ------------------------------------------------------------------- 1924-1940
- id: ankara-convention-1930
  name:
    en: Ankara Convention on the exchangeable properties
    el: Σύμβαση της Άγκυρας για τις ανταλλάξιμες περιουσίες
  kind: convention
  signed: 1930-06-10
  parties: [gr-kingdom, turkey]
  summary:
    en: >
      Closed the property question left open by the Lausanne exchange of populations. The
      abandoned property of roughly 1,100,000 Greeks in Turkey and roughly 400,000 Turks in
      Greece was declared of equivalent value and written off against itself, with no Turkish
      compensation to Greece. Greece paid a balance of £425,000: £150,000 for the Muslims of
      Western Thrace exempt from the exchange, £150,000 for the Greeks of Istanbul and
      £125,000 on properties predating 1912. Greek refugee organisations regarded it as the
      final renunciation of their claims in Anatolia.
    el: >
      Έκλεισε το ζήτημα των περιουσιών που είχε αφήσει ανοιχτό η ανταλλαγή πληθυσμών της
      Λωζάνης. Οι εγκαταλελειμμένες περιουσίες περίπου 1.100.000 Ελλήνων στην Τουρκία και
      περίπου 400.000 Τούρκων στην Ελλάδα κηρύχθηκαν ισάξιες και συμψηφίστηκαν, χωρίς
      τουρκική αποζημίωση προς την Ελλάδα. Η Ελλάδα κατέβαλε υπόλοιπο 425.000 λιρών: 150.000
      για τους μουσουλμάνους της Δυτικής Θράκης που είχαν εξαιρεθεί από την ανταλλαγή,
      150.000 για τους Έλληνες της Πόλης και 125.000 για περιουσίες προ του 1912. Οι
      προσφυγικές οργανώσεις τη θεώρησαν οριστική παραίτηση από τις αξιώσεις τους στην
      Ανατολία.
  sources:
    - {id: clark-2006}
    - {id: clogg-2021}

- id: ankara-1930
  name:
    en: Treaty of Ankara
    el: Σύμφωνο της Άγκυρας
  kind: treaty
  signed: 1930-10-30
  parties: [gr-kingdom, turkey]
  summary:
    en: >
      Treaty of Friendship, Neutrality, Conciliation and Arbitration signed by Venizelos and
      İnönü, with a convention of commerce, navigation and residence and a naval protocol.
      Each party undertook to remain neutral if the other were attacked and to join no
      political or economic combination directed against the other; disputes went to
      compulsory conciliation and arbitration, and the naval protocol required six months'
      notice of new construction with the aim of parity in the Aegean. Registered in the
      League of Nations Treaty Series, volume 125 number 2841, and in force from 5 October
      1931. An additional protocol at Athens on 27 April 1938 extended it.
    el: >
      Σύμφωνο Φιλίας, Ουδετερότητας, Συνδιαλλαγής και Διαιτησίας που υπέγραψαν ο Βενιζέλος
      και ο Ινονού, μαζί με σύμβαση εμπορίου, ναυτιλίας και εγκατάστασης και ναυτικό
      πρωτόκολλο. Κάθε πλευρά αναλάμβανε να παραμείνει ουδέτερη αν δεχόταν επίθεση η άλλη
      και να μη μετέχει σε πολιτικό ή οικονομικό συνασπισμό στραμμένο εναντίον της· οι
      διαφορές πήγαιναν σε υποχρεωτική συνδιαλλαγή και διαιτησία, ενώ το ναυτικό πρωτόκολλο
      απαιτούσε εξάμηνη προειδοποίηση για νέες ναυπηγήσεις με στόχο την ισορροπία στο Αιγαίο.
      Καταχωρίστηκε στη Σειρά Συνθηκών της Κοινωνίας των Εθνών, τόμος 125 αριθμός 2841, και
      ίσχυσε από τις 5 Οκτωβρίου 1931. Πρόσθετο πρωτόκολλο στην Αθήνα στις 27 Απριλίου 1938
      το επέκτεινε.
  sources:
    - {id: clogg-2021}
    - {id: koliopoulos-veremis-2010}

- id: balkan-pact-1934
  name:
    en: Pact of Balkan Entente
    el: Σύμφωνο Βαλκανικής Συνεννόησης
  kind: treaty
  signed: 1934-02-09
  parties: [gr-kingdom, turkey, romania]
  summary:
    en: >
      Signed at Athens by Greece, Turkey, Romania and Yugoslavia, which guaranteed each
      other's Balkan frontiers against aggression by another Balkan state. In practice it was
      aimed at Bulgarian revisionism, and Bulgaria and Albania stayed outside it. Greece
      attached a reservation, well attested in the scholarship though its precise instrument
      was not verified here, that it would not be drawn into war against a great power from
      outside the Balkans, which meant Italy. That reservation was the measure of how little
      the pact was worth to Greece by 1940.
    el: >
      Υπογράφηκε στην Αθήνα από την Ελλάδα, την Τουρκία, τη Ρουμανία και τη Γιουγκοσλαβία,
      που εγγυήθηκαν αμοιβαία τα βαλκανικά τους σύνορα έναντι επίθεσης από άλλο βαλκανικό
      κράτος. Στην πράξη στρεφόταν κατά του βουλγαρικού αναθεωρητισμού, και η Βουλγαρία και η
      Αλβανία έμειναν εκτός. Η Ελλάδα προσάρτησε επιφύλαξη, καλά τεκμηριωμένη στη
      βιβλιογραφία αν και η ακριβής της μορφή δεν επαληθεύτηκε εδώ, ότι δεν θα συρόταν σε
      πόλεμο εναντίον μεγάλης δύναμης εκτός Βαλκανίων, δηλαδή της Ιταλίας. Η επιφύλαξη αυτή
      δείχνει πόσο λίγα άξιζε το σύμφωνο για την Ελλάδα ως το 1940.
  sources:
    - {id: koliopoulos-veremis-2010}
    - {id: clogg-2021}

- id: salonika-1938
  name:
    en: Salonika Agreement
    el: Συμφωνία της Θεσσαλονίκης
  kind: convention
  signed: 1938-07-31
  parties: [gr-kingdom, turkey, romania, bulgaria]
  summary:
    en: >
      Agreement between Bulgaria and the states of the Balkan Entente, signed for the Entente
      by Metaxas as president of its council and for Bulgaria by Georgi Kyoseivanov, with
      Yugoslavia also a party. It released Bulgaria from the arms limitations imposed by the
      Treaty of Neuilly and abolished the demilitarised zones along the Bulgarian frontiers
      with Greece and Turkey created by Neuilly and Lausanne, in exchange for a mutual
      renunciation of force. Registered with the League of Nations on 14 June 1939. It removed
      the legal buffer that the fortification of the Greek northern frontier had been built to
      support.
    el: >
      Συμφωνία ανάμεσα στη Βουλγαρία και τα κράτη της Βαλκανικής Συνεννόησης, που υπέγραψαν
      για τη Συνεννόηση ο Μεταξάς ως πρόεδρος του συμβουλίου της και για τη Βουλγαρία ο
      Γκεόργκι Κιοσεϊβάνοφ, με συμβαλλόμενη και τη Γιουγκοσλαβία. Απάλλαξε τη Βουλγαρία από
      τους περιορισμούς εξοπλισμών της Συνθήκης του Νεϊγύ και κατάργησε τις
      αποστρατιωτικοποιημένες ζώνες στα βουλγαρικά σύνορα με την Ελλάδα και την Τουρκία, που
      είχαν δημιουργήσει το Νεϊγύ και η Λωζάνη, με αντάλλαγμα την αμοιβαία αποκήρυξη της
      βίας. Καταχωρίστηκε στην Κοινωνία των Εθνών στις 14 Ιουνίου 1939. Αφαίρεσε το νομικό
      ανάχωμα που υποτίθεται ότι στήριζε η οχύρωση των βόρειων ελληνικών συνόρων.
  sources:
    - {id: koliopoulos-veremis-2010}
    - {id: clogg-2021}

# ------------------------------------------------------------------- 1941-1945
# New instruments for the 1941 to 1945 era.

- id: bulgarian-annexation-1941
  name: {en: Bulgarian Decree of Annexation, el: Βουλγαρικό διάταγμα προσάρτησης}
  kind: decree
  signed: 1941-05-14
  parties: [bulgaria]
  summary:
    en: >
      Annexed to Bulgaria, with German acquiescence, eastern Macedonia east of the
      Strymon, western Thrace west of the Evros, and Thasos and Samothrace. Bulgaria was
      the only Axis power to claim Greek territory as its own rather than occupy it, and
      it imposed Bulgarian law, currency, schools and administration on the zone until
      its withdrawal in October 1944.
    el: >
      Προσάρτησε στη Βουλγαρία, με γερμανική ανοχή, την ανατολική Μακεδονία ανατολικά του
      Στρυμόνα, τη δυτική Θράκη δυτικά του Έβρου, καθώς και τη Θάσο και τη Σαμοθράκη. Η
      Βουλγαρία ήταν η μόνη δύναμη του Άξονα που διεκδίκησε ελληνικό έδαφος ως δικό της
      αντί απλώς να το κατέχει, και επέβαλε στη ζώνη βουλγαρικό δίκαιο, νόμισμα, σχολεία
      και διοίκηση ως την αποχώρησή της τον Οκτώβριο του 1944.
  sources: [{id: mazower-1993}, {id: koliopoulos-veremis-2010}]

# ------------------------------------------------------------------- 1946-1966
# New instruments for the era 1946-1966. The Zurich and London agreements of
# February 1959 (zurich-london-1959) and the Paris peace treaty of 1947
# (paris-1947) already exist and are referenced by id.

- id: nicosia-1960
  name:
    en: Treaty concerning the Establishment of the Republic of Cyprus
    el: Συνθήκη Εγκαθιδρύσεως της Κυπριακής Δημοκρατίας
  kind: treaty
  signed: 1960-08-16
  parties: [britain, gr-kingdom, turkey, cyprus-republic]
  summary:
    en: >
      Created the Republic of Cyprus out of the British Crown Colony, implementing the Zurich and
      London agreements of February 1959. Britain retained full sovereignty over the base areas of
      Akrotiri and Dhekelia, 254 square kilometres in all, about 2.7 per cent of the island, which
      remain British territory. A companion Treaty of Alliance, signed the same day by Cyprus,
      Greece and Turkey, stationed a Greek contingent of 950 and a Turkish contingent of 650 on
      the island.
    el: >
      Δημιούργησε την Κυπριακή Δημοκρατία από τη βρετανική αποικία του Στέμματος, υλοποιώντας τις
      συμφωνίες Ζυρίχης και Λονδίνου του Φεβρουαρίου 1959. Η Βρετανία διατήρησε πλήρη κυριαρχία
      στις περιοχές των βάσεων Ακρωτηρίου και Δεκέλειας, 254 τετραγωνικά χιλιόμετρα συνολικά,
      περίπου 2,7% του νησιού, που παραμένουν βρετανικό έδαφος. Συνοδευτική Συνθήκη Συμμαχίας, που
      υπογράφηκε την ίδια μέρα από Κύπρο, Ελλάδα και Τουρκία, εγκατέστησε στο νησί ελληνική δύναμη
      950 και τουρκική 650 ανδρών.
  sources: [{id: ker-lindsay-2011}, {id: holland-1998}]

- id: cyprus-guarantee-1960
  name:
    en: Treaty of Guarantee
    el: Συνθήκη Εγγυήσεως
  kind: treaty
  signed: 1960-08-16
  parties: [cyprus-republic, gr-kingdom, turkey, britain]
  summary:
    en: >
      Bound Greece, Turkey and the United Kingdom to guarantee the independence, territorial
      integrity and security of Cyprus, and expressly prohibited both union of the island with any
      other state and its partition. Article IV allowed each guarantor, where concerted action
      proved impossible, to act with the sole aim of re-establishing the state of affairs the
      treaty created. Turkey invoked that article in July 1974.
    el: >
      Δέσμευσε την Ελλάδα, την Τουρκία και το Ηνωμένο Βασίλειο να εγγυηθούν την ανεξαρτησία, την
      εδαφική ακεραιότητα και την ασφάλεια της Κύπρου, και απαγόρευσε ρητά τόσο την ένωση του
      νησιού με άλλο κράτος όσο και τη διχοτόμησή του. Το άρθρο IV επέτρεπε σε κάθε εγγυήτρια
      δύναμη, όπου η από κοινού δράση αποδεικνυόταν αδύνατη, να ενεργήσει με μόνο σκοπό την
      αποκατάσταση της κατάστασης που δημιούργησε η συνθήκη. Η Τουρκία επικαλέστηκε το άρθρο αυτό
      τον Ιούλιο του 1974.
  sources: [{id: ker-lindsay-2011}, {id: holland-markides-2006}]

# ------------------------------------------------------------------- 1967-present
- id: accession-1979
  name: {en: Treaty of Accession of Greece, el: Συνθήκη Προσχώρησης της Ελλάδας}
  kind: treaty
  signed: 1979-05-28
  summary:
    en: >
      Signed at the Zappeion in Athens between Greece and the nine member states of the
      European Communities: Belgium, Denmark, West Germany, France, Ireland, Italy,
      Luxembourg, the Netherlands and the United Kingdom. It brought Greece in as the
      tenth member of the European Economic Community and Euratom on 1 January 1981,
      transferring competence over external trade, agriculture and competition policy to
      the Community institutions and beginning the process that led to the euro.
    el: >
      Υπογράφηκε στο Ζάππειο ανάμεσα στην Ελλάδα και στα εννέα κράτη μέλη των Ευρωπαϊκών
      Κοινοτήτων: το Βέλγιο, τη Δανία, τη Δυτική Γερμανία, τη Γαλλία, την Ιρλανδία, την
      Ιταλία, το Λουξεμβούργο, τις Κάτω Χώρες και το Ηνωμένο Βασίλειο. Έκανε την Ελλάδα
      δέκατο μέλος της Ευρωπαϊκής Οικονομικής Κοινότητας και της Ευρατόμ την 1η
      Ιανουαρίου 1981, μεταβιβάζοντας στα κοινοτικά όργανα αρμοδιότητες στο εξωτερικό
      εμπόριο, τη γεωργία και τον ανταγωνισμό, και ανοίγοντας τον δρόμο που οδήγησε στο
      ευρώ.
  sources:
    - {id: clogg-2021}
    - {id: kalyvas-2015}

- id: prespa-2018
  name: {en: Prespa Agreement, el: Συμφωνία των Πρεσπών}
  kind: treaty
  signed: 2018-06-17
  summary:
    en: >
      Signed at Psarades on Lake Prespa between Greece and the Republic of Macedonia,
      which became the Republic of North Macedonia under it, erga omnes and in every
      use. The agreement recorded the nationality as Macedonian or citizen of the
      Republic of North Macedonia and the language as Macedonian, a South Slavic
      language with no relation to ancient Hellenic civilisation; it terminated the
      Interim Accord of 1995, ended the Greek veto on the country's NATO and European
      Union accession, and set up a joint commission on history and school textbooks.
      Ratified by the Greek Parliament on 25 January 2019 and in force from 12 February
      2019.
    el: >
      Υπογράφηκε στους Ψαράδες της Πρέσπας ανάμεσα στην Ελλάδα και στη Δημοκρατία της
      Μακεδονίας, η οποία με βάση αυτήν έγινε Δημοκρατία της Βόρειας Μακεδονίας, erga
      omnes και για κάθε χρήση. Η συμφωνία κατέγραψε την ιθαγένεια ως μακεδονική ή
      πολίτη της Δημοκρατίας της Βόρειας Μακεδονίας και τη γλώσσα ως μακεδονική,
      νοτιοσλαβική γλώσσα χωρίς σχέση με τον αρχαίο ελληνικό πολιτισμό. Κατάργησε την
      Ενδιάμεση Συμφωνία του 1995, ήρε το ελληνικό βέτο στην ένταξη της χώρας στο ΝΑΤΟ
      και στην Ευρωπαϊκή Ένωση και συνέστησε μεικτή επιτροπή για την ιστορία και τα
      σχολικά βιβλία. Κυρώθηκε από τη Βουλή στις 25 Ιανουαρίου 2019 και ισχύει από τις
      12 Φεβρουαρίου 2019.
  sources:
    - {id: clogg-2021}
    - {id: beaton-2019}
