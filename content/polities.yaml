# Polities: states and state-like entities that held territory.
# Colours were chosen by a search that validated every set of polities that share a
# map (1826, 1840, 1900, 1913, 1920, 1942, 1965) for normal and colour-blind separation
# on both the light and the dark land surface. Lightness sits in the band both modes
# accept, so one palette serves both. The Cretan State and the Principality of Samos
# share a colour on purpose: both were autonomous under Ottoman suzerainty and they
# were never neighbours.

- id: ottoman
  name: {en: Ottoman Empire, el: Οθωμανική Αυτοκρατορία}
  kind: empire
  colour: "#a09565"

- id: gr-provisional
  name: {en: Provisional Government of Greece, el: Προσωρινή Διοίκησις της Ελλάδος}
  short: {en: Revolutionary Greece, el: Επαναστατημένη Ελλάδα}
  kind: de_facto
  colour: "#b7462c"

- id: gr-kingdom
  name: {en: Greece, el: Ελλάδα}
  kind: state
  colour: "#0d61aa"

- id: ionian-state
