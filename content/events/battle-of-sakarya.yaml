id: battle-of-sakarya
title:
  en: The Battle of the Sakarya
  el: Η μάχη του Σαγγαρίου
summary:
  en: >
    The Greek army marched on Ankara in August 1921 and fought for twenty-two days along
    a hundred kilometres of the Sakarya bend, the longest continuous front either side
    had held. Its patrols came within about fifty kilometres of the city before ammunition
    and exhaustion forced a withdrawal on 14 September. Each army lost roughly 4,000 dead
    and 19,000 wounded. The Greek army never advanced again: it spent the next eleven
    months standing still in central Anatolia while Turkish strength grew.
  el: >
    Ο ελληνικός στρατός βάδισε προς την Άγκυρα τον Αύγουστο του 1921 και πολέμησε επί είκοσι
    δύο ημέρες σε εκατό χιλιόμετρα κατά μήκος της καμπής του Σαγγαρίου, το μακρύτερο συνεχές
    μέτωπο που κράτησε ποτέ κάποια από τις δύο πλευρές. Οι περίπολοί του έφτασαν περίπου
    πενήντα χιλιόμετρα από την πόλη, πριν η έλλειψη πυρομαχικών και η εξάντληση επιβάλουν
    σύμπτυξη στις 14 Σεπτεμβρίου. Κάθε στρατός έχασε περίπου 4.000 νεκρούς και 19.000
    τραυματίες. Ο ελληνικός στρατός δεν προχώρησε ποτέ ξανά: πέρασε τους επόμενους έντεκα
    μήνες ακίνητος στην κεντρική Ανατολία, ενώ η τουρκική δύναμη μεγάλωνε.
body:
  en: |
    The victory at Kütahya and Eskişehir between 27 June and 20 July 1921 had pushed the
    Turkish army back east of the Sakarya. The Greek high command then took the decision
    the whole campaign turned on, against the objections of some of its own staff
    officers: to follow, and to take Ankara. The advance began on 10 August and made
    contact on 23 August. King Constantine had accompanied the army to Smyrna and
    Kütahya that summer, the first Greek king to set foot in Asia since antiquity, which
    was good for the newspapers and made no difference to the supply line.

    The Greeks put about 57,000 rifles, 386 guns, 2,768 machine guns and eighteen aircraft
    into the battle, at the end of a line of communication more than 400 kilometres from
    the sea with no railway for the last stretch. The Grand National Assembly had made
    Mustafa Kemal commander-in-chief with plenary powers on 5 August, and he directed the
    fighting himself, ordering that there was no line of defence but a surface of defence,
    and that surface was the whole country. The Greek army under Anastasios Papoulas
    broke into the position repeatedly and could not break through it.

    Casualty figures are disputed and one widely circulated table gives a figure for Greek
    dead so low as to be plainly corrupt. The order of magnitude is roughly 4,000 killed
    and 19,000 wounded on each side, with thousands more Greeks missing or deserted.
    Mustafa Kemal was voted the titles of Gazi and Marshal on 19 September. Sakarya did
    not destroy the Greek army; it ended its ability to impose a decision, which for an
    expeditionary force 400 kilometres from its base amounted to the same thing.
  el: |
    Η νίκη στο Κιουτάχεια και το Εσκί Σεχίρ, από τις 27 Ιουνίου ως τις 20 Ιουλίου 1921, είχε
    σπρώξει τον τουρκικό στρατό ανατολικά του Σαγγαρίου. Η ελληνική ηγεσία πήρε τότε την
    απόφαση γύρω από την οποία γύρισε όλη η εκστρατεία, παρά τις αντιρρήσεις μέρους των ίδιων
    των επιτελών της: να ακολουθήσει και να πάρει την Άγκυρα. Η προέλαση άρχισε στις 10
    Αυγούστου και ήρθε σε επαφή στις 23 Αυγούστου. Ο βασιλιάς Κωνσταντίνος είχε συνοδεύσει τον
    στρατό στη Σμύρνη και το Κιουτάχεια εκείνο το καλοκαίρι, πρώτος Έλληνας βασιλιάς που
    πατούσε την Ασία από την αρχαιότητα, πράγμα καλό για τις εφημερίδες και αδιάφορο για τη
    γραμμή ανεφοδιασμού.

    Οι Έλληνες έριξαν στη μάχη περίπου 57.000 τουφέκια, 386 πυροβόλα, 2.768 πολυβόλα και
    δεκαοκτώ αεροπλάνα, στο άκρο μιας γραμμής συγκοινωνιών πάνω από 400 χιλιόμετρα από τη
    θάλασσα, χωρίς σιδηρόδρομο στο τελευταίο κομμάτι. Η Μεγάλη Εθνοσυνέλευση είχε ανακηρύξει
    τον Μουσταφά Κεμάλ αρχιστράτηγο με πλήρεις εξουσίες στις 5 Αυγούστου, και εκείνος διηύθυνε
    ο ίδιος τη μάχη, δίνοντας τη διαταγή ότι δεν υπάρχει γραμμή άμυνας αλλά επιφάνεια άμυνας,
    και αυτή η επιφάνεια είναι ολόκληρη η χώρα. Ο ελληνικός στρατός υπό τον Αναστάσιο Παπούλα
    διέσπασε επανειλημμένα τη θέση και δεν κατάφερε να τη διαρρήξει.

    Οι απώλειες αμφισβητούνται και ένας ευρέως διαδεδομένος πίνακας δίνει για τους Έλληνες
    νεκρούς αριθμό τόσο χαμηλό ώστε να είναι προφανώς εσφαλμένος. Η τάξη μεγέθους είναι περίπου
    4.000 νεκροί και 19.000 τραυματίες σε κάθε πλευρά, με χιλιάδες ακόμη Έλληνες αγνοούμενους
    ή λιποτάκτες. Στον Μουσταφά Κεμάλ απονεμήθηκαν οι τίτλοι του Γαζή και του στρατάρχη στις 19
    Σεπτεμβρίου. Ο Σαγγάριος δεν κατέστρεψε τον ελληνικό στρατό· τερμάτισε την ικανότητά του να
    επιβάλει απόφαση, πράγμα που για εκστρατευτικό σώμα 400 χιλιόμετρα από τη βάση του ήταν το
    ίδιο πράγμα.
