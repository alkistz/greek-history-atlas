id: don-pacifico-blockade
title:
  en: The Don Pacifico Affair and the Blockade of Piraeus
  el: Η υπόθεση Πατσίφικο και ο αποκλεισμός του Πειραιά
summary:
  en: >
    A Gibraltar-born Jewish merchant with a British passport had his Athens house sacked
    by an Easter mob in 1847 and presented a bill the Greek government refused to pay.
    Three years later Lord Palmerston sent the Mediterranean Fleet, which blockaded
    Piraeus for three months and seized more than forty Greek merchant ships. Pacifico
    eventually received a fraction of what he had claimed. The episode showed how little
    the kingdom's sovereignty was worth against a protecting Power that had decided
    otherwise.
  el: >
    Σε έναν Εβραίο έμπορο γεννημένο στο Γιβραλτάρ, με βρετανικό διαβατήριο, λεηλάτησε το
    σπίτι του στην Αθήνα ένας πασχαλινός όχλος το 1847, και ο λογαριασμός που υπέβαλε
    δεν πληρώθηκε από την ελληνική κυβέρνηση. Τρία χρόνια αργότερα ο λόρδος Πάλμερστον
    έστειλε τον στόλο της Μεσογείου, που απέκλεισε τον Πειραιά επί τρεις μήνες και
    κατέσχεσε πάνω από σαράντα ελληνικά εμπορικά πλοία. Ο Πατσίφικο πήρε τελικά ελάχιστα
    από όσα ζητούσε. Το επεισόδιο έδειξε πόσο λίγο άξιζε η κυριαρχία του βασιλείου
    απέναντι σε μια προστάτιδα Δύναμη που είχε αποφασίσει διαφορετικά.
body:
  en: |
    On Easter Sunday 1847 the Athens police had banned the customary burning of a Judas
    effigy because Baron Karl de Rothschild was in town. The crowd took its anger to the
    house of David Pacifico, a Sephardi merchant who had been Portuguese consul general
    in Athens and who held British nationality by birth in Gibraltar. The police watched
    the house being stripped. Pacifico's claim came to some £32,000, most of it
    Portuguese bonds he said had been destroyed, a figure Palmerston's own law officers
    thought grossly inflated.

    Britain bundled the claim with a dispute over the islets of Sapienza and Elafonisos
    and with damage done to the historian George Finlay, and in January 1850 Admiral Sir
    William Parker anchored off Salamis. A pacific blockade of Piraeus and the other
    Greek ports was declared on 24 January. By mid-February the Royal Navy was holding
    more than forty Greek merchantmen and Greek trade had stopped. France withdrew its
    ambassador from London in protest and Russia objected formally; Baron Gros came to
    mediate and failed, and the British minister Thomas Wyse imposed terms directly. The
    blockade was lifted at the end of April, most accounts saying the twenty-sixth or
    twenty-seventh.

    Palmerston defended himself in the Commons on 25 June 1850 in a five-hour speech
    ending on the claim that a British subject, like a Roman citizen, should be able to
    say civis Romanus sum anywhere on earth and be safe. He carried the division 310 to
    264 after four nights of debate. A convention of 18 July settled the claims:
    Pacifico was awarded £150 in cash, a settlement of 120,000 drachmas and £500, a
    small fraction of his demand. The lesson Greeks drew was not about Pacifico, and
    British popularity in Athens did not recover for a generation.
  el: |
    Την Κυριακή του Πάσχα του 1847 η αστυνομία των Αθηνών είχε απαγορεύσει το έθιμο του
    καψίματος του Ιούδα, επειδή βρισκόταν στην πόλη ο βαρόνος Καρλ ντε Ρότσιλντ. Ο
    κόσμος έστρεψε την οργή του στο σπίτι του Δαβίδ Πατσίφικο, σεφαραδίτη εμπόρου, πρώην
    γενικού προξένου της Πορτογαλίας στην Αθήνα, που είχε βρετανική υπηκοότητα επειδή
    γεννήθηκε στο Γιβραλτάρ. Η αστυνομία παρακολούθησε τη λεηλασία χωρίς να επέμβει. Η
    απαίτηση του Πατσίφικο έφτανε τις 32.000 λίρες, κυρίως πορτογαλικά ομόλογα που
    υποστήριζε ότι καταστράφηκαν, ποσό που και οι ίδιοι οι νομικοί σύμβουλοι του
    Πάλμερστον θεωρούσαν κατάφωρα φουσκωμένο.

    Η Βρετανία συνέδεσε την απαίτηση με μια διαφορά για τις νησίδες Σαπιέντζα και
    Ελαφόνησο και με ζημιές που είχε υποστεί ο ιστορικός Τζορτζ Φίνλεϊ, και τον Ιανουάριο
    του 1850 ο ναύαρχος Ουίλιαμ Πάρκερ αγκυροβόλησε στη Σαλαμίνα. Στις 24 Ιανουαρίου
    κηρύχθηκε ειρηνικός αποκλεισμός του Πειραιά και των υπόλοιπων ελληνικών λιμανιών.
    Ως τα μέσα Φεβρουαρίου το βρετανικό ναυτικό κρατούσε πάνω από σαράντα ελληνικά
    εμπορικά και το ελληνικό εμπόριο είχε παραλύσει. Η Γαλλία ανακάλεσε τον πρεσβευτή
    της από το Λονδίνο και η Ρωσία διαμαρτυρήθηκε επίσημα. Η μεσολάβηση του βαρόνου Γκρο
    απέτυχε και ο Βρετανός πρέσβης Τόμας Ουάιζ επέβαλε απευθείας τους όρους. Ο
    αποκλεισμός ήρθη στα τέλη Απριλίου, κατά τις περισσότερες πηγές στις 26 ή 27 του μήνα.

    Ο Πάλμερστον υπερασπίστηκε την ενέργειά του στη Βουλή των Κοινοτήτων στις 25 Ιουνίου
    1850 με πεντάωρη αγόρευση που κατέληγε στο ότι ένας Βρετανός υπήκοος, όπως ο Ρωμαίος
    πολίτης, πρέπει να μπορεί να πει civis Romanus sum οπουδήποτε στη γη και να είναι
    ασφαλής. Κέρδισε την ψηφοφορία με 310 έναντι 264 ύστερα από τετραήμερη συζήτηση. Η
    σύμβαση της 18ης Ιουλίου ρύθμισε τις απαιτήσεις: ο Πατσίφικο πήρε 150 λίρες τοις
    μετρητοίς, έναν συμβιβασμό 120.000 δραχμών και 500 λίρες, ελάχιστο κλάσμα όσων
    ζητούσε. Το δίδαγμα που κράτησαν οι Έλληνες δεν αφορούσε τον Πατσίφικο, και η
    δημοτικότητα της Αγγλίας στην Αθήνα δεν συνήλθε για μια γενιά.
