id: constitution-of-1864
title:
  en: The Constitution of 1864
  el: Το Σύνταγμα του 1864
summary:
  en: >
    The assembly elected after Otto's deposition took nearly two years to produce a text
    and twice drove George I to threaten to leave. What it produced abolished the
    appointed Senate, declared that all powers spring from the Nation, and gave every
    adult Greek man the vote by direct secret ballot on a single day, one of the
    earliest such franchises in Europe. Greek lawyers call the form of government it
    created a crowned democracy rather than a constitutional monarchy. With amendments
    it remained the backbone of Greek constitutional law until 1974.
  el: >
    Η Εθνοσυνέλευση που εκλέχθηκε μετά την έξωση του Όθωνα χρειάστηκε σχεδόν δύο χρόνια
    για να παραγάγει κείμενο και δύο φορές οδήγησε τον Γεώργιο Α΄ να απειλήσει ότι θα
    φύγει. Το αποτέλεσμα κατάργησε τη διορισμένη Γερουσία, όρισε ότι πάσαι αι εξουσίαι
    πηγάζουν εκ του Έθνους και έδωσε σε κάθε ενήλικο Έλληνα το δικαίωμα ψήφου με άμεση
    και μυστική ψηφοφορία την ίδια ημέρα σε όλη τη χώρα, από τα πρωιμότερα τέτοια
    εκλογικά δικαιώματα στην Ευρώπη. Οι Έλληνες συνταγματολόγοι ονομάζουν το πολίτευμα
    που καθιέρωσε βασιλευομένη δημοκρατία και όχι συνταγματική μοναρχία. Με
    τροποποιήσεις παρέμεινε ο κορμός του ελληνικού συνταγματικού δικαίου ως το 1974.
body:
  en: |
    The Second National Assembly was elected in November 1862 and convened in December.
    It had to write a constitution, choose a king and reorganise a state at the same
    time, and it did all three badly and slowly. Kanaris, prime minister during the
    final crisis, broke the deadlock over the royal prerogative. The Assembly voted the
    text on 16 November 1864 Old Style and it appeared in the Government Gazette the
    next day; George swore it the same week.

    The text runs to 110 articles against the 107 of 1844, and the difference that
    mattered was Article 21: all powers spring from the Nation and are exercised in the
    manner the Constitution lays down. That is a formal transfer of sovereignty from the
    crown to the people, and Greek constitutional lawyers still treat the change of name
    from constitutional monarchy to crowned democracy as the decisive one. The appointed
    Senate was abolished outright and replaced by a single chamber of at least 150
    deputies on four-year terms, elected by direct, secret and universal male suffrage
    held on one day across the country. Voting was by lead pellet dropped into a box for
    each candidate, a system that let illiterate voters take part and lasted until 1923.

    What the text did not do was take from the king the right to dismiss ministers and
    dissolve parliament, and George used it much as Otto had. The gap closed only
    through political pressure: Charilaos Trikoupis published an anonymous article in
    June 1874 headed Who is to blame?, arguing that the fault lay with a crown that
    appointed minority governments, was identified as its author and briefly jailed. On
    11 July 1875 George accepted the dedilomeni principle, that he would call on no
    government without the declared confidence of the chamber. That, rather than the
    text itself, made Greece a parliamentary state.
  el: |
    Η Β΄ Εθνοσυνέλευση εκλέχθηκε τον Νοέμβριο του 1862 και συνήλθε τον Δεκέμβριο.
    Έπρεπε ταυτόχρονα να γράψει σύνταγμα, να εκλέξει βασιλιά και να ανασυγκροτήσει ένα
    κράτος, και τα τρία τα έκανε αργά και άσχημα. Ο Κανάρης, πρωθυπουργός στην τελική
    κρίση, έσπασε το αδιέξοδο γύρω από τα βασιλικά προνόμια. Η Συνέλευση ψήφισε το
    κείμενο στις 16 Νοεμβρίου 1864 και δημοσιεύθηκε στην Εφημερίδα της Κυβερνήσεως την
    επομένη. Ο Γεώργιος το ορκίστηκε μέσα στην ίδια εβδομάδα.

    Το κείμενο έχει 110 άρθρα έναντι 107 του 1844, και η διαφορά που μέτρησε ήταν το
    άρθρο 21: πάσαι αι εξουσίαι πηγάζουν εκ του Έθνους και ασκούνται καθώς ορίζει το
    Σύνταγμα. Πρόκειται για τυπική μεταβίβαση της κυριαρχίας από το στέμμα στον λαό, και
    οι Έλληνες συνταγματολόγοι θεωρούν ακόμη καθοριστική τη μετονομασία του πολιτεύματος
    από συνταγματική μοναρχία σε βασιλευομένη δημοκρατία. Η διορισμένη Γερουσία
    καταργήθηκε και αντικαταστάθηκε από ενιαία Βουλή τουλάχιστον 150 βουλευτών με
    τετραετή θητεία, εκλεγμένων με άμεση, μυστική και καθολική ψηφοφορία των ανδρών, την
    ίδια ημέρα σε όλη την επικράτεια. Ψήφιζαν με σφαιρίδιο που έριχναν στην κάλπη κάθε
    υποψηφίου, σύστημα που επέτρεπε στους αναλφάβητους να συμμετέχουν και κράτησε ως το
    1923.

    Εκείνο που δεν έκανε το κείμενο ήταν να αφαιρέσει από τον βασιλιά το δικαίωμα να
    παύει υπουργούς και να διαλύει τη Βουλή, και ο Γεώργιος το χρησιμοποίησε όπως
    περίπου και ο Όθων. Το κενό έκλεισε με πολιτική πίεση: ο Χαρίλαος Τρικούπης
    δημοσίευσε τον Ιούνιο του 1874 ανώνυμο άρθρο με τίτλο «Τις πταίει;», υποστηρίζοντας
    ότι η ευθύνη βάραινε ένα στέμμα που διόριζε κυβερνήσεις μειοψηφίας, αναγνωρίστηκε ως
    συντάκτης του και φυλακίστηκε για λίγο. Στις 11 Ιουλίου 1875 ο Γεώργιος αποδέχθηκε
    την αρχή της δεδηλωμένης, ότι δεν θα αναθέτει σε καμία κυβέρνηση χωρίς τη δεδηλωμένη
    εμπιστοσύνη της Βουλής. Αυτό, και όχι το ίδιο το κείμενο, έκανε την Ελλάδα
    κοινοβουλευτικό κράτος.
