id: great-power-blockade-1886
title:
  en: The Great Power blockade of 1886
  el: Ο αποκλεισμός των Μεγάλων Δυνάμεων το 1886
summary:
  en: >
    When Eastern Rumelia joined Bulgaria in September 1885, Theodoros Deligiannis
    mobilised the Greek army and demanded compensation from the Ottoman Empire. The
    Powers had settled the Bulgarian question without Greece and would not let it reopen
    the matter by war. After an ultimatum that Athens failed to satisfy, Britain,
    Germany, Austria-Hungary, Italy and Russia declared a pacific blockade of the Greek
    coast on 8 May 1886; France alone stood aside. Deligiannis resigned within days,
    Charilaos Trikoupis returned and demobilised, and the blockade was lifted on 7 June.
    Greece had paid for a war it never fought.
  el: >
    Όταν η Ανατολική Ρωμυλία ενώθηκε με τη Βουλγαρία τον Σεπτέμβριο του 1885, ο Θεόδωρος
    Δηλιγιάννης επιστράτευσε τον ελληνικό στρατό και ζήτησε ανταλλάγματα από την
    Οθωμανική Αυτοκρατορία. Οι Δυνάμεις είχαν ρυθμίσει το βουλγαρικό ζήτημα χωρίς την
    Ελλάδα και δεν θα της επέτρεπαν να το ανοίξει ξανά με πόλεμο. Ύστερα από τελεσίγραφο
    που η Αθήνα δεν ικανοποίησε, η Βρετανία, η Γερμανία, η Αυστροουγγαρία, η Ιταλία και
    η Ρωσία κήρυξαν στις 8 Μαΐου 1886 ειρηνικό αποκλεισμό των ελληνικών ακτών. Μόνη η
    Γαλλία έμεινε έξω. Ο Δηλιγιάννης παραιτήθηκε μέσα σε λίγες μέρες, ο Χαρίλαος
    Τρικούπης επανήλθε και αποστράτευσε, και ο αποκλεισμός ήρθη στις 7 Ιουνίου. Η Ελλάδα
    είχε πληρώσει για έναν πόλεμο που δεν έκανε ποτέ.
body:
  en: |
    On 18 September 1885, 6 September Old Style, a coup in Plovdiv proclaimed the union
    of Eastern Rumelia with the Principality of Bulgaria, undoing the partition the
    Congress of Berlin had imposed seven years earlier. Deligiannis, prime minister
    since the spring after defeating Trikoupis at the polls, protested the breach of the
    treaty, ordered mobilisation and demanded territorial compensation from the Porte.
    The Ottoman Empire and Bulgaria then settled the matter between themselves: the
    Tophane agreement of 5 April 1886 made the Prince of Bulgaria governor-general of
    Eastern Rumelia, and as far as the Powers were concerned the question was closed.

    Greece stayed mobilised. On 24 January 1886 the six Powers presented a collective
    note warning that a Greek naval attack on the Ottoman Empire would not be permitted.
    On 26 April, 14 April Old Style, all of them except France presented a second,
    demanding that the Greek army be put on a peace footing with the least possible
    delay and allowing a week for assurances. The Greek replies were judged
    unsatisfactory. On 7 May the ministers of Britain, Germany, Austria-Hungary and
    Italy left Athens, and on 8 May notice of a blockade was given. It covered the east
    coast of Greece and the Gulf of Corinth and applied to Greek ships only; London
    described it as a pacific blockade, with no state of war. France took what Lord
    Rosebery called independent but parallel action.

    The blockade brought the government down. Deligiannis resigned within the week,
    citing it; after a short interval Trikoupis took office on 21 May, 9 May Old Style,
    and decreed disarmament on 25 May. Even so there was fighting on the Thessalian
    frontier in the second half of May, begun by officers acting without the
    government's sanction. On 7 June Rosebery told the House of Lords that the Duke of
    Edinburgh had reported the blockade of the Greek ports raised and the fleets
    returning to Souda Bay.

    It was the third time in four decades that Great Power navies had coerced Greece,
    after 1850 and 1854, and the first time they did it to stop a war rather than to
    collect a debt or enforce neutrality. Greece gained nothing from eight months under
    arms and carried their cost into the borrowing that ended in the default of 1893.
    Deligiannis was not discredited by it; he won the election of 1890, and he was prime
    minister again when Crete rose in 1897.
  el: |
    Στις 18 Σεπτεμβρίου 1885, 6 Σεπτεμβρίου με το παλαιό ημερολόγιο, πραξικόπημα στη
    Φιλιππούπολη κήρυξε την ένωση της Ανατολικής Ρωμυλίας με το Πριγκιπάτο της
    Βουλγαρίας, ανατρέποντας τη διαίρεση που είχε επιβάλει το Συνέδριο του Βερολίνου
    επτά χρόνια νωρίτερα. Ο Δηλιγιάννης, πρωθυπουργός από την άνοιξη αφότου είχε νικήσει
    τον Τρικούπη στις εκλογές, διαμαρτυρήθηκε για την παραβίαση της συνθήκης, διέταξε
    επιστράτευση και ζήτησε εδαφικά ανταλλάγματα από την Πύλη. Η Οθωμανική Αυτοκρατορία
    και η Βουλγαρία ρύθμισαν έπειτα το ζήτημα μεταξύ τους: η συμφωνία του Τοπχανέ της
    5ης Απριλίου 1886 έκανε τον ηγεμόνα της Βουλγαρίας γενικό διοικητή της Ανατολικής
    Ρωμυλίας, και για τις Δυνάμεις το ζήτημα είχε κλείσει.

    Η Ελλάδα έμεινε επιστρατευμένη. Στις 24 Ιανουαρίου 1886 οι έξι Δυνάμεις επέδωσαν
    συλλογική διακοίνωση που προειδοποιούσε ότι ελληνική ναυτική επίθεση κατά της
    Οθωμανικής Αυτοκρατορίας δεν θα επιτρεπόταν. Στις 26 Απριλίου, 14 Απριλίου με το
    παλαιό ημερολόγιο, όλες εκτός από τη Γαλλία επέδωσαν δεύτερη, που ζητούσε να τεθεί ο
    ελληνικός στρατός σε ειρηνική βάση το συντομότερο δυνατόν και έδινε μία εβδομάδα για
    διαβεβαιώσεις. Οι ελληνικές απαντήσεις κρίθηκαν ανεπαρκείς. Στις 7 Μαΐου οι
    πρεσβευτές της Βρετανίας, της Γερμανίας, της Αυστροουγγαρίας και της Ιταλίας έφυγαν
    από την Αθήνα, και στις 8 Μαΐου γνωστοποιήθηκε ο αποκλεισμός. Κάλυπτε την ανατολική
    ακτή της Ελλάδας και τον Κορινθιακό κόλπο και αφορούσε μόνο ελληνικά πλοία. Το
    Λονδίνο τον χαρακτήρισε ειρηνικό αποκλεισμό, χωρίς κατάσταση πολέμου. Η Γαλλία
    ακολούθησε αυτό που ο λόρδος Ρόζμπερι ονόμασε ανεξάρτητη αλλά παράλληλη δράση.

    Ο αποκλεισμός έριξε την κυβέρνηση. Ο Δηλιγιάννης παραιτήθηκε μέσα στην εβδομάδα,
    επικαλούμενος τον αποκλεισμό. Ύστερα από ένα σύντομο διάστημα ο Τρικούπης ανέλαβε
    στις 21 Μαΐου, 9 Μαΐου με το παλαιό ημερολόγιο, και διέταξε αφοπλισμό στις 25 Μαΐου.
    Παρ' όλα αυτά, στο δεύτερο μισό του Μαΐου έγιναν μάχες στη θεσσαλική μεθόριο, που
    τις άρχισαν αξιωματικοί χωρίς την έγκριση της κυβέρνησης. Στις 7 Ιουνίου ο Ρόζμπερι
    ανακοίνωσε στη Βουλή των Λόρδων ότι ο δούκας του Εδιμβούργου είχε αναφέρει πως ο
    αποκλεισμός των ελληνικών λιμανιών είχε αρθεί και οι στόλοι επέστρεφαν στον όρμο της
    Σούδας.

    Ήταν η τρίτη φορά μέσα σε τέσσερις δεκαετίες που στόλοι Μεγάλων Δυνάμεων εξανάγκαζαν
    την Ελλάδα, μετά το 1850 και το 1854, και η πρώτη φορά που το έκαναν για να
    αποτρέψουν πόλεμο και όχι για να εισπράξουν οφειλή ή να επιβάλουν ουδετερότητα. Η
    Ελλάδα δεν κέρδισε τίποτε από οκτώ μήνες επιστράτευσης και μετέφερε το κόστος τους
    στον δανεισμό που κατέληξε στην πτώχευση του 1893. Ο Δηλιγιάννης δεν απαξιώθηκε από
    αυτό: κέρδισε τις εκλογές του 1890, και ήταν ξανά πρωθυπουργός όταν η Κρήτη
    ξεσηκώθηκε το 1897.
