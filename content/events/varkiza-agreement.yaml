id: varkiza-agreement
title:
  en: The Varkiza Agreement
  el: Η Συμφωνία της Βάρκιζας
summary:
  en: >
    A month after the truce that ended the Dekemvriana, EAM and the Plastiras government
    signed at Varkiza on 12 February 1945. ELAS gave up its weapons, surrendering among
    other things 100 artillery pieces and 48,973 rifles and pistols, though large
    quantities were cached in the mountains instead. In return the government guaranteed
    civil liberties, a free press, a non-political conscript army and an amnesty for
    political offences, and promised a plebiscite on the monarchy within the year. The
    amnesty excluded common crimes, a formula under which thousands of former andartes
    were prosecuted while collaborators were largely left alone, and the guarantees were
    not kept.
  el: >
    Έναν μήνα μετά την ανακωχή που τερμάτισε τα Δεκεμβριανά, το ΕΑΜ και η κυβέρνηση
    Πλαστήρα υπέγραψαν στη Βάρκιζα, στις 12 Φεβρουαρίου 1945. Ο ΕΛΑΣ παρέδωσε τον οπλισμό
    του, ανάμεσα σε άλλα 100 πυροβόλα και 48.973 τυφέκια και πιστόλια, αν και μεγάλες
    ποσότητες κρύφτηκαν στα βουνά αντί να παραδοθούν. Σε αντάλλαγμα η κυβέρνηση εγγυήθηκε
    τις πολιτικές ελευθερίες, ελεύθερο τύπο, εθνικό στρατό με κλήρωση και χωρίς πολιτικά
    κριτήρια και αμνηστία για τα πολιτικά αδικήματα, και υποσχέθηκε δημοψήφισμα για το
    πολιτειακό μέσα στον χρόνο. Η αμνηστία εξαιρούσε τα κοινά εγκλήματα, διατύπωση με την
    οποία διώχθηκαν χιλιάδες πρώην αντάρτες ενώ οι δωσίλογοι έμειναν σε μεγάλο βαθμό
    ανενόχλητοι, και οι εγγυήσεις δεν τηρήθηκαν.
body:
  en: |
    The agreement was signed on the Attic coast south-east of Athens by the Foreign
    Minister Ioannis Sofianopoulos for the government and Georgios Siantos, acting general
    secretary of the KKE, for EAM and ELAS, with the British mediating in the background.
    The disarmament was carried out over the following weeks: 100 artillery pieces, 81
    heavy and 138 light mortars, 419 machine guns, 1,412 submachine guns, 713 automatic
    rifles, 48,973 rifles and pistols, 57 anti-tank rifles and 17 radios. It was not the
    whole of ELAS's armoury, and both sides knew it.

    Article IX provided for a plebiscite on the monarchy within the year, to be followed
    by elections for a constituent assembly. The order was reversed in practice: the
    elections came first, on 31 March 1946, and the plebiscite on 1 September. What came
    in between was the White Terror, the persecution, arrest, imprisonment and killing of
    leftists and former andartes by the gendarmerie, by reconstituted right-wing bands and
    by vigilante groups, with tens of thousands prosecuted under the common-crimes
    exception. Whether Varkiza was a settlement broken by the right or a surrender the KKE
    should never have signed is one of the arguments modern Greek politics has not closed.

    Aris Velouchiotis refused it, returned to arms against the instructions of his party,
    was expelled by it, and was killed near Mesounta in Arta on 16 June 1945. The KKE
    abstained from the elections of 31 March 1946, and on the same day an armed band
    attacked the gendarmerie post at Litochoro. Varkiza had disarmed the left without
    protecting it, and the Greek Civil War began fourteen months after it was signed.
  el: |
    Η συμφωνία υπογράφηκε στην αττική ακτή νοτιοανατολικά της Αθήνας από τον υπουργό
    Εξωτερικών Ιωάννη Σοφιανόπουλο για την κυβέρνηση και τον Γεώργιο Σιάντο, προσωρινό
    γραμματέα του ΚΚΕ, για το ΕΑΜ και τον ΕΛΑΣ, με τους Βρετανούς να μεσολαβούν στο
    παρασκήνιο. Ο αφοπλισμός πραγματοποιήθηκε τις επόμενες εβδομάδες: 100 πυροβόλα, 81
    βαρείς και 138 ελαφροί όλμοι, 419 πολυβόλα, 1.412 αυτόματα, 713 αυτόματα τυφέκια,
    48.973 τυφέκια και πιστόλια, 57 αντιαρματικά τυφέκια και 17 ασύρματοι. Δεν ήταν όλο το
    οπλοστάσιο του ΕΛΑΣ, και το ήξεραν και οι δύο πλευρές.

    Το άρθρο IX προέβλεπε δημοψήφισμα για το πολιτειακό μέσα στον χρόνο και, κατόπιν,
    εκλογές για συντακτική συνέλευση. Η σειρά αντιστράφηκε στην πράξη: πρώτα ήρθαν οι
    εκλογές, στις 31 Μαρτίου 1946, και ύστερα το δημοψήφισμα, την 1η Σεπτεμβρίου. Στο
    ενδιάμεσο μεσολάβησε η Λευκή Τρομοκρατία, δηλαδή οι διώξεις, οι συλλήψεις, οι φυλακίσεις
    και οι δολοφονίες αριστερών και πρώην ανταρτών από τη χωροφυλακή, από ανασυγκροτημένες
    παρακρατικές ομάδες και από ένοπλους ιδιώτες, με δεκάδες χιλιάδες διώξεις βάσει της
    εξαίρεσης των κοινών εγκλημάτων. Το αν η Βάρκιζα ήταν συμφωνία που την παραβίασε η
    Δεξιά ή συνθηκολόγηση που το ΚΚΕ δεν έπρεπε ποτέ να υπογράψει είναι από τα επιχειρήματα
    που η ελληνική πολιτική δεν έχει κλείσει.

    Ο Άρης Βελουχιώτης την απέρριψε, ξαναπήρε τα όπλα παρά τις εντολές του κόμματός του,
    διαγράφηκε από αυτό και σκοτώθηκε κοντά στη Μεσούντα Άρτας στις 16 Ιουνίου 1945. Το ΚΚΕ
    απείχε από τις εκλογές της 31ης Μαρτίου 1946, και την ίδια μέρα ένοπλη ομάδα χτύπησε
    τον σταθμό χωροφυλακής στο Λιτόχωρο. Η Βάρκιζα είχε αφοπλίσει την Αριστερά χωρίς να την
    προστατεύσει, και ο Εμφύλιος άρχισε δεκατέσσερις μήνες μετά την υπογραφή της.
