id: royal-counter-coup-1967
title:
  en: The King's Counter-Coup and Flight
  el: Το βασιλικό αντιπραξικόπημα και η φυγή του Κωνσταντίνου Β΄
summary:
  en: >
    On 13 December 1967 Constantine II flew from Athens to Kavala with his family and
    his figurehead prime minister, meaning to raise the northern army against the
    colonels. He broadcast a proclamation from Larissa and parts of the air force and
    the fleet declared for him, but the royalist commanders lost control of their units
    and the attempt had collapsed by midday. The King flew to Rome the next morning and
    did not live in Greece again until 2013. Papadopoulos took the premiership, a
    general was appointed Regent, and the monarchy survived on paper with no monarch in
    the country.
  el: >
    Στις 13 Δεκεμβρίου 1967 ο Κωνσταντίνος Β΄ πέταξε από την Αθήνα στην Καβάλα με την
    οικογένειά του και τον διορισμένο πρωθυπουργό του, με σκοπό να ξεσηκώσει τον στρατό
    της Βόρειας Ελλάδας εναντίον των συνταγματαρχών. Εξέπεμψε διάγγελμα από τον
    ραδιοφωνικό σταθμό της Λάρισας και τμήματα της αεροπορίας και του στόλου τάχθηκαν
    μαζί του, όμως οι βασιλόφρονες διοικητές έχασαν τον έλεγχο των μονάδων τους και ως
    το μεσημέρι το εγχείρημα είχε καταρρεύσει. Το επόμενο πρωί ο βασιλιάς πέταξε στη
    Ρώμη και δεν ξαναέζησε στην Ελλάδα παρά μόνο από το 2013. Ο Παπαδόπουλος πήρε την
    πρωθυπουργία, διορίστηκε αντιβασιλέας ένας στρατηγός, και η μοναρχία επέζησε στα
    χαρτιά χωρίς μονάρχη στη χώρα.
body:
  en: |
    Constantine had sworn in the colonels' government in April and spent the autumn
    looking for a way to undo it. The plan of 13 December was to fly out of Athens,
    reach units in Macedonia and Thrace that were thought loyal, and force the junta to
    give way to a government of his own choosing. He took Queen Anne-Marie, his mother
    Frederica, his children and Prime Minister Konstantinos Kollias with him to Kavala.
    The Larissa broadcast went out; air-force bases and part of the navy came over. Then
    the machinery failed. Junta officers arrested or isolated the senior royalists
    before they could move their troops, and the northern army did not march.

    On 14 December the royal party flew to Rome. Apart from six hours in Greece for his
    mother's funeral in February 1981, Constantine stayed out of the country for
    forty-six years. Papadopoulos became Prime Minister that same day and Lieutenant
    General Georgios Zoitakis was made Regent. The junta's constitution of 1968, voted
    in a referendum on 15 November that year, kept a crowned republic on paper while
    leaving the crown nothing to do.

    The arrangement did not last. Papadopoulos deposed Zoitakis and made himself Regent
    on 21 March 1972, abolished the monarchy by decree on 1 June 1973, and had the
    change ratified in a plebiscite on 29 July 1973 that also made him President. That
    vote was held with no free campaigning and was treated as void after 1974. What the
    failure of December 1967 had really destroyed was the only institution outside the
    army with standing to remove the colonels, and with it most of the case that could
    later be made for bringing the King back.
  el: |
    Ο Κωνσταντίνος είχε ορκίσει τον Απρίλιο την κυβέρνηση των συνταγματαρχών και πέρασε
    το φθινόπωρο αναζητώντας τρόπο να την ανατρέψει. Το σχέδιο της 13ης Δεκεμβρίου ήταν
    να φύγει από την Αθήνα, να φτάσει σε μονάδες της Μακεδονίας και της Θράκης που
    θεωρούνταν πιστές και να αναγκάσει τη χούντα να παραδώσει την εξουσία σε κυβέρνηση
    δικής του επιλογής. Πήρε μαζί του στην Καβάλα τη βασίλισσα Άννα Μαρία, τη μητέρα του
    Φρειδερίκη, τα παιδιά του και τον πρωθυπουργό Κωνσταντίνο Κόλλια. Το διάγγελμα της
    Λάρισας μεταδόθηκε, αεροπορικές βάσεις και μέρος του στόλου τάχθηκαν με το μέρος
    του. Ύστερα ο μηχανισμός δεν δούλεψε. Αξιωματικοί της χούντας συνέλαβαν ή απομόνωσαν
    τους ανώτερους βασιλόφρονες πριν προλάβουν να κινήσουν τις μονάδες τους, και ο
    στρατός του Βορρά δεν ξεκίνησε.

    Στις 14 Δεκεμβρίου η βασιλική οικογένεια πέταξε στη Ρώμη. Εκτός από ένα εξάωρο για
    την κηδεία της μητέρας του τον Φεβρουάριο του 1981, ο Κωνσταντίνος έμεινε έξω από τη
    χώρα σαράντα έξι χρόνια. Την ίδια μέρα ο Παπαδόπουλος έγινε πρωθυπουργός και
    αντιβασιλέας ορίστηκε ο αντιστράτηγος Γεώργιος Ζωιτάκης. Το σύνταγμα της χούντας του
    1968, που ψηφίστηκε σε δημοψήφισμα στις 15 Νοεμβρίου εκείνης της χρονιάς, διατηρούσε
    στα χαρτιά βασιλευομένη δημοκρατία αφήνοντας τον θρόνο χωρίς αρμοδιότητες.

    Η ρύθμιση δεν κράτησε. Ο Παπαδόπουλος καθαίρεσε τον Ζωιτάκη και ανακηρύχθηκε ο ίδιος
    αντιβασιλέας στις 21 Μαρτίου 1972, κατάργησε τη μοναρχία με συντακτική πράξη την 1η
    Ιουνίου 1973 και επικύρωσε τη μεταβολή με το δημοψήφισμα της 29ης Ιουλίου 1973, που
    τον ανέδειξε και πρόεδρο. Η ψηφοφορία έγινε χωρίς ελεύθερη προεκλογική συζήτηση και
    μετά το 1974 θεωρήθηκε άκυρη. Αυτό που κατέστρεψε στην πραγματικότητα η αποτυχία του
    Δεκεμβρίου του 1967 ήταν ο μόνος θεσμός εκτός στρατού που είχε το κύρος να
    απομακρύνει τους συνταγματάρχες, και μαζί του τα περισσότερα επιχειρήματα υπέρ της
    επιστροφής του βασιλιά.
