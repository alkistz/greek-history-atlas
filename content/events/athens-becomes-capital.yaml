id: athens-becomes-capital
title:
  en: Athens Becomes the Capital
  el: Η Αθήνα γίνεται πρωτεύουσα
summary:
  en: >
    The seat of the kingdom moved from Nafplio to Athens, a small and largely ruined town at
    the foot of the Acropolis. The choice was made for the city's ancient name rather than
    its condition, and King Ludwig I of Bavaria, Otto's father, had settled on it before
    Corinth, Patras, Argos and other towns had finished pressing their claims. A royal decree
    of 18/30 September 1834 fixed the move for 1 December, and on that day, 13 December in
    the calendar used here, Otto landed at Piraeus and rode up to the city. Athens was laid
    out anew as a planned neoclassical capital and grew into the centre the Greek state has
    turned around ever since.
  el: >
    Η έδρα του βασιλείου μεταφέρθηκε από το Ναύπλιο στην Αθήνα, μια μικρή και σε μεγάλο
    βαθμό ερειπωμένη πόλη στους πρόποδες της Ακρόπολης. Η επιλογή έγινε για το αρχαίο όνομα
    της πόλης και όχι για την κατάστασή της, και ο βασιλιάς Λουδοβίκος Α΄ της Βαυαρίας,
    πατέρας του Όθωνα, την είχε αποφασίσει πριν η Κόρινθος, η Πάτρα, το Άργος και άλλες πόλεις
    προλάβουν να ολοκληρώσουν τις διεκδικήσεις τους. Βασιλικό διάταγμα της 18/30 Σεπτεμβρίου
    1834 όρισε τη μεταφορά για την 1η Δεκεμβρίου, και εκείνη τη μέρα, 13 Δεκεμβρίου με το
    ημερολόγιο που χρησιμοποιείται εδώ, ο Όθων αποβιβάστηκε στον Πειραιά και ανέβηκε στην
    πόλη. Η Αθήνα σχεδιάστηκε από την αρχή ως νεοκλασική πρωτεύουσα και εξελίχθηκε στο
    κέντρο γύρω από το οποίο περιστρέφεται από τότε το ελληνικό κράτος.
body:
  en: |
    The kingdom had no settled capital. Kapodistrias had governed first from Aegina and
    then from Nafplio, and Otto landed at Nafplio in February 1833 and ruled from there
    through his regency. Several towns put themselves forward as the permanent seat, among
    them Corinth, Patras, Lamia, Argos and Syros. Athens had little to recommend it except
    its name. It had changed hands more than once during the revolution, its Ottoman
    garrison had left the Acropolis only in the spring of 1833, and estimates of its
    population at the time range from four or five thousand to about twelve thousand. Otto's
    father, King Ludwig I of Bavaria, an admirer of classical Greece, had already decided in
    its favour.

    The architects Stamatios Kleanthis and Eduard Schaubert had drawn up a plan for a new
    city; it was judged too expensive and simplified by Leo von Klenze. A royal decree of 18
    September 1834 Old Style (30 September) approved Klenze's revision and fixed the transfer
    of the royal seat for 1 December. On that day, 13 December 1834 New Style, Otto and the
    authorities of the state landed at Piraeus, then almost deserted, and rode up to the
    city. A service of thanksgiving was held at the church of Saint George in the Theseion,
    and that night the houses and the Acropolis were lit with fires. The king lived at first
    in the former house of Kontostavlos, which the state had bought.

    The new city was built around the plan, much modified as it went. Aiolou, Athinas and
    Ermou were among the first streets to be opened. Work on the royal palace began in
    1836 to designs by Friedrich von Gärtner, and the University, named after Otto, was
    founded in 1837. Ministries, schools, a cathedral and the houses of a new official class
    followed, most of them in the neoclassical style that the Bavarian court had brought
    with it.

    The move did more than relocate a court. It tied the new state's image of itself to
    classical antiquity rather than to the Byzantine and Ottoman past most of its people
    knew, and it put the capital outside the Peloponnese, where the revolution's notables
    had their power. Athens became the administrative and educational centre of the country
    and the largest city in the kingdom; the decision of 1834 is where that concentration
    began.
  el: |
    Το βασίλειο δεν είχε μόνιμη πρωτεύουσα. Ο Καποδίστριας είχε κυβερνήσει πρώτα από την
    Αίγινα και έπειτα από το Ναύπλιο, και ο Όθων αποβιβάστηκε στο Ναύπλιο τον Φεβρουάριο του
    1833 και κυβέρνησε από εκεί μέσω της αντιβασιλείας του. Αρκετές πόλεις διεκδίκησαν τη
    μόνιμη έδρα, ανάμεσά τους η Κόρινθος, η Πάτρα, η Λαμία, το Άργος και η Σύρα. Η Αθήνα δεν
    είχε σχεδόν τίποτε να επιδείξει εκτός από το όνομά της. Είχε αλλάξει χέρια περισσότερες
    από μία φορές στη διάρκεια της Επανάστασης, η οθωμανική φρουρά είχε εγκαταλείψει την
    Ακρόπολη μόλις την άνοιξη του 1833, και οι εκτιμήσεις για τον πληθυσμό της εκείνη την
    εποχή κυμαίνονται από τέσσερις ή πέντε χιλιάδες ως περίπου δώδεκα χιλιάδες. Ο πατέρας του
    Όθωνα, ο βασιλιάς Λουδοβίκος Α΄ της Βαυαρίας, θαυμαστής της κλασικής Ελλάδας, είχε ήδη
    αποφασίσει υπέρ της.

    Οι αρχιτέκτονες Σταμάτιος Κλεάνθης και Εδουάρδος Σάουμπερτ είχαν εκπονήσει σχέδιο για μια
    νέα πόλη· κρίθηκε υπερβολικά δαπανηρό και απλοποιήθηκε από τον Λέο φον Κλέντσε. Βασιλικό
    διάταγμα της 18ης Σεπτεμβρίου 1834 με το παλαιό ημερολόγιο (30 Σεπτεμβρίου) ενέκρινε την
    αναθεώρηση του Κλέντσε και όρισε τη μεταφορά της βασιλικής καθέδρας για την 1η
    Δεκεμβρίου. Εκείνη τη μέρα, 13 Δεκεμβρίου 1834 με το νέο ημερολόγιο, ο Όθων και οι αρχές
    του κράτους αποβιβάστηκαν στον Πειραιά, σχεδόν έρημο τότε, και ανέβηκαν έφιπποι στην
    πόλη. Στον ναό του Αγίου Γεωργίου στο Θησείο ψάλθηκε δοξολογία, και το βράδυ τα σπίτια και
    η Ακρόπολη φωταγωγήθηκαν με φωτιές. Ο βασιλιάς έμεινε αρχικά στην πρώην οικία
    Κοντοσταύλου, που είχε αγοράσει το κράτος.

    Η νέα πόλη χτίστηκε γύρω από το σχέδιο, που τροποποιούνταν συνεχώς στην πορεία. Η Αιόλου,
    η Αθηνάς και η Ερμού ήταν από τους πρώτους δρόμους που άνοιξαν. Η κατασκευή των ανακτόρων
    άρχισε το 1836 σε σχέδια του Φρίντριχ φον Γκέρτνερ, και το Πανεπιστήμιο, που πήρε το
    όνομα του Όθωνα, ιδρύθηκε το 1837. Ακολούθησαν υπουργεία, σχολεία, μητροπολιτικός ναός
    και τα σπίτια μιας νέας τάξης αξιωματούχων, τα περισσότερα στο νεοκλασικό ύφος που είχε
    φέρει μαζί της η βαυαρική αυλή.

    Η μεταφορά δεν ήταν απλώς μετακίνηση μιας αυλής. Έδεσε την εικόνα που είχε το νέο κράτος
    για τον εαυτό του με την κλασική αρχαιότητα και όχι με το βυζαντινό και οθωμανικό
    παρελθόν που γνώριζαν οι περισσότεροι κάτοικοί του, και τοποθέτησε την πρωτεύουσα έξω
    από την Πελοπόννησο, όπου είχαν την ισχύ τους οι πρόκριτοι της Επανάστασης. Η Αθήνα έγινε
    το διοικητικό και εκπαιδευτικό κέντρο της χώρας και η μεγαλύτερη πόλη του βασιλείου· η
    απόφαση του 1834 είναι η αφετηρία αυτής της συγκέντρωσης.
