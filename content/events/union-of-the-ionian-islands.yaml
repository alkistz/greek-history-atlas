id: union-of-the-ionian-islands
title:
  en: The Union of the Ionian Islands
  el: Η Ένωση της Επτανήσου με την Ελλάδα
summary:
  en: >
    Britain had governed the seven islands as a protectorate since 1815 and had
    suppressed their parliament's repeated votes for union with Greece. In 1864 it gave
    them up, as the price of putting a Danish prince on the Greek throne. Sir Henry
    Storks handed over the Old Fortress at Corfu on 2 June and the Greek flag went up.
    It was the first enlargement of the kingdom, and the only one in modern Greek
    history achieved without fighting and without compensating anyone.
  el: >
    Η Βρετανία διοικούσε τα επτά νησιά ως προτεκτοράτο από το 1815 και είχε καταπνίξει
    τα επανειλημμένα ψηφίσματα της Ιονίου Βουλής υπέρ της ένωσης με την Ελλάδα. Το 1864
    τα παραχώρησε, ως αντίτιμο για την ανάδειξη ενός Δανού πρίγκιπα στον ελληνικό θρόνο.
    Ο σερ Χένρι Στορκς παρέδωσε το Παλαιό Φρούριο της Κέρκυρας στις 2 Ιουνίου και
    υψώθηκε η ελληνική σημαία. Ήταν η πρώτη μεγέθυνση του βασιλείου και η μόνη στη
    νεότερη ελληνική ιστορία που έγινε χωρίς πόλεμο και χωρίς αποζημίωση σε κανέναν.
body:
  en: |
    Corfu, Paxoi, Lefkada, Ithaca, Cephalonia, Zakynthos and Kythira had been the United
    States of the Ionian Islands since the Treaty of Paris of 1815: a nominally
    sovereign state with its own assembly and a British Lord High Commissioner who could
    overrule it. The Radical party, the Rizospastai, had demanded union since the
    risings of 1848 and 1849, and the Ionian Parliament voted for enosis repeatedly from
    1850. Britain annulled the resolutions each time.

    William Gladstone was sent out as Lord High Commissioner Extraordinary in 1858 and
    1859 to find a reform that would settle the question. He recommended reform rather
    than cession, but reported that the islands were strategically dispensable now that
    Britain held Malta. The deposition of Otto in 1862 turned that conclusion into a
    bargaining chip: the islands were offered as the dowry of a prince the Powers could
    agree on, and the Treaty of London was signed on 29 March 1864 by Britain, France,
    Russia and Greece, with Austria and Prussia adhering separately. Britain required
    that the fortifications be slighted and the islands stay neutral in war, conditions
    Greece resented and the Corfiots resented more, since it meant demolishing their
    walls.

    On the morning of 21 May 1864 Old Style, 2 June New Style, Sir Henry Storks handed
    authority at the Old Fortress to the Greek commissioner. Greece commemorates 21 May;
    some English sources give 28 May for the Lord High Commissioner's final
    proclamation, which is a different act. The islands brought roughly 2,300 square
    kilometres and about 230,000 people, and with them an educated Italianate
    professional class that supplied the kingdom with lawyers, musicians, diplomats and
    the Theotokis family of politicians for the next three generations.
  el: |
    Η Κέρκυρα, οι Παξοί, η Λευκάδα, η Ιθάκη, η Κεφαλονιά, η Ζάκυνθος και τα Κύθηρα
    αποτελούσαν από τη Συνθήκη των Παρισίων του 1815 το Ηνωμένο Κράτος των Ιονίων
    Νήσων: κράτος ονομαστικά κυρίαρχο, με δική του Βουλή και έναν Βρετανό Αρμοστή που
    μπορούσε να την ακυρώνει. Οι Ριζοσπάστες ζητούσαν την ένωση από τα κινήματα του 1848
    και 1849, και η Ιόνιος Βουλή ψήφιζε υπέρ της ένωσης επανειλημμένα από το 1850. Η
    Βρετανία ακύρωνε κάθε φορά τα ψηφίσματα.

    Ο Ουίλιαμ Γλάδστων στάλθηκε ως έκτακτος Αρμοστής το 1858 και 1859 για να βρει
    μεταρρύθμιση που θα έκλεινε το ζήτημα. Πρότεινε μεταρρύθμιση αντί για παραχώρηση,
    αλλά ανέφερε ότι τα νησιά ήταν στρατηγικά περιττά τώρα που η Βρετανία κρατούσε τη
    Μάλτα. Η έξωση του Όθωνα το 1862 μετέτρεψε το συμπέρασμα σε διαπραγματευτικό χαρτί:
    τα νησιά προσφέρθηκαν ως προίκα ενός πρίγκιπα που θα δέχονταν όλες οι Δυνάμεις, και
    η Συνθήκη του Λονδίνου υπογράφηκε στις 29 Μαρτίου 1864 από τη Βρετανία, τη Γαλλία,
    τη Ρωσία και την Ελλάδα, με την Αυστρία και την Πρωσία να προσχωρούν χωριστά. Η
    Βρετανία απαίτησε την κατεδάφιση των οχυρώσεων και την ουδετερότητα των νησιών σε
    καιρό πολέμου, όρους που δυσαρέστησαν την Ελλάδα και ακόμη περισσότερο τους
    Κερκυραίους, αφού σήμαιναν το γκρέμισμα των τειχών τους.

    Το πρωί της 21ης Μαΐου 1864 με το παλαιό ημερολόγιο, 2 Ιουνίου με το νέο, ο σερ
    Χένρι Στορκς παρέδωσε την εξουσία στο Παλαιό Φρούριο στον Έλληνα επίτροπο. Η Ελλάδα
    εορτάζει την 21η Μαΐου. Ορισμένες αγγλικές πηγές δίνουν την 28η Μαΐου για την
    τελευταία προκήρυξη του Αρμοστή, που είναι άλλη πράξη. Τα νησιά έφεραν περίπου 2.300
    τετραγωνικά χιλιόμετρα και γύρω στους 230.000 κατοίκους, και μαζί τους ένα μορφωμένο
    ιταλοθρεμμένο αστικό στρώμα που προμήθευσε το βασίλειο με νομικούς, μουσικούς,
    διπλωμάτες και την οικογένεια Θεοτόκη επί τρεις γενιές.
