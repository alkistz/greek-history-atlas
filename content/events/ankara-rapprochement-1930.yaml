id: ankara-rapprochement-1930
title:
  en: The Greek-Turkish rapprochement and the Ankara agreements
  el: Η ελληνοτουρκική προσέγγιση και οι συμφωνίες της Άγκυρας
summary:
  en: >
    Seven years after Lausanne the property claims of the exchanged populations were still
    deadlocked. The Ankara Convention of 10 June 1930 wrote off the abandoned property of
    about 1,100,000 Greeks against that of about 400,000 Turks as of equal value, with
    Greece paying a balance of £425,000 and receiving nothing. In October Venizelos went to
    Ankara, the first Greek prime minister to do so, and signed a treaty of friendship,
    neutrality and arbitration with İsmet İnönü. The refugees regarded the June convention
    as the final renunciation of their property, and their votes left Venizelos.
  el: >
    Επτά χρόνια μετά τη Λωζάνη το ζήτημα των ανταλλάξιμων περιουσιών παρέμενε άλυτο. Η
    Σύμβαση της Άγκυρας της 10ης Ιουνίου 1930 συμψήφισε τις εγκαταλελειμμένες περιουσίες
    περίπου 1.100.000 Ελλήνων με εκείνες περίπου 400.000 Τούρκων ως ισάξιες, με την Ελλάδα
    να καταβάλλει υπόλοιπο 425.000 λιρών και να μην εισπράττει τίποτε. Τον Οκτώβριο ο
    Βενιζέλος πήγε στην Άγκυρα, πρώτος Έλληνας πρωθυπουργός, και υπέγραψε με τον Ισμέτ
    Ινονού σύμφωνο φιλίας, ουδετερότητας και διαιτησίας. Οι πρόσφυγες είδαν τη Σύμβαση του
    Ιουνίου ως οριστική παραίτηση από την περιουσία τους, και οι ψήφοι τους έφυγαν από τον
    Βενιζέλο.
body:
  en: |
    Lausanne had provided for the exchange but not for what the exchanged people had left
    behind. The Mixed Commission set up to value the properties deadlocked; the question was
    twice referred to the Permanent Court of International Justice, which gave advisory
    opinions in 1925 and, on the Greco-Turkish Agreement of 1 December 1926, in 1928. For
    seven years it poisoned relations between the two states, and Greek refugee families
    went on holding title deeds to land in Anatolia they could not reach.

    The Ankara Convention of 10 June 1930 cut the knot by declaring the two masses of
    property equivalent in value and setting them off against each other. Since roughly
    1,100,000 Greeks had left property in Turkey and roughly 400,000 Turks had left property
    in Greece, the equivalence was a legal fiction adopted in order to close the file, and
    it was Greece that paid the balance: £425,000 in all, £150,000 as indemnity for the
    Muslims of Western Thrace who had been exempt from the exchange, £150,000 for the Greeks
    of Istanbul, and £125,000 on pre-1912 properties.

    With the obstacle gone the two governments moved quickly. Venizelos travelled to Ankara
    in late October 1930 and was received by Mustafa Kemal Atatürk. On 30 October the two
    states signed a Treaty of Friendship, Neutrality, Conciliation and Arbitration, a
    convention of commerce, navigation and residence, and a naval protocol; each bound
    itself to neutrality if the other were attacked and to stay out of any political or
    economic combination directed against the other, and the naval protocol required six
    months' notice of new construction with the aim of parity in the Aegean. İnönü returned
    the visit in Athens from 3 to 6 October 1931, Greece sponsored Turkey's admission to the
    League of Nations in 1932, Venizelos nominated Atatürk for the Nobel Peace Prize in
    1934, and an additional protocol signed at Athens on 27 April 1938 deepened the
    agreement further. Popular accounts give the friendship treaty as 25 or 29 October; the
    League of Nations Treaty Series records 30 October 1930, in force from 5 October 1931.

    At home the price was heavy. The refugee organisations attacked the June convention as
    the abandonment of their claims, and the refugee vote, which had been the solid base of
    Venizelism, swung away. It was one of the reasons he lost in 1932 and again
    in 1933. The settlement itself held for the rest of the interwar period and through the
    war.
  el: |
    Η Λωζάνη είχε ρυθμίσει την ανταλλαγή αλλά όχι την τύχη όσων άφησαν πίσω τους οι
    ανταλλαγέντες. Η Μεικτή Επιτροπή που συστάθηκε για να αποτιμήσει τις περιουσίες
    περιήλθε σε αδιέξοδο· το ζήτημα παραπέμφθηκε δύο φορές στο Διαρκές Δικαστήριο Διεθνούς
    Δικαιοσύνης, που γνωμοδότησε το 1925 και, για τη Συμφωνία των Αθηνών της 1ης Δεκεμβρίου
    1926, το 1928. Επί επτά χρόνια δηλητηρίαζε τις σχέσεις των δύο κρατών, ενώ προσφυγικές
    οικογένειες κρατούσαν τίτλους ιδιοκτησίας για γη στην Ανατολία όπου δεν μπορούσαν να
    πατήσουν.

    Η Σύμβαση της Άγκυρας της 10ης Ιουνίου 1930 έκοψε τον κόμπο κηρύσσοντας τις δύο μάζες
    περιουσιών ισάξιες και συμψηφίζοντάς τες. Καθώς περιουσίες στην Τουρκία είχαν αφήσει
    περίπου 1.100.000 Έλληνες και στην Ελλάδα περίπου 400.000 Τούρκοι, η ισοδυναμία ήταν
    νομικό πλάσμα που υιοθετήθηκε για να κλείσει ο φάκελος, και το υπόλοιπο το πλήρωσε η
    Ελλάδα: 425.000 λίρες συνολικά, 150.000 ως αποζημίωση για τους μουσουλμάνους της Δυτικής
    Θράκης που είχαν εξαιρεθεί από την ανταλλαγή, 150.000 για τους Έλληνες της Πόλης και
    125.000 για περιουσίες προ του 1912.

    Μόλις έφυγε το εμπόδιο, οι δύο κυβερνήσεις κινήθηκαν γρήγορα. Ο Βενιζέλος ταξίδεψε στην
    Άγκυρα στα τέλη Οκτωβρίου 1930 και τον δέχθηκε ο Μουσταφά Κεμάλ Ατατούρκ. Στις 30
    Οκτωβρίου υπογράφηκαν Σύμφωνο Φιλίας, Ουδετερότητας, Συνδιαλλαγής και Διαιτησίας,
    σύμβαση εμπορίου, ναυτιλίας και εγκατάστασης, και ναυτικό πρωτόκολλο· κάθε πλευρά
    δεσμευόταν σε ουδετερότητα αν δεχόταν επίθεση η άλλη και στην αποχή από κάθε πολιτικό ή
    οικονομικό συνασπισμό στραμμένο εναντίον της, ενώ το ναυτικό πρωτόκολλο απαιτούσε
    εξάμηνη προειδοποίηση για κάθε νέα ναυπήγηση, με στόχο την ισορροπία στο Αιγαίο. Ο
    Ινονού ανταπέδωσε την επίσκεψη στην Αθήνα από τις 3 ως τις 6 Οκτωβρίου 1931, η Ελλάδα
    υποστήριξε την είσοδο της Τουρκίας στην Κοινωνία των Εθνών το 1932, ο Βενιζέλος πρότεινε
    τον Ατατούρκ για το Νόμπελ Ειρήνης το 1934, και πρόσθετο πρωτόκολλο που υπογράφηκε στην
    Αθήνα στις 27 Απριλίου 1938 εμβάθυνε τη συμφωνία. Δημοφιλείς πηγές δίνουν για το σύμφωνο
    φιλίας τις 25 ή τις 29 Οκτωβρίου· η Σειρά Συνθηκών της Κοινωνίας των Εθνών καταγράφει
    την 30ή Οκτωβρίου 1930, με ισχύ από τις 5 Οκτωβρίου 1931.

    Στο εσωτερικό το τίμημα ήταν βαρύ. Οι προσφυγικές οργανώσεις κατήγγειλαν τη Σύμβαση του
    Ιουνίου ως εγκατάλειψη των αξιώσεών τους, και η προσφυγική ψήφος, που ήταν η σταθερή βάση
    του βενιζελισμού, μετατοπίστηκε. Ήταν ένας από τους λόγους των ηττών του
    1932 και του 1933. Η ίδια η διευθέτηση κράτησε ως το τέλος του Μεσοπολέμου και μέσα από
    τον πόλεμο.
