id: end-of-the-civil-war
title:
  en: "The End of the Civil War: Grammos and Vitsi"
  el: "Το τέλος του Εμφυλίου Πολέμου: Γράμμος και Βίτσι"
summary:
  en: >
    Operation Pyrsos ran from 2 to 30 August 1949 in three phases: diversionary attacks on
    Grammos, the main assault on Vitsi, and the final attack on Grammos. The National Army
    committed some 50,000 troops, over 110 guns and 87 aircraft against 8,000 to 13,000
    fighters holding fixed positions. The surviving Democratic Army units crossed into Albania
    on 28 August, and on 16 October Dimitrios Partsalidis announced by radio that they had not
    laid down their arms but only lowered them. No agreed death toll exists for the war. What
    followed was a state of legal exception, mass displacement and an emigration of the defeated
    that lasted until 1974 and, for some, beyond.
  el: >
    Η επιχείρηση Πυρσός διεξήχθη από τις 2 ως τις 30 Αυγούστου 1949 σε τρεις φάσεις:
    αντιπερισπαστικές επιθέσεις στον Γράμμο, κύρια επίθεση στο Βίτσι και τελική επίθεση στον
    Γράμμο. Ο Εθνικός Στρατός διέθεσε περίπου 50.000 άνδρες, πάνω από 110 πυροβόλα και 87
    αεροσκάφη απέναντι σε 8.000 ως 13.000 μαχητές σε στατικές θέσεις. Τα υπολείμματα του
    Δημοκρατικού Στρατού πέρασαν στην Αλβανία στις 28 Αυγούστου, και στις 16 Οκτωβρίου ο
    Δημήτριος Παρτσαλίδης ανακοίνωσε από το ραδιόφωνο ότι ο ΔΣΕ δεν κατέθεσε τα όπλα αλλά τα
    κατέβασε. Δεν υπάρχει συμφωνημένος απολογισμός νεκρών για τον πόλεμο. Ακολούθησαν ένα
    καθεστώς νομικής εξαίρεσης, μαζική εσωτερική μετακίνηση και η προσφυγιά των ηττημένων, που
    κράτησαν ως το 1974 και, για ορισμένους, και πέρα από αυτό.
body:
  en: |
    Alexandros Papagos took command of the Greek forces in January 1949. Operation Pyrsos,
    meaning Torch, began on 2 August
    in the Grammos range as a feint, shifted to the main assault on the Vitsi massif from 10 to 15
    August under Thrasyvoulos Tsakalotos, and returned to Grammos for the final attack from 25 to
    30 August. Six divisions, more than 110 artillery pieces and 87 aircraft, including Helldiver
    dive-bombers dropping napalm, were used against a Democratic Army that Zachariadis had
    committed to defending fixed lines with 8,000 to 13,000 fighters. Reported losses for the
    operation are 499 dead and 2,788 wounded for the National Army, and 2,104 dead and 1,581
    captured for the Democratic Army.

    The survivors and the Provisional Democratic Government crossed into Albania on 28 August and
    were later moved on to the Soviet Union and the Eastern bloc. Partsalidis, who had replaced
    Vafeiadis at the head of the mountain government in April 1949 after Zachariadis removed him for
    opposing the turn to conventional warfare, broadcast the end of hostilities over Free Greece
    radio on 16 October. The government in exile continued nominally until October 1950.

    The totals for the war are contested and probably unrecoverable. Government figures give about
    16,268 National Army dead and claim 38,839 Democratic Army dead; estimates of all deaths,
    including civilians, reprisals and executions by both sides, are commonly put at 80,000 or more
    and run in some accounts to around 158,000. Executions were carried out by both: the state under
    the emergency laws and the courts martial, the Democratic Army against those it judged
    collaborators and hostages. Around 700,000 people were uprooted inside the country, mostly from
    the northern mountains, many by the army's evacuation of villages to deny the guerrillas their
    base. The KKE recorded 55,881 political refugees who left the country, 23,028 men, 14,956 women
    and 17,596 children.

    Between 1948 and 1949 some 28,000 to 32,000 children were moved from the war zones to Eastern
    bloc countries, 5,132 to Romania, 4,148 to Czechoslovakia, 3,590 to Poland, 2,859 to Hungary and
    672 to Bulgaria. The Right called it paidomazoma, borrowing the name of the Ottoman levy of boys;
    the Left called it evacuation from a war zone and an act of rescue. Athens ran a parallel scheme
    of child cities under Queen Frederica. The two programmes and the two names for them are still
    argued about by the families involved, as is the fate of the Slav Macedonians who fought with
    the Democratic Army and left with it, whose right of return stayed closed long after it was
    opened to refugees who were Greek by descent. What the victory produced domestically was a legal apparatus of exception: Law
    509/1947, the exile islands, and the certificate of healthy social convictions required for a
    job, a passport or a driving licence, which policed Greek citizenship until 1974.
  el: |
    Ο Αλέξανδρος Παπάγος ανέλαβε την αρχιστρατηγία τον Ιανουάριο του 1949. Η επιχείρηση Πυρσός
    άρχισε στις 2
    Αυγούστου στον Γράμμο ως αντιπερισπασμός, μεταφέρθηκε στην κύρια επίθεση κατά του Βιτσίου από
    τις 10 ως τις 15 Αυγούστου υπό τον Θρασύβουλο Τσακαλώτο, και επέστρεψε στον Γράμμο για την
    τελική επίθεση από τις 25 ως τις 30 Αυγούστου. Έξι μεραρχίες, πάνω από 110 πυροβόλα και 87
    αεροσκάφη, ανάμεσά τους βομβαρδιστικά καθέτου εφορμήσεως Helldiver που έριχναν ναπάλμ, στράφηκαν εναντίον ενός
    Δημοκρατικού Στρατού που ο Ζαχαριάδης είχε δεσμεύσει να υπερασπιστεί σταθερές γραμμές με 8.000
    ως 13.000 μαχητές. Οι καταγεγραμμένες απώλειες της επιχείρησης είναι 499 νεκροί και 2.788
    τραυματίες για τον Εθνικό Στρατό, 2.104 νεκροί και 1.581 αιχμάλωτοι για τον ΔΣΕ.

    Οι επιζώντες και η Προσωρινή Δημοκρατική Κυβέρνηση πέρασαν στην Αλβανία στις 28 Αυγούστου και
    προωθήθηκαν αργότερα στη Σοβιετική Ένωση και στις χώρες του ανατολικού μπλοκ. Ο Παρτσαλίδης,
    που είχε αντικαταστήσει τον Βαφειάδη στην ηγεσία της κυβέρνησης του βουνού τον Απρίλιο του 1949,
    αφού ο Ζαχαριάδης τον απομάκρυνε για την αντίθεσή του στη στροφή προς τον τακτικό πόλεμο,
    ανακοίνωσε τον τερματισμό των εχθροπραξιών από τον ραδιοσταθμό Ελεύθερη Ελλάδα στις 16
    Οκτωβρίου. Η εξόριστη κυβέρνηση συνεχίστηκε τυπικά ως τον Οκτώβριο του 1950.

    Τα συνολικά μεγέθη του πολέμου αμφισβητούνται και μάλλον δεν αποκαθίστανται. Κυβερνητικά
    στοιχεία δίνουν περίπου 16.268 νεκρούς του Εθνικού Στρατού και αποδίδουν 38.839 νεκρούς στον
    ΔΣΕ. Οι εκτιμήσεις για το σύνολο των θανάτων, μαζί με αμάχους, αντίποινα και εκτελέσεις και
    από τις δύο πλευρές, τοποθετούνται συνήθως στους 80.000 και άνω και φτάνουν σε ορισμένες
    αφηγήσεις τους 158.000. Εκτελέσεις έγιναν και από τις δύο πλευρές: από το κράτος με τους νόμους
    έκτακτης ανάγκης και τα στρατοδικεία, από τον ΔΣΕ σε βάρος όσων έκρινε συνεργάτες και ομήρων.
    Περίπου 700.000 άνθρωποι ξεριζώθηκαν στο εσωτερικό της χώρας, κυρίως από τα βόρεια βουνά, πολλοί
    με την εκκένωση χωριών από τον στρατό ώστε να στερηθεί ο αντάρτης τη βάση του. Το ΚΚΕ κατέγραψε
    55.881 πολιτικούς πρόσφυγες που έφυγαν από τη χώρα, 23.028 άνδρες, 14.956 γυναίκες και 17.596
    παιδιά.

    Μεταξύ 1948 και 1949 περίπου 28.000 ως 32.000 παιδιά μεταφέρθηκαν από τις εμπόλεμες ζώνες σε
    χώρες του ανατολικού μπλοκ, 5.132 στη Ρουμανία, 4.148 στην Τσεχοσλοβακία, 3.590 στην Πολωνία,
    2.859 στην Ουγγαρία και 672 στη Βουλγαρία. Η Δεξιά το ονόμασε παιδομάζωμα, δανειζόμενη το όνομα
    της οθωμανικής στρατολογίας παιδιών· η Αριστερά το ονόμασε απομάκρυνση από τη ζώνη του πολέμου
    και πράξη διάσωσης. Η Αθήνα λειτούργησε παράλληλα τις παιδουπόλεις υπό τη βασίλισσα Φρειδερίκη. Τα δύο
    προγράμματα και τα δύο ονόματά τους εξακολουθούν να διχάζουν τις οικογένειες που τα έζησαν, όπως
    και η τύχη των Σλαβομακεδόνων που πολέμησαν με τον ΔΣΕ και έφυγαν μαζί του, για τους οποίους το
    δικαίωμα επιστροφής παρέμεινε κλειστό πολύ αφότου άνοιξε για τους πρόσφυγες που ήταν Έλληνες το
    γένος. Στο εσωτερικό η νίκη παρήγαγε ένα καθεστώς νομικής εξαίρεσης: ο Νόμος 509/1947, τα νησιά
    της εξορίας και το πιστοποιητικό κοινωνικών φρονημάτων που απαιτούνταν για μια δουλειά, ένα
    διαβατήριο ή μια άδεια οδήγησης, το οποίο αστυνόμευσε την ελληνική ιδιότητα του πολίτη ως το
    1974.
