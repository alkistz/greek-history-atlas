id: landing-at-smyrna
title:
  en: The Greek landing at Smyrna
  el: Η απόβαση στη Σμύρνη
summary:
  en: >
    About 20,000 Greek soldiers came ashore at Smyrna on 15 May 1919 under Allied naval
    cover, authorised by the Paris Peace Conference nine days earlier and driven through
    by Lloyd George. Firing broke out on the quay within hours: by nightfall 300 to 400
    Turks and around 100 Greeks were dead, and an inter-Allied commission later condemned
    Greek conduct. Mustafa Kemal landed at Samsun four days afterwards, and the Turkish
    national movement dates itself from the Greek landing. Greece held the Smyrna zone
    for three years and four months.
  el: >
    Περίπου 20.000 Έλληνες στρατιώτες αποβιβάστηκαν στη Σμύρνη στις 15 Μαΐου 1919 υπό τη
    ναυτική κάλυψη των Συμμάχων, με εξουσιοδότηση της Συνδιάσκεψης της Ειρήνης εννέα ημέρες
    νωρίτερα και με ωθητή τον Λόιντ Τζορτζ. Πυροβολισμοί ξέσπασαν στην προκυμαία μέσα σε λίγες
    ώρες: ως το βράδυ είχαν σκοτωθεί 300 έως 400 Τούρκοι και περίπου 100 Έλληνες, και
    διασυμμαχική επιτροπή καταδίκασε αργότερα τη συμπεριφορά των ελληνικών δυνάμεων. Ο Μουσταφά
    Κεμάλ αποβιβάστηκε στη Σαμψούντα τέσσερις ημέρες μετά, και το τουρκικό εθνικό κίνημα
    χρονολογεί την αφετηρία του από την ελληνική απόβαση. Η Ελλάδα κράτησε τη ζώνη της Σμύρνης
    τρία χρόνια και τέσσερις μήνες.
body:
  en: |
    The Supreme Council authorised the occupation on 6 May 1919, largely because Lloyd
    George pressed for it and partly to forestall Italy, which had put troops ashore at
    Antalya in late April. American misgivings were recorded and overruled. The zone was
    to be occupied, not annexed: the sovereignty question was left to a later settlement,
    which is how a military occupation with no defined end came to be called a mandate
    in some Greek accounts and an invasion in every Turkish one.

    The landing itself was badly handled. Colonel Nikolaos Zafeiriou's 1st Division came
    ashore in the morning; neither Aristeidis Stergiadis, the incoming High Commissioner,
    nor the senior commanders were present. Firing broke out near the Ottoman barracks on
    the quay, traditionally attributed to the journalist Hasan Tahsin. By the end of the
    day 300 to 400 Turks and about 100 Greeks had been killed, the Ottoman garrison had
    been marched away and some prisoners had been killed on the road. The Bristol
    Commission of inquiry condemned Greek conduct, the colonel commanding was replaced
    and some soldiers were court-martialled.

    Stergiadis arrived on 19 May and governed the zone with a severity that fell on Greek
    and Muslim alike. He built a civil administration, a refugee resettlement programme,
    public-health services and the beginnings of an Ionian University, and he restrained
    anti-Muslim discrimination so consistently that much of the local Greek population
    came to hate him. The zone was extended through 1919 and 1920 by successive
    operations that reached Bursa, Alaşehir and the Sea of Marmara. Each extension made
    the line longer and the Turkish national movement larger.
  el: |
    Το Ανώτατο Συμβούλιο ενέκρινε την κατοχή στις 6 Μαΐου 1919, κυρίως επειδή την πίεσε ο
    Λόιντ Τζορτζ και εν μέρει για να προλάβει την Ιταλία, που είχε αποβιβάσει στρατεύματα στην
    Αττάλεια στα τέλη Απριλίου. Οι αμερικανικές επιφυλάξεις καταγράφηκαν και παρακάμφθηκαν. Η
    ζώνη επρόκειτο να καταληφθεί, όχι να προσαρτηθεί: το ζήτημα της κυριαρχίας αφηνόταν σε
    μεταγενέστερη ρύθμιση, και έτσι μια στρατιωτική κατοχή χωρίς ορισμένο τέλος ονομάστηκε
    εντολή σε ορισμένες ελληνικές αφηγήσεις και εισβολή σε όλες τις τουρκικές.

    Η ίδια η απόβαση έγινε άσχημα. Η 1η Μεραρχία του συνταγματάρχη Νικολάου Ζαφειρίου
    αποβιβάστηκε το πρωί· δεν ήταν παρών ούτε ο Αριστείδης Στεργιάδης, ο επερχόμενος ύπατος
    αρμοστής, ούτε η ανώτερη ηγεσία. Πυροβολισμοί ξέσπασαν κοντά στον οθωμανικό στρατώνα της
    προκυμαίας, και αποδίδονται κατά παράδοση στον δημοσιογράφο Χασάν Ταχσίν. Ως το τέλος της
    ημέρας είχαν σκοτωθεί 300 έως 400 Τούρκοι και περίπου 100 Έλληνες, η οθωμανική φρουρά είχε
    οδηγηθεί αιχμάλωτη και ορισμένοι κρατούμενοι είχαν εκτελεστεί καθ' οδόν. Η διασυμμαχική
    επιτροπή Μπρίστολ καταδίκασε τη συμπεριφορά των ελληνικών δυνάμεων, ο διοικητής
    αντικαταστάθηκε και ορισμένοι στρατιώτες παραπέμφθηκαν σε στρατοδικείο.

    Ο Στεργιάδης έφτασε στις 19 Μαΐου και διοίκησε τη ζώνη με αυστηρότητα που έπεφτε το ίδιο σε
    Έλληνες και σε μουσουλμάνους. Οργάνωσε πολιτική διοίκηση, πρόγραμμα αποκατάστασης προσφύγων,
    υπηρεσίες δημόσιας υγείας και τα θεμέλια Ιωνικού Πανεπιστημίου, και περιόρισε τις διακρίσεις
    σε βάρος των μουσουλμάνων με τέτοια συνέπεια ώστε μεγάλο μέρος του ντόπιου ελληνικού
    πληθυσμού να τον μισήσει. Η ζώνη επεκτάθηκε το 1919 και το 1920 με διαδοχικές επιχειρήσεις
    που έφτασαν στην Προύσα, το Αλάσεχιρ και τη Θάλασσα του Μαρμαρά. Κάθε επέκταση έκανε τη
    γραμμή μακρύτερη και το τουρκικό εθνικό κίνημα μεγαλύτερο.
