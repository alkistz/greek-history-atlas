id: capture-of-ioannina
title:
  en: The capture of Ioannina
  el: Η απελευθέρωση των Ιωαννίνων
summary:
  en: >
    Ioannina was covered by Bizani, a German-designed complex of concrete works,
    searchlights and Krupp guns that had already stopped one Greek attack in December 1912.
    Crown Prince Constantine took over the Epirus command, brought divisions across from
    Macedonia and attacked on 19 February Old Style with about 41,000 men against 35,000
    Ottomans. A feint at the centre and a breakthrough on the west carried the position in
    three days, and Esat Pasha surrendered the city of his own birth on the 21st. It
    secured southern Epirus for Greece; the districts further north were taken away by the
    Great Powers within the year.
  el: >
    Τα Ιωάννινα προστατεύονταν από το Μπιζάνι, ένα οχυρωματικό συγκρότημα γερμανικού
    σχεδιασμού με έργα από σκυρόδεμα, προβολείς και πυροβόλα Κρουπ, που είχε ήδη σταματήσει
    μια ελληνική επίθεση τον Δεκέμβριο του 1912. Ο διάδοχος Κωνσταντίνος ανέλαβε τη διοίκηση
    της Ηπείρου, μετέφερε μεραρχίες από τη Μακεδονία και επιτέθηκε στις 19 Φεβρουαρίου με το
    παλαιό ημερολόγιο, με περίπου 41.000 άνδρες απέναντι σε 35.000 Οθωμανούς. Μια
    αντιπερισπαστική ενέργεια στο κέντρο και διάσπαση στα δυτικά έκριναν τη θέση σε τρεις
    μέρες, και ο Εσάτ πασάς παρέδωσε στις 21 την πόλη όπου είχε γεννηθεί. Η νίκη εξασφάλισε
    στην Ελλάδα τη νότια Ήπειρο. Τις βορειότερες περιοχές τις αφαίρεσαν μέσα στον ίδιο χρόνο
    οι Μεγάλες Δυνάμεις.
body:
  en: |
    The Army of Epirus under Lieutenant General Konstantinos Sapountzakis was the smaller
    half of the Greek war effort, about 10,000 to 13,000 men against a fortress line built
    to hold the southern approaches to the city. It attacked on 14 December 1912 and was
    held off until 22 December, at heavy cost to the defenders but without result. Greece
    refused to sign the armistice of December precisely in order to go on trying.

    Constantine took over in January 1913 and moved divisions from the quiet Macedonian
    front. By the final assault the Greeks had four infantry divisions, a cavalry brigade
    and a cavalry regiment, roughly 41,000 men and 105 guns, against about 35,000 Ottomans
    in four divisions with 162 guns under Esat Pasha and Vehip Pasha. The Greeks had fewer
    guns and attacked anyway. The battle was fought from 19 to 21 February Old Style, 4 to
    6 March New Style: a demonstration against the centre, a real attack on the western
    flank, and a breakthrough that put Greek troops behind the forts. The plan is usually
    attributed to Ioannis Metaxas, then a staff officer with the Crown Prince.

    Esat Pasha surrendered Ioannina on 21 February Old Style, 6 March, the day before King
    George I was shot in Thessaloniki. About 2,800 Ottomans died against 500 Greek dead and
    wounded; the Greeks took roughly 8,600 prisoners, 108 guns, and both Ottoman generals.
    Richard Hall calls Bizani Greece's greatest military achievement of the First Balkan
    War. It ended the Epirus campaign and fixed Greek possession of Ioannina, but the Greek
    advance further north, into the districts Greeks called Northern Epirus, was reversed
    when the Powers assigned them to the new Albanian state.
  el: |
    Η Στρατιά Ηπείρου υπό τον αντιστράτηγο Κωνσταντίνο Σαπουντζάκη ήταν το μικρότερο μισό
    της ελληνικής πολεμικής προσπάθειας, περίπου 10.000 ως 13.000 άνδρες απέναντι σε μια
    οχυρωματική γραμμή φτιαγμένη να κρατά τις νότιες προσβάσεις της πόλης. Επιτέθηκε στις 14
    Δεκεμβρίου 1912 και αναχαιτίστηκε ως τις 22 Δεκεμβρίου, με βαριές απώλειες για τους
    αμυνόμενους αλλά χωρίς αποτέλεσμα. Η Ελλάδα αρνήθηκε να υπογράψει την ανακωχή του
    Δεκεμβρίου ακριβώς για να συνεχίσει να προσπαθεί.

    Ο Κωνσταντίνος ανέλαβε τον Ιανουάριο του 1913 και μετακίνησε μεραρχίες από το ήσυχο
    μακεδονικό μέτωπο. Στην τελική επίθεση οι Έλληνες είχαν τέσσερις μεραρχίες πεζικού, μια
    ταξιαρχία και ένα σύνταγμα ιππικού, περίπου 41.000 άνδρες και 105 πυροβόλα, απέναντι σε
    35.000 Οθωμανούς σε τέσσερις μεραρχίες με 162 πυροβόλα, υπό τον Εσάτ πασά και τον Βεχίπ
    πασά. Είχαν λιγότερα πυροβόλα και επιτέθηκαν έτσι κι αλλιώς. Η μάχη δόθηκε από τις 19 ως
    τις 21 Φεβρουαρίου με το παλαιό ημερολόγιο, 4 ως 6 Μαρτίου με το νέο: παραπλανητική
    ενέργεια στο κέντρο, πραγματική επίθεση στο δυτικό πλευρό και διάσπαση που έφερε τα
    ελληνικά τμήματα πίσω από τα οχυρά. Το σχέδιο αποδίδεται συνήθως στον Ιωάννη Μεταξά,
    τότε επιτελή του διαδόχου.

    Ο Εσάτ πασάς παρέδωσε τα Ιωάννινα στις 21 Φεβρουαρίου με το παλαιό ημερολόγιο, 6 Μαρτίου,
    την παραμονή της δολοφονίας του Γεωργίου Α΄ στη Θεσσαλονίκη. Σκοτώθηκαν περίπου 2.800
    Οθωμανοί έναντι 500 Ελλήνων νεκρών και τραυματιών, ενώ οι Έλληνες πήραν περίπου 8.600
    αιχμαλώτους, 108 πυροβόλα και τους δύο Οθωμανούς στρατηγούς. Ο Ρίτσαρντ Χολ χαρακτηρίζει
    το Μπιζάνι το μεγαλύτερο στρατιωτικό επίτευγμα της Ελλάδας στον Α΄ Βαλκανικό Πόλεμο.
    Έκλεισε την εκστρατεία της Ηπείρου και κατοχύρωσε τα Ιωάννινα, όμως η προέλαση προς
    βορρά, στις περιοχές που οι Έλληνες ονόμαζαν Βόρεια Ήπειρο, ανατράπηκε όταν οι Δυνάμεις
    τις απέδωσαν στο νέο αλβανικό κράτος.
