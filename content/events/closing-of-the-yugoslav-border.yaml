id: closing-of-the-yugoslav-border
title:
  en: Tito Closes the Yugoslav Border
  el: Το κλείσιμο των γιουγκοσλαβικών συνόρων
summary:
  en: >
    The Cominform expelled Yugoslavia on 28 June 1948 and the KKE under Nikos Zachariadis
    sided with Moscow. In July 1949 Tito cut off support to the Greek guerrillas and sealed
    the frontier, disbanding the Democratic Army's camps and hospitals on Yugoslav soil. The
    frontier had been its principal supply line, rear base and escape route from the Vitsi
    and Grammos strongholds. The closure left the insurgents pinned against the Albanian
    border weeks before the government's final offensive. Whether it was the decisive cause
    of the collapse or an accelerant of a defeat already certain is still argued.
  el: >
    Η Κομινφόρμ απέβαλε τη Γιουγκοσλαβία στις 28 Ιουνίου 1948 και το ΚΚΕ υπό τον Νίκο
    Ζαχαριάδη τάχθηκε με τη Μόσχα. Τον Ιούλιο του 1949 ο Τίτο διέκοψε τη στήριξη προς τους
    Έλληνες αντάρτες και σφράγισε τα σύνορα, διαλύοντας τα στρατόπεδα και τα νοσοκομεία του
    Δημοκρατικού Στρατού σε γιουγκοσλαβικό έδαφος. Τα σύνορα αυτά ήταν η κύρια γραμμή
    ανεφοδιασμού, η βάση των μετόπισθεν και η οδός διαφυγής από τα οχυρά του Βιτσίου και του
    Γράμμου. Το κλείσιμο άφησε τους αντάρτες καθηλωμένους στα αλβανικά σύνορα λίγες εβδομάδες
    πριν από την τελική κυβερνητική επίθεση. Το αν υπήρξε η αποφασιστική αιτία της
    κατάρρευσης ή επιταχυντής μιας ήδη βέβαιης ήττας συζητείται ακόμη.
body:
  en: |
    The Tito-Stalin split became public on 28 June 1948, when the Cominform resolution
    expelling Yugoslavia was published in the Prague paper Rudé právo. It put the KKE in an
    impossible position: its rear base lay in a state that Moscow had just declared heretical.
    Zachariadis took the Soviet side, and after that continued Yugoslav support for an
    insurgency run by a party loyal to Moscow was politically untenable in Belgrade.

    The break came in July 1949. Tito's public signal is usually placed at his speech in Pula
    on 10 July, with the physical sealing of the frontier completed later that month; no single
    well-documented closure date exists, which is why this entry carries a month rather than a
    day. Camps, hospitals and supply depots on Yugoslav territory were wound up and the fighters
    who crossed were disarmed and interned.

    The consequences were immediate. The Democratic Army's positions on Vitsi and Grammos had
    depended on a frontier they could cross for ammunition, treatment and rest. What remained was
    the narrower Albanian corridor, and a force by then fighting a conventional positional war
    on Zachariadis's orders, against an opponent with artillery, aircraft and napalm. The
    government's Operation Pyrsos opened three weeks after the border closed.

    The split also broke the Slav Macedonian component of the Democratic Army. NOF units had been
    a substantial part of the force in western Macedonia, fighting on promises about the status of
    the Slav-speaking population that Greek, Yugoslav and Bulgarian communists each read
    differently. Their fate after 1949 is contested between Greek, North Macedonian and Bulgarian
    accounts to this day, including the number who left: a Yugoslav official report of 1951 gives
    28,595 Slav Macedonians who departed Greece during the war, while ethnic Macedonian sources
    claim more than 213,000.
  el: |
    Η ρήξη Τίτο και Στάλιν έγινε δημόσια στις 28 Ιουνίου 1948, όταν η απόφαση της Κομινφόρμ για
    την αποπομπή της Γιουγκοσλαβίας δημοσιεύθηκε στην πραγική εφημερίδα Rudé právo. Έφερε το
    ΚΚΕ σε αδιέξοδο: η βάση των μετόπισθεν βρισκόταν σε κράτος που η Μόσχα μόλις είχε κηρύξει
    αιρετικό. Ο Ζαχαριάδης τάχθηκε με τη σοβιετική πλευρά, και έκτοτε η συνέχιση της
    γιουγκοσλαβικής στήριξης σε έναν αντάρτικο στρατό υπό κόμμα πιστό στη Μόσχα ήταν πολιτικά
    αβάσταχτη για το Βελιγράδι.

    Η τομή ήρθε τον Ιούλιο του 1949. Το δημόσιο σήμα του Τίτο τοποθετείται συνήθως στον λόγο
    του στην Πούλα στις 10 Ιουλίου, με τη φυσική σφράγιση των συνόρων να ολοκληρώνεται
    αργότερα μέσα στον μήνα. Δεν υπάρχει μία τεκμηριωμένη ημερομηνία κλεισίματος, και γι' αυτό
    η καταχώριση κρατά τον μήνα και όχι την ημέρα. Στρατόπεδα, νοσοκομεία και αποθήκες
    ανεφοδιασμού σε γιουγκοσλαβικό έδαφος διαλύθηκαν, και όσοι μαχητές πέρασαν αφοπλίστηκαν
    και κρατήθηκαν.

    Οι συνέπειες ήταν άμεσες. Οι θέσεις του Δημοκρατικού Στρατού στο Βίτσι και στον Γράμμο
    στηρίζονταν σε σύνορα που μπορούσε να περνά για πυρομαχικά, περίθαλψη και ανάπαυση. Έμεινε
    ο στενότερος αλβανικός διάδρομος, και ένας στρατός που πολεμούσε πια κλασικό πόλεμο θέσεων
    κατ' εντολήν Ζαχαριάδη, απέναντι σε αντίπαλο με πυροβολικό, αεροπορία και ναπάλμ. Η
    κυβερνητική επιχείρηση Πυρσός ξεκίνησε τρεις εβδομάδες μετά το κλείσιμο των συνόρων.

    Η ρήξη διέλυσε επίσης τη σλαβομακεδονική συνιστώσα του Δημοκρατικού Στρατού. Τα τμήματα του
    ΝΟΦ αποτελούσαν σημαντικό μέρος της δύναμης στη δυτική Μακεδονία και πολεμούσαν πάνω σε
    υποσχέσεις για το καθεστώς του σλαβόφωνου πληθυσμού τις οποίες Έλληνες, Γιουγκοσλάβοι και
    Βούλγαροι κομμουνιστές διάβαζαν ο καθένας αλλιώς. Η τύχη τους μετά το 1949 παραμένει
    αντικείμενο διαμάχης ανάμεσα σε ελληνικές, βορειομακεδονικές και βουλγαρικές αφηγήσεις,
    μαζί με τον αριθμό όσων έφυγαν: γιουγκοσλαβική επίσημη έκθεση του 1951 δίνει 28.595
    Σλαβομακεδόνες που εγκατέλειψαν την Ελλάδα στη διάρκεια του πολέμου, ενώ πηγές
    εθνοτικά Μακεδονικής πλευράς κάνουν λόγο για περισσότερους από 213.000.
