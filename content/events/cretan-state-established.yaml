id: cretan-state-established
title:
  en: The Cretan State and the arrival of Prince George
  el: Η ίδρυση της Κρητικής Πολιτείας και η άφιξη του πρίγκιπα Γεωργίου
summary:
  en: >
    The four Protecting Powers detached Crete from Ottoman administration and installed
    Prince George of Greece as High Commissioner of an autonomous state under the nominal
    suzerainty of the Sultan. The last Ottoman soldier had left the island five weeks
    earlier, ending 229 years of Ottoman rule. Crete acquired its own constitution,
    coinage, stamps and gendarmerie, and an international garrison divided into four
    sectors. Cretans took the arrangement as a betrothal to Greece rather than a
    settlement, and spent the next fifteen years trying to complete it.
  el: >
    Οι τέσσερις Προστάτιδες Δυνάμεις απέσπασαν την Κρήτη από την οθωμανική διοίκηση και
    εγκατέστησαν τον πρίγκιπα Γεώργιο ως Ύπατο Αρμοστή ενός αυτόνομου κράτους υπό την
    τυπική επικυριαρχία του σουλτάνου. Ο τελευταίος Οθωμανός στρατιώτης είχε φύγει από το
    νησί πέντε εβδομάδες νωρίτερα, κλείνοντας 229 χρόνια οθωμανικής κυριαρχίας. Η Κρήτη
    απέκτησε δικό της σύνταγμα, νόμισμα, γραμματόσημα και χωροφυλακή, καθώς και διεθνή
    φρουρά χωρισμένη σε τέσσερις τομείς. Για τους Κρητικούς η αυτονομία ήταν αρραβώνας με
    την Ελλάδα, όχι λύση, και τα επόμενα δεκαπέντε χρόνια πέρασαν στην προσπάθεια να
    ολοκληρωθεί.
body:
  en: |
    The massacre at Candia on 6 September 1898, in which some 500 Christian Cretans and
    14 British soldiers and sailors were killed, exhausted the patience of the Powers.
    On 17 October Britain, France, Russia and Italy gave the Porte thirty days to remove
    every Ottoman soldier and official from the island. The last of them embarked on 3/15
    November. On 25 November the four ministers in Athens proposed to King George I that
    his second son take charge of what was left.

    Prince George reached Souda Bay on 9/21 December aboard the Russian flagship Nikolai
    I, was formally handed the island by the French admiral Pottier, and read his
    proclamation from the balcony of the government house in Chania. Sovereignty remained
    the Sultan's on paper and nobody's in practice. Britain garrisoned Candia, France
    Chania, Russia Rethymno and Italy Lasithi; the Cretan Assembly adopted a constitution
    in April 1899; the new state minted money and issued stamps in its own name.

    The arrangement was designed to be provisional and was treated as such. Eleftherios
    Venizelos, Councillor of Justice in the Prince's first cabinet, was dismissed in March
    1901 after breaking with him over how to pursue union, and four years later took to
    the mountains at Therisos. Great Power troops did not leave until July 1909, and the
    question of who owned Crete was not answered until 1913. Sources date the Cretan State
    either from the Ottoman evacuation or from the Prince's landing; the landing is the
    day Crete commemorates.
  el: |
    Η σφαγή του Ηρακλείου στις 6 Σεπτεμβρίου 1898, με περίπου 500 νεκρούς χριστιανούς
    Κρητικούς και 14 Βρετανούς στρατιώτες και ναύτες, εξάντλησε την υπομονή των Δυνάμεων.
    Στις 17 Οκτωβρίου η Βρετανία, η Γαλλία, η Ρωσία και η Ιταλία έδωσαν στην Υψηλή Πύλη
    προθεσμία τριάντα ημερών για να αποσύρει κάθε Οθωμανό στρατιώτη και αξιωματούχο από το
    νησί. Ο τελευταίος επιβιβάστηκε στις 3/15 Νοεμβρίου. Στις 25 Νοεμβρίου οι πρεσβευτές
    των τεσσάρων Δυνάμεων στην Αθήνα πρότειναν στον Γεώργιο Α΄ να αναλάβει ο δευτερότοκος
    γιος του ό,τι είχε απομείνει.

    Ο πρίγκιπας Γεώργιος έφτασε στον όρμο της Σούδας στις 9/21 Δεκεμβρίου με τη ρωσική
    ναυαρχίδα Νικόλαος Α΄, παρέλαβε τυπικά το νησί από τον Γάλλο ναύαρχο Ποτιέ και διάβασε
    το διάγγελμά του από το μπαλκόνι του κυβερνείου στα Χανιά. Η κυριαρχία ανήκε στα χαρτιά
    στον σουλτάνο και στην πράξη σε κανέναν. Η Βρετανία ανέλαβε τον τομέα του Ηρακλείου, η
    Γαλλία των Χανίων, η Ρωσία του Ρεθύμνου και η Ιταλία του Λασιθίου. Η Συνέλευση των
    Κρητών ψήφισε σύνταγμα τον Απρίλιο του 1899 και η Πολιτεία έκοψε δικό της νόμισμα.

    Η ρύθμιση σχεδιάστηκε ως προσωρινή και ως τέτοια αντιμετωπίστηκε. Ο Ελευθέριος
    Βενιζέλος, σύμβουλος Δικαιοσύνης στο πρώτο κρητικό υπουργείο, παύθηκε τον Μάρτιο του
    1901 μετά τη ρήξη του με τον πρίγκιπα για την τακτική απέναντι στο ζήτημα της Ένωσης
    και τέσσερα χρόνια αργότερα ανέβηκε στο Θέρισο. Τα στρατεύματα των Δυνάμεων έφυγαν
    μόλις τον Ιούλιο του 1909 και το ερώτημα σε ποιον ανήκε η Κρήτη απαντήθηκε το 1913. Οι
    πηγές χρονολογούν την Κρητική Πολιτεία άλλοτε από την οθωμανική αποχώρηση και άλλοτε
    από την άφιξη του πρίγκιπα. Η Κρήτη γιορτάζει την άφιξη.
