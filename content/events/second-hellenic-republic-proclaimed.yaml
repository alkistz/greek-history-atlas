id: second-hellenic-republic-proclaimed
title:
  en: The Second Hellenic Republic proclaimed
  el: Η ανακήρυξη της Β΄ Ελληνικής Δημοκρατίας
summary:
  en: >
    On 25 March 1924, a date chosen because it was Independence Day, the Fourth National
    Assembly deposed the House of Glücksburg and proclaimed a republic. A plebiscite on
    13 April confirmed it by 758,472 votes to 325,322. Admiral Pavlos Kountouriotis, regent
    since December 1923, became the first President. The Republic lasted eleven and a half
    years and never settled the quarrel between royalists and Venizelists that had produced it.
  el: >
    Στις 25 Μαρτίου 1924, ημερομηνία που επελέγη επειδή ήταν η επέτειος της Επανάστασης, η
    Δ΄ Εθνοσυνέλευση κήρυξε έκπτωτη τη δυναστεία των Γλύξμπουργκ και ανακήρυξε αβασίλευτη
    δημοκρατία. Το δημοψήφισμα της 13ης Απριλίου την επικύρωσε με 758.472 ψήφους έναντι
    325.322. Πρώτος Πρόεδρος έγινε ο ναύαρχος Παύλος Κουντουριώτης, αντιβασιλέας ήδη από τον
    Δεκέμβριο του 1923. Η Β΄ Δημοκρατία κράτησε έντεκα χρόνια και δεν έλυσε ποτέ τη διαμάχη
    του Εθνικού Διχασμού από την οποία είχε γεννηθεί.
body:
  en: |
    The Assembly that voted the change had been elected on 16 December 1923, after a
    royalist coup under Leonardopoulos and Gargalidis had failed and the revolutionary
    officers of 1922 still held the army. King George II left the country on 19 December
    1923 on what was officially leave of absence, and Kountouriotis governed as regent from
    23 December. Alexandros Papanastasiou, a sociologist and the most convinced republican
    in Greek politics, took office as prime minister on 12 March 1924 for the express
    purpose of carrying the proclamation through. Thirteen days later the Assembly voted the
    resolution.

    Venizelos, who had returned briefly as prime minister in January and February, opposed
    the move as premature. He wanted the question settled by the country rather than by an
    assembly elected on other grounds, and he thought a republic proclaimed by one side over
    the other would inherit the schism instead of ending it. He withdrew from politics, and
    the split between republicans of conviction and Venizelist gradualists ran through the
    next decade.

    The new state governed for three years without a constitution of its own. A draft of
    1925 was overtaken by the Pangalos dictatorship; the definitive republican constitution
    was voted on 2 June 1927 and came into force the following day, with a President elected
    by parliament and a revived Senate first elected on 21 April 1929. Between 1924 and 1935
    Greece had roughly two dozen governments, three presidents and repeated interventions by
    the army. The Republic was abolished on 10 October 1935 and the abolition confirmed by
    the plebiscite of 3 November.
  el: |
    Η Εθνοσυνέλευση που ψήφισε τη μεταβολή είχε εκλεγεί στις 16 Δεκεμβρίου 1923, αφού είχε
    αποτύχει το βασιλόφρον κίνημα Λεοναρδόπουλου και Γαργαλίδη και ενώ ο στρατός παρέμενε στα
    χέρια των κινηματιών του 1922. Ο βασιλιάς Γεώργιος Β΄ εγκατέλειψε τη χώρα στις 19
    Δεκεμβρίου 1923, τυπικά σε άδεια, και ο Κουντουριώτης ανέλαβε αντιβασιλέας στις 23 του
    μήνα. Ο Αλέξανδρος Παπαναστασίου, κοινωνιολόγος και ο πιο συνεπής δημοκρατικός της
    ελληνικής πολιτικής, σχημάτισε κυβέρνηση στις 12 Μαρτίου 1924 ακριβώς για να προχωρήσει
    την ανακήρυξη. Δεκατρείς ημέρες αργότερα το ψήφισμα πέρασε.

    Ο Βενιζέλος, που είχε επανέλθει για λίγες εβδομάδες στην πρωθυπουργία τον Ιανουάριο και
    τον Φεβρουάριο, θεώρησε την κίνηση πρόωρη. Ήθελε το πολιτειακό να λυθεί από τον λαό και
    όχι από μια συνέλευση εκλεγμένη για άλλον λόγο, και πίστευε ότι μια δημοκρατία που θα
    ανακηρυσσόταν από τη μία παράταξη εις βάρος της άλλης θα κληρονομούσε τον Διχασμό αντί να
    τον κλείσει. Αποσύρθηκε από την πολιτική, και η διάκριση ανάμεσα στους δημοκρατικούς εκ
    πεποιθήσεως και στους βενιζελικούς της σταδιακής μετάβασης σημάδεψε την επόμενη δεκαετία.

    Το νέο πολίτευμα λειτούργησε τρία χρόνια χωρίς δικό του σύνταγμα. Το σχέδιο του 1925
    ανατράπηκε από τη δικτατορία Παγκάλου· το οριστικό δημοκρατικό Σύνταγμα ψηφίστηκε στις 2
    Ιουνίου 1927 και ίσχυσε από την επομένη, με Πρόεδρο εκλεγόμενο από τη Βουλή και
    αναβιωμένη Γερουσία, που εκλέχθηκε πρώτη φορά στις 21 Απριλίου 1929. Από το 1924 ως το
    1935 η Ελλάδα γνώρισε περίπου είκοσι πέντε κυβερνήσεις, τρεις Προέδρους και
    επαναλαμβανόμενες επεμβάσεις του στρατού. Η Δημοκρατία καταλύθηκε στις 10 Οκτωβρίου 1935
    και η κατάλυση επικυρώθηκε με το δημοψήφισμα της 3ης Νοεμβρίου.
