id: pangalos-dictatorship
title:
  en: The Pangalos dictatorship
  el: Η δικτατορία Παγκάλου
summary:
  en: >
    General Theodoros Pangalos seized power in Athens on 25 June 1925, dissolved the
    National Assembly, suspended the draft constitution and ruled by decree for fourteen
    months. He invaded Bulgaria, lost the case at the League of Nations, halved the
    banknotes in circulation to force a loan, and had himself elected President in a rigged
    ballot. General Georgios Kondylis removed him without a shot on 22 August 1926 and
    handed the presidency back to Kountouriotis the same day.
  el: >
    Ο στρατηγός Θεόδωρος Πάγκαλος κατέλαβε την εξουσία στην Αθήνα στις 25 Ιουνίου 1925,
    διέλυσε την Εθνοσυνέλευση, ανέστειλε το σχέδιο συντάγματος και κυβέρνησε με διατάγματα
    επί δεκατέσσερις μήνες. Εισέβαλε στη Βουλγαρία, καταδικάστηκε από την Κοινωνία των
    Εθνών, έκοψε στα δύο τα χαρτονομίσματα για να επιβάλει αναγκαστικό δάνειο και εκλέχθηκε
    Πρόεδρος με νοθευμένη ψηφοφορία. Ο στρατηγός Γεώργιος Κονδύλης τον ανέτρεψε αναίμακτα
    στις 22 Αυγούστου 1926 και επανέφερε αυθημερόν τον Κουντουριώτη στην προεδρία.
body:
  en: |
    Pangalos had been one of the officers of the 1922 revolution and had prosecuted the
    Trial of the Six. Warned in June 1925 that the government of Andreas Michalakopoulos
    meant to arrest him, he moved first: on the night of 24 to 25 June loyal units took the
    key points of Athens, and by morning he was in power. In September he dissolved the
    National Assembly. Opposition newspapers were closed, extraordinary courts set up and
    opponents deported. The regime is remembered as much for its moralising decrees, above
    all the 1925 rule fixing how far a woman's hemline might be from the ground, as for the
    real repression that went with them.

    His record abroad and in the treasury was worse. In October 1925 he sent two army corps
    across the Bulgarian frontier after a shooting incident at the Demir Kapou pass, and had
    to withdraw them within a week under order of the League of Nations, with an indemnity
    to pay. The drachma fell, the deficit widened, and in 1926 the government cut banknotes
    physically in half, one half remaining currency and the other becoming a compulsory loan
    to the state. On 4 April 1926 Pangalos had himself elected President of the Republic
    with an official 782,589 votes against 56,126 for Konstantinos Demertzis, who had
    withdrawn before polling day. Nobody treated the figure as genuine.

    The counter-coup came from inside his own creation. Georgios Kondylis commanded the
    Republican Guard that Pangalos had raised as a praetorian force, and on 22 August 1926
    he used it to arrest the dictator without bloodshed and restore Pavlos Kountouriotis to
    the presidency. Kondylis then did what few Greek coup leaders did: he held free
    elections, on 7 November 1926 under proportional representation, which produced the
    ecumenical coalition of Alexandros Zaimis and, in 1927, the republican constitution.
    Pangalos served about two years in prison and lived until 1952.
  el: |
    Ο Πάγκαλος ήταν ένας από τους αξιωματικούς της Επανάστασης του 1922 και είχε ασκήσει τη
    δίωξη στη Δίκη των Έξι. Όταν τον Ιούνιο του 1925 πληροφορήθηκε ότι η κυβέρνηση Ανδρέα
    Μιχαλακόπουλου σχεδίαζε τη σύλληψή του, προέλαβε: τη νύχτα της 24ης προς 25η Ιουνίου
    πιστά τμήματα κατέλαβαν τα νευραλγικά σημεία της Αθήνας και το πρωί ήταν κύριος της
    κατάστασης. Τον Σεπτέμβριο διέλυσε την Εθνοσυνέλευση. Έκλεισε αντιπολιτευόμενες
    εφημερίδες, συνέστησε έκτακτα δικαστήρια και εκτόπισε αντιπάλους. Το καθεστώς έμεινε στη
    μνήμη τόσο για τα ηθικολογικά του διατάγματα, με πρώτο εκείνο του 1925 για το επιτρεπτό
    ύψος της γυναικείας φούστας από το έδαφος, όσο και για την πραγματική καταστολή που τα
    συνόδευε.

    Στην εξωτερική πολιτική και στα οικονομικά τα πράγματα ήταν χειρότερα. Τον Οκτώβριο του
    1925 έστειλε δύο σώματα στρατού πέρα από τα βουλγαρικά σύνορα μετά από επεισόδιο στο
    στενό του Ντεμίρ Καπού και αναγκάστηκε να τα αποσύρει μέσα σε μια εβδομάδα με εντολή της
    Κοινωνίας των Εθνών, πληρώνοντας και αποζημίωση. Η δραχμή υποχώρησε, το έλλειμμα
    διευρύνθηκε, και το 1926 η κυβέρνηση έκοψε κυριολεκτικά στα δύο τα χαρτονομίσματα: το ένα
    μισό παρέμενε νόμισμα, το άλλο μετατρεπόταν σε αναγκαστικό δάνειο προς το κράτος. Στις 4
    Απριλίου 1926 ο Πάγκαλος εκλέχθηκε Πρόεδρος της Δημοκρατίας με επίσημο αποτέλεσμα 782.589
    ψήφους έναντι 56.126 του Κωνσταντίνου Δεμερτζή, ο οποίος είχε αποσυρθεί πριν από την
    ψηφοφορία. Κανείς δεν πήρε στα σοβαρά τον αριθμό.

    Η ανατροπή ήρθε από το ίδιο του το δημιούργημα. Ο Γεώργιος Κονδύλης διοικούσε το Τάγμα
    Δημοκρατικής Φρουράς που είχε συγκροτήσει ο Πάγκαλος ως προσωπική του δύναμη, και στις 22
    Αυγούστου 1926 το χρησιμοποίησε για να τον συλλάβει χωρίς αιματοχυσία και να επαναφέρει
    τον Παύλο Κουντουριώτη στην προεδρία. Ο Κονδύλης έκανε στη συνέχεια κάτι σπάνιο για
    Έλληνα κινηματία: προκήρυξε ελεύθερες εκλογές στις 7 Νοεμβρίου 1926 με απλή αναλογική,
    από τις οποίες προέκυψε η οικουμενική κυβέρνηση Αλεξάνδρου Ζαΐμη και, το 1927, το
    δημοκρατικό Σύνταγμα. Ο Πάγκαλος έμεινε περίπου δύο χρόνια στη φυλακή και έζησε ως το
    1952.
