id: tempi-disaster-2023
title:
  en: The Tempi Rail Disaster
  el: Το σιδηροδρομικό δυστύχημα στα Τέμπη
summary:
  en: >
    Shortly after eleven at night on 28 February 2023, InterCity 62 from Athens to
    Thessaloniki met a freight train head-on near Evangelismos in the Tempi valley.
    Fifty-seven people were killed and about 180 injured; the passenger train was
    carrying roughly 350, many of them students going back to Thessaloniki after a long
    weekend. The station master at Larissa had routed it onto the southbound track and
    left it there, and the two trains ran towards each other on the same line for about
    twelve minutes. It is the deadliest rail accident in Greek history and it has stayed
    at the centre of Greek politics ever since.
  el: >
    Λίγο μετά τις έντεκα το βράδυ της 28ης Φεβρουαρίου 2023, η Intercity 62 από την
    Αθήνα προς τη Θεσσαλονίκη συγκρούστηκε μετωπικά με εμπορική αμαξοστοιχία κοντά στον
    Ευαγγελισμό, στην κοιλάδα των Τεμπών. Σκοτώθηκαν πενήντα επτά άνθρωποι και
    τραυματίστηκαν περίπου 180. Το επιβατικό τρένο μετέφερε γύρω στους 350 επιβάτες,
    πολλοί από αυτούς φοιτητές που επέστρεφαν στη Θεσσαλονίκη μετά από τριήμερο. Ο
    σταθμάρχης της Λάρισας το είχε δρομολογήσει στην αντίθετη γραμμή και το άφησε εκεί,
    και οι δύο συρμοί έτρεχαν ο ένας προς τον άλλον στην ίδια γραμμή για περίπου δώδεκα
    λεπτά. Είναι το πολυνεκρότερο σιδηροδρομικό δυστύχημα στην ελληνική ιστορία και από
    τότε δεν έχει φύγει από το κέντρο της ελληνικής πολιτικής.
body:
  en: |
    The immediate cause was a single human error, and the reason the error killed
    fifty-seven people was that nothing else in the system was there to catch it. The
    remote signalling and automatic train protection meant to cover the Athens to
    Thessaloniki line had been contracted in 2014 under a European Union funded contract
    and was still not finished nine years later. Staffing at the control posts was far
    below establishment. The first carriages of the passenger train burned, and the
    worst of the deaths were there, among people in their twenties.

    Kostas Karamanlis resigned as Minister of Infrastructure and Transport the next day,
    saying that he had not been able to bring the Greek railways to the standards of the
    twenty-first century. The station master was arrested and charged and senior railway
    officials were prosecuted later. The disaster produced the largest protests since the
    crisis years, with general strikes and demonstrations across the country in March
    2023 and again on the second anniversary in February 2025, when the slogan came from
    the last words of one of the victims on the phone: I have no oxygen.

    Two arguments continue. The first is about the site: the crash area was cleared and
    covered with gravel within days, which the bereaved families and the opposition
    parties say destroyed evidence, and the government denies any concealment. The second
    is about the fireball in the first carriages and whether an unlogged chemical cargo
    caused it. The national rail safety investigation authority published its findings in
    2025, parliamentary inquiries and the constitutional procedure for ministerial
    responsibility have run alongside them, and New Democracy nonetheless won the two
    elections of May and June 2023 comfortably. Both facts belong in the same paragraph:
    a country can hold a government responsible in the street and return it at the ballot
    box in the same year.
  el: |
    Η άμεση αιτία ήταν ένα ανθρώπινο λάθος, και ο λόγος που αυτό το λάθος σκότωσε πενήντα
    επτά ανθρώπους ήταν ότι τίποτε άλλο στο σύστημα δεν υπήρχε για να το πιάσει. Η
    τηλεδιοίκηση και η αυτόματη προστασία συρμών για τη γραμμή Αθηνών Θεσσαλονίκης είχαν
    συμβασιοποιηθεί το 2014 με ευρωπαϊκή χρηματοδότηση και εννέα χρόνια αργότερα δεν
    είχαν ολοκληρωθεί. Η στελέχωση των σταθμών ήταν πολύ κάτω από την οργανική. Τα πρώτα
    βαγόνια του επιβατικού τρένου κάηκαν, και εκεί ήταν οι περισσότεροι νεκροί, άνθρωποι
    γύρω στα είκοσι.

    Ο Κώστας Καραμανλής παραιτήθηκε από υπουργός Υποδομών και Μεταφορών την επομένη,
    λέγοντας ότι δεν κατάφερε να φέρει τους ελληνικούς σιδηροδρόμους στα δεδομένα του
    21ου αιώνα. Ο σταθμάρχης συνελήφθη και κατηγορήθηκε, ενώ ανώτερα στελέχη των
    σιδηροδρόμων διώχθηκαν αργότερα. Το δυστύχημα προκάλεσε το μεγαλύτερο κύμα
    κινητοποιήσεων από τα χρόνια της κρίσης, με γενικές απεργίες και διαδηλώσεις σε όλη
    τη χώρα τον Μάρτιο του 2023 και ξανά στη δεύτερη επέτειο, τον Φεβρουάριο του 2025,
    όταν το σύνθημα βγήκε από τα τελευταία λόγια ενός θύματος στο τηλέφωνο: δεν έχω
    οξυγόνο.

    Δύο αντιπαραθέσεις συνεχίζονται. Η πρώτη αφορά τον τόπο: ο χώρος της σύγκρουσης
    μπαζώθηκε μέσα σε λίγες μέρες, πράγμα που οι οικογένειες των θυμάτων και τα κόμματα
    της αντιπολίτευσης θεωρούν καταστροφή αποδεικτικών στοιχείων, ενώ η κυβέρνηση
    αρνείται κάθε συγκάλυψη. Η δεύτερη αφορά την πύρινη σφαίρα στα πρώτα βαγόνια και το
    αν την προκάλεσε αδήλωτο χημικό φορτίο. Η εθνική αρχή διερεύνησης σιδηροδρομικών
    ατυχημάτων δημοσίευσε το πόρισμά της το 2025, εξεταστικές επιτροπές και η διαδικασία
    της ευθύνης υπουργών έτρεξαν παράλληλα, και η Νέα Δημοκρατία κέρδισε παρ' όλα αυτά
    άνετα τις δύο εκλογικές αναμετρήσεις του Μαΐου και του Ιουνίου 2023. Και τα δύο
    ανήκουν στην ίδια παράγραφο: μια χώρα μπορεί να καταλογίζει ευθύνη στον δρόμο και να
    επανεκλέγει την κυβέρνηση στην κάλπη μέσα στην ίδια χρονιά.
