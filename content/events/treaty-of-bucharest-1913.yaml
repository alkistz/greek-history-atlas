id: treaty-of-bucharest-1913
title:
  en: The Treaty of Bucharest
  el: Η Συνθήκη του Βουκουρεστίου
summary:
  en: >
    The settlement of the Second Balkan War divided Ottoman Macedonia between Greece,
    Serbia and Bulgaria. Greece gained Epirus, most of Macedonia including Thessaloniki,
    and the northern Aegean islands. In two campaigns the kingdom had roughly doubled in
    both territory and population, and had absorbed a population that was not
    predominantly Greek speaking.
  el: >
    Η διευθέτηση του Β΄ Βαλκανικού Πολέμου μοίρασε την οθωμανική Μακεδονία ανάμεσα στην
    Ελλάδα, τη Σερβία και τη Βουλγαρία. Η Ελλάδα πήρε την Ήπειρο, το μεγαλύτερο μέρος της
    Μακεδονίας μαζί με τη Θεσσαλονίκη, και τα νησιά του βόρειου Αιγαίου. Σε δύο εκστρατείες το
    βασίλειο είχε περίπου διπλασιαστεί σε έκταση και σε πληθυσμό, και είχε ενσωματώσει
    πληθυσμό που δεν ήταν στην πλειονότητά του ελληνόφωνος.
body:
  en: |
    The First Balkan War had driven the Ottoman Empire out of almost all of Europe by
    the spring of 1913, and the Treaty of London left the allies to divide the spoils.
    Bulgaria, which had done most of the fighting in Thrace, attacked its former allies
    in June to take Macedonia and was beaten within a month.

    At Bucharest in August Greece kept everything its army had reached: Thessaloniki,
    which it had entered hours ahead of the Bulgarians in November 1912, Kavala, and
    the whole of southern Macedonia. Crete, assigned to Greece by the Treaty of London in May and
    settled with the Ottomans at Athens in November, was formally taken over in the
    December, and the eastern Aegean
    islands followed in 1914. The population of the state rose from about 2.7 to 4.8
    million.
  el: |
    Ο Α΄ Βαλκανικός Πόλεμος είχε διώξει την Οθωμανική Αυτοκρατορία από σχεδόν ολόκληρη την
    Ευρώπη ως την άνοιξη του 1913, και η Συνθήκη του Λονδίνου άφησε στους συμμάχους τη διανομή
    των εδαφών. Η Βουλγαρία, που είχε σηκώσει το μεγαλύτερο βάρος των μαχών στη Θράκη,
    επιτέθηκε τον Ιούνιο στους πρώην συμμάχους της για να πάρει τη Μακεδονία και ηττήθηκε μέσα
    σε έναν μήνα.

    Στο Βουκουρέστι, τον Αύγουστο, η Ελλάδα κράτησε ό,τι είχε φτάσει ο στρατός της: τη
    Θεσσαλονίκη, στην οποία είχε μπει λίγες ώρες πριν από τους Βουλγάρους τον Νοέμβριο του
    1912, την Καβάλα και ολόκληρη τη νότια Μακεδονία. Η Κρήτη, που είχε επιδικαστεί στην Ελλάδα με τη Συνθήκη του
    Λονδίνου τον Μάιο και ρυθμίστηκε με τους Οθωμανούς στην Αθήνα τον Νοέμβριο,
    παραλήφθηκε επίσημα τον Δεκέμβριο, και τα
    νησιά του ανατολικού Αιγαίου ακολούθησαν το 1914. Ο πληθυσμός του κράτους ανέβηκε από
    περίπου 2,7 σε 4,8 εκατομμύρια.
