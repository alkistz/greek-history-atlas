    note: >
      Capture on 11 April NS (English Heritage) matches 30 March OS (Greek accounts);
      the murders on 9 April OS fall on Thursday 21 April NS. Ransom and brigand losses
      differ between sources and are given as ranges; en Wikipedia's 4 to 7 April window
      fits neither calendar and was not followed. The place `dilesi` is new.
