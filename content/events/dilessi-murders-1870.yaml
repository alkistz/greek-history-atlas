id: dilessi-murders-1870
title:
  en: The Dilessi murders
  el: Η σφαγή στο Δήλεσι
summary:
  en: >
    On 11 April 1870, 30 March Old Style, a party of British travellers and two
    diplomats returning from Marathon was seized near Pikermi by the band of the
    brothers Takos and Christos Arvanitakis, who demanded a ransom and an amnesty. The
    women were let go and Lord Muncaster was sent to Athens to raise the money, but the
    government refused the amnesty and sent troops after the band. Ten days later, as
    the troops closed in at Dilessi on the coast north of Oropos, the brigands killed
    their four remaining captives. The affair brought a crisis with Britain, did lasting
    damage to Greece's name abroad and helped bring down the Zaimis government.
  el: >
    Στις 30 Μαρτίου 1870 με το παλαιό ημερολόγιο, 11 Απριλίου με το νέο, μια ομάδα
    Βρετανών περιηγητών και δύο διπλωματών που επέστρεφε από τον Μαραθώνα αιχμαλωτίστηκε
    κοντά στο Πικέρμι από τη συμμορία των αδελφών Τάκου και Χρήστου Αρβανιτάκη, που
    ζήτησαν λύτρα και αμνηστία. Οι γυναίκες αφέθηκαν ελεύθερες και ο λόρδος Μάνκαστερ
    στάλθηκε στην Αθήνα για να συγκεντρώσει τα χρήματα, αλλά η κυβέρνηση αρνήθηκε την
    αμνηστία και έστειλε στρατό να καταδιώξει τη συμμορία. Δέκα μέρες αργότερα, καθώς το
    απόσπασμα τους πλησίαζε στο Δήλεσι, στην ακτή βόρεια του Ωρωπού, οι ληστές σκότωσαν
    τους τέσσερις ομήρους που τους απέμεναν. Η υπόθεση προκάλεσε κρίση με τη Βρετανία,
    έβλαψε διαρκώς το όνομα της Ελλάδας στο εξωτερικό και συνέβαλε στην πτώση της
    κυβέρνησης Ζαΐμη.
body:
  en: |
    Brigandage had never been put down in the kingdom; it was protected by the
    frontier, by the thinness of rural policing and by politicians who found armed men
    useful at election time. On Monday 11 April 1870, 30 March Old Style, a party drove
    out from Athens to see the battlefield of Marathon with an escort of gendarmes: Lord
    and Lady Muncaster; Frederick Vyner, aged twenty-three; Edward Herbert, a secretary at the
    British legation; Count Alberto de Boyl, secretary of the Italian legation; and
    Edward Lloyd, an English lawyer living in Athens, with his wife and young daughter.
    On the way back, near Pikermi, the Arvanitakis band overpowered the escort and took
    them into the hills.

    The women and the child were released, and Lord Muncaster was sent to Athens to
    arrange the ransom. The sum is given differently: £25,000 in some English accounts,
    one million drachmas, about £32,000, in others, and 50,000 in Greek ones. The
    harder demand was an amnesty. The government of Thrasyvoulos Zaimis refused it, and
    the Greek minister in London told the Foreign Secretary, Lord Clarendon, that an
    amnesty would violate the Constitution. Troops were sent after the band, which moved
    north by Pentelikon and Parnitha towards Oropos.

    On 21 April, 9 April Old Style and Holy Thursday in the Orthodox calendar, the
    pursuit caught up with the band at Dilessi. The brigands killed Herbert, Vyner,
    Lloyd and de Boyl. Christos Arvanitakis was killed in the fighting and Takos escaped.
    The British minister, Erskine, telegraphed on 27 April that the heads of
    seven dead brigands had been publicly exposed and that five prisoners would be
    executed if convicted; a later Greek account puts the band's losses at twenty dead
    and nine captured, all of whom were executed.

    In Britain the press and Parliament talked of intervention. George Finlay wrote in
    The Times that the authorities had worked with the brigands, and Takos Arvanitakis
    had in fact once been employed by the state to hunt them. The Zaimis government fell
    in July. Vyner's family spent the money raised for his ransom on two churches in
    Yorkshire designed by William Burges, Christ the Consoler near Newby Hall and St
    Mary's at Studley Royal. Athens could no longer pretend that the protection of
    brigands by politicians was a foreign slander, and Greece's standing in Britain
    suffered for years.
  el: |
    Η ληστεία δεν είχε ποτέ εξαλειφθεί στο βασίλειο. Την προστάτευαν τα σύνορα, η
    αραιή αστυνόμευση της υπαίθρου και οι πολιτικοί που έβρισκαν τους ένοπλους χρήσιμους
    στις εκλογές. Τη Δευτέρα 30 Μαρτίου 1870, 11 Απριλίου με το νέο ημερολόγιο, μια
    συντροφιά βγήκε από την Αθήνα για να δει το πεδίο της μάχης του Μαραθώνα με συνοδεία
    χωροφυλάκων: ο λόρδος και η λαίδη Μάνκαστερ, ο εικοσιτριάχρονος Φρέντερικ Βάινερ, ο
    Έντουαρντ Χέρμπερτ, γραμματέας της βρετανικής πρεσβείας, ο κόμης Αλμπέρτο ντε
    Μπόιλ, γραμματέας της ιταλικής πρεσβείας, και ο Έντουαρντ Λόιντ, Άγγλος δικηγόρος
    που ζούσε στην Αθήνα, με τη σύζυγο και τη μικρή κόρη του. Στην επιστροφή, κοντά στο
    Πικέρμι, η συμμορία των Αρβανιτάκηδων εξουδετέρωσε τη συνοδεία και τους πήρε στα
    βουνά.

    Οι γυναίκες και το παιδί απελευθερώθηκαν και ο λόρδος Μάνκαστερ στάλθηκε στην
    Αθήνα για να κανονίσει τα λύτρα. Το ποσό αναφέρεται διαφορετικά: 25.000 λίρες σε
    ορισμένες αγγλικές πηγές, ένα εκατομμύριο δραχμές, περίπου 32.000 λίρες, σε άλλες,
    και 50.000 στις ελληνικές. Το δυσκολότερο αίτημα ήταν η αμνηστία. Η κυβέρνηση του
    Θρασύβουλου Ζαΐμη την αρνήθηκε, και ο Έλληνας πρεσβευτής στο Λονδίνο δήλωσε στον
    υπουργό Εξωτερικών λόρδο Κλάρεντον ότι μια αμνηστία θα παραβίαζε το Σύνταγμα.
    Στάλθηκε στρατός να καταδιώξει τη συμμορία, που κινήθηκε βόρεια μέσα από την Πεντέλη
    και την Πάρνηθα προς τον Ωρωπό.

    Στις 9 Απριλίου με το παλαιό ημερολόγιο, Μεγάλη Πέμπτη, 21 Απριλίου με το νέο, το
    απόσπασμα έφτασε τη συμμορία στο Δήλεσι. Οι ληστές σκότωσαν τον Χέρμπερτ, τον
    Βάινερ, τον Λόιντ και τον ντε Μπόιλ. Ο Χρήστος Αρβανιτάκης σκοτώθηκε στη μάχη και ο
    Τάκος διέφυγε. Ο Βρετανός πρεσβευτής Έρσκιν τηλεγράφησε στις 27 Απριλίου
    ότι τα κεφάλια επτά νεκρών ληστών είχαν εκτεθεί δημόσια και ότι πέντε κρατούμενοι θα
    εκτελούνταν αν καταδικάζονταν. Μεταγενέστερη ελληνική αφήγηση ανεβάζει τις απώλειες
    της συμμορίας σε είκοσι νεκρούς και εννέα αιχμαλώτους, που εκτελέστηκαν όλοι.

    Στη Βρετανία ο Τύπος και η Βουλή μιλούσαν για επέμβαση. Ο Τζορτζ Φίνλεϊ έγραψε στους
    Times ότι οι αρχές είχαν συνεργαστεί με τους ληστές, και πράγματι ο Τάκος
    Αρβανιτάκης είχε κάποτε προσληφθεί από το κράτος για να τους καταδιώκει. Η κυβέρνηση
    Ζαΐμη έπεσε τον Ιούλιο. Η οικογένεια του Βάινερ διέθεσε τα χρήματα που είχαν
    συγκεντρωθεί για τα λύτρα του σε δύο εκκλησίες στο Γιορκσάιρ, έργα του Γουίλιαμ
    Μπέρτζες, τον Χριστό Παρηγορητή κοντά στο Νιούμπι Χολ και την Αγία Μαρία στο Στάντλεϊ
    Ρόγιαλ. Η Αθήνα δεν μπορούσε πια να υποστηρίζει ότι η προστασία των ληστών από
    πολιτικούς ήταν συκοφαντία των ξένων, και η θέση της Ελλάδας στη Βρετανία υπέφερε
    για χρόνια.
