id: italian-occupation-of-the-dodecanese
title:
  en: Italy seizes the Dodecanese
  el: Η ιταλική κατάληψη της Δωδεκανήσου
summary:
  en: >
    Italy occupied the Dodecanese in three weeks as a lever in its war with the Ottoman
    Empire over Libya, having no claim of its own on the islands. The Greek-speaking
    population welcomed the landings as liberation and was disappointed within months. Italy
    undertook at Ouchy to evacuate the islands once Ottoman troops left Libya, a condition
    that was never enforced. The Dodecanese stayed Italian until 1943 and passed to Greece
    only in 1947, the last territory added to the modern Greek state.
  el: >
    Η Ιταλία κατέλαβε τη Δωδεκάνησο μέσα σε τρεις εβδομάδες ως μοχλό πίεσης στον πόλεμό της
    με την Οθωμανική Αυτοκρατορία για τη Λιβύη, χωρίς η ίδια να έχει καμία αξίωση στα νησιά.
    Ο ελληνόφωνος πληθυσμός υποδέχθηκε τις αποβάσεις ως απελευθέρωση και απογοητεύτηκε μέσα
    σε λίγους μήνες. Στο Ουσί η Ιταλία ανέλαβε να εκκενώσει τα νησιά μόλις αποχωρούσαν από
    τη Λιβύη τα οθωμανικά στρατεύματα, όρος που ποτέ δεν εφαρμόστηκε. Η Δωδεκάνησος έμεινε
    ιταλική ως το 1943 και περιήλθε στην Ελλάδα μόλις το 1947, το τελευταίο έδαφος που
    προστέθηκε στο νεοελληνικό κράτος.
body:
  en: |
    The Italo-Turkish War of 1911 and 1912 was fought for Tripolitania and Cyrenaica, but
    the Ottomans would not concede them, so Italy went looking for pressure in the Aegean.
    Astypalaia was taken on 28 April 1912. Troops under Lieutenant General Giovanni Ameglio
    landed at Kalithea Bay on Rhodes at four in the morning on 4 May and the town
    surrendered at ten the next day. The Ottoman garrison withdrew inland and was destroyed
    at Psithos on 15 and 16 May: about 9,000 to 10,400 Italians against some 1,000 Ottoman
    regulars and up to 10,000 local levies, for four Italian dead against 83 Ottoman dead
    and 983 prisoners.

    The rest fell in days. Chalki on 9 May; Kalymnos, Nisyros, Karpathos, Kasos, Tilos and
    Leros on 12 May; Patmos on 13 May; Lipsi on 16 May; Symi on 19 May; Kos on 20 May.
    Kastellorizo, far to the east, was left alone and stayed outside Italian control until
    1921.

    The islands were overwhelmingly Greek and assumed that an Italian occupation was a
    short road to Athens. The Treaty of Ouchy of 18 October 1912 tied Italian withdrawal to
    an Ottoman withdrawal from Libya in terms vague enough to be indefinitely postponed,
    and the First Balkan War began the same week. Greece took the north-eastern Aegean by
    force that winter and kept it; the Dodecanese, taken by somebody else first, took
    another thirty-five years.
  el: |
    Ο ιταλοτουρκικός πόλεμος του 1911 και του 1912 γινόταν για την Τριπολίτιδα και την
    Κυρηναϊκή, αλλά οι Οθωμανοί δεν τις παραχωρούσαν, και έτσι η Ιταλία αναζήτησε πίεση στο
    Αιγαίο. Η Αστυπάλαια καταλήφθηκε στις 28 Απριλίου 1912. Τμήματα υπό τον αντιστράτηγο
    Τζοβάνι Αμέλιο αποβιβάστηκαν στον όρμο της Καλλιθέας της Ρόδου στις τέσσερις το πρωί της
    4ης Μαΐου και η πόλη παραδόθηκε στις δέκα το πρωί της επομένης. Η οθωμανική φρουρά
    υποχώρησε στο εσωτερικό και συντρίφθηκε στον Ψίνθο στις 15 και 16 Μαΐου: περίπου 9.000
    ως 10.400 Ιταλοί απέναντι σε 1.000 Οθωμανούς τακτικούς και ως 10.000 ντόπιους
    ατάκτους, με τέσσερις Ιταλούς νεκρούς έναντι 83 Οθωμανών νεκρών και 983 αιχμαλώτων.

    Τα υπόλοιπα έπεσαν μέσα σε μέρες. Η Χάλκη στις 9 Μαΐου, η Κάλυμνος, η Νίσυρος, η
    Κάρπαθος, η Κάσος, η Τήλος και η Λέρος στις 12, η Πάτμος στις 13, οι Λειψοί στις 16, η
    Σύμη στις 19 και η Κως στις 20 Μαΐου. Το Καστελλόριζο, μακριά προς τα ανατολικά, έμεινε
    έξω από την ιταλική κατοχή ως το 1921.

    Τα νησιά ήταν συντριπτικά ελληνικά και θεώρησαν την ιταλική κατοχή σύντομο δρόμο προς την
    Αθήνα. Η Συνθήκη του Ουσί, στις 18 Οκτωβρίου 1912, συνέδεσε την ιταλική αποχώρηση με την
    οθωμανική αποχώρηση από τη Λιβύη, με διατύπωση αρκετά ασαφή ώστε να αναβάλλεται επ'
    αόριστον, και την ίδια εβδομάδα άρχιζε ο Α΄ Βαλκανικός Πόλεμος. Η Ελλάδα πήρε με τα όπλα
    το βορειοανατολικό Αιγαίο εκείνον τον χειμώνα και το κράτησε. Η Δωδεκάνησος, που είχε
    προλάβει να την πάρει κάποιος άλλος, χρειάστηκε άλλα τριάντα πέντε χρόνια.
period: [1912-04-28, 1912-05-21]
