id: plebiscite-of-1946
title:
  en: The 1946 Plebiscite and the Return of the King
  el: Το δημοψήφισμα της 1ης Σεπτεμβρίου 1946 και η επάνοδος του Γεωργίου Β΄
summary:
  en: >
    Five months after the March election Greeks voted on whether George II should return to
    the throne. The official result was 68.4 per cent for the King against 31.6 per cent, on
    a turnout of 86.6 per cent of 1,921,725 registered voters. George landed at Elefsina on
    27 September 1946 and died six months later, leaving the crown to his brother Paul. The
    Left rejected the vote as taken under paramilitary intimidation; the government and the
    Allied observers presented it as a genuine preference, and the question is still
    politically loaded in Greece. The monarchy restored in 1946 was given wide powers by the
    1952 constitution, which made the Crown a standing actor in Greek politics.
  el: >
    Πέντε μήνες μετά τις εκλογές του Μαρτίου οι Έλληνες κλήθηκαν να αποφασίσουν αν ο
    Γεώργιος Β΄ θα επέστρεφε στον θρόνο. Το επίσημο αποτέλεσμα ήταν 68,4% υπέρ του βασιλιά
    έναντι 31,6%, με συμμετοχή 86,6% επί 1.921.725 εγγεγραμμένων ψηφοφόρων. Ο Γεώργιος
    αποβιβάστηκε στην Ελευσίνα στις 27 Σεπτεμβρίου 1946 και πέθανε έξι μήνες αργότερα,
    αφήνοντας τον θρόνο στον αδελφό του Παύλο. Η Αριστερά απέρριψε τη διαδικασία ως
    διεξαχθείσα υπό παρακρατικό εκφοβισμό, ενώ η κυβέρνηση και οι συμμαχικοί παρατηρητές την
    παρουσίασαν ως γνήσια έκφραση βούλησης· το ερώτημα παραμένει πολιτικά φορτισμένο. Η
    μοναρχία που αποκαταστάθηκε το 1946 απέκτησε με το Σύνταγμα του 1952 ευρείες εξουσίες,
    που έκαναν το Στέμμα μόνιμο παράγοντα της ελληνικής πολιτικής.
body:
  en: |
    The Varkiza agreement of February 1945 had promised a plebiscite on the monarchy in
    1948, after a constituent election. The Tsaldaris government, with British backing,
    brought it forward to 1 September 1946, twenty-two months after the Germans left Athens
    and while the first bands were already in the mountains. The reversal of the order and
    of the timetable was one of the Left's stated grievances and remains the core of the
    argument about the vote's legitimacy.

    The official count gave 68.4 per cent for the King's return. The figure is hard to read
    against the republican majority of the 1924 plebiscite. It has been taken as evidence of
    a real swing toward the Crown among voters who had come through occupation and civil
    conflict and saw the monarchy as the guarantee of order, and equally as the product of
    coercion in a countryside where armed right-wing bands operated with little restraint.
    Historians differ, and no reading of the number is neutral in Greece.

    George II landed at Elefsina on 27 September and resumed a throne he had lost in 1924,
    regained in 1935 and left again in 1941. He died in Athens on 1 April 1947 and was
    succeeded by his brother Paul, who reigned through the rest of the Civil War, the
    accession to NATO, the Cyprus struggle and the Karamanlis years until his death on 6
    March 1964. The constitution adopted in 1952 gave the King command of the armed forces
    and, under Article 31, the appointment and dismissal of ministers. That inheritance
    produced the confrontations of 1963 and 1965 and, through them, the collapse of the
    parliamentary order.
  el: |
    Η Συμφωνία της Βάρκιζας, τον Φεβρουάριο του 1945, είχε υποσχεθεί δημοψήφισμα για το
    πολιτειακό το 1948, ύστερα από εκλογές για συντακτική βουλή. Η κυβέρνηση Τσαλδάρη, με
    βρετανική στήριξη, το έφερε στην 1η Σεπτεμβρίου 1946, είκοσι δύο μήνες μετά την
    αποχώρηση των Γερμανών από την Αθήνα και ενώ οι πρώτες ομάδες βρίσκονταν ήδη στα βουνά.
    Η αντιστροφή της σειράς και του χρονοδιαγράμματος ήταν ένα από τα διακηρυγμένα παράπονα
    της Αριστεράς και παραμένει ο πυρήνας της διαμάχης για τη νομιμότητα της ψηφοφορίας.

    Η επίσημη καταμέτρηση έδωσε 68,4% υπέρ της επανόδου. Το ποσοστό δύσκολα διαβάζεται δίπλα
    στην αβασίλευτη πλειοψηφία του δημοψηφίσματος του 1924. Έχει ερμηνευθεί ως πραγματική
    στροφή προς το Στέμμα ψηφοφόρων που είχαν περάσει Κατοχή και εμφύλια σύγκρουση και
    έβλεπαν τη μοναρχία ως εγγύηση τάξης, αλλά και ως προϊόν καταναγκασμού σε μια ύπαιθρο
    όπου οι ένοπλες δεξιές ομάδες δρούσαν σχεδόν ανεμπόδιστα. Οι ιστορικοί διίστανται, και
    καμία ανάγνωση του αριθμού δεν είναι ουδέτερη στην Ελλάδα.

    Ο Γεώργιος Β΄ αποβιβάστηκε στην Ελευσίνα στις 27 Σεπτεμβρίου και ανέλαβε ξανά έναν θρόνο
    που είχε χάσει το 1924, ανακτήσει το 1935 και εγκαταλείψει το 1941. Πέθανε στην Αθήνα
    την 1η Απριλίου 1947 και τον διαδέχθηκε ο αδελφός του Παύλος, που βασίλεψε στο υπόλοιπο
    του Εμφυλίου, στην ένταξη στο ΝΑΤΟ, στον κυπριακό αγώνα και στην οκταετία Καραμανλή, ως
    τον θάνατό του στις 6 Μαρτίου 1964. Το Σύνταγμα του 1952 έδωσε στον βασιλιά την αρχηγία
    των ενόπλων δυνάμεων και, με το άρθρο 31, τον διορισμό και την παύση των υπουργών. Αυτή
    η κληρονομιά γέννησε τις συγκρούσεις του 1963 και του 1965 και, μέσω αυτών, την
    κατάρρευση της κοινοβουλευτικής τάξης.
