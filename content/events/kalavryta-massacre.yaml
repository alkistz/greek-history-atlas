id: kalavryta-massacre
title:
  en: The Kalavryta massacre
  el: Το Ολοκαύτωμα των Καλαβρύτων
summary:
  en: >
    On the morning of 13 December 1943 the German 117th Jäger Division locked the women
    and children of Kalavryta in the school, took the men and boys from about the age of
    twelve to a hillside above the town, and shot them with machine guns. Accounts of the
    number killed there differ: 438 in one reckoning, 487 in another, with thirteen
    survivors saved by the bodies that fell on them. Across the whole operation 693 to 694
    civilians were killed in 28 villages, monasteries and settlements, and about a
    thousand houses in Kalavryta were burned. It was the largest single reprisal killing
    carried out by German forces in occupied Greece, and no one was ever convicted for it.
  el: >
    Το πρωί της 13ης Δεκεμβρίου 1943 η γερμανική 117η μεραρχία καταδρομών έκλεισε τις
    γυναίκες και τα παιδιά των Καλαβρύτων στο σχολείο, οδήγησε τους άνδρες και τα αγόρια
    από περίπου δώδεκα ετών και πάνω σε πλαγιά πάνω από την πόλη και τους θέρισε με
    πολυβόλα. Οι αριθμοί των νεκρών διαφέρουν: 438 κατά μία καταμέτρηση, 487 κατά άλλη, με
    δεκατρείς επιζώντες που τους έσωσαν τα σώματα που έπεσαν πάνω τους. Σε ολόκληρη την
    επιχείρηση σκοτώθηκαν 693 ως 694 άμαχοι σε 28 χωριά, μοναστήρια και οικισμούς, ενώ
    περίπου χίλια σπίτια των Καλαβρύτων κάηκαν. Ήταν η μεγαλύτερη μεμονωμένη πράξη
    αντιποίνων των γερμανικών δυνάμεων στην κατεχόμενη Ελλάδα και κανείς δεν καταδικάστηκε
    ποτέ γι' αυτήν.
body:
  en: |
    The sequence began on 16 October 1943, when ELAS andartes ambushed a German column
    near Kerpini and captured 81 soldiers. Negotiations over an exchange dragged on for
    weeks. In early December, most accounts date it 5 to 16 December, the 117th Jäger
    Division launched Operation Kalavryta to encircle and destroy the ELAS bands of the
    Aroania mountains. As the Germans closed in the andartes executed their 78 surviving
    prisoners on 7 December. Three days later General Karl von Le Suire signed the order
    to level Mazeika and Kalavryta and shoot the male population.

    The order was carried out on 13 December. The school was set alight with the women and
    children still inside; they broke out through a door and survived. The town clock on
    the church of the Dormition still stands at 14:34, and the hillside where the men were
    shot is preserved as the Place of Sacrifice. The monastery of Agia Lavra, where the
    banner of the 1821 revolution is traditionally said to have been raised, was burned the
    next day, and the monasteries of Mega Spilaio and Omplos were destroyed with their
    monks. The postwar claim of 1,300 executed residents is no longer regarded as accurate.

    No trial followed. Von Le Suire was taken prisoner by the Soviet Union and died in
    captivity in 1954. German prosecutors closed their last investigation into the
    massacre without charges, and Greek civil claims for compensation have been stopped by
    rulings on state immunity. Kalavryta, with Distomo, is the case around which the
    unfinished Greek and German argument over occupation reparations continues to turn.
  el: |
    Η αλυσίδα άρχισε στις 16 Οκτωβρίου 1943, όταν αντάρτες του ΕΛΑΣ ενέδρευσαν γερμανική
    φάλαγγα κοντά στο Κερπινή και αιχμαλώτισαν 81 στρατιώτες. Οι διαπραγματεύσεις για
    ανταλλαγή τραβούσαν εβδομάδες. Στις αρχές Δεκεμβρίου, με τις περισσότερες πηγές να
    τοποθετούν την επιχείρηση από τις 5 ως τις 16 Δεκεμβρίου, η 117η μεραρχία εξαπέλυσε την
    επιχείρηση Καλάβρυτα για να κυκλώσει και να εξοντώσει τις ομάδες του ΕΛΑΣ στα Αροάνια.
    Καθώς οι Γερμανοί έσφιγγαν τον κλοιό, οι αντάρτες εκτέλεσαν στις 7 Δεκεμβρίου τους 78
    αιχμαλώτους που ζούσαν ακόμη. Τρεις μέρες αργότερα ο στρατηγός Καρλ φον Λε Σουίρ
    υπέγραψε τη διαταγή να ισοπεδωθούν τα Μαζέικα και τα Καλάβρυτα και να τουφεκιστεί ο
    ανδρικός πληθυσμός.

    Η διαταγή εκτελέστηκε στις 13 Δεκεμβρίου. Το σχολείο πυρπολήθηκε με τις γυναίκες και τα
    παιδιά μέσα, που βγήκαν σπάζοντας μια πόρτα και σώθηκαν. Το ρολόι του ναού της
    Κοιμήσεως δείχνει ακόμη 14:34, και η πλαγιά όπου έπεσαν οι άνδρες διατηρείται ως Τόπος
    Θυσίας. Η μονή της Αγίας Λαύρας, όπου κατά την παράδοση υψώθηκε το λάβαρο του 1821,
    κάηκε την επομένη, ενώ καταστράφηκαν και οι μονές του Μεγάλου Σπηλαίου και του Ομπλού
    μαζί με τους μοναχούς τους. Ο μεταπολεμικός αριθμός των 1.300 εκτελεσμένων κατοίκων δεν
    θεωρείται πια ακριβής.

    Δίκη δεν έγινε ποτέ. Ο φον Λε Σουίρ αιχμαλωτίστηκε από τη Σοβιετική Ένωση και πέθανε
    στην αιχμαλωσία το 1954. Η γερμανική εισαγγελία έκλεισε την τελευταία της έρευνα για τη
    σφαγή χωρίς κατηγορίες, και οι ελληνικές αστικές αξιώσεις αποζημίωσης έχουν
    προσκρούσει σε αποφάσεις περί ετεροδικίας των κρατών. Τα Καλάβρυτα, μαζί με το Δίστομο,
    είναι η υπόθεση γύρω από την οποία εξακολουθεί να στρέφεται η ανοιχτή ελληνογερμανική
    διαμάχη για τις κατοχικές επανορθώσεις.
