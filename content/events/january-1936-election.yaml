id: january-1936-election
title:
  en: The election of 26 January 1936 and the parliamentary deadlock
  el: Οι εκλογές της 26ης Ιανουαρίου 1936 και το κοινοβουλευτικό αδιέξοδο
summary:
  en: >
    Held under proportional representation after an amnesty had let the Venizelist parties
    back in, the election gave neither bloc a majority. The Liberals and their allies took
    126 seats, the People's Party 72 and the General Popular Radical Union 60. The Communist
    Party, running as the All People's Front, won 15 seats and the balance of power. Ioannis
    Metaxas led a party of seven. A secret Liberal-communist pact leaked, alarmed the army
    and the palace, and produced no government; when the caretaker prime minister died in
    April, the king gave the office to Metaxas.
  el: >
    Διεξήχθησαν με απλή αναλογική, αφού η αμνηστία είχε επιτρέψει την επιστροφή των
    βενιζελικών κομμάτων, και δεν έδωσαν πλειοψηφία σε καμία παράταξη. Οι Φιλελεύθεροι με
    τους συμμάχους τους πήραν 126 έδρες, το Λαϊκό Κόμμα 72 και η Γενική Λαϊκή Ριζοσπαστική
    Ένωση 60. Το ΚΚΕ, με το ψηφοδέλτιο του Παλλαϊκού Μετώπου, κέρδισε 15 έδρες και τον ρόλο
    του ρυθμιστή. Ο Ιωάννης Μεταξάς ηγούνταν κόμματος επτά βουλευτών. Η διαρροή ενός μυστικού
    συμφώνου Φιλελευθέρων και κομμουνιστών αναστάτωσε τον στρατό και το παλάτι χωρίς να
    προκύψει κυβέρνηση· όταν τον Απρίλιο πέθανε ο υπηρεσιακός πρωθυπουργός, ο βασιλιάς έδωσε
    τη θέση στον Μεταξά.
body:
  en: |
    The amnesty George II had insisted on brought the Venizelist parties back to the ballot,
    and the election of 26 January 1936 was fought under proportional representation, which
    guaranteed that no one would reach the 151 seats needed. The Liberal Party and its allies
    took 474,651 votes and 126 seats; the People's Party 281,597 votes and 72; the General
    Popular Radical Union 253,384 votes and 60. The Communist Party, standing as the All
    People's Front, took 73,411 votes, 5.76 per cent, and 15 seats, its best result to that
    date and enough to decide which bloc governed. The Democratic Coalition had 11 seats. The
    Freethinkers' Party of Ioannis Metaxas had 7, on 3.94 per cent of the vote.

    In February the Liberal leader Themistoklis Sofoulis reached a secret agreement with
    Stelios Sklavainas, who led the communist parliamentary group, trading the Front's votes
    for trade-union freedom, the release of political prisoners and repeal of the Idionymon.
    It is usually dated 19 February 1936, though the exact day is not firmly documented. The
    pact leaked. It frightened the army command, the palace and the propertied classes far
    more than fifteen deputies warranted, and it never produced a government. Sofoulis was
    nevertheless elected Speaker on 16 March with communist support.

    The caretaker Konstantinos Demertzis stayed in office through all of it. On 5 March, at
    the insistence of the service chiefs, he made Metaxas Minister of Military Affairs, and
    shortly afterwards deputy prime minister. Demertzis died of a heart attack on 13 April
    1936 and George II appointed Metaxas prime minister the same day. Parliament gave the
    new government a confidence vote on 27 April by 241 to 16, and on 30 April voted to
    adjourn for five months and delegate legislative power to the cabinet. The deputies had
    voted themselves out of the way four months before the dictatorship.

    The men who might have prevented what followed were dying at the same time. Kondylis had
    gone on 1 February, Venizelos died in Paris on 18 March, Tsaldaris on 17 May. Within six
    months the political generation that had governed Greece since 1910 was gone, and the
    country was left with a king restored by a fraudulent plebiscite and a prime minister
    with seven deputies.
  el: |
    Η αμνηστία που είχε επιμείνει να δοθεί ο Γεώργιος Β΄ επανέφερε τα βενιζελικά κόμματα στις
    κάλπες, και οι εκλογές της 26ης Ιανουαρίου 1936 έγιναν με απλή αναλογική, που εξασφάλιζε
    ότι κανείς δεν θα έφτανε τις 151 έδρες. Το Κόμμα των Φιλελευθέρων και οι σύμμαχοί του
    πήραν 474.651 ψήφους και 126 έδρες· το Λαϊκό Κόμμα 281.597 ψήφους και 72· η Γενική Λαϊκή
    Ριζοσπαστική Ένωση 253.384 ψήφους και 60. Το ΚΚΕ, κατερχόμενο ως Παλλαϊκό Μέτωπο, έλαβε
    73.411 ψήφους, 5,76%, και 15 έδρες, το καλύτερο αποτέλεσμά του ως τότε και αρκετό για να
    κρίνει ποια παράταξη θα κυβερνούσε. Ο Δημοκρατικός Συνασπισμός είχε 11 έδρες. Το Κόμμα
    των Ελευθεροφρόνων του Ιωάννη Μεταξά είχε 7, με 3,94% των ψήφων.

    Τον Φεβρουάριο ο αρχηγός των Φιλελευθέρων Θεμιστοκλής Σοφούλης συμφώνησε μυστικά με τον
    Στέλιο Σκλάβαινα, επικεφαλής της κοινοβουλευτικής ομάδας του ΚΚΕ, να ανταλλάξει τις
    ψήφους του Μετώπου με συνδικαλιστικές ελευθερίες, αποφυλάκιση πολιτικών κρατουμένων και
    κατάργηση του Ιδιωνύμου. Το σύμφωνο χρονολογείται συνήθως στις 19 Φεβρουαρίου 1936, αν και
    η ακριβής ημέρα δεν τεκμηριώνεται με βεβαιότητα. Η είδηση διέρρευσε. Τρόμαξε την ηγεσία
    του στρατού, το παλάτι και τους κατέχοντες πολύ περισσότερο απ' όσο δικαιολογούσαν
    δεκαπέντε βουλευτές, και κυβέρνηση δεν προέκυψε ποτέ. Ο Σοφούλης πάντως εκλέχθηκε
    Πρόεδρος της Βουλής στις 16 Μαρτίου με κομμουνιστικές ψήφους.

    Ο υπηρεσιακός Κωνσταντίνος Δεμερτζής παρέμενε σε όλα αυτά στη θέση του. Στις 5 Μαρτίου,
    με επιμονή των αρχηγών των επιτελείων, διόρισε τον Μεταξά υπουργό Στρατιωτικών και λίγο
    αργότερα αντιπρόεδρο της κυβέρνησης. Ο Δεμερτζής πέθανε από καρδιακή προσβολή στις 13
    Απριλίου 1936 και ο Γεώργιος Β΄ διόρισε αυθημερόν πρωθυπουργό τον Μεταξά. Η Βουλή έδωσε
    ψήφο εμπιστοσύνης στη νέα κυβέρνηση στις 27 Απριλίου με 241 έναντι 16, και στις 30
    Απριλίου αποφάσισε να διακόψει τις εργασίες της για πέντε μήνες, μεταβιβάζοντας τη
    νομοθετική εξουσία στο υπουργικό συμβούλιο. Οι βουλευτές είχαν αυτοκαταργηθεί τέσσερις
    μήνες πριν από τη δικτατορία.

    Οι άνθρωποι που ίσως εμπόδιζαν τη συνέχεια πέθαιναν την ίδια εποχή. Ο Κονδύλης έφυγε την
    1η Φεβρουαρίου, ο Βενιζέλος πέθανε στο Παρίσι στις 18 Μαρτίου, ο Τσαλδάρης στις 17 Μαΐου.
    Μέσα σε έξι μήνες η πολιτική γενιά που κυβερνούσε την Ελλάδα από το 1910 είχε χαθεί, και η
    χώρα έμεινε με έναν βασιλιά επαναφερμένο από νοθευμένο δημοψήφισμα και έναν πρωθυπουργό με
    επτά βουλευτές.
