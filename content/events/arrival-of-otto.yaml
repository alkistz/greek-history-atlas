id: arrival-of-otto
title:
  en: King Otto Lands at Nafplio
  el: Η άφιξη του Όθωνα στο Ναύπλιο
summary:
  en: >
    The seventeen-year-old Bavarian prince chosen by the Powers as King of Greece
    arrived at Nafplio aboard a British frigate, with a regency and a loan. The
    monarchy that would rule Greece until 1974 began here.
  el: >
    Ο δεκαεπτάχρονος βαυαρός πρίγκιπας που οι Δυνάμεις είχαν επιλέξει για βασιλιά της Ελλάδας
    έφτασε στο Ναύπλιο με βρετανική φρεγάτα, συνοδευόμενος από αντιβασιλεία και δάνειο. Εδώ
    αρχίζει η μοναρχία που θα κυβερνούσε την Ελλάδα ως το 1974.
body:
  en: |
    Otto sailed from Trieste with the three Bavarian regents who would govern in his
    name, several thousand Bavarian troops, and the first instalment of the loan of
    sixty million francs guaranteed by Britain, France and Russia. He came ashore at
    Nafplio on 6 February 1833 (25 January Old Style) to a crowd that had, for the
    first time in a decade, a government it had not fought over.

    The regency dissolved the irregular bands, built a Bavarian-model army and
    bureaucracy, and moved the capital to Athens in 1834. It governed without a
    constitution, and it took the officers' rising of 1843 to change that.
  el: |
    Ο Όθων απέπλευσε από την Τεργέστη μαζί με τους τρεις βαυαρούς αντιβασιλείς που θα
    κυβερνούσαν στο όνομά του, μερικές χιλιάδες βαυαρούς στρατιώτες και την πρώτη δόση του
    δανείου των εξήντα εκατομμυρίων φράγκων που είχαν εγγυηθεί η Βρετανία, η Γαλλία και η
    Ρωσία. Αποβιβάστηκε στο Ναύπλιο στις 6 Φεβρουαρίου 1833 (25 Ιανουαρίου με το παλαιό
    ημερολόγιο) μπροστά σε πλήθος που για πρώτη φορά μέσα σε μια δεκαετία είχε κυβέρνηση για
    την οποία δεν είχε πολεμήσει.

    Η αντιβασιλεία διέλυσε τα άτακτα σώματα, συγκρότησε στρατό και γραφειοκρατία βαυαρικού
    προτύπου και μετέφερε την πρωτεύουσα στην Αθήνα το 1834. Κυβέρνησε χωρίς σύνταγμα, και
    χρειάστηκε το στρατιωτικό κίνημα των αξιωματικών του 1843 για να αλλάξει αυτό.
period: [1833-02-06, 1833-02-07]
precision: day
