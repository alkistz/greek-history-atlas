id: great-famine
title:
  en: The Great Famine
  el: Ο Μεγάλος Λιμός
summary:
  en: >
    Greece imported about a third of its grain before the war. The Axis took the harvests
    and the transport, the three occupation zones stopped food moving between regions, and
    the British blockade cut off imports, and in the winter of 1941 to 1942 people starved
    in the streets of Athens. Mortality in the capital reached about 300 deaths a day in
    December 1941, and roughly 40,000 died of starvation in Athens and Piraeus alone.
    Estimates for the country as a whole range from about 100,000 for the acute famine to
    some 300,000 excess deaths across the occupation. Relief through the Swedish-run Red
    Cross commission from March 1942 ended mass starvation in the cities, but the famine
    had already destroyed what credibility the collaborationist state had and had driven
    recruitment to EAM.
  el: >
    Η Ελλάδα εισήγε πριν από τον πόλεμο περίπου το ένα τρίτο των σιτηρών της. Ο Άξονας
    πήρε τις σοδειές και τα μεταφορικά μέσα, οι τρεις ζώνες κατοχής σταμάτησαν τη
    διακίνηση τροφίμων μεταξύ των περιοχών και ο βρετανικός αποκλεισμός έκοψε τις
    εισαγωγές: τον χειμώνα του 1941 προς 1942 οι άνθρωποι πέθαιναν από την πείνα στους
    δρόμους της Αθήνας. Η θνησιμότητα στην πρωτεύουσα έφτασε τους 300 θανάτους την ημέρα
    τον Δεκέμβριο του 1941 και περίπου 40.000 άνθρωποι πέθαναν από ασιτία μόνο στην Αθήνα
    και τον Πειραιά. Οι εκτιμήσεις για όλη τη χώρα κυμαίνονται από 100.000 περίπου για την
    οξεία φάση ως 300.000 επιπλέον θανάτους σε όλη την Κατοχή. Η περίθαλψη μέσω της
    σουηδικής αποστολής του Ερυθρού Σταυρού από τον Μάρτιο του 1942 τερμάτισε τον μαζικό
    θάνατο στις πόλεις, αλλά ο λιμός είχε ήδη καταστρέψει ό,τι κύρος είχε το δωσιλογικό
    κράτος και είχε στείλει κόσμο στο ΕΑΜ.
body:
  en: |
    The worst months were November 1941 to March 1942 in Athens and Piraeus. Carts
    collected the dead from the pavements each morning and the bodies went into mass
    graves without coffins; families concealed deaths to keep the ration cards. Red Cross
    observers put the daily toll in the capital as high as 400. The islands suffered
    proportionally worse still, because they depended entirely on grain brought by sea and
    the sea traffic had stopped: Syros, Mykonos and Chios were among the worst hit.

    Total mortality is contested and the sources differ by a factor of three. The figure
    most often used is about 300,000 excess deaths in Greece from famine and malnutrition
    across the whole occupation, with around 150,000 of them in 1941; the demographic
    study by Violetta Hionidou, which is the standard scholarly reference, puts famine
    deaths at roughly 250,000; lower figures of around 100,000 for the acute famine period
    also appear in the literature. What is not in dispute is the shortfall of some 300,000
    against the population Greece should have had by the end of the war.

    Relief came slowly and against British resistance. The first ship through was the
    Turkish SS Kurtuluş, which made five voyages from Istanbul to Piraeus with about 6,700
    tons before sinking near Marmara Island in January 1942. Greek diaspora lobbying, the
    government-in-exile and international pressure forced Britain to lift the blockade for
    relief cargoes in February 1942, and from March the Swedish-run Joint Relief Commission
    of the International Red Cross reorganised the public food supply under safe conduct
    from both sides, with Canadian wheat behind it. Mass starvation deaths in the cities
    ended during 1943. Malnutrition, tuberculosis and hyperinflation did not, and the
    famine had by then done the occupation's politics for it: the relief arm of EAM,
    National Solidarity, recruited where the state had failed to feed anyone.
  el: |
    Οι χειρότεροι μήνες ήταν από τον Νοέμβριο του 1941 ως τον Μάρτιο του 1942 στην Αθήνα
    και τον Πειραιά. Κάρα μάζευαν κάθε πρωί τους νεκρούς από τα πεζοδρόμια και τα σώματα
    πήγαιναν σε ομαδικούς τάφους χωρίς φέρετρα, ενώ οι οικογένειες έκρυβαν τους θανάτους
    για να κρατήσουν τα δελτία τροφίμων. Παρατηρητές του Ερυθρού Σταυρού ανέβαζαν την
    ημερήσια θνησιμότητα της πρωτεύουσας ως τους 400. Τα νησιά υπέφεραν αναλογικά ακόμη
    χειρότερα, γιατί εξαρτιόνταν ολοκληρωτικά από το στάρι που ερχόταν με τα καράβια και η
    θαλάσσια κίνηση είχε σταματήσει: η Σύρος, η Μύκονος και η Χίος ήταν από τις πιο
    χτυπημένες.

    Ο συνολικός αριθμός των νεκρών αμφισβητείται και οι πηγές διαφέρουν κατά τρεις φορές.
    Ο συνηθέστερος αριθμός είναι περίπου 300.000 επιπλέον θάνατοι από πείνα και υποσιτισμό
    σε όλη την Κατοχή, από τους οποίους περί τους 150.000 μέσα στο 1941. Η δημογραφική
    μελέτη της Βιολέττας Χιονίδου, που αποτελεί τη στάνταρ επιστημονική αναφορά, υπολογίζει
    τους θανάτους από τον λιμό σε περίπου 250.000, ενώ στη βιβλιογραφία εμφανίζονται και
    χαμηλότεροι αριθμοί, γύρω στις 100.000 για την οξεία φάση. Αδιαμφισβήτητο είναι το
    δημογραφικό έλλειμμα των 300.000 περίπου ανθρώπων σε σχέση με τον πληθυσμό που θα
    έπρεπε να έχει η Ελλάδα στο τέλος του πολέμου.

    Η βοήθεια ήρθε αργά και ενάντια στη βρετανική αντίσταση. Το πρώτο πλοίο που πέρασε
    ήταν το τουρκικό Κουρτουλούς, που έκανε πέντε ταξίδια από την Κωνσταντινούπολη στον
    Πειραιά με περίπου 6.700 τόνους πριν βυθιστεί κοντά στο Μαρμαρά τον Ιανουάριο του 1942.
    Η πίεση της ομογένειας, της εξόριστης κυβέρνησης και της διεθνούς κοινής γνώμης
    ανάγκασε τη Βρετανία να άρει τον αποκλεισμό για τα φορτία περίθαλψης τον Φεβρουάριο του
    1942, και από τον Μάρτιο η σουηδικής διεύθυνσης Μικτή Επιτροπή Περιθάλψεως του Διεθνούς
    Ερυθρού Σταυρού αναδιοργάνωσε τον επισιτισμό με ελεύθερο πλου εγγυημένο και από τις δύο
    πλευρές, με καναδικό σιτάρι πίσω της. Οι μαζικοί θάνατοι από ασιτία στις πόλεις
    σταμάτησαν μέσα στο 1943. Ο υποσιτισμός, η φυματίωση και ο υπερπληθωρισμός δεν
    σταμάτησαν, και ο λιμός είχε ως τότε κάνει τη δουλειά της πολιτικής: η Εθνική
    Αλληλεγγύη του ΕΑΜ στρατολογούσε εκεί όπου το κράτος δεν είχε ταΐσει κανέναν.
