id: cretan-revolt-1866-1869
title:
  en: The Cretan Revolt and the Explosion at Arkadi
  el: Η Κρητική Επανάσταση του 1866 και το Ολοκαύτωμα του Αρκαδίου
summary:
  en: >
    A Cretan assembly proclaimed union with Greece in August 1866 and the island rose.
    In November an Ottoman force besieged the monastery of Arkadi, where some 964 people
    had taken refuge; when the walls were breached the powder magazine was fired and
    about 846 of them died. Arkadi made Crete a European cause, drawing money,
    volunteers and a famous letter from Victor Hugo. The revolt won Crete a charter of
    local self-government in 1868 and no change of sovereignty at all.
  el: >
    Τον Αύγουστο του 1866 κρητική συνέλευση κήρυξε την ένωση με την Ελλάδα και το νησί
    ξεσηκώθηκε. Τον Νοέμβριο οθωμανική δύναμη πολιόρκησε τη μονή Αρκαδίου, όπου είχαν
    καταφύγει περίπου 964 άνθρωποι. Όταν έπεσαν τα τείχη, ανατινάχθηκε η πυριτιδαποθήκη
    και σκοτώθηκαν περί τους 846. Το Αρκάδι έκανε την Κρήτη ευρωπαϊκή υπόθεση,
    προσελκύοντας χρήματα, εθελοντές και μια περίφημη επιστολή του Βίκτωρος Ουγκώ. Η
    επανάσταση κέρδισε για την Κρήτη έναν χάρτη τοπικής αυτοδιοίκησης το 1868 και καμία
    απολύτως αλλαγή κυριαρχίας.
body:
  en: |
    Christian assemblies had been meeting since May 1866 at the monastery of Aghia
    Kyriaki at Boutsounaria to petition the Sultan over taxation and the conduct of the
    local administration. The petition was refused and the general assembly proclaimed
    union with Greece on 21 August 1866. Sources for this date rarely say whether they
    are giving Old Style or New, and the atlas prints it as the sources do rather than
    converting it.

    Ottoman troops under the governor-general Mustafa Naili Pasha reached Arkadi in the
    night of 7 to 8 November. Inside were 964 people: 325 men, of whom 259 were armed,
    and the rest women and children who had come in from the surrounding villages. The
    abbot, Gavriil Marinakis, chaired the revolutionary committee of Rethymno and was
    killed in the fighting, as was the garrison commander Ioannis Dimakopoulos, a Greek
    army officer, who was executed after capture. The assault broke in on 9 November and
    the powder magazine was fired, killing the attackers in the vault and most of those
    sheltering above it. About 846 of the 964 died, 114 were taken and three or four got
    away. Ottoman losses are put at 1,500 and by some accounts as high as 3,000. Cretan
    tradition names Konstantinos Giamboudakis as the man who lit the powder; local
    historiography also proposes Emmanouil Skoulas and others, and the question is
    genuinely open. So is the calendar: Greek, French and English accounts all print 8
    and 9 November, but the Cretan documents were Julian, and a reading of 27 and 28
    October Old Style survives in some Greek local history.

    The dead were burned and their skulls later gathered into the windmill at the
    monastery, where they are still displayed. Victor Hugo wrote an open letter in
    December comparing Arkadi to Messolonghi; Garibaldi lent his name, and philhellene
    committees across Europe and the United States raised funds. Greece sent covert
    help, chiefly through the blockade runner Arkadi, and took in some 45,000 refugees,
    but stopped short of war when the Powers warned it off. Grand Vizier Ali Pasha came
    to the island in October 1867 and imposed the Organic Law of 1868, which gave
    Christians equal representation in the administration and a General Assembly. The
    Conference of Paris in early 1869 backed the Porte and required Greece to stop
    helping the insurgents. Not a metre of territory changed hands.
  el: |
    Από τον Μάιο του 1866 χριστιανικές συνελεύσεις συνέρχονταν στη μονή Αγίας Κυριακής
    στα Μπουτσουνάρια, ζητώντας από τον σουλτάνο ανακούφιση από τη φορολογία και τις
    καταχρήσεις της τοπικής διοίκησης. Το αίτημα απορρίφθηκε και η γενική συνέλευση
    κήρυξε την ένωση με την Ελλάδα στις 21 Αυγούστου 1866. Οι πηγές σπανίως διευκρινίζουν
    αν η ημερομηνία είναι με το παλαιό ή το νέο ημερολόγιο, και ο άτλαντας την παραθέτει
    όπως τη δίνουν, χωρίς να τη μετατρέπει.

    Τα οθωμανικά στρατεύματα υπό τον γενικό διοικητή Μουσταφά Ναϊλή Πασά έφτασαν στο
    Αρκάδι τη νύχτα της 7ης προς 8η Νοεμβρίου. Μέσα βρίσκονταν 964 άνθρωποι: 325 άνδρες,
    από τους οποίους 259 ένοπλοι, και οι υπόλοιποι γυναικόπαιδα από τα γύρω χωριά. Ο
    ηγούμενος Γαβριήλ Μαρινάκης προήδρευε της επαναστατικής επιτροπής Ρεθύμνου και
    σκοτώθηκε στη μάχη, όπως και ο φρούραρχος Ιωάννης Δημακόπουλος, αξιωματικός του
    ελληνικού στρατού, που εκτελέστηκε αφού αιχμαλωτίστηκε. Η έφοδος μπήκε στη μονή στις
    9 Νοεμβρίου και η πυριτιδαποθήκη ανατινάχθηκε, σκοτώνοντας τους επιτιθέμενους μέσα
    στην κρύπτη και τους περισσότερους από όσους είχαν καταφύγει από πάνω. Από τους 964
    χάθηκαν περί τους 846, αιχμαλωτίστηκαν 114 και διέφυγαν τρεις ή τέσσερις. Οι
    οθωμανικές απώλειες υπολογίζονται σε 1.500 και κατά ορισμένες πηγές ως 3.000. Η
    κρητική παράδοση αποδίδει την ανατίναξη στον Κωνσταντίνο Γιαμπουδάκη, ενώ η τοπική
    ιστοριογραφία προτείνει και τον Εμμανουήλ Σκουλά και άλλους. Το ζήτημα παραμένει
    ανοιχτό, όπως και το ημερολογιακό: ελληνικές, γαλλικές και αγγλικές πηγές τυπώνουν
    όλες 8 και 9 Νοεμβρίου, όμως τα κρητικά έγγραφα ήταν ιουλιανά και σε μέρος της
    ελληνικής τοπικής ιστοριογραφίας επιβιώνει η ανάγνωση 27 και 28 Οκτωβρίου.

    Οι νεκροί κάηκαν και τα κρανία τους συγκεντρώθηκαν αργότερα στον ανεμόμυλο της μονής,
    όπου εκτίθενται ακόμη. Ο Βίκτωρ Ουγκώ έγραψε τον Δεκέμβριο ανοιχτή επιστολή
    παραβάλλοντας το Αρκάδι με το Μεσολόγγι, ο Γαριβάλδης έδωσε το όνομά του και
    φιλελληνικές επιτροπές σε όλη την Ευρώπη και την Αμερική μάζεψαν χρήματα. Η Ελλάδα
    έστελνε κρυφά βοήθεια, κυρίως με το ατμόπλοιο Αρκάδιον που έσπαζε τον αποκλεισμό, και
    δέχθηκε περί τους 45.000 πρόσφυγες, αλλά δεν προχώρησε σε πόλεμο όταν οι Δυνάμεις την
    προειδοποίησαν. Ο μεγάλος βεζίρης Αλή Πασάς ήρθε στο νησί τον Οκτώβριο του 1867 και
    επέβαλε τον Οργανικό Νόμο του 1868, που έδινε στους χριστιανούς ισότιμη εκπροσώπηση
    στη διοίκηση και Γενική Συνέλευση. Η Διάσκεψη των Παρισίων στις αρχές του 1869 στήριξε
    την Πύλη και υποχρέωσε την Ελλάδα να σταματήσει να ενισχύει τους επαναστάτες. Ούτε ένα
    μέτρο εδάφους δεν άλλαξε χέρια.
