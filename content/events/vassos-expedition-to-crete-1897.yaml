id: vassos-expedition-to-crete-1897
title:
  en: The Vassos expedition to Crete
  el: Η εκστρατεία του Βάσσου στην Κρήτη
summary:
  en: >
    With Crete in revolt and Christian quarters of Chania burned, the Deligiannis
    government sent Colonel Timoleon Vassos, an aide-de-camp of the king, to the island
    with about 1,500 men. He landed in the bay of Kolymbari, west of Chania, on the
    night of 14 February 1897 and proclaimed the occupation of Crete in the name of the
    King of the Greeks. The six Powers landed their own sailors at Chania the next day,
    kept Vassos away from the towns, announced on 2 March that Crete would be autonomous
    and blockaded it from 21 March. The landing settled nothing on Crete and committed
    Greece to the war it lost that spring.
  el: >
    Με την Κρήτη σε επανάσταση και τις χριστιανικές συνοικίες των Χανίων καμένες, η
    κυβέρνηση Δηλιγιάννη έστειλε στο νησί τον συνταγματάρχη Τιμολέοντα Βάσσο, υπασπιστή
    του βασιλιά, με περίπου 1.500 άνδρες. Αποβιβάστηκε στον όρμο του Κολυμπαριού, δυτικά
    των Χανίων, τη νύχτα της 14ης Φεβρουαρίου 1897 και κήρυξε την κατάληψη της Κρήτης
    στο όνομα του Βασιλέως των Ελλήνων. Οι έξι Δυνάμεις αποβίβασαν την επομένη δικούς
    τους ναύτες στα Χανιά, κράτησαν τον Βάσσο μακριά από τις πόλεις, ανακοίνωσαν στις 2
    Μαρτίου ότι η Κρήτη θα γινόταν αυτόνομη και την απέκλεισαν από τις 21 Μαρτίου. Η
    απόβαση δεν έλυσε τίποτε στην Κρήτη και δέσμευσε την Ελλάδα στον πόλεμο που έχασε
    εκείνη την άνοιξη.
body:
  en: |
    The revolt that had broken out in Crete in 1895, after the Porte had gutted the Pact
    of Halepa in 1889, flared again in January 1897. On 23 and 24 January Christian
    inhabitants of Chania were massacred and their quarters burned, and the rising
    spread across the island from the 25th. In Athens the Ethniki Etairia and the press
    demanded intervention, and the Deligiannis government, which had tried to keep its
    distance from the Cretan revolt, gave way. Prince George was sent with a flotilla of
    torpedo boats, reaching Cretan waters around 12 February with orders to support the
    insurgents and harass Ottoman shipping.

    Timoleon Vassos, a colonel and aide-de-camp of George I, took command of a mixed
    detachment on 29 January Old Style, 10 February New. Four days later it landed in
    the bay of Kolymbari, about 24 kilometres west of Chania, on the night of 14
    February, 2 February Old Style; the Foundation of the Hellenic World gives 3
    February, and the difference is probably the night. Most sources put his force at
    about 1,500 men, with two artillery batteries. He set up at the monastery of Gonia
    and issued a proclamation in the name of the King of the Greeks announcing the
    occupation of the island.

    The Powers moved faster than he did. On 15 February the international squadron put
    450 sailors and marines ashore at Chania. Vassos was ordered to come no closer than
    six kilometres to the town. His men fought an Ottoman force at Livadeia on 19
    February, and on 21 February the squadron shelled the insurgents at Akrotiri, who
    had raised the Greek flag and refused to haul it down. On 2 March the Powers' notes
    announced that Crete would be given an effective autonomous administration and
    called for Greek forces to leave. Greece withdrew its ships but left Vassos ashore,
    and from 21 March a blockade of the island cut him off where he stood. He was
    recalled in April and sent to Thessaly; the last of his troops left Crete in May.

    The expedition was Greece's attempt to create a fait accompli, and it produced the
    opposite. It turned a Cretan rising into a confrontation between Greece and the
    Ottoman Empire, and the Sultan declared war on 17 April. On the island itself the
    outcome had already been fixed by the Powers' decision of 2 March: autonomy under
    international guarantee rather than union, which is what Crete got when the Cretan
    State was set up at the end of 1898.
  el: |
    Η επανάσταση που είχε ξεσπάσει στην Κρήτη το 1895, αφότου η Πύλη είχε ακυρώσει στην
    ουσία της τη Σύμβαση της Χαλέπας το 1889, φούντωσε ξανά τον Ιανουάριο του 1897. Στις
    23 και 24 Ιανουαρίου χριστιανοί κάτοικοι των Χανίων σφαγιάστηκαν και οι συνοικίες
    τους κάηκαν, και από τις 25 η εξέγερση απλώθηκε σε όλο το νησί. Στην Αθήνα η Εθνική
    Εταιρεία και ο Τύπος ζητούσαν επέμβαση, και η κυβέρνηση Δηλιγιάννη, που είχε
    προσπαθήσει να κρατήσει αποστάσεις από την κρητική επανάσταση, υποχώρησε. Ο
    πρίγκιπας Γεώργιος στάλθηκε με μια μοίρα τορπιλοβόλων, που έφτασε στα κρητικά νερά
    γύρω στις 12 Φεβρουαρίου με εντολή να στηρίξει τους επαναστάτες και να παρενοχλεί
    την οθωμανική ναυσιπλοΐα.

    Ο Τιμολέων Βάσσος, συνταγματάρχης και υπασπιστής του Γεωργίου Α΄, ανέλαβε τη
    διοίκηση ενός μικτού αποσπάσματος στις 29 Ιανουαρίου με το παλαιό ημερολόγιο, 10
    Φεβρουαρίου με το νέο. Τέσσερις μέρες αργότερα το απόσπασμα αποβιβάστηκε στον όρμο
    του Κολυμπαριού, περίπου 24 χιλιόμετρα δυτικά των Χανίων, τη νύχτα της 14ης
    Φεβρουαρίου, 2 Φεβρουαρίου με το παλαιό ημερολόγιο. Το Ίδρυμα Μείζονος Ελληνισμού
    δίνει 3 Φεβρουαρίου, και η διαφορά οφείλεται πιθανότατα στη νυχτερινή απόβαση. Οι
    περισσότερες πηγές υπολογίζουν τη δύναμή του σε περίπου 1.500 άνδρες, με δύο
    πυροβολαρχίες. Εγκαταστάθηκε στη μονή Γωνιάς και εξέδωσε προκήρυξη στο όνομα του
    Βασιλέως των Ελλήνων, που ανήγγελλε την κατάληψη του νησιού.

    Οι Δυνάμεις κινήθηκαν γρηγορότερα από εκείνον. Στις 15 Φεβρουαρίου η διεθνής μοίρα
    αποβίβασε 450 ναύτες και πεζοναύτες στα Χανιά. Ο Βάσσος διατάχθηκε να μην πλησιάσει
    σε απόσταση μικρότερη των έξι χιλιομέτρων από την πόλη. Οι άνδρες του συγκρούστηκαν
    με οθωμανική δύναμη στα Λειβάδια στις 19 Φεβρουαρίου, και στις 21 Φεβρουαρίου η
    μοίρα βομβάρδισε τους επαναστάτες στο Ακρωτήρι, που είχαν υψώσει την ελληνική σημαία
    και αρνούνταν να την κατεβάσουν. Στις 2 Μαρτίου οι διακοινώσεις των Δυνάμεων
    ανήγγειλαν ότι η Κρήτη θα αποκτούσε πραγματική αυτόνομη διοίκηση και ζητούσαν την
    αποχώρηση των ελληνικών δυνάμεων. Η Ελλάδα απέσυρε τα πλοία της αλλά άφησε τον Βάσσο
    στη στεριά, και από τις 21 Μαρτίου ο αποκλεισμός του νησιού τον καθήλωσε εκεί που
    βρισκόταν. Ανακλήθηκε τον Απρίλιο και στάλθηκε στη Θεσσαλία. Οι τελευταίοι από τους
    άνδρες του έφυγαν από την Κρήτη τον Μάιο.

    Η εκστρατεία ήταν η απόπειρα της Ελλάδας να δημιουργήσει τετελεσμένο, και έφερε το
    αντίθετο αποτέλεσμα. Μετέτρεψε μια κρητική εξέγερση σε αναμέτρηση της Ελλάδας με την
    Οθωμανική Αυτοκρατορία, και ο σουλτάνος κήρυξε τον πόλεμο στις 17 Απριλίου. Στο ίδιο
    το νησί η έκβαση είχε ήδη κριθεί από την απόφαση των Δυνάμεων της 2ας Μαρτίου:
    αυτονομία υπό διεθνή εγγύηση και όχι ένωση, και αυτό ακριβώς πήρε η Κρήτη όταν
    συγκροτήθηκε η Κρητική Πολιτεία στα τέλη του 1898.
