id: northern-epirus-autonomy
title:
  en: The Autonomous Republic of Northern Epirus and the Protocol of Corfu
  el: Η Αυτόνομος Δημοκρατία της Βορείου Ηπείρου και το Πρωτόκολλο της Κερκύρας
summary:
  en: >
    The Great Powers assigned the districts of Korytsa and Argyrokastro to the new
    Principality of Albania and ordered out the Greek army, which had held them since
    1912. The Orthodox population refused to accept it. A Panepirotic Assembly
    proclaimed an autonomous republic at Argyrokastro at the end of February 1914 under
    Georgios Christakis-Zografos, and the fighting continued until the Protocol of Corfu
    in May granted the two districts autonomy under nominal Albanian sovereignty. Albania
    then fell apart and the World War broke out; in October the Greek army walked back
    in and the provisional government dissolved itself. Greece administered Northern
    Epirus without ever annexing it, and lost the claim for good in 1921.
  el: >
    Οι Μεγάλες Δυνάμεις παραχώρησαν τις επαρχίες της Κορυτσάς και του Αργυροκάστρου στο
    νεοσύστατο Πριγκιπάτο της Αλβανίας και διέταξαν την αποχώρηση του ελληνικού στρατού,
    που τις κατείχε από το 1912. Ο ορθόδοξος πληθυσμός αρνήθηκε να το δεχθεί. Πανηπειρωτική
    Συνέλευση ανακήρυξε στο Αργυρόκαστρο, στα τέλη Φεβρουαρίου 1914, αυτόνομη πολιτεία με
    πρόεδρο τον Γεώργιο Χρηστάκη-Ζωγράφο, και οι συγκρούσεις συνεχίστηκαν ώσπου το
    Πρωτόκολλο της Κερκύρας, τον Μάιο, αναγνώρισε στις δύο επαρχίες πλήρη αυτονομία υπό
    ονομαστική αλβανική κυριαρχία. Η Αλβανία κατέρρευσε αμέσως μετά και ξέσπασε ο
    Παγκόσμιος Πόλεμος: τον Οκτώβριο ο ελληνικός στρατός επανήλθε και η προσωρινή κυβέρνηση
    αυτοδιαλύθηκε. Η Ελλάδα διοίκησε τη Βόρειο Ήπειρο χωρίς ποτέ να την προσαρτήσει και
    έχασε οριστικά τη διεκδίκηση το 1921.
body:
  en: |
    The Protocol of Florence of 17 December 1913 and the boundary commission that
    followed it drew the Greek-Albanian frontier south of the line the Greek army had
    reached in the Balkan Wars, leaving Korytsa and Argyrokastro to Albania. The
    autonomists put the Orthodox population of the disputed zone at roughly 130,000.
    Albanian and Greek estimates of the region's composition differed sharply at the
    time and still do, which is why the frontier drawn in 1913 has outlasted every
    argument made against it.

    The assembly at Argyrokastro proclaimed the Autonomous Republic of Northern Epirus
    on 28 February 1914, with Georgios Christakis-Zografos, until recently Greek foreign
    minister, as its president. Greek accounts more often commemorate 17 February Old
    Style, the day of Zografos's proclamation speech, which falls on 2 March by the new
    calendar. Three Orthodox metropolitans countersigned the declaration, giving it the
    sanction of the church. The Protocol of Corfu, signed on 17 May 1914 by
    representatives of Albania and the provisional government under the supervision of
    the International Control Commission, granted the two districts autonomy: Greek as
    the language of instruction in Orthodox schools above the third grade, Greek equal
    with Albanian in the courts and councils, a locally recruited gendarmerie, and a
    renewed ten-year autonomous regime for Himara.

    The guarantee was worth what the Powers' attention was worth, which by the autumn of
    1914 was nothing. Albania collapsed into revolt, Prince Wilhelm of Wied left the
    country in September, and on 27 October 1914 the Greek army re-entered Northern
    Epirus. The provisional government dissolved itself, declaring its objectives
    achieved. Italian forces evicted the Greek troops in the second half of 1916. The
    Paris Peace Conference briefly looked set to award the region to Greece, but after
    the Asia Minor defeat and under Italian pressure the Conference of Ambassadors
    confirmed it to Albania in November 1921 and annulled the Protocol of Corfu. Greece's
    northern frontier has not moved since.
  el: |
    Το Πρωτόκολλο της Φλωρεντίας, της 17ης Δεκεμβρίου 1913, και η διασυμμαχική επιτροπή
    οριοθέτησης που ακολούθησε χάραξαν την ελληνοαλβανική μεθόριο νοτιότερα από τη γραμμή
    που είχε φτάσει ο ελληνικός στρατός στους Βαλκανικούς Πολέμους, αφήνοντας την Κορυτσά
    και το Αργυρόκαστρο στην Αλβανία. Οι αυτονομιστές υπολόγιζαν τον ορθόδοξο πληθυσμό της
    αμφισβητούμενης ζώνης σε περίπου 130.000. Οι αλβανικές και οι ελληνικές εκτιμήσεις για
    τη σύνθεση της περιοχής διέφεραν ριζικά τότε και διαφέρουν ακόμη.

    Η συνέλευση του Αργυροκάστρου ανακήρυξε την Αυτόνομο Δημοκρατία της Βορείου Ηπείρου
    στις 28 Φεβρουαρίου 1914, με πρόεδρο τον Γεώργιο Χρηστάκη-Ζωγράφο, ως πρόσφατα υπουργό
    Εξωτερικών της Ελλάδας. Η ελληνική ιστοριογραφία μνημονεύει συχνότερα τη 17η Φεβρουαρίου
    με το παλαιό ημερολόγιο, ημέρα της διακήρυξης του Ζωγράφου, που αντιστοιχεί στη 2α
    Μαρτίου με το νέο. Τρεις ορθόδοξοι μητροπολίτες προσυπέγραψαν τη διακήρυξη, δίνοντάς της
    την έγκριση της Εκκλησίας. Το Πρωτόκολλο της Κερκύρας, που υπογράφηκε στις 17 Μαΐου 1914
    από εκπροσώπους της Αλβανίας και της προσωρινής κυβέρνησης υπό την εποπτεία της Διεθνούς
    Επιτροπής Ελέγχου, παραχώρησε στις δύο επαρχίες αυτονομία: ελληνική ως γλώσσα διδασκαλίας
    στα ορθόδοξα σχολεία πάνω από την τρίτη τάξη, ελληνική ισότιμη με την αλβανική στα
    δικαστήρια και τα συμβούλια, τοπικά στρατολογημένη χωροφυλακή και ανανέωση του δεκαετούς
    καθεστώτος αυτονομίας της Χιμάρας.

    Η εγγύηση άξιζε όσο και η προσοχή των Δυνάμεων, δηλαδή τίποτε από το φθινόπωρο του 1914.
    Η Αλβανία βυθίστηκε στην εξέγερση, ο πρίγκιπας Βίλχελμ του Βιντ εγκατέλειψε τη χώρα τον
    Σεπτέμβριο, και στις 27 Οκτωβρίου 1914 ο ελληνικός στρατός επανήλθε στη Βόρειο Ήπειρο.
    Η προσωρινή κυβέρνηση αυτοδιαλύθηκε, δηλώνοντας ότι οι σκοποί της είχαν επιτευχθεί.
    Ιταλικές δυνάμεις εκτόπισαν τα ελληνικά στρατεύματα στο δεύτερο μισό του 1916. Η Συνδιάσκεψη
    της Ειρήνης στο Παρίσι φάνηκε για λίγο έτοιμη να επιδικάσει την περιοχή στην Ελλάδα, όμως
    μετά τη μικρασιατική ήττα και υπό ιταλική πίεση η Διάσκεψη των Πρεσβευτών την κατακύρωσε
    στην Αλβανία τον Νοέμβριο του 1921, ακυρώνοντας το Πρωτόκολλο της Κερκύρας. Τα βόρεια
    σύνορα της Ελλάδας δεν έχουν μετακινηθεί έκτοτε.
