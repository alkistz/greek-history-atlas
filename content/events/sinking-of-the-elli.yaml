id: sinking-of-the-elli
title:
  en: The sinking of the Elli at Tinos
  el: Ο τορπιλισμός της Έλλης στην Τήνο
summary:
  en: >
    On the morning of 15 August 1940, the feast of the Dormition and the greatest Orthodox
    pilgrimage in Greece, an Italian submarine torpedoed the cruiser Elli as she lay at anchor
    off Tinos as honour guard, with thousands of pilgrims on the quay. Nine men were killed
    and twenty-four wounded. Greece was neutral and there had been no warning. The government
    knew within days that the submarine was Italian and said publicly that it did not, and
    released the evidence on 30 October, two days after Italy invaded.
  el: >
    Το πρωί της 15ης Αυγούστου 1940, ανήμερα της Κοιμήσεως της Θεοτόκου και του μεγαλύτερου
    ορθόδοξου προσκυνήματος της Ελλάδας, ιταλικό υποβρύχιο τορπίλισε το καταδρομικό Έλλη ενώ
    ήταν αγκυροβολημένο στην Τήνο ως τιμητική φρουρά, με χιλιάδες προσκυνητές στην προκυμαία.
    Σκοτώθηκαν εννέα άνδρες και τραυματίστηκαν είκοσι τέσσερις. Η Ελλάδα ήταν ουδέτερη και δεν
    είχε προηγηθεί καμία προειδοποίηση. Η κυβέρνηση γνώριζε μέσα σε λίγες μέρες ότι το
    υποβρύχιο ήταν ιταλικό και δήλωνε δημόσια το αντίθετο· έδωσε τα στοιχεία στη δημοσιότητα
    στις 30 Οκτωβρίου, δύο μέρες μετά την ιταλική εισβολή.
body:
  en: |
    The Elli was a light cruiser built in 1912, originally ordered by China as the Fei Hung,
    and by 1940 she served as a minelayer. On 15 August she was anchored off Tinos as honour
    guard for the Dormition of the Theotokos, the feast that brings pilgrims to the island's
    miraculous icon from all over Greece. At 08:25 the Italian submarine Delfino, based at
    Leros in the Italian Dodecanese and commanded by Giuseppe Aicardi, fired three torpedoes
    at the anchored ship. One struck beneath her operating boiler, in the engine room and oil
    tanks; she caught fire and sank. The other two ran on and exploded against the quay where
    the pilgrims were standing.

    Nine men were killed, one junior officer and eight petty officers and ratings, and
    twenty-four were wounded; a woman on the waterfront died of a heart attack after the
    explosions. Divers recovered torpedo fragments whose markings proved Italian manufacture,
    and the naval enquiry established Italian responsibility within days. The Metaxas
    government suppressed the finding and announced that the nationality of the attacking
    submarine was unknown. Greece was not ready for a war and the government wanted no
    confrontation before it had to have one. The evidence was published on 30 October 1940,
    two days after the Italian invasion.

    Count Ciano recorded that Mussolini had ordered the attack to intimidate a country that
    had accepted the Anglo-French guarantee in April 1939, and it belonged to a pattern of
    Italian provocations that included air attacks on Greek shipping. It had the opposite
    effect. An attack on a warship on the national Marian feast day, in a harbour full of
    pilgrims, did more than any government campaign could have done to unite Greek opinion,
    and it is generally credited with hardening the response to the ultimatum of 28 October.
    The Elli had carried George II home from exile in November 1935. Her name was given to the
    cruiser Eugenio di Savoia, ceded by Italy in reparation and commissioned as Elli in 1950.
  el: |
    Η Έλλη ήταν ελαφρύ καταδρομικό ναυπήγησης του 1912, παραγγελία αρχικά της Κίνας με το
    όνομα Fei Hung, και το 1940 υπηρετούσε ως ναρκοθέτιδα. Στις 15 Αυγούστου ήταν
    αγκυροβολημένη στην Τήνο ως τιμητική φρουρά για την Κοίμηση της Θεοτόκου, τη γιορτή που
    φέρνει προσκυνητές από όλη την Ελλάδα στη θαυματουργή εικόνα του νησιού. Στις 08:25 το
    ιταλικό υποβρύχιο Delfino, με βάση τη Λέρο των ιταλοκρατούμενων Δωδεκανήσων και κυβερνήτη
    τον Τζουζέπε Αϊκάρντι, εκτόξευσε τρεις τορπίλες κατά του αγκυροβολημένου πλοίου. Η μία
    χτύπησε κάτω από τον λέβητα σε λειτουργία, στο μηχανοστάσιο και στις δεξαμενές καυσίμου·
    το πλοίο πήρε φωτιά και βυθίστηκε. Οι άλλες δύο συνέχισαν και εξερράγησαν στην προκυμαία,
    εκεί όπου στέκονταν οι προσκυνητές.

    Σκοτώθηκαν εννέα άνδρες, ένας ανθυποπλοίαρχος και οκτώ υπαξιωματικοί και ναύτες, και
    τραυματίστηκαν είκοσι τέσσερις· μια γυναίκα στην προκυμαία πέθανε από καρδιακή προσβολή
    μετά τις εκρήξεις. Δύτες ανέσυραν θραύσματα τορπίλης με σημάνσεις που αποδείκνυαν ιταλική
    κατασκευή, και η ναυτική ανάκριση στοιχειοθέτησε την ιταλική ευθύνη μέσα σε λίγες μέρες. Η
    κυβέρνηση Μεταξά απέκρυψε το πόρισμα και ανακοίνωσε ότι η εθνικότητα του υποβρυχίου ήταν
    άγνωστη. Η Ελλάδα δεν ήταν έτοιμη για πόλεμο και η κυβέρνηση δεν ήθελε σύγκρουση πριν
    αναγκαστεί. Τα στοιχεία δημοσιοποιήθηκαν στις 30 Οκτωβρίου 1940, δύο μέρες μετά την
    ιταλική εισβολή.

    Ο κόμης Τσιάνο σημείωσε ότι ο Μουσολίνι είχε διατάξει την επίθεση για να εκφοβίσει μια
    χώρα που είχε δεχθεί την αγγλογαλλική εγγύηση τον Απρίλιο του 1939, και η ενέργεια
    εντασσόταν σε μια σειρά ιταλικών προκλήσεων που περιλάμβανε αεροπορικές επιθέσεις κατά
    ελληνικών εμπορικών πλοίων. Το αποτέλεσμα ήταν το αντίθετο από το επιδιωκόμενο. Μια
    επίθεση σε πολεμικό πλοίο ανήμερα της μεγαλύτερης θεομητορικής γιορτής, σε λιμάνι γεμάτο
    προσκυνητές, ένωσε την ελληνική κοινή γνώμη περισσότερο από όσο θα μπορούσε οποιαδήποτε
    κυβερνητική εκστρατεία, και θεωρείται γενικά ότι σκλήρυνε τη λαϊκή απάντηση στο τελεσίγραφο
    της 28ης Οκτωβρίου. Η Έλλη είχε φέρει πίσω τον Γεώργιο Β΄ από την εξορία τον Νοέμβριο του
    1935. Το όνομά της δόθηκε στο καταδρομικό Eugenio di Savoia, που παραχώρησε η Ιταλία ως
    επανόρθωση και εντάχθηκε στον στόλο ως Έλλη το 1950.
