id: thessaloniki-may-1936
title:
  en: The Thessaloniki tobacco workers' strike and the killings of May 1936
  el: Ο Μάης του '36 στη Θεσσαλονίκη
summary:
  en: >
    Tobacco was Greece's largest export and the main employer of the refugees of the north.
    When prices collapsed and leaf processing was mechanised, the tobacco towns struck. On 8
    and 9 May 1936 the gendarmerie fired on demonstrators in Thessaloniki, killing twelve and
    seriously wounding at least thirty-two; some army and gendarmerie units refused to fire.
    The strike was settled on 11 May with the eight-hour day and a state pension and medical
    scheme conceded. The government, the palace and the employers concluded that parliament
    could no longer keep order.
  el: >
    Ο καπνός ήταν το πρώτο εξαγώγιμο προϊόν της χώρας και ο βασικός εργοδότης των προσφύγων
    του Βορρά. Όταν κατέρρευσαν οι τιμές και μηχανοποιήθηκε η επεξεργασία του φύλλου, οι
    καπνουπόλεις απέργησαν. Στις 8 και 9 Μαΐου 1936 η χωροφυλακή πυροβόλησε διαδηλωτές στη
    Θεσσαλονίκη, σκοτώνοντας δώδεκα και τραυματίζοντας σοβαρά τουλάχιστον τριάντα δύο· τμήματα
    του στρατού και της χωροφυλακής αρνήθηκαν να ρίξουν. Η απεργία έληξε στις 11 Μαΐου με
    παραχώρηση του οκταώρου και κρατικού συστήματος συντάξεων και ιατρικής περίθαλψης. Η
    κυβέρνηση, το παλάτι και οι εργοδότες συμπέραναν ότι ο κοινοβουλευτισμός δεν μπορούσε πια
    να κρατήσει την τάξη.
body:
  en: |
    The tobacco workers of Kavala, Serres, Drama, Xanthi and Thessaloniki were the most
    organised labour force in Greece, and they were overwhelmingly refugees from Asia Minor
    and the Black Sea. Their trade had been built by the refugee settlement of the 1920s, and
    it was destroyed twice over after 1929: first by the collapse of world tobacco prices,
    then by the mechanisation of leaf processing, which did away with the skilled sorting work
    that had given them their wages and their bargaining power. Strikes spread through the
    tobacco towns from late April 1936. The demands were an eight-hour day, a minimum wage,
    pensions and medical cover.

    Thessaloniki's tobacco workers struck and marched on 8 May. Gendarmes broke up the
    demonstration by force and the first deaths followed. On 9 May the strike became general
    in the city, other trades joining it, and the gendarmerie, reinforced by army cavalry and
    motorised units, fired on the crowds. Twelve demonstrators were killed and at least
    thirty-two seriously wounded, with the wider figure for injured running into the hundreds.
    Some units refused the order to fire, which alarmed the government at least as much as the
    strike. A photograph of a mother in the street holding her dead son gave Yannis Ritsos the
    Epitaphios, written and published within days, burned in public under the dictatorship and
    set to music by Mikis Theodorakis in 1958.

    The strike ended on 11 May with the central demands conceded, including the eight-hour day
    and a state scheme of pensions and medical cover. A second wave of agitation followed
    through the summer and culminated in the call for a nationwide general strike on 5 August.
    What the government took from May was not that the workers had grievances but that neither
    parliament nor the security forces could be relied on, and the king and the business
    community read it the same way. The bloody May of 1936 is the immediate background of the
    4th of August.
  el: |
    Οι καπνεργάτες της Καβάλας, των Σερρών, της Δράμας, της Ξάνθης και της Θεσσαλονίκης ήταν
    το πιο οργανωμένο εργατικό δυναμικό της Ελλάδας, και στη συντριπτική τους πλειονότητα
    πρόσφυγες από τη Μικρά Ασία και τον Πόντο. Το επάγγελμά τους το είχε δημιουργήσει η
    προσφυγική αποκατάσταση της δεκαετίας του 1920 και το κατέστρεψαν δύο φορές μετά το 1929:
    πρώτα η κατάρρευση των διεθνών τιμών του καπνού, έπειτα η μηχανοποίηση της επεξεργασίας
    του φύλλου, που κατάργησε την ειδικευμένη δουλειά της διαλογής, δηλαδή τον μισθό και τη
    διαπραγματευτική τους δύναμη. Οι απεργίες απλώθηκαν στις καπνουπόλεις από τα τέλη Απριλίου
    1936. Τα αιτήματα ήταν οκτάωρο, κατώτατος μισθός, συντάξεις και ιατρική περίθαλψη.

    Οι καπνεργάτες της Θεσσαλονίκης απέργησαν και διαδήλωσαν στις 8 Μαΐου. Η χωροφυλακή
    διέλυσε βίαια τη συγκέντρωση και σημειώθηκαν οι πρώτοι νεκροί. Στις 9 Μαΐου η απεργία έγινε
    γενική στην πόλη, με άλλους κλάδους να συμμετέχουν, και η χωροφυλακή, ενισχυμένη με
    ιππικό και μηχανοκίνητα τμήματα, άνοιξε πυρ στο πλήθος. Σκοτώθηκαν δώδεκα διαδηλωτές και
    τραυματίστηκαν σοβαρά τουλάχιστον τριάντα δύο, ενώ ο ευρύτερος αριθμός των τραυματιών
    φτάνει τις εκατοντάδες. Ορισμένα τμήματα αρνήθηκαν τη διαταγή να πυροβολήσουν, πράγμα που
    ανησύχησε την κυβέρνηση τουλάχιστον όσο και η ίδια η απεργία. Η φωτογραφία μιας μάνας που
    κρατούσε στον δρόμο τον νεκρό γιο της έδωσε στον Γιάννη Ρίτσο τον Επιτάφιο, γραμμένο και
    τυπωμένο μέσα σε λίγες μέρες, καμένο δημόσια επί δικτατορίας και μελοποιημένο από τον Μίκη
    Θεοδωράκη το 1958.

    Η απεργία έληξε στις 11 Μαΐου με ικανοποίηση των κεντρικών αιτημάτων, μαζί και του
    οκταώρου και ενός κρατικού συστήματος συντάξεων και περίθαλψης. Δεύτερο κύμα κινητοποιήσεων
    ακολούθησε το καλοκαίρι και κατέληξε στην προκήρυξη πανελλαδικής γενικής απεργίας για τις 5
    Αυγούστου. Εκείνο που κράτησε η κυβέρνηση από τον Μάη δεν ήταν ότι οι εργάτες είχαν
    αιτήματα, αλλά ότι ούτε η Βουλή ούτε τα σώματα ασφαλείας ήταν αξιόπιστα, και ο βασιλιάς και
    ο επιχειρηματικός κόσμος διάβασαν τα πράγματα το ίδιο. Ο ματωμένος Μάης του 1936 είναι το
    άμεσο υπόβαθρο της 4ης Αυγούστου.
