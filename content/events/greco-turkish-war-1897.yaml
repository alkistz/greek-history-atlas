id: greco-turkish-war-1897
title:
  en: The Greco-Turkish War of 1897
  el: Ο Ελληνοτουρκικός Πόλεμος του 1897
summary:
  en: >
    Greece went to war over Crete with an army that had not fought since 1829, against
    an Ottoman force reorganised by German officers. It lasted about thirty days. The
    Greek line broke at Meluna, Larissa was abandoned in panic, and the last stand at
    Domokos failed; only Smolenskis at Velestino held. Casualties were modest and the
    humiliation was total. The peace returned Thessaly but moved the frontier south,
    imposed an indemnity of four million Turkish pounds and put Greek finances under
    international control.
  el: >
    Η Ελλάδα μπήκε σε πόλεμο για την Κρήτη με στρατό που δεν είχε πολεμήσει από το 1829,
    απέναντι σε οθωμανική δύναμη αναδιοργανωμένη από Γερμανούς αξιωματικούς. Κράτησε
    περίπου τριάντα ημέρες. Η ελληνική γραμμή έσπασε στη Μελούνα, η Λάρισα
    εγκαταλείφθηκε πανικόβλητα και η τελευταία αντίσταση στον Δομοκό απέτυχε. Μόνο ο
    Σμολένσκης κράτησε στο Βελεστίνο. Οι απώλειες ήταν περιορισμένες και η ταπείνωση
    ολοκληρωτική. Η ειρήνη επέστρεψε τη Θεσσαλία αλλά μετακίνησε τα σύνορα νοτιότερα,
    επέβαλε αποζημίωση τεσσάρων εκατομμυρίων τουρκικών λιρών και υπήγαγε τα ελληνικά
    οικονομικά σε διεθνή έλεγχο.
body:
  en: |
    The cause was Crete. Shakir Pasha had abrogated the Pact of Halepa around 1889, and
    a revolt that began in September 1895 had by the summer of 1896 taken most of the
    island out of Ottoman control; a fresh rising broke out on 25 January 1897. In
    Athens the Ethniki Etairia, a secret irredentist league founded by army officers in
    1894, agitated for intervention and sent armed bands into Macedonia and Epirus,
    pushing a reluctant Deligiannis government along in front of it. Colonel Timoleon
    Vassos landed near Kolymbari in Crete on 14 February 1897 with about 1,500 men and
    proclaimed the island annexed in the king's name. The six Powers answered with an
    International Squadron, shelled insurgent positions at Akrotiri on 21 February and
    blockaded Crete from 21 March, penning Vassos in where he stood.

    The Sultan declared war on 17 April and fighting began on the Thessalian frontier the
    next day. Greece put between 54,000 and 90,000 men in the field against roughly
    120,000 Ottoman troops with 210 guns. The Greek army was commanded by Crown Prince
    Constantine and had not fought a war in nearly seventy years; the Ottoman army under
    Edhem Pasha, a Cretan-born Muslim, had been rebuilt on German lines. The line broke
    at the Meluna pass. Tyrnavos fell on 11 and 12 April Old Style and Larissa on 13
    April, 25 April New Style, in a retreat that turned into a rout; some English
    accounts date the fall of Larissa to 27 April. Konstantinos Smolenskis held Velestino
    from 15 to 24 April Old Style, the one sustained Greek success of the war. The Greeks
    lost at Farsala on 24 April and were outflanked at Domokos on 5 May, 17 May New
    Style, where about 40,000 men, including two thousand Italian volunteers under
    Ricciotti Garibaldi and a Philhellenic Legion, gave way.

    The numbers were small: about 672 Greeks killed, 2,383 wounded and 252 taken; about
    1,111 Ottoman dead and 3,238 wounded. What was lost was not an army. Tsar Nicholas
    II intervened with the Sultan to stop the advance on Athens; an armistice in Epirus
    on 7 May Old Style was followed by the general armistice protocol signed at Tatarna
    near Lamia on 8 May, 20 May New Style. The Treaty of Constantinople of 4 December
    1897 gave Thessaly back but redrew the frontier in the Ottomans' favour through the
    mountain passes, imposed an indemnity of four million Turkish pounds, kept Ottoman
    troops in Thessaly until it was paid and made Greek revenues subject to
    international control. It also obliged the Porte to grant Crete autonomy, which was
    the one thing Greece had gone to war for: after the massacre at Candia on 6 September
    1898 the Powers expelled the last Ottoman troops that November, and Prince George
    arrived as High Commissioner on 21 December 1898. The defeat discredited the dynasty
    and the parliamentary parties together, and the officers who drew the conclusion
    staged the Goudi coup twelve years later.
  el: |
    Η αιτία ήταν η Κρήτη. Ο Σακίρ Πασάς είχε καταργήσει τη Σύμβαση της Χαλέπας γύρω στο
    1889, και επανάσταση που ξέσπασε τον Σεπτέμβριο του 1895 είχε ως το καλοκαίρι του
    1896 αποσπάσει το μεγαλύτερο μέρος του νησιού από τον οθωμανικό έλεγχο. Νέα εξέγερση
    ξέσπασε στις 25 Ιανουαρίου 1897. Στην Αθήνα η Εθνική Εταιρεία, μυστική αλυτρωτική
    οργάνωση που είχαν ιδρύσει αξιωματικοί το 1894, ζητούσε επέμβαση και έστελνε ένοπλα
    σώματα στη Μακεδονία και την Ήπειρο, σπρώχνοντας μπροστά της μια απρόθυμη κυβέρνηση
    Δηλιγιάννη. Ο συνταγματάρχης Τιμολέων Βάσσος αποβιβάστηκε κοντά στο Κολυμπάρι στις 14
    Φεβρουαρίου 1897 με περίπου 1.500 άνδρες και κήρυξε την προσάρτηση του νησιού στο
    όνομα του βασιλιά. Οι έξι Δυνάμεις απάντησαν με Διεθνή Μοίρα, βομβάρδισαν θέσεις των
    επαναστατών στο Ακρωτήρι στις 21 Φεβρουαρίου και απέκλεισαν την Κρήτη από τις 21
    Μαρτίου, καθηλώνοντας τον Βάσσο εκεί που βρισκόταν.

    Ο σουλτάνος κήρυξε τον πόλεμο στις 17 Απριλίου και οι εχθροπραξίες άρχισαν στα
    θεσσαλικά σύνορα την επομένη. Η Ελλάδα παρέταξε μεταξύ 54.000 και 90.000 ανδρών
    απέναντι σε περίπου 120.000 Οθωμανούς με 210 πυροβόλα. Τον ελληνικό στρατό διοικούσε ο
    διάδοχος Κωνσταντίνος και δεν είχε πολεμήσει εδώ και εβδομήντα σχεδόν χρόνια, ενώ ο
    οθωμανικός υπό τον Εδέμ Πασά, μουσουλμάνο γεννημένο στην Κρήτη, είχε ανασυγκροτηθεί
    κατά τα γερμανικά πρότυπα. Η γραμμή έσπασε στο στενό της Μελούνας. Ο Τύρναβος έπεσε
    στις 11 και 12 Απριλίου με το παλαιό ημερολόγιο και η Λάρισα στις 13 Απριλίου, 25
    Απριλίου με το νέο, σε υποχώρηση που έγινε άτακτη φυγή. Ορισμένες αγγλικές πηγές
    τοποθετούν την πτώση της Λάρισας στις 27 Απριλίου. Ο Κωνσταντίνος Σμολένσκης κράτησε
    το Βελεστίνο από τις 15 ως τις 24 Απριλίου, η μόνη παρατεταμένη ελληνική επιτυχία του
    πολέμου. Οι Έλληνες ηττήθηκαν στα Φάρσαλα στις 24 Απριλίου και υπερφαλαγγίστηκαν στον
    Δομοκό στις 5 Μαΐου, 17 Μαΐου με το νέο ημερολόγιο, όπου υποχώρησαν περίπου 40.000
    άνδρες, ανάμεσά τους δύο χιλιάδες Ιταλοί εθελοντές υπό τον Ριτσιότι Γαριβάλδη και μια
    Φιλελληνική Λεγεώνα.

    Οι αριθμοί ήταν μικροί: περίπου 672 Έλληνες νεκροί, 2.383 τραυματίες και 252
    αιχμάλωτοι, και περίπου 1.111 οθωμανοί νεκροί και 3.238 τραυματίες. Εκείνο που χάθηκε
    δεν ήταν στρατός. Ο τσάρος Νικόλαος Β΄ μεσολάβησε στον σουλτάνο για να σταματήσει η
    προέλαση προς την Αθήνα. Ανακωχή στην Ήπειρο στις 7 Μαΐου ακολουθήθηκε από το γενικό
    πρωτόκολλο ανακωχής που υπογράφηκε στην Τατάρνα κοντά στη Λαμία στις 8 Μαΐου, 20 Μαΐου
    με το νέο ημερολόγιο. Η Συνθήκη της Κωνσταντινούπολης της 4ης Δεκεμβρίου 1897
    επέστρεψε τη Θεσσαλία αλλά χάραξε τα σύνορα υπέρ των Οθωμανών μέσα από τα ορεινά
    περάσματα, επέβαλε αποζημίωση τεσσάρων εκατομμυρίων τουρκικών λιρών, κράτησε
    οθωμανικά στρατεύματα στη Θεσσαλία ώσπου να πληρωθεί και υπήγαγε τα ελληνικά έσοδα σε
    διεθνή έλεγχο. Υποχρέωνε επίσης την Πύλη να παραχωρήσει αυτονομία στην Κρήτη, το μόνο
    για το οποίο είχε πολεμήσει η Ελλάδα: μετά τη σφαγή του Ηρακλείου στις 6 Σεπτεμβρίου
    1898 οι Δυνάμεις απομάκρυναν τα τελευταία οθωμανικά στρατεύματα τον Νοέμβριο, και ο
    πρίγκιπας Γεώργιος έφτασε ως ύπατος αρμοστής στις 21 Δεκεμβρίου 1898. Η ήττα
    απαξίωσε μαζί τη δυναστεία και τα κοινοβουλευτικά κόμματα, και οι αξιωματικοί που
    έβγαλαν το συμπέρασμα έκαναν δώδεκα χρόνια αργότερα το κίνημα στο Γουδί.
