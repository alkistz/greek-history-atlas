id: battle-of-navarino
title:
  en: The Battle of Navarino
summary:
  en: >
    A combined British, French and Russian fleet destroyed the Ottoman and Egyptian
    fleet in Navarino Bay. The engagement was not intended as a battle and no power had
    declared war. It nonetheless ended Ottoman capacity to hold the Peloponnese by sea
    and made Greek independence a question of terms rather than of outcome.
body:
  en: |
    The Treaty of London of July 1827 committed Britain, France and Russia to impose
    an armistice on both sides. Ibrahim Pasha refused to stop operations in the Morea,
    and Codrington took the allied squadrons into Navarino Bay on 20 October to make
    the blockade felt.

    A musket shot at a British boat set off a general action at anchor. Within a few
    hours about sixty Ottoman and Egyptian ships had been sunk or burned, against no
    allied losses. The Sultan's ability to supply Ibrahim was gone. It was the last
    fleet action fought entirely under sail, and the decisive act of the war.
