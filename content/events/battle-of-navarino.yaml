id: battle-of-navarino
title:
  en: The Battle of Navarino
  el: Η ναυμαχία του Ναβαρίνου
summary:
  en: >
    A combined British, French and Russian fleet destroyed the Ottoman and Egyptian
    fleet in Navarino Bay. The engagement was not intended as a battle and no power had
    declared war. It nonetheless ended Ottoman capacity to hold the Peloponnese by sea
    and made Greek independence a question of terms rather than of outcome.
  el: >
    Ο συνδυασμένος στόλος της Βρετανίας, της Γαλλίας και της Ρωσίας κατέστρεψε τον οθωμανικό
    και αιγυπτιακό στόλο στον όρμο του Ναβαρίνου. Η σύγκρουση δεν είχε σχεδιαστεί ως ναυμαχία
    και καμία δύναμη δεν είχε κηρύξει πόλεμο. Αφαίρεσε ωστόσο από την Πύλη τη δυνατότητα να
    κρατήσει την Πελοπόννησο διά θαλάσσης και μετέτρεψε την ελληνική ανεξαρτησία σε ζήτημα
    όρων και όχι έκβασης.
body:
  en: |
    The Treaty of London of July 1827 committed Britain, France and Russia to impose
    an armistice on both sides. Ibrahim Pasha refused to stop operations in the Morea,
    and Codrington took the allied squadrons into Navarino Bay on 20 October to make
    the blockade felt.

    A musket shot at a British boat set off a general action at anchor. Within a few
    hours about sixty Ottoman and Egyptian ships had been sunk or burned. The allies
    lost no ship, but about 180 of their men were killed and nearly 500 wounded.
    The Sultan's ability to supply Ibrahim was gone. It was the last
    fleet action fought entirely under sail, and the decisive act of the war.
  el: |
    Η Συνθήκη του Λονδίνου του Ιουλίου 1827 δέσμευε τη Βρετανία, τη Γαλλία και τη Ρωσία να
    επιβάλουν ανακωχή και στις δύο πλευρές. Ο Ιμπραήμ πασάς αρνήθηκε να σταματήσει τις
    επιχειρήσεις στον Μοριά, και ο Κόδριγκτον οδήγησε τις συμμαχικές μοίρες στον όρμο του
    Ναβαρίνου στις 20 Οκτωβρίου για να κάνει αισθητό τον αποκλεισμό.

    Ένας πυροβολισμός εναντίον βρετανικής λέμβου πυροδότησε γενική σύγκρουση με τα πλοία
    αγκυροβολημένα. Μέσα σε λίγες ώρες περίπου εξήντα οθωμανικά και αιγυπτιακά πλοία είχαν
    βυθιστεί ή καεί. Οι σύμμαχοι δεν έχασαν κανένα πλοίο, είχαν όμως περίπου 180
    νεκρούς και κοντά στους 500 τραυματίες. Η δυνατότητα του σουλτάνου να
    ανεφοδιάζει τον Ιμπραήμ είχε χαθεί. Ήταν η τελευταία σύγκρουση στόλων που δόθηκε
    αποκλειστικά με ιστιοφόρα, και η αποφασιστική πράξη του πολέμου.
