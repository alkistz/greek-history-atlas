id: lebanon-and-caserta-agreements
title:
  en: "The Lebanon Charter and the Caserta Agreement: EAM brought into the state"
  el: "Η Συνδιάσκεψη του Λιβάνου και η Συμφωνία της Καζέρτας"
summary:
  en: >
    Georgios Papandreou convened every Greek political force above Beirut from 17 to 20
    May 1944 and got a National Contract out of them: one government, one army, the
    dissolution of the guerrilla forces and free elections after liberation. EAM had
    demanded half the ministries and took about a quarter, which contemporaries and
    historians alike have called its worst political defeat of the occupation. At Caserta
    on 26 September ELAS and EDES placed themselves under the Greek government and thence
    under the British general Ronald Scobie. Together the two agreements settled who would
    govern liberated Greece and left unsettled who would disarm whom.
  el: >
    Ο Γεώργιος Παπανδρέου συγκέντρωσε όλες τις ελληνικές πολιτικές δυνάμεις πάνω από τη
    Βηρυτό, από τις 17 ως τις 20 Μαΐου 1944, και πήρε από αυτές Εθνικό Συμβόλαιο: μία
    κυβέρνηση, έναν στρατό, διάλυση των ανταρτικών σωμάτων και ελεύθερες εκλογές μετά την
    απελευθέρωση. Το ΕΑΜ είχε ζητήσει τα μισά υπουργεία και πήρε περίπου το ένα τέταρτο,
    κάτι που σύγχρονοι και ιστορικοί ονόμασαν τη χειρότερη πολιτική του ήττα στην Κατοχή.
    Στην Καζέρτα, στις 26 Σεπτεμβρίου, ο ΕΛΑΣ και ο ΕΔΕΣ τέθηκαν υπό την ελληνική
    κυβέρνηση και μέσω αυτής υπό τον Βρετανό στρατηγό Ρόναλντ Σκόμπι. Μαζί, οι δύο
    συμφωνίες έλυσαν το ποιος θα κυβερνούσε την απελευθερωμένη Ελλάδα και άφησαν άλυτο το
    ποιος θα αφόπλιζε ποιον.
body:
  en: |
    Papandreou took office on 26 April 1944, three weeks after the mutiny in the Greek
    forces in Egypt, and called the conference at the Hotel Bois de Boulogne at Dhour El
    Choueir above Beirut. Twenty-five delegates of fifteen parties and organisations came:
    EAM, ELAS, PEEA, EDES, EKKA and the royalist, liberal and centrist parties. The
    National Contract they signed ran to eight chapters. It unified all armed forces under
    the national government, dissolved the guerrilla armies into it, demanded an end to
    what the text called EAM terrorism, arranged relief and supply, and guaranteed civil
    liberties and free elections after liberation.

    The EAM delegation, led by Alexandros Svolos, had come to Lebanon representing the
    largest armed and political force in the country and left with about a quarter of the
    ministries. Why it accepted is still argued: its defenders point to the pressure of
    British recognition and the Soviet silence, its critics to a failure of nerve at the
    one moment when its bargaining position was strongest. EAM's ministers took their
    seats in the government of national unity in early September 1944.

    Caserta followed at Allied Force Headquarters in Italy on 26 September 1944, signed by
    Papandreou, the British Middle East Command, Sarafis for ELAS and Zervas for EDES. It
    put all guerrilla forces under the Greek government, which placed them under
    Lieutenant-General Ronald Scobie; ELAS undertook not to enter Athens without orders;
    and the Security Battalions were declared instruments of the enemy to be treated as
    such unless they surrendered. Caserta was the legal authority under which Scobie
    ordered ELAS to demobilise on 1 December 1944. The Dekemvriana began two days later.
  el: |
    Ο Παπανδρέου ανέλαβε στις 26 Απριλίου 1944, τρεις εβδομάδες μετά το κίνημα των
    ελληνικών δυνάμεων στην Αίγυπτο, και συγκάλεσε τη συνδιάσκεψη στο ξενοδοχείο Bois de
    Boulogne στο Ντουρ ελ Σουέιρ, πάνω από τη Βηρυτό. Ήρθαν είκοσι πέντε αντιπρόσωποι
    δεκαπέντε κομμάτων και οργανώσεων: ΕΑΜ, ΕΛΑΣ, ΠΕΕΑ, ΕΔΕΣ, ΕΚΚΑ και τα βασιλικά,
    φιλελεύθερα και κεντρώα κόμματα. Το Εθνικό Συμβόλαιο που υπέγραψαν είχε οκτώ κεφάλαια.
    Ένωνε όλες τις ένοπλες δυνάμεις υπό την εθνική κυβέρνηση, διέλυε σε αυτήν τους
    αντάρτικους στρατούς, απαιτούσε το τέλος αυτού που το κείμενο ονόμαζε τρομοκρατία του
    ΕΑΜ, ρύθμιζε την περίθαλψη και τον επισιτισμό και εγγυόταν τις πολιτικές ελευθερίες και
    ελεύθερες εκλογές μετά την απελευθέρωση.

    Η αντιπροσωπεία του ΕΑΜ, με επικεφαλής τον Αλέξανδρο Σβώλο, είχε πάει στον Λίβανο
    εκπροσωπώντας τη μεγαλύτερη ένοπλη και πολιτική δύναμη της χώρας και έφυγε με περίπου
    το ένα τέταρτο των υπουργείων. Το γιατί δέχθηκε συζητείται ακόμη: όσοι την
    υπερασπίζονται επικαλούνται την πίεση της βρετανικής αναγνώρισης και τη σοβιετική
    σιωπή, οι επικριτές της μιλούν για υποχώρηση τη στιγμή ακριβώς που η
    διαπραγματευτική της θέση ήταν η ισχυρότερη. Οι υπουργοί του ΕΑΜ πήραν τις θέσεις τους
    στην κυβέρνηση εθνικής ενότητας στις αρχές Σεπτεμβρίου 1944.

    Η Καζέρτα ακολούθησε στο συμμαχικό στρατηγείο της Ιταλίας στις 26 Σεπτεμβρίου 1944, με
    υπογραφές του Παπανδρέου, της βρετανικής Διοίκησης Μέσης Ανατολής, του Σαράφη για τον
    ΕΛΑΣ και του Ζέρβα για τον ΕΔΕΣ. Έθεσε όλες τις ανταρτικές δυνάμεις υπό την ελληνική
    κυβέρνηση, που τις υπήγαγε στον αντιστράτηγο Ρόναλντ Σκόμπι, δέσμευσε τον ΕΛΑΣ να μην
    μπει στην Αθήνα χωρίς διαταγή και κήρυξε τα Τάγματα Ασφαλείας όργανα του εχθρού,
    αντιμετωπίσιμα ως τέτοια αν δεν παραδίδονταν. Η Καζέρτα ήταν το νομικό έρεισμα με το
    οποίο ο Σκόμπι διέταξε την 1η Δεκεμβρίου 1944 την αποστράτευση του ΕΛΑΣ. Δύο μέρες
    αργότερα άρχισαν τα Δεκεμβριανά.
