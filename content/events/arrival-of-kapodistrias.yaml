id: arrival-of-kapodistrias
title:
  en: Kapodistrias Arrives as Governor
  el: Η άφιξη του Καποδίστρια
summary:
  en: >
    Ioannis Kapodistrias, the Corfiot who had been joint foreign minister of Russia,
    reached Greece in January 1828 to take up the office of Governor to which the Third
    National Assembly at Troezen had elected him for seven years. He landed at Nafplio and
    went on to Aegina, the seat of government, where he took office. He found Ibrahim's army
    still in the Peloponnese, an empty treasury and factions in arms. Within two weeks of landing he
    had the constitution suspended, and he governed with an appointed council. His nearly four years
    in office built the first central administration Greece had, and made the enemies who
    killed him.
  el: >
    Ο Ιωάννης Καποδίστριας, ο Κερκυραίος που είχε διατελέσει συνυπουργός Εξωτερικών της
    Ρωσίας, έφτασε στην Ελλάδα τον Ιανουάριο του 1828 για να αναλάβει το αξίωμα του
    Κυβερνήτη, στο οποίο τον είχε εκλέξει για επτά χρόνια η Γ΄ Εθνοσυνέλευση της Τροιζήνας.
    Αποβιβάστηκε στο Ναύπλιο και συνέχισε για την Αίγινα, την έδρα της διοίκησης, όπου
    ανέλαβε καθήκοντα. Βρήκε τον στρατό του Ιμπραήμ ακόμη στην Πελοπόννησο, άδειο δημόσιο
    ταμείο και παρατάξεις στα όπλα. Μέσα σε δύο εβδομάδες από την άφιξή του πέτυχε την αναστολή του συντάγματος
    και κυβέρνησε με διορισμένο συμβούλιο. Τα σχεδόν τέσσερα χρόνια της διακυβέρνησής του
    έστησαν την πρώτη κεντρική διοίκηση που γνώρισε η Ελλάδα και του δημιούργησαν τους
    εχθρούς που τον σκότωσαν.
body:
  en: |
    The Third National Assembly elected Kapodistrias Governor (Kyvernitis) in the spring of
    1827, for a term of seven years. Sources date the election variously to 30 March and 2
    April Old Style, and it was made in his absence: he had stepped back from the Russian
    service in 1822 and settled in Geneva. He spent the rest of 1827 in the capitals of
    Europe looking for money and support, and before he arrived the Treaty of London of July
    1827 and the destruction of the Ottoman and Egyptian fleet at Navarino in October had
    changed the position he was coming into.

    He crossed on a British warship, with a French and a Russian vessel in company, and came
    ashore at Nafplio on 6 or 7 January 1828 Old Style (18 or 19 January); the sources differ
    by a day. Aegina, where the government sat, had been his destination, and he reached it
    on 11 or 12 January Old Style (23 or 24 January), again by different accounts. On 18
    January Old Style (30 January) the legislative body voted, at his request, to suspend the
    constitution of Troezen and dissolve itself. In its place he appointed the Panhellenion,
    a council of 27 members with advisory powers only. He took the oath of office in the
    cathedral of Aegina on 26 January Old Style (7 February), though one account gives 28
    January.

    The state he took over existed mostly on paper. Ibrahim's army still held much of the
    Peloponnese, the treasury was empty, piracy was rife in the Aegean, and the irregular
    bands lived off the population. In his first year Kapodistrias introduced the phoenix as
    the national currency, set up the National Finance Bank, began building an orphanage on
    Aegina and a quarantine system, and started to form a regular army. The Powers'
    diplomacy, and a French expeditionary force that landed in the Peloponnese in August
    1828, secured Ibrahim's departure by October. In 1829 he moved the seat of government to
    Nafplio.

    Kapodistrias governed with a centralising authority, preferring officials he chose to
    the notables, the island shipowners and the captains whom the revolution had made
    powerful. That gave the country its first working central administration, with courts,
    a postal service, schools and a currency, and it united a coalition of enemies against
    him. He was assassinated in Nafplio in October 1831. His arrival marks the point at which
    the revolution's provisional governments gave way to a state.
  el: |
    Η Γ΄ Εθνοσυνέλευση εξέλεξε τον Καποδίστρια Κυβερνήτη την άνοιξη του 1827, με επταετή
    θητεία. Οι πηγές τοποθετούν την εκλογή άλλες στις 30 Μαρτίου και άλλες στις 2 Απριλίου
    με το παλαιό ημερολόγιο, και έγινε ερήμην του: είχε αποσυρθεί από τη ρωσική υπηρεσία το
    1822 και είχε εγκατασταθεί στη Γενεύη. Πέρασε το υπόλοιπο του 1827 στις ευρωπαϊκές
    πρωτεύουσες αναζητώντας χρήματα και στήριξη, και πριν φτάσει η Συνθήκη του Λονδίνου του
    Ιουλίου 1827 και η καταστροφή του οθωμανικού και αιγυπτιακού στόλου στο Ναβαρίνο τον
    Οκτώβριο είχαν αλλάξει τη θέση που θα αναλάμβανε.

    Ταξίδεψε με βρετανικό πολεμικό πλοίο, συνοδευόμενο από ένα γαλλικό και ένα ρωσικό, και
    αποβιβάστηκε στο Ναύπλιο στις 6 ή 7 Ιανουαρίου 1828 με το παλαιό ημερολόγιο (18 ή 19
    Ιανουαρίου)· οι πηγές διαφέρουν κατά μία μέρα. Προορισμός του ήταν η Αίγινα, όπου είχε
    την έδρα της η διοίκηση, και έφτασε εκεί στις 11 ή 12 Ιανουαρίου με το παλαιό ημερολόγιο
    (23 ή 24 Ιανουαρίου), πάλι κατά διαφορετικές αφηγήσεις. Στις 18 Ιανουαρίου με το παλαιό
    ημερολόγιο (30 Ιανουαρίου) το νομοθετικό σώμα ψήφισε, κατόπιν αιτήματός του, την αναστολή
    του συντάγματος της Τροιζήνας και τη διάλυσή του. Στη θέση του ο Καποδίστριας διόρισε το
    Πανελλήνιον, συμβούλιο 27 μελών με αποκλειστικά γνωμοδοτικές αρμοδιότητες. Ορκίστηκε στη
    Μητρόπολη της Αίγινας στις 26 Ιανουαρίου με το παλαιό ημερολόγιο (7 Φεβρουαρίου), αν και
    μία αφήγηση δίνει 28 Ιανουαρίου.

    Το κράτος που παρέλαβε υπήρχε κυρίως στα χαρτιά. Ο στρατός του Ιμπραήμ κρατούσε ακόμη
    μεγάλο μέρος της Πελοποννήσου, το ταμείο ήταν άδειο, η πειρατεία οργίαζε στο Αιγαίο και τα
    άτακτα σώματα ζούσαν σε βάρος του πληθυσμού. Μέσα στον πρώτο χρόνο ο Καποδίστριας
    καθιέρωσε τον φοίνικα ως εθνικό νόμισμα, ίδρυσε την Εθνική Χρηματιστική Τράπεζα, άρχισε
    να χτίζει ορφανοτροφείο στην Αίγινα και ένα σύστημα καραντίνας και ξεκίνησε τη συγκρότηση
    τακτικού στρατού. Η διπλωματία των Δυνάμεων και ένα γαλλικό εκστρατευτικό σώμα που
    αποβιβάστηκε στην Πελοπόννησο τον Αύγουστο του 1828 εξασφάλισαν την αποχώρηση του Ιμπραήμ
    ως τον Οκτώβριο. Το 1829 μετέφερε την έδρα της διοίκησης στο Ναύπλιο.

    Ο Καποδίστριας κυβέρνησε με συγκεντρωτική εξουσία, προτιμώντας αξιωματούχους της δικής
    του επιλογής από τους προκρίτους, τους νησιώτες πλοιοκτήτες και τους οπλαρχηγούς που η
    Επανάσταση είχε κάνει ισχυρούς. Έτσι η χώρα απέκτησε την πρώτη λειτουργική κεντρική
    διοίκηση, με δικαστήρια, ταχυδρομική υπηρεσία, σχολεία και νόμισμα, και ταυτόχρονα
    συσπειρώθηκε εναντίον του ένας συνασπισμός εχθρών. Δολοφονήθηκε στο Ναύπλιο τον Οκτώβριο
    του 1831. Η άφιξή του σηματοδοτεί το σημείο όπου οι προσωρινές διοικήσεις της
    Επανάστασης έδωσαν τη θέση τους σε ένα κράτος.
