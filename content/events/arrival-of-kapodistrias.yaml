    note: >
      Public sources disagree by a day or two on every date: Nafplio 6, 7 or 8 January OS,
      Aegina 8, 11 or 12 January OS, the oath 26 or 28 January OS, the Troezen election 30
      March or 2 April OS. The span runs from the earliest Nafplio date to the latest Aegina
      date, and the text gives the alternatives rather than choosing.
