id: liberation-of-athens
title:
  en: The German withdrawal and the liberation of Athens
  el: Η απελευθέρωση της Αθήνας
summary:
  en: >
    Hitler authorised the evacuation of Greece on 23 August 1944 to avoid having Army
    Group E cut off south of the Danube. German troops left Athens overnight on 11 and 12
    October, and at 09:15 on 12 October a soldier took the swastika down from the
    Acropolis without ceremony. The occupation had lasted 1,625 days. British troops
    entered on 14 October and the government of national unity arrived on 18 October, to a
    country with roughly 300,000 dead of famine, a thousand villages burned, a worthless
    currency and its Jewish communities annihilated. Liberation lasted fifty-three days
    before the shooting began again in Syntagma Square.
  el: >
    Ο Χίτλερ ενέκρινε την εκκένωση της Ελλάδας στις 23 Αυγούστου 1944 για να μην
    αποκοπεί η Ομάδα Στρατιών Ε νότια του Δούναβη. Οι Γερμανοί έφυγαν από την Αθήνα τη
    νύχτα της 11ης προς 12η Οκτωβρίου, και στις 09:15 της 12ης Οκτωβρίου ένας στρατιώτης
    κατέβασε τη σβάστικα από την Ακρόπολη χωρίς τελετή. Η Κατοχή είχε κρατήσει 1.625 μέρες.
    Βρετανικά τμήματα μπήκαν στις 14 Οκτωβρίου και η κυβέρνηση εθνικής ενότητας έφτασε
    στις 18 Οκτωβρίου, σε μια χώρα με περίπου 300.000 νεκρούς από την πείνα, χίλια
    καμένα χωριά, νόμισμα χωρίς αξία και τις εβραϊκές της κοινότητες αφανισμένες. Η
    απελευθέρωση κράτησε πενήντα τρεις μέρες, ως τους πρώτους πυροβολισμούς στο Σύνταγμα.
body:
  en: |
    Romania changed sides in August 1944 and the Red Army's advance through the Balkans
    threatened to trap 300,000 German troops in Greece. The withdrawal ran through
    September in the Peloponnese and the islands and reached Athens on the night of 11 to
    12 October, when the garrison marched out after laying a wreath at the Tomb of the
    Unknown Soldier. Athenians filled the streets and the church bells rang across the
    city on 12 October, the date Greece keeps as the liberation of Athens.

    Operation Manna was already landing. The 4th Parachute Battalion dropped on Megara
    airfield, 45 kilometres away, on 12 October; the rest of the 2nd Parachute Brigade
    arrived on 14 October and glider-borne troops on 16 October. British forces under
    Lieutenant-General Ronald Scobie entered Athens on 14 October. For six days between
    the German departure and the government's arrival the city was run by a three-man
    committee, with ELAS units in effective control of most of it and of almost the whole
    country outside it. Georgios Papandreou arrived on 18 October, raised the Greek flag
    on the Acropolis and spoke to an enormous crowd in Syntagma Square.

    The last German and Bulgarian troops left mainland Greek soil on 3 November 1944,
    withdrawing north through Florina into Yugoslavia; some accounts give 2 November.
    German garrisons held out on Crete, Rhodes and other Aegean islands until the end of
    the war in Europe, the Dodecanese surrendering on 8 May 1945 and Crete on 12 May.
    What the government came back to was a wreck: the railways and most bridges destroyed,
    three-quarters of the merchant fleet sunk, hyperinflation, and more than a thousand
    villages burned in reprisals. It held Athens and the British held the ports. ELAS held
    the mountains and most provincial towns with about 50,000 men under arms, and no
    intention of disarming while its opponents kept their weapons.
  el: |
    Η Ρουμανία άλλαξε στρατόπεδο τον Αύγουστο του 1944 και η προέλαση του Κόκκινου Στρατού
    στα Βαλκάνια απειλούσε να εγκλωβίσει 300.000 Γερμανούς στην Ελλάδα. Η αποχώρηση κύλησε
    μέσα στον Σεπτέμβριο από την Πελοπόννησο και τα νησιά και έφτασε στην Αθήνα τη νύχτα
    της 11ης προς 12η Οκτωβρίου, όταν η φρουρά αναχώρησε αφού κατέθεσε στεφάνι στο Μνημείο
    του Άγνωστου Στρατιώτη. Οι Αθηναίοι γέμισαν τους δρόμους και οι καμπάνες χτύπησαν σε
    όλη την πόλη στις 12 Οκτωβρίου, την ημερομηνία που η Ελλάδα κρατά ως απελευθέρωση της
    Αθήνας.

    Η επιχείρηση Μάννα είχε ήδη αρχίσει. Το 4ο τάγμα αλεξιπτωτιστών ρίχτηκε στο αεροδρόμιο
    των Μεγάρων, 45 χιλιόμετρα μακριά, στις 12 Οκτωβρίου, η υπόλοιπη 2η ταξιαρχία
    αλεξιπτωτιστών έφτασε στις 14 Οκτωβρίου και τα ανεμοπορικά τμήματα στις 16. Οι
    βρετανικές δυνάμεις του αντιστράτηγου Ρόναλντ Σκόμπι μπήκαν στην Αθήνα στις 14
    Οκτωβρίου. Για έξι μέρες, από τη γερμανική αποχώρηση ως την άφιξη της κυβέρνησης, την
    πόλη διοικούσε τριμελής επιτροπή, με τα τμήματα του ΕΛΑΣ να ελέγχουν στην πράξη το
    μεγαλύτερο μέρος της και σχεδόν ολόκληρη τη χώρα έξω από αυτήν. Ο Γεώργιος Παπανδρέου
    έφτασε στις 18 Οκτωβρίου, ύψωσε την ελληνική σημαία στην Ακρόπολη και μίλησε σε
    τεράστιο πλήθος στο Σύνταγμα.

    Οι τελευταίοι Γερμανοί και Βούλγαροι στρατιώτες έφυγαν από ηπειρωτικό ελληνικό έδαφος
    στις 3 Νοεμβρίου 1944, αποσυρόμενοι βόρεια μέσω Φλώρινας προς τη Γιουγκοσλαβία, ενώ
    ορισμένες πηγές δίνουν τη 2α Νοεμβρίου. Γερμανικές φρουρές κράτησαν την Κρήτη, τη Ρόδο
    και άλλα νησιά του Αιγαίου ως το τέλος του πολέμου στην Ευρώπη: τα Δωδεκάνησα
    παραδόθηκαν στις 8 Μαΐου 1945 και η Κρήτη στις 12 Μαΐου. Η χώρα στην οποία γύρισε η
    κυβέρνηση ήταν ερείπιο: κατεστραμμένοι σιδηρόδρομοι και σχεδόν όλες οι γέφυρες, τα
    τρία τέταρτα του εμπορικού στόλου βυθισμένα, υπερπληθωρισμός και πάνω από χίλια χωριά
    καμένα στα αντίποινα. Η κυβέρνηση κρατούσε την Αθήνα και οι Βρετανοί τα λιμάνια. Ο
    ΕΛΑΣ κρατούσε τα βουνά και τις περισσότερες επαρχιακές πόλεις με περίπου 50.000
    ένοπλους, και καμία πρόθεση να αφοπλιστεί όσο οι αντίπαλοί του κρατούσαν τα όπλα τους.
