id: first-round-elas-edes
title:
  en: "The first round: ELAS against EDES"
  el: "Ο πρώτος γύρος: ΕΛΑΣ εναντίον ΕΔΕΣ"
summary:
  en: >
    In October 1943 ELAS attacked EDES in Epirus and destroyed most of the smaller
    resistance organisations elsewhere. Italy's collapse the month before had released
    large quantities of weapons, and the certainty after Stalingrad that Germany would
    lose had turned the question of who would hold Greece at liberation into the live one.
    EDES survived in a shrinking enclave on British air supply, and because the Germans
    left it alone under a tacit arrangement its critics have held against it ever since.
    The Plaka Agreement of 29 February 1944 stopped the fighting without settling
    anything; Greek historiography calls this the first round of the civil war, the
    Dekemvriana the second and 1946 to 1949 the third.
  el: >
    Τον Οκτώβριο του 1943 ο ΕΛΑΣ επιτέθηκε στον ΕΔΕΣ στην Ήπειρο και διέλυσε τις
    περισσότερες μικρότερες αντιστασιακές οργανώσεις αλλού. Η κατάρρευση της Ιταλίας τον
    προηγούμενο μήνα είχε ελευθερώσει μεγάλες ποσότητες όπλων, και η βεβαιότητα μετά το
    Στάλινγκραντ ότι η Γερμανία θα έχανε είχε κάνει επίκαιρο το ερώτημα ποιος θα κρατούσε
    την Ελλάδα την ώρα της απελευθέρωσης. Ο ΕΔΕΣ επέζησε σε έναν θύλακα που στένευε, με
    βρετανικό αεροπορικό ανεφοδιασμό και επειδή οι Γερμανοί τον άφησαν ήσυχο βάσει σιωπηρής
    συνεννόησης που οι επικριτές του δεν του τη συγχώρησαν ποτέ. Η συμφωνία της Πλάκας της
    29ης Φεβρουαρίου 1944 σταμάτησε τις μάχες χωρίς να λύσει τίποτε. Η ελληνική
    ιστοριογραφία ονομάζει το επεισόδιο πρώτο γύρο του Εμφυλίου, τα Δεκεμβριανά δεύτερο και
    το 1946 ως 1949 τρίτο.
body:
  en: |
    The attacks opened, on most accounts, on 9 or 10 October 1943. The National Bands
    Agreement of July 1943, which had put all the guerrilla armies nominally under Allied
    Middle East Command, broke down at once, and the British suspended supplies to ELAS to
    force a settlement. ELAS had the numbers and, after the Italian surrender, the
    artillery and mortars. It pushed EDES back to a coastal enclave in western Epirus
    around Zervas's base and destroyed the smaller organisations on the mainland outright.

    EDES survived for two reasons, one of which it has never lived down. The first was
    British air supply. The second was that the Germans, running Operation Panther and
    other sweeps against ELAS in the same months, did not attack it: in February 1944
    Zervas and General Hubert Lanz of XXII Mountain Corps reached what both sides treated
    as a tacit understanding not to engage each other. EAM has used this against EDES ever
    since; EDES and its defenders reply that it was a survival measure against an enemy
    that was trying to annihilate it, and the dispute has never been settled.

    The British Military Mission brokered the end of the fighting. The Plaka Agreement,
    signed at the bridge over the Arachthos on 29 February 1944, fixed a ceasefire on
    existing lines, left each army holding its ground, and bound all of them to fight only
    the Germans. It did not hold outside Epirus. On Easter Monday, 17 April 1944, ELAS
    destroyed the 5/42 Evzone Regiment of EKKA and executed many of its men including
    Colonel Dimitrios Psarros, which alienated republican and centrist opinion from EAM
    permanently. The first round left ELAS holding most of mountainous Greece, EDES
    confined to a strip of Epirus and no third force of consequence, and it drove
    anti-communist Greeks into the German-armed Security Battalions in numbers that
    supplied much of the manpower fighting ELAS in Athens in December.
  el: |
    Οι επιθέσεις άνοιξαν, κατά τις περισσότερες πηγές, στις 9 ή 10 Οκτωβρίου 1943. Η
    Συμφωνία των Εθνικών Ομάδων του Ιουλίου 1943, που είχε θέσει όλους τους αντάρτικους
    στρατούς τυπικά υπό το συμμαχικό Στρατηγείο Μέσης Ανατολής, κατέρρευσε αμέσως, και οι
    Βρετανοί ανέστειλαν τον εφοδιασμό του ΕΛΑΣ για να επιβάλουν συμβιβασμό. Ο ΕΛΑΣ είχε
    τους αριθμούς και, μετά την ιταλική παράδοση, το πυροβολικό και τους όλμους. Έσπρωξε τον
    ΕΔΕΣ σε παραθαλάσσιο θύλακα της δυτικής Ηπείρου γύρω από τη βάση του Ζέρβα και διέλυσε
    ολοσχερώς τις μικρότερες οργανώσεις της ηπειρωτικής χώρας.

    Ο ΕΔΕΣ επέζησε για δύο λόγους, από τους οποίους τον έναν δεν τον ξεπέρασε ποτέ. Ο
    πρώτος ήταν ο βρετανικός αεροπορικός ανεφοδιασμός. Ο δεύτερος ήταν ότι οι Γερμανοί, που
    τους ίδιους μήνες εκτελούσαν την επιχείρηση Πάνθηρας και άλλες εκκαθαρίσεις εναντίον
    του ΕΛΑΣ, δεν τον χτύπησαν: τον Φεβρουάριο του 1944 ο Ζέρβας και ο στρατηγός Χούμπερτ
    Λαντς του XXII ορεινού σώματος έφτασαν σε ό,τι και οι δύο πλευρές αντιμετώπισαν ως
    σιωπηρή συνεννόηση να μην αλληλοπροσβληθούν. Το ΕΑΜ το χρησιμοποιεί έκτοτε εναντίον του
    ΕΔΕΣ, ενώ ο ΕΔΕΣ και όσοι τον υπερασπίζονται απαντούν ότι ήταν μέτρο επιβίωσης απέναντι
    σε αντίπαλο που ζητούσε την εξόντωσή του. Η διαφορά δεν έχει κλείσει.

    Το τέλος των μαχών το διαπραγματεύθηκε η Βρετανική Στρατιωτική Αποστολή. Η Συμφωνία της
    Πλάκας, που υπογράφηκε στη γέφυρα του Άραχθου στις 29 Φεβρουαρίου 1944, όρισε
    κατάπαυση του πυρός στις υπάρχουσες γραμμές, άφησε τον καθένα εκεί όπου βρισκόταν και
    δέσμευσε όλους να πολεμούν μόνο τους Γερμανούς. Έξω από την Ήπειρο δεν κράτησε. Τη
    Δευτέρα του Πάσχα, 17 Απριλίου 1944, ο ΕΛΑΣ διέλυσε το 5/42 Σύνταγμα Ευζώνων της ΕΚΚΑ
    και εκτέλεσε πολλούς από τους άνδρες του, ανάμεσά τους τον συνταγματάρχη Δημήτριο
    Ψαρρό, πράξη που αποξένωσε οριστικά από το ΕΑΜ τη δημοκρατική και κεντρώα κοινή γνώμη. Ο
    πρώτος γύρος άφησε τον ΕΛΑΣ κύριο του μεγαλύτερου μέρους της ορεινής Ελλάδας, τον ΕΔΕΣ
    περιορισμένο σε μια λωρίδα της Ηπείρου και καμία τρίτη δύναμη με βάρος, και έσπρωξε
    αντικομμουνιστές Έλληνες στα γερμανοκίνητα Τάγματα Ασφαλείας σε αριθμούς που έδωσαν
    μεγάλο μέρος του έμψυχου υλικού που πολέμησε τον ΕΛΑΣ στην Αθήνα τον Δεκέμβριο.
