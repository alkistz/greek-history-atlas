id: restoration-of-the-monarchy-1935
title:
  en: The abolition of the Republic and the return of George II
  el: Η κατάλυση της Δημοκρατίας και η επάνοδος του Γεωργίου Β΄
summary:
  en: >
    On 10 October 1935 royalist officers forced Panagis Tsaldaris out, Georgios Kondylis took
    the premiership and the regency, and the Republic was declared abolished the same day. A
    plebiscite on 3 November, held under martial law with coloured ballot papers and no
    secrecy, returned 97.87 per cent for the monarchy. George II landed at Phaleron on 25
    November after eleven years abroad. He insisted on an amnesty, Kondylis refused and
    resigned, and a non-party caretaker was appointed to hold an election.
  el: >
    Στις 10 Οκτωβρίου 1935 βασιλόφρονες αξιωματικοί εξανάγκασαν τον Παναγή Τσαλδάρη σε
    παραίτηση, ο Γεώργιος Κονδύλης ανέλαβε την πρωθυπουργία και την αντιβασιλεία, και η
    Δημοκρατία κηρύχθηκε αυθημερόν καταλυμένη. Το δημοψήφισμα της 3ης Νοεμβρίου, που έγινε υπό
    στρατιωτικό νόμο με χρωματιστά ψηφοδέλτια και χωρίς μυστικότητα, έδωσε 97,87% υπέρ της
    βασιλείας. Ο Γεώργιος Β΄ αποβιβάστηκε στο Φάληρο στις 25 Νοεμβρίου, έπειτα από έντεκα
    χρόνια στο εξωτερικό. Ζήτησε αμνηστία, ο Κονδύλης αρνήθηκε και παραιτήθηκε, και ορίστηκε
    υπηρεσιακός πρωθυπουργός για να διεξαγάγει εκλογές.
body:
  en: |
    The group that moved on 10 October 1935 was made up of Georgios Kondylis, Alexandros
    Papagos, Georgios Reppas and Dimitrios Oikonomou, and its complaint against the Tsaldaris
    government was that it was taking too long over the monarchy. Tsaldaris resigned under
    pressure. Kondylis took his place, compelled President Alexandros Zaimis to resign, had
    himself proclaimed regent and declared the Republic abolished the same day. When
    parliament met, Tsaldaris and 165 People's Party deputies walked out; the 82 who stayed
    voted the change through, provisionally restored the constitution of 1911 and called a
    plebiscite.

    The plebiscite of 3 November was held under martial law and boycotted by the Venizelists,
    who had no organisation left after the March purge. Ballot papers were coloured, blue for
    the king and red for the republic, and voting was not secret. The official result was
    1,491,992 for the monarchy against 32,454 for the republic on 1,527,714 votes cast. In
    several districts the number of votes exceeded any plausible electorate, and no historian
    treats the figure as a measurement of opinion. What it measured was that no organised
    force was prepared to defend the Republic.

    George II crossed from London through France and Italy and landed at Phaleron from the
    cruiser Elli on 25 November 1935; some accounts date the voyage to 23 or 24 November. He
    proved less useful to his sponsors than they had assumed. He demanded a general political
    amnesty and a halt to the purge of the officer corps, Kondylis refused and resigned on 30
    November, and Kondylis then died suddenly on 1 February 1936. The king appointed the
    non-party law professor Konstantinos Demertzis as caretaker prime minister on 30 November
    and called an election for January. The dynasty was back; the deadlock it had been
    restored to break was not.
  el: |
    Η ομάδα που κινήθηκε στις 10 Οκτωβρίου 1935 αποτελούνταν από τον Γεώργιο Κονδύλη, τον
    Αλέξανδρο Παπάγο, τον Γεώργιο Ρέππα και τον Δημήτριο Οικονόμου, και το παράπονό της
    εναντίον της κυβέρνησης Τσαλδάρη ήταν ότι καθυστερούσε στο πολιτειακό. Ο Τσαλδάρης
    παραιτήθηκε υπό πίεση. Ο Κονδύλης πήρε τη θέση του, εξανάγκασε σε παραίτηση τον Πρόεδρο
    Αλέξανδρο Ζαΐμη, ανακηρύχθηκε αντιβασιλέας και κήρυξε την ίδια μέρα καταλυμένη τη
    Δημοκρατία. Όταν συνήλθε η Βουλή, ο Τσαλδάρης και 165 βουλευτές του Λαϊκού Κόμματος
    αποχώρησαν· οι 82 που έμειναν ψήφισαν τη μεταβολή, επανέφεραν προσωρινά το Σύνταγμα του
    1911 και προκήρυξαν δημοψήφισμα.

    Το δημοψήφισμα της 3ης Νοεμβρίου έγινε υπό στρατιωτικό νόμο και το απείχαν οι βενιζελικοί,
    που μετά την εκκαθάριση του Μαρτίου δεν είχαν οργάνωση. Τα ψηφοδέλτια ήταν χρωματιστά,
    γαλάζιο για τον βασιλιά και κόκκινο για τη δημοκρατία, και η ψηφοφορία δεν ήταν μυστική.
    Το επίσημο αποτέλεσμα ήταν 1.491.992 υπέρ της βασιλείας έναντι 32.454 υπέρ της
    δημοκρατίας, σε 1.527.714 ψήφους. Σε αρκετές περιφέρειες οι ψήφοι ξεπερνούσαν κάθε
    πιθανό εκλογικό σώμα, και κανένας ιστορικός δεν δέχεται τον αριθμό ως μέτρηση της κοινής
    γνώμης. Εκείνο που μετρούσε ήταν ότι καμιά οργανωμένη δύναμη δεν ήταν διατεθειμένη να
    υπερασπιστεί τη Δημοκρατία.

    Ο Γεώργιος Β΄ πέρασε από το Λονδίνο μέσω Γαλλίας και Ιταλίας και αποβιβάστηκε στο Φάληρο
    από το καταδρομικό Έλλη στις 25 Νοεμβρίου 1935· ορισμένες αφηγήσεις τοποθετούν το ταξίδι
    στις 23 ή 24 Νοεμβρίου. Αποδείχθηκε λιγότερο βολικός για τους υποστηρικτές του απ' ό,τι
    είχαν υπολογίσει. Ζήτησε γενική πολιτική αμνηστία και αναστολή της εκκαθάρισης του σώματος
    των αξιωματικών, ο Κονδύλης αρνήθηκε και παραιτήθηκε στις 30 Νοεμβρίου, και πέθανε
    αιφνιδίως την 1η Φεβρουαρίου 1936. Ο βασιλιάς διόρισε στις 30 Νοεμβρίου υπηρεσιακό
    πρωθυπουργό τον ανένταχτο καθηγητή του δικαίου Κωνσταντίνο Δεμερτζή και προκήρυξε εκλογές
    για τον Ιανουάριο. Η δυναστεία είχε επιστρέψει· το αδιέξοδο που υποτίθεται ότι θα έλυνε,
    όχι.
