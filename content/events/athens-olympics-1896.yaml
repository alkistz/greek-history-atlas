id: athens-olympics-1896
title:
  en: The First Modern Olympic Games
  el: Οι Α΄ σύγχρονοι Ολυμπιακοί Αγώνες
summary:
  en: >
    Two years after the Sorbonne congress founded the International Olympic Committee
    and chose Athens for the first Games, a bankrupt state staged them on private money.
    Georgios Averoff paid to rebuild the Panathenaic Stadium in marble; 241 athletes
    from fourteen nations competed in 43 events. The marathon, invented for these Games
    with no ancient precedent, was won by Spyridon Louis, a water carrier from Marousi,
    in front of a crowd put at sixty to eighty thousand. It was the only unambiguous
    success Greece had in that decade.
  el: >
    Δύο χρόνια μετά το συνέδριο της Σορβόννης που ίδρυσε τη Διεθνή Ολυμπιακή Επιτροπή
    και επέλεξε την Αθήνα για τους πρώτους Αγώνες, ένα χρεοκοπημένο κράτος τους
    διοργάνωσε με ιδιωτικά χρήματα. Ο Γεώργιος Αβέρωφ πλήρωσε την ανοικοδόμηση του
    Παναθηναϊκού Σταδίου σε μάρμαρο. Αγωνίστηκαν 241 αθλητές από δεκατέσσερα έθνη σε 43
    αγωνίσματα. Τον μαραθώνιο, αγώνισμα επινοημένο για αυτούς τους Αγώνες χωρίς αρχαίο
    προηγούμενο, τον κέρδισε ο Σπύρος Λούης, νερουλάς από το Μαρούσι, μπροστά σε πλήθος
    που υπολογίστηκε σε εξήντα ως ογδόντα χιλιάδες. Ήταν η μόνη αδιαμφισβήτητη επιτυχία
    της Ελλάδας εκείνη τη δεκαετία.
body:
  en: |
    The International Olympic Committee was founded at a congress at the Sorbonne on 23
    June 1894, which chose Athens for the first Games and elected a Greek, Demetrios
    Vikelas, as its president, on the reasoning that the president should come from the
    host country. Pierre de Coubertin, whose idea the revival was, took the secretaryship
    and waited. Trikoupis's government thought the Games unaffordable in a state that
    had defaulted the year before and refused to fund them. The organising committee
    under Crown Prince Constantine raised the money privately, by public subscription
    and a special issue of commemorative stamps. Georgios Averoff, an Epirot who had made
    a fortune in Alexandria, paid for the reconstruction of the ancient Panathenaic
    Stadium in Pentelic marble at a cost that reached 920,000 drachmas; his statue was
    unveiled at the entrance on the eve of the Games.

    The Games ran from 6 to 15 April 1896. The opening was set deliberately on 25 March
    Old Style, Greek Independence Day, which fell that year on Easter Monday in the Greek
    calendar. There were 241 athletes from fourteen nations, all men, in 43 events across
    nine sports. Greece sent by far the largest team; several of the national teams were
    single tourists who signed up when they arrived.

    The marathon was run on 10 April over about forty kilometres from the bridge at
    Marathon to the stadium. Michel Bréal had proposed it as a commemoration of a
    messenger's run that no ancient source records. Seventeen men started, thirteen of
    them Greek, and Spyridon Louis came in first in 2 hours 58 minutes and 50 seconds.
    Crown Prince Constantine and Prince George ran the last lap beside him and King
    George rose in the royal box. Louis never raced again. Greece finished with ten
    victories to the eleven of the United States and led the overall medal count. The
    closing ceremony was held on 15 April, delayed a day by rain. Greek opinion pressed
    hard for Athens to become the permanent site of the Games, and got nowhere.
  el: |
    Η Διεθνής Ολυμπιακή Επιτροπή ιδρύθηκε στο συνέδριο της Σορβόννης στις 23 Ιουνίου
    1894, το οποίο επέλεξε την Αθήνα για τους πρώτους Αγώνες και εξέλεξε πρόεδρο τον
    Έλληνα Δημήτριο Βικέλα, με το σκεπτικό ότι η προεδρία ανήκει στη διοργανώτρια χώρα.
    Ο Πιερ ντε Κουμπερτέν, στον οποίο ανήκε η ιδέα της αναβίωσης, πήρε τη θέση του
    γενικού γραμματέα και περίμενε. Η κυβέρνηση Τρικούπη θεώρησε τους Αγώνες
    απαγορευτικά ακριβούς για ένα κράτος που είχε πτωχεύσει τον προηγούμενο χρόνο και
    αρνήθηκε να τους χρηματοδοτήσει. Η οργανωτική επιτροπή υπό τον διάδοχο Κωνσταντίνο
    βρήκε τα χρήματα ιδιωτικά, με έρανο και με ειδική έκδοση αναμνηστικών
    γραμματοσήμων. Ο Γεώργιος Αβέρωφ, Ηπειρώτης που είχε κάνει περιουσία στην
    Αλεξάνδρεια, πλήρωσε την ανακατασκευή του αρχαίου Παναθηναϊκού Σταδίου με πεντελικό
    μάρμαρο, κόστος που έφτασε τις 920.000 δραχμές. Ο ανδριάντας του αποκαλύφθηκε στην
    είσοδο την παραμονή των Αγώνων.

    Οι Αγώνες διεξήχθησαν από τις 6 ως τις 15 Απριλίου 1896. Η τελετή έναρξης ορίστηκε
    επίτηδες στις 25 Μαρτίου με το παλαιό ημερολόγιο, ημέρα της εθνικής επετείου, που
    εκείνη τη χρονιά συνέπεσε με τη Δευτέρα του Πάσχα. Συμμετείχαν 241 αθλητές από
    δεκατέσσερα έθνη, όλοι άνδρες, σε 43 αγωνίσματα εννέα αθλημάτων. Η Ελλάδα έστειλε με
    διαφορά τη μεγαλύτερη αποστολή, ενώ αρκετές εθνικές ομάδες ήταν μεμονωμένοι
    περιηγητές που δήλωσαν συμμετοχή επιτόπου.

    Ο μαραθώνιος έγινε στις 10 Απριλίου, σε διαδρομή περίπου σαράντα χιλιομέτρων από τη
    γέφυρα του Μαραθώνα ως το Στάδιο. Τον είχε προτείνει ο Μισέλ Μπρεάλ ως ανάμνηση μιας
    διαδρομής αγγελιοφόρου που καμία αρχαία πηγή δεν καταγράφει. Ξεκίνησαν δεκαεπτά
    δρομείς, οι δεκατρείς Έλληνες, και πρώτος τερμάτισε ο Σπύρος Λούης σε 2 ώρες 58 λεπτά
    και 50 δευτερόλεπτα. Ο διάδοχος Κωνσταντίνος και ο πρίγκιπας Γεώργιος έτρεξαν δίπλα
    του τον τελευταίο γύρο και ο βασιλιάς Γεώργιος σηκώθηκε όρθιος στο βασιλικό θεωρείο.
    Ο Λούης δεν ξαναγωνίστηκε ποτέ. Η Ελλάδα τελείωσε με δέκα νίκες έναντι έντεκα των
    Ηνωμένων Πολιτειών και προηγήθηκε στο συνολικό μετάλλιο. Η τελετή λήξης έγινε στις 15
    Απριλίου, με μία μέρα καθυστέρηση λόγω βροχής. Η ελληνική κοινή γνώμη πίεσε έντονα να
    γίνει η Αθήνα μόνιμη έδρα των Αγώνων, χωρίς αποτέλεσμα.
