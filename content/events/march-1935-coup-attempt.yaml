id: march-1935-coup-attempt
title:
  en: The failed Venizelist coup of March 1935
  el: Το κίνημα της 1ης Μαρτίου 1935
summary:
  en: >
    Venizelist officers rose on the night of 1 March 1935, seized most of the fleet and
    units of two army corps in Macedonia and Thrace, and planned a provisional government at
    Thessaloniki. Athens held, Kondylis broke the rebel front within ten days, and the fleet
    sailed to Crete instead. Three officers were shot at Goudi on 24 April and more than a
    thousand were cashiered. The purge removed the republican officer corps, which was the
    only institution still guaranteeing the Republic.
  el: >
    Βενιζελικοί αξιωματικοί κινήθηκαν τη νύχτα της 1ης Μαρτίου 1935, κατέλαβαν το μεγαλύτερο
    μέρος του στόλου και μονάδες δύο σωμάτων στρατού στη Μακεδονία και τη Θράκη, με σχέδιο
    προσωρινή κυβέρνηση στη Θεσσαλονίκη. Η Αθήνα κρατήθηκε, ο Κονδύλης διέσπασε το μέτωπο των
    κινηματιών μέσα σε δέκα μέρες, και ο στόλος κατέληξε στην Κρήτη. Τρεις αξιωματικοί
    εκτελέστηκαν στο Γουδί στις 24 Απριλίου και πάνω από χίλιοι αποτάχθηκαν. Η εκκαθάριση
    εξάλειψε το δημοκρατικό στοιχείο από τον στρατό, τον μόνο θεσμό που εγγυόταν ακόμη τη
    Δημοκρατία.
body:
  en: |
    The rising was organised by the Military League of Venizelist officers, with Nikolaos
    Plastiras designated its leader and Venizelos lending it his name and, from Crete, its
    political direction. It broke out on the night of 1 March 1935. The conspirators took
    most of the fleet at anchor, including the armoured cruiser Averof, and units of the I
    and IV Army Corps in Macedonia and Thrace; the intention was to establish a provisional
    government at Thessaloniki, as Venizelos had done once before.

    In Athens it misfired at once. Loyal units held the capital within hours, and Plastiras,
    who had come over from exile in France, judged the thing lost and went back abroad. The
    fleet, which should have supported the northern front, sailed instead for Crete, where
    Venizelos took command of the insurgent forces on the island. The government of Panagis
    Tsaldaris put Georgios Kondylis in charge of the counter-offensive; he broke the rebel
    line in Macedonia in the second week of March and the rising was over by the eleventh.
    Venizelos escaped by fishing boat to Kasos and thence to Italy and Paris, where he died
    on 18 March 1936. He and Plastiras were condemned to death in absentia.

    The reprisals mattered more than the rising. Generals Anastasios Papoulas and Miltiadis
    Koimisis and major Stamatis Volanis were shot at Goudi on 24 April 1935. Papoulas had
    commanded the Army of Asia Minor in 1921 and 1922. Over a thousand officers were
    cashiered, the armed forces were purged of republicans, and special courts sentenced
    hundreds of civilians. Elections for a constituent assembly on 9 June were boycotted by
    every Venizelist party and gave the People's Party and its allies 287 of 300 seats. Four
    months later the same Kondylis who had saved the Republic from Pangalos in 1926, and the
    Tsaldaris government from the Venizelists in March, abolished the Republic himself.
  el: |
    Το κίνημα οργανώθηκε από τον Στρατιωτικό Σύνδεσμο των βενιζελικών αξιωματικών, με αρχηγό
    τον Νικόλαο Πλαστήρα και με τον Βενιζέλο να του δίνει το όνομά του και, από την Κρήτη,
    την πολιτική του κατεύθυνση. Ξέσπασε τη νύχτα της 1ης Μαρτίου 1935. Οι κινηματίες
    κατέλαβαν το μεγαλύτερο μέρος του αγκυροβολημένου στόλου, μαζί και το θωρηκτό Αβέρωφ,
    καθώς και μονάδες του Α΄ και του Δ΄ Σώματος Στρατού στη Μακεδονία και τη Θράκη· σκοπός
    ήταν προσωρινή κυβέρνηση στη Θεσσαλονίκη, όπως είχε κάνει ο Βενιζέλος μια φορά στο
    παρελθόν.

    Στην Αθήνα απέτυχε αμέσως. Πιστές μονάδες κράτησαν την πρωτεύουσα μέσα σε λίγες ώρες, και
    ο Πλαστήρας, που είχε έρθει από την εξορία του στη Γαλλία, έκρινε το παιχνίδι χαμένο και
    επέστρεψε στο εξωτερικό. Ο στόλος, αντί να υποστηρίξει το βόρειο μέτωπο, έπλευσε προς την
    Κρήτη, όπου ο Βενιζέλος ανέλαβε τη διοίκηση των δυνάμεων του νησιού. Η κυβέρνηση Παναγή
    Τσαλδάρη ανέθεσε στον Γεώργιο Κονδύλη την αντεπίθεση· διέσπασε το μέτωπο στη Μακεδονία τη
    δεύτερη εβδομάδα του Μαρτίου και το κίνημα είχε καταρρεύσει ως τις 11. Ο Βενιζέλος
    διέφυγε με ψαροκάικο στην Κάσο και από εκεί στην Ιταλία και στο Παρίσι, όπου πέθανε στις
    18 Μαρτίου 1936. Ο ίδιος και ο Πλαστήρας καταδικάστηκαν ερήμην σε θάνατο.

    Τα αντίποινα μέτρησαν περισσότερο από το ίδιο το κίνημα. Οι στρατηγοί Αναστάσιος
    Παπούλας και Μιλτιάδης Κοιμήσης και ο ταγματάρχης Σταμάτης Βολάνης εκτελέστηκαν στο Γουδί
    στις 24 Απριλίου 1935. Ο Παπούλας είχε διοικήσει τη Στρατιά Μικράς Ασίας το 1921 και το
    1922. Πάνω από χίλιοι αξιωματικοί αποτάχθηκαν, ο στρατός εκκαθαρίστηκε από τους
    δημοκρατικούς και έκτακτα δικαστήρια καταδίκασαν εκατοντάδες πολίτες. Τις εκλογές για
    συντακτική συνέλευση στις 9 Ιουνίου τις απείχαν όλα τα βενιζελικά κόμματα και έδωσαν στο
    Λαϊκό Κόμμα και τους συμμάχους του 287 από τις 300 έδρες. Τέσσερις μήνες αργότερα ο ίδιος
    Κονδύλης που είχε σώσει τη Δημοκρατία από τον Πάγκαλο το 1926, και την κυβέρνηση Τσαλδάρη
    από τους βενιζελικούς τον Μάρτιο, την κατέλυσε ο ίδιος.
