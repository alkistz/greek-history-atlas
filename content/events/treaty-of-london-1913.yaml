id: treaty-of-london-1913
title:
  en: The Treaty of London
  el: Η Συνθήκη του Λονδίνου
summary:
  en: >
    The treaty that ended the First Balkan War stripped the Ottoman Empire of every
    European possession west of a line from Enez on the Aegean to Midye on the Black Sea,
    leaving it Constantinople and its immediate hinterland. The Sultan renounced Crete. It
    did not, however, divide the conquered provinces among the victors, and it reserved
    both Albania's frontiers and the fate of the north-eastern Aegean islands to the Great
    Powers. Those two omissions started the Second Balkan War within a month and left
    Greece's northern and eastern gains unfixed for another year.
  el: >
    Η συνθήκη που έκλεισε τον Α΄ Βαλκανικό Πόλεμο αφαίρεσε από την Οθωμανική Αυτοκρατορία
    κάθε ευρωπαϊκή κτήση δυτικά της γραμμής Αίνου στο Αιγαίο και Μήδειας στον Εύξεινο,
    αφήνοντάς της την Κωνσταντινούπολη και την άμεση ενδοχώρα της. Ο σουλτάνος παραιτήθηκε
    από κάθε δικαίωμα στην Κρήτη. Δεν μοίρασε όμως τις κατακτημένες επαρχίες ανάμεσα στους
    νικητές και παρέπεμψε τόσο τα σύνορα της Αλβανίας όσο και την τύχη των νησιών του
    βορειοανατολικού Αιγαίου στις Μεγάλες Δυνάμεις. Οι δύο αυτές παραλείψεις άναψαν τον Β΄
    Βαλκανικό Πόλεμο μέσα σε έναν μήνα και άφησαν τα ελληνικά κέρδη στον βορρά και στην
    ανατολή αρρύθμιστα για έναν ακόμη χρόνο.
body:
  en: |
    The London conference had been sitting since December 1912 and had collapsed once. The
    Ottoman delegation was withdrawn by Enver Pasha after the coup d'état of 23 January
    1913 and the war resumed; the Ottomans came back to the table only after Adrianople
    fell. The treaty was signed on 17/30 May 1913 by the Ottoman Empire and the four allies,
    Bulgaria, Serbia, Greece and Montenegro, with the six Great Powers as guarantors.
    Eleftherios Venizelos led the Greek delegation and signed for Greece.

    Article by article it was a transfer to the alliance rather than to its members. The
    Enez to Midye line ended Ottoman Europe. The Sultan gave up Crete to the four allied
    sovereigns jointly, which is the legal end of a suzerainty that had been a fiction
    since 1898. Albania's independence and its borders went to the Powers, who had already
    resolved to make it an autonomous principality; that decision took out of Greek hands
    the Epirot districts the Greek army was holding. The islands Greece had occupied in the
    winter were likewise left to the Powers to award.

    The treaty divided nothing. Bulgaria had taken the heaviest losses in Thrace and
    believed Macedonia had been promised to her by implication; Greece held Thessaloniki
    and Serbia held the Vardar valley, and neither would give them up. The allies went to
    war with each other on 16/29 June, five weeks after signing. For the atlas the Treaty of
    London is the instrument that ends Ottoman sovereignty over Macedonia, Epirus and
    Crete, and the Treaty of Bucharest three months later is the one that says who gets
    them.
  el: |
    Η διάσκεψη του Λονδίνου συνεδρίαζε από τον Δεκέμβριο του 1912 και είχε ήδη ναυαγήσει μια
    φορά. Ο Ενβέρ πασάς ανακάλεσε την οθωμανική αντιπροσωπεία μετά το πραξικόπημα της 23ης
    Ιανουαρίου 1913 και ο πόλεμος ξανάρχισε. Οι Οθωμανοί επέστρεψαν στο τραπέζι μόνο μετά
    την πτώση της Αδριανούπολης. Η συνθήκη υπογράφηκε στις 17/30 Μαΐου 1913 από την
    Οθωμανική Αυτοκρατορία και τους τέσσερις συμμάχους, Βουλγαρία, Σερβία, Ελλάδα και
    Μαυροβούνιο, με εγγυήτριες τις έξι Μεγάλες Δυνάμεις. Την ελληνική αντιπροσωπεία
    οδηγούσε και υπέγραψε ο Ελευθέριος Βενιζέλος.

    Κατ' άρθρον, επρόκειτο για μεταβίβαση προς τη συμμαχία και όχι προς τα μέλη της. Η
    γραμμή Αίνου-Μήδειας τερμάτισε την οθωμανική Ευρώπη. Ο σουλτάνος παραχώρησε την Κρήτη
    από κοινού στους τέσσερις συμμάχους ηγεμόνες, κλείνοντας νομικά μια επικυριαρχία που
    ήταν πλάσμα από το 1898. Η ανεξαρτησία και τα σύνορα της Αλβανίας πέρασαν στις Δυνάμεις,
    οι οποίες είχαν ήδη αποφασίσει να τη συστήσουν ως αυτόνομη ηγεμονία. Η απόφαση αυτή
    αφαιρούσε από τα ελληνικά χέρια τις ηπειρωτικές περιοχές που κρατούσε ο ελληνικός
    στρατός. Τα νησιά που είχε καταλάβει η Ελλάδα τον χειμώνα αφέθηκαν επίσης στην κρίση των
    Δυνάμεων.

    Η συνθήκη δεν μοίρασε τίποτε. Η Βουλγαρία είχε τις βαρύτερες απώλειες στη Θράκη και
    θεωρούσε ότι η Μακεδονία της είχε υποσχεθεί εμμέσως. Η Ελλάδα κρατούσε τη Θεσσαλονίκη
    και η Σερβία την κοιλάδα του Αξιού, και καμία δεν επρόκειτο να τις αφήσει. Οι σύμμαχοι
    πολέμησαν μεταξύ τους στις 16/29 Ιουνίου, πέντε εβδομάδες μετά την υπογραφή. Για τον
    άτλαντα η Συνθήκη του Λονδίνου είναι το κείμενο που τερματίζει την οθωμανική κυριαρχία
    σε Μακεδονία, Ήπειρο και Κρήτη, και η Συνθήκη του Βουκουρεστίου τρεις μήνες αργότερα
    είναι εκείνο που λέει σε ποιον ανήκουν.
