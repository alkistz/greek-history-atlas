id: battle-of-kilkis-lachanas
title:
  en: The Second Balkan War and the battle of Kilkis and Lachanas
  el: Ο Β΄ Βαλκανικός Πόλεμος και η μάχη Κιλκίς-Λαχανά
summary:
  en: >
    Bulgaria attacked its former allies without declaring war, and the decisive Greek
    action followed within a fortnight along an 80-kilometre front from the Gulf of
    Orfanos to Gevgelija. About 118,000 Greeks under King Constantine attacked 75,000
    Bulgarians in prepared positions on the heights and took them frontally, losing 8,828
    killed and wounded against 6,971 Bulgarian. It was the worst Bulgarian defeat of the
    war. Kilkis was burned and its roughly 13,000 Bulgarian-identifying inhabitants left or
    were driven out, and the town was resettled with Greek refugees, which is how the map
    of Greek Macedonia acquired its present population as well as its present borders.
  el: >
    Η Βουλγαρία επιτέθηκε στους πρώην συμμάχους της χωρίς κήρυξη πολέμου, και η κρίσιμη
    ελληνική ενέργεια ήρθε μέσα σε δεκαπέντε μέρες, σε μέτωπο 80 χιλιομέτρων από τον
    Ορφανικό κόλπο ως τη Γευγελή. Περίπου 118.000 Έλληνες υπό τον βασιλιά Κωνσταντίνο
    επιτέθηκαν σε 75.000 Βουλγάρους οχυρωμένους στα υψώματα και τους έδιωξαν με κατά μέτωπο
    επιθέσεις, χάνοντας 8.828 νεκρούς και τραυματίες έναντι 6.971 βουλγαρικών. Ήταν η
    χειρότερη βουλγαρική ήττα του πολέμου. Το Κιλκίς κάηκε και οι περίπου 13.000 κάτοικοί
    του με βουλγαρική συνείδηση έφυγαν ή εκδιώχθηκαν, ενώ η πόλη επανεποικίστηκε με Έλληνες
    πρόσφυγες. Έτσι απέκτησε η ελληνική Μακεδονία τον σημερινό της πληθυσμό μαζί με τα
    σημερινά της σύνορα.
body:
  en: |
    Greece and Serbia had been cohabiting uneasily with Bulgarian troops in territory they
    had taken together, and on 19 May/1 June 1913 they signed a treaty of peace, friendship
    and mutual protection at Thessaloniki, with a military convention committing each to
    the other's defence. Article 3 fixed the Greek and Serbian frontier on the line between
    the two armies, which is the origin of Greece's northern border in western Macedonia.
    Bulgaria attacked both of them without a declaration of war on the night of 16/29 June.

    The Greek army, about 117,861 men with 176 guns in eight infantry divisions and a
    cavalry brigade under the King, faced the Bulgarian 2nd Army of 75,076 men with 175
    guns under General Nikola Ivanov. The battle was fought from 19 to 21 June Old Style, 2
    to 4 July New Style, against entrenchments on the heights around Kilkis and Lachanas.
    The Greeks attacked frontally and paid more than the defenders did: 8,828 Greek
    casualties against 6,971 Bulgarian, with a further 2,500 Bulgarians taken prisoner and
    19 guns lost. Kilkis, Lachanas, Nigrita, Karakoli and Gevgelija fell, and the Bulgarian
    2nd Army ceased to be an army.

    The pursuit went badly. Ivanov regrouped and at the Kresna Gorge in late July came near
    to encircling the Greeks; what ended the war was Romania marching unopposed on Sofia.
    Total losses for the war are put at about 76,000 combat casualties, Bulgaria alone
    recording 65,927 killed or wounded. The Treaty of Bucharest of 10 August gave Greece
    Macedonia as far as the Nestos, with Kavala. Kilkis itself was destroyed after the
    battle and its Bulgarian population left or was expelled; refugees from Ottoman
    territory and from Bulgaria, principally from Strumica, took their place. The frontier
    the war drew and the population exchange that followed it are the same event seen from
    two angles.
  el: |
    Η Ελλάδα και η Σερβία συγκατοικούσαν με δυσκολία με βουλγαρικά στρατεύματα σε εδάφη που
    είχαν πάρει μαζί, και στις 19 Μαΐου/1 Ιουνίου 1913 υπέγραψαν στη Θεσσαλονίκη συνθήκη
    ειρήνης, φιλίας και αμοιβαίας προστασίας, με στρατιωτική σύμβαση που δέσμευε την καθεμιά
    στην άμυνα της άλλης. Το άρθρο 3 καθόριζε το ελληνοσερβικό σύνορο πάνω στη γραμμή
    επαφής των δύο στρατών, και από εκεί προέρχεται το βόρειο σύνορο της Ελλάδας στη δυτική
    Μακεδονία. Η Βουλγαρία επιτέθηκε και στις δύο χωρίς κήρυξη πολέμου τη νύχτα της 16/29
    Ιουνίου.

    Ο ελληνικός στρατός, περίπου 117.861 άνδρες με 176 πυροβόλα σε οκτώ μεραρχίες πεζικού
    και μία ταξιαρχία ιππικού υπό τον βασιλιά, αντιμετώπισε τη βουλγαρική 2η Στρατιά των
    75.076 ανδρών με 175 πυροβόλα υπό τον στρατηγό Νικόλα Ιβάνοφ. Η μάχη δόθηκε από τις 19
    ως τις 21 Ιουνίου με το παλαιό ημερολόγιο, 2 ως 4 Ιουλίου με το νέο, απέναντι σε
    οργανωμένα χαρακώματα στα υψώματα γύρω από το Κιλκίς και τον Λαχανά. Οι Έλληνες
    επιτέθηκαν κατά μέτωπο και πλήρωσαν περισσότερο από τους αμυνόμενους: 8.828 απώλειες
    έναντι 6.971 βουλγαρικών, με άλλους 2.500 Βουλγάρους αιχμαλώτους και 19 πυροβόλα
    χαμένα. Έπεσαν το Κιλκίς, ο Λαχανάς, η Νιγρίτα, το Καρακόλι και η Γευγελή, και η
    βουλγαρική 2η Στρατιά έπαψε να είναι στρατιά.

    Η καταδίωξη πήγε άσχημα. Ο Ιβάνοφ ανασυντάχθηκε και στα στενά της Κρέσνας, στα τέλη
    Ιουλίου, παραλίγο να κυκλώσει τους Έλληνες. Τον πόλεμο τον τερμάτισε η Ρουμανία, που
    βάδισε ανενόχλητη προς τη Σόφια. Οι συνολικές απώλειες υπολογίζονται σε περίπου 76.000
    μάχιμους, με τη Βουλγαρία μόνη να καταγράφει 65.927 νεκρούς και τραυματίες. Η Συνθήκη
    του Βουκουρεστίου της 10ης Αυγούστου έδωσε στην Ελλάδα τη Μακεδονία ως τον Νέστο, μαζί
    με την Καβάλα. Το ίδιο το Κιλκίς καταστράφηκε μετά τη μάχη και ο βουλγαρικός του
    πληθυσμός έφυγε ή εκδιώχθηκε. Τη θέση του πήραν πρόσφυγες από οθωμανικά εδάφη και από τη
    Βουλγαρία, κυρίως από τη Στρώμνιτσα. Το σύνορο που χάραξε ο πόλεμος και η μετακίνηση
    πληθυσμών που ακολούθησε είναι το ίδιο γεγονός ιδωμένο από δύο πλευρές.
