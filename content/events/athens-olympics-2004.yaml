id: athens-olympics-2004
title:
  en: The Athens Olympic Games
  el: Οι Ολυμπιακοί Αγώνες της Αθήνας 2004
summary:
  en: >
    The Games of the XXVIII Olympiad ran from 13 to 29 August 2004, with 10,557 athletes
    from 201 national committees in 301 events. Athens had lost the centenary Games of
    1996 to Atlanta and won these in 1997 under the motto "Welcome Home". The
    preparation rebuilt Attica: the metro extensions, the ring road, the suburban
    railway, the tram and the new airport all belong to the Olympic programme. The
    organising budget was about three billion euros, but estimates of the total public
    cost run from nine to eleven billion, and after 2009 the unused venues became a
    standard reproach in every argument about Greek public spending.
  el: >
    Οι Αγώνες της 28ης Ολυμπιάδας διεξήχθησαν από τις 13 ως τις 29 Αυγούστου 2004, με
    10.557 αθλητές από 201 εθνικές επιτροπές σε 301 αγωνίσματα. Η Αθήνα είχε χάσει τους
    Αγώνες της εκατονταετηρίδας του 1996 από την Ατλάντα και κέρδισε αυτούς το 1997, με
    σύνθημα «Καλώς ήρθατε σπίτι». Η προετοιμασία ξαναέχτισε την Αττική: οι επεκτάσεις του
    μετρό, η Αττική Οδός, ο προαστιακός, το τραμ και το νέο αεροδρόμιο ανήκουν όλα στο
    ολυμπιακό πρόγραμμα. Ο προϋπολογισμός της διοργάνωσης ήταν περίπου τρία
    δισεκατομμύρια ευρώ, αλλά οι εκτιμήσεις για το συνολικό δημόσιο κόστος κυμαίνονται
    από εννέα ως έντεκα δισεκατομμύρια, και μετά το 2009 τα αχρησιμοποίητα γήπεδα έγιναν
    πάγιο επιχείρημα σε κάθε συζήτηση για τις δημόσιες δαπάνες.
body:
  en: |
    The bid was won on 5 September 1997 and led by Gianna Angelopoulos-Daskalaki, who
    also chaired the organising committee from 2000 until after the Games. Much of the
    building was finished only in the final weeks. The Games themselves went without a
    serious incident, at a security cost of more than a billion euros in the climate
    that followed September 2001. President Konstantinos Stephanopoulos opened them and
    the windsurfer Nikolaos Kaklamanakis lit the cauldron; the shot put was held at
    ancient Olympia and the marathon run from Marathon to the Panathenaic Stadium, where
    the first modern Games had finished in 1896.

    Kostas Karamanlis had become Prime Minister in March 2004, five months before the
    opening, and inherited the Games from the Simitis government that had built them.
    Greece won sixteen medals, six of them gold. Five weeks before the opening, on
    4 July 2004, the national football team had won the European Championship.

    The two victories together mark the high point of Greek national confidence, and the
    accounting arrived later. Official cost figures remain contested: the organising
    budget was roughly three billion euros, while Greek finance ministry and academic
    estimates of the full public cost, including infrastructure and security, range from
    about nine to about eleven billion. Several purpose-built venues were never given a
    use. Whether the Olympic programme caused the debt crisis or merely coincided with
    the years of cheap borrowing is an argument that has never been settled, but the
    phrase "Olympic legacy" acquired its Greek meaning in the years after 2009, and it
    is not a compliment.
  el: |
    Η διεκδίκηση κερδήθηκε στις 5 Σεπτεμβρίου 1997 με επικεφαλής τη Γιάννα
    Αγγελοπούλου-Δασκαλάκη, η οποία προήδρευσε και της οργανωτικής επιτροπής από το 2000
    ως μετά τους Αγώνες. Μεγάλο μέρος των έργων παραδόθηκε μόλις τις τελευταίες
    εβδομάδες. Οι ίδιοι οι Αγώνες κύλησαν χωρίς σοβαρό επεισόδιο, με κόστος ασφάλειας
    πάνω από ένα δισεκατομμύριο ευρώ στο κλίμα που ακολούθησε τον Σεπτέμβριο του 2001.
    Τους κήρυξε ο Πρόεδρος της Δημοκρατίας Κωνσταντίνος Στεφανόπουλος και τη φλόγα
    άναψε ο ιστιοσανιδοδρόμος Νίκος Κακλαμανάκης. Η σφαιροβολία έγινε στην αρχαία Ολυμπία
    και ο μαραθώνιος τρέχτηκε από τον Μαραθώνα ως το Παναθηναϊκό Στάδιο, εκεί όπου είχαν
    τερματίσει οι πρώτοι σύγχρονοι Αγώνες του 1896.

    Ο Κώστας Καραμανλής είχε γίνει πρωθυπουργός τον Μάρτιο του 2004, πέντε μήνες πριν
    από την τελετή έναρξης, και κληρονόμησε τους Αγώνες από την κυβέρνηση Σημίτη που τους
    είχε χτίσει. Η Ελλάδα κέρδισε δεκαέξι μετάλλια, τα έξι χρυσά. Πέντε εβδομάδες πριν
    από την έναρξη, στις 4 Ιουλίου 2004, η εθνική ομάδα ποδοσφαίρου είχε κατακτήσει το
    Ευρωπαϊκό Πρωτάθλημα ποδοσφαίρου.

    Οι δύο νίκες μαζί σημαδεύουν την κορύφωση της εθνικής αυτοπεποίθησης, και ο
    λογαριασμός ήρθε αργότερα. Τα επίσημα μεγέθη του κόστους παραμένουν αμφισβητούμενα:
    ο προϋπολογισμός της διοργάνωσης ήταν περίπου τρία δισεκατομμύρια ευρώ, ενώ
    εκτιμήσεις του υπουργείου Οικονομικών και ακαδημαϊκών για το συνολικό δημόσιο κόστος,
    με τα έργα υποδομής και την ασφάλεια, κυμαίνονται από εννέα ως έντεκα δισεκατομμύρια.
    Αρκετές αθλητικές εγκαταστάσεις δεν βρήκαν ποτέ χρήση. Το αν το ολυμπιακό πρόγραμμα
    προκάλεσε την κρίση χρέους ή απλώς συνέπεσε με τα χρόνια του φθηνού δανεισμού δεν
    έχει κριθεί ποτέ, όμως η φράση «ολυμπιακή κληρονομιά» απέκτησε το ελληνικό της νόημα
    μετά το 2009, και δεν είναι φιλοφρόνηση.
