id: september-1843-revolution
title:
  en: The Revolution of 3 September 1843
  el: Η Επανάσταση της 3ης Σεπτεμβρίου 1843
summary:
  en: >
    On the night of 14 to 15 September 1843 the Athens garrison surrounded the royal
    palace and refused to disperse until Otto agreed to a constitution. Not a shot was
    fired. The king dismissed his Bavarian ministers, called a National Assembly, and
    assented the following March to a text that gave Greece a parliament and near
    universal suffrage for men. The square in front of the palace has been called
    Syntagma, Constitution Square, ever since.
  el: >
    Τη νύχτα της 2ας προς 3η Σεπτεμβρίου 1843 η φρουρά της Αθήνας περικύκλωσε τα
    ανάκτορα και αρνήθηκε να διαλυθεί ώσπου ο Όθων να δεχθεί σύνταγμα. Δεν έπεσε
    ντουφεκιά. Ο βασιλιάς απέπεμψε τους Βαβαρούς υπουργούς του, συγκάλεσε Εθνοσυνέλευση
    και τον επόμενο Μάρτιο επικύρωσε κείμενο που έδινε στην Ελλάδα βουλή και σχεδόν
    καθολική ψήφο για τους άνδρες. Η πλατεία μπροστά στα ανάκτορα ονομάζεται από τότε
    Πλατεία Συντάγματος.
body:
  en: |
    Ten years of Bavarian government had left almost everyone with a grievance. The
    regency had dissolved the irregular bands of the War of Independence and replaced
    them with a standing army on Bavarian lines, which cost the old kapetanioi their
    commands and their income. The sixty million franc loan of 1832 was spent, and the
    treasury could not pay the instalments the Powers demanded. Britain and France, for
    reasons of their own, pressed for constitutional government; Russia's party in
    Athens wanted the Bavarians gone for reasons of its own.

    The conspiracy was organised chiefly by Ioannis Makriyannis, a general of the
    revolution whose house was watched by the police, and carried out by Colonel
    Dimitrios Kallergis of the cavalry, with the infantry under Nikolaos Skarvelis and
    the cadets of the Military Academy. They surrounded the palace before dawn on 3
    September Old Style. Otto held out for several hours, looked for help from the
    ministers who had none to give, and gave way.

    The National Assembly met on 20 November 1843 with 244 deputies and sat until March.
    Its bitterest fight was over the autochthon decree, which would have barred Greeks
    born outside the kingdom from state employment; Ioannis Kolettis defeated it with
    the speech that gave the Great Idea its lasting form. Otto assented to the
    Constitution on 30 March 1844. It created a bicameral legislature, an appointed
    Senate and an elected Chamber, and left the king free to appoint and dismiss
    ministers as he pleased. He used that freedom for eighteen more years, and it was
    what finally cost him the throne.
  el: |
    Δέκα χρόνια βαβαρικής διοίκησης είχαν αφήσει σχεδόν τους πάντες με ένα παράπονο. Η
    Αντιβασιλεία είχε διαλύσει τα άτακτα σώματα του Αγώνα και τα είχε αντικαταστήσει με
    τακτικό στρατό βαβαρικού τύπου, στερώντας από τους παλιούς καπεταναίους το αξίωμα
    και τον μισθό τους. Το δάνειο των εξήντα εκατομμυρίων φράγκων του 1832 είχε
    εξαντληθεί και το δημόσιο ταμείο αδυνατούσε να πληρώσει τις δόσεις που απαιτούσαν οι
    Δυνάμεις. Η Αγγλία και η Γαλλία πίεζαν για συνταγματική διακυβέρνηση, ενώ το ρωσικό
    κόμμα ήθελε τους Βαβαρούς εκτός για δικούς του λόγους.

    Την οργάνωση της συνωμοσίας είχε κυρίως ο Ιωάννης Μακρυγιάννης, στρατηγός του Αγώνα
    με το σπίτι του υπό αστυνομική παρακολούθηση, και την εκτέλεση ο συνταγματάρχης του
    ιππικού Δημήτριος Καλλέργης, με το πεζικό υπό τον Νικόλαο Σκαρβέλη και τους
    ευέλπιδες της Στρατιωτικής Σχολής. Περικύκλωσαν τα ανάκτορα πριν ξημερώσει η 3η
    Σεπτεμβρίου. Ο Όθων αντιστάθηκε μερικές ώρες, ζήτησε βοήθεια από υπουργούς που δεν
    είχαν να του δώσουν καμία, και υποχώρησε.

    Η Εθνοσυνέλευση συνήλθε στις 20 Νοεμβρίου 1843 με 244 πληρεξουσίους και συνεδρίασε
    ως τον Μάρτιο. Η πιο σκληρή της σύγκρουση αφορούσε το ψήφισμα περί αυτοχθόνων, που
    θα απέκλειε από τις δημόσιες θέσεις τους Έλληνες που γεννήθηκαν έξω από το βασίλειο.
    Ο Ιωάννης Κωλέττης το κατατρόπωσε με τον λόγο που έδωσε στη Μεγάλη Ιδέα τη
    διατύπωση με την οποία έμεινε. Ο Όθων επικύρωσε το Σύνταγμα στις 30 Μαρτίου 1844.
    Καθιέρωνε δύο σώματα, διορισμένη Γερουσία και αιρετή Βουλή, και άφηνε στον βασιλιά
    το δικαίωμα να διορίζει και να παύει υπουργούς κατά βούληση. Το χρησιμοποίησε επί
    δεκαοκτώ ακόμη χρόνια, και αυτό τελικά του στοίχισε τον θρόνο.
