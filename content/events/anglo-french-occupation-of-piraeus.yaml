id: anglo-french-occupation-of-piraeus
title:
  en: The Anglo-French Occupation of Piraeus
  el: Η Αγγλογαλλική Κατοχή του Πειραιά
summary:
  en: >
    When the Crimean War began, Greek irregulars crossed into Ottoman Epirus, Thessaly
    and Macedonia with the court's tacit blessing. Britain and France demanded
    neutrality and, when the ultimatum expired, landed troops at Piraeus and kept them
    there for nearly three years. Otto was made to accept a ministry of the Powers'
    choosing, and the French brought cholera ashore with them, killing around three
    thousand people in Athens and Piraeus. The occupation ended in February 1857 with an
    international commission left behind to audit Greek finances.
  el: >
    Με την έναρξη του Κριμαϊκού Πολέμου, ελληνικά άτακτα σώματα πέρασαν στην οθωμανική
    Ήπειρο, τη Θεσσαλία και τη Μακεδονία με τη σιωπηρή ευλογία της Αυλής. Η Αγγλία και η
    Γαλλία απαίτησαν ουδετερότητα και, όταν έληξε το τελεσίγραφο, αποβίβασαν στρατό στον
    Πειραιά και τον κράτησαν εκεί σχεδόν τρία χρόνια. Ο Όθων αναγκάστηκε να δεχθεί
    κυβέρνηση της επιλογής των Δυνάμεων, ενώ οι Γάλλοι έφεραν μαζί τους τη χολέρα, που
    σκότωσε περίπου τρεις χιλιάδες ανθρώπους σε Αθήνα και Πειραιά. Η κατοχή έληξε τον
    Φεβρουάριο του 1857, αφήνοντας πίσω της διεθνή επιτροπή ελέγχου των ελληνικών
    οικονομικών.
body:
  en: |
    Britain and France went to war with Russia in 1853 on the side of the Ottoman
    Empire. Greek opinion went the other way almost without exception, and in the winter
    of 1854 bands crossed the frontier: Spyridon Karaiskakis at Arta on 30 January, then
    risings in Thessaly and Macedonia. Otto did not order them and did not stop them.
    The Powers' ultimatum demanded that he do so. When it expired, a Franco-British
    squadron put troops ashore at Piraeus. Greek sources date the landing to 12 May Old
    Style, 24 May New Style; several English accounts give 26 May, and the two-day gap
    has never been closed.

    Lord John Russell told the Commons on 29 May that the instructions were generally to
    occupy the Piraeus and not Athens, with Athens held in reserve. Otto dismissed his
    ministers and appointed Alexandros Mavrokordatos, the veteran Phanariot, with
    Colonel Dimitrios Kallergis at the War Ministry on French insistence; until
    Mavrokordatos arrived Kallergis governed much as he liked. Greeks called the result
    the Ministry of Occupation. The Epirot revolt collapsed within weeks, Ottoman
    reprisals ran on for two years, and thousands of refugees came south across the
    frontier.

    The worst of it was not political. French troops carried cholera, and the epidemic
    that followed killed around three thousand people in Athens and Piraeus, close to a
    tenth of the capital's population, before it burned out in November 1854.
    Mavrokordatos fell in September 1855 and Dimitrios Voulgaris succeeded him; the
    occupation outlasted the Treaty of Paris that ended the Crimean War in March 1856.
    The last troops embarked on 27 February 1857. They left behind an international
    financial commission to examine the Greek budget, which set the precedent for the
    far heavier control imposed after 1897.
  el: |
    Η Αγγλία και η Γαλλία μπήκαν στον πόλεμο κατά της Ρωσίας το 1853 στο πλευρό της
    Οθωμανικής Αυτοκρατορίας. Η ελληνική κοινή γνώμη τάχθηκε σχεδόν ομόθυμα αντίθετα,
    και τον χειμώνα του 1854 σώματα πέρασαν τα σύνορα: ο Σπυρίδων Καραϊσκάκης στην Άρτα
    στις 30 Ιανουαρίου, και ύστερα κινήματα στη Θεσσαλία και τη Μακεδονία. Ο Όθων ούτε
    τα διέταξε ούτε τα σταμάτησε. Το τελεσίγραφο των Δυνάμεων απαιτούσε ακριβώς αυτό.
    Όταν έληξε, γαλλοβρετανική μοίρα αποβίβασε στρατό στον Πειραιά. Οι ελληνικές πηγές
    τοποθετούν την απόβαση στις 12 Μαΐου με το παλαιό ημερολόγιο, 24 Μαΐου με το νέο,
    ενώ αρκετές αγγλικές δίνουν 26 Μαΐου. Η διαφορά των δύο ημερών δεν έχει λυθεί.

    Ο λόρδος Τζον Ράσελ δήλωσε στη Βουλή των Κοινοτήτων στις 29 Μαΐου ότι οι οδηγίες
    ήταν γενικώς να καταληφθεί ο Πειραιάς και όχι η Αθήνα, με την Αθήνα σε εφεδρεία. Ο
    Όθων απέπεμψε τους υπουργούς του και διόρισε τον Αλέξανδρο Μαυροκορδάτο, τον
    παλαίμαχο Φαναριώτη, με τον συνταγματάρχη Δημήτριο Καλλέργη στο Υπουργείο
    Στρατιωτικών κατ' απαίτηση των Γάλλων. Ώσπου να φτάσει ο Μαυροκορδάτος, ο Καλλέργης
    κυβερνούσε όπως ήθελε. Οι Έλληνες ονόμασαν το αποτέλεσμα Υπουργείο Κατοχής. Η
    ηπειρωτική εξέγερση κατέρρευσε μέσα σε λίγες εβδομάδες, τα οθωμανικά αντίποινα
    κράτησαν δύο χρόνια και χιλιάδες πρόσφυγες πέρασαν νότια τα σύνορα.

    Το χειρότερο δεν ήταν πολιτικό. Τα γαλλικά στρατεύματα μετέφεραν χολέρα, και η
    επιδημία που ακολούθησε σκότωσε περίπου τρεις χιλιάδες ανθρώπους σε Αθήνα και
    Πειραιά, κοντά στο ένα δέκατο του πληθυσμού της πρωτεύουσας, ώσπου να κοπάσει τον
    Νοέμβριο του 1854. Ο Μαυροκορδάτος έπεσε τον Σεπτέμβριο του 1855 και τον διαδέχθηκε
    ο Δημήτριος Βούλγαρης. Η κατοχή επέζησε της Συνθήκης των Παρισίων που τερμάτισε τον
    Κριμαϊκό Πόλεμο τον Μάρτιο του 1856. Τα τελευταία στρατεύματα επιβιβάστηκαν στις 27
    Φεβρουαρίου 1857, αφήνοντας πίσω τους διεθνή οικονομική επιτροπή για τον έλεγχο του
    ελληνικού προϋπολογισμού, προηγούμενο του πολύ βαρύτερου ελέγχου που επιβλήθηκε μετά
    το 1897.
