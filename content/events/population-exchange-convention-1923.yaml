id: population-exchange-convention-1923
title:
  en: The Convention on the Exchange of Greek and Turkish Populations
  el: Η Σύμβαση περί ανταλλαγής των ελληνικών και τουρκικών πληθυσμών
summary:
  en: >
    Greece and the Grand National Assembly of Turkey signed at Lausanne on 30 January
    1923, six months before the peace treaty itself, because the refugee crisis would not
    wait. It was the first compulsory population exchange in modern international law:
    removal was obligatory and return was forbidden without government permission. The
    criterion was religion rather than language, so Turkish-speaking Orthodox went to
    Greece and Greek-speaking Muslims went to Turkey. Only the Greeks of Constantinople
    and the Muslims of Western Thrace were exempted.
  el: >
    Η Ελλάδα και η Μεγάλη Εθνοσυνέλευση της Τουρκίας υπέγραψαν στη Λωζάνη στις 30 Ιανουαρίου
    1923, έξι μήνες πριν από την ίδια τη συνθήκη ειρήνης, επειδή το προσφυγικό δεν περίμενε.
    Ήταν η πρώτη υποχρεωτική ανταλλαγή πληθυσμών στο σύγχρονο διεθνές δίκαιο: η μετακίνηση
    ήταν υποχρεωτική και η επιστροφή απαγορευόταν χωρίς κυβερνητική άδεια. Το κριτήριο ήταν το
    θρήσκευμα και όχι η γλώσσα, και έτσι τουρκόφωνοι ορθόδοξοι ήρθαν στην Ελλάδα και ελληνόφωνοι
    μουσουλμάνοι έφυγαν για την Τουρκία. Εξαιρέθηκαν μόνο οι Έλληνες της Κωνσταντινούπολης και
    οι μουσουλμάνοι της Δυτικής Θράκης.
body:
  en: |
    Fridtjof Nansen, the League of Nations High Commissioner for Refugees, proposed the
    compulsory form, on the argument that an exchange already happening by flight and
    massacre should at least be regulated. Article 1 made removal obligatory and barred
    those transferred from returning. Article 3 counted everyone who had left since
    October 1912 as part of the exchange, which retrospectively closed the question of
    whether the refugees of 1922 could go home and settled their property claims against
    them. Transfers were to begin on 1 May 1923. A Mixed Commission of Greek, Turkish and
    neutral League members supervised the movement and the liquidation of abandoned
    property; the property accounts were not closed until the Ankara Convention of 10
    June 1930.

    Because the test was religion, the convention cut across every other way the people
    concerned identified themselves. The Karamanlides of Cappadocia, Orthodox and
    Turkish-speaking, were sent to a country whose language they did not read. The
    Muslims of Crete and Epirus, Greek-speaking for generations, were sent to a country
    whose language they did not speak. Roughly 1.2 to 1.5 million Orthodox Christians
    moved to Greece, most of them already refugees before the convention was written, and
    about 355,000 to 500,000 Muslims moved to Turkey; the ranges depend on whether flight
    before 1923 is counted.

    Greece had a population of about five million and absorbed an increase of a fifth to
    a quarter within a year. The refugees turned Greek Macedonia and Thrace into
    overwhelmingly Greek-populated regions, founded new towns that still carry the names
    of the places they had left, Nea Ionia, Nea Smyrni, Nea Philadelphia, and filled the
    tobacco quarters of Kavala. They also created a new electorate, urban, poor and
    Venizelist, which carried Venizelos back to power in 1928. Turkey ratified on 23
    August 1923 and Greece on 25 August.
  el: |
    Ο Φρίντγιοφ Νάνσεν, ύπατος αρμοστής της Κοινωνίας των Εθνών για τους πρόσφυγες, πρότεινε την
    υποχρεωτική μορφή, με το επιχείρημα ότι μια ανταλλαγή που γινόταν ήδη με φυγή και σφαγές
    έπρεπε τουλάχιστον να ρυθμιστεί. Το άρθρο 1 καθιστούσε τη μετακίνηση υποχρεωτική και
    απαγόρευε την επιστροφή των μετακινουμένων. Το άρθρο 3 προσμετρούσε στην ανταλλαγή όσους
    είχαν φύγει από τον Οκτώβριο του 1912, κλείνοντας αναδρομικά το ζήτημα του αν οι πρόσφυγες
    του 1922 μπορούσαν να γυρίσουν και τακτοποιώντας τις περιουσιακές τους αξιώσεις εις βάρος
    τους. Οι μεταφορές θα άρχιζαν την 1η Μαΐου 1923. Μεικτή Επιτροπή με Έλληνες, Τούρκους και
    ουδέτερα μέλη της Κοινωνίας των Εθνών επέβλεψε τη μετακίνηση και την εκκαθάριση των
    εγκαταλειμμένων περιουσιών· οι περιουσιακοί λογαριασμοί έκλεισαν μόλις με τη Σύμβαση της
    Άγκυρας της 10ης Ιουνίου 1930.

    Επειδή το κριτήριο ήταν το θρήσκευμα, η σύμβαση έκοβε εγκάρσια κάθε άλλον τρόπο με τον οποίο
    αυτοπροσδιορίζονταν οι άνθρωποι που αφορούσε. Οι Καραμανλήδες της Καππαδοκίας, ορθόδοξοι και
    τουρκόφωνοι, στάλθηκαν σε χώρα της οποίας τη γλώσσα δεν διάβαζαν. Οι μουσουλμάνοι της Κρήτης
    και της Ηπείρου, ελληνόφωνοι επί γενιές, στάλθηκαν σε χώρα της οποίας τη γλώσσα δεν μιλούσαν.
    Περίπου 1,2 έως 1,5 εκατομμύριο ορθόδοξοι χριστιανοί ήρθαν στην Ελλάδα, οι περισσότεροι
    πρόσφυγες ήδη πριν γραφτεί η σύμβαση, και περίπου 355.000 έως 500.000 μουσουλμάνοι έφυγαν για
    την Τουρκία· τα όρια εξαρτώνται από το αν μετρηθεί η φυγή πριν από το 1923.

    Η Ελλάδα είχε πληθυσμό περίπου πέντε εκατομμυρίων και απορρόφησε αύξηση από ένα πέμπτο ως
    ένα τέταρτο μέσα σε έναν χρόνο. Οι πρόσφυγες μετέτρεψαν την ελληνική Μακεδονία και τη Θράκη
    σε περιοχές με συντριπτικά ελληνικό πληθυσμό, ίδρυσαν νέες πόλεις που κρατούν ακόμη τα
    ονόματα των τόπων που άφησαν, τη Νέα Ιωνία, τη Νέα Σμύρνη, τη Νέα Φιλαδέλφεια, και γέμισαν
    τις καπναποθήκες της Καβάλας. Δημιούργησαν επίσης ένα νέο εκλογικό σώμα, αστικό, φτωχό και
    βενιζελικό, που επανέφερε τον Βενιζέλο στην εξουσία το 1928. Η Τουρκία επικύρωσε στις 23
    Αυγούστου 1923 και η Ελλάδα στις 25 Αυγούστου.
