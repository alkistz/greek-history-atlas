id: fourth-of-august-regime
title:
  en: The 4th of August and the Metaxas dictatorship
  el: Η 4η Αυγούστου και η δικτατορία Μεταξά
summary:
  en: >
    With a general strike called for the next day, Ioannis Metaxas persuaded George II on 4
    August 1936 to suspend eight articles of the constitution, including the guarantees of
    personal liberty, assembly, association and the press. Parliament, adjourned since April,
    was prorogued indefinitely, parties dissolved and strikes banned. The regime built a
    political police, broke the Communist Party, enrolled the schoolchildren in a national
    youth organisation, and at the same time founded the social insurance system and
    generalised the eight-hour day. It ended with Metaxas's death in January 1941 and the
    German invasion that April.
  el: >
    Με προκηρυγμένη γενική απεργία για την επομένη, ο Ιωάννης Μεταξάς έπεισε στις 4 Αυγούστου
    1936 τον Γεώργιο Β΄ να αναστείλει οκτώ άρθρα του Συντάγματος, ανάμεσά τους τις εγγυήσεις
    της προσωπικής ελευθερίας, της συνάθροισης, του συνεταιρίζεσθαι και του Τύπου. Η Βουλή,
    σε διακοπή από τον Απρίλιο, διαλύθηκε επ' αόριστον, τα κόμματα καταργήθηκαν και οι
    απεργίες απαγορεύτηκαν. Το καθεστώς έστησε πολιτική αστυνομία, διέλυσε το ΚΚΕ, ενέταξε
    τους μαθητές σε εθνική οργάνωση νεολαίας και ταυτόχρονα ίδρυσε το σύστημα κοινωνικής
    ασφάλισης και γενίκευσε το οκτάωρο. Τελείωσε με τον θάνατο του Μεταξά τον Ιανουάριο του
    1941 και τη γερμανική εισβολή τον Απρίλιο.
body:
  en: |
    The decrees the king signed on 4 August 1936 suspended articles 5, 6, 10, 11, 12, 14, 20
    and 95 of the constitution: personal liberty, protection against arbitrary arrest,
    freedom of assembly and of association, freedom of the press, the inviolability of the
    home, and the right to refuse to obey unconstitutional acts. Parliament had put itself
    into recess on 30 April and was now prorogued without a date. Political parties were
    dissolved, strikes banned and martial law proclaimed. Metaxas kept the premiership and
    took the ministries of Foreign Affairs, Military Affairs, Naval Affairs and Aviation, and
    later Education as well. He assumed the title of Archigos and called the regime the Third
    Hellenic Civilisation.

    Its central instrument was the security apparatus that Konstantinos Maniadakis built from
    14 August 1936 as Under-Minister of Public Security. The political police planted agents
    inside the Communist Party until it was running rival central committees, one of them
    police-controlled; thousands were imprisoned or exiled to the islands, and some 45,000
    declarations of repentance were extracted from people who wanted their jobs or their
    liberty back. Nikos Zachariadis, the party's secretary, was arrested in September 1936 and
    was still in custody in 1945. The National Youth Organisation, founded in November 1936,
    was effectively compulsory for schoolchildren by 1939, and the censors banned Sophocles'
    Antigone, Pericles' Funeral Oration and Ritsos's Epitaphios.

    Alongside that, the regime carried out much of the labour programme the strikers of May
    had demanded. The Social Insurance Institute was set up in 1937, the eight-hour day and
    minimum wages were generalised, agricultural debts were partly written off and compulsory
    arbitration was imposed on industrial disputes. Metaxas presented himself as the first
    peasant of the country and the regime spoke constantly of the family, the village and the
    nation. It had no mass party, no programme of territorial expansion and no coherent
    doctrine beyond that; it rested on the king, the army and the police rather than on a
    movement. Historians disagree over whether to call it fascist or a royal and military
    dictatorship with fascist borrowings.

    Organised resistance was almost nonexistent. The only serious risings were at Chania in
    Crete on 28 July 1938 and at Kastelli, and both were put down quickly. The regime's
    decisive act was Metaxas's rejection of Mussolini's ultimatum on 28 October 1940, which
    made a dictator who had governed without consent for four years briefly the expression of
    a national consensus. He died on 29 January 1941. The regime outlived him by four months
    and ended with the German occupation and the flight of the government at the end of April.
  el: |
    Τα διατάγματα που υπέγραψε ο βασιλιάς στις 4 Αυγούστου 1936 ανέστειλαν τα άρθρα 5, 6, 10,
    11, 12, 14, 20 και 95 του Συντάγματος: την προσωπική ελευθερία, την προστασία από
    αυθαίρετη σύλληψη, την ελευθερία του συνέρχεσθαι και του συνεταιρίζεσθαι, την ελευθερία
    του Τύπου, το άσυλο της κατοικίας και το δικαίωμα αντίστασης σε αντισυνταγματικές
    πράξεις. Η Βουλή είχε αυτοδιακοπεί στις 30 Απριλίου και τώρα διαλύθηκε χωρίς ημερομηνία.
    Τα κόμματα καταργήθηκαν, οι απεργίες απαγορεύτηκαν και κηρύχθηκε στρατιωτικός νόμος. Ο
    Μεταξάς κράτησε την πρωθυπουργία και ανέλαβε τα υπουργεία Εξωτερικών, Στρατιωτικών,
    Ναυτικών και Αεροπορίας, αργότερα και της Παιδείας. Πήρε τον τίτλο του Αρχηγού και
    ονόμασε το καθεστώς Τρίτο Ελληνικό Πολιτισμό.

    Κεντρικό του εργαλείο ήταν ο μηχανισμός ασφαλείας που έστησε από τις 14 Αυγούστου 1936 ο
    Κωνσταντίνος Μανιαδάκης ως υφυπουργός Δημοσίας Ασφαλείας. Η Ασφάλεια φύτεψε πράκτορες
    μέσα στο ΚΚΕ ώσπου το κόμμα λειτουργούσε με αντίπαλες κεντρικές επιτροπές, τη μία υπό
    αστυνομικό έλεγχο· χιλιάδες φυλακίστηκαν ή εκτοπίστηκαν στα νησιά, και αποσπάστηκαν
    περίπου 45.000 δηλώσεις μετανοίας από ανθρώπους που ήθελαν πίσω τη δουλειά ή την ελευθερία
    τους. Ο Νίκος Ζαχαριάδης, γραμματέας του κόμματος, συνελήφθη τον Σεπτέμβριο του 1936 και
    παρέμενε κρατούμενος ως το 1945. Η Εθνική Οργάνωσις Νεολαίας, που ιδρύθηκε τον Νοέμβριο
    του 1936, ήταν ως το 1939 ουσιαστικά υποχρεωτική για τους μαθητές, και η λογοκρισία
    απαγόρευσε την Αντιγόνη του Σοφοκλή, τον Επιτάφιο του Περικλή και τον Επιτάφιο του Ρίτσου.

    Παράλληλα, το καθεστώς υλοποίησε μεγάλο μέρος του εργατικού προγράμματος που είχαν ζητήσει
    οι απεργοί του Μαΐου. Το ΙΚΑ ιδρύθηκε το 1937, το οκτάωρο και οι κατώτατοι μισθοί
    γενικεύτηκαν, τα αγροτικά χρέη ρυθμίστηκαν εν μέρει και επιβλήθηκε υποχρεωτική διαιτησία
    στις εργατικές διαφορές. Ο Μεταξάς παρουσιαζόταν ως ο πρώτος χωρικός της χώρας και το
    καθεστώς μιλούσε ακατάπαυστα για την οικογένεια, το χωριό και το έθνος. Δεν είχε μαζικό
    κόμμα, ούτε πρόγραμμα εδαφικής επέκτασης, ούτε συγκροτημένο δόγμα πέρα από αυτά·
    στηριζόταν στον βασιλιά, τον στρατό και την αστυνομία και όχι σε κίνημα. Οι ιστορικοί
    διαφωνούν αν πρέπει να χαρακτηριστεί φασιστικό ή βασιλικοστρατιωτική δικτατορία με
    φασιστικά δάνεια.

    Οργανωμένη αντίσταση σχεδόν δεν υπήρξε. Τα μόνα σοβαρά κινήματα ήταν στα Χανιά στις 28
    Ιουλίου 1938 και στο Καστέλλι, και κατεστάλησαν γρήγορα. Η καθοριστική πράξη του
    καθεστώτος ήταν η απόρριψη του ιταλικού τελεσιγράφου από τον Μεταξά στις 28 Οκτωβρίου 1940,
    που έκανε για λίγο έναν δικτάτορα τεσσάρων ετών έκφραση εθνικής συναίνεσης. Πέθανε στις 29
    Ιανουαρίου 1941. Το καθεστώς τον επέζησε τέσσερις μήνες και τελείωσε με τη γερμανική
    κατοχή και τη φυγή της κυβέρνησης στα τέλη Απριλίου.
