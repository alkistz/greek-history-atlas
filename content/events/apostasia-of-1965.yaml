id: apostasia-of-1965
title:
  en: The Apostasia of July 1965
  el: Η Αποστασία του 1965
summary:
  en: >
    On 15 July 1965 King Constantine II refused to let Georgios Papandreou take the defence
    ministry himself, and the prime minister left office with a successor already waiting in the
    next room. Defections from the Centre Union gave the palace a parliamentary majority, and the
    defectors were named the apostates. Two short-lived governments failed to win confidence before
    Stefanos Stefanopoulos secured one in September. Mass demonstrations filled Athens and
    Thessaloniki through July, and the student Sotiris Petroulas was killed in the clashes on 21
    July. The elections promised for May 1967 were never held: the army took power on 21 April.
  el: >
    Στις 15 Ιουλίου 1965 ο βασιλιάς Κωνσταντίνος Β΄ αρνήθηκε να αναλάβει ο ίδιος ο Γεώργιος
    Παπανδρέου το υπουργείο Εθνικής Άμυνας, και ο πρωθυπουργός αποχώρησε από την εξουσία με τον
    διάδοχό του να περιμένει ήδη στο διπλανό δωμάτιο. Οι αποσκιρτήσεις από την Ένωση Κέντρου
    έδωσαν στο παλάτι κοινοβουλευτική πλειοψηφία, και οι αποσκιρτήσαντες ονομάστηκαν αποστάτες. Δύο
    βραχύβιες κυβερνήσεις δεν κατάφεραν να λάβουν ψήφο εμπιστοσύνης πριν την εξασφαλίσει ο Στέφανος
    Στεφανόπουλος τον Σεπτέμβριο. Μαζικές διαδηλώσεις γέμισαν την Αθήνα και τη Θεσσαλονίκη όλον τον
    Ιούλιο, και ο φοιτητής Σωτήρης Πέτρουλας σκοτώθηκε στις συγκρούσεις της 21ης Ιουλίου. Οι
    εκλογές που είχαν υποσχεθεί για τον Μάιο του 1967 δεν έγιναν ποτέ: ο στρατός πήρε την εξουσία
    στις 21 Απριλίου.
body:
  en: |
    The Centre Union had taken 42.0 per cent and 138 seats on 3 November 1963, then 52.7 per cent
    and 171 of 300 seats on 16 February 1964, the first absolute majority a centre party had won
    since the war. Georgios Papandreou governed from 19 February 1964. His government raised
    education spending toward fifteen per cent of the budget, introduced nine years of free
    compulsory schooling, made demotic Greek an official language of instruction and released many
    of the political prisoners still held from the Civil War.

    The break came over the army. The ASPIDA affair, allegations of a conspiratorial network of
    centre-left junior officers with the prime minister's son Andreas Papandreou's name attached to
    it, led the defence minister Petros Garoufalias, backed by the palace, to resist the prime
    minister's direction of the inquiry. Papandreou moved to take the portfolio himself. On 15 July
    1965 Constantine II refused, and Papandreou ceased to be prime minister. Whether he resigned or
    was dismissed is still argued in Greece; his supporters point to the fact that Georgios
    Athanasiadis-Novas was waiting in an adjoining room and was sworn in the same day.

    Enough Centre Union deputies crossed to give the palace its majority. They were called the
    apostates, and the episode is known in Greek as the Apostasia or the Iouliana, the July events.
    Athanasiadis-Novas lasted from 15 July to 20 August and Ilias Tsirimokos from 20 August to 17
    September, both without winning a confidence vote; Stefanos Stefanopoulos finally secured one
    and governed until 22 December 1966. Meanwhile the streets filled. The demonstrations of July
    1965 were sustained and openly anti-monarchist, and on 21 July the
    economics student and Lambrakis Youth member Sotiris Petroulas was killed in the clashes in
    central Athens; accounts differ as to whether he died from a beating, from tear gas in the
    crush or in custody.

    The stalemate was patched in December 1966 by an agreement between Papandreou and Panagiotis
    Kanellopoulos that installed the caretaker government of Ioannis Paraskevopoulos and set
    elections for 28 May 1967, with Kanellopoulos taking over on 3 April. Everyone expected
    Papandreou to win them. A group of middle-ranking officers under Georgios Papadopoulos seized
    power on 21 April 1967, and the crisis that began on 15 July 1965 ended in seven years of
    dictatorship. What the two years had shown was that the constitutional question left open in
    1952, whether the Crown or an elected majority governed, could not be answered inside the
    system that posed it.
  el: |
    Η Ένωση Κέντρου είχε λάβει 42,0% και 138 έδρες στις 3 Νοεμβρίου 1963 και στη συνέχεια 52,7% και
    171 από τις 300 έδρες στις 16 Φεβρουαρίου 1964, την πρώτη απόλυτη πλειοψηφία κεντρώου κόμματος
    μετά τον πόλεμο. Ο Γεώργιος Παπανδρέου κυβέρνησε από τις 19 Φεβρουαρίου 1964. Η κυβέρνησή του
    ανέβασε τις δαπάνες για την παιδεία προς το δεκαπέντε τοις εκατό του προϋπολογισμού, καθιέρωσε
    εννιάχρονη δωρεάν υποχρεωτική εκπαίδευση, έκανε τη δημοτική επίσημη γλώσσα της διδασκαλίας και
    αποφυλάκισε πολλούς από τους πολιτικούς κρατουμένους που κρατούνταν ακόμη από τον Εμφύλιο.

    Η ρήξη ήρθε για τον στρατό. Η υπόθεση ΑΣΠΙΔΑ, οι καταγγελίες για συνωμοτικό δίκτυο
    κεντροαριστερών κατώτερων αξιωματικών με το όνομα του Ανδρέα Παπανδρέου, γιου του πρωθυπουργού,
    συνδεδεμένο με αυτό, οδήγησαν τον υπουργό Εθνικής Άμυνας Πέτρο Γαρουφαλιά, με τη στήριξη του
    παλατιού, να αντισταθεί στην καθοδήγηση της έρευνας από τον πρωθυπουργό. Ο Παπανδρέου κινήθηκε
    να αναλάβει ο ίδιος το χαρτοφυλάκιο. Στις 15 Ιουλίου 1965 ο Κωνσταντίνος Β΄ αρνήθηκε, και ο
    Παπανδρέου έπαψε να είναι πρωθυπουργός. Το αν παραιτήθηκε ή αν παύθηκε συζητείται ακόμη στην
    Ελλάδα· οι υποστηρικτές του επικαλούνται το γεγονός ότι ο Γεώργιος Αθανασιάδης-Νόβας περίμενε
    στο διπλανό δωμάτιο και ορκίστηκε την ίδια μέρα.

    Αρκετοί βουλευτές της Ένωσης Κέντρου πέρασαν απέναντι και έδωσαν στο παλάτι την πλειοψηφία του.
    Ονομάστηκαν αποστάτες, και το επεισόδιο είναι γνωστό ως Αποστασία ή Ιουλιανά. Ο
    Αθανασιάδης-Νόβας κράτησε από τις 15 Ιουλίου ως τις 20 Αυγούστου και ο Ηλίας Τσιριμώκος από τις
    20 Αυγούστου ως τις 17 Σεπτεμβρίου, χωρίς κανείς τους να λάβει ψήφο εμπιστοσύνης· ο Στέφανος
    Στεφανόπουλος την εξασφάλισε τελικά και κυβέρνησε ως τις 22 Δεκεμβρίου 1966. Στο μεταξύ οι
    δρόμοι γέμισαν. Οι διαδηλώσεις του Ιουλίου 1965 κράτησαν εβδομάδες και ήταν ανοιχτά
    αντιμοναρχικές, και στις 21 Ιουλίου ο φοιτητής της Οικονομικής και μέλος της Νεολαίας Λαμπράκη
    Σωτήρης Πέτρουλας σκοτώθηκε στις συγκρούσεις στο κέντρο της Αθήνας. Οι μαρτυρίες διαφέρουν ως
    προς το αν πέθανε από ξυλοδαρμό, από τα δακρυγόνα μέσα στον συνωστισμό ή υπό κράτηση.

    Το αδιέξοδο μπαλώθηκε τον Δεκέμβριο του 1966 με συμφωνία Παπανδρέου και Παναγιώτη Κανελλόπουλου,
    που εγκατέστησε την υπηρεσιακή κυβέρνηση Ιωάννη Παρασκευόπουλου και όρισε εκλογές για τις 28
    Μαΐου 1967, με τον Κανελλόπουλο να αναλαμβάνει στις 3 Απριλίου. Όλοι περίμεναν ότι θα τις
    κέρδιζε ο Παπανδρέου. Ομάδα μεσαίων αξιωματικών υπό τον Γεώργιο Παπαδόπουλο κατέλαβε την εξουσία
    στις 21 Απριλίου 1967, και η κρίση που άρχισε στις 15 Ιουλίου 1965 κατέληξε σε επτά χρόνια
    δικτατορίας. Εκείνο που έδειξαν τα δύο αυτά χρόνια ήταν ότι το συνταγματικό ερώτημα που άφησε
    ανοιχτό το 1952, αν κυβερνά το Στέμμα ή η εκλεγμένη πλειοψηφία, δεν μπορούσε να απαντηθεί μέσα
    στο σύστημα που το έθετε.
