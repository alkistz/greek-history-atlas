id: dedilomeni-1875
title:
  en: The principle of declared confidence
  el: Η αρχή της δεδηλωμένης
summary:
  en: >
    The Constitution of 1864 left George I free to appoint whatever ministers he chose,
    and with no party holding a majority he kept appointing minority governments. In
    June 1874 Charilaos Trikoupis published an unsigned article headed Who is to blame?,
    laying the fault on the crown; he was prosecuted and acquitted. In April 1875 the
    king made him prime minister, and on 11 August 1875 Old Style, 23 August New Style,
    George opened the new Chamber with a speech Trikoupis had written, undertaking to
    call to office only those with the declared confidence of its majority. The
    principle made Greek government answerable to parliament half a century before the
    constitution said so.
  el: >
    Το Σύνταγμα του 1864 άφηνε τον Γεώργιο Α΄ ελεύθερο να διορίζει όποιους υπουργούς
    ήθελε, και καθώς κανένα κόμμα δεν είχε πλειοψηφία, διόριζε διαρκώς κυβερνήσεις
    μειοψηφίας. Τον Ιούνιο του 1874 ο Χαρίλαος Τρικούπης δημοσίευσε ανυπόγραφο άρθρο με
    τίτλο «Τις πταίει;», ρίχνοντας την ευθύνη στο στέμμα. Διώχθηκε και αθωώθηκε. Τον
    Απρίλιο του 1875 ο βασιλιάς τον έκανε πρωθυπουργό, και στις 11 Αυγούστου 1875 με το
    παλαιό ημερολόγιο, 23 Αυγούστου με το νέο, ο Γεώργιος άνοιξε τη νέα Βουλή με λόγο που
    είχε γράψει ο Τρικούπης, δεσμευόμενος να καλεί στην εξουσία μόνο όσους είχαν τη
    δεδηλωμένη εμπιστοσύνη της πλειοψηφίας της. Η αρχή έκανε την ελληνική κυβέρνηση
    υπόλογη στη Βουλή μισό αιώνα πριν το ορίσει το Σύνταγμα.
body:
  en: |
    The Constitution of 1864 made the nation sovereign but left the king the right to
    appoint and dismiss ministers. The Chamber was divided among personal followings,
    none of them large enough to govern alone, and George I filled the gap by handing
    office to minority governments that then ran the elections. The government of
    Dimitrios Voulgaris in 1874 was the latest of them.

    On 29 June 1874 Old Style, 11 July New, days after elections Trikoupis had not
    contested, the Athens paper Kairoi, edited by Petros Kanellidis, carried an unsigned
    article headed «Τις πταίει;», Who is to blame? Its answer was the crown and its
    interventions in political life. Kanellidis was detained; Trikoupis wrote to the
    public prosecutor taking the whole responsibility on himself. A second article,
    Past and Present, followed on 6 July and brought a prosecution. He was held for four
    days from 7 July, released on bail, and on 23 July acquitted of every charge, his
    popularity soaring.

    In March 1875 Voulgaris was caught in a fraud over a vote in the Chamber, and the
    king forced him out. On 25 April George asked Trikoupis to form a government, and he
    accepted on condition that he could dissolve the Chamber and hold elections; he took
    office on 27 April. On 25 May the newspaper Syntagmatiki printed the names of the 92
    deputies who had kept the minority government in office. The elections of 18 July
    were free, and Alexandros Koumoundouros's party won them.

    On 11 August George opened the new Chamber with a speech from the throne that
    Trikoupis had drafted. It bound the crown to give office only to those who held the
    declared confidence of the majority of the representatives of the nation. Trikoupis,
    who had no such majority, resigned on 30 September and Koumoundouros succeeded him.
    The principle was not written into the constitution until 1927 and was broken when
    it suited the crown, most seriously by Constantine I in 1915, but from 1875 a Greek
    government without a majority was an anomaly to be explained rather than the normal
    state of affairs.
  el: |
    Το Σύνταγμα του 1864 έκανε κυρίαρχο το έθνος αλλά άφηνε στον βασιλιά το δικαίωμα να
    διορίζει και να παύει υπουργούς. Η Βουλή ήταν μοιρασμένη σε προσωπικές ομάδες, καμία
    αρκετά μεγάλη για να κυβερνήσει μόνη, και ο Γεώργιος Α΄ κάλυπτε το κενό αναθέτοντας
    την εξουσία σε κυβερνήσεις μειοψηφίας που ύστερα διενεργούσαν τις εκλογές. Η
    κυβέρνηση του Δημητρίου Βούλγαρη το 1874 ήταν η τελευταία από αυτές.

    Στις 29 Ιουνίου 1874 με το παλαιό ημερολόγιο, 11 Ιουλίου με το νέο, λίγες μέρες μετά
    από εκλογές στις οποίες ο Τρικούπης δεν είχε κατέβει, η αθηναϊκή εφημερίδα «Καιροί»
    του Πέτρου Κανελλίδη δημοσίευσε ανυπόγραφο άρθρο με τίτλο «Τις πταίει;». Η απάντησή
    του ήταν το στέμμα και οι παρεμβάσεις του στην πολιτική ζωή. Ο Κανελλίδης
    προφυλακίστηκε. Ο Τρικούπης έγραψε στον εισαγγελέα αναλαμβάνοντας εξολοκλήρου την
    ευθύνη. Δεύτερο άρθρο, «Παρελθόν και Ενεστώς», ακολούθησε στις 6 Ιουλίου και
    επέφερε δίωξη. Κρατήθηκε τέσσερις μέρες από τις 7 Ιουλίου, αφέθηκε με εγγύηση και
    στις 23 Ιουλίου απαλλάχθηκε από κάθε κατηγορία, με τη δημοτικότητά του να
    εκτοξεύεται.

    Τον Μάρτιο του 1875 ο Βούλγαρης διέπραξε λαθροχειρία σε ψηφοφορία της Βουλής, και ο
    βασιλιάς τον ανάγκασε να παραιτηθεί. Στις 25 Απριλίου ο Γεώργιος ανέθεσε στον
    Τρικούπη τον σχηματισμό κυβέρνησης, και εκείνος δέχθηκε με τον όρο να διαλύσει τη
    Βουλή και να προκηρύξει εκλογές. Ανέλαβε στις 27 Απριλίου. Στις 25 Μαΐου η εφημερίδα
    «Συνταγματική» δημοσίευσε τα ονόματα των 92 βουλευτών που είχαν κρατήσει στην εξουσία
    την κυβέρνηση μειοψηφίας. Οι εκλογές της 18ης Ιουλίου ήταν ελεύθερες και τις κέρδισε
    το κόμμα του Αλέξανδρου Κουμουνδούρου.

    Στις 11 Αυγούστου ο Γεώργιος άνοιξε τη νέα Βουλή με λόγο του θρόνου που είχε
    συντάξει ο Τρικούπης. Δέσμευε το στέμμα να αναθέτει την εξουσία μόνο σε όσους είχαν
    τη δεδηλωμένη εμπιστοσύνη της πλειοψηφίας των αντιπροσώπων του έθνους. Ο Τρικούπης,
    που δεν διέθετε τέτοια πλειοψηφία, παραιτήθηκε στις 30 Σεπτεμβρίου και τον διαδέχθηκε
    ο Κουμουνδούρος. Η αρχή δεν γράφτηκε στο Σύνταγμα παρά το 1927 και παραβιάστηκε όποτε
    βόλευε το στέμμα, σοβαρότερα από τον Κωνσταντίνο Α΄ το 1915, αλλά από το 1875 μια
    ελληνική κυβέρνηση χωρίς πλειοψηφία ήταν ανωμαλία που έπρεπε να εξηγηθεί και όχι η
    συνήθης κατάσταση.
