id: liberation-of-thessaloniki
title:
  en: The liberation of Thessaloniki
  el: Η απελευθέρωση της Θεσσαλονίκης
summary:
  en: >
    With no field army left and a Bulgarian division closing from the north-east, Hasan
    Tahsin Pasha surrendered the second city of Ottoman Europe to the Greeks rather than to
    the Bulgarians. The protocol was signed at eleven at night on 26 October, the feast of
    the city's patron saint; 25,000 soldiers and about 1,000 officers became prisoners.
    Greek troops entered the next day, Crown Prince Constantine the day after and King
    George I the day after that. The protocol admitted two Bulgarian battalions, more came
    in anyway, and the two armies spent eight months in the same city before fighting each
    other for it.
  el: >
    Χωρίς στρατό πεδίου και με βουλγαρική μεραρχία να πλησιάζει από τα βορειοανατολικά, ο
    Χασάν Ταχσίν πασάς παρέδωσε τη δεύτερη πόλη της οθωμανικής Ευρώπης στους Έλληνες και όχι
    στους Βουλγάρους. Το πρωτόκολλο υπογράφηκε στις έντεκα το βράδυ της 26ης Οκτωβρίου,
    ανήμερα του πολιούχου της πόλης, και 25.000 στρατιώτες με περίπου 1.000 αξιωματικούς
    έγιναν αιχμάλωτοι. Ελληνικά τμήματα μπήκαν την επομένη, ο διάδοχος Κωνσταντίνος τη
    μεθεπομένη και ο βασιλιάς Γεώργιος Α΄ την τρίτη μέρα. Το πρωτόκολλο επέτρεπε δύο
    βουλγαρικά τάγματα, μπήκαν περισσότερα, και οι δύο στρατοί συγκατοίκησαν οκτώ μήνες στην
    ίδια πόλη πριν πολεμήσουν γι' αυτήν.
body:
  en: |
    Sarantaporo and Giannitsa had destroyed the Ottoman VIII Corps as a fighting force.
    Hasan Tahsin Pasha, an Albanian by origin commanding a provisional corps in a city he
    could not hold, had to choose which victor to hand it to, and General Georgi Todorov's
    Bulgarians were coming down from the north-east. The protocol of unconditional
    surrender was signed at 23:00 on 26 October Old Style, 8 November New Style. With the
    city the Greeks took 70 guns, 30 machine guns and 1,200 horses. The Hellenic Army's
    history gives that hour; English-language accounts hold that the document was actually
    signed on the 27th and backdated to the 26th to get ahead of the Bulgarian claim.
    Either way the 26th is the commemorated date.

    An Evzone detachment entered at midday on 27 October. Constantine reached the railway
    station at five in the morning on the 28th and made his formal entry at eleven; King
    George I entered on the 29th and then stayed, living in the city with no guard to make
    the Greek claim visible. The King's four months in Thessaloniki were an argument
    addressed to Sofia.

    What Greece acquired was not a Greek city. Thessaloniki had roughly 160,000
    inhabitants, of whom the largest community by far was Ladino-speaking Sephardic Jews,
    some 60,000 to 70,000, alongside Muslims, Greeks, Bulgarians and others. Its capture
    gave the kingdom a second centre, a port for the whole of Macedonia and a frontier
    argument with Bulgaria that could only be settled by another war. The two battalions
    clause was broken overnight on 29 October, and the cohabitation that followed led
    directly to the Bulgarian attack of June 1913.
  el: |
    Το Σαραντάπορο και τα Γιαννιτσά είχαν διαλύσει το οθωμανικό Η΄ Σώμα ως μάχιμη δύναμη. Ο
    Χασάν Ταχσίν πασάς, αλβανικής καταγωγής, διοικητής ενός προσωρινού σώματος σε μια πόλη
    που δεν μπορούσε να κρατήσει, έπρεπε να διαλέξει σε ποιον νικητή θα την παραδώσει, και οι
    Βούλγαροι του στρατηγού Γκεόργκι Τοντόροφ κατέβαιναν από τα βορειοανατολικά. Το
    πρωτόκολλο της άνευ όρων παράδοσης υπογράφηκε στις 23:00 της 26ης Οκτωβρίου με το παλαιό
    ημερολόγιο, 8 Νοεμβρίου με το νέο. Μαζί με την πόλη οι Έλληνες πήραν 70 πυροβόλα, 30
    πολυβόλα και 1.200 άλογα. Η ιστορική υπηρεσία του ελληνικού στρατού δίνει αυτή την ώρα,
    ενώ αγγλόφωνες αφηγήσεις υποστηρίζουν ότι το κείμενο υπογράφηκε στις 27 και
    χρονολογήθηκε αναδρομικά στις 26 για να προλάβει τη βουλγαρική αξίωση. Σε κάθε περίπτωση
    η 26η Οκτωβρίου είναι η ημέρα που γιορτάζεται.

    Απόσπασμα ευζώνων μπήκε το μεσημέρι της 27ης Οκτωβρίου. Ο Κωνσταντίνος έφτασε στον
    σιδηροδρομικό σταθμό στις πέντε το πρωί της 28ης και έκανε την επίσημη είσοδό του στις
    έντεκα. Ο Γεώργιος Α΄ μπήκε στις 29 και έμεινε, ζώντας στην πόλη χωρίς φρουρά ώστε να
    είναι ορατή η ελληνική αξίωση. Οι τέσσερις μήνες του βασιλιά στη Θεσσαλονίκη ήταν ένα
    επιχείρημα απευθυνόμενο στη Σόφια.

    Αυτό που απέκτησε η Ελλάδα δεν ήταν ελληνική πόλη. Η Θεσσαλονίκη είχε περίπου 160.000
    κατοίκους, με μεγαλύτερη κοινότητα κατά πολύ τους ισπανόφωνους Σεφαραδίτες Εβραίους,
    κάπου 60.000 ως 70.000, μαζί με μουσουλμάνους, Έλληνες, Βουλγάρους και άλλους. Η
    κατάληψή της έδωσε στο βασίλειο δεύτερο κέντρο, λιμάνι για ολόκληρη τη Μακεδονία και μια
    συνοριακή διαφορά με τη Βουλγαρία που μόνο νέος πόλεμος μπορούσε να λύσει. Ο όρος για τα
    δύο τάγματα παραβιάστηκε μέσα στη νύχτα της 29ης Οκτωβρίου, και η συγκατοίκηση που
    ακολούθησε οδήγησε κατευθείαν στη βουλγαρική επίθεση του Ιουνίου 1913.
