id: distomo-massacre
title:
  en: The Distomo massacre
  el: Η σφαγή του Διστόμου
summary:
  en: >
    A company of the 4th SS Polizei Panzergrenadier Division was ambushed by ELAS near
    Distomo in Boeotia on 10 June 1944 and went back into the village to kill its people,
    house by house, over about two hours. The dead are given as 218 in most Greek accounts
    and on the village memorial, and as 228 in others, including about forty children. A
    Wehrmacht court of inquiry found that the company commander, Fritz Lautenbach, had
    exceeded his orders but had acted out of a sense of responsibility towards his men, and
    he was never prosecuted. Distomo has since become the central case in the argument over
    German compensation, and no damages have ever been paid.
  el: >
    Λόχος της 4ης μεραρχίας τεθωρακισμένων γρεναδιέρων της αστυνομίας των SS έπεσε σε
    ενέδρα του ΕΛΑΣ κοντά στο Δίστομο της Βοιωτίας στις 10 Ιουνίου 1944 και επέστρεψε στο
    χωριό για να σκοτώσει τους κατοίκους, σπίτι με σπίτι, μέσα σε περίπου δύο ώρες. Οι
    νεκροί δίνονται ως 218 στις περισσότερες ελληνικές πηγές και στο μνημείο του χωριού και
    ως 228 σε άλλες, ανάμεσά τους περίπου σαράντα παιδιά. Ανακριτικό συμβούλιο της
    Βέρμαχτ έκρινε ότι ο διοικητής του λόχου Φριτς Λάουτενμπαχ υπερέβη τις διαταγές του
    αλλά ενήργησε από αίσθημα ευθύνης απέναντι στους άνδρες του, και δεν διώχθηκε ποτέ. Το
    Δίστομο έγινε έκτοτε η κεντρική υπόθεση της διαμάχης για τις γερμανικές αποζημιώσεις,
    και καμία αποζημίωση δεν έχει καταβληθεί.
body:
  en: |
    The unit was returning from an anti-partisan sweep when it was ambushed. Survivors
    described bayoneted infants, disembowelled pregnant women and the beheading of the
    village priest, and bodies left hanging in the trees along the road. Both death tolls
    in circulation are defensible: the lower counts the village, the higher includes
    victims from the surrounding area. The Wehrmacht recorded the dead as bandits.

    Distomo was not an aberration. It happened four days after the Normandy landings and
    inside a settled policy: Mark Mazower has shown that by 1944 Army Group E in Greece
    had adopted the indiscriminate killing of civilians as a method of counter-insurgency,
    with comparable massacres at Kommeno in August 1943, Kalavryta in December 1943, and
    Chortiatis and Kleisoura in 1944.

    The legal afterlife has outlasted everyone involved. In 1997 the court at Livadeia
    awarded about 28 million euro in damages against the Federal Republic of Germany to
    relatives of the victims, and the Areios Pagos upheld the judgment in 2000. The Greek
    Minister of Justice then refused the authorisation needed to enforce it against German
    property in Greece, so the claimants pursued German assets in Italy. On 3 February
    2012, in Germany against Italy, the International Court of Justice held that Italy had
    violated Germany's sovereign immunity by permitting enforcement, a case that turned
    largely on Distomo. In 2014 the Italian Constitutional Court ruled that sovereign
    immunity could not bar claims for war crimes under the Italian constitution, and
    reopened the question. The families have received nothing.
  el: |
    Η μονάδα επέστρεφε από εκκαθαριστική επιχείρηση όταν έπεσε στην ενέδρα. Οι επιζώντες
    περιέγραψαν βρέφη σφαγμένα με ξιφολόγχη, έγκυες με σχισμένη την κοιλιά και τον
    αποκεφαλισμό του παπά του χωριού, και σώματα κρεμασμένα στα δέντρα κατά μήκος του
    δρόμου. Και οι δύο αριθμοί που κυκλοφορούν στέκουν: ο μικρότερος μετρά το χωριό, ο
    μεγαλύτερος περιλαμβάνει και θύματα της γύρω περιοχής. Η Βέρμαχτ κατέγραψε τους νεκρούς
    ως συμμορίτες.

    Το Δίστομο δεν ήταν παρέκκλιση. Συνέβη τέσσερις μέρες μετά την απόβαση στη Νορμανδία
    και μέσα σε παγιωμένη πολιτική: ο Μαρκ Μαζάουερ έχει δείξει ότι ως το 1944 η Ομάδα
    Στρατιών Ε στην Ελλάδα είχε υιοθετήσει την αδιάκριτη εξόντωση αμάχων ως μέθοδο
    αντιανταρτικού πολέμου, με ανάλογες σφαγές στο Κομμένο τον Αύγουστο του 1943, στα
    Καλάβρυτα τον Δεκέμβριο του 1943, στον Χορτιάτη και στην Κλεισούρα το 1944.

    Η δικαστική συνέχεια επέζησε όλων των εμπλεκομένων. Το 1997 το δικαστήριο της Λιβαδειάς
    επιδίκασε περίπου 28 εκατομμύρια ευρώ αποζημίωση σε βάρος της Ομοσπονδιακής
    Δημοκρατίας της Γερμανίας υπέρ των συγγενών των θυμάτων, και ο Άρειος Πάγος επικύρωσε
    την απόφαση το 2000. Ο Έλληνας υπουργός Δικαιοσύνης αρνήθηκε στη συνέχεια την άδεια που
    απαιτούνταν για την αναγκαστική εκτέλεση σε γερμανική περιουσία στην Ελλάδα, και οι
    ενάγοντες στράφηκαν σε γερμανικά περιουσιακά στοιχεία στην Ιταλία. Στις 3 Φεβρουαρίου
    2012, στην υπόθεση Γερμανία κατά Ιταλίας, το Διεθνές Δικαστήριο έκρινε ότι η Ιταλία
    είχε παραβιάσει την ετεροδικία της Γερμανίας επιτρέποντας την εκτέλεση, υπόθεση που
    στηριζόταν σε μεγάλο βαθμό στο Δίστομο. Το 2014 το ιταλικό Συνταγματικό Δικαστήριο
    έκρινε ότι η ετεροδικία δεν μπορεί να εμποδίσει αξιώσεις για εγκλήματα πολέμου κατά το
    ιταλικό σύνταγμα, και ξανάνοιξε το ζήτημα. Οι οικογένειες δεν έχουν λάβει τίποτε.
