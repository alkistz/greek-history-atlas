id: turkish-great-offensive-1922
title:
  en: The Turkish Great Offensive and the collapse of the Asia Minor front
  el: Η τουρκική Μεγάλη Επίθεση και η κατάρρευση του μικρασιατικού μετώπου
summary:
  en: >
    Mustafa Kemal attacked before dawn on 26 August 1922 with about 98,000 men against
    130,000 Greeks spread along a front of 700 kilometres, concentrating everything on a
    narrow sector at Afyonkarahisar. The southern group of Greek divisions was destroyed
    at Dumlupınar on 30 August and General Trikoupis surrendered on 2 September. In ten
    days the front moved 300 kilometres, Greek losses reached around 50,000 killed,
    wounded and captured, and on 9 September Turkish cavalry entered Smyrna. Greece lost
    Asia Minor in twenty-four days.
  el: >
    Ο Μουσταφά Κεμάλ επιτέθηκε πριν από την αυγή της 26ης Αυγούστου 1922 με περίπου 98.000
    άνδρες εναντίον 130.000 Ελλήνων απλωμένων σε μέτωπο 700 χιλιομέτρων, συγκεντρώνοντας τα
    πάντα σε έναν στενό τομέα στο Αφιόν Καραχισάρ. Το νότιο συγκρότημα των ελληνικών μεραρχιών
    καταστράφηκε στο Δουμλουπινάρ στις 30 Αυγούστου και ο στρατηγός Τρικούπης παραδόθηκε στις 2
    Σεπτεμβρίου. Μέσα σε δέκα ημέρες το μέτωπο μετακινήθηκε 300 χιλιόμετρα, οι ελληνικές
    απώλειες έφτασαν τις 50.000 περίπου σε νεκρούς, τραυματίες και αιχμαλώτους, και στις 9
    Σεπτεμβρίου το τουρκικό ιππικό μπήκε στη Σμύρνη. Η Ελλάδα έχασε τη Μικρά Ασία σε είκοσι
    τέσσερις ημέρες.
body:
  en: |
    Georgios Hatzianestis had taken command on 19 May 1922 and commanded from a yacht and
    from Smyrna, 300 kilometres from the front, with his divisions strung along a line of
    700 kilometres that no army of that size could hold. In July part of the force was
    withdrawn for an abortive move on Constantinople. The Turkish concentration opposite
    Afyonkarahisar achieved overwhelming local superiority on a narrow sector, which is
    all the general balance of 98,000 against 130,000 ever needed to mean.

    Afyonkarahisar fell on 27 August. The Battle of Dumlupınar on 30 August destroyed the
    southern group of divisions, and Turkey still marks 30 August as Victory Day. General
    Nikolaos Trikoupis surrendered on 2 September with a little over 5,000 men and 300
    officers, and learned from Mustafa Kemal that he had been appointed commander-in-chief
    two days earlier; some sources give 29 August for the surrender, but 2 September is
    better attested. Hatzianestis was relieved on 4 September, by which point there was
    no army left to hand over.

    Between 31 August and 9 September the front moved about 300 kilometres as the Greek
    army disintegrated toward the coast, burning villages behind it. Greek losses came to
    roughly 50,000 killed, wounded and captured by 7 September against Turkish casualties
    of about 13,476; some 35,000 Greek prisoners were taken and a large proportion did not
    survive captivity. The Greek headquarters left Smyrna on 7 September and Turkish
    cavalry entered on the 9th. The campaign closed with the capture of Erdek and Biga on
    18 September.
  el: |
    Ο Γεώργιος Χατζηανέστης είχε αναλάβει τη διοίκηση στις 19 Μαΐου 1922 και διοικούσε από
    θαλαμηγό και από τη Σμύρνη, 300 χιλιόμετρα από το μέτωπο, με τις μεραρχίες του απλωμένες σε
    γραμμή 700 χιλιομέτρων που κανένας στρατός αυτού του μεγέθους δεν μπορούσε να κρατήσει. Τον
    Ιούλιο μέρος της δύναμης αποσύρθηκε για μια εγχείρηση κατά της Κωνσταντινούπολης που δεν
    έγινε ποτέ. Η τουρκική συγκέντρωση απέναντι από το Αφιόν Καραχισάρ πέτυχε συντριπτική τοπική
    υπεροχή σε στενό τομέα, που ήταν ό,τι χρειαζόταν να σημαίνει η γενική αναλογία 98.000 προς
    130.000.

    Το Αφιόν Καραχισάρ έπεσε στις 27 Αυγούστου. Η μάχη του Δουμλουπινάρ, στις 30 Αυγούστου,
    κατέστρεψε το νότιο συγκρότημα μεραρχιών, και η Τουρκία γιορτάζει ακόμη την 30ή Αυγούστου
    ως Ημέρα της Νίκης. Ο στρατηγός Νικόλαος Τρικούπης παραδόθηκε στις 2 Σεπτεμβρίου με λίγο
    πάνω από 5.000 άνδρες και 300 αξιωματικούς, και πληροφορήθηκε από τον Μουσταφά Κεμάλ ότι
    είχε διοριστεί αρχιστράτηγος δύο ημέρες νωρίτερα· ορισμένες πηγές δίνουν την 29η Αυγούστου
    για την παράδοση, αλλά η 2α Σεπτεμβρίου τεκμηριώνεται καλύτερα. Ο Χατζηανέστης
    αντικαταστάθηκε στις 4 Σεπτεμβρίου, όταν δεν είχε απομείνει στρατός να παραδώσει.

    Από τις 31 Αυγούστου ως τις 9 Σεπτεμβρίου το μέτωπο μετακινήθηκε περίπου 300 χιλιόμετρα,
    καθώς ο ελληνικός στρατός διαλυόταν προς τα παράλια πυρπολώντας χωριά πίσω του. Οι ελληνικές
    απώλειες έφτασαν περίπου τις 50.000 σε νεκρούς, τραυματίες και αιχμαλώτους ως τις 7
    Σεπτεμβρίου, έναντι τουρκικών απωλειών περίπου 13.476. Αιχμαλωτίστηκαν περίπου 35.000
    Έλληνες και μεγάλο μέρος τους δεν επέζησε της αιχμαλωσίας. Το ελληνικό στρατηγείο εγκατέλειψε
    τη Σμύρνη στις 7 Σεπτεμβρίου και το τουρκικό ιππικό μπήκε στις 9. Η εκστρατεία έκλεισε με την
    κατάληψη του Ερντέκ και της Μπίγκα στις 18 Σεπτεμβρίου.
