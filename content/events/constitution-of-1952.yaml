id: constitution-of-1952
title:
  en: The Constitution of 1952
  el: Το Σύνταγμα του 1952
summary:
  en: >
    The constitution that came into force on 1 January 1952 closed the constitutional vacuum
    left by the Metaxas dictatorship and the war. It established a crowned parliamentary
    democracy in which the King was head of state, commander of the armed forces and, under
    Article 31, able to appoint and dismiss ministers. It codified the vote irrespective of
    gender, and Greek women voted in a national election for the first time in February 1956.
    It left the outlawed Left where it was, alongside Law 509/1947 and the exile islands. It
    governed Greece until the colonels seized power on 21 April 1967.
  el: >
    Το Σύνταγμα που τέθηκε σε ισχύ την 1η Ιανουαρίου 1952 έκλεισε το συνταγματικό κενό που
    άφησαν η δικτατορία Μεταξά και ο πόλεμος. Θέσπισε βασιλευομένη κοινοβουλευτική δημοκρατία
    στην οποία ο βασιλιάς ήταν αρχηγός του κράτους, αρχηγός των ενόπλων δυνάμεων και, με το
    άρθρο 31, μπορούσε να διορίζει και να παύει υπουργούς. Κατοχύρωσε το δικαίωμα ψήφου
    ανεξαρτήτως φύλου, και οι Ελληνίδες ψήφισαν σε εθνικές εκλογές για πρώτη φορά τον
    Φεβρουάριο του 1956. Άφησε την εκτός νόμου Αριστερά εκεί όπου την είχε βρει, δίπλα στον
    Νόμο 509/1947 και στα νησιά της εξορίας. Ίσχυσε ως την κατάληψη της εξουσίας από τους
    συνταγματάρχες στις 21 Απριλίου 1967.
body:
  en: |
    Greece had been governed since 1935 without a settled constitutional text: the restoration
    of that year revived the constitution of 1911, the Metaxas regime suspended its guarantees,
    and the occupation and the Civil War followed. The revisionary parliament elected after the
    war produced a document formally built on the 1911 text but adopted outside that text's own
    revision clause, which is why it is generally treated as a new constitution rather than an
    amendment.

    Its central provision was also its central flaw. The King was head of state and commander of
    the armed forces, and Article 31 gave him the appointment and dismissal of ministers. Whether
    executive authority therefore rested with an elected prime minister commanding a parliamentary
    majority or with the Crown was left unresolved, and every Greek political crisis of the next
    fifteen years turned on that ambiguity: Karamanlis and King Paul in 1963, Georgios Papandreou
    and Constantine II in 1965.

    Two other provisions mattered. The vote was codified irrespective of gender, and Greek women
    cast their first ballots in a national parliamentary election on 19 February 1956. Article 107
    permitted and protected foreign investment, a term of the reconstruction settlement built on
    American aid. What the constitution did not do was restore the legality of the defeated side:
    Law 509/1947, the deportation of suspects to the islands and the certificates of social
    convictions continued to operate alongside it, and that contradiction is the standing criticism
    made of the 1952 settlement. The text was formally replaced by the Constitution of 1975 after
    the fall of the junta.
  el: |
    Η Ελλάδα κυβερνιόταν από το 1935 χωρίς παγιωμένο συνταγματικό κείμενο: η παλινόρθωση εκείνης
    της χρονιάς επανέφερε το Σύνταγμα του 1911, το καθεστώς Μεταξά ανέστειλε τις εγγυήσεις του, και
    ακολούθησαν η Κατοχή και ο Εμφύλιος. Η αναθεωρητική βουλή που εκλέχθηκε μετά τον πόλεμο
    παρήγαγε ένα κείμενο τυπικά στηριγμένο στο Σύνταγμα του 1911, το οποίο όμως ψηφίστηκε εκτός της
    δικής του αναθεωρητικής διαδικασίας· γι' αυτό αντιμετωπίζεται γενικά ως νέο Σύνταγμα και όχι ως
    αναθεώρηση.

    Η κεντρική του διάταξη ήταν και η κεντρική του αδυναμία. Ο βασιλιάς ήταν αρχηγός του κράτους και
    αρχηγός των ενόπλων δυνάμεων, και το άρθρο 31 του έδινε τον διορισμό και την παύση των υπουργών.
    Το αν η εκτελεστική εξουσία ανήκε στον εκλεγμένο πρωθυπουργό που διέθετε κοινοβουλευτική
    πλειοψηφία ή στο Στέμμα έμεινε αδιευκρίνιστο, και κάθε πολιτική κρίση της επόμενης
    δεκαπενταετίας γύρισε γύρω από αυτή την ασάφεια: Καραμανλής και Παύλος το 1963, Γεώργιος
    Παπανδρέου και Κωνσταντίνος Β΄ το 1965.

    Δύο ακόμη διατάξεις βάρυναν. Το δικαίωμα ψήφου κατοχυρώθηκε ανεξαρτήτως φύλου, και οι Ελληνίδες
    ψήφισαν για πρώτη φορά σε βουλευτικές εκλογές στις 19 Φεβρουαρίου 1956. Το άρθρο 107 επέτρεπε
    και προστάτευε τις ξένες επενδύσεις, όρο του ανασυγκροτητικού συμβιβασμού που στηριζόταν στην
    αμερικανική βοήθεια. Εκείνο που το Σύνταγμα δεν έκανε ήταν να αποκαταστήσει τη νομιμότητα της
    ηττημένης πλευράς: ο Νόμος 509/1947, η εκτόπιση υπόπτων στα νησιά και τα πιστοποιητικά
    κοινωνικών φρονημάτων εξακολούθησαν να λειτουργούν παράλληλα με αυτό, και η αντίφαση αυτή είναι
    η πάγια κριτική που ασκείται στον συμβιβασμό του 1952. Το κείμενο αντικαταστάθηκε τυπικά από το
    Σύνταγμα του 1975 μετά την πτώση της χούντας.
