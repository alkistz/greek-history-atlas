id: abdication-of-constantine-1917
title:
  en: The removal of Constantine I and Greece's entry into the First World War
  el: Η έξωση του Κωνσταντίνου και η είσοδος της Ελλάδας στον Α΄ Παγκόσμιο Πόλεμο
summary:
  en: >
    The Allied High Commissioner Charles Jonnart demanded Constantine's departure on 11
    June 1917 in the name of the three powers that had guaranteed the Greek state in
    1832. Constantine left three days later without signing an abdication, and his
    second son Alexander took the oath as king. Venizelos returned to Athens, reunified
    the country under the parliament elected in 1915, and declared war on the Central
    Powers on 2 July. Greece put about 250,000 men into the field and lost some 5,000
    dead on the Macedonian Front.
  el: >
    Ο συμμαχικός ύπατος αρμοστής Σαρλ Ζονάρ απαίτησε στις 11 Ιουνίου 1917 την αποχώρηση του
    Κωνσταντίνου, στο όνομα των τριών δυνάμεων που είχαν εγγυηθεί το ελληνικό κράτος το 1832.
    Ο Κωνσταντίνος έφυγε τρεις ημέρες αργότερα χωρίς να υπογράψει παραίτηση, και τον θρόνο
    ανέλαβε ο δευτερότοκος γιος του Αλέξανδρος. Ο Βενιζέλος επέστρεψε στην Αθήνα, επανένωσε τη
    χώρα υπό τη Βουλή που είχε εκλεγεί το 1915 και κήρυξε τον πόλεμο στις Κεντρικές Δυνάμεις
    στις 2 Ιουλίου. Η Ελλάδα παρέταξε περίπου 250.000 άνδρες και έχασε περί τους 5.000 νεκρούς
    στο Μακεδονικό Μέτωπο.
body:
  en: |
    The Allies had blockaded royalist Greece since December 1916 and occupied Thessaly in
    June 1917 to take its grain. Charles Jonnart, a French senator, was appointed High
    Commissioner with one instruction: remove the King. His ultimatum of 11 June invoked
    the protecting powers' rights under the settlement of 1832, which made the demand a
    legal act of the same order as the one that had created the monarchy.

    Constantine chose not to fight. Alexander swore the constitutional oath on 11 or 12
    June, sources differ, the Allies having vetoed Crown Prince George as too close to
    his father. Constantine left Greece on 14 June for Switzerland, taking George with
    him, and the proclamation of that day is as near to an abdication as he ever came.
    He never signed one, which is why he could be brought back in 1920.

    Venizelos formed a government on 26 June. Rather than hold an election he recalled
    the chamber elected in June 1915, the one Constantine had dissolved, which Greeks
    named the Lazarus Chamber. Relations with the Central Powers were severed on 29 June
    and war was declared on 2 July 1917; some Greek sources give 30 June, which is an
    Old Style and New Style confusion rather than a disagreement about the event. The
    new government then purged the royalist officer corps and civil service and exiled
    leaders including Metaxas and Dousmanis to Corsica, which guaranteed that the next
    change of government would purge in the other direction.

    Greece eventually fielded nine or ten divisions on the Macedonian Front. Greek troops
    took Skra di Legen on 30 May 1918 and shared in the September offensive that knocked
    Bulgaria out of the war. About 5,000 were killed and total casualties passed 24,000,
    and the victory earned Greece the seat at the peace conference from which Venizelos
    asked for Smyrna.
  el: |
    Οι Σύμμαχοι απέκλειαν τη βασιλική Ελλάδα από τον Δεκέμβριο του 1916 και τον Ιούνιο του
    1917 κατέλαβαν τη Θεσσαλία για να εξασφαλίσουν το σιτάρι της. Ο Σαρλ Ζονάρ, Γάλλος
    γερουσιαστής, διορίστηκε ύπατος αρμοστής με μία εντολή: να απομακρύνει τον βασιλιά. Το
    τελεσίγραφό του της 11ης Ιουνίου επικαλέστηκε τα δικαιώματα των προστάτιδων δυνάμεων από
    τη ρύθμιση του 1832, πράγμα που έκανε την απαίτηση νομική πράξη της ίδιας τάξεως με εκείνη
    που είχε δημιουργήσει τη μοναρχία.

    Ο Κωνσταντίνος επέλεξε να μην αντισταθεί. Ο Αλέξανδρος ορκίστηκε στις 11 ή στις 12 Ιουνίου,
    οι πηγές διαφέρουν, καθώς οι Σύμμαχοι είχαν απορρίψει τον διάδοχο Γεώργιο ως υπερβολικά
    κοντά στον πατέρα του. Ο Κωνσταντίνος έφυγε από την Ελλάδα στις 14 Ιουνίου για την Ελβετία,
    παίρνοντας μαζί του τον Γεώργιο, και η διακήρυξη εκείνης της ημέρας είναι ό,τι πλησιέστερο
    σε παραίτηση υπέγραψε ποτέ. Επίσημη παραίτηση δεν υπέγραψε, και γι' αυτό μπόρεσε να
    επανέλθει το 1920.

    Ο Βενιζέλος σχημάτισε κυβέρνηση στις 26 Ιουνίου. Αντί για εκλογές ανακάλεσε τη Βουλή του
    Ιουνίου 1915, εκείνη που είχε διαλύσει ο Κωνσταντίνος, και που έμεινε γνωστή ως Βουλή των
    Λαζάρων. Οι σχέσεις με τις Κεντρικές Δυνάμεις διακόπηκαν στις 29 Ιουνίου και ο πόλεμος
    κηρύχθηκε στις 2 Ιουλίου 1917· ορισμένες ελληνικές πηγές δίνουν την 30ή Ιουνίου, που είναι
    σύγχυση παλαιού και νέου ημερολογίου και όχι διαφωνία για το γεγονός. Η νέα κυβέρνηση
    εκκαθάρισε το βασιλικό σώμα αξιωματικών και τη δημόσια διοίκηση και εξόρισε στην Κορσική
    ηγετικά στελέχη, ανάμεσά τους τον Μεταξά και τον Δούσμανη, εξασφαλίζοντας ότι η επόμενη
    αλλαγή κυβέρνησης θα εκκαθάριζε προς την αντίθετη κατεύθυνση.

    Η Ελλάδα παρέταξε τελικά εννέα ή δέκα μεραρχίες στο Μακεδονικό Μέτωπο. Ελληνικά τμήματα
    κατέλαβαν το Σκρα ντι Λέγκεν στις 30 Μαΐου 1918 και συμμετείχαν στην επίθεση του
    Σεπτεμβρίου που έβγαλε τη Βουλγαρία από τον πόλεμο. Σκοτώθηκαν περίπου 5.000 άνδρες και οι
    συνολικές απώλειες ξεπέρασαν τις 24.000. Η νίκη εξασφάλισε στην Ελλάδα τη θέση στη
    Συνδιάσκεψη της Ειρήνης από την οποία ο Βενιζέλος ζήτησε τη Σμύρνη.
