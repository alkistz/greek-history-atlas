id: national-defence-thessaloniki
title:
  en: The National Defence movement and the Provisional Government of Thessaloniki
  el: Το Κίνημα της Εθνικής Αμύνης και η Προσωρινή Κυβέρνηση Θεσσαλονίκης
summary:
  en: >
    After the royal government surrendered Fort Roupel to German and Bulgarian forces
    and then let an entire army corps be interned in Germany, Venizelist officers seized
    Thessaloniki on 30 August 1916. Venizelos joined them in October and a triumvirate
    of himself, General Danglis and Admiral Kountouriotis took power over Macedonia,
    Crete and the islands. It declared war on Bulgaria and Germany in December, nine
    months before Athens did. For nine months Greece had two governments, two armies and
    two foreign policies.
  el: >
    Αφού η βασιλική κυβέρνηση παρέδωσε το οχυρό Ρούπελ στις γερμανοβουλγαρικές δυνάμεις και
    στη συνέχεια άφησε ολόκληρο σώμα στρατού να αιχμαλωτιστεί στη Γερμανία, βενιζελικοί
    αξιωματικοί κατέλαβαν τη Θεσσαλονίκη στις 30 Αυγούστου 1916. Ο Βενιζέλος τους συνάντησε
    τον Οκτώβριο και τριανδρία με τον ίδιο, τον στρατηγό Δαγκλή και τον ναύαρχο Κουντουριώτη
    ανέλαβε την εξουσία στη Μακεδονία, την Κρήτη και τα νησιά. Τον Δεκέμβριο κήρυξε τον πόλεμο
    στη Βουλγαρία και τη Γερμανία, εννέα μήνες πριν από την Αθήνα. Για εννέα μήνες η Ελλάδα
    είχε δύο κυβερνήσεις, δύο στρατούς και δύο εξωτερικές πολιτικές.
body:
  en: |
    The provocation was military humiliation. On 26 May 1916 Fort Roupel on the Struma
    was handed over to German and Bulgarian troops on orders from Athens, opening Eastern
    Macedonia to occupation. In September the whole IV Army Corps at Kavala surrendered
    without fighting, and some 6,000 Greek soldiers were carried off to internment at
    Görlitz in Germany. To officers who had taken that ground four years earlier, the
    neutrality of the Crown had become indistinguishable from collaboration.

    The coup of 30 August 1916 was made by Venizelist officers under Colonel Epameinondas
    Zymvrakakis with about 600 Cretan gendarmes, and Venizelos had no part in it. He left
    Athens on 25 September, sailed by way of Crete, and reached Thessaloniki on 7 October;
    some accounts date the provisional government's formal landing to 9 October. On 11
    October the triumvirate was constituted: Venizelos for the political direction,
    General Panagiotis Danglis for the army, Admiral Pavlos Kountouriotis for the navy.
    Nikolaos Politis took foreign affairs.

    The provisional government held Macedonia, Crete, the Aegean islands and the Epirot
    coast, raised the National Defence Army Corps, and declared war on Bulgaria and
    Germany on 6 and 7 December 1916. Britain and France recognised it in fact on 2
    December, in the middle of the Noemvriana, and blockaded the Greece that remained
    to Athens. It dissolved itself on 15 June 1917, once Constantine had gone and
    Venizelos could return to the capital as prime minister of a single state. The
    division it institutionalised outlasted it by twenty years.
  el: |
    Η αφορμή ήταν στρατιωτική ταπείνωση. Στις 26 Μαΐου 1916 το οχυρό Ρούπελ στον Στρυμόνα
    παραδόθηκε στα γερμανικά και βουλγαρικά στρατεύματα με εντολή της Αθήνας, ανοίγοντας την
    Ανατολική Μακεδονία στην κατοχή. Τον Σεπτέμβριο ολόκληρο το Δ΄ Σώμα Στρατού στην Καβάλα
    παραδόθηκε αμαχητί και περίπου 6.000 Έλληνες στρατιώτες μεταφέρθηκαν σε εγκλεισμό στο
    Γκέρλιτς της Γερμανίας. Για αξιωματικούς που είχαν κατακτήσει αυτά τα εδάφη τέσσερα χρόνια
    νωρίτερα, η ουδετερότητα του Στέμματος δεν ξεχώριζε πια από τη συνεργασία.

    Το κίνημα της 30ής Αυγούστου 1916 έγινε από βενιζελικούς αξιωματικούς υπό τον συνταγματάρχη
    Επαμεινώνδα Ζυμβρακάκη με περίπου 600 Κρήτες χωροφύλακες, και ο Βενιζέλος δεν είχε
    συμμετοχή σε αυτό. Έφυγε από την Αθήνα στις 25 Σεπτεμβρίου, πέρασε από την Κρήτη και έφτασε
    στη Θεσσαλονίκη στις 7 Οκτωβρίου· άλλες πηγές τοποθετούν την επίσημη αποβίβαση της
    προσωρινής κυβέρνησης στις 9 Οκτωβρίου. Στις 11 Οκτωβρίου συγκροτήθηκε η τριανδρία: ο
    Βενιζέλος για την πολιτική ηγεσία, ο στρατηγός Παναγιώτης Δαγκλής για τον στρατό, ο ναύαρχος
    Παύλος Κουντουριώτης για το ναυτικό. Τα Εξωτερικά ανέλαβε ο Νικόλαος Πολίτης.

    Η Προσωρινή Κυβέρνηση ήλεγχε τη Μακεδονία, την Κρήτη, τα νησιά του Αιγαίου και την ηπειρωτική
    παραλία, συγκρότησε το Σώμα Στρατού Εθνικής Αμύνης και κήρυξε τον πόλεμο στη Βουλγαρία και
    τη Γερμανία στις 6 και 7 Δεκεμβρίου 1916. Η Βρετανία και η Γαλλία την αναγνώρισαν de facto
    στις 2 Δεκεμβρίου, εν μέσω των Νοεμβριανών, και απέκλεισαν την Ελλάδα που είχε απομείνει
    στην Αθήνα. Αυτοδιαλύθηκε στις 15 Ιουνίου 1917, όταν ο Κωνσταντίνος είχε φύγει και ο
    Βενιζέλος μπορούσε να επιστρέψει στην πρωτεύουσα ως πρωθυπουργός ενιαίου κράτους. Ο
    διχασμός που θεσμοθέτησε την επέζησε κατά είκοσι χρόνια.
