id: macedonian-struggle
title:
  en: The Macedonian Struggle
  el: Ο Μακεδονικός Αγώνας
summary:
  en: >
    Between 1904 and 1908 Greek, Bulgarian, Serbian and Ottoman armed bands fought for
    control of the villages of Ottoman Macedonia, each trying to fix the allegiance of a
    population that the next peace conference would be asked to count. Greece fought
    deniably, through officers on extended leave with false names and bands funded from
    Athens and run out of its consulates. More than 700 Greek fighters and about 1,250
    pro-Greek civilians were killed, within a total of roughly 8,000 dead on all sides. The
    Young Turk Revolution closed the armed phase without anyone winning it.
  el: >
    Από το 1904 ως το 1908 ελληνικά, βουλγαρικά, σερβικά και οθωμανικά ένοπλα σώματα
    διεκδίκησαν τον έλεγχο των χωριών της οθωμανικής Μακεδονίας, καθένα προσπαθώντας να
    καθορίσει τη συνείδηση ενός πληθυσμού που το επόμενο συνέδριο ειρήνης θα καλούνταν να
    μετρήσει. Η Ελλάδα πολέμησε χωρίς να το ομολογεί, με αξιωματικούς σε μακρά άδεια, με
    ψευδώνυμα, με σώματα που χρηματοδοτούνταν από την Αθήνα και καθοδηγούνταν από τα
    προξενεία της. Σκοτώθηκαν πάνω από 700 Έλληνες αγωνιστές και περίπου 1.250 φιλέλληνες
    άμαχοι, μέσα σε ένα σύνολο γύρω στους 8.000 νεκρούς από όλες τις πλευρές. Η
    Νεοτουρκική Επανάσταση έκλεισε την ένοπλη φάση χωρίς να την κερδίσει κανείς.
body:
  en: |
    The contest opened out of the Bulgarian-led Ilinden uprising of August 1903 and the
    collapse of Ottoman authority in the vilayets of Monastir, Thessaloniki and Kosovo.
    Bishop Germanos Karavangelis had been organising the villages around Kastoria since
    1900; from 1904 Athens put money and officers behind him through a Macedonian
    Committee, the consulate at Thessaloniki under Lambros Koromilas and the vice-consulate
    at Monastir under Ion Dragoumis. The Cretan officer Georgios Katechakis, known as
    Rouvas, became the central military organiser. At their peak the Greek bands numbered
    some 2,000 men.

    Pavlos Melas, an artillery second lieutenant travelling as Mikis Zezas, crossed into
    Macedonia four times in 1904. On the last of them he led about a dozen men, among them
    the chieftain Lakis Pyrzas and ten Cretans. An Ottoman detachment surrounded the
    village of Statista on 13/26 October and he was the only man in his band to die.
    Accounts differ as to whether the shot came from the Ottomans, from an accident, or
    from within his own party. His head was buried at Kastoria and his body at Statista,
    which was renamed Melas in 1927.

    The armed phase ended not in victory but in an amnesty. The Young Turk revolt began at
    Resne on 3 July 1908 and Abdul Hamid II restored the 1876 constitution on the night of
    10/11 July, 23 and 24 July New Style; the new regime negotiated the surrender of the
    Greek and Bulgarian bands instead of destroying them. The Struggle moved no frontier.
    What it did was hold a Greek claim on the ground in villages the Greek army reached
    four years later, in October and November 1912, and it is that conversion of claim into
    territory that gives it its place in the atlas. The outer dates vary by source: 1904 to
    1908 for the armed phase, 1903 to 1908, or 1893 to 1912 for the whole contest.
  el: |
    Η σύγκρουση ξεπήδησε από την εξέγερση του Ίλιντεν τον Αύγουστο του 1903, με βουλγαρική
    πρωτοβουλία, και από την κατάρρευση της οθωμανικής εξουσίας στα βιλαέτια Μοναστηρίου,
    Θεσσαλονίκης και Κοσόβου. Ο μητροπολίτης Καστοριάς Γερμανός Καραβαγγέλης οργάνωνε τα
    χωριά της περιοχής του από το 1900. Από το 1904 η Αθήνα τον στήριξε με χρήμα και
    αξιωματικούς, μέσω του Μακεδονικού Κομιτάτου, του προξενείου Θεσσαλονίκης υπό τον
    Λάμπρο Κορομηλά και του υποπροξενείου Μοναστηρίου υπό τον Ίωνα Δραγούμη. Ο Κρητικός
    αξιωματικός Γεώργιος Κατεχάκης, ο Ρούβας, έγινε ο κεντρικός στρατιωτικός οργανωτής. Στην
    κορύφωσή τους τα ελληνικά σώματα αριθμούσαν περίπου 2.000 άνδρες.

    Ο Παύλος Μελάς, ανθυπολοχαγός του πυροβολικού που ταξίδευε ως Μίκης Ζέζας, πέρασε
    τέσσερις φορές στη Μακεδονία μέσα στο 1904. Στην τελευταία αποστολή είχε μαζί του
    περίπου δώδεκα άνδρες, ανάμεσά τους τον οπλαρχηγό Λάκη Πυρζά και δέκα Κρητικούς.
    Οθωμανικό απόσπασμα περικύκλωσε τη Στάτιστα στις 13/26 Οκτωβρίου και ήταν ο μόνος του
    σώματός του που σκοτώθηκε. Οι μαρτυρίες διαφέρουν ως προς το αν η σφαίρα ήρθε από τους
    Οθωμανούς, από ατύχημα ή μέσα από το ίδιο το σώμα του. Η κεφαλή του τάφηκε στην Καστοριά
    και το σώμα του στη Στάτιστα, που το 1927 μετονομάστηκε σε Μελάς.

    Η ένοπλη φάση δεν έληξε με νίκη αλλά με αμνηστία. Το νεοτουρκικό κίνημα ξεκίνησε στη
    Ρέσνα στις 3 Ιουλίου 1908 και ο Αβδούλ Χαμίτ Β΄ επανέφερε το σύνταγμα του 1876 τη νύχτα
    της 10ης προς 11η Ιουλίου, 23 και 24 Ιουλίου με το νέο ημερολόγιο. Το νέο καθεστώς
    διαπραγματεύτηκε την παράδοση των ελληνικών και βουλγαρικών σωμάτων αντί να τα
    συντρίψει. Ο Αγώνας δεν μετακίνησε σύνορο. Αυτό που πέτυχε ήταν να κρατήσει μια ελληνική
    αξίωση πάνω στο έδαφος, σε χωριά όπου ο ελληνικός στρατός έφτασε τέσσερα χρόνια
    αργότερα, τον Οκτώβριο και τον Νοέμβριο του 1912. Τα εξωτερικά όρια του Αγώνα ποικίλλουν
    ανά πηγή: 1904 ως 1908 για την ένοπλη φάση, 1903 ως 1908, ή 1893 ως 1912 για το σύνολο
    της αναμέτρησης.
