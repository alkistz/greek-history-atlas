id: holocaust-bulgarian-zone-1943
title:
  en: The deportation of the Jews of the Bulgarian zone
  el: Η εκτόπιση των Εβραίων της βουλγαρικής ζώνης
summary:
  en: >
    At four in the morning on 4 March 1943 Bulgarian forces arrested 4,058 of the 4,273
    Jews of western Thrace and eastern Macedonia, the Greek territory Bulgaria had
    occupied in 1941 and was administering as its own. The arrests were made under the
    Dannecker and Belev agreement of 22 February, by which Bulgaria undertook to deliver
    20,000 Jews from the lands it held. The prisoners were held at Gorna Dzhumaya and
    Dupnitsa, put aboard four Danube barges at Lom on 20 and 21 March and taken on by
    rail from Katowice to Treblinka, where all were gassed on arrival. Ninety-seven per
    cent of the Jews of the Bulgarian zone were murdered and no deportee is known to have
    survived. The communities of Kavala, Komotini, Drama, Xanthi, Serres and
    Alexandroupoli ended in three weeks.
  el: >
    Στις τέσσερις τα ξημερώματα της 4ης Μαρτίου 1943 βουλγαρικές δυνάμεις συνέλαβαν 4.058
    από τους 4.273 Εβραίους της δυτικής Θράκης και της ανατολικής Μακεδονίας, του ελληνικού
    εδάφους που η Βουλγαρία είχε καταλάβει το 1941 και διοικούσε ως δικό της. Οι συλλήψεις
    έγιναν βάσει της συμφωνίας Ντάνεκερ και Μπέλεφ της 22ας Φεβρουαρίου, με την οποία η
    Βουλγαρία ανέλαβε να παραδώσει 20.000 Εβραίους από τα εδάφη που κατείχε. Οι κρατούμενοι
    έμειναν στη Γκόρνα Τζουμαγιά και στην Ντούπνιτσα, φορτώθηκαν σε τέσσερις φορτηγίδες του
    Δούναβη στο Λομ στις 20 και 21 Μαρτίου και μεταφέρθηκαν σιδηροδρομικώς από το Κατοβίτσε
    στην Τρεμπλίνκα, όπου θανατώθηκαν όλοι με αέριο με την άφιξη. Δολοφονήθηκε το ενενήντα
    επτά τοις εκατό των Εβραίων της βουλγαρικής ζώνης και δεν είναι γνωστός ούτε ένας
    επιζών. Οι κοινότητες της Καβάλας, της Κομοτηνής, της Δράμας, της Ξάνθης, των Σερρών
    και της Αλεξανδρούπολης έπαψαν να υπάρχουν μέσα σε τρεις εβδομάδες.
body:
  en: |
    Bulgaria was the only Axis power that claimed Greek territory as its own rather than
    simply occupying it, and in eastern Macedonia and western Thrace it imposed Bulgarian
    law, currency, schools and administration. The deportation of the Jews of that zone
    was therefore carried out by Bulgaria itself, not by Germany. The instrument was the
    agreement signed on 22 February 1943 between SS-Hauptsturmführer Theodor Dannecker
    and Aleksandar Belev, the Bulgarian Commissar for Jewish Affairs, under which Bulgaria
    undertook to hand over 20,000 Jews from the territories it had taken in Greece and
    Yugoslavia.

    The arrests began at four in the morning on 4 March 1943 and were made in a single
    sweep: 1,484 in Kavala, 878 in Komotini, 589 in Drama, 526 in Xanthi, 471 in Serres
    and 42 in Alexandroupoli, 4,058 people out of a Jewish population of 4,273. The
    prisoners were taken north into Bulgaria and held at Gorna Dzhumaya and Dupnitsa from
    6 to 10 March. On 20 and 21 March they were loaded onto four Danube barges at Lom,
    reached Katowice on 26 and 27 March and were carried by rail to Treblinka, where they
    were gassed on arrival.

    Ninety-seven per cent of the Jews of the Bulgarian zone were murdered, the highest
    proportion of any region of Greece, and no deportee from the zone is known to have
    survived. The Jewish community of Kavala, which had been there for centuries, was
    annihilated in a morning. The deportation of the Jews of Thessaloniki, from the German
    zone to Auschwitz-Birkenau, began eleven days after the arrests here and was a
    separate operation with a different destination.
  el: |
    Η Βουλγαρία ήταν η μόνη δύναμη του Άξονα που διεκδίκησε ελληνικό έδαφος ως δικό της
    αντί απλώς να το κατέχει, και στην ανατολική Μακεδονία και τη δυτική Θράκη επέβαλε
    βουλγαρικό δίκαιο, νόμισμα, σχολεία και διοίκηση. Την εκτόπιση των Εβραίων της ζώνης
    αυτής την εκτέλεσε επομένως η ίδια η Βουλγαρία και όχι η Γερμανία. Το μέσο ήταν η
    συμφωνία που υπογράφηκε στις 22 Φεβρουαρίου 1943 ανάμεσα στον SS-Hauptsturmführer
    Τέοντορ Ντάνεκερ και τον Αλεξάνταρ Μπέλεφ, βούλγαρο επίτροπο για τα εβραϊκά ζητήματα,
    με την οποία η Βουλγαρία ανέλαβε να παραδώσει 20.000 Εβραίους από τα εδάφη που είχε
    καταλάβει στην Ελλάδα και τη Γιουγκοσλαβία.

    Οι συλλήψεις άρχισαν στις τέσσερις τα ξημερώματα της 4ης Μαρτίου 1943 και έγιναν με μία
    και μόνη επιχείρηση: 1.484 στην Καβάλα, 878 στην Κομοτηνή, 589 στη Δράμα, 526 στην
    Ξάνθη, 471 στις Σέρρες και 42 στην Αλεξανδρούπολη, 4.058 άνθρωποι από εβραϊκό πληθυσμό
    4.273. Οι κρατούμενοι μεταφέρθηκαν βόρεια, στη Βουλγαρία, και κρατήθηκαν στη Γκόρνα
    Τζουμαγιά και στην Ντούπνιτσα από τις 6 ως τις 10 Μαρτίου. Στις 20 και 21 Μαρτίου
    φορτώθηκαν σε τέσσερις φορτηγίδες του Δούναβη στο Λομ, έφτασαν στο Κατοβίτσε στις 26
    και 27 Μαρτίου και οδηγήθηκαν σιδηροδρομικώς στην Τρεμπλίνκα, όπου θανατώθηκαν με αέριο
    με την άφιξη.

    Δολοφονήθηκε το ενενήντα επτά τοις εκατό των Εβραίων της βουλγαρικής ζώνης, το
    υψηλότερο ποσοστό από κάθε άλλη περιοχή της Ελλάδας, και δεν είναι γνωστός κανένας
    επιζών εκτοπισμένος από τη ζώνη. Η εβραϊκή κοινότητα της Καβάλας, που βρισκόταν εκεί
    αιώνες, εξοντώθηκε μέσα σε ένα πρωινό. Η εκτόπιση των Εβραίων της Θεσσαλονίκης, από τη
    γερμανική ζώνη προς το Άουσβιτς-Μπίρκεναου, άρχισε έντεκα ημέρες μετά τις συλλήψεις εδώ
    και ήταν χωριστή επιχείρηση με άλλον προορισμό.
