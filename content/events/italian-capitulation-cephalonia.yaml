id: italian-capitulation-cephalonia
title:
  en: The Italian armistice and the massacre of the Acqui Division
  el: Η συνθηκολόγηση της Ιταλίας και η σφαγή της μεραρχίας Άκουι
summary:
  en: >
    Italy's armistice with the Allies was announced on 8 September 1943 and left the
    largest occupation zone in Greece without a governing power overnight. German troops
    moved in at once, disarming Italian garrisons everywhere, but on Cephalonia the 12,000
    men of the Acqui Division voted to fight. They held out from 13 to 22 September and
    were then shot as prisoners; General Antonio Gandin was executed on 24 September. Some
    Italian units handed their weapons to ELAS instead, which acquired artillery, mortars
    and thousands of rifles and with them a decisive advantage in the mountains.
  el: >
    Η συνθηκολόγηση της Ιταλίας με τους Συμμάχους ανακοινώθηκε στις 8 Σεπτεμβρίου 1943 και
    άφησε μέσα σε μια νύχτα τη μεγαλύτερη ζώνη κατοχής στην Ελλάδα χωρίς εξουσία. Οι
    Γερμανοί μπήκαν αμέσως και αφόπλισαν τις ιταλικές φρουρές παντού, αλλά στην Κεφαλονιά
    οι 12.000 άνδρες της μεραρχίας Άκουι ψήφισαν να πολεμήσουν. Κράτησαν από τις 13 ως τις
    22 Σεπτεμβρίου και στη συνέχεια εκτελέστηκαν ως αιχμάλωτοι, ενώ ο στρατηγός Αντόνιο
    Γκαντίν τουφεκίστηκε στις 24 Σεπτεμβρίου. Άλλες ιταλικές μονάδες παρέδωσαν τα όπλα τους
    στον ΕΛΑΣ, που απέκτησε πυροβόλα, όλμους και χιλιάδες τουφέκια και μαζί τους
    αποφασιστικό πλεονέκτημα στα βουνά.
body:
  en: |
    Operation Achse put the whole of Greece apart from the Bulgarian annexation under a
    single German administration within days. On Cephalonia General Antonio Gandin, who
    had commanded the Acqui Division since June, refused the German demand for
    unconditional surrender. He put the question to his officers and, by an informal poll,
    to his men, and the division chose to resist. Fighting against Battle Group Hirschfeld
    under Major Harald von Hirschfeld ran from 13 to 22 September with heavy Luftwaffe
    attack on the Italian positions.

    The Italians surrendered on 22 September. Systematic executions of prisoners had begun
    on 21 September and continued for about a week; Gandin was shot with other senior
    officers on 24 September 1943. The casualty figures are disputed between Italian and
    German historians. The division lost roughly 9,500 men in all: about 1,315 killed in
    the fighting, about 5,155 prisoners executed on the most widely cited reckoning, with
    lower scholarly estimates between 1,650 and 3,800, and some 3,000 drowned when ships
    carrying survivors to the mainland struck mines. On Corfu, where German troops landed
    on 24 September, all 280 Italian officers were shot over the following two days on the
    order of General Hubert Lanz. Italian soldiers elsewhere in Greece were sent to
    Germany as military internees.

    The takeover changed the occupation in two ways. It replaced the comparatively slack
    Italian administration with a harsher German one across two-thirds of the country and
    opened the season of large anti-partisan sweeps that produced Kalavryta in December
    1943 and Distomo in June 1944. And it armed ELAS. Italy's collapse three weeks before
    ELAS turned on EDES was among the reasons it could. Lanz was convicted at the
    Nuremberg Hostages Trial in 1948, sentenced to twelve years and released in 1951.
    Cephalonia became the founding episode of the Italian Resistance's account of itself.
  el: |
    Η επιχείρηση Achse έφερε μέσα σε λίγες μέρες ολόκληρη την Ελλάδα, εκτός από τη
    βουλγαρική προσάρτηση, κάτω από ενιαία γερμανική διοίκηση. Στην Κεφαλονιά ο στρατηγός
    Αντόνιο Γκαντίν, διοικητής της μεραρχίας Άκουι από τον Ιούνιο, απέρριψε τη γερμανική
    απαίτηση για άνευ όρων παράδοση. Έθεσε το ερώτημα στους αξιωματικούς του και, με άτυπη
    ψηφοφορία, στους άνδρες του, και η μεραρχία επέλεξε να αντισταθεί. Οι μάχες με την
    ομάδα Χίρσφελντ του ταγματάρχη Χάραλντ φον Χίρσφελντ κράτησαν από τις 13 ως τις 22
    Σεπτεμβρίου, με σφοδρές αεροπορικές επιθέσεις στις ιταλικές θέσεις.

    Οι Ιταλοί παραδόθηκαν στις 22 Σεπτεμβρίου. Οι συστηματικές εκτελέσεις αιχμαλώτων είχαν
    αρχίσει στις 21 Σεπτεμβρίου και συνεχίστηκαν περίπου μία εβδομάδα. Ο Γκαντίν
    τουφεκίστηκε μαζί με άλλους ανώτερους αξιωματικούς στις 24 Σεπτεμβρίου 1943. Οι
    αριθμοί των νεκρών αμφισβητούνται ανάμεσα σε Ιταλούς και Γερμανούς ιστορικούς. Η
    μεραρχία έχασε συνολικά περίπου 9.500 άνδρες: περίπου 1.315 σκοτωμένους στις μάχες,
    περίπου 5.155 αιχμαλώτους εκτελεσμένους κατά την επικρατέστερη εκτίμηση, με χαμηλότερες
    επιστημονικές εκτιμήσεις μεταξύ 1.650 και 3.800, και περί τους 3.000 πνιγμένους όταν
    τα πλοία που μετέφεραν τους επιζώντες στην ηπειρωτική χώρα χτύπησαν νάρκες. Στην
    Κέρκυρα, όπου γερμανικά τμήματα αποβιβάστηκαν στις 24 Σεπτεμβρίου, εκτελέστηκαν μέσα
    σε δύο μέρες και οι 280 Ιταλοί αξιωματικοί του νησιού, με διαταγή του στρατηγού
    Χούμπερτ Λαντς. Οι Ιταλοί στρατιώτες αλλού στην Ελλάδα στάλθηκαν στη Γερμανία ως
    στρατιωτικοί κρατούμενοι.

    Η αλλαγή χεριών μετέβαλε την Κατοχή σε δύο σημεία. Αντικατέστησε τη σχετικά χαλαρή
    ιταλική διοίκηση με σκληρότερη γερμανική στα δύο τρίτα της χώρας και άνοιξε την εποχή
    των μεγάλων εκκαθαριστικών επιχειρήσεων, από τις οποίες προέκυψαν τα Καλάβρυτα τον
    Δεκέμβριο του 1943 και το Δίστομο τον Ιούνιο του 1944. Και όπλισε τον ΕΛΑΣ. Η
    κατάρρευση της Ιταλίας τρεις εβδομάδες πριν ο ΕΛΑΣ στραφεί εναντίον του ΕΔΕΣ ήταν
    ανάμεσα στους λόγους που μπόρεσε να το κάνει. Ο Λαντς καταδικάστηκε στη δίκη των
    ομήρων στη Νυρεμβέργη το 1948 σε δωδεκαετή κάθειρξη και αποφυλακίστηκε το 1951. Η
    Κεφαλονιά έγινε το ιδρυτικό επεισόδιο της αφήγησης που η ιταλική Αντίσταση κρατά για
    τον εαυτό της.
