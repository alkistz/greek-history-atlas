id: cyprus-coup-1974
title:
  en: The Coup against Makarios in Cyprus
  el: Το πραξικόπημα κατά του Μακαρίου στην Κύπρο
summary:
  en: >
    On the morning of 15 July 1974 the Cypriot National Guard, officered by mainland
    Greeks and acting on orders from Ioannidis in Athens, shelled and stormed the
    Presidential Palace in Nicosia in order to kill Archbishop Makarios and proclaim
    union with Greece. Makarios left through a rear door, reached Paphos, and broadcast
    that he was alive. Nikos Sampson was sworn in as President the same day. Turkey
    cited the coup as grounds for intervening under the Treaty of Guarantee of 1960, and
    its troops landed five days later.
  el: >
    Το πρωί της 15ης Ιουλίου 1974 η κυπριακή Εθνική Φρουρά, με μητροπολιτικούς Έλληνες
    αξιωματικούς και με εντολή του Ιωαννίδη από την Αθήνα, βομβάρδισε και κατέλαβε το
    Προεδρικό Μέγαρο στη Λευκωσία με σκοπό να σκοτώσει τον αρχιεπίσκοπο Μακάριο και να
    ανακηρύξει την ένωση με την Ελλάδα. Ο Μακάριος βγήκε από πίσω πόρτα, έφτασε στην
    Πάφο και μετέδωσε ότι ζει. Ο Νίκος Σαμψών ορκίστηκε πρόεδρος την ίδια μέρα. Η
    Τουρκία επικαλέστηκε το πραξικόπημα για να επέμβει βάσει της Συνθήκης Εγγυήσεως του
    1960 και τα στρατεύματά της αποβιβάστηκαν πέντε μέρες αργότερα.
body:
  en: |
    Enosis had been the Greek Cypriot demand of the 1950s and the reason the island's
    independence in 1960 was a compromise nobody had wanted. By 1974 Makarios had
    abandoned it for an independent, non-aligned Cyprus, and had come into open conflict
    with Athens over the Greek officers commanding his own National Guard, whose
    withdrawal he had demanded in public. Ioannidis answered with the coup.

    Makarios escaped the shelling of the palace, was flown out by a British helicopter
    from Paphos to the base at Akrotiri on 16 July and on to Malta and London, and
    addressed the United Nations Security Council on 19 July. In Nicosia the National
    Guard installed Nikos Sampson, an EOKA veteran and newspaper publisher who was
    notorious among Turkish Cypriots for killings during the intercommunal fighting of
    1963 and 1964, which made him the least reassuring name the National Guard could
    have produced that morning.
    Under the Treaty of Guarantee of 1960 Britain, Greece and Turkey had the right to
    act, jointly if possible and singly if not, to restore the constitutional order.
    Britain declined the Turkish proposal for joint action.

    Sampson resigned on 23 July, the day after the first ceasefire and the day the junta
    in Athens collapsed, and Glafcos Clerides took over as acting President under the
    Cypriot constitution. Makarios returned to Cyprus on 7 December 1974 and resumed the
    presidency of a state that had lost more than a third of its territory in the
    meantime. Greek and Greek Cypriot accounts treat the coup as the junta's crime and
    the invasion that followed as a disproportionate and continuing occupation; Turkish
    accounts treat the coup as an attempt at enosis that made intervention lawful. The
    resolutions of the United Nations General Assembly and the Council of Europe in 1974
    and 1975 called for the withdrawal of foreign troops and the return of the refugees.
  el: |
    Η ένωση ήταν το ελληνοκυπριακό αίτημα της δεκαετίας του 1950 και ο λόγος που η
    ανεξαρτησία του 1960 υπήρξε συμβιβασμός που δεν τον ήθελε κανείς. Ως το 1974 ο
    Μακάριος την είχε εγκαταλείψει για μια ανεξάρτητη, αδέσμευτη Κύπρο και είχε έρθει σε
    ανοιχτή σύγκρουση με την Αθήνα για τους Έλληνες αξιωματικούς που διοικούσαν την ίδια
    του την Εθνική Φρουρά, των οποίων είχε ζητήσει δημόσια την ανάκληση. Ο Ιωαννίδης
    απάντησε με το πραξικόπημα.

    Ο Μακάριος γλίτωσε από τον βομβαρδισμό του Προεδρικού, μεταφέρθηκε με βρετανικό
    ελικόπτερο από την Πάφο στη βάση του Ακρωτηρίου στις 16 Ιουλίου και από εκεί στη
    Μάλτα και το Λονδίνο, και στις 19 Ιουλίου μίλησε στο Συμβούλιο Ασφαλείας του ΟΗΕ.
    Στη Λευκωσία η Εθνική Φρουρά εγκατέστησε τον Νίκο Σαμψών, παλαίμαχο της ΕΟΚΑ και
    εκδότη εφημερίδας, γνωστό στους Τουρκοκύπριους για φόνους κατά τις διακοινοτικές
    συγκρούσεις του 1963 και του 1964: το λιγότερο καθησυχαστικό όνομα που μπορούσε να
    βγάλει η Εθνική Φρουρά εκείνο το πρωί. Με βάση τη Συνθήκη Εγγυήσεως του 1960, η
    Βρετανία, η Ελλάδα και η Τουρκία είχαν δικαίωμα να ενεργήσουν, από κοινού αν ήταν
    δυνατόν και μόνες αν δεν ήταν, για την αποκατάσταση της συνταγματικής τάξης. Η
    Βρετανία απέρριψε την τουρκική πρόταση για κοινή δράση.

    Ο Σαμψών παραιτήθηκε στις 23 Ιουλίου, μία μέρα μετά την πρώτη εκεχειρία και την ίδια
    μέρα που κατέρρευσε η χούντα στην Αθήνα, και χρέη προέδρου ανέλαβε βάσει του
    κυπριακού συντάγματος ο Γλαύκος Κληρίδης. Ο Μακάριος επέστρεψε στην Κύπρο στις
    7 Δεκεμβρίου 1974 και ανέλαβε ξανά την προεδρία ενός κράτους που στο μεταξύ είχε
    χάσει πάνω από το ένα τρίτο του εδάφους του. Οι ελληνικές και ελληνοκυπριακές
    αφηγήσεις βλέπουν στο πραξικόπημα το έγκλημα της χούντας και στην εισβολή που
    ακολούθησε μια δυσανάλογη και συνεχιζόμενη κατοχή. Οι τουρκικές αφηγήσεις βλέπουν
    στο πραξικόπημα απόπειρα ένωσης που καθιστούσε νόμιμη την επέμβαση. Τα ψηφίσματα της
    Γενικής Συνέλευσης του ΟΗΕ και του Συμβουλίου της Ευρώπης το 1974 και το 1975
    ζητούσαν την αποχώρηση των ξένων στρατευμάτων και την επιστροφή των προσφύγων.
