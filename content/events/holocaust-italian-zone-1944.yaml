id: holocaust-italian-zone-1944
title:
  en: "The Holocaust in the Italian zone: Ioannina, Corfu and Rhodes"
  el: "Το Ολοκαύτωμα στην ιταλική ζώνη: Ιωάννινα, Κέρκυρα, Ρόδος"
summary:
  en: >
    The communities Italy had shielded were destroyed once Germany took over its zone.
    Jews were arrested across the mainland on 23 and 24 March 1944 and in Ioannina at dawn
    on 25 March, where 1,960 Romaniote Jews, Greek-speaking and settled since antiquity,
    were taken and 1,850 never came back. Corfu followed on 8 June and Rhodes on 23 July,
    the Rhodes transport reaching Auschwitz on 16 August after more than three weeks in
    transit, with 157 survivors out of about 1,700. Between 58,800 and 67,000 Greek Jews
    were murdered in all, 83 to 87 per cent of the pre-war community, the highest national
    proportion in occupied Europe outside Poland and the Baltic states.
  el: >
    Οι κοινότητες που είχε προστατεύσει η Ιταλία καταστράφηκαν μόλις η Γερμανία ανέλαβε τη
    ζώνη της. Στις 23 και 24 Μαρτίου 1944 έγιναν συλλήψεις Εβραίων σε όλη την ηπειρωτική
    Ελλάδα και στις 25 Μαρτίου, την αυγή, στα Ιωάννινα, όπου συνελήφθησαν 1.960 Ρωμανιώτες
    Εβραίοι, ελληνόφωνοι και εγκατεστημένοι από την αρχαιότητα: οι 1.850 δεν γύρισαν ποτέ.
    Ακολούθησαν η Κέρκυρα στις 8 Ιουνίου και η Ρόδος στις 23 Ιουλίου, με τον συρμό της
    Ρόδου να φτάνει στο Άουσβιτς στις 16 Αυγούστου έπειτα από ταξίδι πάνω από τρεις
    εβδομάδες και μόνο 157 επιζώντες από περίπου 1.700 ανθρώπους. Συνολικά δολοφονήθηκαν
    από 58.800 ως 67.000 Έλληνες Εβραίοι, το 83 ως 87 τοις εκατό της προπολεμικής
    κοινότητας, το υψηλότερο εθνικό ποσοστό στην κατεχόμενη Ευρώπη εκτός Πολωνίας και
    Βαλτικής.
body:
  en: |
    Italy had not implemented the Final Solution in the zone it administered, and the
    Jews of Epirus, Thessaly, the Ionian islands and the Dodecanese survived into 1944 for
    that reason alone. When Germany took the zone over after the Italian armistice, the
    machinery came with it. On 23 March 1944 the Germans used the distribution of matzah
    at an Athens synagogue to arrest some 300 Jews who came to collect it; on 24 March
    arrests followed in Patras, Chalkis, Arta, Preveza, Larissa, Volos, Kastoria and
    elsewhere. About 2,000 people were held at the Haidari camp outside Athens, and a
    train left the city on 2 April 1944, picking up more Jews as it went north.

    Ioannina was taken at dawn on 25 March 1944, Greek Independence Day, which that year
    coincided with the start of Passover. The 1,960 people deported by way of Larissa
    reached Auschwitz-Birkenau on 11 April 1944. Only about 110 to 160 Jews of Ioannina
    survived the war. The Jews of Corfu were rounded up on 8 June 1944, shipped and railed
    to Haidari, and sent to Poland on 21 June. About 1,700 Jews of Rhodes and just under
    100 from Kos were deported on 23 July 1944 and arrived at Auschwitz on 16 August;
    157 of them, about nine in a hundred, returned.

    There was rescue, and it is worth being exact about how little it took. The 275 Jews
    of Zakynthos survived entire because the German garrison commander did not carry out
    the deportation order, after protests from Mayor Loukas Karrer and Bishop
    Chrysostomos. In Athens Archbishop Damaskinos and the chief of police Angelos Evert
    issued false identity cards and baptismal certificates to some 1,200 people, and Rabbi
    Elias Barzilai destroyed the community register and went to the mountains rather than
    hand over the names; EAM and ELAS hid and smuggled out several hundred more. About
    10,000 Greek Jews survived the war out of a community of more than 70,000. The
    communities of Thessaloniki, Ioannina, Kavala, Rhodes and Corfu, some of them older
    than the Greek state and one of them older than Christianity in Greece, were
    effectively annihilated.
  el: |
    Η Ιταλία δεν είχε εφαρμόσει την Τελική Λύση στη ζώνη που διοικούσε, και οι Εβραίοι της
    Ηπείρου, της Θεσσαλίας, των Ιονίων νήσων και της Δωδεκανήσου έφτασαν ζωντανοί στο 1944
    μόνο γι' αυτόν τον λόγο. Όταν η Γερμανία ανέλαβε τη ζώνη μετά τη συνθηκολόγηση της
    Ιταλίας, ήρθε μαζί της και ο μηχανισμός. Στις 23 Μαρτίου 1944 οι Γερμανοί
    εκμεταλλεύτηκαν τη διανομή άζυμων σε συναγωγή της Αθήνας για να συλλάβουν περίπου 300
    Εβραίους που πήγαν να τα παραλάβουν. Στις 24 Μαρτίου ακολούθησαν συλλήψεις στην Πάτρα,
    τη Χαλκίδα, την Άρτα, την Πρέβεζα, τη Λάρισα, τον Βόλο, την Καστοριά και αλλού.
    Περίπου 2.000 άνθρωποι κρατήθηκαν στο στρατόπεδο του Χαϊδαρίου, και στις 2 Απριλίου
    1944 αναχώρησε από την Αθήνα συρμός που παραλάμβανε κι άλλους καθώς ανέβαινε βόρεια.

    Τα Ιωάννινα χτυπήθηκαν την αυγή της 25ης Μαρτίου 1944, ανήμερα της εθνικής επετείου,
    που εκείνη τη χρονιά συνέπεσε με την αρχή του Πέσαχ. Οι 1.960 εκτοπισμένοι, μέσω
    Λάρισας, έφτασαν στο Άουσβιτς-Μπίρκεναου στις 11 Απριλίου 1944. Από τους Εβραίους των
    Ιωαννίνων επέζησαν του πολέμου μόνο 110 ως 160 περίπου. Οι Εβραίοι της Κέρκυρας
    συνελήφθησαν στις 8 Ιουνίου 1944, μεταφέρθηκαν με πλοίο και τρένο στο Χαϊδάρι και
    στάλθηκαν στην Πολωνία στις 21 Ιουνίου. Περίπου 1.700 Εβραίοι της Ρόδου και λίγο
    λιγότεροι από 100 της Κω εκτοπίστηκαν στις 23 Ιουλίου 1944 και έφτασαν στο Άουσβιτς
    στις 16 Αυγούστου. Γύρισαν 157, περίπου εννέα στους εκατό.

    Υπήρξαν και διασώσεις, και αξίζει να λεχθεί με ακρίβεια πόσο λίγο χρειαζόταν. Οι 275
    Εβραίοι της Ζακύνθου σώθηκαν όλοι, επειδή ο Γερμανός διοικητής της φρουράς δεν εκτέλεσε
    τη διαταγή εκτόπισης ύστερα από τις διαμαρτυρίες του δημάρχου Λουκά Καρρέρ και του
    μητροπολίτη Χρυσοστόμου. Στην Αθήνα ο αρχιεπίσκοπος Δαμασκηνός και ο αστυνομικός
    διευθυντής Άγγελος Έβερτ εξέδωσαν πλαστές ταυτότητες και πιστοποιητικά βαπτίσεως σε
    περίπου 1.200 ανθρώπους, ενώ ο ραβίνος Ηλίας Μπαρζιλάι κατέστρεψε το μητρώο της
    κοινότητας και ανέβηκε στο βουνό αντί να παραδώσει τα ονόματα. Το ΕΑΜ και ο ΕΛΑΣ
    έκρυψαν και διέφυγαν αρκετές εκατοντάδες ακόμη. Από κοινότητα άνω των 70.000 ανθρώπων
    επέζησαν περίπου 10.000. Οι κοινότητες της Θεσσαλονίκης, των Ιωαννίνων, της Καβάλας,
    της Ρόδου και της Κέρκυρας, ορισμένες παλαιότερες από το ελληνικό κράτος και μία
    παλαιότερη από τον χριστιανισμό στην Ελλάδα, εξαφανίστηκαν.
