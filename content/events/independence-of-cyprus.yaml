id: independence-of-cyprus
title:
  en: The Independence of Cyprus
  el: Η ανεξαρτησία της Κύπρου
summary:
  en: >
    The Republic of Cyprus came into existence on 16 August 1960, when the Union Flag was lowered
    in Nicosia and Makarios III took office as President with Fazıl Küçük as Vice-President. Three
    treaties signed that day created it, guaranteed it and garrisoned it, implementing the Zurich
    and London agreements of February 1959. The constitution weighted every institution by
    community and gave each side a veto; union with Greece and partition were both prohibited by
    treaty, so the republic satisfied neither community's stated aim. Britain kept full sovereignty
    over 254 square kilometres of bases. Within three years the constitution had broken down, and
    Greek Cypriot and Turkish Cypriot accounts of why diverge completely.
  el: >
    Η Κυπριακή Δημοκρατία γεννήθηκε στις 16 Αυγούστου 1960, όταν η βρετανική σημαία υποστάλη στη
    Λευκωσία και ο Μακάριος Γ΄ ανέλαβε Πρόεδρος με Αντιπρόεδρο τον Φαζίλ Κιουτσούκ. Τρεις συνθήκες
    που υπογράφηκαν την ίδια μέρα τη δημιούργησαν, την εγγυήθηκαν και τη στελέχωσαν στρατιωτικά,
    υλοποιώντας τις συμφωνίες Ζυρίχης και Λονδίνου του Φεβρουαρίου 1959. Το σύνταγμα στάθμιζε κάθε
    θεσμό με κοινοτικά κριτήρια και έδινε αρνησικυρία σε κάθε πλευρά· η ένωση με την Ελλάδα και η
    διχοτόμηση απαγορεύονταν ρητά από συνθήκη, ώστε η δημοκρατία δεν ικανοποιούσε τον διακηρυγμένο
    στόχο καμίας κοινότητας. Η Βρετανία κράτησε πλήρη κυριαρχία σε 254 τετραγωνικά χιλιόμετρα
    βάσεων. Μέσα σε τρία χρόνια το σύνταγμα είχε καταρρεύσει, και οι ελληνοκυπριακές και
    τουρκοκυπριακές αφηγήσεις για το γιατί αποκλίνουν πλήρως.
body:
  en: |
    Makarios had been elected president on 13 December 1959 with about two thirds of the Greek
    Cypriot vote; Küçük was returned unopposed by the Turkish Cypriot community. The republic was
    created on 16 August 1960 by three instruments signed at Nicosia: the Treaty concerning the
    Establishment of the Republic of Cyprus, the Treaty of Guarantee and the Treaty of Alliance.
    Cyprus joined the United Nations on 20 September 1960 and the Commonwealth in March 1961.

    The constitution divided the state by community rather than by function. The president was
    Greek Cypriot and the vice-president Turkish Cypriot, each with a veto over foreign affairs,
    defence and security. The House of Representatives was split thirty-five to fifteen, the public
    service on a seventy to thirty ratio and the army on sixty to forty. Separate communal chambers handled
    education, religion and personal status, and separate municipalities in the five main towns were
    promised and never established. Almost every provision gave one community a means of stopping
    the other.

    The Treaty of Guarantee bound Greece, Turkey and the United Kingdom to guarantee the
    independence, territorial integrity and security of the republic and expressly prohibited both
    union with any other state and partition. Article IV allowed each guarantor, where concerted
    action proved impossible, to take action with the sole aim of re-establishing the state of
    affairs the treaty had created: the clause Turkey invoked in July 1974. The Treaty of Alliance
    stationed a Greek contingent of 950 and a Turkish contingent of 650 on the island. Britain kept
    full sovereignty over the base areas of Akrotiri, 123 square kilometres, and Dhekelia, 131, some
    2.7 per cent of Cyprus, which remain British territory.

    The settlement held for three years. On 30 November 1963 Makarios proposed thirteen
    constitutional amendments that would have removed the vice-presidential veto and unified the
    municipalities. Turkish Cypriots rejected them as the dismantling of the guarantees on which
    they had accepted the state; Greek Cypriots presented them as the minimum required to make it
    work. Intercommunal fighting followed at Christmas 1963, the Turkish Cypriot members withdrew
    from the organs of the republic, and a United Nations force was deployed from March 1964. Which
    side broke the constitution is the question on which the Cyprus problem still rests, and the two
    communities answer it in ways that do not overlap at any point.
  el: |
    Ο Μακάριος είχε εκλεγεί πρόεδρος στις 13 Δεκεμβρίου 1959 με περίπου τα δύο τρίτα της
    ελληνοκυπριακής ψήφου, ενώ ο Κιουτσούκ αναδείχθηκε χωρίς αντίπαλο από την τουρκοκυπριακή
    κοινότητα. Η δημοκρατία δημιουργήθηκε στις 16 Αυγούστου 1960 με τρία κείμενα που υπογράφηκαν
    στη Λευκωσία: τη Συνθήκη Εγκαθιδρύσεως της Κυπριακής Δημοκρατίας, τη Συνθήκη Εγγυήσεως και τη
    Συνθήκη Συμμαχίας. Η Κύπρος έγινε μέλος του ΟΗΕ στις 20 Σεπτεμβρίου 1960 και της Κοινοπολιτείας
    τον Μάρτιο του 1961.

    Το σύνταγμα χώριζε το κράτος κατά κοινότητα και όχι κατά λειτουργία. Ο πρόεδρος ήταν
    Ελληνοκύπριος και ο αντιπρόεδρος Τουρκοκύπριος, με αρνησικυρία ο καθένας στα εξωτερικά, στην
    άμυνα και στην ασφάλεια. Η Βουλή των Αντιπροσώπων μοιραζόταν τριάντα πέντε προς δεκαπέντε, η
    δημόσια υπηρεσία εβδομήντα προς τριάντα και ο στρατός εξήντα προς σαράντα. Χωριστές κοινοτικές συνελεύσεις
    αναλάμβαναν την παιδεία, τη θρησκεία και το προσωπικό καθεστώς, ενώ οι χωριστοί δήμοι στις πέντε
    μεγάλες πόλεις υποσχέθηκαν και δεν εφαρμόστηκαν ποτέ. Σχεδόν κάθε διάταξη έδινε στη μία
    κοινότητα τρόπο να σταματά την άλλη.

    Η Συνθήκη Εγγυήσεως δέσμευε την Ελλάδα, την Τουρκία και το Ηνωμένο Βασίλειο να εγγυηθούν την
    ανεξαρτησία, την εδαφική ακεραιότητα και την ασφάλεια της δημοκρατίας και απαγόρευε ρητά τόσο
    την ένωση με άλλο κράτος όσο και τη διχοτόμηση. Το άρθρο IV επέτρεπε σε κάθε εγγυήτρια δύναμη,
    όπου η από κοινού δράση αποδεικνυόταν αδύνατη, να ενεργήσει με μόνο σκοπό την αποκατάσταση της
    κατάστασης που δημιούργησε η συνθήκη: η ρήτρα που επικαλέστηκε η Τουρκία τον Ιούλιο του 1974. Η
    Συνθήκη Συμμαχίας εγκατέστησε στο νησί ελληνική δύναμη 950 ανδρών και τουρκική 650. Η Βρετανία
    κράτησε πλήρη κυριαρχία στις περιοχές των βάσεων του Ακρωτηρίου, 123 τετραγωνικά χιλιόμετρα, και
    της Δεκέλειας, 131, περίπου 2,7% της Κύπρου, που παραμένουν βρετανικό έδαφος.

    Η ρύθμιση κράτησε τρία χρόνια. Στις 30 Νοεμβρίου 1963 ο Μακάριος πρότεινε δεκατρείς
    συνταγματικές τροποποιήσεις που θα καταργούσαν την αντιπροεδρική αρνησικυρία και θα ένωναν τους
    δήμους. Οι Τουρκοκύπριοι τις απέρριψαν ως κατεδάφιση των εγγυήσεων με τις οποίες είχαν δεχθεί
    το κράτος· οι Ελληνοκύπριοι τις παρουσίασαν ως το ελάχιστο που απαιτούσε η λειτουργία του.
    Ακολούθησαν διακοινοτικές συγκρούσεις τα Χριστούγεννα του 1963, οι Τουρκοκύπριοι αποχώρησαν από
    τα όργανα της δημοκρατίας και από τον Μάρτιο του 1964 αναπτύχθηκε δύναμη του ΟΗΕ. Το ποια πλευρά
    παραβίασε το σύνταγμα είναι το ερώτημα πάνω στο οποίο στηρίζεται ακόμη το Κυπριακό, και οι δύο
    κοινότητες το απαντούν με τρόπους που δεν συναντιούνται πουθενά.
