id: metapolitefsi-1974
title:
  en: The Fall of the Junta and the Metapolitefsi
  el: Η πτώση της χούντας και η Μεταπολίτευση
summary:
  en: >
    With mobilisation in chaos and the Turkish army holding northern Cyprus, President
    Gizikis called the senior politicians and the service chiefs to the Presidential
    Mansion on 23 July 1974 and the meeting agreed to hand power to a civilian
    government. Konstantinos Karamanlis flew in from eleven years of exile in Paris that
    night and was sworn in as Prime Minister at four in the morning on 24 July. Within a
    year the political prisoners were out, the parties were legal again, an elected
    parliament was writing a constitution, and the men who had taken power in 1967 were
    in the dock. The transition is called the Metapolitefsi and it named the era it
    opened.
  el: >
    Με την επιστράτευση σε πλήρη σύγχυση και τον τουρκικό στρατό να κρατά τη βόρεια
    Κύπρο, ο πρόεδρος Γκιζίκης κάλεσε στις 23 Ιουλίου 1974 στο Προεδρικό Μέγαρο τους
    παλαιούς πολιτικούς και τους αρχηγούς των επιτελείων, και η σύσκεψη αποφάσισε την
    παράδοση της εξουσίας σε πολιτική κυβέρνηση. Ο Κωνσταντίνος Καραμανλής ήρθε εκείνη
    τη νύχτα από έντεκα χρόνια αυτοεξορίας στο Παρίσι και ορκίστηκε πρωθυπουργός στις
    τέσσερις τα ξημερώματα της 24ης Ιουλίου. Μέσα σε έναν χρόνο οι πολιτικοί κρατούμενοι
    είχαν βγει, τα κόμματα ήταν ξανά νόμιμα, εκλεγμένη Βουλή έγραφε σύνταγμα και όσοι
    πήραν την εξουσία το 1967 κάθονταν στο εδώλιο. Η μετάβαση ονομάστηκε Μεταπολίτευση
    και έδωσε το όνομά της σε ολόκληρη την εποχή που άνοιξε.
body:
  en: |
    The regime fell because of Cyprus and not because of anything that happened in
    Athens. Ioannidis wanted to fight Turkey; the generals told the meeting of 23 July
    that the army could not. The politicians in the room split over whether to recall
    Karamanlis or form a government from those present, and Karamanlis won because he
    was the one figure of the pre-1967 right whom the army would accept and the left
    would tolerate. A French aircraft sent by President Valéry Giscard d'Estaing brought
    him from Paris. Archbishop Seraphim swore him in before dawn on 24 July while
    crowds were still in the streets.

    The first measures were undoings. Political prisoners were released, the exiles came
    home, the 1952 Constitution was restored provisionally, the junta's security
    apparatus was dismantled and the Military Police were dissolved. The Communist
    Party, outlawed since 1947 and first banned under Metaxas in 1936, was made legal
    again after twenty-seven years, which allowed the whole of the left to contest an
    election for the first time since the Civil War. Karamanlis founded New Democracy on
    4 October 1974, and the election of 17 November, held deliberately on the first
    anniversary of the Polytechnic, gave it 54.37 per cent of the vote and 220 of the
    300 seats, against 20.42 for the Centre Union and New Forces, 13.58 for the new
    PASOK and 9.47 for the United Left.

    Accountability came next and it came fast, which is what distinguishes the Greek
    transition from the Spanish and Portuguese ones of the same decade. The trial of the
    instigators of the coup ran from 28 July to 23 August 1975 before a special court at
    Korydallos. Papadopoulos, Pattakos and Makarezos were sentenced to death for high
    treason and mutiny, Ioannidis to life, seven others to between five and twenty
    years, and two were acquitted. The government commuted the death sentences to life
    within hours, and on 28 August Karamanlis answered the objection that the
    commutation was a favour with the sentence that has been quoted ever since: when we
    say life, we mean life.

    A second trial, from 16 October to 31 December 1975, dealt with the Polytechnic and
    convicted twenty of thirty-three defendants, giving Ioannidis seven more life
    sentences. A third series tried the torturers of EAT-ESA on the evidence of the men
    and women they had held. None of the principals was ever pardoned. Papadopoulos died
    in custody in 1999 and Ioannidis in 2010.
  el: |
    Το καθεστώς έπεσε εξαιτίας της Κύπρου και όχι εξαιτίας κάποιου γεγονότος στην Αθήνα.
    Ο Ιωαννίδης ήθελε πόλεμο με την Τουρκία, οι στρατηγοί είπαν στη σύσκεψη της 23ης
    Ιουλίου ότι ο στρατός δεν μπορούσε. Οι πολιτικοί διχάστηκαν ανάμεσα στην ανάκληση
    του Καραμανλή και στον σχηματισμό κυβέρνησης από τους παρόντες, και επικράτησε ο
    Καραμανλής επειδή ήταν η μόνη μορφή της προδικτατορικής δεξιάς που ο στρατός θα
    δεχόταν και η αριστερά θα ανεχόταν. Γαλλικό αεροσκάφος που έστειλε ο πρόεδρος Βαλερί
    Ζισκάρ ντ' Εστέν τον έφερε από το Παρίσι. Ο αρχιεπίσκοπος Σεραφείμ τον όρκισε πριν
    ξημερώσει η 24η Ιουλίου, με τον κόσμο ακόμη στους δρόμους.

    Τα πρώτα μέτρα ήταν καταργήσεις. Αποφυλακίστηκαν οι πολιτικοί κρατούμενοι,
    επέστρεψαν οι εξόριστοι, αποκαταστάθηκε προσωρινά το Σύνταγμα του 1952, διαλύθηκε ο
    κατασταλτικός μηχανισμός της χούντας και καταργήθηκε η ΕΣΑ. Το Κομμουνιστικό Κόμμα,
    εκτός νόμου από το 1947 και πρώτη φορά απαγορευμένο επί Μεταξά το 1936,
    νομιμοποιήθηκε ύστερα από είκοσι επτά χρόνια, ώστε ολόκληρη η αριστερά μπόρεσε να
    κατέβει σε εκλογές για πρώτη φορά μετά τον Εμφύλιο. Ο Καραμανλής ίδρυσε τη Νέα
    Δημοκρατία στις 4 Οκτωβρίου 1974, και οι εκλογές της 17ης Νοεμβρίου, που ορίστηκαν
    επίτηδες στην πρώτη επέτειο του Πολυτεχνείου, της έδωσαν 54,37% και 220 από τις 300
    έδρες, έναντι 20,42% της Ένωσης Κέντρου και Νέων Δυνάμεων, 13,58% του νεοσύστατου
    ΠΑΣΟΚ και 9,47% της Ενωμένης Αριστεράς.

    Η λογοδοσία ήρθε αμέσως μετά και ήρθε γρήγορα, και αυτό ξεχωρίζει την ελληνική
    μετάβαση από την ισπανική και την πορτογαλική της ίδιας δεκαετίας. Η δίκη των
    πρωταιτίων του πραξικοπήματος διεξήχθη από τις 28 Ιουλίου ως τις 23 Αυγούστου 1975
    σε ειδικό δικαστήριο στον Κορυδαλλό. Ο Παπαδόπουλος, ο Παττακός και ο Μακαρέζος
    καταδικάστηκαν σε θάνατο για εσχάτη προδοσία και στάση, ο Ιωαννίδης σε ισόβια, άλλοι
    επτά σε ποινές από πέντε ως είκοσι χρόνια και δύο αθωώθηκαν. Η κυβέρνηση μετέτρεψε
    τις θανατικές ποινές σε ισόβια μέσα σε λίγες ώρες, και στις 28 Αυγούστου ο
    Καραμανλής απάντησε στην ένσταση ότι η μετατροπή ήταν χάρη με τη φράση που έκτοτε
    επαναλαμβάνεται: όταν λέμε ισόβια, εννοούμε ισόβια.

    Η δεύτερη δίκη, από τις 16 Οκτωβρίου ως τις 31 Δεκεμβρίου 1975, αφορούσε το
    Πολυτεχνείο, καταδίκασε είκοσι από τους τριάντα τρεις κατηγορουμένους και επέβαλε
    στον Ιωαννίδη επτά ακόμη ισόβια. Μια τρίτη σειρά δικών έκρινε τους βασανιστές του
    ΕΑΤ-ΕΣΑ με βάση τις καταθέσεις εκείνων που είχαν κρατήσει. Κανένας από τους
    πρωταίτιους δεν έλαβε ποτέ χάρη. Ο Παπαδόπουλος πέθανε στη φυλακή το 1999 και ο
    Ιωαννίδης το 2010.
