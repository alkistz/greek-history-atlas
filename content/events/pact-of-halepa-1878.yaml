id: pact-of-halepa-1878
title:
  en: The Pact of Halepa
  el: Η Σύμβαση της Χαλέπας
summary:
  en: >
    Concluded at Halepa, outside Chania, between the Porte and the Cretan revolutionary
    committee, the pact ended the rising of 1878 and gave Crete its first working
    self-government inside the Ottoman Empire. A Christian majority in an elected
    Assembly of eighty, Greek as the language of the Assembly and the courts, a Cretan
    gendarmerie and a share of the island's revenue were its core. It ran for eleven
    years, mostly as a contest between Cretan parties, until the Porte gutted it by
    firman in 1889. Getting it back, and then going past it, was what the Cretan revolts
    of the 1890s were about.
  el: >
    Η σύμβαση που συνομολογήθηκε στη Χαλέπα, έξω από τα Χανιά, ανάμεσα στην Πύλη και την
    κρητική επαναστατική επιτροπή, τερμάτισε την εξέγερση του 1878 και έδωσε στην Κρήτη
    την πρώτη αυτοδιοίκηση που λειτούργησε στην πράξη μέσα στην Οθωμανική Αυτοκρατορία.
    Χριστιανική πλειοψηφία σε μια εκλεγμένη Συνέλευση ογδόντα μελών, η ελληνική ως
    γλώσσα της Συνέλευσης και των δικαστηρίων, κρητική χωροφυλακή και μερίδιο από τα
    έσοδα του νησιού ήταν ο πυρήνας της. Λειτούργησε έντεκα χρόνια, κυρίως ως πεδίο
    αντιπαράθεσης των κρητικών κομμάτων, ώσπου η Πύλη την ακύρωσε στην ουσία της με
    φιρμάνι το 1889. Η ανάκτησή της, και κατόπιν η υπέρβασή της, ήταν το διακύβευμα των
    κρητικών εξεγέρσεων της δεκαετίας του 1890.
body:
  en: |
    Crete rose again in January 1878, in the last weeks of the Russo-Turkish War, and by
    mid-March the insurgents held most of the island outside the fortified towns. Their
    assembly asked for autonomy under a Christian governor, paying tribute to the
    Sultan. Athens could offer sympathy but not union, and at Berlin the Powers declined
    to separate Crete from the Empire. They settled for Article 23 of the treaty, which
    bound the Porte to apply scrupulously in Crete the Organic Law of 1868, the charter
    that had closed the revolt of 1866 to 1869, with such modifications as might be
    considered equitable.

    The modifications were negotiated that autumn at Halepa, the suburb east of Chania,
    in the house of the journalist Kostis Mitsotakis. The Porte sent Muhtar Pasha; the
    Cretans were represented by their revolutionary committee under Antonios
    Michelidakis; the British consul Thomas Sandwith mediated. The agreement was
    concluded on 15 October 1878 Old Style, 27 October New, and confirmed by a firman of
    the Sultan in November.

    Its terms went well beyond 1868. The governor-general served a five-year term, and a
    Christian governor was to have a Muslim adviser and a Muslim governor a Christian
    one. A General Assembly of 80 deputies, 49 Christians and 31 Muslims, replaced the
    old general council. Greek became the language of the Assembly and the courts, and
    Cretans were to be preferred for public posts. A Cretan gendarmerie took over
    policing, part of the revenue was kept for public works on the island, and further
    tax relief was granted. Greek newspapers, printing presses and associations were
    permitted, an amnesty was proclaimed and licensed carrying of arms allowed. The
    first governor appointed under it, at the end of 1878, was Alexandros Karatheodoris
    Pasha, an Ottoman Greek who had led the Ottoman delegation at Berlin.

    The pact worked after its fashion. Party rivalry in the Assembly largely took the
    place of the older religious antagonism. In 1889 the faction that had lost its
    majority took to the mountains, the rising turned sectarian, and the Porte sent
    Shakir Pasha as civil and military governor and proclaimed martial law. A firman
    later that year abrogated many of the pact's main provisions: the Assembly was
    reduced and its mode of election changed, and the customs revenue went to the
    Ottoman treasury. The Powers did not intervene. What Halepa had given Crete was an
    elected Christian majority and a political class accustomed to using it, and from
    1889 that class wanted more than Halepa back.
  el: |
    Η Κρήτη εξεγέρθηκε ξανά τον Ιανουάριο του 1878, τις τελευταίες εβδομάδες του
    ρωσοτουρκικού πολέμου, και ως τα μέσα Μαρτίου οι επαναστάτες έλεγχαν το μεγαλύτερο
    μέρος του νησιού έξω από τις οχυρωμένες πόλεις. Η συνέλευσή τους ζήτησε αυτονομία με
    χριστιανό διοικητή και καταβολή φόρου υποτέλειας στον σουλτάνο. Η Αθήνα μπορούσε να
    προσφέρει συμπάθεια αλλά όχι ένωση, και στο Βερολίνο οι Δυνάμεις αρνήθηκαν να
    αποσπάσουν την Κρήτη από την Αυτοκρατορία. Αρκέστηκαν στο άρθρο 23 της συνθήκης, που
    υποχρέωνε την Πύλη να εφαρμόσει ευσυνείδητα στην Κρήτη τον Οργανικό Νόμο του 1868,
    τον χάρτη που είχε κλείσει την επανάσταση του 1866 ως 1869, με όσες τροποποιήσεις
    κρίνονταν δίκαιες.

    Οι τροποποιήσεις διαπραγματεύθηκαν το φθινόπωρο στη Χαλέπα, το προάστιο ανατολικά
    των Χανίων, στο σπίτι του δημοσιογράφου Κωστή Μητσοτάκη. Η Πύλη έστειλε τον Μουχτάρ
    Πασά. Τους Κρητικούς εκπροσώπησε η επαναστατική τους επιτροπή υπό τον Αντώνιο
    Μιχελιδάκη, και μεσολάβησε ο Βρετανός πρόξενος Τόμας Σάντγουιθ. Η συμφωνία
    συνομολογήθηκε στις 15 Οκτωβρίου 1878 με το παλαιό ημερολόγιο, 27 Οκτωβρίου με το
    νέο, και επικυρώθηκε με φιρμάνι του σουλτάνου τον Νοέμβριο.

    Οι όροι της πήγαιναν πολύ πέρα από το 1868. Ο γενικός διοικητής είχε πενταετή
    θητεία, και ένας χριστιανός διοικητής θα είχε μουσουλμάνο σύμβουλο, ένας
    μουσουλμάνος χριστιανό. Μια Γενική Συνέλευση 80 βουλευτών, 49 χριστιανών και 31
    μουσουλμάνων, αντικατέστησε το παλαιό γενικό συμβούλιο. Η ελληνική έγινε γλώσσα της
    Συνέλευσης και των δικαστηρίων, και οι Κρητικοί θα προτιμούνταν για τις δημόσιες
    θέσεις. Κρητική χωροφυλακή ανέλαβε την αστυνόμευση, μέρος των εσόδων έμενε για
    δημόσια έργα στο νησί και δόθηκαν πρόσθετες φορολογικές ελαφρύνσεις. Επιτράπηκαν
    ελληνικές εφημερίδες, τυπογραφεία και σύλλογοι, κηρύχθηκε αμνηστία και επιτράπηκε η
    οπλοφορία με άδεια. Ο πρώτος διοικητής που διορίστηκε με βάση τη σύμβαση, στα τέλη
    του 1878, ήταν ο Αλέξανδρος Καραθεοδωρής Πασάς, Οθωμανός Έλληνας που είχε ηγηθεί της
    οθωμανικής αντιπροσωπείας στο Βερολίνο.

    Η σύμβαση λειτούργησε με τον τρόπο της. Η κομματική αντιπαλότητα στη Συνέλευση πήρε
    σε μεγάλο βαθμό τη θέση του παλαιότερου θρησκευτικού ανταγωνισμού. Το 1889 η
    παράταξη που είχε χάσει την πλειοψηφία βγήκε στα βουνά, η εξέγερση πήρε θρησκευτικό
    χαρακτήρα και η Πύλη έστειλε τον Σακίρ Πασά ως πολιτικό και στρατιωτικό διοικητή και
    κήρυξε στρατιωτικό νόμο. Φιρμάνι αργότερα την ίδια χρονιά κατήργησε πολλές από τις
    βασικές διατάξεις της σύμβασης: η Συνέλευση περιορίστηκε, ο τρόπος εκλογής της
    άλλαξε και οι δασμοί πέρασαν στο οθωμανικό ταμείο. Οι Δυνάμεις δεν επενέβησαν.
    Εκείνο που είχε δώσει η Χαλέπα στην Κρήτη ήταν μια εκλεγμένη χριστιανική πλειοψηφία
    και μια πολιτική τάξη συνηθισμένη να τη χρησιμοποιεί, και από το 1889 αυτή η τάξη
    ήθελε κάτι περισσότερο από την επιστροφή στη Χαλέπα.
