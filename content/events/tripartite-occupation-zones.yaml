id: tripartite-occupation-zones
title:
  en: "The Tripartite Occupation: Greece divided into German, Italian and Bulgarian zones"
  el: "Η Τριπλή Κατοχή: ο διαμελισμός της Ελλάδας σε γερμανική, ιταλική και βουλγαρική ζώνη"
summary:
  en: >
    Greece was the only country in occupied Europe divided among three occupying powers.
    Germany kept Athens, Thessaloniki, the Evros strip and the strategic islands; Italy
    administered the largest share; Bulgaria annexed eastern Macedonia and western Thrace
    outright on 14 May 1941 and set about making them Bulgarian. A collaborationist
    government sat in Athens under three successive prime ministers with no army, no
    revenue and no authority outside the capital. The three zones broke the movement of
    food between regions and the occupiers charged Greece the cost of its own occupation,
    which together produced the famine of the following winter.
  el: >
    Η Ελλάδα ήταν η μόνη κατεχόμενη χώρα της Ευρώπης μοιρασμένη σε τρεις δυνάμεις κατοχής.
    Η Γερμανία κράτησε την Αθήνα, τη Θεσσαλονίκη, τη ζώνη του Έβρου και τα νησιά που είχαν
    στρατηγική σημασία, η Ιταλία διοίκησε το μεγαλύτερο τμήμα, και η Βουλγαρία προσάρτησε
    ευθέως την ανατολική Μακεδονία και τη δυτική Θράκη στις 14 Μαΐου 1941 και επιχείρησε να
    τις εκβουλγαρίσει. Στην Αθήνα εγκαταστάθηκε δωσιλογική κυβέρνηση με τρεις διαδοχικούς
    πρωθυπουργούς, χωρίς στρατό, χωρίς έσοδα και χωρίς εξουσία έξω από την πρωτεύουσα. Οι
    τρεις ζώνες διέκοψαν τη διακίνηση των τροφίμων μεταξύ των περιοχών και οι κατακτητές
    χρέωσαν στην Ελλάδα το κόστος της ίδιας της κατοχής της: από τον συνδυασμό προέκυψε ο
    λιμός του επόμενου χειμώνα.
body:
  en: |
    The partition followed the capitulations of April 1941. Germany took what it needed
    and no more: Athens and Piraeus, Thessaloniki and central Macedonia, the Evros
    prefecture on the Turkish border, most of Crete, and Lemnos, Lesbos and Chios. Italy
    received everything else, which was most of the country, once Hitler withdrew his
    divisions for the invasion of the Soviet Union; General Carlo Geloso's Eleventh Army
    administered it. Bulgaria, which had entered the war without firing a shot, moved
    into eastern Macedonia east of the Strymon and into western Thrace on 20 April 1941,
    with Thasos and Samothrace, and annexed the whole zone by decree on 14 May.

    In the Bulgarian zone the Greek language was banned in public use, place names were
    changed, and Greek mayors, judges, teachers and priests were expelled. Land was taken
    for Bulgarian settlers brought in on state credit. By late 1942 more than 100,000
    Greeks had been driven out into the German zone; when the Bulgarians withdrew in
    October 1944 some 90,000 people left with them, close to half of them settlers of the
    previous three years. In the other two zones a Hellenic State was installed under
    Georgios Tsolakoglou from 30 April 1941, then Konstantinos Logothetopoulos from 2
    December 1942, then Ioannis Rallis from 6 April 1943. Rallis created the Security
    Battalions the day after taking office; at their peak they numbered at most about
    22,000 men in nine evzone and twenty-two volunteer battalions, armed by the Germans
    and used against ELAS.

    The economic terms were the ruin of the country. Greece was billed for the upkeep of
    the occupying armies and the Bank of Greece was made to advance a forced occupation
    loan whose unrepaid balance stood at about 476 million Reichsmarks in 1944, reckoned
    on one modern calculation at some two billion euro. Requisitioning stripped harvests,
    livestock and transport, and the printing of occupation currency destroyed the
    drachma. All of Greece was under Axis control by 1 June 1941, and the arrangement
    lasted until the German withdrawal of October 1944.
  el: |
    Ο διαμελισμός ακολούθησε τις συνθηκολογήσεις του Απριλίου 1941. Η Γερμανία πήρε ό,τι
    της χρειαζόταν και τίποτε παραπάνω: Αθήνα και Πειραιά, Θεσσαλονίκη και κεντρική
    Μακεδονία, τον νομό Έβρου στα τουρκικά σύνορα, το μεγαλύτερο μέρος της Κρήτης, τη
    Λήμνο, τη Λέσβο και τη Χίο. Στην Ιταλία έπεσε όλη η υπόλοιπη χώρα, δηλαδή το μεγαλύτερο
    μέρος της, μόλις ο Χίτλερ απέσυρε τις μεραρχίες του για την εισβολή στη Σοβιετική
    Ένωση. Τη διοίκησε η 11η Ιταλική Στρατιά του στρατηγού Κάρλο Τζελόζο. Η Βουλγαρία, που
    είχε μπει στον πόλεμο χωρίς να πολεμήσει, κατέλαβε στις 20 Απριλίου 1941 την ανατολική
    Μακεδονία ανατολικά του Στρυμόνα και τη δυτική Θράκη, μαζί με τη Θάσο και τη Σαμοθράκη,
    και προσάρτησε ολόκληρη τη ζώνη με διάταγμα στις 14 Μαΐου.

    Στη βουλγαρική ζώνη απαγορεύτηκε η δημόσια χρήση της ελληνικής γλώσσας, άλλαξαν τα
    τοπωνύμια και εκδιώχθηκαν Έλληνες δήμαρχοι, δικαστές, δάσκαλοι και ιερείς. Η γη
    απαλλοτριώθηκε για Βούλγαρους εποίκους που ήρθαν με κρατική πίστωση. Ως τα τέλη του
    1942 πάνω από 100.000 Έλληνες είχαν εκδιωχθεί προς τη γερμανική ζώνη, και όταν οι
    Βούλγαροι αποχώρησαν τον Οκτώβριο του 1944 έφυγαν μαζί τους περίπου 90.000 άνθρωποι,
    σχεδόν οι μισοί έποικοι της τριετίας. Στις άλλες δύο ζώνες εγκαταστάθηκε το Ελληνικό
    Κράτος υπό τον Γεώργιο Τσολάκογλου από τις 30 Απριλίου 1941, τον Κωνσταντίνο
    Λογοθετόπουλο από τις 2 Δεκεμβρίου 1942 και τον Ιωάννη Ράλλη από τις 6 Απριλίου 1943. Ο
    Ράλλης συγκρότησε τα Τάγματα Ασφαλείας την επομένη της ανάληψης των καθηκόντων του: στο
    απόγειό τους αριθμούσαν το πολύ 22.000 άνδρες σε εννέα ευζωνικά και είκοσι δύο
    εθελοντικά τάγματα, εξοπλισμένα από τους Γερμανούς και στραμμένα εναντίον του ΕΛΑΣ.

    Οι οικονομικοί όροι κατέστρεψαν τη χώρα. Η Ελλάδα χρεώθηκε τη συντήρηση των στρατών
    κατοχής και η Τράπεζα της Ελλάδος υποχρεώθηκε σε αναγκαστικό κατοχικό δάνειο, του
    οποίου το ανεξόφλητο υπόλοιπο ανερχόταν το 1944 σε περίπου 476 εκατομμύρια ράιχσμαρκ,
    κατά μία σύγχρονη αποτίμηση περί τα δύο δισεκατομμύρια ευρώ. Οι επιτάξεις σάρωσαν
    σοδειές, ζώα και μεταφορικά μέσα, και η έκδοση κατοχικού χρήματος αφάνισε τη δραχμή.
    Ολόκληρη η Ελλάδα βρισκόταν υπό τον έλεγχο του Άξονα ως την 1η Ιουνίου 1941, και η
    διευθέτηση κράτησε ως τη γερμανική αποχώρηση του Οκτωβρίου 1944.
