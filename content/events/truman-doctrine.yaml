id: truman-doctrine
title:
  en: The Truman Doctrine
  el: Το Δόγμα Τρούμαν
summary:
  en: >
    In February 1947 Britain told Washington it could no longer pay for the Greek state or
    the Greek army. On 12 March President Truman asked Congress for authority to aid Greece
    and Turkey, declaring it American policy to support free peoples resisting attempted
    subjugation. The Greek and Turkish Assistance Act became law on 22 May 1947, authorising
    400 million dollars, of which 300 million went to Greece. American advisers were placed
    alongside Greek commanders down to divisional level and American equipment transformed
    the National Army. Greece became the first declared theatre of Cold War containment, and
    the point from which critics date a permanent American presence in Greek politics.
  el: >
    Τον Φεβρουάριο του 1947 η Βρετανία ενημέρωσε την Ουάσιγκτον ότι δεν μπορούσε πλέον να
    χρηματοδοτεί το ελληνικό κράτος και τον ελληνικό στρατό. Στις 12 Μαρτίου ο πρόεδρος
    Τρούμαν ζήτησε από το Κογκρέσο εξουσιοδότηση για βοήθεια προς την Ελλάδα και την
    Τουρκία, διακηρύσσοντας ως αμερικανική πολιτική τη στήριξη των ελεύθερων λαών που
    αντιστέκονται σε απόπειρα υποδούλωσης. Ο σχετικός νόμος ψηφίστηκε στις 22 Μαΐου 1947 και
    ενέκρινε 400 εκατομμύρια δολάρια, από τα οποία τα 300 προορίζονταν για την Ελλάδα.
    Αμερικανοί σύμβουλοι τοποθετήθηκαν δίπλα στους Έλληνες διοικητές ως το επίπεδο της
    μεραρχίας και ο αμερικανικός εξοπλισμός μεταμόρφωσε τον Εθνικό Στρατό. Η Ελλάδα έγινε το
    πρώτο δηλωμένο πεδίο της πολιτικής ανάσχεσης, και το σημείο από το οποίο οι επικριτές
    χρονολογούν μια μόνιμη αμερικανική παρουσία στην ελληνική πολιτική.
body:
  en: |
    British troops had been in Greece since October 1944 and British money had underwritten
    the Greek army and much of the state budget. In February 1947 a bankrupt Britain told the
    United States it would end both commitments within weeks. The Athens government, with
    Konstantinos Tsaldaris pressing the case in Washington, asked the Americans to take over.

    Truman addressed a joint session of Congress on 12 March 1947 for eighteen minutes. The
    speech asked for money for Greece and Turkey and stated a general principle: that it must
    be the policy of the United States to support free peoples who were resisting attempted
    subjugation by armed minorities or by outside pressure. Congress passed the Greek and
    Turkish Assistance Act and Truman signed it on 22 May as Public Law 80-75, authorising
    400 million dollars, 300 million for Greece and 100 million for Turkey.

    The American Mission for Aid to Greece arrived that summer. A Joint United States Military
    Advisory and Planning Group put American officers beside Greek commanders down to divisional
    level, where they shaped operational planning directly. The army received transport,
    artillery, aircraft and, from 1948, napalm. Greece then took roughly 700 million dollars of
    Marshall Plan assistance between 1948 and 1952, among the highest allocations per head in
    Europe. Historians disagree about how decisive the aid was: some treat it as the cause of
    the government's victory, others weigh it against the Democratic Army's own strategic
    choices and the loss of its Yugoslav sanctuary in 1949.

    The doctrine settled the external orientation of the Greek state for the rest of the
    century and made Greece a client before it was an ally. The American embassy, the aid
    mission and the military advisory group became fixtures of Greek political life, and the
    charge of American tutelage over Greek governments runs from 1947 through the electoral
    law of 1952 and the crises of the 1960s to the colonels of 1967.
  el: |
    Βρετανικά στρατεύματα βρίσκονταν στην Ελλάδα από τον Οκτώβριο του 1944 και βρετανικά
    κεφάλαια στήριζαν τον ελληνικό στρατό και μεγάλο μέρος του κρατικού προϋπολογισμού. Τον
    Φεβρουάριο του 1947 μια χρεοκοπημένη Βρετανία ανακοίνωσε στις Ηνωμένες Πολιτείες ότι θα
    τερμάτιζε και τις δύο δεσμεύσεις μέσα σε λίγες εβδομάδες. Η κυβέρνηση της Αθήνας, με τον
    Κωνσταντίνο Τσαλδάρη να πιέζει στην Ουάσιγκτον, ζήτησε από τους Αμερικανούς να
    αναλάβουν τη θέση τους.

    Ο Τρούμαν μίλησε σε κοινή συνεδρίαση του Κογκρέσου στις 12 Μαρτίου 1947 επί δεκαοκτώ
    λεπτά. Ο λόγος ζητούσε χρήματα για την Ελλάδα και την Τουρκία και διατύπωνε μια γενική
    αρχή: ότι πολιτική των Ηνωμένων Πολιτειών όφειλε να είναι η στήριξη των ελεύθερων λαών
    που αντιστέκονται σε απόπειρα υποδούλωσης από ένοπλες μειοψηφίες ή από εξωτερική πίεση.
    Το Κογκρέσο ψήφισε τον νόμο για τη βοήθεια προς την Ελλάδα και την Τουρκία και ο Τρούμαν
    τον υπέγραψε στις 22 Μαΐου, εγκρίνοντας 400 εκατομμύρια δολάρια, 300 για την Ελλάδα και
    100 για την Τουρκία.

    Η Αμερικανική Αποστολή Βοηθείας προς την Ελλάδα έφτασε το ίδιο καλοκαίρι. Η μεικτή
    στρατιωτική συμβουλευτική ομάδα τοποθέτησε Αμερικανούς αξιωματικούς δίπλα στους Έλληνες
    διοικητές ως το επίπεδο της μεραρχίας, όπου διαμόρφωναν απευθείας τον επιχειρησιακό
    σχεδιασμό. Ο στρατός έλαβε μεταφορικά μέσα, πυροβολικό, αεροσκάφη και, από το 1948,
    ναπάλμ. Ακολούθησαν περίπου 700 εκατομμύρια δολάρια βοήθειας του Σχεδίου Μάρσαλ μεταξύ
    1948 και 1952, από τα υψηλότερα κατά κεφαλήν ποσά στην Ευρώπη. Οι ιστορικοί διαφωνούν
    για το πόσο καθοριστική υπήρξε η βοήθεια: άλλοι τη θεωρούν αιτία της κυβερνητικής νίκης,
    άλλοι τη σταθμίζουν απέναντι στις στρατηγικές επιλογές του Δημοκρατικού Στρατού και στην
    απώλεια του γιουγκοσλαβικού καταφυγίου το 1949.

    Το δόγμα καθόρισε τον εξωτερικό προσανατολισμό του ελληνικού κράτους για το υπόλοιπο του
    αιώνα και έκανε την Ελλάδα προστατευόμενη πριν γίνει σύμμαχος. Η αμερικανική πρεσβεία, η
    αποστολή βοήθειας και η στρατιωτική συμβουλευτική ομάδα έγιναν σταθερά στοιχεία της
    ελληνικής πολιτικής ζωής, και η κατηγορία της αμερικανικής κηδεμονίας πάνω στις ελληνικές
    κυβερνήσεις διατρέχει τη διαδρομή από το 1947 στον εκλογικό νόμο του 1952, στις κρίσεις
    της δεκαετίας του 1960 και στους συνταγματάρχες του 1967.
