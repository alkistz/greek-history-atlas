id: holocaust-thessaloniki-1943
title:
  en: The deportation of the Jews of Thessaloniki
  el: Η εκτόπιση των Εβραίων της Θεσσαλονίκης
summary:
  en: >
    Between 15 March and 10 August 1943 nineteen transports carried about 45,200 Jews
    from the Baron Hirsch ghetto in Thessaloniki to Auschwitz-Birkenau, where some 96 per
    cent were murdered, most of them on arrival. The operation was run from 6 February by
    two of Eichmann's officers, Dieter Wisliceny and Alois Brunner, and roughly 1,700
    more Greek Jews were put on the same trains from five other communities. The figure
    usually given for all Greek Jews who reached Auschwitz is 48,974, about two thousand
    more than those two numbers make: the totals rest on different counts and the
    literature does not reconcile them. Thessaloniki had been the largest Jewish city in the
    Balkans, Sephardic and continuously settled since 1492; in five months it ceased to
    exist. The Jews of the Bulgarian-occupied zone had been deported to Treblinka a
    fortnight before the first train left here.
  el: >
    Από τις 15 Μαρτίου ως τις 10 Αυγούστου 1943 δεκαεννέα συρμοί μετέφεραν περίπου 45.200
    Εβραίους από το γκέτο Βαρώνου Χιρς της Θεσσαλονίκης στο Άουσβιτς-Μπίρκεναου, όπου
    δολοφονήθηκε το 96 τοις εκατό, οι περισσότεροι με την άφιξη. Την επιχείρηση διηύθυναν
    από τις 6 Φεβρουαρίου δύο αξιωματικοί του Άιχμαν, ο Ντίτερ Βισλιτσένι και ο Αλόις
    Μπρούνερ, ενώ στους ίδιους συρμούς επιβιβάστηκαν άλλοι 1.700 περίπου Έλληνες Εβραίοι
    από πέντε ακόμη κοινότητες. Ο αριθμός που δίνεται συνήθως για το σύνολο των Ελλήνων
    Εβραίων που έφτασαν στο Άουσβιτς είναι 48.974, δύο χιλιάδες περίπου περισσότεροι από
    όσους δίνουν τα δύο προηγούμενα μεγέθη: στηρίζονται σε διαφορετικές καταμετρήσεις και
    η βιβλιογραφία δεν τα συμφιλιώνει. Η
    Θεσσαλονίκη ήταν η μεγαλύτερη εβραϊκή πόλη των Βαλκανίων, σεφαραδίτικη και αδιάκοπα
    κατοικημένη από το 1492. Σε πέντε μήνες έπαψε να υπάρχει. Οι Εβραίοι της βουλγαρικής
    ζώνης κατοχής είχαν εκτοπιστεί στην Τρεμπλίνκα δεκαπέντε μέρες πριν φύγει από εδώ ο
    πρώτος συρμός.
body:
  en: |
    Greece had roughly 72,000 to 77,000 Jews in 1940, about 50,000 of them in
    Thessaloniki. The first blow there fell on 11 July 1942, the Black Sabbath, when every
    Jewish man between 18 and 45 was ordered to Eleftherias Square and registered for
    forced labour under beatings and public humiliation. Some 2,000 were sent to labour
    gangs. The community bought their release, and part of the price was the destruction
    of the great Jewish cemetery with its 300,000 to 500,000 graves, whose site now holds
    Aristotle University. The German military administrator who imposed the levy and the
    ransom was Max Merten.

    What happened in the Bulgarian-occupied zone of eastern Macedonia and western Thrace
    was a separate operation, carried out by Bulgaria itself on 4 March 1943, with
    Treblinka rather than Auschwitz as its destination.

    In Thessaloniki the operation was run by SS-Hauptsturmführer Dieter Wisliceny, deputy
    to Adolf Eichmann, and SS-Hauptsturmführer Alois Brunner, who arrived on 6 February
    1943. Jews were made to wear the yellow star, confined to the Kalamaria, Syngrou and
    Vardar ghettos, and then funnelled through the Baron Hirsch ghetto beside the railway
    sidings. Nineteen transports left between 15 March and 10 August 1943, each carrying
    between 1,000 and 4,000 people; about 45,200 went from Thessaloniki and roughly 1,700
    more from five other communities. The total usually given for Greek Jews at Auschwitz
    is 48,974, which those two figures do not reach by about two thousand; the discrepancy
    is in the sources rather than a rounding of them.
    Chief Rabbi Zvi Koretz, president of the Judenrat since December 1942, was deported to
    Bergen-Belsen on 7 August 1943 and died of typhus at Tröbitz on 3 June 1945, days
    after liberation; whether he served the community or the Germans is still argued
    between historians and survivors. Archbishop Damaskinos protested in writing in March
    1943 and instructed his clergy to issue baptismal certificates. Merten was tried in
    Athens in 1959, sentenced to twenty-five years and released within months under a
    Greek and German arrangement. Wisliceny was hanged in Bratislava in 1948. Brunner was
    never brought to trial.
  el: |
    Η Ελλάδα είχε το 1940 περίπου 72.000 ως 77.000 Εβραίους, από τους οποίους περί τους
    50.000 στη Θεσσαλονίκη. Το πρώτο χτύπημα εκεί ήρθε στις 11 Ιουλίου 1942, το Μαύρο
    Σάββατο, όταν κάθε Εβραίος άνδρας από 18 ως 45 ετών διατάχθηκε να παρουσιαστεί στην
    πλατεία Ελευθερίας και καταγράφηκε για καταναγκαστική εργασία μέσα σε ξυλοδαρμούς και
    δημόσιο εξευτελισμό. Περίπου 2.000 στάλθηκαν σε τάγματα εργασίας. Η κοινότητα εξαγόρασε
    την απελευθέρωσή τους, και μέρος του τιμήματος ήταν η καταστροφή του μεγάλου εβραϊκού
    νεκροταφείου με τους 300.000 ως 500.000 τάφους, στη θέση του οποίου βρίσκεται σήμερα
    το Αριστοτέλειο Πανεπιστήμιο. Τον έρανο και τα λύτρα επέβαλε ο Γερμανός στρατιωτικός
    διοικητής Μαξ Μέρτεν.

    Ό,τι συνέβη στη βουλγαρική ζώνη κατοχής της ανατολικής Μακεδονίας και της δυτικής
    Θράκης ήταν χωριστή επιχείρηση, που την εκτέλεσε η ίδια η Βουλγαρία στις 4 Μαρτίου 1943
    και είχε προορισμό την Τρεμπλίνκα και όχι το Άουσβιτς.

    Στη Θεσσαλονίκη την επιχείρηση διηύθυναν ο SS-Hauptsturmführer Ντίτερ Βισλιτσένι,
    υπαρχηγός του Άντολφ Άιχμαν, και ο SS-Hauptsturmführer Αλόις Μπρούνερ, που έφτασαν
    στις 6 Φεβρουαρίου 1943. Οι Εβραίοι υποχρεώθηκαν να φορούν το κίτρινο άστρο,
    περιορίστηκαν στα γκέτο της Καλαμαριάς, του Συγγρού και του Βαρδάρη και στη συνέχεια
    διοχετεύθηκαν μέσα από το γκέτο Βαρώνου Χιρς, δίπλα στις σιδηροδρομικές γραμμές.
    Δεκαεννέα συρμοί αναχώρησαν από τις 15 Μαρτίου ως τις 10 Αυγούστου 1943, ο καθένας με
    1.000 ως 4.000 ανθρώπους: περίπου 45.200 από τη Θεσσαλονίκη και άλλοι 1.700 περίπου
    από πέντε ακόμη κοινότητες. Το σύνολο που δίνεται συνήθως για τους Έλληνες Εβραίους στο
    Άουσβιτς είναι 48.974, δύο χιλιάδες περίπου περισσότεροι από όσους δίνουν τα δύο αυτά
    μεγέθη· η απόκλιση βρίσκεται στις πηγές και όχι σε στρογγυλοποίηση. Ο αρχιρραβίνος Τσβι Κόρετς, πρόεδρος του Judenrat από τον Δεκέμβριο του 1942,
    εκτοπίστηκε στο Μπέργκεν-Μπέλσεν στις 7 Αυγούστου 1943 και πέθανε από τύφο στο
    Τρέμπιτς στις 3 Ιουνίου 1945, λίγες μέρες μετά την απελευθέρωση. Το αν υπηρέτησε την
    κοινότητα ή τους Γερμανούς παραμένει αντικείμενο έντονης διαμάχης ανάμεσα σε ιστορικούς
    και επιζώντες. Ο αρχιεπίσκοπος Δαμασκηνός διαμαρτυρήθηκε εγγράφως τον Μάρτιο του 1943
    και έδωσε εντολή στον κλήρο να εκδίδει πιστοποιητικά βαπτίσεως. Ο Μέρτεν δικάστηκε στην
    Αθήνα το 1959, καταδικάστηκε σε εικοσιπενταετή κάθειρξη και αφέθηκε ελεύθερος μέσα σε
    λίγους μήνες με ελληνογερμανικό διακανονισμό. Ο Βισλιτσένι απαγχονίστηκε στην
    Μπρατισλάβα το 1948. Ο Μπρούνερ δεν δικάστηκε ποτέ.
