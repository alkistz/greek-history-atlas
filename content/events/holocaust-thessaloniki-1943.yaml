review:
  auto:
    date: 2026-09-20
    result: corrected
    langs: [en, el]
    by: assistant, verified against public sources
    note: >
      Nineteen transports, 15 March to 10 August 1943 and about 96 per cent murdered all confirmed. The component figures did not add up: 45,200 from Thessaloniki plus roughly 1,700 from five other communities was presented as making 48,974, which is two thousand short. The totals rest on different counts and the literature does not reconcile them, so both texts now say so instead of implying a sum. The event also correctly separates the Bulgarian zone deportations, which went to Treblinka rather than Auschwitz, and that is the detail most often got wrong.
