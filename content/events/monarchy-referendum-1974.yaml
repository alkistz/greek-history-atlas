id: monarchy-referendum-1974
title:
  en: The Referendum that Abolished the Monarchy
  el: Το δημοψήφισμα για την κατάργηση της μοναρχίας
summary:
  en: >
    Six weeks after the first free election in a decade, Greek voters were asked to
    choose between a crowned democracy and a republic. The republic won with 3,245,111
    votes, 68.8 per cent, against 1,445,875 for the monarchy, on a turnout of about
    75.6 per cent. Constantine II was not allowed to campaign in Greece and made his
    case in a television address from London, while Karamanlis stayed publicly neutral,
    which most observers read as decisive. The vote ended 111 years of the Glücksburg
    dynasty and settled a question that had split Greek politics since 1915.
  el: >
    Έξι εβδομάδες μετά τις πρώτες ελεύθερες εκλογές της δεκαετίας, οι Έλληνες κλήθηκαν
    να επιλέξουν ανάμεσα σε βασιλευομένη και σε αβασίλευτη δημοκρατία. Η αβασίλευτη
    επικράτησε με 3.245.111 ψήφους, 68,8%, έναντι 1.445.875 για τη μοναρχία, με
    συμμετοχή περίπου 75,6%. Ο Κωνσταντίνος Β΄ δεν επιτράπηκε να κάνει προεκλογική
    εκστρατεία στην Ελλάδα και μίλησε με τηλεοπτικό διάγγελμα από το Λονδίνο, ενώ ο
    Καραμανλής τήρησε δημόσια ουδετερότητα, κάτι που οι περισσότεροι θεώρησαν
    καθοριστικό. Η ψήφος έκλεισε 111 χρόνια της δυναστείας των Γλύξμπουργκ και ένα
    ερώτημα που δίχαζε την ελληνική πολιτική από το 1915.
body:
  en: |
    The monarchy had been the fault line of Greek politics since the National Schism of
    the First World War. It had been voted out in 1924 and back in 1935, and it had
    survived the plebiscite of 1946 by a margin nobody on the left accepted. In 1974 the
    case against it was simple and recent: the King had sworn in the colonels'
    government in April 1967, failed to remove it in December, and been abolished by the
    junta itself in 1973 without anyone rising in his defence.

    The referendum of 8 December was held under a free press, with parties campaigning
    openly, which none of the plebiscites of 1935, 1946 or 1973 had been. Of 6,244,539
    registered voters, 4,719,787 voted and 28,801 ballots were invalid. The result was
    regionally lopsided rather than close: the republic carried the cities and almost
    the whole country, and monarchist majorities appeared only in a few areas, chiefly
    parts of the Peloponnese. The legitimacy of the count has never been seriously
    questioned, which is why the question has stayed closed.

    Michail Stasinopoulos, president of the Council of State, was sworn in as the first
    President of the Third Hellenic Republic on 18 December 1974 and held the office
    until Konstantinos Tsatsos took over under the new constitution in July 1975.
    Constantine II lost his Greek citizenship and his property claims were resolved only
    by litigation at the European Court of Human Rights, which gave judgment in November
    2000 and settled compensation in November 2002. He returned to live in Greece in
    2013 and died in Athens in January 2023, a private citizen.
  el: |
    Η μοναρχία ήταν το ρήγμα της ελληνικής πολιτικής από τον Εθνικό Διχασμό του Πρώτου
    Παγκοσμίου Πολέμου. Είχε καταργηθεί με ψήφο το 1924 και επανέλθει το 1935, και είχε
    επιβιώσει στο δημοψήφισμα του 1946 με ποσοστό που η αριστερά δεν αναγνώρισε ποτέ. Το
    1974 το επιχείρημα εναντίον της ήταν απλό και πρόσφατο: ο βασιλιάς όρκισε την
    κυβέρνηση των συνταγματαρχών τον Απρίλιο του 1967, απέτυχε να την ανατρέψει τον
    Δεκέμβριο και καταργήθηκε το 1973 από την ίδια τη χούντα χωρίς να σηκωθεί κανείς
    υπέρ του.

    Το δημοψήφισμα της 8ης Δεκεμβρίου έγινε με ελεύθερο Τύπο και ανοιχτή προεκλογική
    αντιπαράθεση, όπως δεν είχε γίνει κανένα από τα δημοψηφίσματα του 1935, του 1946 και
    του 1973. Από 6.244.539 εγγεγραμμένους ψήφισαν 4.719.787 και άκυρα ήταν 28.801. Το
    αποτέλεσμα δεν ήταν οριακό αλλά γεωγραφικά ανισοβαρές: η αβασίλευτη κέρδισε τις
    μεγάλες πόλεις και σχεδόν ολόκληρη τη χώρα, ενώ βασιλόφρονες πλειοψηφίες εμφανίστηκαν
    μόνο σε λίγες περιοχές, κυρίως σε τμήματα της Πελοποννήσου. Η εγκυρότητα της
    καταμέτρησης δεν αμφισβητήθηκε ποτέ σοβαρά, και γι' αυτό το ζήτημα έμεινε κλειστό.

    Ο Μιχαήλ Στασινόπουλος, πρόεδρος του Συμβουλίου της Επικρατείας, ορκίστηκε πρώτος
    Πρόεδρος της Τρίτης Ελληνικής Δημοκρατίας στις 18 Δεκεμβρίου 1974 και παρέδωσε το
    αξίωμα στον Κωνσταντίνο Τσάτσο, που ανέλαβε υπό το νέο Σύνταγμα τον Ιούλιο του 1975.
    Ο Κωνσταντίνος Β΄ έχασε την ελληνική ιθαγένεια και οι περιουσιακές του αξιώσεις
    λύθηκαν μόνο δικαστικά, στο Ευρωπαϊκό Δικαστήριο Δικαιωμάτων του Ανθρώπου, που
    εξέδωσε απόφαση τον Νοέμβριο του 2000 και καθόρισε την αποζημίωση τον Νοέμβριο του
    2002. Επέστρεψε να ζήσει στην Ελλάδα το 2013 και πέθανε στην Αθήνα τον Ιανουάριο του
    2023 ως ιδιώτης.
