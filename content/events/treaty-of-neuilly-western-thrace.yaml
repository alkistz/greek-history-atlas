id: treaty-of-neuilly-western-thrace
title:
  en: The Treaty of Neuilly and the annexation of Western Thrace
  el: Η Συνθήκη του Νεϊγύ και η προσάρτηση της Δυτικής Θράκης
summary:
  en: >
    Bulgaria's peace treaty, signed on 27 November 1919, took Western Thrace from it and
    gave the province not to Greece but to the Allied Powers, who ran it as a condominium
    under a French general for six months. San Remo awarded it to Greece in April 1920
    and the Greek army took it over on 14 May, entering Xanthi, Komotini and Dedeagach,
    which was renamed Alexandroupoli. The gain was about 8,600 square kilometres, an
    unbroken Aegean coast from Thessaly to the Evros, and a land frontier with Turkey.
    It is the only territory won in this era that Greece still holds.
  el: >
    Η συνθήκη ειρήνης με τη Βουλγαρία, που υπογράφηκε στις 27 Νοεμβρίου 1919, της αφαίρεσε τη
    Δυτική Θράκη και την παραχώρησε όχι στην Ελλάδα αλλά στις Συμμαχικές Δυνάμεις, οι οποίες
    τη διοίκησαν ως συγκυριαρχία υπό Γάλλο στρατηγό επί έξι μήνες. Το Σαν Ρέμο την επιδίκασε
    στην Ελλάδα τον Απρίλιο του 1920 και ο ελληνικός στρατός την παρέλαβε στις 14 Μαΐου,
    μπαίνοντας στην Ξάνθη, την Κομοτηνή και το Δεδέαγατς, που μετονομάστηκε σε Αλεξανδρούπολη.
    Το κέρδος ήταν περίπου 8.600 τετραγωνικά χιλιόμετρα, αδιάσπαστη αιγαιακή ακτή από τη
    Θεσσαλία ως τον Έβρο και χερσαία συνοριακή γραμμή με την Τουρκία. Είναι το μόνο έδαφος
    αυτής της εποχής που η Ελλάδα κρατά ακόμη.
body:
  en: |
    Neuilly-sur-Seine was the Bulgarian treaty in the series of Paris settlements. Besides
    Western Thrace, Bulgaria ceded some 2,563 square kilometres of its western borderlands
    to the Kingdom of Serbs, Croats and Slovenes, confirmed Southern Dobruja to Romania,
    was limited to a volunteer army of 20,000 men and was assessed reparations of 2.25
    billion gold francs. Bulgarians call it the Second National Catastrophe. Venizelos
    signed for Greece.

    The treaty did not hand Western Thrace to Athens. It transferred the province to the
    Principal Allied Powers, who undertook to guarantee Bulgaria an economic outlet to
    the Aegean, a promise that was written down and never given substance. From October
    1919 to May 1920 the province was an inter-Allied condominium under the French
    general Charles Antoine Charpy, with its own postage stamps and overprinted currency.
    The San Remo conference of 19 to 26 April 1920 awarded it to Greece.

    Greek troops entered on 14 May 1920. The acquisition closed the gap between Greek
    Macedonia and the Turkish frontier and gave the kingdom a defensible river line on
    the Evros. Everything else Greece gained between 1919 and 1920, Eastern Thrace,
    Imbros and Tenedos, the Smyrna zone, was lost within three years. Western Thrace was
    confirmed to Greece at Lausanne and its Muslim population was exempted from the
    population exchange, which is why it is the one part of the country where a large
    Muslim minority has lived continuously ever since.
  el: |
    Το Νεϊγύ ήταν η συνθήκη με τη Βουλγαρία στη σειρά των ρυθμίσεων του Παρισιού. Πέρα από τη
    Δυτική Θράκη, η Βουλγαρία παραχώρησε περίπου 2.563 τετραγωνικά χιλιόμετρα των δυτικών
    παραμεθορίων της στο Βασίλειο των Σέρβων, Κροατών και Σλοβένων, επικύρωσε τη Νότια
    Δοβρουτσά στη Ρουμανία, περιορίστηκε σε εθελοντικό στρατό 20.000 ανδρών και της επιβλήθηκαν
    επανορθώσεις 2,25 δισεκατομμυρίων χρυσών φράγκων. Οι Βούλγαροι την ονομάζουν Δεύτερη Εθνική
    Καταστροφή. Για την Ελλάδα υπέγραψε ο Βενιζέλος.

    Η συνθήκη δεν παρέδωσε τη Δυτική Θράκη στην Αθήνα. Τη μεταβίβασε στις Κύριες Συμμαχικές
    Δυνάμεις, οι οποίες ανέλαβαν να εξασφαλίσουν στη Βουλγαρία οικονομική διέξοδο στο Αιγαίο,
    υπόσχεση που γράφτηκε και δεν υλοποιήθηκε ποτέ. Από τον Οκτώβριο του 1919 ως τον Μάιο του
    1920 η επαρχία ήταν διασυμμαχική συγκυριαρχία υπό τον Γάλλο στρατηγό Σαρλ Αντουάν Σαρπί,
    με δικά της γραμματόσημα και επισημασμένο νόμισμα. Η διάσκεψη του Σαν Ρέμο, από τις 19 ως
    τις 26 Απριλίου 1920, την επιδίκασε στην Ελλάδα.

    Τα ελληνικά στρατεύματα μπήκαν στις 14 Μαΐου 1920. Η απόκτηση έκλεισε το κενό ανάμεσα στην
    ελληνική Μακεδονία και τα τουρκικά σύνορα και έδωσε στο βασίλειο αμυντική γραμμή πάνω στον
    Έβρο. Όλα τα άλλα που κέρδισε η Ελλάδα το 1919 και το 1920, η Ανατολική Θράκη, η Ίμβρος και
    η Τένεδος, η ζώνη της Σμύρνης, χάθηκαν μέσα σε τρία χρόνια. Η Δυτική Θράκη επικυρώθηκε στη
    Λωζάνη και ο μουσουλμανικός πληθυσμός της εξαιρέθηκε από την ανταλλαγή, και γι' αυτό είναι
    το μόνο κομμάτι της χώρας όπου μεγάλη μουσουλμανική μειονότητα ζει αδιάλειπτα έκτοτε.
