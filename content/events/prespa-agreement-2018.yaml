id: prespa-agreement-2018
title:
  en: The Prespa Agreement
  el: Η Συμφωνία των Πρεσπών
summary:
  en: >
    On 17 June 2018, at the lakeside village of Psarades, the foreign ministers of
    Greece and of the country then called the Republic of Macedonia signed an agreement
    ending a dispute that had run since 1991. The neighbour's name became the Republic
    of North Macedonia in all uses, at home and abroad, its language was recorded as
    Macedonian and defined as a South Slavic language with no relation to ancient
    Hellenic civilisation, and Greece undertook to stop blocking its accession to NATO
    and the European Union. The Greek Parliament ratified it on 25 January 2019 by 153
    votes to 146 and it entered into force on 12 February. It remains one of the most
    divisive things any Greek government has signed.
  el: >
    Στις 17 Ιουνίου 2018, στο παραλίμνιο χωριό Ψαράδες, οι υπουργοί Εξωτερικών της
    Ελλάδας και της τότε Δημοκρατίας της Μακεδονίας υπέγραψαν συμφωνία που έκλεινε μια
    διαφορά ανοιχτή από το 1991. Το όνομα της γειτονικής χώρας έγινε Δημοκρατία της
    Βόρειας Μακεδονίας για κάθε χρήση, εσωτερική και διεθνή, η γλώσσα της καταγράφηκε ως
    μακεδονική και ορίστηκε ως νοτιοσλαβική χωρίς σχέση με τον αρχαίο ελληνικό
    πολιτισμό, και η Ελλάδα δεσμεύτηκε να μην εμποδίζει πλέον την ένταξή της στο ΝΑΤΟ και
    στην Ευρωπαϊκή Ένωση. Η Βουλή την κύρωσε στις 25 Ιανουαρίου 2019 με 153 ψήφους έναντι
    146 και τέθηκε σε ισχύ στις 12 Φεβρουαρίου. Παραμένει από τα πιο διχαστικά κείμενα
    που έχει υπογράψει ελληνική κυβέρνηση.
body:
  en: |
    Greece had objected since the republic's independence in 1991 to its use of the name
    Macedonia, to the Vergina Sun on its flag, and to articles of its constitution that
    Athens read as claims on Greek territory. A trade embargo and years of United
    Nations mediation produced the Interim Accord of 13 September 1995, under which the
    country was admitted to international organisations as the former Yugoslav Republic
    of Macedonia while the argument continued. Prespa terminated that accord and the
    provisional formula with it.

    The settlement was erga omnes, which was the Greek requirement and the hardest part
    for the other side: the new name applies to every use by everyone, not only in
    dealings with Greece. In exchange the nationality was recorded as Macedonian or
    citizen of the Republic of North Macedonia and the language as Macedonian, which was
    the hardest part for Greek opinion. The text also set up a strategic partnership and
    a joint commission on history and school textbooks. Nikos Kotzias and Nikola
    Dimitrov signed at Psarades with the United Nations mediator Matthew Nimetz present;
    Alexis Tsipras and Zoran Zaev crossed the lake to Oteševo for a second ceremony.

    Ratification was difficult on both shores. A consultative referendum in North
    Macedonia on 30 September 2018 gave about 94 per cent in favour on a turnout near
    37 per cent, below the threshold that would have made it binding, and parliament
    passed the constitutional amendments on 11 January 2019 with 81 of 120 votes. In
    Greece there were large rallies in Thessaloniki in January 2018 and in Athens in
    February 2018 and January 2019, the Independent Greeks left the government over the
    agreement, and both New Democracy and the Communist Party voted against it. North
    Macedonia joined NATO on 27 March 2020. The New Democracy government elected in July
    2019 has implemented the agreement it voted against, which is the usual fate of
    settlements of this kind and the best evidence that this one held.
  el: |
    Η Ελλάδα αντιδρούσε από την ανεξαρτησία της γειτονικής δημοκρατίας το 1991 στη χρήση
    του ονόματος Μακεδονία, στον Ήλιο της Βεργίνας στη σημαία της και σε άρθρα του
    συντάγματός της που η Αθήνα διάβαζε ως αλυτρωτικά. Ένα εμπορικό εμπάργκο και χρόνια
    μεσολάβησης του ΟΗΕ κατέληξαν στην Ενδιάμεση Συμφωνία της 13ης Σεπτεμβρίου 1995, με
    την οποία η χώρα γινόταν δεκτή στους διεθνείς οργανισμούς ως «πρώην Γιουγκοσλαβική
    Δημοκρατία της Μακεδονίας» όσο η διαφορά παρέμενε. Οι Πρέσπες κατήργησαν εκείνη τη
    συμφωνία και μαζί της τον προσωρινό τύπο.

    Η ρύθμιση ήταν erga omnes, που ήταν η ελληνική απαίτηση και το δυσκολότερο σημείο
    για την άλλη πλευρά: το νέο όνομα ισχύει για κάθε χρήση από οποιονδήποτε, όχι μόνο
    στις σχέσεις με την Ελλάδα. Σε αντάλλαγμα η ιθαγένεια καταγράφηκε ως μακεδονική ή
    πολίτης της Δημοκρατίας της Βόρειας Μακεδονίας και η γλώσσα ως μακεδονική, που ήταν
    το δυσκολότερο σημείο για την ελληνική κοινή γνώμη. Το κείμενο προέβλεπε επίσης
    στρατηγική εταιρική σχέση και μεικτή επιτροπή για την ιστορία και τα σχολικά βιβλία.
    Στους Ψαράδες υπέγραψαν ο Νίκος Κοτζιάς και ο Νίκολα Ντιμιτρόφ, παρόντος του
    μεσολαβητή του ΟΗΕ Μάθιου Νίμιτς, και στη συνέχεια ο Αλέξης Τσίπρας με τον Ζόραν
    Ζάεφ πέρασαν απέναντι, στο Οτέσεβο, για δεύτερη τελετή.

    Η κύρωση ήταν δύσκολη και στις δύο όχθες. Συμβουλευτικό δημοψήφισμα στη Βόρεια
    Μακεδονία στις 30 Σεπτεμβρίου 2018 έδωσε περίπου 94% υπέρ με συμμετοχή κοντά στο 37%,
    κάτω από το όριο που θα το έκανε δεσμευτικό, και η βουλή ψήφισε τις συνταγματικές
    τροποποιήσεις στις 11 Ιανουαρίου 2019 με 81 από τις 120 ψήφους. Στην Ελλάδα έγιναν
    μεγάλα συλλαλητήρια στη Θεσσαλονίκη τον Ιανουάριο του 2018 και στην Αθήνα τον
    Φεβρουάριο του 2018 και τον Ιανουάριο του 2019, οι Ανεξάρτητοι Έλληνες αποχώρησαν από
    την κυβέρνηση εξαιτίας της συμφωνίας, και τόσο η Νέα Δημοκρατία όσο και το ΚΚΕ
    καταψήφισαν. Η Βόρεια Μακεδονία εντάχθηκε στο ΝΑΤΟ στις 27 Μαρτίου 2020. Η κυβέρνηση
    της Νέας Δημοκρατίας που εκλέχθηκε τον Ιούλιο του 2019 εφαρμόζει τη συμφωνία που
    καταψήφισε, όπως συνήθως συμβαίνει με διευθετήσεις αυτού του είδους και όπως δείχνει
    καλύτερα από καθετί άλλο ότι αυτή άντεξε.
