id: constitution-1975
title:
  en: The Constitution of 1975
  el: Το Σύνταγμα του 1975
summary:
  en: >
    The parliament elected in November 1974 sat as a revisionary assembly and produced a
    constitution that came into force on 11 June 1975. It made Greece a parliamentary
    republic with a single chamber of 300 members and a President as head of state, in
    place of the Constitution of 1952 and of everything the junta had enacted. As
    adopted it gave the President real reserve powers, a design associated with
    Karamanlis himself; the revision of 1986 removed them. It is the longest-lived
    constitution in modern Greek history and it is still in force.
  el: >
    Η Βουλή που εκλέχθηκε τον Νοέμβριο του 1974 λειτούργησε ως αναθεωρητική και
    παρήγαγε σύνταγμα που τέθηκε σε ισχύ στις 11 Ιουνίου 1975. Καθιέρωσε την Ελλάδα ως
    κοινοβουλευτική δημοκρατία με ενιαίο σώμα 300 βουλευτών και Πρόεδρο αρχηγό του
    κράτους, στη θέση του Συντάγματος του 1952 και όλων όσα είχε θεσπίσει η χούντα. Όπως
    ψηφίστηκε, έδινε στον Πρόεδρο ουσιαστικές εφεδρικές εξουσίες, σχεδιασμός που
    αποδίδεται στον ίδιο τον Καραμανλή. Η αναθεώρηση του 1986 τις αφαίρεσε. Είναι το
    μακροβιότερο σύνταγμα της νεότερης ελληνικής ιστορίας και ισχύει ακόμη.
body:
  en: |
    The Fifth Revisionary Parliament had a New Democracy majority of 220 and could have
    written what it liked. What it wrote was a conventional European parliamentary
    constitution with one unconventional feature: a presidency that could dissolve
    parliament, call referendums and in defined circumstances dismiss a government.
    Karamanlis wanted an office above the parties that could act when the parties could
    not, in a country whose parliamentary system had broken down twice in living memory.
    His opponents saw a presidency built for one man.

    The rest of the text settled arguments that had been open for fifty years. Article 3
    keeps the Eastern Orthodox Church as the prevailing religion while Article 13
    guarantees freedom of religious conscience. Article 110 makes the provision that
    Greece is a parliamentary republic unamendable, which means the form of the state
    cannot be revisited by ordinary politics at all.

    It has been revised four times. The revision of 1986, carried by Andreas
    Papandreou's majority, transferred the President's reserve powers to the government
    and made the office essentially ceremonial. Those of 2001, 2008 and 2019 dealt with
    independent authorities, data protection, the civil service and the election of the
    President. The constitution was drafted in the same months as the junta trials, and
    the two together are what gave the Third Hellenic Republic its founding legitimacy:
    one settled what the state would be, the other what it would never again tolerate.
  el: |
    Η Ε΄ Αναθεωρητική Βουλή είχε πλειοψηφία 220 εδρών της Νέας Δημοκρατίας και θα
    μπορούσε να γράψει ό,τι ήθελε. Έγραψε ένα συμβατικό ευρωπαϊκό κοινοβουλευτικό
    σύνταγμα με ένα ασυνήθιστο στοιχείο: μια προεδρία που μπορούσε να διαλύει τη Βουλή,
    να προκηρύσσει δημοψηφίσματα και, υπό προϋποθέσεις, να παύει την κυβέρνηση. Ο
    Καραμανλής ήθελε ένα αξίωμα πάνω από τα κόμματα, ικανό να ενεργήσει όταν τα κόμματα
    δεν μπορούν, σε μια χώρα όπου το κοινοβουλευτικό σύστημα είχε καταρρεύσει δύο φορές
    μέσα σε μία γενιά. Οι αντίπαλοί του είδαν μια προεδρία φτιαγμένη για έναν άνθρωπο.

    Το υπόλοιπο κείμενο έκλεισε διαφορές που έμεναν ανοιχτές πενήντα χρόνια. Το άρθρο 3
    διατηρεί την Ανατολική Ορθόδοξη Εκκλησία ως επικρατούσα θρησκεία, ενώ το άρθρο 13
    κατοχυρώνει την ελευθερία της θρησκευτικής συνείδησης. Το άρθρο 110 καθιστά μη
    αναθεωρήσιμη τη διάταξη ότι η Ελλάδα είναι προεδρευομένη κοινοβουλευτική δημοκρατία,
    δηλαδή η μορφή του πολιτεύματος δεν μπορεί να ξανανοίξει με την κοινή πολιτική
    διαδικασία.

    Αναθεωρήθηκε τέσσερις φορές. Η αναθεώρηση του 1986, με την πλειοψηφία του Ανδρέα
    Παπανδρέου, μετέφερε τις εφεδρικές εξουσίες του Προέδρου στην κυβέρνηση και κατέστησε
    το αξίωμα ουσιαστικά τελετουργικό. Εκείνες του 2001, του 2008 και του 2019 αφορούσαν
    τις ανεξάρτητες αρχές, την προστασία δεδομένων, τη δημόσια διοίκηση και την εκλογή
    του Προέδρου. Το Σύνταγμα γράφτηκε τους ίδιους μήνες με τις δίκες της χούντας, και τα
    δύο μαζί έδωσαν στην Τρίτη Ελληνική Δημοκρατία τη θεμελιωτική της νομιμοποίηση: το
    ένα όρισε τι θα είναι το κράτος, το άλλο τι δεν θα ανεχθεί ποτέ ξανά.
