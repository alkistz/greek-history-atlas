id: cession-of-thessaly-1881
title:
  en: The Cession of Thessaly and Arta
  el: Η προσάρτηση της Θεσσαλίας και της Άρτας
summary:
  en: >
    Greece had stayed out of the Russo-Turkish War and got a recommendation rather than
    a grant at the Congress of Berlin. Three years of Ottoman delay, a naval
    demonstration by the Powers and Gladstone's return to office produced the convention
    of 2 July 1881, which handed over the plain of Thessaly and the district of Arta:
    about 13,300 square kilometres and 285,000 people, the largest single enlargement
    since independence. Elassona, Ioannina, Metsovo and Preveza stayed Ottoman. Greece
    also inherited the great estates of Thessaly intact, and with them a landless
    peasantry.
  el: >
    Η Ελλάδα είχε μείνει έξω από τον ρωσοτουρκικό πόλεμο και από το Συνέδριο του
    Βερολίνου πήρε σύσταση αντί για παραχώρηση. Τρία χρόνια οθωμανικής κωλυσιεργίας, μια
    ναυτική επίδειξη των Δυνάμεων και η επάνοδος του Γλάδστωνα στην εξουσία οδήγησαν στη
    σύμβαση της 2ας Ιουλίου 1881, που παρέδωσε τον θεσσαλικό κάμπο και την επαρχία της
    Άρτας: περίπου 13.300 τετραγωνικά χιλιόμετρα και 285.000 κατοίκους, τη μεγαλύτερη
    μεγέθυνση από την ανεξαρτησία. Η Ελασσόνα, τα Ιωάννινα, το Μέτσοβο και η Πρέβεζα
    έμειναν οθωμανικά. Η Ελλάδα κληρονόμησε επίσης άθικτα τα τσιφλίκια της Θεσσαλίας, και
    μαζί τους έναν ακτήμονα αγροτικό πληθυσμό.
body:
  en: |
    The Treaty of San Stefano of March 1878 created a Greater Bulgaria reaching the
    Aegean and gave Greece nothing, which alarmed London as much as Athens. The Congress
    of Berlin that revised it sat from 13 June to 13 July 1878 under Bismarck, who kept
    Greek claims off the main agenda; Greece was allowed to address the sessions that
    touched its interests but was never a party. Protocol 13 of 5 July invited the Porte
    to agree a new frontier with Greece in Thessaly and Epirus, and the Powers pointed
    at the line of the Kalamas and the Pineios. Article 24 offered Great Power mediation
    if the two sides could not agree. Neither bound anyone.

    The Porte stalled for three years. A conference at Constantinople and another at
    Berlin in mid-1880 produced a Powers' award giving Greece Thessaly, Arta and Epirus
    as far as the Kalamas, including Ioannina and Metsovo, which the Porte simply
    refused. A naval demonstration off the Ottoman coast and Gladstone's return to
    office in place of Disraeli broke the deadlock, but the award was cut back in the
    process. A convention between the Powers and the Porte on 24 May 1881, ratified on
    14 June, fixed the line; the Greco-Ottoman convention of 2 July executed it. Greece
    got Thessaly less the district of Elassona, plus Arta. Some Greek popular accounts
    print 28 March 1881, which appears to be an error.

    Greek troops took over district by district through the late summer, Old Style:
    Domokos on 8 August, Almyros on the twelfth, Farsala on the fifteenth, Karditsa on
    the eighteenth, Trikala on the twenty-third, Larissa on 31 August and Tyrnavos the
    next day, with Volos last on 2 November. Alexandros Koumoundouros, who had
    negotiated the settlement and regarded it as his life's work, died two years later.
    Around 40,000 Muslims had lived in Thessaly; most sold their property and left, and
    Greece took on the obligation of compensating Ottoman landowners. The tsiflik system
    of great estates passed intact into Greek law, and the peasants who worked them
    gained a new sovereign and no land. The agrarian rising at Kileler in 1910 came out
    of that decision.
  el: |
    Η Συνθήκη του Αγίου Στεφάνου του Μαρτίου 1878 δημιούργησε Μεγάλη Βουλγαρία που έφτανε
    στο Αιγαίο και δεν έδωσε στην Ελλάδα τίποτε, πράγμα που ανησύχησε το Λονδίνο όσο και
    την Αθήνα. Το Συνέδριο του Βερολίνου που την αναθεώρησε συνεδρίασε από τις 13 Ιουνίου
    ως τις 13 Ιουλίου 1878 υπό τον Μπίσμαρκ, ο οποίος κράτησε τις ελληνικές διεκδικήσεις
    εκτός κύριας ημερήσιας διάταξης. Η Ελλάδα έλαβε τον λόγο στις συνεδριάσεις που
    αφορούσαν τα συμφέροντά της, χωρίς ποτέ να είναι συμβαλλόμενο μέρος. Το Πρωτόκολλο 13
    της 5ης Ιουλίου καλούσε την Πύλη να συμφωνήσει νέα συνοριακή γραμμή με την Ελλάδα στη
    Θεσσαλία και την Ήπειρο, και οι Δυνάμεις υπέδειξαν τη γραμμή Καλαμά και Πηνειού. Το
    άρθρο 24 πρόσφερε τη μεσολάβησή τους σε περίπτωση διαφωνίας. Τίποτε από τα δύο δεν
    δέσμευε κανέναν.

    Η Πύλη κωλυσιεργούσε τρία χρόνια. Διάσκεψη στην Κωνσταντινούπολη και άλλη στο
    Βερολίνο στα μέσα του 1880 κατέληξαν σε απόφαση των Δυνάμεων που έδινε στην Ελλάδα τη
    Θεσσαλία, την Άρτα και την Ήπειρο ως τον Καλαμά, μαζί με τα Ιωάννινα και το Μέτσοβο,
    και η Πύλη απλώς αρνήθηκε. Ναυτική επίδειξη στα οθωμανικά παράλια και η επάνοδος του
    Γλάδστωνα στη θέση του Ντισραέλι έσπασαν το αδιέξοδο, αλλά στην πορεία η παραχώρηση
    περικόπηκε. Σύμβαση μεταξύ των Δυνάμεων και της Πύλης στις 24 Μαΐου 1881, επικυρωμένη
    στις 14 Ιουνίου, καθόρισε τη γραμμή, και η ελληνοοθωμανική σύμβαση της 2ας Ιουλίου την
    εκτέλεσε. Η Ελλάδα πήρε τη Θεσσαλία πλην της επαρχίας Ελασσόνας, και την Άρτα.
    Ορισμένα ελληνικά λαϊκά αφηγήματα τυπώνουν την 28η Μαρτίου 1881, που φαίνεται να
    είναι λάθος.

    Ο ελληνικός στρατός παρέλαβε τις επαρχίες μία προς μία μέσα στο καλοκαίρι, με το
    παλαιό ημερολόγιο: Δομοκός στις 8 Αυγούστου, Αλμυρός στις 12, Φάρσαλα στις 15,
    Καρδίτσα στις 18, Τρίκαλα στις 23, Λάρισα στις 31 Αυγούστου, Τύρναβος την επομένη και
    τελευταίος ο Βόλος στις 2 Νοεμβρίου. Ο Αλέξανδρος Κουμουνδούρος, που διαπραγματεύθηκε
    τη ρύθμιση και τη θεωρούσε έργο ζωής, πέθανε δύο χρόνια αργότερα. Στη Θεσσαλία ζούσαν
    περίπου 40.000 μουσουλμάνοι. Οι περισσότεροι πούλησαν και έφυγαν, και η Ελλάδα
    ανέλαβε την υποχρέωση να αποζημιώσει τους οθωμανούς γαιοκτήμονες. Το σύστημα των
    τσιφλικιών πέρασε αυτούσιο στο ελληνικό δίκαιο, και οι κολίγοι που τα δούλευαν
    απέκτησαν νέο κυρίαρχο και καθόλου γη. Το αγροτικό κίνημα στο Κιλελέρ το 1910 βγήκε
    από εκείνη την απόφαση.
