id: cession-of-thessaly-1881
title:
  en: The Cession of Thessaly and Arta
summary:
  en: >
    Following the Congress of Berlin, the Ottoman Empire ceded Thessaly and the district
    of Arta to Greece without a war. Greece had mobilised but had not fought. The
    settlement left Elassona on the Ottoman side of the new line, where it stayed until
    1912.
body:
  en: |
    Greece had stayed out of the Russo-Turkish War of 1877 and 1878 and had been
    rewarded at Berlin with a recommendation, not a grant, that the Porte should
    rectify the frontier in Greece's favour. Three years of negotiation and a Greek
    mobilisation in 1880 followed.

    The convention signed at Constantinople in 1881 gave Greece the plain of Thessaly
    and the district of Arta, about a quarter more territory and three hundred thousand
    people. It fell short of the line Berlin had suggested: Elassona, Preveza and the
    rest of Epirus stayed Ottoman for another generation.
period: [1881-07-02, 1881-07-03]
precision: day
atom: thessaly
instrument: constantinople-1881
significance: 4
