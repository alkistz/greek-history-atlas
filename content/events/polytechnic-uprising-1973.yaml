id: polytechnic-uprising-1973
title:
  en: The Athens Polytechnic Uprising
  el: Η εξέγερση του Πολυτεχνείου
summary:
  en: >
    Students occupied the National Technical University on Patission Street on
    14 November 1973 and refused to leave. Within two days tens of thousands of
    Athenians were standing outside, and a transmitter built from laboratory parts was
    broadcasting to the city. In the early hours of 17 November a tank came through the
    main gate and the army and police cleared the surrounding streets. The judicial
    investigation held after the junta fell recorded twenty-four civilians killed, all
    of them in the streets around the campus rather than on its grounds, with more than
    two thousand injured. The occupation became the founding memory of Greek democracy
    after 1974.
  el: >
    Στις 14 Νοεμβρίου 1973 οι φοιτητές κατέλαβαν το Εθνικό Μετσόβιο Πολυτεχνείο στην
    οδό Πατησίων και αρνήθηκαν να αποχωρήσουν. Μέσα σε δύο μέρες δεκάδες χιλιάδες
    Αθηναίοι είχαν συγκεντρωθεί απέξω, ενώ ένας πομπός φτιαγμένος από εργαστηριακά
    εξαρτήματα εξέπεμπε σε όλη την πόλη. Τα ξημερώματα της 17ης Νοεμβρίου ένα άρμα μάχης
    γκρέμισε την κεντρική πύλη και στρατός και αστυνομία εκκαθάρισαν τους γύρω δρόμους.
    Η δικαστική έρευνα που έγινε μετά την πτώση της χούντας κατέγραψε είκοσι τέσσερις
    νεκρούς πολίτες, όλους στους δρόμους γύρω από το ίδρυμα και όχι μέσα στον χώρο του,
    και πάνω από δύο χιλιάδες τραυματίες. Η κατάληψη έγινε η ιδρυτική μνήμη της
    ελληνικής δημοκρατίας μετά το 1974.
body:
  en: |
    Papadopoulos had spent 1973 trying to give the regime a civilian face. He abolished
    the monarchy, made himself President, and in October appointed the veteran
    politician Spyros Markezinis to prepare elections. The universities were where that
    experiment was tested first. What began at the Polytechneio as a demand for
    university self-government became, within three days, a demand for the overthrow of
    the junta, carried on the slogan "Bread, Education, Freedom" and on the radio
    station the students had built: "Here Polytechneio! Here Polytechneio! This is the
    radio station of the free fighting students, of the free fighting Greeks."

    The regime answered with armour. An AMX-30 crashed through the gate before dawn on
    17 November; the students inside were allowed to file out, and the killing happened
    outside, in Patission Street and the blocks around it, where police and army units
    fired on crowds. Among the dead established by the courts were school pupils and
    passers-by, including a five-year-old boy shot in Zografou. Counting the
    unidentified, the figure usually given is about forty. No death inside the campus
    during the assault itself has ever been established, which matters because the
    popular memory of the night says otherwise.

    The suppression ended Papadopoulos's liberalisation and handed the hardliners their
    argument. He was deposed eight days later. Since 1974 the anniversary has been a
    school holiday and the march from the Polytechneio to the United States Embassy has
    been held every year; the terrorist group that called itself Revolutionary
    Organisation 17 November, active from 1975 to 2002, took the date as a claim on that
    inheritance.
  el: |
    Ο Παπαδόπουλος είχε περάσει το 1973 προσπαθώντας να δώσει στο καθεστώς πολιτικό
    πρόσωπο. Κατάργησε τη μοναρχία, αναδείχθηκε πρόεδρος και τον Οκτώβριο ανέθεσε στον
    παλαιό πολιτικό Σπύρο Μαρκεζίνη να προετοιμάσει εκλογές. Το πείραμα δοκιμάστηκε
    πρώτα στα πανεπιστήμια. Ό,τι ξεκίνησε στο Πολυτεχνείο ως αίτημα για
    πανεπιστημιακό αυτοδιοίκητο έγινε μέσα σε τρεις μέρες αίτημα για την ανατροπή της
    χούντας, με το σύνθημα «Ψωμί, Παιδεία, Ελευθερία» και με τον ραδιοσταθμό που έστησαν
    οι ίδιοι οι φοιτητές: «Εδώ Πολυτεχνείο! Εδώ Πολυτεχνείο! Σας μιλάει ο ραδιοφωνικός
    σταθμός των ελεύθερων αγωνιζόμενων φοιτητών, των ελεύθερων αγωνιζόμενων Ελλήνων».

    Η απάντηση του καθεστώτος ήταν τα τεθωρακισμένα. Ένα AMX-30 γκρέμισε την πύλη πριν
    ξημερώσει στις 17 Νοεμβρίου, όσοι ήταν μέσα αποχώρησαν, και οι θάνατοι συνέβησαν
    απέξω, στην Πατησίων και στα γύρω τετράγωνα, όπου μονάδες της αστυνομίας και του
    στρατού άνοιξαν πυρ σε πλήθη. Ανάμεσα στους νεκρούς που αναγνώρισε η δικαιοσύνη
    ήταν μαθητές και περαστικοί, μεταξύ τους ένα πεντάχρονο αγόρι που σκοτώθηκε στο
    Ζωγράφου. Με τους αγνώστου ταυτότητας, ο αριθμός που συνήθως αναφέρεται φτάνει
    περίπου τους σαράντα. Θάνατος μέσα στον χώρο του Πολυτεχνείου κατά την ίδια την
    εισβολή δεν έχει ποτέ τεκμηριωθεί, κάτι που έχει σημασία επειδή η λαϊκή μνήμη της
    νύχτας λέει το αντίθετο.

    Η καταστολή τερμάτισε τη φιλελευθεροποίηση του Παπαδόπουλου και έδωσε στους
    σκληροπυρηνικούς το επιχείρημά τους: οκτώ μέρες αργότερα ανατράπηκε. Από το 1974 η
    επέτειος είναι σχολική αργία και η πορεία από το Πολυτεχνείο προς την αμερικανική
    πρεσβεία γίνεται κάθε χρόνο. Η τρομοκρατική οργάνωση που ονομάστηκε Επαναστατική
    Οργάνωση 17 Νοέμβρη και έδρασε από το 1975 ως το 2002 πήρε την ημερομηνία ως
    διεκδίκηση αυτής της κληρονομιάς.
