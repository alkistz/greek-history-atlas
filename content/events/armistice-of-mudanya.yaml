id: armistice-of-mudanya
title:
  en: The Armistice of Mudanya
  el: Η Ανακωχή των Μουδανιών
summary:
  en: >
    Ten days of talks on the Sea of Marmara between İsmet Pasha and the Allied commanders
    ended the Greek-Turkish war on 11 October 1922. Greece was not an original signatory
    and its delegates waited offshore; it acceded on 14 October. The terms required the
    Greek army to leave Eastern Thrace as far as the Evros within fifteen days, giving up
    without a fight the 24,000 square kilometres won at Sèvres, including Adrianople. The
    withdrawal drove another 250,000 or more refugees west and fixed the Greek-Turkish
    land frontier where it still runs.
  el: >
    Δέκα ημέρες διαπραγματεύσεων στη Θάλασσα του Μαρμαρά ανάμεσα στον Ισμέτ πασά και τους
    συμμάχους διοικητές τερμάτισαν τον ελληνοτουρκικό πόλεμο στις 11 Οκτωβρίου 1922. Η Ελλάδα
    δεν ήταν αρχικό συμβαλλόμενο μέρος και οι αντιπρόσωποί της περίμεναν στα ανοιχτά·
    προσχώρησε στις 14 Οκτωβρίου. Οι όροι υποχρέωναν τον ελληνικό στρατό να εγκαταλείψει την
    Ανατολική Θράκη ως τον Έβρο μέσα σε δεκαπέντε ημέρες, παραδίδοντας αμαχητί τα 24.000
    τετραγωνικά χιλιόμετρα που είχε κερδίσει στις Σέβρες, μαζί με την Αδριανούπολη. Η
    αποχώρηση έδιωξε προς τα δυτικά άλλους 250.000 και πλέον πρόσφυγες και καθόρισε την
    ελληνοτουρκική χερσαία μεθόριο εκεί όπου βρίσκεται ακόμη.
body:
  en: |
    After Smyrna the Turkish army moved on the neutral zone of the Straits and met the
    British garrison at Chanak. The British general Charles Harington declined to open
    fire, the crisis passed without a shot, and Lloyd George's government fell on 19
    October 1922 over its handling of it. Talks opened at Mudanya on 3 October between
    İsmet Pasha for the Grand National Assembly and Generals Harington for Britain,
    Charpy for France and Mombelli for Italy. Greece, which had lost the war, was not a
    party to the negotiation.

    The armistice was signed on 11 October and came into force at midnight on 14 October.
    Greece acceded on 14 October, some sources giving 13 October for its acceptance of
    the terms. Greek forces were to withdraw behind the Maritsa within fifteen days and
    civil authority was to pass to Turkey thirty days after that. Turkey undertook to
    keep no more than 8,000 gendarmes in Eastern Thrace and not to move troops into the
    Straits zone before a peace treaty.

    The Greek army in Thrace was intact and had not been beaten. It was ordered out
    anyway by a Revolutionary government that had come to power promising to reinforce
    that very front, and that concluded within weeks that it could not fight Britain and
    Turkey at once. Eastern Thrace had been Greek territory under Sèvres for two years.
    Its evacuation added 250,000 or more Greek and Armenian refugees to those already
    arriving from Anatolia, and it set the agenda for the conference that opened at
    Lausanne on 20 November 1922.
  el: |
    Μετά τη Σμύρνη ο τουρκικός στρατός κινήθηκε προς την ουδέτερη ζώνη των Στενών και
    συνάντησε τη βρετανική φρουρά στο Τσανάκ. Ο Βρετανός στρατηγός Τσαρλς Χάρινγκτον αρνήθηκε
    να ανοίξει πυρ, η κρίση πέρασε χωρίς να πέσει τουφεκιά, και η κυβέρνηση Λόιντ Τζορτζ έπεσε
    στις 19 Οκτωβρίου 1922 εξαιτίας του χειρισμού της. Οι συνομιλίες άνοιξαν στα Μουδανιά στις
    3 Οκτωβρίου, ανάμεσα στον Ισμέτ πασά για τη Μεγάλη Εθνοσυνέλευση και τους στρατηγούς
    Χάρινγκτον για τη Βρετανία, Σαρπί για τη Γαλλία και Μομπέλι για την Ιταλία. Η Ελλάδα, που
    είχε χάσει τον πόλεμο, δεν ήταν μέρος της διαπραγμάτευσης.

    Η ανακωχή υπογράφηκε στις 11 Οκτωβρίου και τέθηκε σε ισχύ τα μεσάνυχτα της 14ης Οκτωβρίου.
    Η Ελλάδα προσχώρησε στις 14 Οκτωβρίου, ενώ ορισμένες πηγές δίνουν τη 13η Οκτωβρίου για την
    αποδοχή των όρων. Οι ελληνικές δυνάμεις όφειλαν να αποσυρθούν πίσω από τον Έβρο μέσα σε
    δεκαπέντε ημέρες και η πολιτική εξουσία να περάσει στην Τουρκία τριάντα ημέρες αργότερα. Η
    Τουρκία ανέλαβε να μην κρατήσει στην Ανατολική Θράκη πάνω από 8.000 χωροφύλακες και να μην
    μετακινήσει στρατεύματα στη ζώνη των Στενών πριν από συνθήκη ειρήνης.

    Ο ελληνικός στρατός της Θράκης ήταν ακέραιος και δεν είχε ηττηθεί. Διατάχθηκε ωστόσο να
    αποχωρήσει από μια Επαναστατική κυβέρνηση που είχε έρθει στην εξουσία υποσχόμενη να
    ενισχύσει ακριβώς αυτό το μέτωπο και που μέσα σε λίγες εβδομάδες συμπέρανε ότι δεν μπορούσε
    να πολεμήσει ταυτόχρονα τη Βρετανία και την Τουρκία. Η Ανατολική Θράκη ήταν ελληνικό έδαφος
    κατά τις Σέβρες επί δύο χρόνια. Η εκκένωσή της πρόσθεσε 250.000 και πλέον Έλληνες και
    Αρμενίους πρόσφυγες σε όσους έφταναν ήδη από την Ανατολία, και καθόρισε την ατζέντα της
    διάσκεψης που άνοιξε στη Λωζάνη στις 20 Νοεμβρίου 1922.
