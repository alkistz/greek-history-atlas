id: exodus-of-messolonghi
title:
  en: The Exodus of Messolonghi
  el: Η Έξοδος του Μεσολογγίου
summary:
  en: >
    After a year under siege by Ottoman and Egyptian forces, the garrison and civilian
    population of Messolonghi attempted a mass breakout by night. Most were killed or
    taken. The town had already become the symbol of the revolution abroad, where Byron
    had died two years earlier, and its fall did more for Greek diplomacy than its
    defence had done for Greek arms.
  el: >
    Έπειτα από έναν χρόνο πολιορκίας από οθωμανικές και αιγυπτιακές δυνάμεις, η φρουρά και ο
    άμαχος πληθυσμός του Μεσολογγίου επιχείρησαν μαζική έξοδο μέσα στη νύχτα. Οι περισσότεροι
    σκοτώθηκαν ή αιχμαλωτίστηκαν. Η πόλη είχε ήδη γίνει το σύμβολο της επανάστασης στο
    εξωτερικό, εκεί όπου είχε πεθάνει ο Βύρων δύο χρόνια νωρίτερα, και η πτώση της ωφέλησε την
    ελληνική διπλωματία περισσότερο από όσο είχε ωφελήσει τα ελληνικά όπλα η άμυνά της.
body:
  en: |
    Messolonghi had beaten off one siege in 1822 and 1823. The second began in April
    1825 under Reşid Pasha and was joined in December by Ibrahim Pasha's Egyptians, who
    brought the artillery and engineers to reduce the lagoon defences. By spring the town
    was starving.

    On the night of 22 April 1826 the defenders and most of the civilians tried to
    break through the lines. The plan was betrayed; a few hundred reached the hills,
    and the rest were killed or enslaved. The Powers took note. The Protocol of St
    Petersburg, agreed by Britain and Russia while the siege was ending, was the first
    step toward the intervention of 1827.
  el: |
    Το Μεσολόγγι είχε αποκρούσει μια πρώτη πολιορκία το 1822 και το 1823. Η δεύτερη άρχισε τον
    Απρίλιο του 1825 υπό τον Κιουταχή και ενισχύθηκε τον Δεκέμβριο από τους Αιγυπτίους του
    Ιμπραήμ πασά, που έφεραν το πυροβολικό και τους μηχανικούς για να κάμψουν τις οχυρώσεις
    της λιμνοθάλασσας. Ως την άνοιξη η πόλη λιμοκτονούσε.

    Τη νύχτα της 22ας Απριλίου 1826 οι υπερασπιστές και οι περισσότεροι άμαχοι επιχείρησαν να
    σπάσουν τον κλοιό. Το σχέδιο προδόθηκε· λίγες εκατοντάδες έφτασαν στα βουνά, οι υπόλοιποι
    σκοτώθηκαν ή εξανδραποδίστηκαν. Οι Δυνάμεις το κατέγραψαν. Το Πρωτόκολλο της Πετρούπολης,
    που συμφωνήθηκε από τη Βρετανία και τη Ρωσία καθώς τελείωνε η πολιορκία, ήταν το πρώτο
    βήμα προς την επέμβαση του 1827.
period: [1826-04-22, 1826-04-24]
