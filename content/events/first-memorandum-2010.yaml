id: first-memorandum-2010
title:
  en: The First Bailout and the Memorandum
  el: Το πρώτο Μνημόνιο
summary:
  en: >
    On 2 May 2010 the Eurogroup and the International Monetary Fund agreed a package of
    about 110 billion euros over three years, the first rescue of a euro-area state, in
    exchange for a Memorandum of Understanding that cut pensions and public-sector pay,
    raised VAT and committed Greece to privatisations. The government had been shut out
    of the bond markets after revising the 2009 deficit from the six to eight per cent
    previously reported to 12.7 per cent, and later to above 15. Two more programmes
    followed. Between 2008 and 2016 Greek output fell by roughly a quarter and
    unemployment reached about 27.5 per cent.
  el: >
    Στις 2 Μαΐου 2010 το Eurogroup και το Διεθνές Νομισματικό Ταμείο συμφώνησαν πακέτο
    περίπου 110 δισεκατομμυρίων ευρώ για τρία χρόνια, την πρώτη διάσωση κράτους της
    ευρωζώνης, με αντάλλαγμα ένα Μνημόνιο Συνεννόησης που περιέκοπτε συντάξεις και
    μισθούς του δημοσίου, αύξανε τον ΦΠΑ και δέσμευε την Ελλάδα σε αποκρατικοποιήσεις. Η
    κυβέρνηση είχε αποκλειστεί από τις αγορές ομολόγων αφού αναθεώρησε το έλλειμμα του
    2009 από το 6 με 8% που είχε δηλωθεί στο 12,7%, και αργότερα πάνω από 15%.
    Ακολούθησαν δύο ακόμη προγράμματα. Από το 2008 ως το 2016 το ελληνικό προϊόν έπεσε
    περίπου κατά ένα τέταρτο και η ανεργία έφτασε περίπου στο 27,5%.
body:
  en: |
    The numbers came first. The PASOK government that took office in October 2009 found
    the deficit far larger than the figure it had inherited; by January 2010 the forecast
    was 12.7 per cent of GDP and it was revised upwards again afterwards. Rating agencies
    downgraded through the winter, borrowing costs rose past the point at which the
    state could refinance itself, and on 23 April 2010, speaking from the island of
    Kastellorizo, George Papandreou asked for the European Union and the IMF support
    mechanism to be activated. The programme agreed nine days later consisted of 80
    billion euros in bilateral loans from euro-area governments through the Greek Loan
    Facility, of which 52.9 billion was in the end disbursed, and 30 billion from
    the Fund.

    The conditions were written by the Troika of the European Commission, the European
    Central Bank and the IMF, and Parliament passed the first austerity law on 6 May. On
    5 May, during a general strike, a firebomb thrown into a branch of Marfin Egnatia
    Bank on Stadiou Street in Athens killed three employees, one of them pregnant. A
    second programme followed in March 2012, committing 144.7 billion euros through the
    European Financial Stability Facility and 19.8 billion from the Fund, of which 141.8
    and about 12 billion were in the end disbursed, together with the
    largest sovereign debt restructuring ever carried out, in which private holders of
    roughly 200 billion euros of Greek bonds accepted a nominal cut of about 53.5 per
    cent.

    The cost was borne in the labour market. Unemployment peaked at about 27.5 per cent
    in 2013, youth unemployment above 55, and an estimated 400,000 to 500,000 Greeks,
    most of them young, left the country. Wages, pensions and public employment were cut
    repeatedly because the exchange rate could not be. The cumulative official lending
    across the three programmes came to roughly 289 billion euros.

    What the programmes achieved is the live argument of contemporary Greek politics and
    it has not closed. The creditors hold that they prevented a disorderly default inside
    the euro, and that the root cause was a decade of fiscal reporting that turned out to
    be false. Their critics, who include the IMF's own ex-post evaluation of the first
    programme published in 2013, hold that the debt should have been restructured at the
    start rather than in 2012, and that the fiscal multipliers used to design the
    austerity were badly wrong, so that the cuts deepened the recession they were meant
    to cure. Both propositions can be true, and most of the Greek argument since has been
    about which of them matters more.
  el: |
    Πρώτα ήρθαν τα νούμερα. Η κυβέρνηση του ΠΑΣΟΚ που ανέλαβε τον Οκτώβριο του 2009 βρήκε
    το έλλειμμα πολύ μεγαλύτερο από εκείνο που είχε παραλάβει. Ως τον Ιανουάριο του 2010
    η πρόβλεψη ήταν 12,7% του ΑΕΠ και αναθεωρήθηκε ξανά προς τα πάνω αργότερα. Οι οίκοι
    αξιολόγησης υποβάθμιζαν όλο τον χειμώνα, το κόστος δανεισμού ξεπέρασε το σημείο όπου
    το κράτος μπορούσε να αναχρηματοδοτηθεί, και στις 23 Απριλίου 2010, μιλώντας από το
    Καστελόριζο, ο Γιώργος Παπανδρέου ζήτησε την ενεργοποίηση του μηχανισμού στήριξης της
    Ευρωπαϊκής Ένωσης και του ΔΝΤ. Το πρόγραμμα που συμφωνήθηκε εννέα μέρες αργότερα
    αποτελούνταν από 80 δισεκατομμύρια ευρώ διμερών δανείων των κρατών της ευρωζώνης μέσω
    του Greek Loan Facility, από τα οποία τελικά εκταμιεύτηκαν 52,9 δισεκατομμύρια, και
    30 δισεκατομμύρια από το Ταμείο.

    Τους όρους έγραψε η τρόικα της Ευρωπαϊκής Επιτροπής, της Ευρωπαϊκής Κεντρικής
    Τράπεζας και του ΔΝΤ, και η Βουλή ψήφισε τον πρώτο μνημονιακό νόμο στις 6 Μαΐου. Στις
    5 Μαΐου, στη διάρκεια γενικής απεργίας, εμπρηστική βόμβα σε υποκατάστημα της Marfin
    Εγνατία Τράπεζας στην οδό Σταδίου σκότωσε τρεις υπαλλήλους, μία από τις οποίες ήταν
    έγκυος. Δεύτερο πρόγραμμα ακολούθησε τον Μάρτιο του 2012, με δέσμευση 144,7 δισεκατομμυρίων
    ευρώ μέσω του EFSF και 19,8 από το Ταμείο, από τα οποία εκταμιεύτηκαν τελικά 141,8
    και περίπου 12 αντίστοιχα, μαζί με τη μεγαλύτερη αναδιάρθρωση
    κρατικού χρέους που έχει γίνει, όπου οι ιδιώτες κάτοχοι περίπου 200 δισεκατομμυρίων
    ευρώ ελληνικών ομολόγων δέχτηκαν ονομαστικό κούρεμα περίπου 53,5%.

    Το κόστος το σήκωσε η αγορά εργασίας. Η ανεργία κορυφώθηκε γύρω στο 27,5% το 2013,
    των νέων πάνω από 55%, και υπολογίζεται ότι 400.000 ως 500.000 Έλληνες, κυρίως νέοι,
    έφυγαν από τη χώρα. Μισθοί, συντάξεις και δημόσιες θέσεις περικόπηκαν κατ'
    επανάληψη, επειδή η ισοτιμία δεν μπορούσε να περικοπεί. Ο συνολικός επίσημος δανεισμός
    των τριών προγραμμάτων έφτασε περίπου τα 289 δισεκατομμύρια ευρώ.

    Το τι πέτυχαν τα προγράμματα είναι η ζωντανή διαμάχη της σημερινής ελληνικής
    πολιτικής και δεν έχει κλείσει. Οι δανειστές υποστηρίζουν ότι απέτρεψαν άτακτη
    χρεοκοπία μέσα στο ευρώ και ότι η βαθύτερη αιτία ήταν μια δεκαετία δημοσιονομικών
    στοιχείων που αποδείχθηκαν ψευδή. Οι επικριτές τους, ανάμεσά τους η ίδια η εκ των
    υστέρων αξιολόγηση του πρώτου προγράμματος που δημοσίευσε το ΔΝΤ το 2013,
    υποστηρίζουν ότι το χρέος έπρεπε να είχε αναδιαρθρωθεί εξαρχής και όχι το 2012, και
    ότι οι δημοσιονομικοί πολλαπλασιαστές πάνω στους οποίους σχεδιάστηκε η λιτότητα ήταν
    λάθος, ώστε οι περικοπές βάθυναν την ύφεση που υποτίθεται ότι θεράπευαν. Και οι δύο
    θέσεις μπορεί να ισχύουν, και η ελληνική αντιπαράθεση έκτοτε αφορά κυρίως το ποια από
    τις δύο βαραίνει περισσότερο.
