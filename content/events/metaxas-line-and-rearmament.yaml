id: metaxas-line-and-rearmament
title:
  en: Rearmament and the Metaxas Line
  el: Ο επανεξοπλισμός και η Γραμμή Μεταξά
summary:
  en: >
    From 1936 Greece fortified its Bulgarian frontier with twenty-one tunnelled complexes
    running about 155 kilometres east from the Belasitsa massif, and Alexandros Papagos, chief
    of the general staff from August 1936, drove a wider programme of guns, transport and
    aircraft. The line was never finished and it faced the wrong way: the threat came from
    Italy in Albania, occupied in April 1939. Britain and France guaranteed Greece six days
    later. In April 1941 the forts held the German mountain corps for three days and were
    outflanked through Yugoslavia.
  el: >
    Από το 1936 η Ελλάδα οχύρωσε τα σύνορά της με τη Βουλγαρία με είκοσι ένα λαξευμένα
    συγκροτήματα που εκτείνονταν περίπου 155 χιλιόμετρα ανατολικά από τον όγκο του Μπέλες, ενώ
    ο Αλέξανδρος Παπάγος, αρχηγός του Γενικού Επιτελείου από τον Αύγουστο του 1936, προώθησε
    ευρύτερο πρόγραμμα πυροβολικού, μεταφορικών μέσων και αεροσκαφών. Η γραμμή δεν
    ολοκληρώθηκε ποτέ και κοίταζε προς τη λάθος κατεύθυνση: η απειλή ερχόταν από την Ιταλία
    στην Αλβανία, που καταλήφθηκε τον Απρίλιο του 1939. Έξι μέρες αργότερα Βρετανία και Γαλλία
    εγγυήθηκαν την Ελλάδα. Τον Απρίλιο του 1941 τα οχυρά κράτησαν τρεις μέρες το γερμανικό
    ορεινό σώμα και υπερκεράστηκαν μέσω Γιουγκοσλαβίας.
body:
  en: |
    Work on the fortified line began in 1936, the first works going up at Kerkini, and it
    took the name of Metaxas, who ordered its extension and paid for it after Bulgaria began
    to rearm. The completed portion consisted of twenty-one independent complexes, of which
    Roupel, Istibei, Kelkagia, Arpalouki, Perithori and Nymfaia are the best known, running
    roughly 155 kilometres eastward from the Belasitsa massif above Lake Kerkini. They were
    not concrete boxes on a hillside but works tunnelled into rock: galleries, magazines,
    underground hospitals, barracks and observation posts, with artillery casemates,
    machine-gun emplacements, anti-tank ditches and wire above ground. The tunnels at Roupel
    alone run to kilometres. The line was meant to reach Ormenion on the Evros; by 1940 it
    had got as far as Komotini in Western Thrace, and it was still unfinished in April 1941.
    Figures for its cost vary widely between sources and the commonly cited hundred million
    drachmas should be treated with caution.

    Alexandros Papagos became chief of the Hellenic Army General Staff in August 1936 and ran
    the rest of the programme: new artillery and anti-aircraft guns, motor transport, an
    expanded air force and the recall of reservists. Special legislation in 1940 kept him in
    post past the statutory retirement age. The money came from an economy that had grown
    strongly since the devaluation of 1932, and much of the equipment came from Germany under
    the clearing agreements, which is one measure of how tangled Greece's position had become.

    Strategically the whole effort pointed north when the danger was coming from the west.
    The Salonika Agreement of 31 July 1938 had already released Bulgaria from the arms limits
    of Neuilly and abolished the demilitarised zones along the Greek and Turkish frontiers,
    removing the legal buffer the line was built to backstop. Then Italy invaded Albania on 7
    April 1939 and annexed it on 12 April, putting a hostile great power on Greece's
    north-western land frontier for the first time since 1913. Britain and France responded on
    13 April with public pledges of all possible assistance if Greek or Romanian independence
    were threatened. Metaxas accepted the guarantee and went on proclaiming neutrality.

    The forts were finally tested by the Germans rather than the Bulgarians. In April 1941
    they were held by thin garrisons, most of the army being in Albania, and they stopped the
    German XVIII Mountain Corps for three days. They were not taken frontally. The Germans
    came round them through Yugoslavia, and the Eastern Macedonia Army Section under
    Lieutenant General Konstantinos Bakopoulos surrendered on 9 and 10 April 1941.
  el: |
    Οι εργασίες για την οχυρωματική γραμμή άρχισαν το 1936, με τα πρώτα έργα στην Κερκίνη, και
    η γραμμή πήρε το όνομα του Μεταξά, που διέταξε την επέκτασή της και τη χρηματοδότησε όταν
    η Βουλγαρία άρχισε να επανεξοπλίζεται. Το τμήμα που ολοκληρώθηκε περιλάμβανε είκοσι ένα
    αυτοτελή συγκροτήματα, με γνωστότερα το Ρούπελ, το Ιστίμπεη, την Κελκαγιά, το Αρπαλούκι,
    το Περιθώρι και τη Νυμφαία, σε ανάπτυγμα περίπου 155 χιλιομέτρων ανατολικά από τον όγκο
    του Μπέλες, πάνω από τη λίμνη Κερκίνη. Δεν ήταν τσιμεντένια κουτιά σε μια πλαγιά αλλά έργα
    λαξευμένα στον βράχο: στοές, πυριτιδαποθήκες, υπόγεια νοσοκομεία, θάλαμοι και
    παρατηρητήρια, με πυροβολεία, πολυβολεία, αντιαρματικές τάφρους και συρματοπλέγματα στην
    επιφάνεια. Μόνο στο Ρούπελ οι στοές φτάνουν τα χιλιόμετρα. Η γραμμή προοριζόταν να φτάσει
    ως το Ορμένιο στον Έβρο· ως το 1940 είχε προχωρήσει ως την Κομοτηνή και τον Απρίλιο του
    1941 ήταν ακόμη ημιτελής. Τα στοιχεία για το κόστος της διαφέρουν πολύ από πηγή σε πηγή
    και το συχνά αναφερόμενο ποσό των εκατό εκατομμυρίων δραχμών πρέπει να αντιμετωπίζεται με
    επιφύλαξη.

    Ο Αλέξανδρος Παπάγος έγινε αρχηγός του Γενικού Επιτελείου Στρατού τον Αύγουστο του 1936
    και ανέλαβε το υπόλοιπο πρόγραμμα: νέο πυροβολικό και αντιαεροπορικά, μηχανοκίνητα μέσα,
    ενίσχυση της αεροπορίας και ανάκληση εφέδρων. Ειδική νομοθεσία του 1940 τον κράτησε στη
    θέση του πέρα από το όριο ηλικίας. Τα χρήματα προέρχονταν από μια οικονομία που
    μεγέθυνε γοργά μετά την υποτίμηση του 1932, και μεγάλο μέρος του υλικού ήρθε από τη
    Γερμανία μέσω των συμφωνιών κλήριγκ, που δείχνει πόσο μπερδεμένη ήταν η θέση της Ελλάδας.

    Στρατηγικά η προσπάθεια κοίταζε βόρεια ενώ ο κίνδυνος ερχόταν από τα δυτικά. Η Συμφωνία
    της Θεσσαλονίκης της 31ης Ιουλίου 1938 είχε ήδη απαλλάξει τη Βουλγαρία από τους
    περιορισμούς εξοπλισμών του Νεϊγύ και είχε καταργήσει τις αποστρατιωτικοποιημένες ζώνες
    στα ελληνικά και τουρκικά σύνορά της, αφαιρώντας το νομικό ανάχωμα που η γραμμή
    υποτίθεται ότι υποστήριζε. Έπειτα η Ιταλία εισέβαλε στην Αλβανία στις 7 Απριλίου 1939 και
    την προσάρτησε στις 12, τοποθετώντας μεγάλη εχθρική δύναμη στα βορειοδυτικά χερσαία
    σύνορα της Ελλάδας για πρώτη φορά από το 1913. Στις 13 Απριλίου Βρετανία και Γαλλία
    έδωσαν δημόσια εγγύηση κάθε δυνατής βοήθειας αν απειλούνταν η ανεξαρτησία της Ελλάδας ή
    της Ρουμανίας. Ο Μεταξάς αποδέχθηκε την εγγύηση και συνέχισε να διακηρύσσει ουδετερότητα.

    Τα οχυρά τελικά τα δοκίμασαν οι Γερμανοί και όχι οι Βούλγαροι. Τον Απρίλιο του 1941 τα
    κρατούσαν ισχνές φρουρές, καθώς ο στρατός βρισκόταν στην Αλβανία, και σταμάτησαν για τρεις
    μέρες το γερμανικό XVIII Ορεινό Σώμα. Δεν έπεσαν κατά μέτωπο. Οι Γερμανοί τα υπερκέρασαν
    μέσω Γιουγκοσλαβίας, και το Τμήμα Στρατιάς Ανατολικής Μακεδονίας υπό τον αντιστράτηγο
    Κωνσταντίνο Μπακόπουλο συνθηκολόγησε στις 9 και 10 Απριλίου 1941.
