id: cretan-declaration-of-union-1908
title:
  en: Crete unilaterally proclaims union with Greece
  el: Η κήρυξη της Ένωσης από τη Βουλή των Κρητών
summary:
  en: >
    In the week that Bulgaria declared independence and Austria-Hungary annexed
    Bosnia-Herzegovina, the Cretan Assembly used the same opening and resolved to govern
    the island in the name of the King of the Hellenes and under the laws of Greece. The
    Greek flag went up at the Firka fortress in Chania. Athens, unready militarily since
    1897 and watched by the Powers, declined to accept the union and refused Cretan
    deputies their seats. The refusal became one of the grievances that produced the Goudi
    coup ten months later.
  el: >
    Την εβδομάδα που η Βουλγαρία ανακήρυξε την ανεξαρτησία της και η Αυστροουγγαρία
    προσάρτησε τη Βοσνία-Ερζεγοβίνη, η Βουλή των Κρητών εκμεταλλεύτηκε το ίδιο άνοιγμα και
    αποφάσισε να διοικεί το νησί στο όνομα του βασιλιά των Ελλήνων και με τους νόμους του
    ελληνικού κράτους. Η ελληνική σημαία υψώθηκε στο φρούριο Φιρκά στα Χανιά. Η Αθήνα,
    στρατιωτικά ανέτοιμη μετά το 1897 και υπό την επιτήρηση των Δυνάμεων, δεν αποδέχθηκε
    την Ένωση και αρνήθηκε στους Κρητικούς βουλευτές τις έδρες τους. Η άρνηση αυτή ήταν ένα
    από τα παράπονα που οδήγησαν δέκα μήνες αργότερα στο κίνημα στο Γουδί.
body:
  en: |
    The Young Turk Revolution of July 1908 loosened everything the Congress of Berlin had
    left half settled. Bulgaria declared full independence on 5 October and Austria-Hungary
    annexed Bosnia-Herzegovina on 6 October. Cretan politicians moved in the same days, and
    in the convenient absence of the High Commissioner, Alexandros Zaimis, who was away
    from the island on leave.

    On 24 September 1908 Old Style, 7 October New Style, the Assembly resolved to form a
    provisional government ruling in the King's name and under Greek law. Nothing legal
    changed. The Powers did not recognise the act, the Sultan's nominal suzerainty stood,
    and the Greek government would not annex an island it could not defend. Cretan deputies
    elected to the Greek Chamber were turned away at the door.

    Crete was left to govern itself in the name of a king who would not claim it, a
    condition that lasted five more years. The Powers withdrew their troops in July 1909
    without settling the question of sovereignty. In Athens the humiliation fed directly
    into the Military League. Sources disagree on the day: Greek accounts, including the
    Hellenic Army's history portal, give 24 September Old Style, while some
    English-language accounts give 6 October, apparently by converting only part of the
    way.
  el: |
    Η Νεοτουρκική Επανάσταση του Ιουλίου 1908 χαλάρωσε ό,τι είχε αφήσει μισοτελειωμένο το
    συνέδριο του Βερολίνου. Η Βουλγαρία ανακήρυξε πλήρη ανεξαρτησία στις 5 Οκτωβρίου και η
    Αυστροουγγαρία προσάρτησε τη Βοσνία-Ερζεγοβίνη στις 6 Οκτωβρίου. Οι Κρητικοί πολιτικοί
    κινήθηκαν τις ίδιες μέρες, και μάλιστα εν τη απουσία του Ύπατου Αρμοστή Αλέξανδρου
    Ζαΐμη, που έλειπε από το νησί με άδεια.

    Στις 24 Σεπτεμβρίου 1908 με το παλαιό ημερολόγιο, 7 Οκτωβρίου με το νέο, η Βουλή των
    Κρητών αποφάσισε τη συγκρότηση προσωρινής κυβέρνησης που θα κυβερνούσε στο όνομα του
    βασιλιά και με την ελληνική νομοθεσία. Νομικά δεν άλλαξε τίποτε. Οι Δυνάμεις δεν
    αναγνώρισαν την πράξη, η τυπική επικυριαρχία του σουλτάνου παρέμεινε και η ελληνική
    κυβέρνηση δεν επρόκειτο να προσαρτήσει ένα νησί που δεν μπορούσε να υπερασπιστεί. Οι
    Κρητικοί βουλευτές που εκλέγονταν για την ελληνική Βουλή γύριζαν πίσω από την πόρτα.

    Η Κρήτη έμεινε να αυτοδιοικείται στο όνομα ενός βασιλιά που δεν τη διεκδικούσε, κατάσταση
    που κράτησε άλλα πέντε χρόνια. Οι Δυνάμεις απέσυραν τα στρατεύματά τους τον Ιούλιο του
    1909 χωρίς να λύσουν το ζήτημα της κυριαρχίας. Στην Αθήνα η ταπείνωση τροφοδότησε
    κατευθείαν τον Στρατιωτικό Σύνδεσμο. Οι πηγές διαφωνούν για την ακριβή ημέρα: οι
    ελληνικές, ανάμεσά τους η ιστορική πύλη του Γενικού Επιτελείου Στρατού, δίνουν 24
    Σεπτεμβρίου με το παλαιό ημερολόγιο, ενώ ορισμένες αγγλόφωνες δίνουν 6 Οκτωβρίου, από
    ημιτελή μετατροπή.
