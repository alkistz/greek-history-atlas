id: istanbul-pogrom
title:
  en: The Istanbul Pogrom
  el: Τα Σεπτεμβριανά
summary:
  en: >
    On the night of 6 September 1955 crowds attacked Greek homes, shops, churches and schools
    across Istanbul, with parallel attacks in Izmir. The trigger was a report that a bomb had
    damaged the Turkish consulate and Atatürk's birthplace in Thessaloniki; the device had in fact
    been planted by a Turkish usher at the consulate, who was arrested and confessed. The
    Yassiada trials of 1960 to 1961 established that it had been done on the Turkish
    government's own orders, so the trigger was not merely faked but officially faked.
    Recorded
    destruction covers 5,317 properties, among them 73 churches and 26 schools. Death figures are
    disputed, commonly given as 13 to 16 Greeks and one Armenian, with other estimates running to
    around thirty-seven. The pogrom ended in practice the Greek presence in the city, which fell
    from about 65,000 in 1955 to 49,000 by 1960 and kept falling.
  el: >
    Τη νύχτα της 6ης Σεπτεμβρίου 1955 πλήθη επιτέθηκαν σε ελληνικά σπίτια, καταστήματα, εκκλησίες
    και σχολεία σε όλη την Κωνσταντινούπολη, με παράλληλες επιθέσεις στη Σμύρνη. Αφορμή στάθηκε
    είδηση ότι βόμβα είχε προκαλέσει ζημιά στο τουρκικό προξενείο και στο σπίτι όπου γεννήθηκε ο
    Κεμάλ Ατατούρκ στη Θεσσαλονίκη· τον μηχανισμό είχε τοποθετήσει στην πραγματικότητα Τούρκος
    κλητήρας του προξενείου, ο οποίος συνελήφθη και ομολόγησε. Οι δίκες της Γιασσιάδας
    του 1960 με 1961 απέδειξαν ότι είχε γίνει με εντολή της ίδιας της τουρκικής
    κυβέρνησης, οπότε η αφορμή δεν ήταν απλώς πλαστή αλλά επισήμως πλαστή. Οι
    καταγραφές δίνουν 5.317
    κατεστραμμένες περιουσίες, ανάμεσά τους 73 εκκλησίες και 26 σχολεία. Οι αριθμοί των νεκρών
    αμφισβητούνται: συνήθως υπολογίζονται σε 13 έως 16 Έλληνες και ένας Αρμένιος, ενώ άλλες εκτιμήσεις
    φτάνουν τους τριάντα επτά. Τα Σεπτεμβριανά τερμάτισαν στην πράξη την ελληνική παρουσία στην
    Πόλη, που από περίπου 65.000 το 1955 έπεσε στις 49.000 το 1960 και συνέχισε να συρρικνώνεται.
body:
  en: |
    The violence ran through the night of 6 to 7 September and into the following day. The
    newspaper İstanbul Ekspres put out a special edition in the afternoon of 6 September carrying
    the report from Thessaloniki, and the edition circulated through the city for hours. Crowds
    were brought in from outside, and were supplied with crowbars and other tools and with lists of
    Greek-owned premises. That supply, more than anything else, is the evidence cited for
    organisation rather than spontaneity.

    Recorded damage covers 5,317 properties: 4,214 homes, 1,004 businesses, 73 churches, 26 schools,
    and cemeteries and monasteries besides. Estimates of the cost range from about 24.8 million
    dollars to 500 million, depending on the source and the basis of calculation. The dead are
    commonly given as thirteen to sixteen Greeks, including two clergymen, and one Armenian, with
    other estimates around thirty to thirty-seven; over a thousand people were injured, and figures
    of two hundred to four hundred rapes of Greek women and boys appear in the literature. The chaos
    of the night means no complete record was ever made.

    The timing was not accidental. The tripartite conference on Cyprus had opened in London on 29
    August and was still sitting when the crowds went through the city; it broke up without
    agreement the next day, at the moment Turkey was establishing itself as a party to the island's
    future. After the Turkish coup of 1960 the prime minister Adnan Menderes
    and the foreign minister Fatin Rüştü Zorlu were tried at Yassıada, found to have organised the
    provocation, convicted and hanged in September 1961; the Turkish parliament passed a
    rehabilitation law in 1990, and both judgements are politically contested in Turkey.

    For the Greek world the consequence was demographic and final. The Greeks of Istanbul had been
    exempted from the exchange of populations at Lausanne in 1923 and were the last substantial
    Greek community in Turkey. Their number fell from about 65,108 in 1955 to 49,081 in 1960 and
    continued to fall after the expulsion of Greek nationals in 1964; a population of 119,822 in the
    Turkish census of 1927 was around 7,000 by 1978. It was the largest single loss to the Greek
    world in this era outside Greek territory, and it happened to people whose presence in the city
    long predated both states.
  el: |
    Η βία κράτησε όλη τη νύχτα της 6ης προς 7η Σεπτεμβρίου και συνεχίστηκε την επομένη. Η εφημερίδα
    İstanbul Ekspres κυκλοφόρησε έκτακτη έκδοση το απόγευμα της 6ης Σεπτεμβρίου με την είδηση από
    τη Θεσσαλονίκη, και το φύλλο κυκλοφορούσε στην πόλη επί ώρες. Πλήθη μεταφέρθηκαν από έξω και
    εφοδιάστηκαν με λοστούς και άλλα εργαλεία, καθώς και με καταλόγους ελληνικών καταστημάτων και
    σπιτιών. Ο εφοδιασμός αυτός, περισσότερο από οτιδήποτε άλλο, αποτελεί το τεκμήριο για οργάνωση
    και όχι για αυθόρμητη έκρηξη.

    Οι καταγραφές δίνουν 5.317 πληγείσες περιουσίες: 4.214 κατοικίες, 1.004 επιχειρήσεις, 73
    εκκλησίες, 26 σχολεία, καθώς και κοιμητήρια και μοναστήρια. Οι εκτιμήσεις του κόστους κυμαίνονται
    από περίπου 24,8 εκατομμύρια δολάρια έως 500 εκατομμύρια, ανάλογα με την πηγή και τη βάση
    υπολογισμού. Οι νεκροί υπολογίζονται συνήθως σε δεκατρείς έως δεκαέξι Έλληνες, μαζί με δύο
    κληρικούς, και έναν Αρμένιο, ενώ άλλες εκτιμήσεις μιλούν για τριάντα έως τριάντα επτά.
    Τραυματίστηκαν πάνω από χίλιοι άνθρωποι, και στη βιβλιογραφία αναφέρονται διακόσιοι έως
    τετρακόσιοι βιασμοί Ελληνίδων και αγοριών. Το χάος της νύχτας σημαίνει ότι πλήρης καταγραφή
    δεν έγινε ποτέ.

    Ο χρόνος δεν ήταν τυχαίος. Η τριμερής διάσκεψη του Λονδίνου για την Κύπρο είχε ανοίξει στις 29
    Αυγούστου και βρισκόταν ακόμη σε εξέλιξη όταν τα πλήθη σάρωναν την Πόλη· διαλύθηκε χωρίς
    συμφωνία την επομένη, τη στιγμή που η Τουρκία καθιερωνόταν ως μέρος του μέλλοντος του νησιού. Μετά το τουρκικό πραξικόπημα του 1960 ο πρωθυπουργός Αντνάν
    Μεντερές και ο υπουργός Εξωτερικών Φατίν Ρουστού Ζορλού δικάστηκαν στο Γιασίαντα, κρίθηκαν
    υπεύθυνοι για την οργάνωση της πρόκλησης, καταδικάστηκαν και απαγχονίστηκαν τον Σεπτέμβριο του
    1961. Το τουρκικό κοινοβούλιο ψήφισε νόμο αποκατάστασής τους το 1990, και αμφότερες οι κρίσεις
    παραμένουν πολιτικά αμφισβητούμενες στην Τουρκία.

    Για τον ελληνισμό η συνέπεια ήταν δημογραφική και οριστική. Οι Έλληνες της Κωνσταντινούπολης
    είχαν εξαιρεθεί από την ανταλλαγή των πληθυσμών στη Λωζάνη το 1923 και ήταν η τελευταία
    σημαντική ελληνική κοινότητα στην Τουρκία. Ο αριθμός τους έπεσε από περίπου 65.108 το 1955 σε
    49.081 το 1960 και συνέχισε να πέφτει μετά τις απελάσεις Ελλήνων υπηκόων το 1964. Πληθυσμός
    119.822 ατόμων στην τουρκική απογραφή του 1927 είχε περιοριστεί σε περίπου 7.000 ως το 1978.
    Ήταν η μεγαλύτερη ενιαία απώλεια του ελληνισμού σε αυτή την εποχή έξω από ελληνικό έδαφος, και
    αφορούσε ανθρώπους των οποίων η παρουσία στην Πόλη προηγούνταν κατά πολύ και των δύο κρατών.
