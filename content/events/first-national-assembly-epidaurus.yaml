id: first-national-assembly-epidaurus
title:
  en: The First National Assembly at Epidaurus
  el: Η Α΄ Εθνοσυνέλευση της Επιδαύρου
summary:
  en: >
    Delegates from the insurgent regions met at Piada, near ancient Epidaurus, over the
    winter of 1821–22 and gave the revolution its first national government. On 1 January
    1822 Old Style they adopted the Provisional Regime of Greece, the first Greek
    constitution, and on 15 January they proclaimed the independence of the nation. The
    text set up a five-member executive under Alexandros Mavrokordatos and a separate
    legislative body, both renewed every year. The new government had little real power
    over the captains and the regional notables, but it gave the revolution a legal form in
    which to borrow money and address the Powers, and the next assembly revised the text
    rather than replacing it.
  el: >
    Πληρεξούσιοι των επαναστατημένων περιοχών συνήλθαν στην Πιάδα, κοντά στην αρχαία
    Επίδαυρο, τον χειμώνα του 1821–22 και έδωσαν στην Επανάσταση την πρώτη εθνική της
    διοίκηση. Την 1η Ιανουαρίου 1822 με το παλαιό ημερολόγιο ψήφισαν το Προσωρινό Πολίτευμα
    της Ελλάδος, το πρώτο ελληνικό σύνταγμα, και στις 15 Ιανουαρίου διακήρυξαν την
    ανεξαρτησία του έθνους. Το κείμενο συγκρότησε πενταμελές Εκτελεστικό υπό τον Αλέξανδρο
    Μαυροκορδάτο και χωριστό νομοθετικό σώμα, που ανανεώνονταν και τα δύο κάθε χρόνο. Η νέα
    διοίκηση είχε ελάχιστη πραγματική εξουσία πάνω στους οπλαρχηγούς και στους τοπικούς
    προκρίτους, έδωσε όμως στην Επανάσταση μια νόμιμη μορφή με την οποία μπορούσε να
    δανειστεί και να απευθυνθεί στις Δυνάμεις, και η επόμενη εθνοσυνέλευση αναθεώρησε το
    κείμενο αντί να το αντικαταστήσει.
body:
  en: |
    The first year of the revolution produced not one government but several. The
    Peloponnesian Senate, the Senate of Western Continental Greece and the Areopagus of
    Eastern Continental Greece each answered to local notables and chiefs, and none had
    authority over the others. A national assembly was meant to meet at Argos; it met
    instead at Piada, the modern Nea Epidavros on the Saronic coast, and opened its
    proceedings on 20 December 1821 Old Style, 1 January 1822 in the calendar used on this
    map. The usual count of its members is 59, though the surviving lists do not agree
    exactly.

    On 1 January 1822 Old Style (13 January) the assembly adopted the Provisional Regime of
    Greece, now usually called the Constitution of 1822. Accounts of who wrote it differ:
    the Italian jurist Vincenzo Gallina is generally given the main share, with revisions by
    Mavrokordatos and Theodoros Negris. It defined as Greeks all the indigenous inhabitants
    of Greek territory who believed in Christ, gave the Orthodox Church a predominant place,
    and set up two bodies elected for a year at a time: an executive of five members and a
    legislature, the Vouleftiko, of 33. It did not draw a clear line between their powers,
    and the next three years showed the cost.

    On 15 January Old Style (27 January) the assembly elected the executive, issued its
    proclamation of the political existence and independence of the Greek nation, and
    dispersed. Mavrokordatos, a Phanariot from Constantinople, became President of the
    Executive, with Athanasios Kanakaris as vice-president and Anagnostis Papagiannopoulos
    (Deligiannis), Ioannis Orlandos and Ioannis Logothetis as members. Dimitrios Ypsilantis,
    who had come to Greece claiming the leadership of the revolution in the name of his
    brother Alexandros, was given no seat in it. A western-educated civilian at the head of
    the state, with the military chiefs outside it, anticipated the quarrel that became the
    civil wars of 1823–1825.

    The constitution left the regional governments in place beneath the national one, and
    the executive had little money, no army of its own and no means of making the captains
    obey. Its value lay elsewhere. It gave the revolution a legal person that could raise
    loans and speak to the Powers, and it settled that Greek government would rest on a
    written constitution and an elected assembly. The Second National Assembly, at Astros in
    the spring of 1823, revised it under the name of the Law of Epidaurus and abolished the
    regional bodies.
  el: |
    Ο πρώτος χρόνος της Επανάστασης δεν έβγαλε μία διοίκηση αλλά πολλές. Η Πελοποννησιακή
    Γερουσία, η Γερουσία της Δυτικής Χέρσου Ελλάδος και ο Άρειος Πάγος της Ανατολικής Χέρσου
    Ελλάδος λογοδοτούσαν ο καθένας σε τοπικούς προκρίτους και αρχηγούς, και κανένα από αυτά
    τα σώματα δεν είχε εξουσία πάνω στα άλλα. Η εθνοσυνέλευση επρόκειτο να συνέλθει στο
    Άργος· συνήλθε τελικά στην Πιάδα, τη σημερινή Νέα Επίδαυρο στις ακτές του Σαρωνικού, και
    άρχισε τις εργασίες της στις 20 Δεκεμβρίου 1821 με το παλαιό ημερολόγιο, 1η Ιανουαρίου
    1822 με αυτό που χρησιμοποιεί ο χάρτης. Τα μέλη της υπολογίζονται συνήθως σε 59, αν και
    οι σωζόμενοι κατάλογοι δεν συμφωνούν απόλυτα.

    Την 1η Ιανουαρίου 1822 με το παλαιό ημερολόγιο (13 Ιανουαρίου) η συνέλευση ψήφισε το
    Προσωρινό Πολίτευμα της Ελλάδος, που σήμερα αποκαλείται συνήθως Σύνταγμα του 1822. Οι
    αφηγήσεις για το ποιος το έγραψε διαφέρουν: στον ιταλό νομικό Βιντσέντσο Γκαλίνα
    αποδίδεται γενικά το κύριο μέρος, με αναθεωρήσεις του Μαυροκορδάτου και του Θεόδωρου
    Νέγρη. Όριζε ως Έλληνες όλους τους αυτόχθονες κατοίκους της ελληνικής επικράτειας που
    πίστευαν στον Χριστό, έδινε στην Ορθόδοξη Εκκλησία επικρατούσα θέση και συγκροτούσε δύο
    σώματα με ετήσια θητεία: ένα Εκτελεστικό πέντε μελών και ένα νομοθετικό, το Βουλευτικό,
    33 μελών. Δεν χάραζε σαφή όρια ανάμεσα στις αρμοδιότητές τους, και τα επόμενα τρία χρόνια
    έδειξαν το κόστος.

    Στις 15 Ιανουαρίου με το παλαιό ημερολόγιο (27 Ιανουαρίου) η συνέλευση εξέλεξε το
    Εκτελεστικό, εξέδωσε τη διακήρυξή της για την πολιτική ύπαρξη και την ανεξαρτησία του
    ελληνικού έθνους και διαλύθηκε. Ο Μαυροκορδάτος, φαναριώτης από την Κωνσταντινούπολη,
    έγινε Πρόεδρος του Εκτελεστικού, με αντιπρόεδρο τον Αθανάσιο Κανακάρη και μέλη τον
    Αναγνώστη Παπαγιαννόπουλο (Δεληγιάννη), τον Ιωάννη Ορλάνδο και τον Ιωάννη Λογοθέτη. Ο
    Δημήτριος Υψηλάντης, που είχε έρθει στην Ελλάδα διεκδικώντας την ηγεσία της Επανάστασης
    στο όνομα του αδελφού του Αλέξανδρου, δεν πήρε θέση σε αυτό. Ένας πολιτικός με δυτική
    παιδεία στην κορυφή του κράτους, με τους στρατιωτικούς αρχηγούς έξω από αυτήν,
    προοιωνιζόταν τη διένεξη που έγινε οι εμφύλιοι πόλεμοι του 1823–1825.

    Το πολίτευμα άφησε τις τοπικές διοικήσεις στη θέση τους, κάτω από την εθνική, και το
    Εκτελεστικό είχε λίγα χρήματα, κανέναν δικό του στρατό και κανένα μέσο για να κάνει τους
    οπλαρχηγούς να υπακούσουν. Η αξία του βρισκόταν αλλού. Έδωσε στην Επανάσταση ένα νομικό
    πρόσωπο που μπορούσε να συνάψει δάνεια και να μιλήσει στις Δυνάμεις, και καθιέρωσε ότι η
    ελληνική διακυβέρνηση θα στηριζόταν σε γραπτό σύνταγμα και σε εκλεγμένη συνέλευση. Η Β΄
    Εθνοσυνέλευση, στο Άστρος την άνοιξη του 1823, το αναθεώρησε με τον τίτλο Νόμος της
    Επιδαύρου και κατάργησε τα τοπικά σώματα.
