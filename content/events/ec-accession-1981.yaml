id: ec-accession-1981
title:
  en: Greece Joins the European Communities
  el: Η ένταξη της Ελλάδας στις Ευρωπαϊκές Κοινότητες
summary:
  en: >
    Greece applied for full membership of the European Communities on 12 June 1975,
    twelve months after the junta fell, and became the tenth member on 1 January 1981.
    The treaty had been signed at the Zappeion in Athens on 28 May 1979 with the nine
    existing members. Karamanlis argued the case in political rather than economic
    terms: a Greece anchored in Europe would find it much harder to relapse into
    dictatorship. It was the Community's first enlargement to the European south and the
    beginning of the institutional relationship that would define the next half century.
  el: >
    Η Ελλάδα υπέβαλε αίτηση πλήρους ένταξης στις Ευρωπαϊκές Κοινότητες στις 12 Ιουνίου
    1975, δώδεκα μήνες μετά την πτώση της χούντας, και έγινε το δέκατο μέλος την 1η
    Ιανουαρίου 1981. Η συνθήκη είχε υπογραφεί στο Ζάππειο στις 28 Μαΐου 1979 με τα εννέα
    τότε κράτη μέλη. Ο Καραμανλής υπερασπίστηκε την ένταξη με πολιτικά και όχι οικονομικά
    επιχειρήματα: μια Ελλάδα αγκυροβολημένη στην Ευρώπη θα δυσκολευόταν πολύ περισσότερο
    να ξαναγλιστρήσει στη δικτατορία. Ήταν η πρώτη διεύρυνση της Κοινότητας προς τον
    ευρωπαϊκό νότο και η αρχή της θεσμικής σχέσης που θα καθόριζε τον επόμενο μισό αιώνα.
body:
  en: |
    Greece had been an associate of the Community since the Athens agreement of 9 July
    1961, which came into force in November 1962 and was frozen while the colonels
    ruled. Reviving it was not enough for Karamanlis, who wanted membership and wanted
    it quickly, and who pressed the case in the capitals himself while the Greek economy
    was in no condition to meet Community competition. The application went in a year
    after the tanks left the streets, and the decision to take it was understood on all
    sides as a political one about the stability of a new democracy on the Community's
    southern flank.

    The treaty was signed at the Zappeion in 1979 by Karamanlis as Prime Minister and
    entered into force on 1 January 1981, when Georgios Rallis had succeeded him in
    office and Karamanlis himself was President of the Republic. Accession brought the
    Common Agricultural Policy, the free movement of goods and, from 1985, the
    Integrated Mediterranean Programmes. Free movement for Greek workers inside the
    Community was phased in only from 1 January 1988, after a transitional period that
    reflected how much poorer Greece was than the nine.

    PASOK had opposed the whole project and campaigned in 1981 for a referendum on
    leaving. In government from that October it dropped the demand and used the
    structural funds as hard as any member ever has. That reversal is the clearest
    single measure of how fast membership became a fixed point in Greek politics rather
    than a question inside it. Greece held the rotating presidency of the Council for
    the first time in the second half of 1983.
  el: |
    Η Ελλάδα ήταν συνδεδεμένο μέλος της Κοινότητας από τη Συμφωνία Σύνδεσης των Αθηνών
    της 9ης Ιουλίου 1961, που τέθηκε σε ισχύ τον Νοέμβριο του 1962 και πάγωσε όσο
    κυβερνούσαν οι συνταγματάρχες. Η επαναφορά της δεν αρκούσε στον Καραμανλή, που ήθελε
    πλήρη ένταξη και την ήθελε γρήγορα, και που πίεσε ο ίδιος στις ευρωπαϊκές
    πρωτεύουσες ενώ η ελληνική οικονομία δεν ήταν σε θέση να αντέξει τον κοινοτικό
    ανταγωνισμό. Η αίτηση κατατέθηκε έναν χρόνο αφότου τα τανκς είχαν φύγει από τους
    δρόμους, και η απόφαση να γίνει δεκτή έγινε παντού κατανοητή ως πολιτική, καθώς
    αφορούσε τη σταθερότητα μιας νέας δημοκρατίας στη νότια πτέρυγα της Κοινότητας.

    Η συνθήκη υπογράφηκε στο Ζάππειο το 1979 από τον Καραμανλή ως πρωθυπουργό και τέθηκε
    σε ισχύ την 1η Ιανουαρίου 1981, όταν στην πρωθυπουργία είχε ήδη διαδεχθεί ο Γεώργιος
    Ράλλης και ο ίδιος ο Καραμανλής ήταν Πρόεδρος της Δημοκρατίας. Η ένταξη έφερε την
    Κοινή Αγροτική Πολιτική, την ελεύθερη κυκλοφορία των εμπορευμάτων και, από το 1985,
    τα Μεσογειακά Ολοκληρωμένα Προγράμματα. Η ελεύθερη κυκλοφορία των Ελλήνων εργαζομένων
    μέσα στην Κοινότητα εφαρμόστηκε μόλις από την 1η Ιανουαρίου 1988, μετά από
    μεταβατική περίοδο που αποτύπωνε πόσο φτωχότερη ήταν η Ελλάδα από τα εννέα.

    Το ΠΑΣΟΚ είχε αντιταχθεί σε όλο το εγχείρημα και ζητούσε το 1981 δημοψήφισμα για
    έξοδο. Από τον Οκτώβριο εκείνης της χρονιάς στην κυβέρνηση, εγκατέλειψε το αίτημα και
    αξιοποίησε τα διαρθρωτικά ταμεία όσο λίγα κράτη μέλη. Αυτή η στροφή είναι το
    καθαρότερο μέτρο του πόσο γρήγορα η ένταξη έγινε σταθερό σημείο της ελληνικής
    πολιτικής και έπαψε να είναι ερώτημα μέσα σε αυτήν. Η Ελλάδα ανέλαβε για πρώτη φορά
    την προεδρία του Συμβουλίου το δεύτερο εξάμηνο του 1983.
