id: eoka-campaign-begins
title:
  en: The EOKA Campaign Begins
  el: Η έναρξη του αγώνα της ΕΟΚΑ
summary:
  en: >
    Thirty minutes after midnight on 1 April 1955, coordinated bombs went off against government,
    police and military targets in Nicosia, Famagusta, Limassol and Larnaca. A leaflet signed
    Digenis announced a struggle for self-determination leading to union with Greece; behind the
    name was Georgios Grivas, a Cypriot-born officer of the Greek army. Britain deported Archbishop
    Makarios to the Seychelles in March 1956 and fought a four-year counter-insurgency. The campaign
    killed British soldiers, policemen and Cypriot civilians, many of the last killed by EOKA as
    collaborators or leftists. It ended in 1959 with an independent Cyprus, which was not what it
    had been fought for.
  el: >
    Τριάντα λεπτά μετά τα μεσάνυχτα της 1ης Απριλίου 1955 εξερράγησαν συντονισμένες βόμβες σε
    κυβερνητικούς, αστυνομικούς και στρατιωτικούς στόχους στη Λευκωσία, την Αμμόχωστο, τη Λεμεσό
    και τη Λάρνακα. Προκήρυξη με την υπογραφή ΔΙΓΕΝΗΣ ανήγγειλε αγώνα για αυτοδιάθεση που θα
    οδηγούσε στην ένωση με την Ελλάδα· πίσω από το όνομα βρισκόταν ο Γεώργιος Γρίβας,
    κυπριακής καταγωγής αξιωματικός του ελληνικού στρατού. Η Βρετανία εξόρισε τον αρχιεπίσκοπο
    Μακάριο στις Σεϋχέλλες τον Μάρτιο του 1956 και έδωσε τετραετή αντιανταρτικό αγώνα. Ο αγώνας
    σκότωσε Βρετανούς στρατιώτες, αστυνομικούς και Κυπρίους πολίτες, πολλούς από τους τελευταίους
    με τα όπλα της ΕΟΚΑ ως συνεργάτες ή ως αριστερούς. Κατέληξε το 1959 σε ανεξάρτητη Κύπρο, που
    δεν ήταν αυτό για το οποίο είχε δοθεί.
body:
  en: |
    The failure of the appeal to the United Nations in December 1954 settled an argument that had
    been running among Greek Cypriots for years. Grivas had been preparing an armed campaign
    with Makarios's knowledge for several years. The opening attacks came on the
    night of 31 March to 1 April 1955 and the first attacks on police stations followed on 19 June.
    The stated aim was never an independent Cypriot state; it was enosis.

    Britain answered with a counter-insurgency under Field Marshal Sir John Harding, governor from
    late September 1955. Makarios was deported on 9 March 1956 with a bishop, a priest and a
    newspaper editor, reaching the Seychelles on 14 March and held for about a year. Released in
    1957, he was barred from Cyprus and went to Athens; he did not see the island again until 1
    March 1959. Nine EOKA members were hanged between 1956 and 1957, and the executions of Michalis
    Karaolis and Andreas Demetriou on 10 May 1956 brought riots in both Cyprus and Greece. Grigoris
    Afxentiou, the second in command, died on 3 March 1957 near the Machairas monastery when Royal
    Engineers poured petrol into his dugout and set it alight after he refused to surrender.

    Figures compiled by the historian Heinz Richter give 104 British soldiers killed, 54 policemen,
    of whom 15 were Greek Cypriot, 22 Turkish Cypriot and 12 British, and 238 civilians, of whom 203
    were Greek Cypriot, 26 British and 7 Turkish Cypriot. A substantial share of the Greek Cypriot
    civilian dead were killed by EOKA itself, as informers, as opponents of the campaign or as
    members of the Cypriot Left, and that part of the record is still fought over in Cyprus between
    those who honour the organisation and those whose families it killed.

    The campaign also produced its mirror image. Turkish Cypriot organisations formed in response,
    first Volkan and from 1958 the TMT, and pressed partition, taksim, against enosis. The first
    sustained intercommunal killings date from 1958. Grivas issued a leaflet accepting the Zurich
    and London agreements on 9 March 1959 and left the island. Cyprus became independent rather than
    Greek, EOKA's political defeat, and Grivas would later return to found EOKA-B against the
    state that had emerged.
  el: |
    Η αποτυχία της προσφυγής στον ΟΗΕ τον Δεκέμβριο του 1954 έκρινε μια διαμάχη που κρατούσε χρόνια
    ανάμεσα στους Ελληνοκυπρίους. Ο Γρίβας ετοίμαζε ένοπλο αγώνα εν γνώσει του Μακαρίου επί
    αρκετά χρόνια. Οι πρώτες επιθέσεις έγιναν τη νύχτα της 31ης Μαρτίου προς
    1η Απριλίου 1955 και οι πρώτες επιθέσεις σε αστυνομικούς σταθμούς ακολούθησαν στις 19 Ιουνίου. Ο
    διακηρυγμένος στόχος δεν ήταν ποτέ ανεξάρτητο κυπριακό κράτος· ήταν η ένωση.

    Η Βρετανία απάντησε με αντιανταρτικό αγώνα υπό τον στρατάρχη σερ Τζον Χάρντινγκ, κυβερνήτη από
    τα τέλη Σεπτεμβρίου 1955. Ο Μακάριος εξορίστηκε στις 9 Μαρτίου 1956 μαζί με έναν μητροπολίτη,
    έναν ιερέα και έναν εκδότη εφημερίδας, έφτασε στις Σεϋχέλλες στις 14 Μαρτίου και κρατήθηκε
    περίπου έναν χρόνο. Αφέθηκε ελεύθερος το 1957, του απαγορεύτηκε η επιστροφή στην Κύπρο και πήγε
    στην Αθήνα· ξαναείδε το νησί μόλις την 1η Μαρτίου 1959. Εννέα μέλη της ΕΟΚΑ απαγχονίστηκαν
    μεταξύ 1956 και 1957, και οι εκτελέσεις του Μιχαλάκη Καραολή και του Ανδρέα Δημητρίου στις 10
    Μαΐου 1956 προκάλεσαν ταραχές σε Κύπρο και Ελλάδα. Ο Γρηγόρης Αυξεντίου, υπαρχηγός της
    οργάνωσης, σκοτώθηκε στις 3 Μαρτίου 1957 κοντά στη μονή Μαχαιρά, όταν Βρετανοί μηχανικοί έχυσαν
    βενζίνη στο κρησφύγετό του και του έβαλαν φωτιά αφού αρνήθηκε να παραδοθεί.

    Τα στοιχεία που συγκέντρωσε ο ιστορικός Χάιντς Ρίχτερ δίνουν 104 νεκρούς Βρετανούς στρατιώτες,
    54 αστυνομικούς, από τους οποίους 15 Ελληνοκύπριοι, 22 Τουρκοκύπριοι και 12 Βρετανοί, και 238
    πολίτες, από τους οποίους 203 Ελληνοκύπριοι, 26 Βρετανοί και 7 Τουρκοκύπριοι. Σημαντικό μέρος
    των Ελληνοκυπρίων νεκρών αμάχων σκοτώθηκαν από την ίδια την ΕΟΚΑ, ως πληροφοριοδότες, ως
    αντίπαλοι του αγώνα ή ως μέλη της κυπριακής Αριστεράς, και το κομμάτι αυτό της ιστορίας
    εξακολουθεί να διχάζει την Κύπρο ανάμεσα σε όσους τιμούν την οργάνωση και σε όσους έχασαν
    δικούς τους από αυτήν.

    Ο αγώνας γέννησε και το είδωλό του. Τουρκοκυπριακές οργανώσεις συγκροτήθηκαν ως απάντηση, πρώτα
    η Βολκάν και από το 1958 η ΤΜΤ, και προέβαλαν τη διχοτόμηση, το ταξίμ, απέναντι στην ένωση. Οι
    πρώτες συστηματικές διακοινοτικές δολοφονίες χρονολογούνται από το 1958. Ο Γρίβας εξέδωσε
    προκήρυξη αποδοχής των συμφωνιών Ζυρίχης και Λονδίνου στις 9 Μαρτίου 1959 και έφυγε από το
    νησί. Η Κύπρος έγινε ανεξάρτητη και όχι ελληνική, η πολιτική ήττα της ΕΟΚΑ, και ο Γρίβας θα
    επέστρεφε αργότερα για να ιδρύσει την ΕΟΚΑ Β΄ εναντίον του κράτους που είχε προκύψει.
