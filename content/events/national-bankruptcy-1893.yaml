id: national-bankruptcy-1893
title:
  en: The National Bankruptcy of 1893
  el: Η πτώχευση του 1893
summary:
  en: >
    Fourteen years of borrowing to build railways, roads and harbours had left Greece
    with a foreign debt more than twice its national income and debt service eating a
    third of state revenue. When France raised its tariffs and the price of Greek
    currants collapsed, the last source of foreign exchange went with it. On 22 December
    1893 Charilaos Trikoupis told the Chamber that Greece could not pay, and the law
    that followed offered creditors about 30 per cent of the interest due. Five years
    later an international commission took over the revenues that secured the debt, and
    stayed until 1936.
  el: >
    Δεκατέσσερα χρόνια δανεισμού για σιδηροδρόμους, δρόμους και λιμάνια είχαν αφήσει την
    Ελλάδα με εξωτερικό χρέος πάνω από το διπλάσιο του εθνικού εισοδήματος και
    εξυπηρέτηση που έτρωγε το ένα τρίτο των κρατικών εσόδων. Όταν η Γαλλία ύψωσε τους
    δασμούς της και η τιμή της ελληνικής σταφίδας κατέρρευσε, χάθηκε και η τελευταία πηγή
    συναλλάγματος. Στις 22 Δεκεμβρίου 1893 ο Χαρίλαος Τρικούπης ανακοίνωσε στη Βουλή ότι
    η Ελλάδα αδυνατούσε να πληρώσει, και ο νόμος που ακολούθησε πρόσφερε στους δανειστές
    περίπου το 30 τοις εκατό των τόκων. Πέντε χρόνια αργότερα διεθνής επιτροπή ανέλαβε τα
    έσοδα που εξασφάλιζαν το χρέος και έμεινε ως το 1936.
body:
  en: |
    Trikoupis had built a state. Greek railways went from about twelve kilometres in
    1882 to more than nine hundred by 1893; the harbour works at Piraeus, the road
    network and the draining of Lake Copais all belong to the same programme, and all of
    it was borrowed abroad. The foreign debt rose from roughly two thirds of national
    income in 1877 to more than twice it by 1893, and servicing it took about a third of
    state revenue, by some accounts closer to half. Theodoros Deligiannis, who alternated
    in office with Trikoupis for twenty years, made it worse from the other direction:
    his mobilisation of 1885 and 1886 over the Bulgarian crisis cost money the treasury
    never recovered, and ended with the Powers blockading Greek ports from January to
    May 1886 to force demobilisation.

    The trigger was currants. Dried Greek currants were the dominant export and France
    was the dominant market, buying them for wine while its own vineyards recovered from
    phylloxera. When the vines came back France raised its tariffs in 1892, the price
    collapsed, and the earnings that had covered the interest disappeared in a season.
    On 10 December 1893 Old Style Trikoupis told the Chamber that the state could not
    meet its obligations. The sentence attached to him ever since, Dystychos
    eptocheusamen, regrettably we are bankrupt, does not appear in the parliamentary
    record and rests on later testimony; the default does not depend on it. The law that
    followed suspended most debt service and offered bondholders roughly 30 per cent of
    the interest, a write-down of about seventy.

    Trikoupis lost the election of April 1895 so completely that he lost his own seat.
    He withdrew to Cannes and died there on 11 April 1896, five days after the Olympic
    Games he had opposed on grounds of cost opened in Athens. The settlement of the
    default was finished by the defeat of 1897: under Law 2519 of 23 February 1898 an
    International Financial Commission of the six Powers took control of the revenues
    from the monopolies on salt, kerosene, matches, playing cards, cigarette paper and
    Naxos emery, together with the tobacco and stamp duties and the Piraeus harbour
    dues. It sat in Athens for thirty-eight years.
  el: |
    Ο Τρικούπης είχε χτίσει ένα κράτος. Το ελληνικό σιδηροδρομικό δίκτυο πήγε από
    δώδεκα περίπου χιλιόμετρα το 1882 σε πάνω από εννιακόσια ως το 1893. Τα λιμενικά έργα
    του Πειραιά, το οδικό δίκτυο και η αποξήρανση της Κωπαΐδας ανήκουν στο ίδιο πρόγραμμα,
    και όλα χρηματοδοτήθηκαν με δανεισμό από το εξωτερικό. Το εξωτερικό χρέος ανέβηκε από
    περίπου τα δύο τρίτα του εθνικού εισοδήματος το 1877 σε πάνω από το διπλάσιό του ως το
    1893, και η εξυπηρέτησή του απορροφούσε γύρω στο ένα τρίτο των κρατικών εσόδων, κατά
    ορισμένους υπολογισμούς σχεδόν το μισό. Ο Θεόδωρος Δηλιγιάννης, που εναλλασσόταν στην
    εξουσία με τον Τρικούπη επί είκοσι χρόνια, επιβάρυνε τα πράγματα από την άλλη πλευρά:
    η επιστράτευση του 1885 και του 1886 για τη βουλγαρική κρίση κόστισε χρήματα που το
    ταμείο δεν ξαναβρήκε και κατέληξε σε ναυτικό αποκλεισμό των ελληνικών λιμανιών από τις
    Δυνάμεις, από τον Ιανουάριο ως τον Μάιο του 1886, ώσπου να γίνει η αποστράτευση.

    Η αφορμή ήταν η σταφίδα. Η κορινθιακή σταφίδα ήταν το κύριο ελληνικό εξαγωγικό προϊόν και
    η Γαλλία η κύρια αγορά, που την αγόραζε για οινοποίηση όσο οι δικοί της αμπελώνες
    ανέκαμπταν από τη φυλλοξήρα. Όταν τα γαλλικά αμπέλια ξαναμπήκαν στην παραγωγή, η
    Γαλλία ύψωσε τους δασμούς το 1892, η τιμή κατέρρευσε και τα έσοδα που πλήρωναν τους
    τόκους εξαφανίστηκαν μέσα σε μια σοδειά. Στις 10 Δεκεμβρίου 1893 ο Τρικούπης
    ανακοίνωσε στη Βουλή ότι το κράτος αδυνατούσε να ανταποκριθεί στις υποχρεώσεις του. Η
    φράση που έμεινε συνδεδεμένη μαζί του, «Δυστυχώς επτωχεύσαμεν», δεν υπάρχει στα
    πρακτικά και στηρίζεται σε μεταγενέστερες μαρτυρίες. Η στάση πληρωμών δεν εξαρτάται
    από αυτήν. Ο νόμος που ακολούθησε ανέστειλε το μεγαλύτερο μέρος της εξυπηρέτησης και
    πρόσφερε στους ομολογιούχους περίπου το 30 τοις εκατό των τόκων, δηλαδή κούρεμα γύρω
    στο εβδομήντα.

    Ο Τρικούπης έχασε τις εκλογές του Απριλίου 1895 τόσο ολοκληρωτικά που έχασε και τη
    δική του έδρα. Αποσύρθηκε στις Κάννες και πέθανε εκεί στις 11 Απριλίου 1896, πέντε
    μέρες αφότου άνοιξαν στην Αθήνα οι Ολυμπιακοί Αγώνες στους οποίους είχε εναντιωθεί
    για λόγους κόστους. Τη ρύθμιση της χρεοκοπίας την ολοκλήρωσε η ήττα του 1897: με τον
    νόμο 2519 της 23ης Φεβρουαρίου 1898 Διεθνής Οικονομικός Έλεγχος των έξι Δυνάμεων
    ανέλαβε τα έσοδα από τα μονοπώλια αλατιού, πετρελαίου, σπίρτων, τραπουλόχαρτων,
    τσιγαρόχαρτου και σμύριδας Νάξου, μαζί με τον φόρο καπνού, τα χαρτόσημα και τα
    λιμενικά τέλη του Πειραιά. Έμεινε στην Αθήνα τριάντα οκτώ χρόνια.
