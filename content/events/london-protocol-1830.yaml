id: london-protocol-1830
title:
  en: The London Protocol of 1830
  el: Το Πρωτόκολλο του Λονδίνου του 1830
summary:
  en: >
    Meeting in London without Greek or Ottoman representatives, Britain, France and Russia
    declared Greece a fully sovereign and independent state under their guarantee. It was
    the first international act to recognise Greek sovereignty, and in Greek it is often
    called the Protocol of Independence. The price was the frontier. Independence came with
    a narrower line, along the Aspropotamos and the Spercheios, than the one the Powers had
    offered in 1829 to an autonomous state still paying tribute to the Sultan. The state was
    to be a hereditary monarchy, and the throne went first to Leopold of Saxe-Coburg, who
    accepted it and then, in May, gave it up.
  el: >
    Σε σύσκεψη στο Λονδίνο χωρίς έλληνες ή οθωμανούς εκπροσώπους, η Βρετανία, η Γαλλία και
    η Ρωσία κήρυξαν την Ελλάδα πλήρως κυρίαρχο και ανεξάρτητο κράτος υπό την εγγύησή τους.
    Ήταν η πρώτη διεθνής πράξη που αναγνώρισε την ελληνική κυριαρχία, και στα ελληνικά
    αναφέρεται συχνά ως Πρωτόκολλο της Ανεξαρτησίας. Το τίμημα ήταν τα σύνορα. Η ανεξαρτησία
    ήρθε με στενότερη γραμμή, στον Ασπροπόταμο και τον Σπερχειό, από εκείνη που είχαν
    προσφέρει οι Δυνάμεις το 1829 σε ένα αυτόνομο κράτος που θα πλήρωνε ακόμη φόρο στον
    σουλτάνο. Το κράτος θα ήταν κληρονομική μοναρχία, και ο θρόνος δόθηκε πρώτα στον Λεοπόλδο
    του Σαξ-Κόμπουργκ, ο οποίος τον δέχθηκε και έπειτα, τον Μάιο, τον παραίτησε.
body:
  en: |
    The Treaty of London of July 1827 had committed the three Powers only to an autonomous
    Greece under Ottoman suzerainty. A protocol of 22 March 1829 (10 March Old Style) gave
    that state a frontier from the Ambracian Gulf to the Pagasetic Gulf, a Christian
    hereditary ruler and an annual tribute to the Sultan of 1,500,000 piastres. The Porte
    would accept none of it until Russia's victory in the war of 1828–1829 forced its hand,
    and by the Treaty of Adrianople of 14 September 1829 the Sultan accepted Greek autonomy
    on the terms of the Treaty of London.

    Once Russian armies had reached Adrianople, a Greece left tied to the Sultan looked less
    useful to the other Powers than a Greece fully detached from him, and the usual reading
    is that Britain in particular preferred a small independent state to a large dependent
    one. On 3 February 1830 (22 January Old Style) Lord Aberdeen for Britain,
    Montmorency-Laval for France and Lieven for Russia signed a protocol that made Greece a fully
    sovereign and independent state, to be ruled by a hereditary prince with the title of
    Sovereign Prince of Greece. In exchange the frontier was drawn back to the Aspropotamos,
    the Achelous, and the Spercheios, which left Acarnania and much of Central Greece
    outside. The Peloponnese, the mainland south of that line, Euboea, the Cyclades and the
    Sporades were included; Crete and Samos were not.

    The Powers notified the Greek government and the Porte on 8 April 1830 (27 March Old
    Style), and the Sultan accepted. Kapodistrias, who had been kept out of the negotiations
    and objected to the frontier, accepted the protocol on condition that the Ottoman
    garrisons leave Attica and Euboea. Leopold of Saxe-Coburg formally accepted the crown on
    28 February 1830 and gave it up in May, judging the throne too precarious. The search for
    a king, and for a better frontier, went on for two more years.

    The protocol of 1830 is the founding act of Greek independence in international law,
    and it is why the Greek state was born under protection as well as sovereign: the three
    Powers that recognised it also guaranteed it, and treated the guarantee as a right to
    intervene. Its frontier did not last. A further protocol in September 1831, the London
    Convention of May 1832 that chose Otto, and the Treaty of Constantinople of July 1832
    restored the line from the Gulf of Arta to the Gulf of Volos.
  el: |
    Η Συνθήκη του Λονδίνου του Ιουλίου 1827 δέσμευε τις τρεις Δυνάμεις μόνο για μια αυτόνομη
    Ελλάδα υπό οθωμανική επικυριαρχία. Ένα πρωτόκολλο της 22ας Μαρτίου 1829 (10 Μαρτίου με το
    παλαιό ημερολόγιο) έδινε σε αυτό το κράτος σύνορο από τον Αμβρακικό ως τον Παγασητικό
    κόλπο, χριστιανό κληρονομικό ηγεμόνα και ετήσιο φόρο προς τον σουλτάνο 1.500.000 γροσιών.
    Η Πύλη δεν δεχόταν τίποτε από αυτά, ώσπου η νίκη της Ρωσίας στον πόλεμο του 1828–1829 την
    ανάγκασε, και με τη Συνθήκη της Αδριανούπολης της 14ης Σεπτεμβρίου 1829 ο σουλτάνος
    δέχθηκε την ελληνική αυτονομία με τους όρους της Συνθήκης του Λονδίνου.

    Από τη στιγμή που οι ρωσικοί στρατοί είχαν φτάσει στην Αδριανούπολη, μια Ελλάδα δεμένη
    με τον σουλτάνο φαινόταν στις άλλες Δυνάμεις λιγότερο χρήσιμη από μια Ελλάδα εντελώς
    αποκομμένη από αυτόν, και η συνήθης ερμηνεία είναι ότι κυρίως η Βρετανία προτιμούσε ένα
    μικρό ανεξάρτητο κράτος από ένα μεγάλο εξαρτημένο. Στις 3 Φεβρουαρίου 1830 (22 Ιανουαρίου
    με το παλαιό ημερολόγιο) ο λόρδος Αμπερντίν για τη Βρετανία, ο Μονμορανσί-Λαβάλ για τη
    Γαλλία και ο Λίβεν για τη Ρωσία υπέγραψαν πρωτόκολλο που καθιστούσε την Ελλάδα πλήρως
    κυρίαρχο και ανεξάρτητο κράτος, με κληρονομικό ηγεμόνα που θα έφερε τον τίτλο Ηγεμών
    Κυρίαρχος της Ελλάδος. Σε αντάλλαγμα το σύνορο τραβήχτηκε πίσω στον Ασπροπόταμο, τον
    Αχελώο, και στον Σπερχειό, αφήνοντας έξω την Ακαρνανία και μεγάλο μέρος της Στερεάς
    Ελλάδας. Περιλαμβάνονταν η Πελοπόννησος, η ηπειρωτική χώρα νότια της γραμμής, η Εύβοια,
    οι Κυκλάδες και οι Σποράδες· η Κρήτη και η Σάμος όχι.

    Οι Δυνάμεις γνωστοποίησαν το πρωτόκολλο στην ελληνική κυβέρνηση και στην Πύλη στις 8
    Απριλίου 1830 (27 Μαρτίου με το παλαιό ημερολόγιο), και ο σουλτάνος το δέχθηκε. Ο
    Καποδίστριας, που είχε κρατηθεί έξω από τις διαπραγματεύσεις και αντιτασσόταν στο σύνορο,
    αποδέχθηκε το πρωτόκολλο με τον όρο να αποχωρήσουν οι οθωμανικές φρουρές από την Αττική
    και την Εύβοια. Ο Λεοπόλδος του Σαξ-Κόμπουργκ δέχθηκε επίσημα το στέμμα στις 28
    Φεβρουαρίου 1830 και το παραίτησε τον Μάιο, κρίνοντας τον θρόνο υπερβολικά επισφαλή. Η
    αναζήτηση βασιλιά, και καλύτερου συνόρου, συνεχίστηκε για δύο ακόμη χρόνια.

    Το πρωτόκολλο του 1830 είναι η ιδρυτική πράξη της ελληνικής ανεξαρτησίας στο διεθνές
    δίκαιο, και εξηγεί γιατί το ελληνικό κράτος γεννήθηκε υπό προστασία και ταυτόχρονα
    κυρίαρχο: οι τρεις Δυνάμεις που το αναγνώρισαν το εγγυήθηκαν κιόλας, και αντιμετώπισαν
    την εγγύηση ως δικαίωμα επέμβασης. Το σύνορό του δεν διήρκεσε. Ένα νέο πρωτόκολλο τον
    Σεπτέμβριο του 1831, η Σύμβαση του Λονδίνου του Μαΐου 1832 που επέλεξε τον Όθωνα και η
    Συνθήκη της Κωνσταντινούπολης του Ιουλίου 1832 αποκατέστησαν τη γραμμή από τον κόλπο της
    Άρτας ως τον κόλπο του Βόλου.
