id: burning-of-smyrna
title:
  en: The burning of Smyrna
  el: Η καταστροφή της Σμύρνης
summary:
  en: >
    Turkish forces entered Smyrna on 9 September 1922 and the Metropolitan Chrysostomos
    was handed to a mob and killed the same day. Fire broke out in the Armenian quarter
    on 13 September and burned for about nine days, destroying the Greek and Armenian
    districts while the Turkish and Jewish quarters were largely spared. Responsibility
    is disputed: most Western eyewitnesses and scholars blame Turkish troops and
    irregulars, Turkish accounts blame Greeks and Armenians, and no agreed death toll
    exists. Between 80,000 and 400,000 people were pressed onto the quay between the fire
    and the sea, and about 30,000 men of military age were deported inland into labour
    battalions.
  el: >
    Τουρκικές δυνάμεις μπήκαν στη Σμύρνη στις 9 Σεπτεμβρίου 1922 και ο μητροπολίτης
    Χρυσόστομος παραδόθηκε στον όχλο και δολοφονήθηκε την ίδια ημέρα. Η πυρκαγιά ξέσπασε στην
    αρμενική συνοικία στις 13 Σεπτεμβρίου και κράτησε περίπου εννέα ημέρες, καταστρέφοντας την
    ελληνική και την αρμενική συνοικία, ενώ η τουρκική και η εβραϊκή έμειναν σε μεγάλο βαθμό
    άθικτες. Η ευθύνη αμφισβητείται: οι περισσότεροι δυτικοί αυτόπτες και μελετητές την
    αποδίδουν σε τουρκικά στρατεύματα και ατάκτους, οι τουρκικές αφηγήσεις την αποδίδουν σε
    Έλληνες και Αρμενίους, και δεν υπάρχει συμφωνημένος αριθμός νεκρών. Από 80.000 ως 400.000
    άνθρωποι στοιβάχτηκαν στην προκυμαία ανάμεσα στη φωτιά και τη θάλασσα, και περίπου 30.000
    άνδρες στρατεύσιμης ηλικίας εκτοπίστηκαν στο εσωτερικό σε τάγματα εργασίας.
body:
  en: |
    Nureddin Pasha's troops entered the city on 9 September. High Commissioner Stergiadis
    left on a British warship without having organised a civilian evacuation, a decision
    that has never been forgiven in Greek memory and for which no adequate defence has
    been offered. Metropolitan Chrysostomos was summoned by Nureddin, handed over to a
    crowd and killed in front of a French marine detachment under orders not to
    intervene; some accounts place the killing on 10 September.

    The fire began on 13 September in the Armenian quarter and burned until about 22
    September. It destroyed the Greek and Armenian districts and left the Turkish and
    Jewish quarters largely intact, which is the fact around which the argument over
    responsibility has always turned. Most Western eyewitnesses and most subsequent
    scholarship attribute it to Turkish soldiers and irregulars, and several described
    men setting fires with rag-tipped poles dipped in flammable liquid. Turkish accounts
    attribute it to retreating Greeks and to Armenians. The dead in the destruction of
    the city are estimated by Norman Naimark at 10,000 to 15,000 and put far higher in
    Greek accounts; there is no agreed figure and none is likely.

    Between 80,000 and 400,000 refugees were pressed onto the quay for nearly two weeks,
    with the fire at their backs and Allied warships in the harbour that at first stood
    by on grounds of neutrality. Roughly 30,000 Greek and Armenian men of military age
    were deported into the interior into labour battalions, and most did not return. An
    American relief worker, Asa Jennings, commandeered Greek merchant shipping and
    improvised an evacuation that lifted somewhere between 150,000 and 350,000 people off
    the quay in the second half of September. Smyrna had been the largest and richest
    Greek city of Asia Minor. Its destruction, and the exchange that followed, ended
    about 2,700 years of Greek settlement on the Anatolian coast.
  el: |
    Τα στρατεύματα του Νουρεντίν πασά μπήκαν στην πόλη στις 9 Σεπτεμβρίου. Ο ύπατος αρμοστής
    Στεργιάδης έφυγε με βρετανικό πολεμικό χωρίς να έχει οργανώσει εκκένωση του άμαχου
    πληθυσμού, απόφαση που η ελληνική μνήμη δεν του συγχώρησε ποτέ και για την οποία δεν έχει
    προβληθεί επαρκής υπεράσπιση. Ο μητροπολίτης Χρυσόστομος κλήθηκε από τον Νουρεντίν,
    παραδόθηκε στο πλήθος και δολοφονήθηκε μπροστά σε γαλλικό άγημα που είχε διαταγή να μην
    επέμβει· ορισμένες αφηγήσεις τοποθετούν τη δολοφονία στις 10 Σεπτεμβρίου.

    Η πυρκαγιά ξεκίνησε στις 13 Σεπτεμβρίου στην αρμενική συνοικία και κράτησε ως τις 22
    Σεπτεμβρίου περίπου. Κατέστρεψε την ελληνική και την αρμενική συνοικία και άφησε σχεδόν
    άθικτες την τουρκική και την εβραϊκή, και γύρω από αυτό το γεγονός περιστρέφεται πάντοτε η
    διαμάχη για την ευθύνη. Οι περισσότεροι δυτικοί αυτόπτες και το μεγαλύτερο μέρος της
    μεταγενέστερης έρευνας την αποδίδουν σε τούρκους στρατιώτες και ατάκτους, και αρκετοί
    περιέγραψαν άνδρες που έβαζαν φωτιές με κοντάρια τυλιγμένα με πανιά βουτηγμένα σε εύφλεκτο
    υγρό. Οι τουρκικές αφηγήσεις την αποδίδουν στους υποχωρούντες Έλληνες και στους Αρμενίους.
    Οι νεκροί της καταστροφής της πόλης υπολογίζονται από τον Νόρμαν Νάιμαρκ σε 10.000 έως
    15.000 και δίνονται πολύ υψηλότεροι στις ελληνικές αφηγήσεις· συμφωνημένος αριθμός δεν
    υπάρχει και δύσκολα θα υπάρξει.

    Από 80.000 ως 400.000 πρόσφυγες στοιβάχτηκαν στην προκυμαία επί δύο σχεδόν εβδομάδες, με τη
    φωτιά στην πλάτη τους και συμμαχικά πολεμικά στο λιμάνι που στην αρχή παρέμειναν αδρανή
    επικαλούμενα την ουδετερότητα. Περίπου 30.000 Έλληνες και Αρμένιοι στρατεύσιμης ηλικίας
    εκτοπίστηκαν στο εσωτερικό σε τάγματα εργασίας και οι περισσότεροι δεν γύρισαν. Ο Αμερικανός
    εργαζόμενος σε οργάνωση αρωγής Άσα Τζένινγκς επίταξε ελληνικά εμπορικά πλοία και αυτοσχεδίασε
    εκκένωση που σήκωσε από την προκυμαία 150.000 ως 350.000 ανθρώπους στο δεύτερο μισό του
    Σεπτεμβρίου. Η Σμύρνη ήταν η μεγαλύτερη και πλουσιότερη ελληνική πόλη της Μικράς Ασίας. Η
    καταστροφή της, και η ανταλλαγή που ακολούθησε, τερμάτισαν περίπου 2.700 χρόνια ελληνικής
    εγκατάστασης στα μικρασιατικά παράλια.
