id: euro-adoption-2001
title:
  en: Greece Adopts the Euro
  el: Η ένταξη της Ελλάδας στην Ευρωζώνη
summary:
  en: >
    Greece entered the euro area on 1 January 2001 as its twelfth member, at a fixed and
    irrevocable rate of 340.750 drachmas to the euro. It had failed the convergence
    tests for the first wave in 1998, the only applicant excluded, and spent the
    following two years forcing inflation down from the levels of the early 1990s.
    Banknotes and coins arrived a year later and the drachma, in use since 1833, stopped
    being money. Membership brought Greek borrowers German interest rates; it also
    removed devaluation from the list of things the country could do in a crisis.
  el: >
    Η Ελλάδα εντάχθηκε στη ζώνη του ευρώ την 1η Ιανουαρίου 2001 ως δωδέκατο μέλος, με
    σταθερή και αμετάκλητη ισοτιμία 340,750 δραχμών ανά ευρώ. Είχε αποτύχει στα κριτήρια
    σύγκλισης του πρώτου κύματος το 1998, μόνη ανάμεσα στους υποψηφίους, και πέρασε τα
    δύο επόμενα χρόνια πιέζοντας τον πληθωρισμό κάτω από τα επίπεδα των αρχών της
    δεκαετίας του 1990. Τα χαρτονομίσματα και τα κέρματα ήρθαν έναν χρόνο αργότερα και η
    δραχμή, σε χρήση από το 1833, έπαψε να είναι χρήμα. Η συμμετοχή έδωσε στους Έλληνες
    δανειολήπτες γερμανικά επιτόκια. Αφαίρεσε επίσης την υποτίμηση από όσα μπορούσε να
    κάνει η χώρα σε μια κρίση.
body:
  en: |
    The hard-drachma policy of the late 1990s was built for this one purpose. Inflation
    had been running at about 20 per cent in the early 1990s and had to reach roughly
    2 per cent; the budget deficit, the debt path and long-term interest rates all had
    to be brought within the treaty limits. Yannos Papantoniou, minister of national
    economy and finance from 1994 to 2001, conducted the negotiation, and the Council
    decided in 2000 that Greece had met the criteria and would join at the start of the
    following year. Cash followed on 1 January 2002.

    In 2004 Eurostat revised the Greek deficit figures for 1997 to 2003 sharply upwards
    and established that the deficit had exceeded 3 per cent of GDP in the qualifying
    years. The Commission concluded that the original data had been misreported. What
    that means for the decision of 2000 is still argued about: the revisions did not
    trigger any procedure to reverse entry, and the euro has no exit mechanism, but the
    episode is the single most damaging fact in the Greek case for having been admitted
    on the merits.

    The decade that followed made borrowing cheap. Greek governments, banks and
    households paid something close to German rates on money they could not have raised
    on those terms in drachmas, and both the Olympic build-out and the rise in private
    and public debt were financed on that basis. When the crisis came in 2009 the
    adjustment had to be made inside the currency, through cuts in wages and pensions,
    because the exchange rate no longer existed as an instrument. Greece stayed in the
    euro throughout. No member has ever left it.
  el: |
    Η πολιτική της «σκληρής δραχμής» στα τέλη της δεκαετίας του 1990 είχε έναν και μόνο
    σκοπό. Ο πληθωρισμός, γύρω στο 20% στις αρχές εκείνης της δεκαετίας, έπρεπε να πέσει
    περίπου στο 2%, ενώ το έλλειμμα, η πορεία του χρέους και τα μακροπρόθεσμα επιτόκια
    έπρεπε να μπουν στα όρια της Συνθήκης. Ο Γιάννος Παπαντωνίου, υπουργός Εθνικής
    Οικονομίας και Οικονομικών από το 1994 ως το 2001, διεξήγαγε τη διαπραγμάτευση, και
    το Συμβούλιο αποφάσισε το 2000 ότι η Ελλάδα πληρούσε τα κριτήρια και θα ενταχθεί από
    την αρχή του επόμενου έτους. Τα μετρητά κυκλοφόρησαν την 1η Ιανουαρίου 2002.

    Το 2004 η Eurostat αναθεώρησε απότομα προς τα πάνω τα ελληνικά δημοσιονομικά
    στοιχεία της περιόδου 1997 ως 2003 και διαπίστωσε ότι το έλλειμμα είχε ξεπεράσει το
    3% του ΑΕΠ στα κρίσιμα έτη. Η Επιτροπή έκρινε ότι τα αρχικά στοιχεία είχαν δηλωθεί
    εσφαλμένα. Το τι σημαίνει αυτό για την απόφαση του 2000 παραμένει αντικείμενο
    διαφωνίας: καμία διαδικασία ανάκλησης της ένταξης δεν κινήθηκε, το ευρώ δεν προβλέπει
    έξοδο, αλλά το επεισόδιο είναι το πιο επιβαρυντικό στοιχείο για το επιχείρημα ότι η
    Ελλάδα έγινε δεκτή με βάση τα μεγέθη της.

    Η δεκαετία που ακολούθησε έκανε τον δανεισμό φθηνό. Κυβερνήσεις, τράπεζες και
    νοικοκυριά πλήρωναν επιτόκια κοντά στα γερμανικά για χρήματα που σε δραχμές δεν θα
    μπορούσαν να είχαν βρει με τέτοιους όρους, και πάνω σε αυτή τη βάση χρηματοδοτήθηκαν
    τόσο το ολυμπιακό πρόγραμμα όσο και η ταχεία άνοδος του ιδιωτικού και του δημόσιου
    χρέους. Όταν ήρθε η κρίση του 2009, η προσαρμογή έπρεπε να γίνει μέσα στο νόμισμα, με
    περικοπές μισθών και συντάξεων, επειδή η συναλλαγματική ισοτιμία δεν υπήρχε πια ως
    εργαλείο. Η Ελλάδα έμεινε στο ευρώ σε όλη τη διάρκεια της κρίσης. Κανένα μέλος δεν
    έχει φύγει ποτέ από αυτό.
