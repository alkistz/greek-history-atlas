id: incident-at-petrich
title:
  en: The Incident at Petrich
  el: Το επεισόδιο του Πετριτσίου
summary:
  en: >
    A sentry shot dead at the Demir Kapou pass on 19 October 1925 led Pangalos to send two
    army corps into Bulgaria without declaring war. Greek troops held a strip of territory
    around Petrich for a week. Bulgaria appealed to the League of Nations, the Council
    ordered a ceasefire and withdrawal, and Greece complied by midnight on 29 October. The
    League then found Greece in breach of the Covenant and ordered it to pay compensation.
  el: >
    Ο θάνατος ενός Έλληνα σκοπού στο στενό του Ντεμίρ Καπού στις 19 Οκτωβρίου 1925 οδήγησε
    τον Πάγκαλο να στείλει δύο σώματα στρατού στη Βουλγαρία χωρίς κήρυξη πολέμου. Ελληνικά
    τμήματα κράτησαν επί μία εβδομάδα μια λωρίδα εδάφους γύρω από το Πετρίτσι. Η Βουλγαρία
    προσέφυγε στην Κοινωνία των Εθνών, το Συμβούλιο διέταξε κατάπαυση του πυρός και
    αποχώρηση, και η Ελλάδα συμμορφώθηκε ως τα μεσάνυχτα της 29ης Οκτωβρίου. Ακολούθησε
    καταδίκη για παραβίαση του Συμφώνου και επιβολή αποζημίωσης.
body:
  en: |
    On 19 October 1925 a Greek sentry was shot dead at the Demir Kapou pass on the Belasitsa
    range. The Greek account was that he had crossed the line chasing a stray dog, which is
    why the affair is remembered as the War of the Stray Dog; the Bulgarian account was that
    Bulgarian troops had been fired on first. A Greek captain named Vassiliadis, sent forward
    under a white flag, was killed as well. Athens issued a 48-hour ultimatum demanding an
    apology, the punishment of those responsible and two million French francs for the
    victims' families.

    On 22 October Pangalos ordered the III and IV Army Corps across the frontier. They
    occupied a strip of Bulgarian territory and halted short of Petrich itself. Bulgaria did
    not resist in strength but invoked Articles 10 and 11 of the Covenant. Aristide Briand,
    president of the League Council, summoned it to Paris on 26 October; the Council ordered
    both sides to stand down and Greece to withdraw, and the evacuation was complete by
    midnight on 29 October. Casualty figures are contested between the two sides: Bulgarian
    accounts give roughly fifty Bulgarian dead, most of them civilians, and claim about 121
    Greek dead.

    A commission of enquiry left Geneva on 7 November and reported by 4 December that Greece
    had violated the Covenant. Greece was ordered to compensate Bulgaria. English-language
    sources usually give the sum as £45,000 sterling; Bulgarian sources give 30 million leva,
    ten million for damage to the state and twenty million for private losses. The episode
    became the standard example of the League enforcing a frontier successfully, and is
    regularly set against its failures over Manchuria in 1931 and Abyssinia in 1935. In
    Athens the humiliation was one of the things that made Pangalos removable ten months
    later.
  el: |
    Στις 19 Οκτωβρίου 1925 ένας Έλληνας σκοπός σκοτώθηκε στο στενό του Ντεμίρ Καπού, στον
    ορεινό όγκο του Μπέλες. Κατά την ελληνική εκδοχή είχε περάσει τη γραμμή κυνηγώντας ένα
    αδέσποτο σκυλί, εξ ου και το όνομα «πόλεμος του αδέσποτου σκύλου»· κατά τη βουλγαρική,
    βουλγαρικά τμήματα είχαν δεχθεί πρώτα πυρά. Σκοτώθηκε επίσης ο λοχαγός Βασιλειάδης, που
    στάλθηκε μπροστά με λευκή σημαία. Η Αθήνα επέδωσε τελεσίγραφο 48 ωρών ζητώντας συγγνώμη,
    τιμωρία των υπευθύνων και δύο εκατομμύρια γαλλικά φράγκα για τις οικογένειες των
    θυμάτων.

    Στις 22 Οκτωβρίου ο Πάγκαλος διέταξε το Γ΄ και το Δ΄ Σώμα Στρατού να περάσουν τα σύνορα.
    Κατέλαβαν μια ζώνη βουλγαρικού εδάφους και σταμάτησαν λίγο πριν από το ίδιο το Πετρίτσι.
    Η Βουλγαρία δεν αντιστάθηκε με δυνάμεις αλλά επικαλέστηκε τα άρθρα 10 και 11 του
    Συμφώνου. Ο Αριστίντ Μπριάν, πρόεδρος του Συμβουλίου της Κοινωνίας των Εθνών, το συγκάλεσε
    στο Παρίσι στις 26 Οκτωβρίου· το Συμβούλιο διέταξε παύση των εχθροπραξιών και ελληνική
    αποχώρηση, που ολοκληρώθηκε ως τα μεσάνυχτα της 29ης Οκτωβρίου. Οι απώλειες αμφισβητούνται
    από τις δύο πλευρές: βουλγαρικές πηγές δίνουν περίπου πενήντα Βούλγαρους νεκρούς, κυρίως
    αμάχους, και υποστηρίζουν ότι οι Έλληνες νεκροί ήταν περίπου 121.

    Εξεταστική επιτροπή αναχώρησε από τη Γενεύη στις 7 Νοεμβρίου και ως τις 4 Δεκεμβρίου
    αποφάνθηκε ότι η Ελλάδα είχε παραβιάσει το Σύμφωνο. Της επιβλήθηκε αποζημίωση προς τη
    Βουλγαρία. Οι αγγλόφωνες πηγές δίνουν συνήθως το ποσό των 45.000 λιρών· οι βουλγαρικές
    μιλούν για 30 εκατομμύρια λέβα, δέκα για τις ζημιές του κράτους και είκοσι για τις
    ιδιωτικές. Το επεισόδιο έγινε το σχολικό παράδειγμα επιτυχούς επιβολής συνόρων από την
    Κοινωνία των Εθνών και αντιπαραβάλλεται τακτικά με την αποτυχία της στη Μαντζουρία το 1931
    και στην Αβησσυνία το 1935. Στην Αθήνα η ταπείνωση ήταν ένας από τους λόγους που
    κατέστησαν τον Πάγκαλο ευάλωτο δέκα μήνες αργότερα.
