id: greece-enters-the-first-balkan-war
title:
  en: Greece enters the First Balkan War
  el: Η είσοδος της Ελλάδας στον Α΄ Βαλκανικό Πόλεμο
summary:
  en: >
    Greece declared war on the Ottoman Empire on 5/18 October 1912, a day after Bulgaria
    and Serbia and three weeks after Montenegro, as the fourth member of a Balkan League
    that Venizelos had assembled treaty by treaty. It put about 125,000 men into Macedonia
    under Crown Prince Constantine and some 10,000 into Epirus, but its decisive
    contribution was the navy: only Greece could close the Aegean and stop the Porte moving
    its Asian troops to Europe by sea. Within six weeks the army had taken Thessaloniki and
    the fleet the north-eastern islands. The war roughly doubled the size of the Greek
    state.
  el: >
    Η Ελλάδα κήρυξε τον πόλεμο στην Οθωμανική Αυτοκρατορία στις 5/18 Οκτωβρίου 1912, μία
    μέρα μετά τη Βουλγαρία και τη Σερβία και τρεις εβδομάδες μετά το Μαυροβούνιο, ως τέταρτο
    μέλος ενός Βαλκανικού Συνασπισμού που ο Βενιζέλος είχε συναρμολογήσει συνθήκη τη
    συνθήκη. Παρέταξε περίπου 125.000 άνδρες στη Μακεδονία υπό τον διάδοχο Κωνσταντίνο και
    περίπου 10.000 στην Ήπειρο, αλλά η καθοριστική της συνεισφορά ήταν ο στόλος: μόνο η
    Ελλάδα μπορούσε να κλείσει το Αιγαίο και να εμποδίσει την Πύλη να μεταφέρει διά
    θαλάσσης τα στρατεύματά της από τη Μικρά Ασία στην Ευρώπη. Μέσα σε έξι εβδομάδες ο
    στρατός είχε πάρει τη Θεσσαλονίκη και ο στόλος τα βορειοανατολικά νησιά. Ο πόλεμος
    περίπου διπλασίασε το ελληνικό κράτος.
body:
  en: |
    The Balkan League was built in pieces through 1912: Serbia with Bulgaria in March,
    Serbia with Montenegro on 7 March, Bulgaria with Greece at Sofia on 16/29 May, and a
    Greco-Bulgarian military convention at Sofia on 22 September/5 October which Captain
    Ioannis Metaxas signed for Greece. The alliances fixed what each army would do and
    deliberately left unsaid who would get Macedonia. Montenegro declared war on 25
    September/8 October, Bulgaria and Serbia on 4/17 October, Greece on 5/18 October. The
    allies together put about 690,000 men into the field.

    The Army of Thessaly crossed the frontier at Elassona and forced the pass of
    Sarantaporo on 9 and 10 October Old Style, 22 and 23 October New Style: roughly 100,000
    Greeks against 35,000 to 40,000 Ottomans of VIII Corps under Hasan Tahsin Pasha, for
    182 Greek dead and about 1,000 wounded against 500 Ottoman dead, 1,000 wounded and 701
    prisoners. Servia fell the next day and Kozani the day after, opening the road north.
    The decisive engagement before Thessaloniki was fought at Giannitsa on 19 and 20
    October Old Style, five Greek divisions against 25,000 Ottomans with 36 guns.

    At sea the fleet took Lemnos on 8/21 October and made Moudros Bay its forward base,
    then Imbros and Thasos, Samothrace, Psara, Ikaria, Lesvos from 8/21 November and Chios
    from 11/24 November, whose garrison held out until late December. Each island taken
    while the Ottoman fleet was shut in the Dardanelles was an island Greece would hold at
    the peace conference. Greece refused to sign the armistice of 20 November/3 December so
    as to keep the siege of Ioannina going; fighting resumed everywhere on 21 January/3
    February 1913 after the Young Turk coup in Constantinople, and the war ended with the
    Treaty of London on 17/30 May 1913.
  el: |
    Ο Βαλκανικός Συνασπισμός χτίστηκε κατά κομμάτια μέσα στο 1912: Σερβία και Βουλγαρία τον
    Μάρτιο, Σερβία και Μαυροβούνιο στις 7 Μαρτίου, Βουλγαρία και Ελλάδα στη Σόφια στις 16/29
    Μαΐου, και ελληνοβουλγαρική στρατιωτική σύμβαση στη Σόφια στις 22 Σεπτεμβρίου/5
    Οκτωβρίου, την οποία υπέγραψε για λογαριασμό της Ελλάδας ο λοχαγός Ιωάννης Μεταξάς. Οι
    συμφωνίες όριζαν τι θα έκανε ο κάθε στρατός και άφηναν σκόπιμα αδιευκρίνιστο ποιος θα
    έπαιρνε τη Μακεδονία. Το Μαυροβούνιο κήρυξε τον πόλεμο στις 25 Σεπτεμβρίου/8 Οκτωβρίου, η
    Βουλγαρία και η Σερβία στις 4/17 Οκτωβρίου, η Ελλάδα στις 5/18 Οκτωβρίου. Οι σύμμαχοι
    παρέταξαν συνολικά περίπου 690.000 άνδρες.

    Η Στρατιά Θεσσαλίας πέρασε τα σύνορα στην Ελασσόνα και διέσπασε τα στενά του
    Σαρανταπόρου στις 9 και 10 Οκτωβρίου με το παλαιό ημερολόγιο, 22 και 23 Οκτωβρίου με το
    νέο: περίπου 100.000 Έλληνες απέναντι σε 35.000 ως 40.000 Οθωμανούς του Η΄ Σώματος υπό
    τον Χασάν Ταχσίν πασά, με 182 Έλληνες νεκρούς και περίπου 1.000 τραυματίες έναντι 500
    Οθωμανών νεκρών, 1.000 τραυματιών και 701 αιχμαλώτων. Τα Σέρβια έπεσαν την επομένη και
    η Κοζάνη τη μεθεπομένη, ανοίγοντας τον δρόμο προς τον βορρά. Η κρίσιμη μάχη πριν από τη
    Θεσσαλονίκη δόθηκε στα Γιαννιτσά στις 19 και 20 Οκτωβρίου με το παλαιό ημερολόγιο, με
    πέντε ελληνικές μεραρχίες απέναντι σε 25.000 Οθωμανούς με 36 πυροβόλα.

    Στη θάλασσα ο στόλος πήρε τη Λήμνο στις 8/21 Οκτωβρίου και έκανε τον όρμο του Μούδρου
    προκεχωρημένη βάση του, έπειτα την Ίμβρο και τη Θάσο, τη Σαμοθράκη, τα Ψαρά, την
    Ικαρία, τη Λέσβο από τις 8/21 Νοεμβρίου και τη Χίο από τις 11/24 Νοεμβρίου, όπου η
    οθωμανική φρουρά άντεξε ως τα τέλη Δεκεμβρίου. Κάθε νησί που καταλαμβανόταν όσο ο
    οθωμανικός στόλος ήταν κλεισμένος στα Δαρδανέλλια ήταν ένα νησί που η Ελλάδα θα κρατούσε
    στο συνέδριο της ειρήνης. Η Ελλάδα αρνήθηκε να υπογράψει την ανακωχή της 20ής
    Νοεμβρίου/3ης Δεκεμβρίου για να συνεχίσει την πολιορκία των Ιωαννίνων. Οι εχθροπραξίες
    ξανάρχισαν παντού στις 21 Ιανουαρίου/3 Φεβρουαρίου 1913, μετά το νεοτουρκικό πραξικόπημα
    στην Κωνσταντινούπολη, και ο πόλεμος έληξε με τη Συνθήκη του Λονδίνου στις 17/30 Μαΐου
    1913.
