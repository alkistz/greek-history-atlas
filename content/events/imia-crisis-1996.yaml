id: imia-crisis-1996
title:
  en: The Imia Crisis
  el: Η κρίση των Ιμίων
summary:
  en: >
    Two uninhabited rocks east of Kalymnos brought Greece and Turkey to the edge of war
    in the last days of January 1996. A Turkish cargo ship had run aground on the
    eastern islet a month earlier and its captain refused Greek help on the ground that
    he was in Turkish waters; Ankara then claimed the islets. Flags were raised and
    taken down by mayors and journalists, special forces of both countries landed on one
    rock each, and both navies deployed around them. Three Greek naval officers were
    killed when their helicopter crashed on 31 January. American mediation produced a
    withdrawal to the status quo ante the same day: no troops, no flags, no ships and no
    agreed sovereignty.
  el: >
    Δύο ακατοίκητες βραχονησίδες ανατολικά της Καλύμνου έφεραν την Ελλάδα και την
    Τουρκία στα πρόθυρα πολέμου τις τελευταίες μέρες του Ιανουαρίου του 1996. Ένα
    τουρκικό φορτηγό πλοίο είχε προσαράξει στην ανατολική νησίδα έναν μήνα νωρίτερα και
    ο καπετάνιος του αρνήθηκε ελληνική βοήθεια ισχυριζόμενος ότι βρισκόταν σε τουρκικά
    χωρικά ύδατα. Η Άγκυρα διεκδίκησε στη συνέχεια τις νησίδες. Σημαίες υψώθηκαν και
    κατέβηκαν από δημάρχους και δημοσιογράφους, ειδικές δυνάμεις των δύο χωρών
    αποβιβάστηκαν από μία σε κάθε βραχονησίδα και οι δύο στόλοι αναπτύχθηκαν γύρω τους.
    Τρεις Έλληνες αξιωματικοί του Πολεμικού Ναυτικού σκοτώθηκαν όταν έπεσε το ελικόπτερό
    τους στις 31 Ιανουαρίου. Η αμερικανική μεσολάβηση επέβαλε την ίδια μέρα επιστροφή στο
    προηγούμενο καθεστώς: κανένας στρατός, καμία σημαία, κανένα πλοίο και καμία
    συμφωνημένη κυριαρχία.
body:
  en: |
    The dispute began on 26 December 1995, when the Figen Akat went aground on the
    eastern islet. Ankara notified Athens of a sovereignty claim on 27 December and
    asserted on 29 December that the rocks were Turkish. Greece rejected the claim on
    9 January 1996, resting its title on the Treaty of Lausanne of 1923, the
    Italo-Turkish convention and protocol of 1932 which had assigned the islets to
    Italian-held Dodecanese, and the Treaty of Paris of 1947 by which Italy ceded the
    Dodecanese to Greece. Neither foreign ministry wanted a crisis. The press and local
    politics produced one anyway.

    After the story broke in Athens on 20 January, the mayor of Kalymnos and a group of
    local people raised a Greek flag on the eastern rock. On 28 January journalists from
    the Turkish paper Hürriyet landed by helicopter, took it down and raised a Turkish
    one, which a Greek navy patrol then replaced. Greek special forces went ashore on
    the eastern islet on the night of 28 January and Turkish special forces on the
    western one on 31 January, a few hundred metres apart. In the early hours of that
    day an Agusta-Bell 212 from the frigate Navarinon crashed near the rocks, killing
    Lieutenant Commander Christodoulos Karathanasis, Lieutenant Panagiotis Vlachakos and
    Petty Officer Ektoras Gialopsos. They were the only deaths of the crisis. Richard
    Holbrooke worked the telephones through the night and President Clinton called both
    capitals; by morning both sides had pulled back.

    Nothing was settled. Turkey has since argued a doctrine of grey zones in the Aegean,
    holding that the sovereignty of certain small islands and islets was never expressly
    assigned by treaty; Greece rejects the concept outright and regards the question as
    closed by the instruments of 1923, 1932 and 1947. What did change was Greek
    strategy. Costas Simitis had taken office on 22 January 1996, so the crisis fell in
    his first fortnight as prime minister, and he built his foreign policy afterwards on
    binding the dispute into European institutions, a course that led to the Helsinki
    European Council of December 1999 tying Turkey's candidacy to the settlement of its
    border disputes. Greece went on to delimit its exclusive economic zone with Italy on
    8 June 2020 and, in part, with Egypt on 6 August 2020. The line with Turkey remains
    undrawn.
  el: |
    Η διαφορά ξεκίνησε στις 26 Δεκεμβρίου 1995, όταν το Figen Akat προσάραξε στην
    ανατολική νησίδα. Η Άγκυρα γνωστοποίησε στην Αθήνα αξίωση κυριαρχίας στις
    27 Δεκεμβρίου και στις 29 Δεκεμβρίου υποστήριξε ότι οι βραχονησίδες είναι τουρκικές.
    Η Ελλάδα απέρριψε την αξίωση στις 9 Ιανουαρίου 1996, θεμελιώνοντας τον τίτλο της στη
    Συνθήκη της Λωζάνης του 1923, στην ιταλοτουρκική σύμβαση και στο πρωτόκολλο του
    1932 που απέδιδαν τις νησίδες στα ιταλοκρατούμενα Δωδεκάνησα, και στη Συνθήκη των
    Παρισίων του 1947 με την οποία η Ιταλία παραχώρησε τα Δωδεκάνησα στην Ελλάδα. Καμία
    από τις δύο διπλωματίες δεν ήθελε κρίση. Ο Τύπος και η τοπική πολιτική την έφεραν
    έτσι κι αλλιώς.

    Αφού η είδηση έσκασε στην Αθήνα στις 20 Ιανουαρίου, ο δήμαρχος Καλύμνου με ομάδα
    κατοίκων ύψωσε ελληνική σημαία στην ανατολική βραχονησίδα. Στις 28 Ιανουαρίου
    δημοσιογράφοι της τουρκικής Hürriyet αποβιβάστηκαν με ελικόπτερο, την κατέβασαν και
    ύψωσαν τουρκική, την οποία πλήρωμα ελληνικού περιπολικού αποκατέστησε. Έλληνες
    καταδρομείς αποβιβάστηκαν στην ανατολική νησίδα τη νύχτα της 28ης Ιανουαρίου και
    Τούρκοι στη δυτική στις 31 Ιανουαρίου, λίγες εκατοντάδες μέτρα μακριά. Τα ξημερώματα
    εκείνης της μέρας ένα Agusta-Bell 212 από τη φρεγάτα Ναβαρίνον έπεσε κοντά στα Ίμια
    και σκοτώθηκαν ο πλωτάρχης Χριστόδουλος Καραθανάσης, ο υποπλοίαρχος Παναγιώτης
    Βλαχάκος και ο αρχικελευστής Έκτορας Γιαλοψός. Ήταν οι μόνοι νεκροί της κρίσης. Ο
    Ρίτσαρντ Χόλμπρουκ δούλευε στα τηλέφωνα όλη τη νύχτα και ο πρόεδρος Κλίντον τηλεφώνησε
    και στις δύο πρωτεύουσες. Ως το πρωί και οι δύο πλευρές είχαν αποσυρθεί.

    Τίποτα δεν λύθηκε. Η Τουρκία υποστηρίζει έκτοτε τη θεωρία των «γκρίζων ζωνών» στο
    Αιγαίο, ότι δηλαδή η κυριαρχία ορισμένων μικρών νησιών και νησίδων δεν αποδόθηκε ποτέ
    ρητά με συνθήκη. Η Ελλάδα απορρίπτει συνολικά την έννοια και θεωρεί το ζήτημα κλειστό
    από τα κείμενα του 1923, του 1932 και του 1947. Αυτό που άλλαξε ήταν η ελληνική
    στρατηγική. Ο Κώστας Σημίτης είχε αναλάβει στις 22 Ιανουαρίου 1996, οπότε η κρίση
    έπεσε στο πρώτο δεκαπενθήμερο της πρωθυπουργίας του, και στήριξε έκτοτε την εξωτερική
    του πολιτική στην ένταξη της διαφοράς στους ευρωπαϊκούς θεσμούς, δρόμος που οδήγησε στο
    Ευρωπαϊκό Συμβούλιο του Ελσίνκι τον Δεκέμβριο του 1999, το οποίο συνέδεσε την
    υποψηφιότητα της Τουρκίας με τη διευθέτηση των συνοριακών της διαφορών. Η Ελλάδα
    οριοθέτησε στη συνέχεια την αποκλειστική οικονομική ζώνη της με την Ιταλία στις
    8 Ιουνίου 2020 και εν μέρει με την Αίγυπτο στις 6 Αυγούστου 2020. Η γραμμή με την
    Τουρκία παραμένει αχάρακτη.
