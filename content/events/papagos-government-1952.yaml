id: papagos-government-1952
title:
  en: The 1952 Election and the Papagos Government
  el: Οι εκλογές του 1952 και η κυβέρνηση Παπάγου
summary:
  en: >
    The victor of the Civil War left the army in May 1951, founded the Greek Rally and took
    power through the ballot box. The electoral law was changed to a majoritarian system for
    the vote of 16 November 1952 at American urging, to produce a stable single-party
    government. The Greek Rally won 49.2 per cent and 247 of 300 seats; the United Democratic
    Left polled 9.55 per cent and won no seats at all. Papagos was sworn in on 19 November and
    governed until his death in October 1955, devaluing the drachma by half in 1953 and
    launching the reconstruction programme that his public works minister, Konstantinos
    Karamanlis, would inherit.
  el: >
    Ο νικητής του Εμφυλίου παραιτήθηκε από τον στρατό τον Μάιο του 1951, ίδρυσε τον Ελληνικό
    Συναγερμό και πήρε την εξουσία από την κάλπη. Ο εκλογικός νόμος άλλαξε σε πλειοψηφικό για
    την ψηφοφορία της 16ης Νοεμβρίου 1952, με αμερικανική παρότρυνση, ώστε να προκύψει σταθερή
    μονοκομματική κυβέρνηση. Ο Ελληνικός Συναγερμός έλαβε 49,2% και 247 από τις 300 έδρες· η
    Ενιαία Δημοκρατική Αριστερά συγκέντρωσε 9,55% και δεν εξέλεξε κανέναν βουλευτή. Ο Παπάγος
    ορκίστηκε στις 19 Νοεμβρίου και κυβέρνησε ως τον θάνατό του τον Οκτώβριο του 1955,
    υποτιμώντας τη δραχμή κατά το ήμισυ το 1953 και ξεκινώντας το πρόγραμμα ανασυγκρότησης που
    θα κληρονομούσε ο υπουργός Δημοσίων Έργων του, Κωνσταντίνος Καραμανλής.
body:
  en: |
    Papagos resigned his commission in May 1951 and founded the Greek Rally, a party built on his
    wartime authority rather than on the pre-war party structures. It won 36.5 per cent at the
    election of September 1951 without a majority. The system was then changed: a majoritarian law
    was adopted for the vote of 16 November 1952, pressed by the Americans, who wanted an end to
    the rotating coalitions of the preceding years.

    It worked as designed. On a turnout of 75.4 per cent from 2,123,150 registered voters the Greek
    Rally took 49.2 per cent, 783,541 votes, and 247 seats. The EPEK and Liberal alliance took 34.2
    per cent and 51 seats. The United Democratic Left, the legal vehicle of a Left whose party was
    banned, polled 9.55 per cent and returned no deputy at all. That result, roughly one voter in
    ten with no representation, fixed the distorting effect of Greek electoral engineering in the
    country's political memory and was cited against every subsequent change of the law.

    Papagos was sworn in on 19 November 1952. In April 1953 his finance minister Spyros Markezinis
    devalued the drachma by 50 per cent, a shock that is credited with opening the long post-war
    growth cycle and that cost wage earners immediately. Karamanlis at public works drove roads,
    ports, electrification and housing on American money, and per-capita income and industrial
    output rose sharply through the decade. In foreign policy the government made the decision that
    shaped the rest of the era: after Britain refused to discuss the status of Cyprus bilaterally,
    Athens resolved to internationalise the question, and appealed to the United Nations in August
    1954.
  el: |
    Ο Παπάγος παραιτήθηκε από τον στρατό τον Μάιο του 1951 και ίδρυσε τον Ελληνικό Συναγερμό, κόμμα
    χτισμένο στο πολεμικό του κύρος και όχι στους προπολεμικούς κομματικούς μηχανισμούς. Στις
    εκλογές του Σεπτεμβρίου 1951 πήρε 36,5% χωρίς πλειοψηφία. Τότε άλλαξε το σύστημα: για την
    ψηφοφορία της 16ης Νοεμβρίου 1952 υιοθετήθηκε πλειοψηφικός νόμος, με πίεση των Αμερικανών, που
    ήθελαν να τελειώσουν οι εναλλασσόμενοι συνασπισμοί των προηγούμενων ετών.

    Λειτούργησε όπως σχεδιάστηκε. Με συμμετοχή 75,4% επί 2.123.150 εγγεγραμμένων, ο Ελληνικός
    Συναγερμός έλαβε 49,2%, δηλαδή 783.541 ψήφους, και 247 έδρες. Η συμμαχία ΕΠΕΚ και Φιλελευθέρων
    πήρε 34,2% και 51 έδρες. Η ΕΔΑ, το νόμιμο όχημα μιας Αριστεράς της οποίας το κόμμα ήταν
    απαγορευμένο, συγκέντρωσε 9,55% και δεν εξέλεξε ούτε έναν βουλευτή. Το αποτέλεσμα αυτό, περίπου
    ένας στους δέκα ψηφοφόρους χωρίς εκπροσώπηση, εγκατέστησε στην ελληνική πολιτική μνήμη τη
    στρέβλωση των εκλογικών μηχανισμών και επιστρατεύτηκε ως επιχείρημα σε κάθε επόμενη αλλαγή του
    νόμου.

    Ο Παπάγος ορκίστηκε στις 19 Νοεμβρίου 1952. Τον Απρίλιο του 1953 ο υπουργός Οικονομικών Σπύρος
    Μαρκεζίνης υποτίμησε τη δραχμή κατά 50%, ένα σοκ στο οποίο αποδίδεται το άνοιγμα του μακρού
    μεταπολεμικού κύκλου ανάπτυξης και που κόστισε αμέσως στους μισθωτούς. Ο Καραμανλής από τα
    Δημόσια Έργα προώθησε δρόμους, λιμάνια, εξηλεκτρισμό και στέγαση με αμερικανικά κεφάλαια, και
    το κατά κεφαλήν εισόδημα και η βιομηχανική παραγωγή ανέβηκαν απότομα μέσα στη δεκαετία. Στην
    εξωτερική πολιτική η κυβέρνηση πήρε την απόφαση που καθόρισε την υπόλοιπη εποχή: αφού η
    Βρετανία αρνήθηκε να συζητήσει διμερώς το καθεστώς της Κύπρου, η Αθήνα αποφάσισε να
    διεθνοποιήσει το ζήτημα και προσέφυγε στον ΟΗΕ τον Αύγουστο του 1954.
