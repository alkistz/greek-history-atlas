id: peea-free-greece
title:
  en: "PEEA and Free Greece: the Mountain Government"
  el: "Η ΠΕΕΑ και η Ελεύθερη Ελλάδα: η Κυβέρνηση του Βουνού"
summary:
  en: >
    On 10 March 1944 EAM set up the Political Committee of National Liberation at Viniani
    in Evrytania, a provisional administration for the mountain districts its army already
    governed. PEEA held secret elections across occupied and liberated Greece in late
    April in which between 1.5 and 1.8 million people voted and, for the first time in
    Greek history, women voted. The National Council they elected met at Koryschades from
    14 to 27 May 1944. The existence of a second Greek government provoked a mutiny in the
    Greek forces in Egypt, hardened Churchill against EAM, and forced the negotiations at
    Lebanon that followed within weeks.
  el: >
    Στις 10 Μαρτίου 1944 το ΕΑΜ συγκρότησε στη Βίνιανη Ευρυτανίας την Πολιτική Επιτροπή
    Εθνικής Απελευθέρωσης, προσωρινή διοίκηση για τις ορεινές επαρχίες που ήδη κυβερνούσε ο
    στρατός του. Η ΠΕΕΑ διενήργησε στα τέλη Απριλίου μυστικές εκλογές σε κατεχόμενη και
    ελεύθερη Ελλάδα, στις οποίες ψήφισαν 1,5 ως 1,8 εκατομμύρια άνθρωποι και, για πρώτη
    φορά στην ελληνική ιστορία, ψήφισαν γυναίκες. Το Εθνικό Συμβούλιο που προέκυψε
    συνεδρίασε στις Κορυσχάδες από τις 14 ως τις 27 Μαΐου 1944. Η ύπαρξη δεύτερης ελληνικής
    κυβέρνησης προκάλεσε το κίνημα στις ελληνικές δυνάμεις της Αιγύπτου, σκλήρυνε τον
    Τσόρτσιλ απέναντι στο ΕΑΜ και επέβαλε μέσα σε λίγες εβδομάδες τις διαπραγματεύσεις του
    Λιβάνου.
body:
  en: |
    By the spring of 1944 EAM administered more Greek territory than anyone else, and
    PEEA gave that administration a name and a constitutional claim. Its first president
    was Evripidis Bakirtzis from 10 March to 18 April 1944, succeeded by Alexandros
    Svolos, a professor of constitutional law whose presence was meant to signal that the
    committee was not simply the Communist Party under another letterhead. PEEA did not
    describe itself as a government and did not claim to replace the Cairo administration,
    but it legislated, judged, taxed and conscripted across the territory ELAS held.

    The elections of late April 1944 were its most striking act. They were held under
    occupation, by a movement without international recognition, and returned a National
    Council of 180 members which sat at Koryschades in Evrytania in the last two weeks of
    May. Women both voted and stood, twenty-three years before any Greek state election
    admitted them on equal terms; supporters of PEEA have pointed to the turnout ever
    since as evidence of its legitimacy, and its opponents to the absence of secret
    ballots and of any opposition to vote for.

    The effect abroad was the opposite of what EAM intended. Greek servicemen in Egypt
    mutinied in April 1944 demanding a government based on PEEA. British troops crushed
    the mutiny, several thousand Greek sailors and soldiers were interned, and Churchill's
    government concluded that EAM had to be brought inside a national government or
    defeated. Georgios Papandreou became prime minister on 26 April and summoned every
    Greek political force to Lebanon three weeks later.
  el: |
    Την άνοιξη του 1944 το ΕΑΜ διοικούσε περισσότερο ελληνικό έδαφος από οποιονδήποτε
    άλλον, και η ΠΕΕΑ έδωσε σε αυτή τη διοίκηση όνομα και συνταγματικό ισχυρισμό. Πρώτος
    πρόεδρός της ήταν ο Ευριπίδης Μπακιρτζής, από τις 10 Μαρτίου ως τις 18 Απριλίου 1944,
    και τον διαδέχθηκε ο Αλέξανδρος Σβώλος, καθηγητής του συνταγματικού δικαίου, του οποίου
    η παρουσία ήταν σήμα ότι η επιτροπή δεν ήταν απλώς το ΚΚΕ με άλλη επωνυμία. Η ΠΕΕΑ δεν
    αυτοανακηρύχθηκε κυβέρνηση και δεν διεκδίκησε τη θέση του Καΐρου, νομοθετούσε όμως,
    δίκαζε, φορολογούσε και στρατολογούσε σε όλη την επικράτεια που κρατούσε ο ΕΛΑΣ.

    Οι εκλογές των τελών Απριλίου 1944 ήταν η πιο εντυπωσιακή της πράξη. Έγιναν υπό
    κατοχή, από κίνημα χωρίς διεθνή αναγνώριση, και ανέδειξαν Εθνικό Συμβούλιο 180 μελών
    που συνεδρίασε στις Κορυσχάδες Ευρυτανίας το τελευταίο δεκαπενθήμερο του Μαΐου. Οι
    γυναίκες ψήφισαν και εξελέγησαν, είκοσι τρία χρόνια πριν τις δεχθεί με ίσους όρους
    οποιαδήποτε κρατική εκλογική αναμέτρηση. Οι υποστηρικτές της ΠΕΕΑ επικαλούνται έκτοτε
    τη συμμετοχή ως απόδειξη της νομιμοποίησής της, οι αντίπαλοί της την απουσία μυστικής
    ψηφοφορίας και οποιασδήποτε αντιπολίτευσης να ψηφιστεί.

    Στο εξωτερικό το αποτέλεσμα ήταν το αντίθετο από αυτό που επιδίωκε το ΕΑΜ. Έλληνες
    στρατιωτικοί στην Αίγυπτο στασίασαν τον Απρίλιο του 1944 ζητώντας κυβέρνηση με βάση την
    ΠΕΕΑ. Βρετανικά στρατεύματα κατέστειλαν το κίνημα, αρκετές χιλιάδες Έλληνες ναύτες και
    στρατιώτες κλείστηκαν σε στρατόπεδα, και η κυβέρνηση Τσόρτσιλ κατέληξε ότι το ΕΑΜ
    έπρεπε είτε να μπει σε κυβέρνηση εθνικής ενότητας είτε να ηττηθεί. Ο Γεώργιος
    Παπανδρέου ανέλαβε πρωθυπουργός στις 26 Απριλίου και κάλεσε τρεις εβδομάδες αργότερα
    όλες τις ελληνικές πολιτικές δυνάμεις στον Λίβανο.
