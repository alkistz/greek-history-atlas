id: eam-founded
title:
  en: The founding of EAM
  el: Η ίδρυση του ΕΑΜ
summary:
  en: >
    Four left-wing parties founded the National Liberation Front in Athens on 27 September
    1941. The Communist Party supplied the organisation and the cadres, but EAM was built
    as a broad front and recruited far beyond the party, becoming on any estimate the
    largest mass movement in modern Greek history. Its army, ELAS, took the field in June
    1942 and by 1944 held most of mountainous Greece. Its rise created the central
    political problem of the occupation: an armed, communist-led movement governed the
    countryside while the recognised government of Greece sat in Cairo.
  el: >
    Τέσσερα κόμματα της Αριστεράς ίδρυσαν στην Αθήνα, στις 27 Σεπτεμβρίου 1941, το Εθνικό
    Απελευθερωτικό Μέτωπο. Το ΚΚΕ έδωσε την οργάνωση και τα στελέχη, αλλά το ΕΑΜ
    συγκροτήθηκε ως πλατύ μέτωπο και στρατολόγησε πολύ πέρα από το κόμμα, γινόμενο, με κάθε
    εκτίμηση, το μεγαλύτερο μαζικό κίνημα της νεότερης ελληνικής ιστορίας. Ο στρατός του, ο
    ΕΛΑΣ, βγήκε στα βουνά τον Ιούνιο του 1942 και ως το 1944 κρατούσε το μεγαλύτερο μέρος
    της ορεινής Ελλάδας. Η άνοδός του δημιούργησε το κεντρικό πολιτικό πρόβλημα της
    Κατοχής: ένα ένοπλο κίνημα με κομμουνιστική ηγεσία κυβερνούσε την ύπαιθρο, ενώ η
    αναγνωρισμένη ελληνική κυβέρνηση βρισκόταν στο Κάιρο.
body:
  en: |
    The founding parties were the Communist Party of Greece, represented by Lefteris
    Apostolou, the Socialist Party under Christos Chomenidis, the Union of Popular
    Democracy under Ilias Tsirimokos and the Agrarian Party under Apostolos Vogiatzis.
    The declared aims were national liberation and, after liberation, free elections for
    a constituent assembly. The military wing was decided on 16 February 1942 and took the
    field on 7 June 1942, when Aris Velouchiotis raised the first band in the mountains
    of Roumeli. ELAS was run by a triumvirate at every level: the kapetanios Velouchiotis,
    the military commander Stefanos Sarafis from May 1943, and the political commissar
    Andreas Tzimas.

    EAM was more than an army. It built a parallel civil society with EPON for the young,
    National Solidarity for relief, EAAM for workers, and people's courts and elected
    self-government in the mountain districts, which in much of the country was the only
    administration that functioned at all. Estimates of its size vary by a factor of four:
    Anthony Eden put its membership at 500,000 to 750,000, EAM itself claimed up to two
    million, and most scholars settle near 1.5 million across all its organisations. ELAS
    fielded about 50,000 armed andartes by 1944 on British estimates and up to 85,000 on
    its own.

    It did not have the field to itself. EDES was founded in the same month by Napoleon
    Zervas and operated mainly in Epirus; EKKA under Colonel Dimitrios Psarros held ground
    in Phocis and Parnassida. But by 1943 neither was a rival on the same scale, and the
    gap between EAM's real power and its recognised political weight ran directly to the
    Lebanon and Caserta agreements, the Dekemvriana and the civil war.
  el: |
    Ιδρυτικά κόμματα ήταν το ΚΚΕ, με εκπρόσωπο τον Λευτέρη Αποστόλου, το Σοσιαλιστικό
    Κόμμα Ελλάδας του Χρήστου Χωμενίδη, η Ένωση Λαϊκής Δημοκρατίας του Ηλία Τσιριμώκου και
    το Αγροτικό Κόμμα Ελλάδας του Αποστόλου Βογιατζή. Διακηρυγμένοι σκοποί ήταν η εθνική
    απελευθέρωση και, μετά από αυτήν, ελεύθερες εκλογές για συντακτική συνέλευση. Ο ένοπλος
    βραχίονας αποφασίστηκε στις 16 Φεβρουαρίου 1942 και βγήκε στο βουνό στις 7 Ιουνίου
    1942, όταν ο Άρης Βελουχιώτης συγκρότησε την πρώτη ομάδα στη Ρούμελη. Ο ΕΛΑΣ
    διοικούνταν παντού από τριανδρία: ο καπετάνιος Βελουχιώτης, ο στρατιωτικός διοικητής
    Στέφανος Σαράφης από τον Μάιο του 1943 και ο πολιτικός επίτροπος Ανδρέας Τζήμας.

    Το ΕΑΜ δεν ήταν μόνο στρατός. Έχτισε παράλληλη κοινωνία με την ΕΠΟΝ για τους νέους,
    την Εθνική Αλληλεγγύη για την περίθαλψη, το ΕΕΑΜ για τους εργαζόμενους, λαϊκά
    δικαστήρια και αιρετή αυτοδιοίκηση στις ορεινές επαρχίες, που σε μεγάλο μέρος της χώρας
    ήταν η μόνη διοίκηση που λειτουργούσε. Οι εκτιμήσεις για το μέγεθός του διαφέρουν
    τετραπλάσια: ο Άντονι Ίντεν το υπολόγιζε σε 500.000 ως 750.000 μέλη, το ίδιο το ΕΑΜ
    μιλούσε για δύο εκατομμύρια, οι περισσότεροι ιστορικοί καταλήγουν γύρω στο 1,5
    εκατομμύριο σε όλες τις οργανώσεις του. Ο ΕΛΑΣ είχε ως το 1944 περίπου 50.000 ένοπλους
    αντάρτες κατά τις βρετανικές εκτιμήσεις και ως 85.000 κατά τις δικές του.

    Δεν ήταν μόνος στο πεδίο. Τον ίδιο μήνα ιδρύθηκε ο ΕΔΕΣ από τον Ναπολέοντα Ζέρβα, με
    δράση κυρίως στην Ήπειρο, και η ΕΚΚΑ του συνταγματάρχη Δημητρίου Ψαρρού κρατούσε τη
    Φωκίδα και την Παρνασσίδα. Ως το 1943 όμως κανένας τους δεν ήταν αντίπαλος του ίδιου
    μεγέθους, και η απόσταση ανάμεσα στην πραγματική ισχύ του ΕΑΜ και στο αναγνωρισμένο
    πολιτικό του βάρος οδήγησε ευθεία γραμμή στον Λίβανο και στην Καζέρτα, στα Δεκεμβριανά
    και στον Εμφύλιο.
