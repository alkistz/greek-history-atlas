id: turkish-invasion-of-cyprus-1974
title:
  en: The Turkish Invasion of Cyprus
  el: Η τουρκική εισβολή στην Κύπρο (Αττίλας Ι και ΙΙ)
summary:
  en: >
    Turkish forces landed west of Kyrenia at dawn on 20 July 1974, five days after the
    coup against Makarios, and dropped airborne troops into the Turkish Cypriot enclave
    north of Nicosia. A ceasefire on 22 July left Turkey holding a bridgehead of about
    three per cent of the island. When the second round of talks in Geneva collapsed on
    14 August the Turkish army advanced again, and by the ceasefire of 16 August it held
    36.2 per cent of the Republic of Cyprus, including Famagusta and the Mesaoria plain.
    Between 150,000 and 200,000 Greek Cypriots were displaced from the north and some
    50,000 Turkish Cypriots moved to it. The line drawn that August is still there.
  el: >
    Τα τουρκικά στρατεύματα αποβιβάστηκαν δυτικά της Κερύνειας την αυγή της 20ής Ιουλίου
    1974, πέντε μέρες μετά το πραξικόπημα κατά του Μακαρίου, και ρίχτηκαν αλεξιπτωτιστές
    στον τουρκοκυπριακό θύλακα βόρεια της Λευκωσίας. Η εκεχειρία της 22ας Ιουλίου άφησε
    στην Τουρκία προγεφύρωμα περίπου τρία τοις εκατό του νησιού. Όταν ο δεύτερος γύρος
    των συνομιλιών της Γενεύης ναυάγησε στις 14 Αυγούστου, ο τουρκικός στρατός προχώρησε
    ξανά και με την εκεχειρία της 16ης Αυγούστου κατείχε το 36,2% της Κυπριακής
    Δημοκρατίας, μαζί με την Αμμόχωστο και τη Μεσαορία. Από 150.000 ως 200.000
    Ελληνοκύπριοι εκτοπίστηκαν από τον βορρά και περίπου 50.000 Τουρκοκύπριοι
    μετακινήθηκαν προς τα εκεί. Η γραμμή που χαράχτηκε εκείνον τον Αύγουστο υπάρχει ακόμη.
body:
  en: |
    The landing at Pentemili, the beach five miles west of Kyrenia, began Operation
    Atilla on the order of the Turkish Prime Minister Bülent Ecevit. The first phase ran
    for three days and secured the Kyrenia bridgehead and a corridor south to the
    Turkish Cypriot quarter of Nicosia. Greece could not answer it. The Ioannidis regime
    ordered a general mobilisation that produced chaos rather than an army, and on
    23 July it handed power to the politicians. Two rounds of talks followed at Geneva
    between the three guarantor powers. The first produced the declaration of 30 July,
    which confirmed the ceasefire and set a security zone. The second broke down in the
    early hours of 14 August when Greece and the Greek Cypriots refused a Turkish demand
    for immediate cantonal partition, and the second phase began that day.

    In forty-eight hours the Turkish army took the line from Morphou through Nicosia to
    Famagusta. Casualty figures are given in ranges and by interested parties. Turkish
    sources report 568 killed in action, 498 of them Turkish soldiers and 70 Turkish
    Cypriot fighters, with total Turkish military and civilian losses estimated at
    between 1,500 and 3,500. Greek and Cypriot losses are estimated at 4,500 to 6,000
    casualties, including 309 dead of the Cypriot National Guard and 105 of the Greek
    forces. Nine peacekeepers of the United Nations force were killed. The United
    Nations Committee on Missing Persons still carries about 1,600 unresolved cases from
    1963 to 1974, between 1,000 and 1,100 of them Greek Cypriots.

    The consequences were structural and are still in force. Greece withdrew from the
    integrated military command of NATO on 14 August 1974 in protest at the alliance's
    failure to restrain Turkey, and returned to it only in October 1980. Most Turkish
    Cypriots who moved north did so after an agreement reached in Vienna in 1975 which
    regulated the movement of the two populations and in practice completed their
    separation. The occupied area declared itself the Turkish Federated State of Cyprus
    in February 1975 and the Turkish Republic of Northern Cyprus on 15 November 1983;
    Security Council Resolution 541 declared the second declaration legally invalid, and
    no state except Turkey recognises it. The whole island joined the European Union on
    1 May 2004, with the acquis suspended in the north, a week after the Annan Plan was
    approved by 64.9 per cent of Turkish Cypriot voters and rejected by 75.8 per cent of
    Greek Cypriot voters.

    The names given to the operation are part of the dispute. Turkey calls it a peace
    operation conducted by a guarantor power under the Treaty of Guarantee. Greece, the
    Republic of Cyprus and the United Nations General Assembly call it an invasion and
    the military presence that followed an occupation; the European Court of Human
    Rights held in Cyprus v. Turkey on 10 May 2001 that Turkey bears responsibility
    under the Convention for the displaced and the missing. No Security Council
    resolution has ever recognised the division of the island.
  el: |
    Η απόβαση στο Πεντεμίλι, στην ακτή πέντε μίλια δυτικά της Κερύνειας, ξεκίνησε την
    επιχείρηση Αττίλας με εντολή του Τούρκου πρωθυπουργού Μπουλέντ Ετζεβίτ. Η πρώτη
    φάση κράτησε τρεις μέρες και εξασφάλισε το προγεφύρωμα της Κερύνειας και διάδρομο
    προς τον τουρκοκυπριακό τομέα της Λευκωσίας. Η Ελλάδα δεν μπόρεσε να απαντήσει. Το
    καθεστώς Ιωαννίδη διέταξε γενική επιστράτευση που παρήγαγε χάος αντί για στρατό και
    στις 23 Ιουλίου παρέδωσε την εξουσία στους πολιτικούς. Ακολούθησαν δύο γύροι
    συνομιλιών στη Γενεύη ανάμεσα στις τρεις εγγυήτριες δυνάμεις. Ο πρώτος έβγαλε τη
    διακήρυξη της 30ής Ιουλίου, που επιβεβαίωνε την εκεχειρία και όριζε ζώνη ασφαλείας.
    Ο δεύτερος ναυάγησε τα ξημερώματα της 14ης Αυγούστου, όταν η Ελλάδα και οι
    Ελληνοκύπριοι απέρριψαν τουρκική απαίτηση για άμεση καντονική διχοτόμηση, και την
    ίδια μέρα άρχισε η δεύτερη φάση.

    Μέσα σε σαράντα οκτώ ώρες ο τουρκικός στρατός κατέλαβε τη γραμμή Μόρφου, Λευκωσίας,
    Αμμοχώστου. Οι απώλειες δίνονται σε εύρη και από ενδιαφερόμενες πλευρές. Τουρκικές
    πηγές αναφέρουν 568 νεκρούς στη μάχη, 498 Τούρκους στρατιώτες και 70 Τουρκοκύπριους
    μαχητές, με συνολικές τουρκικές στρατιωτικές και άμαχες απώλειες που υπολογίζονται
    από 1.500 ως 3.500. Οι ελληνικές και κυπριακές απώλειες υπολογίζονται σε 4.500 ως
    6.000, μαζί με 309 νεκρούς της Εθνικής Φρουράς και 105 του ελληνικού στρατού. Εννέα
    κυανόκρανοι του ΟΗΕ σκοτώθηκαν. Η Διερευνητική Επιτροπή Αγνοουμένων του ΟΗΕ διατηρεί
    ακόμη περίπου 1.600 ανοιχτές υποθέσεις της περιόδου 1963 ως 1974, από τις οποίες
    1.000 ως 1.100 αφορούν Ελληνοκύπριους.

    Οι συνέπειες ήταν δομικές και ισχύουν ακόμη. Η Ελλάδα αποχώρησε από το στρατιωτικό
    σκέλος του ΝΑΤΟ στις 14 Αυγούστου 1974, σε ένδειξη διαμαρτυρίας για την αδυναμία της
    συμμαχίας να συγκρατήσει την Τουρκία, και επέστρεψε μόλις τον Οκτώβριο του 1980. Οι
    περισσότεροι Τουρκοκύπριοι μετακινήθηκαν βόρεια μετά από συμφωνία που επιτεύχθηκε
    στη Βιέννη το 1975, η οποία ρύθμιζε τη μετακίνηση των δύο πληθυσμών και στην πράξη
    ολοκλήρωσε τον διαχωρισμό τους. Η κατεχόμενη περιοχή αυτοανακηρύχθηκε Τουρκικό
    Ομόσπονδο Κράτος Κύπρου τον Φεβρουάριο του 1975 και «Τουρκική Δημοκρατία της Βόρειας
    Κύπρου» στις 15 Νοεμβρίου 1983. Το ψήφισμα 541 του Συμβουλίου Ασφαλείας κήρυξε τη
    δεύτερη ανακήρυξη νομικά άκυρη και κανένα κράτος εκτός της Τουρκίας δεν την
    αναγνωρίζει. Ολόκληρο το νησί εντάχθηκε στην Ευρωπαϊκή Ένωση την 1η Μαΐου 2004, με
    το κοινοτικό κεκτημένο σε αναστολή στον βορρά, μία εβδομάδα αφότου το σχέδιο Ανάν
    εγκρίθηκε από το 64,9% των Τουρκοκυπρίων και απορρίφθηκε από το 75,8% των
    Ελληνοκυπρίων.

    Τα ονόματα που δίνονται στην επιχείρηση είναι μέρος της διαφοράς. Η Τουρκία τη
    χαρακτηρίζει ειρηνευτική επιχείρηση εγγυήτριας δύναμης βάσει της Συνθήκης Εγγυήσεως.
    Η Ελλάδα, η Κυπριακή Δημοκρατία και η Γενική Συνέλευση του ΟΗΕ τη χαρακτηρίζουν
    εισβολή και τη στρατιωτική παρουσία που ακολούθησε κατοχή. Το Ευρωπαϊκό Δικαστήριο
    Δικαιωμάτων του Ανθρώπου έκρινε στην υπόθεση Κύπρος κατά Τουρκίας, στις 10 Μαΐου
    2001, ότι η Τουρκία φέρει ευθύνη κατά τη Σύμβαση για τους εκτοπισμένους και τους
    αγνοουμένους. Κανένα ψήφισμα του Συμβουλίου Ασφαλείας δεν αναγνώρισε ποτέ τη
    διχοτόμηση του νησιού.
