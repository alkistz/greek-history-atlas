id: provisional-democratic-government
title:
  en: The Provisional Democratic Government and the Banning of the KKE
  el: Η Προσωρινή Δημοκρατική Κυβέρνηση και η απαγόρευση του ΚΚΕ
summary:
  en: >
    On the night of 23 December 1947 the KKE announced over the Democratic Army's radio the
    formation of a Provisional Democratic Government, with Markos Vafeiadis as prime minister
    and war minister. Its seat was the Grammos massif on the Albanian frontier, and its
    attempt to take Konitsa as a capital failed at heavy cost. No state recognised it,
    including the Soviet Union. Athens answered on 27 December with Law 509/1947, which
    outlawed the KKE and EAM and made membership a criminal offence punishable by long
    imprisonment or death; the party stayed illegal until 1974. The proclamation turned the
    war into a contest between two claimed sovereign authorities on Greek soil.
  el: >
    Τη νύχτα της 23ης Δεκεμβρίου 1947 το ΚΚΕ ανακοίνωσε από τον ραδιοσταθμό του Δημοκρατικού
    Στρατού τη συγκρότηση Προσωρινής Δημοκρατικής Κυβέρνησης, με πρωθυπουργό και υπουργό
    Στρατιωτικών τον Μάρκο Βαφειάδη. Έδρα της ήταν ο ορεινός όγκος του Γράμμου στα αλβανικά
    σύνορα, και η προσπάθειά της να καταλάβει την Κόνιτσα ως πρωτεύουσα απέτυχε με βαριές
    απώλειες. Κανένα κράτος δεν την αναγνώρισε, ούτε η Σοβιετική Ένωση. Η Αθήνα απάντησε στις
    27 Δεκεμβρίου με τον Αναγκαστικό Νόμο 509/1947, που έθεσε εκτός νόμου το ΚΚΕ και το ΕΑΜ
    και κατέστησε τη συμμετοχή σε αυτά ποινικό αδίκημα με ποινή μακρόχρονης κάθειρξης ή
    θανάτου· το κόμμα παρέμεινε παράνομο ως το 1974. Η προκήρυξη μετέτρεψε τον πόλεμο σε
    αναμέτρηση δύο κυριαρχιών που διεκδικούσαν το ίδιο έδαφος.
body:
  en: |
    The proclamation is dated 24 December 1947. Markos Vafeiadis, who had commanded the
    Democratic Army since October 1946, was named chairman and war minister. Petros Rousos
    took justice, Vasilis Bartziotas supply, and Petros Kokkalis, a professor of surgery at
    the University of Athens, went to the mountains as health minister, a defection the
    Athens government felt as a propaganda blow.

    A government needs a capital. From 25 December 1947 to 4 January 1948 the Democratic
    Army attacked Konitsa in Epirus intending to install itself there, and failed at heavy
    cost against a town the National Army supplied by air. Recognition never came either.
    Stalin held that recognising the mountain government would widen the conflict and should
    follow rather than lead recognition by others, and no state ever extended it. The
    Provisional Democratic Government remained an authority over rural districts and never
    held a town of any size.

    Athens replied three days after the proclamation with Law 509 of 27 December 1947, which
    banned the KKE, EAM and National Solidarity and made membership or support a crime. It
    was the legal frame of the post-war Greek state. Alongside it ran the island camps: from
    1947 suspected leftists were deported for detention and what the state called
    re-education, above all to Makronisos. Official figures give some 40,000 detainees between
    mid-1947 and early 1950; prisoners' organisations put more than 100,000 through the camp
    across its life, which ran as a military compound from 1947 to 1957 and as a facility
    until 1961. Whether Makronisos was a rehabilitation programme or a torture camp is one of
    the sharpest unresolved arguments in Greek public memory, and the testimony of those who
    passed through it sits on one side of it.

    The Democratic Army reached a peak of roughly 50,000 fighters, a large proportion of them
    women, drawn heavily from the northern mountains and including Slav Macedonian units
    organised as NOF. It could take villages and hold ranges; it could not take Salonica or
    Ioannina. Declaring a state it could not seat anywhere hardened the conflict politically
    at the moment its military position was about to narrow.
  el: |
    Η προκήρυξη φέρει ημερομηνία 24 Δεκεμβρίου 1947. Ο Μάρκος Βαφειάδης, που διοικούσε τον
    Δημοκρατικό Στρατό από τον Οκτώβριο του 1946, ορίστηκε πρόεδρος και υπουργός
    Στρατιωτικών. Ο Πέτρος Ρούσος πήρε τη Δικαιοσύνη, ο Βασίλης Μπαρτζιώτας τον Εφοδιασμό, και
    ο Πέτρος Κόκκαλης, καθηγητής Χειρουργικής στο Πανεπιστήμιο Αθηνών, ανέβηκε στο βουνό ως
    υπουργός Υγείας, μια αποσκίρτηση που η Αθήνα εισέπραξε ως πλήγμα γοήτρου.

    Μια κυβέρνηση χρειάζεται πρωτεύουσα. Από τις 25 Δεκεμβρίου 1947 έως τις 4 Ιανουαρίου 1948
    ο Δημοκρατικός Στρατός επιτέθηκε στην Κόνιτσα της Ηπείρου με σκοπό να εγκατασταθεί εκεί,
    και απέτυχε με βαριές απώλειες μπροστά σε μια πόλη που ο Εθνικός Στρατός ανεφοδίαζε
    αεροπορικώς. Ούτε η αναγνώριση ήρθε ποτέ. Ο Στάλιν θεωρούσε ότι η αναγνώριση της
    κυβέρνησης του βουνού θα διεύρυνε τη σύγκρουση και όφειλε να ακολουθήσει, όχι να
    προηγηθεί, της αναγνώρισης από άλλους. Η Προσωρινή Δημοκρατική Κυβέρνηση παρέμεινε αρχή
    πάνω σε αγροτικές περιοχές και δεν κράτησε ποτέ πόλη κάποιου μεγέθους.

    Η Αθήνα απάντησε τρεις μέρες μετά την προκήρυξη με τον Νόμο 509 της 27ης Δεκεμβρίου 1947,
    που απαγόρευσε το ΚΚΕ, το ΕΑΜ και την Εθνική Αλληλεγγύη και ποινικοποίησε τη συμμετοχή ή
    την υποστήριξη. Ήταν το νομικό πλαίσιο του μεταπολεμικού ελληνικού κράτους. Δίπλα του
    λειτούργησαν τα νησιά: από το 1947 ύποπτοι αριστεροί εκτοπίζονταν για κράτηση και για
    αυτό που το κράτος ονόμαζε αναμόρφωση, κυρίως στη Μακρόνησο. Τα επίσημα στοιχεία δίνουν
    περίπου 40.000 κρατουμένους από τα μέσα του 1947 ως τις αρχές του 1950, ενώ οργανώσεις
    κρατουμένων υποστηρίζουν ότι πάνω από 100.000 άνθρωποι πέρασαν από το στρατόπεδο σε όλη
    του τη διάρκεια, ως στρατιωτικό συγκρότημα από το 1947 ως το 1957 και ως εγκατάσταση ως
    το 1961. Το αν η Μακρόνησος ήταν πρόγραμμα αναμόρφωσης ή τόπος βασανιστηρίων παραμένει
    μία από τις οξύτερες ανοιχτές διαμάχες της ελληνικής δημόσιας μνήμης, και οι μαρτυρίες
    όσων πέρασαν από εκεί στέκονται στη μία πλευρά της.

    Ο Δημοκρατικός Στρατός έφτασε σε μέγιστη δύναμη περίπου 50.000 μαχητών, σε μεγάλο ποσοστό
    γυναικών, με βάση κυρίως τα βόρεια βουνά και με σλαβομακεδονικά τμήματα οργανωμένα στο
    ΝΟΦ. Μπορούσε να παίρνει χωριά και να κρατά οροσειρές· δεν μπορούσε να πάρει τη
    Θεσσαλονίκη ή τα Ιωάννινα. Η ανακήρυξη ενός κράτους που δεν μπορούσε να εγκατασταθεί
    πουθενά σκλήρυνε πολιτικά τη σύγκρουση τη στιγμή ακριβώς που η στρατιωτική της θέση
    επρόκειτο να στενέψει.
