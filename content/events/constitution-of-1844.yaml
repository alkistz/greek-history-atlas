id: constitution-of-1844
title:
  en: The Constitution of 1844
  el: Το Σύνταγμα του 1844
summary:
  en: >
    The first constitution of the Kingdom of Greece, written by the National Assembly
    that the revolution of 3 September 1843 forced Otto to call, and dated 18 March 1844
    Old Style, 30 March New Style. It was framed as a pact between the king and the
    nation and modelled on the French charter of 1830: an elected Chamber of at least 80
    deputies, a Senate of 27 named by the king for life, and ministers answerable for
    the king's acts but appointed and dismissed by him. An electoral law of the same
    day gave the vote to men over twenty-five on terms counted as the first manhood
    suffrage in Europe. It stood until Otto's fall in 1862.
  el: >
    Το πρώτο σύνταγμα του Βασιλείου της Ελλάδος, έργο της Εθνοσυνέλευσης που η
    επανάσταση της 3ης Σεπτεμβρίου 1843 ανάγκασε τον Όθωνα να συγκαλέσει, με ημερομηνία
    18 Μαρτίου 1844 με το παλαιό ημερολόγιο, 30 Μαρτίου με το νέο. Διατυπώθηκε ως
    συμβόλαιο ανάμεσα στον βασιλιά και το έθνος, με πρότυπο τον γαλλικό χάρτη του 1830:
    αιρετή Βουλή τουλάχιστον 80 βουλευτών, Γερουσία 27 μελών διορισμένων ισόβια από τον
    βασιλιά, και υπουργοί υπεύθυνοι για τις πράξεις του βασιλιά αλλά διοριζόμενοι και
    παυόμενοι από αυτόν. Εκλογικός νόμος της ίδιας ημέρας έδωσε ψήφο στους άνδρες άνω
    των είκοσι πέντε ετών με όρους που τον κατατάσσουν ως τον πρώτο νόμο ανδρικής
    καθολικής ψηφοφορίας στην Ευρώπη. Ίσχυσε ως την πτώση του Όθωνα το 1862.
body:
  en: |
    The National Assembly met in Athens on 8 November 1843 Old Style, 20 November New,
    two months after the garrison had surrounded the palace, and sat until 18 March
    1844. Its leading figures were the men who had led the revolution of 1821 and now
    led the three parties named after the Powers: Alexandros Mavrokordatos of the
    English party, Ioannis Kolettis of the French and Andreas Metaxas of the Russian.
    Its bitterest quarrel was not over the crown but over who counted as a Greek, the
    debate in which Kolettis gave the Great Idea its name.

    The text made Greece a constitutional monarchy under a king declared sacred,
    unaccountable and inviolable. Legislative power was shared between the king, an
    elected Chamber of no fewer than 80 deputies serving three-year terms, and a Senate
    of 27 members appointed by the king for life, a number he could raise but never
    above half the size of the Chamber. Ministers were responsible for the king's acts,
    but he appointed and removed them; justice was administered in his name by judges
    he appointed. The text brought back political and personal rights from the
    constitutions of the revolution and added new ones, among them the secrecy of
    letters.

    The electoral law passed on the same day gave the vote to men over twenty-five, and
    it is usually described as the first law in Europe to provide, in essence, for
    manhood suffrage. Elections held between June and August 1844 returned 127 deputies.
    Metaxas's followers formed the largest bloc; Kolettis's party came third but formed
    a government in coalition with them, and Kolettis became prime minister in August.
    Some accounts date the promulgation to February 1844; the manuscript held by the
    Library of the Hellenic Parliament is dated Athens, 18 March 1844.

    What the constitution left untouched was the king's free hand in choosing ministers,
    whatever the Chamber thought of them. Otto used it for eighteen years, and it took
    his deposition, the Constitution of 1864 and the declared-confidence principle of
    1875 to take that freedom from the crown.
  el: |
    Η Εθνοσυνέλευση συνήλθε στην Αθήνα στις 8 Νοεμβρίου 1843 με το παλαιό ημερολόγιο, 20
    Νοεμβρίου με το νέο, δύο μήνες αφότου η φρουρά είχε περικυκλώσει τα ανάκτορα, και
    συνεδρίασε ως τις 18 Μαρτίου 1844. Πρωταγωνιστές της ήταν οι άνδρες που είχαν ηγηθεί
    της Επανάστασης του 1821 και τώρα ηγούνταν των τριών κομμάτων που έφεραν τα ονόματα
    των Δυνάμεων: ο Αλέξανδρος Μαυροκορδάτος του αγγλικού, ο Ιωάννης Κωλέττης του
    γαλλικού και ο Ανδρέας Μεταξάς του ρωσικού. Η σκληρότερη διαμάχη της δεν αφορούσε το
    στέμμα αλλά το ποιος λογαριάζεται Έλληνας, τη συζήτηση στην οποία ο Κωλέττης έδωσε
    στη Μεγάλη Ιδέα το όνομά της.

    Το κείμενο έκανε την Ελλάδα συνταγματική μοναρχία με βασιλιά ιερό, ανεύθυνο και
    απαραβίαστο. Τη νομοθετική εξουσία μοιράζονταν ο βασιλιάς, αιρετή Βουλή τουλάχιστον
    80 βουλευτών με τριετή θητεία, και Γερουσία 27 μελών διορισμένων από τον βασιλιά
    ισόβια, αριθμός που μπορούσε να αυξήσει αλλά ποτέ πάνω από το μισό της Βουλής. Οι
    υπουργοί ήταν υπεύθυνοι για τις πράξεις του βασιλιά, αλλά αυτός τους διόριζε και
    τους έπαυε. Η δικαιοσύνη απονεμόταν στο όνομά του από δικαστές που διόριζε ο ίδιος.
    Το κείμενο επανέφερε πολιτικά και ατομικά δικαιώματα από τα συντάγματα της
    Επανάστασης και πρόσθεσε νέα, ανάμεσά τους το απόρρητο των επιστολών.

    Ο εκλογικός νόμος που ψηφίστηκε την ίδια ημέρα έδινε ψήφο στους άνδρες άνω των είκοσι
    πέντε ετών, και συνήθως περιγράφεται ως ο πρώτος νόμος στην Ευρώπη που καθιέρωνε
    ουσιαστικά την ανδρική καθολική ψηφοφορία. Οι εκλογές που έγιναν από τον Ιούνιο ως
    τον Αύγουστο του 1844 ανέδειξαν 127 βουλευτές. Οι οπαδοί του Μεταξά αποτέλεσαν τη
    μεγαλύτερη ομάδα. Το κόμμα του Κωλέττη ήρθε τρίτο, αλλά σχημάτισε κυβέρνηση σε
    συνεργασία μαζί τους, και ο Κωλέττης έγινε πρωθυπουργός τον Αύγουστο. Ορισμένες
    πηγές τοποθετούν τη δημοσίευση τον Φεβρουάριο του 1844. Το χειρόγραφο που φυλάσσεται
    στη Βιβλιοθήκη της Βουλής των Ελλήνων φέρει ημερομηνία Αθήνα, 18 Μαρτίου 1844.

    Εκείνο που το σύνταγμα άφησε ανέγγιχτο ήταν η ελευθερία του βασιλιά να επιλέγει
    υπουργούς, ό,τι κι αν πίστευε γι' αυτούς η Βουλή. Ο Όθων τη χρησιμοποίησε επί
    δεκαοκτώ χρόνια, και χρειάστηκαν η έξωσή του, το Σύνταγμα του 1864 και η αρχή της
    δεδηλωμένης του 1875 για να αφαιρεθεί αυτή η ελευθερία από το στέμμα.
