id: drama-uprising
title:
  en: The Drama uprising and the Bulgarian reprisals
  el: Η εξέγερση της Δράμας και τα βουλγαρικά αντίποινα
summary:
  en: >
    Local communist cadres rose against the Bulgarian occupation authorities in the Drama
    district on the night of 28 September 1941. The rising was badly armed and was put
    down within about forty-eight hours, and the Bulgarian reprisals that followed were
    deliberately exemplary: 485 men were executed at Doxato and Choristi on 29 September
    and between 360 and 500 were shot in Drama itself. Death tolls for the district as a
    whole are contested and range from Bulgarian military figures of up to 1,600 to Greek
    accounts of several thousand. The killings drove Greeks out of the Bulgarian zone in
    large numbers and hardened KKE doctrine against premature risings for the next three
    years.
  el: >
    Τοπικά στελέχη του ΚΚΕ ξεσηκώθηκαν εναντίον των βουλγαρικών αρχών κατοχής στην περιοχή
    της Δράμας τη νύχτα της 28ης Σεπτεμβρίου 1941. Η εξέγερση ήταν κακά οπλισμένη και
    κατεστάλη μέσα σε περίπου σαράντα οκτώ ώρες, και τα βουλγαρικά αντίποινα που
    ακολούθησαν ήταν σκόπιμα παραδειγματικά: στο Δοξάτο και στη Χωριστή εκτελέστηκαν 485
    άνδρες στις 29 Σεπτεμβρίου, ενώ στη Δράμα τουφεκίστηκαν από 360 ως 500 άνθρωποι. Ο
    συνολικός αριθμός των νεκρών της περιοχής αμφισβητείται και κυμαίνεται από τους 1.600
    των βουλγαρικών στρατιωτικών αναφορών ως τις χιλιάδες των ελληνικών μαρτυριών. Οι
    σφαγές προκάλεσαν μαζική έξοδο Ελλήνων από τη βουλγαρική ζώνη και σκλήρυναν για τρία
    χρόνια τη γραμμή του ΚΚΕ εναντίον των πρόωρων εξεγέρσεων.
body:
  en: |
    The rising was set for eleven at night on 28 September 1941 in the part of eastern
    Macedonia that Bulgaria had annexed four months earlier. It broke out first at
    Doxato, where villagers attacked the police station and killed six or seven Bulgarian
    policemen, and spread to municipal offices, police stations and army posts at Drama,
    Choristi, Kyrgia, Prosotsani and Nikiforos. Coordination failed almost at once and
    the rising was over in two days.

    The Bulgarian response was directed by Colonel Mihailov, Major Pecev and the police
    commander Stefan Magelanski, and was meant to be remembered. The documented killings
    are the 485 executed at Doxato and Choristi on 29 September and the 360 to 500 shot
    in Drama, many of them in the streets and against the wall of the tobacco warehouses.
    Beyond these, the figures diverge sharply. Bulgarian military reports claimed up to
    1,600 Greeks killed in the rising and the weeks that followed; Greek accounts speak of
    thousands across the district, and a figure of 3,000 and above circulates in Greek
    public memory without documentary support. The reprisals reached villages of the
    Serres and Kavala districts, with mass shootings, burnings and the deportation of men
    to labour.

    Two consequences outlasted the event. The first was demographic: Greeks left the
    Bulgarian zone for central Macedonia in numbers that swelled the refugee population of
    Thessaloniki on the eve of the famine winter. The second was doctrinal. Drama was the
    earliest large armed action against the occupation anywhere in Greece, and its cost
    was used inside EAM for the next three years as the argument for building strength in
    the mountains rather than provoking reprisals in the towns.
  el: |
    Η εξέγερση ορίστηκε για τις έντεκα το βράδυ της 28ης Σεπτεμβρίου 1941, στο τμήμα της
    ανατολικής Μακεδονίας που η Βουλγαρία είχε προσαρτήσει τέσσερις μήνες νωρίτερα. Ξέσπασε
    πρώτα στο Δοξάτο, όπου οι χωρικοί επιτέθηκαν στο αστυνομικό τμήμα και σκότωσαν έξι ή
    επτά Βούλγαρους αστυνομικούς, και απλώθηκε σε δημαρχεία, αστυνομικά τμήματα και
    στρατιωτικά φυλάκια στη Δράμα, τη Χωριστή, τα Κύργια, το Προσοτσάνι και τον Νικηφόρο. Ο
    συντονισμός κατέρρευσε σχεδόν αμέσως και η εξέγερση τελείωσε σε δύο μέρες.

    Την καταστολή διηύθυναν ο συνταγματάρχης Μιχαήλοφ, ο ταγματάρχης Πέτσεφ και ο
    αστυνομικός διοικητής Στέφαν Μαγκελάνσκι, και σχεδιάστηκε για να μείνει στη μνήμη. Οι
    τεκμηριωμένες εκτελέσεις είναι οι 485 του Δοξάτου και της Χωριστής στις 29 Σεπτεμβρίου
    και οι 360 ως 500 της Δράμας, πολλές στους δρόμους και μπροστά στον τοίχο των
    καπναποθηκών. Πέρα από αυτές, οι αριθμοί αποκλίνουν έντονα. Οι βουλγαρικές στρατιωτικές
    αναφορές μιλούσαν για ως 1.600 Έλληνες νεκρούς στην εξέγερση και στις εβδομάδες που
    ακολούθησαν, οι ελληνικές μαρτυρίες για χιλιάδες σε όλη την περιοχή, ενώ στη δημόσια
    μνήμη κυκλοφορεί αριθμός 3.000 και άνω χωρίς τεκμηρίωση. Τα αντίποινα έφτασαν σε χωριά
    των Σερρών και της Καβάλας, με ομαδικές εκτελέσεις, εμπρησμούς και εκτοπίσεις ανδρών σε
    καταναγκαστική εργασία.

    Δύο συνέπειες έζησαν περισσότερο από το γεγονός. Η πρώτη ήταν δημογραφική: οι Έλληνες
    έφευγαν από τη βουλγαρική ζώνη προς την κεντρική Μακεδονία σε αριθμούς που φούσκωσαν
    τον προσφυγικό πληθυσμό της Θεσσαλονίκης στο κατώφλι του χειμώνα της πείνας. Η δεύτερη
    ήταν δογματική. Η Δράμα ήταν η πρώτη μεγάλη ένοπλη ενέργεια κατά της Κατοχής σε
    ολόκληρη την Ελλάδα, και το τίμημά της χρησιμοποιήθηκε στο εσωτερικό του ΕΑΜ για τρία
    χρόνια ως επιχείρημα υπέρ της συγκρότησης δύναμης στα βουνά αντί της πρόκλησης
    αντιποίνων στις πόλεις.
