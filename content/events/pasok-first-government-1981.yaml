id: pasok-first-government-1981
title:
  en: PASOK's First Government
  el: Η πρώτη κυβέρνηση του ΠΑΣΟΚ και η Αλλαγή
summary:
  en: >
    On 18 October 1981 PASOK took 48.07 per cent of the vote and 172 of the 300 seats,
    and Andreas Papandreou was sworn in as Prime Minister three days later. It was the
    first time a party of the left had formed a government on its own in Greece, and the
    first full alternation of power of the Third Republic. The single word of the
    campaign was Allagi, Change. What followed was a decade of social legislation, a
    much larger state, and the quiet abandonment of the promises to leave the European
    Community and remove the American bases.
  el: >
    Στις 18 Οκτωβρίου 1981 το ΠΑΣΟΚ πήρε 48,07% και 172 από τις 300 έδρες, και ο Ανδρέας
    Παπανδρέου ορκίστηκε πρωθυπουργός τρεις μέρες αργότερα. Ήταν η πρώτη φορά που κόμμα
    της αριστεράς σχημάτιζε μόνο του κυβέρνηση στην Ελλάδα και η πρώτη πλήρης εναλλαγή
    στην εξουσία της Τρίτης Δημοκρατίας. Η προεκλογική εκστρατεία είχε μία λέξη, την
    Αλλαγή. Ακολούθησε μια δεκαετία κοινωνικής νομοθεσίας, ένα πολύ μεγαλύτερο κράτος
    και η αθόρυβη εγκατάλειψη των υποσχέσεων για έξοδο από την Ευρωπαϊκή Κοινότητα και
    απομάκρυνση των αμερικανικών βάσεων.
body:
  en: |
    PASOK had been founded in 1974 and had taken 13.58 per cent at its first election.
    Seven years later it had 2,726,309 votes. Papandreou, a Harvard-trained economist
    who had spent the junta years abroad, offered national independence, popular
    sovereignty and social liberation, and he offered them to the part of the electorate
    that had lost the Civil War and spent thirty years outside the state. New Democracy
    took 35.88 per cent and the Communist Party 10.94. Karamanlis, by then President of
    the Republic, handed power over without incident, which was the point of the whole
    exercise.

    The legislation of the first term reached into ordinary life more than any
    government's since the war. The National Resistance of 1941 to 1944 was recognised
    by law in 1982 and civil-war refugees were allowed home. Civil marriage was
    introduced, adultery decriminalised, and the family law of 1983 abolished the dowry
    and made spouses equal. The National Health System was created by law in 1983.
    Wages were indexed automatically to inflation, the public sector hired on a large
    scale and the welfare state grew.

    It was paid for by borrowing. Public debt rose from roughly 28 per cent of GDP in
    1981 to about 80 per cent by 1990, and most accounts of the crisis that arrived
    twenty years later trace its structural origin to that decade rather than to any
    single decision afterwards. The constitutional revision of 1986 stripped the
    President of the reserve powers Karamanlis had written in, completing the shift to a
    purely parliamentary system. PASOK governed from 1981 to 1989 and again under
    Papandreou from 1993 to 1996; its rise and its collapse to single figures in 2012
    bracket the party system of the whole Metapolitefsi.
  el: |
    Το ΠΑΣΟΚ είχε ιδρυθεί το 1974 και στις πρώτες του εκλογές είχε πάρει 13,58%. Επτά
    χρόνια αργότερα είχε 2.726.309 ψήφους. Ο Παπανδρέου, οικονομολόγος με σπουδές και
    καριέρα στο Χάρβαρντ που πέρασε τα χρόνια της δικτατορίας στο εξωτερικό, πρόσφερε
    εθνική ανεξαρτησία, λαϊκή κυριαρχία και κοινωνική απελευθέρωση, και τα πρόσφερε σε
    εκείνο το κομμάτι του εκλογικού σώματος που είχε χάσει τον Εμφύλιο και είχε μείνει
    τριάντα χρόνια έξω από το κράτος. Η Νέα Δημοκρατία πήρε 35,88% και το ΚΚΕ 10,94%. Ο
    Καραμανλής, Πρόεδρος της Δημοκρατίας πλέον, παρέδωσε την εξουσία χωρίς επεισόδιο, και
    αυτό ακριβώς ήταν το ζητούμενο.

    Η νομοθεσία της πρώτης τετραετίας άγγιξε την καθημερινή ζωή περισσότερο από κάθε
    άλλης κυβέρνησης μετά τον πόλεμο. Η Εθνική Αντίσταση του 1941 ως 1944 αναγνωρίστηκε
    με νόμο το 1982 και οι πολιτικοί πρόσφυγες του Εμφυλίου απέκτησαν δικαίωμα
    επιστροφής. Θεσπίστηκε ο πολιτικός γάμος, αποποινικοποιήθηκε η μοιχεία και το
    οικογενειακό δίκαιο του 1983 κατάργησε την προίκα και εξίσωσε τους συζύγους. Το
    Εθνικό Σύστημα Υγείας ιδρύθηκε με νόμο το 1983. Οι μισθοί συνδέθηκαν αυτόματα με τον
    πληθωρισμό με την Αυτόματη Τιμαριθμική Αναπροσαρμογή, το δημόσιο προσέλαβε μαζικά και
    το κοινωνικό κράτος μεγάλωσε.

    Όλα αυτά πληρώθηκαν με δανεικά. Το δημόσιο χρέος ανέβηκε από περίπου 28% του ΑΕΠ το
    1981 σε περίπου 80% το 1990, και οι περισσότερες αναλύσεις της κρίσης που ήρθε είκοσι
    χρόνια αργότερα αναζητούν τη δομική της αφετηρία σε εκείνη τη δεκαετία και όχι σε
    κάποια μεμονωμένη μεταγενέστερη απόφαση. Η συνταγματική αναθεώρηση του 1986 αφαίρεσε
    από τον Πρόεδρο τις εφεδρικές εξουσίες που είχε γράψει ο Καραμανλής, ολοκληρώνοντας
    τη μετάβαση σε καθαρά κοινοβουλευτικό σύστημα. Το ΠΑΣΟΚ κυβέρνησε από το 1981 ως το
    1989 και ξανά με τον Παπανδρέου από το 1993 ως το 1996. Η άνοδός του και η κατάρρευσή
    του σε μονοψήφιο ποσοστό το 2012 οριοθετούν το κομματικό σύστημα ολόκληρης της
    Μεταπολίτευσης.
