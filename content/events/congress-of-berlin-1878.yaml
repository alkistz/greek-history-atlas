id: congress-of-berlin-1878
title:
  en: The Congress of Berlin
  el: Το Συνέδριο του Βερολίνου
summary:
  en: >
    The congress of the Great Powers that revised the Treaty of San Stefano sat in
    Berlin from 13 June to 13 July 1878. Greece was heard but was not a member, and it
    came away with a recommendation: Protocol 13 invited the Porte to agree a new
    frontier with Greece in Thessaly and Epirus, and Article 24 of the treaty offered
    the Powers' mediation if the two could not agree. Neither bound anybody, and the
    cession of Thessaly and Arta took three more years. Berlin also broke up San
    Stefano's Greater Bulgaria, handed Macedonia back to the Sultan and bound him to
    reform in Crete, and so set the agenda of Greek foreign policy for a generation.
  el: >
    Το συνέδριο των Μεγάλων Δυνάμεων που αναθεώρησε τη Συνθήκη του Αγίου Στεφάνου
    συνεδρίασε στο Βερολίνο από τις 13 Ιουνίου ως τις 13 Ιουλίου 1878. Η Ελλάδα
    ακούστηκε αλλά δεν ήταν μέλος, και έφυγε με μια σύσταση: το Πρωτόκολλο 13 καλούσε
    την Πύλη να συμφωνήσει με την Ελλάδα νέα μεθόριο στη Θεσσαλία και την Ήπειρο, και το
    άρθρο 24 της συνθήκης πρόσφερε τη μεσολάβηση των Δυνάμεων αν οι δύο δεν συμφωνούσαν.
    Κανένα από τα δύο δεν δέσμευε κανέναν, και η παραχώρηση της Θεσσαλίας και της Άρτας
    χρειάστηκε άλλα τρία χρόνια. Το Βερολίνο διέλυσε επίσης τη Μεγάλη Βουλγαρία του
    Αγίου Στεφάνου, επέστρεψε τη Μακεδονία στον σουλτάνο και τον δέσμευσε σε
    μεταρρυθμίσεις στην Κρήτη, και έτσι όρισε την ατζέντα της ελληνικής εξωτερικής
    πολιτικής για μια γενιά.
body:
  en: |
    The Russo-Turkish War of 1877 and 1878 ended with the Treaty of San Stefano, signed
    on 3 March 1878, which created a Bulgaria reaching from the Danube to the Aegean and
    taking in most of Macedonia. Greece had kept out of the war almost to the end, and
    the risings in Thessaly, Epirus and Macedonia early in 1878 had been put down or
    talked into a ceasefire by the time its government was ready to move. Britain and
    Austria-Hungary would not accept San Stefano, and Bismarck offered Berlin as the
    place to revise it.

    The Congress met from 13 June to 13 July under Bismarck. Greece was not a member:
    over Russian objections, a French compromise admitted it to the sessions on
    Thessaly, Epirus and Crete and to no others. Theodoros Deligiannis, who led the
    Greek delegation, and Alexandros Rizos Rangavis, the Greek minister in Berlin, put
    the case for Epirus, Thessaly and Crete on 29 June. Britain had used those claims to
    press the Sultan into the Cyprus Convention of 4 June, which gave it the island in
    return for a defensive alliance against Russia, and once it had Cyprus it cooled on
    them. It was the French foreign minister, William Waddington, who kept the question
    alive.

    What he obtained was Protocol 13, of the session of 5 July, which invited the Porte
    to agree a new frontier with Greece in Thessaly and Epirus and pointed, deliberately
    vaguely, to a line along the Pineios and the Kalamas. Article 24 of the treaty
    signed on 13 July added that if the two could not agree, the six Powers reserved the
    right to offer their mediation. Article 23 bound the Porte to apply in Crete the
    Organic Law of 1868, which became the basis of the Pact of Halepa that October. San
    Stefano's Bulgaria was cut into three: a self-governing principality, the autonomous
    Ottoman province of Eastern Rumelia, and Macedonia, returned to the Sultan.

    For Greece Berlin was a recommendation, not a cession, and the Porte treated it as
    one: Thessaly and Arta came only in 1881, on a line well short of the Kalamas. But
    the Congress fixed the terms on which the Greek question would be argued for a
    generation. Frontiers were granted by the Powers in conference rather than won in
    the field, and Macedonia, back under the Ottomans, became the prize that Greeks,
    Bulgarians and Serbs would contest next. Eastern Rumelia's union with Bulgaria in
    1885 was the first breach in the settlement, and it set off the Greek mobilisation
    that ended in the blockade of 1886.
  el: |
    Ο ρωσοτουρκικός πόλεμος του 1877 και 1878 έληξε με τη Συνθήκη του Αγίου Στεφάνου,
    που υπογράφηκε στις 3 Μαρτίου 1878 και δημιούργησε μια Βουλγαρία από τον Δούναβη ως
    το Αιγαίο, που περιλάμβανε το μεγαλύτερο μέρος της Μακεδονίας. Η Ελλάδα είχε μείνει
    έξω από τον πόλεμο σχεδόν ως το τέλος, και οι εξεγέρσεις στη Θεσσαλία, την Ήπειρο
    και τη Μακεδονία στις αρχές του 1878 είχαν καταπνιγεί ή είχαν οδηγηθεί σε ανακωχή
    όταν η κυβέρνησή της ήταν έτοιμη να κινηθεί. Η Βρετανία και η Αυστροουγγαρία δεν
    δέχονταν τον Άγιο Στέφανο, και ο Μπίσμαρκ πρόσφερε το Βερολίνο ως τόπο αναθεώρησής
    του.

    Το Συνέδριο συνεδρίασε από τις 13 Ιουνίου ως τις 13 Ιουλίου υπό τον Μπίσμαρκ. Η
    Ελλάδα δεν ήταν μέλος: παρά τις ρωσικές αντιρρήσεις, ένας γαλλικός συμβιβασμός τη
    δέχθηκε στις συνεδριάσεις για τη Θεσσαλία, την Ήπειρο και την Κρήτη και σε καμία
    άλλη. Ο Θεόδωρος Δηλιγιάννης, επικεφαλής της ελληνικής αντιπροσωπείας, και ο
    Αλέξανδρος Ρίζος Ραγκαβής, πρεσβευτής της Ελλάδας στο Βερολίνο, διεκδίκησαν στις 29
    Ιουνίου την Ήπειρο, τη Θεσσαλία και την Κρήτη. Η Βρετανία είχε χρησιμοποιήσει τις
    διεκδικήσεις αυτές για να αποσπάσει από τον σουλτάνο τη Σύμβαση της Κύπρου της 4ης
    Ιουνίου, που της έδωσε το νησί με αντάλλαγμα αμυντική συμμαχία εναντίον της Ρωσίας,
    και μόλις πήρε την Κύπρο τις εγκατέλειψε. Ήταν ο Γάλλος υπουργός Εξωτερικών Ουίλιαμ
    Ουάντινγκτον που κράτησε το ζήτημα ζωντανό.

    Αυτό που πέτυχε ήταν το Πρωτόκολλο 13, της συνεδρίασης της 5ης Ιουλίου, που καλούσε
    την Πύλη να συμφωνήσει με την Ελλάδα νέα μεθόριο στη Θεσσαλία και την Ήπειρο και
    υπεδείκνυε, σκόπιμα αόριστα, μια γραμμή κατά μήκος του Πηνειού και του Καλαμά. Το
    άρθρο 24 της συνθήκης που υπογράφηκε στις 13 Ιουλίου πρόσθετε ότι, αν οι δύο δεν
    συμφωνούσαν, οι έξι Δυνάμεις επιφυλάσσονταν να προσφέρουν τη μεσολάβησή τους. Το
    άρθρο 23 υποχρέωνε την Πύλη να εφαρμόσει στην Κρήτη τον Οργανικό Νόμο του 1868, που
    έγινε η βάση της Σύμβασης της Χαλέπας τον Οκτώβριο. Η Βουλγαρία του Αγίου Στεφάνου
    χωρίστηκε στα τρία: ένα αυτοδιοίκητο πριγκιπάτο, την αυτόνομη οθωμανική επαρχία της
    Ανατολικής Ρωμυλίας και τη Μακεδονία, που επέστρεψε στον σουλτάνο.

    Για την Ελλάδα το Βερολίνο ήταν σύσταση και όχι παραχώρηση, και η Πύλη το
    αντιμετώπισε ακριβώς έτσι: η Θεσσαλία και η Άρτα ήρθαν μόλις το 1881, με γραμμή πολύ
    νοτιότερα από τον Καλαμά. Το Συνέδριο όμως όρισε τους όρους με τους οποίους θα
    συζητιόταν το ελληνικό ζήτημα για μια γενιά. Τα σύνορα τα παραχωρούσαν οι Δυνάμεις
    σε διασκέψεις και δεν κερδίζονταν στο πεδίο της μάχης, και η Μακεδονία, ξανά υπό
    τους Οθωμανούς, έγινε το έπαθλο που θα διεκδικούσαν στη συνέχεια Έλληνες, Βούλγαροι
    και Σέρβοι. Η ένωση της Ανατολικής Ρωμυλίας με τη Βουλγαρία το 1885 ήταν το πρώτο
    ρήγμα στη ρύθμιση, και προκάλεσε την ελληνική επιστράτευση που κατέληξε στον
    αποκλεισμό του 1886.
