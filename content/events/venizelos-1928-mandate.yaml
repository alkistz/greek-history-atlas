id: venizelos-1928-mandate
title:
  en: The election of 19 August 1928 and the last Venizelos government
  el: Οι εκλογές της 19ης Αυγούστου 1928 και η τελευταία κυβέρνηση Βενιζέλου
summary:
  en: >
    Venizelos came out of retirement, reintroduced a majoritarian electoral law and won 178
    of 250 seats on 46.94 per cent of the vote. The four years that followed were the only
    stable parliamentary term the Second Republic had. The government built dams, roads and
    schools, founded the Agricultural Bank, settled Greece's quarrels with Italy, Yugoslavia
    and Turkey, and passed the Idionymon law against communists. The world slump destroyed
    it.
  el: >
    Ο Βενιζέλος επέστρεψε από την απόσυρση, επανέφερε τον πλειοψηφικό εκλογικό νόμο και
    κέρδισε 178 από τις 250 έδρες με 46,94% των ψήφων. Η τετραετία που ακολούθησε ήταν η
    μόνη σταθερή κοινοβουλευτική περίοδος της Β΄ Δημοκρατίας. Η κυβέρνηση έκανε φράγματα,
    δρόμους και σχολεία, ίδρυσε την Αγροτική Τράπεζα, διευθέτησε τις διαφορές της Ελλάδας με
    την Ιταλία, τη Γιουγκοσλαβία και την Τουρκία, και ψήφισε το Ιδιώνυμο εναντίον των
    κομμουνιστών. Την κατέστρεψε η παγκόσμια κρίση.
body:
  en: |
    Venizelos formed a government on 4 July 1928 and called an election at once, held on 19
    August under a majoritarian law he had restored in place of proportional representation.
    The Liberal Party took 477,502 votes and 178 seats, and with allies commanded between
    220 and 228 of the 250. The People's Party, on 243,543 votes, was left with 19. It was
    the mandate the Republic had been waiting for, and Venizelos governed with it until 26
    May 1932.

    The programme was developmental. Foreign engineering contractors drained the
    plains of Macedonia and Thessaly, the Marathon dam gave Athens a water supply, roads and
    school buildings went up across the country, and the Agricultural Bank of Greece was
    created in 1929 to lend to smallholders, refugee and native alike. Abroad the record was
    better still: a pact of friendship and arbitration with Italy on 23 September 1928, a
    treaty with Yugoslavia on 27 March 1929 that settled the long dispute over the Serbian
    free zone in the port of Thessaloniki, and the two Ankara agreements with Turkey in
    1930. The Senate was revived under the 1927 constitution and first elected on 21 April
    1929, and Alexandros Zaimis succeeded Kountouriotis as President that December.

    The same government showed the other face of Venizelism. The Idionymon law of 1929 made
    the propagation of ideas aimed at overthrowing the social order a distinct offence, and
    it was used almost entirely against communists and trade unionists; the machinery it
    created was inherited intact by the dictatorship of 1936. And the foundation of the whole
    enterprise was foreign credit and emigrant remittances, both of which failed after 1929.
    Tobacco and currant exports collapsed, the budget with them, and the term ended in the
    default of 1932 and defeat at the polls on 25 September.
  el: |
    Ο Βενιζέλος σχημάτισε κυβέρνηση στις 4 Ιουλίου 1928 και προκήρυξε αμέσως εκλογές, που
    έγιναν στις 19 Αυγούστου με πλειοψηφικό σύστημα το οποίο είχε επαναφέρει στη θέση της
    απλής αναλογικής. Το Κόμμα των Φιλελευθέρων έλαβε 477.502 ψήφους και 178 έδρες, και με
    τους συμμάχους του έλεγχε 220 ως 228 από τις 250. Το Λαϊκό Κόμμα, με 243.543 ψήφους,
    έμεινε με 19. Ήταν η εντολή που περίμενε η Δημοκρατία, και ο Βενιζέλος κυβέρνησε με
    αυτήν ως τις 26 Μαΐου 1932.

    Το πρόγραμμα ήταν αναπτυξιακό. Ξένοι τεχνικοί οίκοι αποξήραναν τις
    πεδιάδες της Μακεδονίας και της Θεσσαλίας, το φράγμα του Μαραθώνα έδωσε νερό στην Αθήνα,
    δρόμοι και σχολικά κτίρια χτίστηκαν σε όλη τη χώρα, και το 1929 ιδρύθηκε η Αγροτική
    Τράπεζα για να χρηματοδοτεί τους μικροκαλλιεργητές, πρόσφυγες και γηγενείς. Στο
    εξωτερικό ο απολογισμός ήταν ακόμη καλύτερος: σύμφωνο φιλίας και διαιτησίας με την
    Ιταλία στις 23 Σεπτεμβρίου 1928, συνθήκη με τη Γιουγκοσλαβία στις 27 Μαρτίου 1929 που
    έλυσε τη χρόνια διαφορά για τη σερβική ελεύθερη ζώνη στο λιμάνι της Θεσσαλονίκης, και οι
    δύο συμφωνίες της Άγκυρας με την Τουρκία το 1930. Η Γερουσία αναβίωσε με το Σύνταγμα του
    1927 και εκλέχθηκε πρώτη φορά στις 21 Απριλίου 1929, ενώ τον Δεκέμβριο ο Αλέξανδρος
    Ζαΐμης διαδέχθηκε τον Κουντουριώτη στην προεδρία.

    Η ίδια κυβέρνηση έδειξε και την άλλη όψη του βενιζελισμού. Ο νόμος περί Ιδιωνύμου του
    1929 κατέστησε αυτοτελές αδίκημα τη διάδοση ιδεών που απέβλεπαν στην ανατροπή του
    κοινωνικού καθεστώτος και εφαρμόστηκε σχεδόν αποκλειστικά κατά κομμουνιστών και
    συνδικαλιστών· τον μηχανισμό που έστησε τον κληρονόμησε ακέραιο η δικτατορία του 1936.
    Θεμέλιο όμως όλου του εγχειρήματος ήταν το ξένο δάνειο και τα εμβάσματα των μεταναστών,
    και τα δύο σταμάτησαν μετά το 1929. Οι εξαγωγές καπνού και σταφίδας κατέρρευσαν, μαζί
    τους και ο προϋπολογισμός, και η τετραετία έκλεισε με την πτώχευση του 1932 και την ήττα
    της 25ης Σεπτεμβρίου.
