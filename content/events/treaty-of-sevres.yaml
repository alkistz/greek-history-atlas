id: treaty-of-sevres
title:
  en: The Treaty of Sèvres
  el: Η Συνθήκη των Σεβρών
summary:
  en: >
    Signed at the French porcelain works on 10 August 1920 between the Allies and the
    Sultan's government, Sèvres gave Greece Eastern Thrace to the Chatalja line, Imbros
    and Tenedos, the Marmara islands, and the administration of the Smyrna zone with a
    plebiscite promised after five years. It was the furthest the Megali Idea ever got on
    paper. No state ever ratified it: the Grand National Assembly at Ankara rejected it
    outright, Greece never ratified either, and Lausanne replaced it wholesale three years
    later.
  el: >
    Υπογράφηκε στο γαλλικό εργοστάσιο πορσελάνης στις 10 Αυγούστου 1920 ανάμεσα στους
    Συμμάχους και την κυβέρνηση του σουλτάνου. Οι Σέβρες έδιναν στην Ελλάδα την Ανατολική
    Θράκη ως τη γραμμή της Τσατάλτζας, την Ίμβρο και την Τένεδο, τα νησιά του Μαρμαρά και τη
    διοίκηση της ζώνης της Σμύρνης, με δημοψήφισμα υποσχεμένο μετά από πέντε χρόνια. Ήταν το
    πιο μακριά που έφτασε ποτέ η Μεγάλη Ιδέα στα χαρτιά. Καμιά χώρα δεν την επικύρωσε: η
    Μεγάλη Εθνοσυνέλευση της Άγκυρας την απέρριψε εξαρχής, ούτε η Ελλάδα την επικύρωσε, και
    τρία χρόνια αργότερα τη Λωζάνη την αντικατέστησε συνολικά.
body:
  en: |
    Greece signed as a victor. Greek troops had already occupied Eastern Thrace in late
    July 1920 and entered Adrianople at the end of the month, so the treaty confirmed a
    line the army held. The Smyrna zone, roughly 17,000 square kilometres, was to remain
    nominally Ottoman under Greek administration with its own parliament, and a League
    of Nations plebiscite after five years would decide whether it joined Greece. Greece
    formally assumed the administration on 30 July 1922, six weeks before it lost the
    city. On the same day as Sèvres, Greece and Italy concluded a separate accord under
    which Italy was to cede the Dodecanese except Rhodes, with a Rhodian plebiscite after
    fifteen years; the sources on this agreement are thin and its title varies, and Italy
    repudiated it in 1922.

    Sèvres also created an independent Armenia and an autonomous Kurdistan,
    internationalised the Straits and put Ottoman revenues under Allied financial control.
    It was a treaty written for a state that had ceased to exist. The Grand National
    Assembly had been sitting at Ankara since 23 April 1920 and recognised none of it.
    The Sultan's signature bound the Sublime Porte and no one with an army.

    Greece did not ratify either. Venizelos lost the election of November 1920, the new
    government was dissatisfied with the frontier it had inherited, and the Allies who
    had written the treaty withdrew their support from the only state willing to enforce
    it. In Turkey the word Sèvres has remained a political term for dismemberment by the
    Powers, which is the treaty's most durable effect.
  el: |
    Η Ελλάδα υπέγραψε ως νικήτρια. Ελληνικά στρατεύματα είχαν ήδη καταλάβει την Ανατολική
    Θράκη στα τέλη Ιουλίου 1920 και είχαν μπει στην Αδριανούπολη στο τέλος του μήνα, οπότε η
    συνθήκη επικύρωνε γραμμή που κρατούσε ο στρατός. Η ζώνη της Σμύρνης, περίπου 17.000
    τετραγωνικά χιλιόμετρα, θα παρέμενε τυπικά οθωμανική υπό ελληνική διοίκηση με δική της
    βουλή, και δημοψήφισμα υπό την Κοινωνία των Εθνών μετά από πέντε χρόνια θα αποφάσιζε την
    ένωση με την Ελλάδα. Η Ελλάδα ανέλαβε επίσημα τη διοίκηση στις 30 Ιουλίου 1922, έξι
    εβδομάδες πριν χάσει την πόλη. Την ίδια ημέρα με τις Σέβρες, Ελλάδα και Ιταλία συνήψαν
    χωριστή συμφωνία με την οποία η Ιταλία θα παραχωρούσε τα Δωδεκάνησα εκτός της Ρόδου, με
    δημοψήφισμα στη Ρόδο μετά από δεκαπέντε χρόνια· οι πηγές για τη συμφωνία αυτή είναι ισχνές
    και ο τίτλος της ποικίλλει, ενώ η Ιταλία την αποκήρυξε το 1922.

    Οι Σέβρες δημιουργούσαν επίσης ανεξάρτητη Αρμενία και αυτόνομο Κουρδιστάν, διεθνοποιούσαν
    τα Στενά και έθεταν τα οθωμανικά έσοδα υπό συμμαχικό οικονομικό έλεγχο. Ήταν συνθήκη
    γραμμένη για κράτος που είχε πάψει να υπάρχει. Η Μεγάλη Εθνοσυνέλευση συνεδρίαζε στην
    Άγκυρα από τις 23 Απριλίου 1920 και δεν αναγνώρισε τίποτε από αυτά. Η υπογραφή του σουλτάνου
    δέσμευε την Υψηλή Πύλη και κανέναν που διέθετε στρατό.

    Ούτε η Ελλάδα επικύρωσε. Ο Βενιζέλος έχασε τις εκλογές του Νοεμβρίου 1920, η νέα κυβέρνηση
    ήταν δυσαρεστημένη με τη συνοριακή γραμμή που κληρονόμησε, και οι Σύμμαχοι που είχαν γράψει
    τη συνθήκη απέσυραν τη στήριξή τους από το μόνο κράτος που ήταν πρόθυμο να την επιβάλει.
    Στην Τουρκία η λέξη Σέβρες έμεινε πολιτικός όρος για τον διαμελισμό από τις Δυνάμεις, και
    αυτό είναι το πιο ανθεκτικό αποτέλεσμα της συνθήκης.
