id: greek-appeal-to-the-un-on-cyprus
title:
  en: Greece Takes Cyprus to the United Nations
  el: Η πρώτη ελληνική προσφυγή στον ΟΗΕ για το Κυπριακό
summary:
  en: >
    On 16 August 1954 Greece asked the United Nations to apply the principle of
    self-determination to the people of Cyprus, the first Greek recourse to the organisation over
    the island. The claim rested on the referendum organised by the Church of Cyprus in January
    1950, in which 215,108 Greek Cypriots signed for union with Greece and 9,639 against. The
    General Assembly decided on 17 December 1954 not to consider the question for the time being.
    The decision provoked the worst rioting in Cyprus since 1931 and discredited the diplomatic
    route among Greek Cypriots. It also brought Turkey into the question as an interested party
    for the first time since 1923.
  el: >
    Στις 16 Αυγούστου 1954 η Ελλάδα ζήτησε από τον ΟΗΕ να εφαρμοστεί η αρχή της αυτοδιάθεσης στον
    λαό της Κύπρου, η πρώτη ελληνική προσφυγή στον οργανισμό για το νησί. Η διεκδίκηση στηριζόταν
    στο ενωτικό δημοψήφισμα που οργάνωσε η Εκκλησία της Κύπρου τον Ιανουάριο του 1950, όπου
    215.108 Ελληνοκύπριοι υπέγραψαν υπέρ της ένωσης με την Ελλάδα και 9.639 κατά. Η Γενική
    Συνέλευση αποφάσισε στις 17 Δεκεμβρίου 1954 να μην εξετάσει το ζήτημα προς το παρόν. Η
    απόφαση προκάλεσε τις χειρότερες ταραχές στην Κύπρο από το 1931 και απαξίωσε τη διπλωματική
    οδό στα μάτια των Ελληνοκυπρίων. Έφερε επίσης την Τουρκία στο ζήτημα ως ενδιαφερόμενο μέρος
    για πρώτη φορά μετά το 1923.
body:
  en: |
    Britain had administered Cyprus since 1878 under a convention with the Ottoman Empire, annexed
    it in 1914 and made it a Crown Colony in 1925. Enosis, union with Greece, had been the standing
    demand of the Greek Cypriot majority and the cause of the revolt of 1931. When the British
    authorities refused an official vote after the war, the Church of Cyprus organised its own:
    signature books were placed in the churches from 15 to 22 January 1950, and 215,108 signed for
    union against 9,639, 95.71 per cent in favour on a participation of 89.9 per cent of Greek
    Cypriots. Turkish Cypriots did not take part, and their exclusion from the count is part of why
    the exercise carried no weight in London or Ankara.

    The Papagos government tried the bilateral route and was refused: Britain's position was that
    its sovereignty over Cyprus was not a matter for negotiation, a stance compressed into the word
    "never" attributed to the minister of state Henry Hopkinson in July 1954. Athens concluded that
    internationalisation was the only route left and lodged its request at the United Nations on 16
    August 1954.

    The General Assembly, by Resolution 814 (IX) of 17 December 1954, decided not to consider the
    question further for the time being, on the ground that it did not appear appropriate to adopt a
    resolution. The Greek delegation had expected more, and the Greek Cypriot reaction was violent:
    the rioting that followed was the worst on the island since 1931. The argument that Cyprus would
    not be won by diplomacy, which Georgios Grivas had been making since the 1940s, became much
    harder to answer.

    The appeal also had a consequence Athens had not intended. By raising Cyprus at the United
    Nations, Greece made it an international question, and Turkey answered as a party to it for the
    first time since Lausanne had settled the Turkish account with the island in 1923. From 1955
    Britain treated the dispute as tripartite, convening Greece and Turkey at the London conference
    of 29 August to 7 September 1955, and thereafter no settlement was possible without Ankara.
  el: |
    Η Βρετανία διοικούσε την Κύπρο από το 1878 βάσει σύμβασης με την Οθωμανική Αυτοκρατορία, την
    προσάρτησε το 1914 και την κατέστησε αποικία του Στέμματος το 1925. Η ένωση με την Ελλάδα ήταν
    το πάγιο αίτημα της ελληνοκυπριακής πλειοψηφίας και η αιτία της εξέγερσης του 1931. Όταν οι
    βρετανικές αρχές αρνήθηκαν επίσημη ψηφοφορία μετά τον πόλεμο, η Εκκλησία της Κύπρου οργάνωσε τη
    δική της: τα βιβλία υπογραφών τοποθετήθηκαν στους ναούς από τις 15 ως τις 22 Ιανουαρίου 1950,
    και υπέγραψαν 215.108 υπέρ της ένωσης έναντι 9.639, δηλαδή 95,71% υπέρ με συμμετοχή 89,9% των
    Ελληνοκυπρίων. Οι Τουρκοκύπριοι δεν συμμετείχαν, και ο αποκλεισμός τους από την καταμέτρηση
    είναι ένας από τους λόγους για τους οποίους η διαδικασία δεν βάρυνε ούτε στο Λονδίνο ούτε στην
    Άγκυρα.

    Η κυβέρνηση Παπάγου δοκίμασε τη διμερή οδό και εισέπραξε άρνηση: η βρετανική θέση ήταν ότι η
    κυριαρχία επί της Κύπρου δεν ήταν αντικείμενο διαπραγμάτευσης, στάση που συμπυκνώθηκε στο
    "ποτέ" που αποδόθηκε στον υφυπουργό Χένρι Χόπκινσον τον Ιούλιο του 1954. Η Αθήνα έκρινε ότι
    απέμενε μόνο η διεθνοποίηση και κατέθεσε το αίτημά της στον ΟΗΕ στις 16 Αυγούστου 1954.

    Η Γενική Συνέλευση, με το ψήφισμα 814 (IX) της 17ης Δεκεμβρίου 1954, αποφάσισε να μην εξετάσει
    περαιτέρω το ζήτημα προς το παρόν, με το σκεπτικό ότι δεν φαινόταν σκόπιμη η έκδοση ψηφίσματος.
    Η ελληνική αντιπροσωπεία περίμενε περισσότερα, και η ελληνοκυπριακή αντίδραση ήταν βίαιη: οι
    ταραχές που ακολούθησαν ήταν οι χειρότερες στο νησί από το 1931. Το επιχείρημα ότι η Κύπρος δεν
    θα κερδιζόταν με τη διπλωματία, το οποίο ο Γεώργιος Γρίβας διατύπωνε από τη δεκαετία του 1940,
    έγινε πολύ δυσκολότερο να αντικρουστεί.

    Η προσφυγή είχε και μια συνέπεια που η Αθήνα δεν είχε επιδιώξει. Φέρνοντας την Κύπρο στον ΟΗΕ, η
    Ελλάδα την έκανε διεθνές ζήτημα, και η Τουρκία απάντησε ως μέρος του για πρώτη φορά μετά τη
    Λωζάνη, που είχε κλείσει το 1923 τον τουρκικό λογαριασμό με το νησί. Από το 1955 η Βρετανία
    αντιμετώπισε τη διαφορά ως τριμερή, συγκαλώντας Ελλάδα και Τουρκία στη διάσκεψη του Λονδίνου
    από τις 29 Αυγούστου ως τις 7 Σεπτεμβρίου 1955, και έκτοτε καμία λύση δεν ήταν δυνατή χωρίς την
    Άγκυρα.
