id: accession-of-george-i
title:
  en: The Accession of George I
  el: Η εκλογή του Γεωργίου Α΄
summary:
  en: >
    With Prince Alfred of Britain ruled out by treaty, the Powers settled on the
    seventeen-year-old Prince Vilhelm of Denmark, a naval cadet. The Second National
    Assembly elected him on 30 March 1863 as George I, King of the Hellenes, a title of
    the people rather than the territory and a standing claim on the Greeks still under
    Ottoman rule. Britain attached the Ionian Islands to the bargain. His reign lasted
    almost fifty years, the longest in modern Greek history.
  el: >
    Καθώς ο πρίγκιπας Αλφρέδος της Βρετανίας αποκλειόταν από τις συνθήκες, οι Δυνάμεις
    κατέληξαν στον δεκαεπτάχρονο πρίγκιπα Βίλχελμ της Δανίας, δόκιμο του ναυτικού. Η Β΄
    Εθνοσυνέλευση τον εξέλεξε στις 30 Μαρτίου 1863 ως Γεώργιο Α΄, Βασιλέα των Ελλήνων,
    τίτλο του λαού και όχι της επικράτειας και διαρκή διεκδίκηση για τους Έλληνες που
    παρέμεναν υπό οθωμανική κυριαρχία. Η Βρετανία πρόσθεσε στη συμφωνία τα Επτάνησα. Η
    βασιλεία του κράτησε σχεδόν πενήντα χρόνια, η μακρότερη της νεότερης Ελλάδας.
body:
  en: |
    The referendum of late 1862 had produced an overwhelming vote for Prince Alfred, the
    second son of Queen Victoria, which the London Protocol of 1832 made impossible: no
    member of the reigning house of Britain, France or Russia could take the Greek
    throne. The search moved to the smaller courts. It ended with Vilhelm, second son of
    Prince Christian of Denmark, soon to be Christian IX, whose children's marriages
    would make him the father-in-law of Europe. He was a cadet at the naval academy and
    learned of his election from a newspaper.

    The Assembly elected him on 30 March 1863. The title chosen for him was not King of
    Greece, which Otto had held, but King of the Hellenes: a deliberate formulation,
    since it made the crown the crown of a nation rather than of a state whose frontiers
    stopped at Arta and Volos. Britain made the accession worth having. It agreed to
    cede the Ionian Islands, which it had held since 1815 and had concluded it no longer
    needed, as the price of a candidate all three Powers could accept, and the three
    guaranteed the new king an annual subsidy of £12,000 out of their share of the 1832
    loan.

    George arrived in Athens on 30 October 1863. He waited twenty months for a
    constitution to swear, and swore the text of 1864 on 28 November of that year. He
    outlasted the men who elected him by decades: he saw Thessaly annexed, the state go
    bankrupt, the army beaten in 1897 and then double the kingdom in the Balkan Wars. He
    was shot dead in Thessaloniki on 18 March 1913, five months after its capture and
    fifty years almost to the month after his election.
  el: |
    Το δημοψήφισμα των τελών του 1862 είχε δώσει συντριπτική πλειοψηφία στον πρίγκιπα
    Αλφρέδο, δευτερότοκο γιο της βασίλισσας Βικτωρίας, κάτι που το Πρωτόκολλο του
    Λονδίνου του 1832 καθιστούσε αδύνατο: κανένα μέλος των βασιλικών οίκων της Βρετανίας,
    της Γαλλίας και της Ρωσίας δεν μπορούσε να λάβει τον ελληνικό θρόνο. Η αναζήτηση
    στράφηκε στις μικρότερες αυλές και κατέληξε στον Βίλχελμ, δευτερότοκο του πρίγκιπα
    Χριστιανού της Δανίας, του μετέπειτα Χριστιανού Θ΄, που οι γάμοι των παιδιών του θα
    τον έκαναν πεθερό της Ευρώπης. Ήταν δόκιμος στη Ναυτική Σχολή και έμαθε την εκλογή
    του από εφημερίδα.

    Η Εθνοσυνέλευση τον εξέλεξε στις 30 Μαρτίου 1863. Ο τίτλος που του δόθηκε δεν ήταν
    Βασιλεύς της Ελλάδος, όπως του Όθωνα, αλλά Βασιλεύς των Ελλήνων: διατύπωση
    συνειδητή, γιατί έκανε το στέμμα στέμμα ενός έθνους και όχι ενός κράτους που τα
    σύνορά του σταματούσαν στην Άρτα και τον Βόλο. Η Βρετανία φρόντισε να αξίζει η
    ανάρρηση. Δέχθηκε να παραχωρήσει τα Επτάνησα, που κατείχε από το 1815 και είχε
    κρίνει ότι δεν της χρειάζονταν πια, ως αντίτιμο για υποψήφιο αποδεκτό και από τις
    τρεις Δυνάμεις, οι οποίες εγγυήθηκαν στον νέο βασιλιά ετήσια χορηγία 12.000 λιρών
    από το μερίδιό τους στο δάνειο του 1832.

    Ο Γεώργιος έφτασε στην Αθήνα στις 30 Οκτωβρίου 1863. Περίμενε είκοσι μήνες ώσπου να
    υπάρξει σύνταγμα για να ορκιστεί, και ορκίστηκε το κείμενο του 1864 στις 28
    Νοεμβρίου εκείνου του χρόνου. Επέζησε των ανθρώπων που τον εξέλεξαν κατά δεκαετίες:
    είδε την προσάρτηση της Θεσσαλίας, την πτώχευση του κράτους, την ήττα του 1897 και
    ύστερα τον διπλασιασμό του βασιλείου στους Βαλκανικούς Πολέμους. Δολοφονήθηκε στη
    Θεσσαλονίκη στις 18 Μαρτίου 1913, πέντε μήνες μετά την απελευθέρωσή της και σχεδόν
    πενήντα χρόνια από την εκλογή του.
