id: noemvriana
title:
  en: The Noemvriana
  el: Τα Νοεμβριανά
summary:
  en: >
    Allied marines landed at Piraeus on 1 December 1916 to seize Greek artillery as a
    guarantee of neutrality, and royalist officers and reservist leagues fought them
    through the streets of Athens. Around 82 Greeks and between 191 and 227 Allied
    soldiers were killed or wounded before a compromise was reached the same afternoon.
    Royalist mobs then hunted Venizelists across the city for two days. Britain and
    France recognised the Thessaloniki government the following day and blockaded
    royalist Greece into famine.
  el: >
    Συμμαχικά αγήματα αποβιβάστηκαν στον Πειραιά την 1η Δεκεμβρίου 1916 για να παραλάβουν
    ελληνικό πυροβολικό ως εγγύηση της ουδετερότητας, και βασιλικοί αξιωματικοί με τους
    Επιστράτους τα αντιμετώπισαν στους δρόμους της Αθήνας. Περίπου 82 Έλληνες και μεταξύ 191
    και 227 σύμμαχοι στρατιώτες σκοτώθηκαν ή τραυματίστηκαν πριν επιτευχθεί συμβιβασμός το
    ίδιο απόγευμα. Βασιλικοί όχλοι κυνήγησαν στη συνέχεια τους βενιζελικούς σε όλη την πόλη
    επί δύο ημέρες. Η Βρετανία και η Γαλλία αναγνώρισαν την επομένη την κυβέρνηση της
    Θεσσαλονίκης και επέβαλαν ναυτικό αποκλεισμό που έφερε πείνα στη βασιλική Ελλάδα.
body:
  en: |
    The name is a fossil of the old calendar: the events of 1 to 3 December 1916 fell on
    18 to 20 November Old Style, and Greek has called them the November events ever
    since. Vice-Admiral Louis Dartige du Fournet put roughly 2,500 French and British
    marines ashore at Piraeus with a demand for ten batteries of mountain artillery.
    Royalist officers and the reservist leagues, the Epistratoi, had prepared positions
    in advance, with Ioannis Metaxas among the organisers. A rifle shot near the Zappeion
    opened what Greeks call the Battle of Athens, and each side has blamed the other for
    firing it.

    The casualty figures are contested. Greek dead are usually put at around 82; Allied
    losses are given between 191 and 227 killed and wounded, with George Leon counting
    194. French warships shelled the city during the fighting. By late afternoon
    Constantine had agreed to hand over six batteries instead of ten and the marines
    re-embarked the next morning. Militarily it was a small affair that the Allies lost.

    What followed was not a battle. For two or three days royalist crowds went through
    Athens with lists, sacking houses and arresting Venizelists. Leon records 35 murdered
    and 980 expelled from the city; Giannis Mourelos records 14 civilians killed, 14
    wounded and about 922 imprisoned. Venizelos's own house was looted and he was
    anathematised at a public ceremony on the Pedion tou Areos. On 2 December Britain and
    France recognised the provisional government at Thessaloniki and imposed a naval
    blockade that held until June 1917 and killed people by hunger in Athens and the
    Peloponnese. After the Noemvriana the removal of Constantine was a question of timing.
  el: |
    Το όνομα είναι απολίθωμα του παλαιού ημερολογίου: τα γεγονότα της 1ης έως 3ης Δεκεμβρίου
    1916 αντιστοιχούσαν στις 18 έως 20 Νοεμβρίου με το παλαιό, και έτσι έμειναν Νοεμβριανά.
    Ο υποναύαρχος Λουί Νταρτίζ ντυ Φουρνέ αποβίβασε στον Πειραιά περίπου 2.500 Γάλλους και
    Βρετανούς πεζοναύτες με την απαίτηση να παραδοθούν δέκα ορειβατικές πυροβολαρχίες.
    Βασιλικοί αξιωματικοί και οι Σύνδεσμοι Επιστράτων είχαν ετοιμάσει εκ των προτέρων θέσεις,
    με τον Ιωάννη Μεταξά ανάμεσα στους οργανωτές. Ένας πυροβολισμός κοντά στο Ζάππειο άνοιξε
    αυτό που οι Έλληνες ονομάζουν Μάχη των Αθηνών, και κάθε πλευρά κατηγόρησε την άλλη ότι τον
    έριξε.

    Οι απώλειες αμφισβητούνται. Οι Έλληνες νεκροί υπολογίζονται συνήθως σε 82 περίπου· οι
    συμμαχικές απώλειες δίνονται μεταξύ 191 και 227 νεκρών και τραυματιών, με τον Τζορτζ Λέον
    να μετρά 194. Γαλλικά πολεμικά βομβάρδισαν την πόλη κατά τη διάρκεια της σύγκρουσης. Ως το
    απόγευμα ο Κωνσταντίνος είχε δεχθεί να παραδώσει έξι πυροβολαρχίες αντί για δέκα και τα
    αγήματα επιβιβάστηκαν ξανά το επόμενο πρωί. Στρατιωτικά επρόκειτο για μικρή υπόθεση, την
    οποία οι Σύμμαχοι έχασαν.

    Αυτό που ακολούθησε δεν ήταν μάχη. Επί δύο ή τρεις ημέρες βασιλικά πλήθη γύριζαν την Αθήνα
    με καταλόγους, λεηλατώντας σπίτια και συλλαμβάνοντας βενιζελικούς. Ο Λέον καταγράφει 35
    δολοφονημένους και 980 εκτοπισμένους από την πόλη· ο Γιάννης Μουρέλος καταγράφει 14 νεκρούς
    πολίτες, 14 τραυματίες και περίπου 922 φυλακισμένους. Το σπίτι του ίδιου του Βενιζέλου
    λεηλατήθηκε και ο ίδιος αναθεματίστηκε σε δημόσια τελετή στο Πεδίον του Άρεως. Στις 2
    Δεκεμβρίου η Βρετανία και η Γαλλία αναγνώρισαν την Προσωρινή Κυβέρνηση της Θεσσαλονίκης και
    επέβαλαν ναυτικό αποκλεισμό που κράτησε ως τον Ιούνιο του 1917 και σκότωσε ανθρώπους από
    πείνα στην Αθήνα και την Πελοπόννησο. Μετά τα Νοεμβριανά η απομάκρυνση του Κωνσταντίνου
    ήταν ζήτημα χρόνου.
