id: dekemvriana
title:
  en: "The Dekemvriana: the battle of Athens"
  el: Τα Δεκεμβριανά
summary:
  en: >
    General Scobie ordered ELAS to disband on 1 December 1944, the six EAM ministers
    resigned, and on Sunday 3 December police fired on a banned demonstration in Syntagma
    Square, killing more than 28 people. Within a week ELAS held most of Athens and
    Piraeus and the government and the British were penned into the centre. Churchill
    ordered Scobie to hold the city by force and diverted troops from Italy; the fighting
    ran thirty-seven days and killed roughly 1,200 on the government and British side and
    around 2,000 ELAS fighters, with civilian deaths reckoned separately in the thousands.
    ELAS was beaten in Athens and took thousands of civilian hostages north as it
    withdrew. Greece's alignment with the West was settled by the outcome.
  el: >
    Ο στρατηγός Σκόμπι διέταξε την 1η Δεκεμβρίου 1944 τη διάλυση του ΕΛΑΣ, οι έξι υπουργοί
    του ΕΑΜ παραιτήθηκαν, και την Κυριακή 3 Δεκεμβρίου η αστυνομία άνοιξε πυρ σε
    απαγορευμένη συγκέντρωση στο Σύνταγμα, σκοτώνοντας πάνω από 28 ανθρώπους. Μέσα σε μια
    εβδομάδα ο ΕΛΑΣ κρατούσε το μεγαλύτερο μέρος της Αθήνας και του Πειραιά και η κυβέρνηση
    και οι Βρετανοί είχαν περιοριστεί στο κέντρο. Ο Τσόρτσιλ διέταξε τον Σκόμπι να
    κρατήσει την πόλη με τη βία και απέσπασε στρατεύματα από την Ιταλία. Οι μάχες κράτησαν
    τριάντα επτά μέρες και στοίχισαν περίπου 1.200 νεκρούς στην κυβερνητική και βρετανική
    πλευρά και περίπου 2.000 στον ΕΛΑΣ, με τους αμάχους να υπολογίζονται χωριστά σε
    χιλιάδες. Ο ΕΛΑΣ ηττήθηκε στην Αθήνα και πήρε μαζί του, φεύγοντας, χιλιάδες πολίτες ως
    ομήρους. Η έκβαση καθόρισε τον δυτικό προσανατολισμό της Ελλάδας.
body:
  en: |
    Scobie's order of 1 December, issued under the authority Caserta had given him,
    required ELAS to disband by 10 December. The national army the government proposed in
    its place was to be built on the Mountain Brigade and the Sacred Band, formations that
    had fought outside Greece and that EAM regarded as royalist. Six EAM ministers
    resigned on 2 December rather than sign the decree. The demonstration called for the
    following day was banned; some 200,000 people came to Syntagma Square anyway, and
    Greek police and gendarmes fired on them from the buildings around it. More than 28
    demonstrators were killed and 148 wounded. Who gave the order to fire, and whether
    there was one, has never been agreed. A funeral procession the next day was fired on
    again, with more than a hundred killed by some accounts.

    The fighting spread through the city within hours. ELAS took most of Athens and
    Piraeus within a week and confined the government and the British to a perimeter
    around Syntagma, Kolonaki and the road to the port. Churchill's instruction to Scobie
    was to act as if he were in a conquered city. British reinforcements including the 4th
    Indian Infantry Division were diverted from the Italian front from 12 December, and
    the RAF and British artillery were used inside Athens. Over thirty-seven days about
    1,200 were killed on the government and British side, of whom some 210 were British
    with about 1,000 wounded and 733 missing, and around 2,000 on the ELAS side; civilian
    dead are counted separately in the thousands and whole districts were destroyed. As
    ELAS pulled out it marched thousands of civilian hostages north, many of whom died on
    the road or were killed; a mass grave of about 200 people, killed with axes and blunt
    instruments rather than shot, was uncovered at Peristeri on 25 January 1945. The
    hostages did EAM lasting political damage that no account of British bombardment has
    ever undone.

    Churchill, Anthony Eden, Field Marshal Alexander and Harold Macmillan flew in on 25
    December 1944, slept aboard HMS Ajax and convened a conference of all parties
    including EAM at the Foreign Ministry on 26 December. Out of it came the regency:
    King George II, under British pressure, appointed Archbishop Damaskinos Regent, and he
    was sworn in on 31 December. Papandreou resigned on 3 January 1945 and Damaskinos
    appointed the republican general Nikolaos Plastiras in his place the same day. ELAS,
    beaten in the capital, accepted a truce signed on 11 January and effective from 15
    January, withdrawing from Athens, Piraeus, Thessaloniki and Patras. Greek accounts of
    what the Dekemvriana were remain irreconcilable: a communist bid for power defeated,
    or a British intervention to deny power to the movement that had liberated the
    country. What is not in dispute is the result. Britain had established by force that
    Greece would not pass into the Soviet sphere, consistent with the percentages
    Churchill had agreed with Stalin in Moscow on 9 October 1944, and Stalin did not lift
    a finger for EAM.
  el: |
    Η διαταγή του Σκόμπι της 1ης Δεκεμβρίου, εκδομένη με την εξουσιοδότηση που του είχε
    δώσει η Καζέρτα, ζητούσε τη διάλυση του ΕΛΑΣ ως τις 10 Δεκεμβρίου. Ο εθνικός στρατός
    που πρότεινε στη θέση του η κυβέρνηση θα στηριζόταν στην Ορεινή Ταξιαρχία και στον Ιερό
    Λόχο, σχηματισμούς που είχαν πολεμήσει εκτός Ελλάδας και που το ΕΑΜ θεωρούσε
    βασιλόφρονες. Έξι υπουργοί του ΕΑΜ παραιτήθηκαν στις 2 Δεκεμβρίου αντί να
    προσυπογράψουν. Η συγκέντρωση που είχε προκηρυχθεί για την επομένη απαγορεύτηκε, αλλά
    περίπου 200.000 άνθρωποι κατέβηκαν στο Σύνταγμα, και η ελληνική αστυνομία και
    χωροφυλακή άνοιξαν πυρ από τα κτίρια γύρω από την πλατεία. Σκοτώθηκαν πάνω από 28
    διαδηλωτές και τραυματίστηκαν 148. Ποιος έδωσε τη διαταγή βολής, και αν δόθηκε ποτέ,
    δεν έχει συμφωνηθεί. Στην κηδεία της επομένης έπεσαν πάλι πυροβολισμοί, με πάνω από
    εκατό νεκρούς κατά ορισμένες μαρτυρίες.

    Οι μάχες απλώθηκαν στην πόλη μέσα σε λίγες ώρες. Ο ΕΛΑΣ πήρε το μεγαλύτερο μέρος της
    Αθήνας και του Πειραιά μέσα σε μια εβδομάδα και περιόρισε την κυβέρνηση και τους
    Βρετανούς σε έναν κλοιό γύρω από το Σύνταγμα, το Κολωνάκι και τον δρόμο προς το λιμάνι.
    Η εντολή του Τσόρτσιλ στον Σκόμπι ήταν να ενεργήσει σαν να βρισκόταν σε
    κατακτημένη πόλη. Βρετανικές ενισχύσεις, ανάμεσά τους η 4η ινδική μεραρχία πεζικού,
    αποσπάστηκαν από το ιταλικό μέτωπο από τις 12 Δεκεμβρίου, και μέσα στην Αθήνα
    χρησιμοποιήθηκαν η RAF και το βρετανικό πυροβολικό. Σε τριάντα επτά μέρες σκοτώθηκαν
    περίπου 1.200 άνθρωποι στην κυβερνητική και βρετανική πλευρά, από τους οποίους περί
    τους 210 Βρετανοί με περίπου 1.000 τραυματίες και 733 αγνοουμένους, και περίπου 2.000
    στην πλευρά του ΕΛΑΣ. Οι νεκροί άμαχοι μετριούνται χωριστά σε χιλιάδες και ολόκληρες
    συνοικίες καταστράφηκαν. Υποχωρώντας, ο ΕΛΑΣ οδήγησε βόρεια χιλιάδες πολίτες ομήρους,
    πολλοί από τους οποίους πέθαναν στον δρόμο ή σκοτώθηκαν: στο Περιστέρι αποκαλύφθηκε
    στις 25 Ιανουαρίου 1945 ομαδικός τάφος περίπου 200 ανθρώπων, σκοτωμένων με τσεκούρια
    και αμβλέα όργανα και όχι με σφαίρες. Το ζήτημα των ομήρων προκάλεσε στο ΕΑΜ πολιτική
    ζημιά που καμία αφήγηση για τους βρετανικούς βομβαρδισμούς δεν κατάφερε να αναιρέσει.

    Ο Τσόρτσιλ, ο Άντονι Ίντεν, ο στρατάρχης Αλεξάντερ και ο Χάρολντ Μακμίλαν έφτασαν
    αεροπορικώς στις 25 Δεκεμβρίου 1944, κοιμήθηκαν στο καταδρομικό Ajax και συγκάλεσαν
    στις 26 Δεκεμβρίου στο υπουργείο Εξωτερικών διάσκεψη όλων των πλευρών, μαζί με το ΕΑΜ.
    Από εκεί βγήκε η αντιβασιλεία: ο Γεώργιος Β΄, υπό βρετανική πίεση, όρισε αντιβασιλέα
    τον αρχιεπίσκοπο Δαμασκηνό, που ορκίστηκε στις 31 Δεκεμβρίου. Ο Παπανδρέου παραιτήθηκε
    στις 3 Ιανουαρίου 1945 και ο Δαμασκηνός διόρισε την ίδια μέρα στη θέση του τον
    δημοκρατικό στρατηγό Νικόλαο Πλαστήρα. Ο ΕΛΑΣ, ηττημένος στην πρωτεύουσα, δέχθηκε
    ανακωχή που υπογράφηκε στις 11 Ιανουαρίου και ίσχυσε από τις 15, αποσυρόμενος από την
    Αθήνα, τον Πειραιά, τη Θεσσαλονίκη και την Πάτρα. Οι ελληνικές αναγνώσεις των
    Δεκεμβριανών παραμένουν ασυμφιλίωτες: απόπειρα κατάληψης της εξουσίας από τους
    κομμουνιστές που απέτυχε, ή βρετανική επέμβαση που στέρησε την εξουσία από το κίνημα
    που είχε απελευθερώσει τη χώρα. Το αποτέλεσμα πάντως δεν αμφισβητείται. Η Βρετανία
    είχε επιβάλει με τα όπλα ότι η Ελλάδα δεν θα περνούσε στη σοβιετική σφαίρα, σύμφωνα με
    τα ποσοστά που ο Τσόρτσιλ είχε συμφωνήσει με τον Στάλιν στη Μόσχα στις 9 Οκτωβρίου
    1944, και ο Στάλιν δεν κούνησε το δάχτυλό του για το ΕΑΜ.
