id: greece-joins-nato
title:
  en: Greece Joins NATO
  el: Η ένταξη της Ελλάδας στο ΝΑΤΟ
summary:
  en: >
    The protocol admitting Greece and Turkey to the North Atlantic Treaty was signed at London
    on 22 October 1951 by the twelve existing members, and the two states acceded on 18 February
    1952 on depositing their instruments in Washington. It was the alliance's first enlargement.
    Accession placed Greek forces under NATO command arrangements and made permanent the military
    relationship built during the Civil War, for which Greek participation in Korea from 1950 had
    been used as an argument. It also created a structural problem: Greece and Turkey were now
    allies while remaining in dispute over Cyprus and the Aegean, and every Cyprus crisis after
    1955 was fought inside the alliance rather than outside it.
  el: >
    Το πρωτόκολλο για την προσχώρηση της Ελλάδας και της Τουρκίας στο Βορειοατλαντικό Σύμφωνο
    υπογράφηκε στο Λονδίνο στις 22 Οκτωβρίου 1951 από τα δώδεκα υφιστάμενα μέλη, και τα δύο κράτη
    εντάχθηκαν στις 18 Φεβρουαρίου 1952 με την κατάθεση των εγγράφων προσχώρησης στην Ουάσιγκτον.
    Ήταν η πρώτη διεύρυνση της συμμαχίας. Η ένταξη υπήγαγε τις ελληνικές δυνάμεις στις νατοϊκές
    διοικητικές δομές και μονιμοποίησε τη στρατιωτική σχέση που είχε χτιστεί στον Εμφύλιο, υπέρ
    της οποίας είχε χρησιμοποιηθεί και η ελληνική συμμετοχή στην Κορέα από το 1950. Δημιούργησε
    επίσης ένα δομικό πρόβλημα: Ελλάδα και Τουρκία ήταν πλέον σύμμαχοι ενώ παρέμεναν σε διαφορά
    για την Κύπρο και το Αιγαίο, και κάθε κυπριακή κρίση μετά το 1955 δόθηκε μέσα στη συμμαχία και
    όχι έξω από αυτήν.
body:
  en: |
    Greece applied together with Turkey, a pairing pressed by the United States and accepted
    despite reservations among existing members about extending the treaty area into the eastern
    Mediterranean. Greek troops had fought in Korea from 1950 in the United Nations force, and
    Athens used that service as its credential. The protocol of 22 October 1951 was ratified over
    the following months and accession took effect on 18 February 1952, making Greece and Turkey
    the alliance's thirteenth and fourteenth members.

    Nikolaos Plastiras headed the government at the moment of accession; Alexandros Papagos, who
    had argued the case for membership as a soldier, carried out its consequences as prime
    minister from November 1952. A United States and Greece defence agreement of October 1953 gave
    the Americans base and facility rights in the country, consolidating the arrangement the Truman
    Doctrine had begun. Greece also joined the Balkan Pact of February 1953 with Turkey and
    Yugoslavia, upgraded to an alliance at Bled in August 1954 and dead within a few years over
    Cyprus and the Yugoslav rapprochement with Moscow.

    Membership settled the external orientation of the Greek state, and it changed the terms of every
    subsequent quarrel with Turkey. From 1955 the two countries argued about Cyprus as allies whose
    quarrel Washington and London had an interest in containing, which shaped the settlements of
    1959 and the crises of 1963, 1964 and 1974. It also gave the Greek officer corps a set of
    external relationships and a doctrine of internal security that would matter in April 1967.
  el: |
    Η Ελλάδα υπέβαλε αίτηση μαζί με την Τουρκία, ένα δίδυμο που πίεσαν οι Ηνωμένες Πολιτείες και
    έγινε δεκτό παρά τις επιφυλάξεις ορισμένων μελών για την επέκταση της περιοχής του συμφώνου στην
    ανατολική Μεσόγειο. Ελληνικά στρατεύματα πολεμούσαν στην Κορέα από το 1950 στο πλαίσιο της
    δύναμης του ΟΗΕ, και η Αθήνα χρησιμοποίησε τη συμμετοχή αυτή ως διαπιστευτήριο. Το πρωτόκολλο
    της 22ας Οκτωβρίου 1951 κυρώθηκε τους επόμενους μήνες και η προσχώρηση ισχυροποιήθηκε στις 18
    Φεβρουαρίου 1952, καθιστώντας την Ελλάδα και την Τουρκία το δέκατο τρίτο και το δέκατο τέταρτο
    μέλος της συμμαχίας.

    Ο Νικόλαος Πλαστήρας ηγούνταν της κυβέρνησης τη στιγμή της ένταξης. Ο Αλέξανδρος Παπάγος, που
    είχε υποστηρίξει τη συμμετοχή ως στρατιωτικός, υλοποίησε τις συνέπειές της ως πρωθυπουργός από
    τον Νοέμβριο του 1952. Η ελληνοαμερικανική αμυντική συμφωνία του Οκτωβρίου 1953 παραχώρησε στους
    Αμερικανούς δικαιώματα βάσεων και εγκαταστάσεων στη χώρα, παγιώνοντας τη διευθέτηση που είχε
    ξεκινήσει το Δόγμα Τρούμαν. Η Ελλάδα προσχώρησε επίσης στο Βαλκανικό Σύμφωνο του Φεβρουαρίου
    1953 με την Τουρκία και τη Γιουγκοσλαβία, που αναβαθμίστηκε σε συμμαχία στο Μπλεντ τον Αύγουστο
    του 1954 και είχε εκπνεύσει μέσα σε λίγα χρόνια εξαιτίας της Κύπρου και της γιουγκοσλαβικής
    προσέγγισης με τη Μόσχα.

    Η ένταξη καθόρισε τον εξωτερικό προσανατολισμό του ελληνικού κράτους και άλλαξε τους όρους κάθε
    επόμενης διαφοράς με την Τουρκία. Από το 1955 οι δύο χώρες διαφωνούσαν για την Κύπρο ως σύμμαχοι
    των οποίων τη διένεξη η Ουάσιγκτον και το Λονδίνο είχαν συμφέρον να συγκρατήσουν, κάτι που
    διαμόρφωσε τις ρυθμίσεις του 1959 και τις κρίσεις του 1963, του 1964 και του 1974. Έδωσε επίσης
    στο ελληνικό σώμα αξιωματικών ένα πλέγμα εξωτερικών σχέσεων και ένα δόγμα εσωτερικής ασφάλειας
    που θα μετρούσε τον Απρίλιο του 1967.
