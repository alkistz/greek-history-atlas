id: colonels-coup-1967
title:
  en: The Colonels' Coup
  el: Το πραξικόπημα της 21ης Απριλίου 1967
summary:
  en: >
    Tanks entered Athens in the small hours of 21 April 1967 and by six in the morning
    Colonel Georgios Papadopoulos was on the radio announcing the suspension of eleven
    articles of the constitution. The plotters worked through Prometheus, a standing
    NATO contingency plan for a communist insurrection, which handed them the army's own
    machinery for arrests and communications. More than 10,000 people were detained in
    the first days and 6,188 were imprisoned or deported to island camps within a week.
    The coup pre-empted the elections called for 28 May, which the Centre Union was
    widely expected to win, and it opened seven years of military rule.
  el: >
    Τα τανκς μπήκαν στην Αθήνα τα ξημερώματα της 21ης Απριλίου 1967 και στις έξι το πρωί
    ο συνταγματάρχης Γεώργιος Παπαδόπουλος ανακοίνωνε από το ραδιόφωνο την αναστολή
    έντεκα άρθρων του Συντάγματος. Οι πραξικοπηματίες ενεργοποίησαν το σχέδιο
    «Προμηθεύς», εφεδρικό νατοϊκό σχέδιο για την περίπτωση κομμουνιστικής εξέγερσης, που
    τους παρέδωσε έτοιμο τον μηχανισμό συλλήψεων και επικοινωνιών του ίδιου του στρατού.
    Στις πρώτες μέρες κρατήθηκαν πάνω από 10.000 άνθρωποι και μέσα σε μία εβδομάδα 6.188
    φυλακίστηκαν ή εκτοπίστηκαν στα ξερονήσια. Το πραξικόπημα πρόλαβε τις εκλογές της
    28ης Μαΐου, που η Ένωση Κέντρου θεωρούνταν βέβαιο ότι θα κέρδιζε, και άνοιξε την
    επταετία.
body:
  en: |
    The conspirators were not the generals. They were colonels and brigadiers from the
    officers' networks inside the army, IDEA and EENA, who moved before their seniors
    could and before the voters could. Stylianos Pattakos, commanding the Armour
    Training Centre, supplied the tanks; Papadopoulos supplied the plan; Nikolaos
    Makarezos took economic policy. Prime Minister Panagiotis Kanellopoulos was arrested
    at his home. King Constantine II declined to call out loyal units against them and
    on the same day swore in a government under Konstantinos Kollias, a royalist former
    public prosecutor placed at its head as a figurehead while the three officers held
    the ministries that mattered.

    What followed was set out within days: martial law, press censorship, dissolution of
    the political parties, military courts, the dismissal of judges and academics, and
    the deportation of communists, trade unionists and Centre Union politicians to camps
    on Gyaros and Leros. Detainees were tortured in the cells of the security
    police and of the Military Police, by beating on the soles of the feet and by other
    methods that were described in open court by their victims at the trials of 1975 and
    formed the basis of convictions then.

    The regime called itself a national revolution and a pre-emptive strike against a
    communist takeover that was about to happen. A Greek court in 1975 found the same
    acts to be high treason and mutiny and sentenced the three leaders to death. Most
    historians place the coup in the army's internal politics rather than in any
    imminent insurgency: there was no communist force in 1967 capable of what the
    colonels said they had stopped. How much the United States knew in advance is still
    argued over and the declassified record has not settled it.
  el: |
    Οι συνωμότες δεν ήταν οι στρατηγοί. Ήταν συνταγματάρχες και ταξίαρχοι από τα δίκτυα
    αξιωματικών μέσα στον στρατό, τον ΙΔΕΑ και την ΕΕΝΑ, και κινήθηκαν πριν προλάβουν οι
    ανώτεροί τους και πριν προλάβει το εκλογικό σώμα. Ο Στυλιανός Παττακός, διοικητής
    του Κέντρου Εκπαιδεύσεως Τεθωρακισμένων, έδωσε τα άρματα, ο Παπαδόπουλος το σχέδιο,
    ο Νικόλαος Μακαρέζος ανέλαβε την οικονομία. Ο πρωθυπουργός Παναγιώτης Κανελλόπουλος
    συνελήφθη στο σπίτι του. Ο βασιλιάς Κωνσταντίνος Β΄ αρνήθηκε να κινητοποιήσει
    πιστές μονάδες εναντίον τους και την ίδια μέρα όρκισε κυβέρνηση υπό τον Κωνσταντίνο
    Κόλλια, βασιλόφρονα εισαγγελέα του Αρείου Πάγου, βιτρίνα σε μια κυβέρνηση όπου τα
    ουσιαστικά υπουργεία κρατούσαν οι τρεις αξιωματικοί.

    Η συνέχεια καθορίστηκε μέσα σε λίγες μέρες: στρατιωτικός νόμος, λογοκρισία, διάλυση
    των κομμάτων, στρατοδικεία, απολύσεις δικαστών και πανεπιστημιακών, εκτοπίσεις
    κομμουνιστών, συνδικαλιστών και πολιτικών της Ένωσης Κέντρου στη Γυάρο και τη Λέρο. Οι κρατούμενοι βασανίστηκαν στα κρατητήρια της Ασφάλειας και της
    Στρατιωτικής Αστυνομίας, με φάλαγγα και άλλες μεθόδους που περιγράφηκαν δημόσια από
    τα θύματά τους στις δίκες του 1975 και στήριξαν τις τότε καταδίκες.

    Το καθεστώς αυτοαποκαλούνταν εθνική επανάσταση και προληπτικό χτύπημα σε μια
    κομμουνιστική κατάληψη της εξουσίας που υποτίθεται ότι ερχόταν. Ελληνικό δικαστήριο
    το 1975 χαρακτήρισε τις ίδιες πράξεις εσχάτη προδοσία και στάση και καταδίκασε τους
    τρεις πρωταίτιους σε θάνατο. Οι περισσότεροι ιστορικοί τοποθετούν το πραξικόπημα
    στις εσωτερικές ισορροπίες του στρατού και όχι σε κάποια επικείμενη ανταρσία: το 1967
    δεν υπήρχε κομμουνιστική δύναμη ικανή για όσα έλεγαν οι συνταγματάρχες ότι απέτρεψαν.
    Το τι γνώριζαν εκ των προτέρων οι Ηνωμένες Πολιτείες παραμένει αντικείμενο διαμάχης
    και τα αποχαρακτηρισμένα έγγραφα δεν το έχουν λύσει.
