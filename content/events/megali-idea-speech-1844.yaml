id: megali-idea-speech-1844
title:
  en: Kolettis and the Great Idea
  el: Ο Κωλέττης και η Μεγάλη Ιδέα
summary:
  en: >
    On 14 January 1844 Old Style, 26 January New Style, Ioannis Kolettis rose in the
    National Assembly to oppose a proposal to bar Greeks born outside the kingdom from
    public office. He told the deputies that the Kingdom of Greece was only the smallest
    and poorest part of Greece, that Hellenism had two centres, Athens and
    Constantinople, and he spoke of this great idea that bound the nation together. He
    lost the point under debate, but the phrase became the name of the programme that
    governed Greek foreign policy for the next eighty years, until the defeat in Asia
    Minor in 1922.
  el: >
    Στις 14 Ιανουαρίου 1844 με το παλαιό ημερολόγιο, 26 Ιανουαρίου με το νέο, ο Ιωάννης
    Κωλέττης πήρε τον λόγο στην Εθνοσυνέλευση για να αντιταχθεί σε πρόταση που θα
    απέκλειε από τις δημόσιες θέσεις τους Έλληνες που είχαν γεννηθεί έξω από το βασίλειο.
    Είπε στους πληρεξουσίους ότι το Βασίλειο της Ελλάδος ήταν μόνο το μικρότερο και
    φτωχότερο μέρος της Ελλάδας, ότι ο ελληνισμός είχε δύο κέντρα, την Αθήνα και την
    Κωνσταντινούπολη, και μίλησε για τη μεγάλη αυτή ιδέα που ένωνε το έθνος. Έχασε στο
    ζήτημα που συζητούνταν, αλλά η φράση έγινε το όνομα του προγράμματος που καθόρισε την
    ελληνική εξωτερική πολιτική για τα επόμενα ογδόντα χρόνια, ως την ήττα στη Μικρά Ασία
    το 1922.
body:
  en: |
    The National Assembly that the revolution of 3 September 1843 had forced on Otto
    was drafting the kingdom's first constitution, and in January 1844 it reached the
    third article, which defined who was a Greek citizen. A few days before 14 January
    deputies proposed to distinguish autochthons, men born inside the frontier of 1832,
    from heterochthons, Greeks from the Ottoman lands, the Ionian Islands and the
    diaspora who had settled in the kingdom. The heterochthons were on average better
    educated and held a large share of posts in the administration, and the proposal
    was aimed at removing them from public office.

    Kolettis, born in Syrrako in Ottoman Epirus, was a heterochthon himself, a veteran
    of the revolution and the leader of the French party. He answered with history
    rather than law. Greece, he said, lay by its position at the centre of Europe,
    destined by its fall to enlighten the West and by its rebirth to enlighten the East.
    The Kingdom of Greece, in the translation most often quoted, "is not Greece; it is
    merely a part: the smallest, poorest part of Greece". Hellenism had two centres:
    Athens, the capital of the kingdom, and Constantinople, the great capital, the dream
    and hope of all Greeks.

    The speech did not carry the vote it was made in: the Assembly adopted a distinction
    between the two groups all the same. Nor did Kolettis invent the phrase. The poet
    Alexandros Soutsos had used almost the same words in a political drama of 1843, and
    the impact of the speech owed something to the term already being current. Some
    historians read it as an argument about citizenship, that everyone who had fought in
    1821 had a claim on the state wherever he was born, rather than a call for
    expansion. One Greek reference work dates the speech to 11 January; most accounts
    give the 14th.

    Kolettis became prime minister in August 1844 and governed until his death in 1847.
    What he had given was a name, and with it a measure against which every later
    government was judged: for eighty years the redemption of the unredeemed Greeks was
    the declared purpose of the state, and it was given up only after 1922.
  el: |
    Η Εθνοσυνέλευση που η επανάσταση της 3ης Σεπτεμβρίου 1843 είχε επιβάλει στον Όθωνα
    συνέτασσε το πρώτο σύνταγμα του βασιλείου, και τον Ιανουάριο του 1844 έφτασε στο
    τρίτο άρθρο, που όριζε ποιος είναι Έλληνας πολίτης. Λίγες μέρες πριν από τις 14
    Ιανουαρίου πληρεξούσιοι πρότειναν να διακριθούν οι αυτόχθονες, όσοι είχαν γεννηθεί
    μέσα στα σύνορα του 1832, από τους ετερόχθονες, τους Έλληνες από τις οθωμανικές
    χώρες, τα Επτάνησα και τη διασπορά που είχαν εγκατασταθεί στο βασίλειο. Οι
    ετερόχθονες ήταν κατά μέσο όρο πιο μορφωμένοι και κατείχαν μεγάλο μέρος των θέσεων
    της διοίκησης, και η πρόταση απέβλεπε στην απομάκρυνσή τους από τις δημόσιες θέσεις.

    Ο Κωλέττης, γεννημένος στο Συρράκο της οθωμανικής Ηπείρου, ήταν ο ίδιος ετερόχθων,
    αγωνιστής της Επανάστασης και αρχηγός του γαλλικού κόμματος. Απάντησε με την ιστορία
    και όχι με το δίκαιο. Η Ελλάδα, είπε, βρισκόταν λόγω της θέσης της στο κέντρο της
    Ευρώπης, προορισμένη με την πτώση της να φωτίσει τη Δύση και με την αναγέννησή της
    να φωτίσει την Ανατολή. Το Βασίλειο της Ελλάδος δεν ήταν η Ελλάδα, αλλά μόνο ένα
    μέρος της, το μικρότερο και φτωχότερο. Ο ελληνισμός είχε δύο κέντρα: την Αθήνα,
    πρωτεύουσα του βασιλείου, και την Κωνσταντινούπολη, τη μεγάλη πρωτεύουσα, το όνειρο
    και την ελπίδα όλων των Ελλήνων.

    Ο λόγος δεν κέρδισε την ψηφοφορία για την οποία εκφωνήθηκε: η Συνέλευση υιοθέτησε
    παρ' όλα αυτά τη διάκριση ανάμεσα στις δύο ομάδες. Ούτε επινόησε ο Κωλέττης τη
    φράση. Ο ποιητής Αλέξανδρος Σούτσος είχε χρησιμοποιήσει σχεδόν τις ίδιες λέξεις σε
    πολιτικό δράμα του 1843, και η απήχηση του λόγου οφειλόταν εν μέρει στο ότι ο όρος
    κυκλοφορούσε ήδη. Ορισμένοι ιστορικοί τον διαβάζουν ως επιχείρημα για την ιθαγένεια,
    ότι δηλαδή όποιος είχε πολεμήσει το 1821 είχε δικαίωμα στο κράτος όπου κι αν είχε
    γεννηθεί, και όχι ως κάλεσμα για επέκταση. Ένα ελληνικό έργο αναφοράς χρονολογεί
    τον λόγο στις 11 Ιανουαρίου. Οι περισσότερες πηγές δίνουν τη 14η.

    Ο Κωλέττης έγινε πρωθυπουργός τον Αύγουστο του 1844 και κυβέρνησε ως τον θάνατό του
    το 1847. Εκείνο που είχε δώσει ήταν ένα όνομα, και μαζί του ένα μέτρο με το οποίο
    κρίθηκε κάθε επόμενη κυβέρνηση: επί ογδόντα χρόνια η απελευθέρωση των αλύτρωτων
    Ελλήνων ήταν ο διακηρυγμένος σκοπός του κράτους, και εγκαταλείφθηκε μόνο μετά το
    1922.
