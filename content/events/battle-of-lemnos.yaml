id: battle-of-lemnos
title:
  en: The naval battle of Lemnos
  el: Η ναυμαχία της Λήμνου
summary:
  en: >
    A month after Elli the Ottoman fleet tried once more to break out of the Dardanelles,
    hoping to draw the Greeks away and slip a raider into the Aegean. It was engaged at long
    range south-east of Lemnos for about two hours and withdrew with 41 dead and 104
    wounded against one Greek wounded. Both Ottoman battleships and the ironclad were
    damaged. The fleet did not come out again for the rest of the war, which is why the
    Aegean islands were Greek in fact before anyone negotiated over them.
  el: >
    Έναν μήνα μετά την Έλλη ο οθωμανικός στόλος δοκίμασε ξανά να διασπάσει τον αποκλεισμό
    των Δαρδανελλίων, ελπίζοντας να παρασύρει τους Έλληνες μακριά και να περάσει ένα
    καταδρομικό στο Αιγαίο. Δέχθηκε μάχη από μεγάλη απόσταση νοτιοανατολικά της Λήμνου επί
    δύο περίπου ώρες και αποσύρθηκε με 41 νεκρούς και 104 τραυματίες, έναντι ενός Έλληνα
    τραυματία. Υπέστησαν ζημιές και τα δύο οθωμανικά θωρηκτά καθώς και το παλαιό θωρακισμένο
    Μεσουδιέ. Ο στόλος δεν ξαναβγήκε ως το τέλος του πολέμου, και γι' αυτό τα νησιά του
    Αιγαίου ήταν ελληνικά στην πράξη πριν καν αρχίσει η διαπραγμάτευση γι' αυτά.
body:
  en: |
    The Greek line on 5/18 January 1913 was the Georgios Averof, the elderly ironclads
    Hydra, Spetsai and Psara and seven destroyers, working out of the base at Moudros on
    Lemnos that the fleet had taken in October. The Ottomans came out with the
    pre-dreadnoughts Barbaros Hayreddin and Turgut Reis, the ironclad Mesudiye, a protected
    cruiser and five destroyers, again under Ramiz Bey.

    Kountouriotis used the Averof as he had at Elli, working up speed and engaging ahead of
    his own line. The action was fought at long range and lasted about two hours before the
    Ottoman ships turned for the straits. A separate Ottoman operation was under way at the
    same time: the cruiser Hamidiye had slipped out on 14/27 January to raid Greek shipping
    and draw the Averof away from the Dardanelles. She did considerable damage and achieved
    nothing strategic, because Kountouriotis refused to chase her.

    Lemnos confirmed what Elli had established. The Ottoman navy was shut in for good, the
    Greek fleet was free to finish taking the north-eastern Aegean, and the Ottoman armies
    in Europe fought the rest of the war without reinforcement from Asia.
  el: |
    Η ελληνική παράταξη στις 5/18 Ιανουαρίου 1913 ήταν ο Γεώργιος Αβέρωφ, τα παλαιά θωρηκτά
    Ύδρα, Σπέτσαι και Ψαρά και επτά αντιτορπιλικά, με βάση τον Μούδρο της Λήμνου, που ο
    στόλος είχε καταλάβει τον Οκτώβριο. Οι Οθωμανοί βγήκαν με τα προ-δρεδνότ Μπαρμπαρός
    Χαϊρεντίν και Τουργκούτ Ρέις, το θωρηκτό Μεσουδιέ, ένα καταδρομικό και πέντε
    αντιτορπιλικά, πάλι υπό τον Ραμίζ μπέη.

    Ο Κουντουριώτης χρησιμοποίησε τον Αβέρωφ όπως και στην Έλλη, αναπτύσσοντας ταχύτητα και
    εμπλεκόμενος μπροστά από τη δική του γραμμή. Η μάχη δόθηκε από μεγάλη απόσταση και
    κράτησε περίπου δύο ώρες, ώσπου τα οθωμανικά πλοία πήραν τον δρόμο για τα στενά.
    Ταυτόχρονα εξελισσόταν και μια δεύτερη οθωμανική επιχείρηση: το καταδρομικό Χαμηδιέ είχε
    ξεγλιστρήσει στις 14/27 Ιανουαρίου για να πλήξει την ελληνική ναυτιλία και να τραβήξει
    τον Αβέρωφ μακριά από τα Δαρδανέλλια. Προκάλεσε σημαντικές ζημιές και καμία στρατηγική
    αλλαγή, επειδή ο Κουντουριώτης αρνήθηκε να το καταδιώξει.

    Η Λήμνος επιβεβαίωσε ό,τι είχε εδραιώσει η Έλλη. Το οθωμανικό ναυτικό έμεινε κλεισμένο
    οριστικά, ο ελληνικός στόλος ήταν ελεύθερος να ολοκληρώσει την κατάληψη του
    βορειοανατολικού Αιγαίου, και οι οθωμανικοί στρατοί στην Ευρώπη πολέμησαν τον υπόλοιπο
    πόλεμο χωρίς ενισχύσεις από την Ασία.
