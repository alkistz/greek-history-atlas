id: assassination-of-lambrakis
title:
  en: The Assassination of Grigoris Lambrakis
  el: Η δολοφονία του Γρηγόρη Λαμπράκη
summary:
  en: >
    On the evening of 22 May 1963, after speaking at a peace meeting in Thessaloniki, the
    opposition deputy Grigoris Lambrakis was clubbed on the head by two men riding a
    three-wheeled delivery vehicle, in front of a crowd and in the presence of police. He died
    five days later. The investigating magistrate Christos Sartzetakis traced the assailants to
    senior gendarmerie and army officers in the city, and several were prosecuted. The killing
    put the word para-state at the centre of Greek politics, damaged the Karamanlis government
    beyond repair and produced the letter Z, for he lives, as the emblem of a movement.
  el: >
    Το βράδυ της 22ας Μαΐου 1963, αφού μίλησε σε αντιπολεμική συγκέντρωση στη Θεσσαλονίκη, ο
    βουλευτής της αντιπολίτευσης Γρηγόρης Λαμπράκης χτυπήθηκε στο κεφάλι με λοστό από δύο άνδρες
    πάνω σε τρίκυκλο, μπροστά σε πλήθος και παρουσία αστυνομικών. Πέθανε πέντε μέρες αργότερα. Ο
    ανακριτής Χρήστος Σαρτζετάκης οδήγησε την έρευνα ως την ανώτερη ηγεσία της χωροφυλακής και του
    στρατού στην πόλη, και ορισμένοι αξιωματικοί παραπέμφθηκαν. Η δολοφονία έφερε τη λέξη
    παρακράτος στο κέντρο της ελληνικής πολιτικής, έπληξε ανεπανόρθωτα την κυβέρνηση Καραμανλή και
    γέννησε το γράμμα Ζ, ζει, ως έμβλημα ενός κινήματος.
body:
  en: |
    Lambrakis was a physician and professor of obstetrics, a Balkan Games champion in his youth,
    and an EDA deputy for Piraeus who had become the best-known face of the Greek peace movement.
    A month before his death he had defied a police ban on the Marathon to Athens peace march of
    21 April 1963 by walking the route alone, protected by his parliamentary immunity. The
    photographs of that walk made him a national figure.

    He spoke in Thessaloniki on 22 May at an anti-nuclear meeting held under police protection that
    did not protect him. Spyros Gotzamanis and Emmanouil Emmanouilidis, men from far-right
    paramilitary circles, drove a three-wheeled delivery vehicle into the street outside and one of
    them struck him on the head with a club as they passed. He suffered severe brain injury and
    died on 27 May.

    Christos Sartzetakis, then a young investigating magistrate, followed the case past the two
    attackers into the Thessaloniki gendarmerie and army command, and established links between the
    assailants and senior officers. Several were prosecuted. The convictions that were eventually
    obtained were limited, and how far up the state the responsibility ran remains argued over; the
    junta expelled Sartzetakis from the judiciary in 1968, and he was President of the Republic from
    1985 to 1990.

    The funeral in Athens on 28 May drew crowds estimated at up to half a million. The single letter
    Z, for zei, he lives, was written on walls across the country and gave its title to Vassilis
    Vassilikos's novel of 1966 and to Costa-Gavras's film of 1969, through which the case became one
    of the few episodes of Greek politics known worldwide. The Lambrakis Democratic Youth, founded
    afterwards, became the largest youth movement of the Greek Left in the 1960s. Karamanlis
    resigned two weeks after the funeral, over a different quarrel, and the Centre Union won the
    election that November.
  el: |
    Ο Λαμπράκης ήταν γιατρός και καθηγητής της Μαιευτικής, πρωταθλητής των Βαλκανικών Αγώνων στα
    νιάτα του και βουλευτής Πειραιώς με την ΕΔΑ, που είχε γίνει το πιο γνωστό πρόσωπο του ελληνικού
    κινήματος ειρήνης. Έναν μήνα πριν από τον θάνατό του είχε παραβιάσει την αστυνομική απαγόρευση
    της πορείας ειρήνης Μαραθώνα προς Αθήνα στις 21 Απριλίου 1963, βαδίζοντας μόνος τη διαδρομή υπό
    την κάλυψη της βουλευτικής του ασυλίας. Οι φωτογραφίες εκείνης της πορείας τον έκαναν πανελλήνια
    μορφή.

    Μίλησε στη Θεσσαλονίκη στις 22 Μαΐου σε αντιπυρηνική συγκέντρωση που έγινε υπό αστυνομική
    προστασία η οποία δεν τον προστάτευσε. Ο Σπύρος Γκοτζαμάνης και ο Εμμανουήλ Εμμανουηλίδης,
    άνθρωποι των ακροδεξιών παρακρατικών κύκλων, όρμησαν με τρίκυκλο στον δρόμο έξω από την αίθουσα
    και ο ένας τον χτύπησε στο κεφάλι με λοστό καθώς περνούσαν. Υπέστη βαριά εγκεφαλική κάκωση και
    πέθανε στις 27 Μαΐου.

    Ο Χρήστος Σαρτζετάκης, τότε νεαρός ανακριτής, παρακολούθησε την υπόθεση πέρα από τους δύο
    δράστες, μέσα στη χωροφυλακή και στη στρατιωτική διοίκηση της Θεσσαλονίκης, και τεκμηρίωσε
    διασυνδέσεις των δραστών με ανώτερους αξιωματικούς. Ορισμένοι παραπέμφθηκαν. Οι καταδίκες που
    τελικά επιτεύχθηκαν ήταν περιορισμένες, και το πόσο ψηλά έφτανε η ευθύνη μέσα στον κρατικό
    μηχανισμό παραμένει αντικείμενο διαμάχης. Η χούντα απέβαλε τον Σαρτζετάκη από το δικαστικό σώμα
    το 1968, και αργότερα διετέλεσε Πρόεδρος της Δημοκρατίας από το 1985 ως το 1990.

    Η κηδεία στην Αθήνα στις 28 Μαΐου συγκέντρωσε πλήθος που υπολογίστηκε ως και σε μισό εκατομμύριο
    ανθρώπους. Το γράμμα Ζ, δηλαδή ζει, γράφτηκε σε τοίχους σε όλη τη χώρα και έδωσε τον τίτλο στο
    μυθιστόρημα του Βασίλη Βασιλικού το 1966 και στην ταινία του Κώστα Γαβρά το 1969, μέσω των
    οποίων η υπόθεση έγινε ένα από τα ελάχιστα επεισόδια της ελληνικής πολιτικής που έγιναν γνωστά
    παγκοσμίως. Η Δημοκρατική Νεολαία Λαμπράκη, που ιδρύθηκε στη συνέχεια, έγινε το μεγαλύτερο
    νεολαιίστικο κίνημα της ελληνικής Αριστεράς στη δεκαετία του 1960. Ο Καραμανλής παραιτήθηκε δύο
    εβδομάδες μετά την κηδεία, για άλλη διαφορά, και η Ένωση Κέντρου κέρδισε τις εκλογές του
    Νοεμβρίου.
