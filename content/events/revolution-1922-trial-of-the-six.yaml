id: revolution-1922-trial-of-the-six
title:
  en: The Revolution of 11 September 1922 and the Trial of the Six
  el: Η Επανάσταση της 11ης Σεπτεμβρίου 1922 και η Δίκη των Έξι
summary:
  en: >
    The units evacuated from Asia Minor to Chios and Lesvos rose on 24 September 1922
    under Colonels Plastiras and Gonatas, landed at Lavrio with about 12,000 men, and
    forced Constantine to abdicate within days. Eight ministers and commanders of the
    1920 to 1922 governments were tried for high treason; six, among them three former
    prime ministers and the last commander-in-chief in Anatolia, were shot at Goudi
    within hours of the verdict on 28 November. Britain broke off diplomatic relations.
    The Greek Supreme Court annulled the convictions in 2010, finding the trial unfair.
  el: >
    Οι μονάδες που είχαν αποσυρθεί από τη Μικρά Ασία στη Χίο και τη Λέσβο στασίασαν στις 24
    Σεπτεμβρίου 1922 υπό τους συνταγματάρχες Πλαστήρα και Γονατά, αποβιβάστηκαν στο Λαύριο με
    περίπου 12.000 άνδρες και εξανάγκασαν τον Κωνσταντίνο σε παραίτηση μέσα σε λίγες ημέρες.
    Οκτώ υπουργοί και στρατιωτικοί των κυβερνήσεων του 1920 ως 1922 δικάστηκαν για εσχάτη
    προδοσία· έξι, ανάμεσά τους τρεις πρώην πρωθυπουργοί και ο τελευταίος αρχιστράτηγος στην
    Ανατολία, τυφεκίστηκαν στο Γουδί λίγες ώρες μετά την ετυμηγορία, στις 28 Νοεμβρίου. Η
    Βρετανία διέκοψε τις διπλωματικές σχέσεις. Ο Άρειος Πάγος ακύρωσε τις καταδίκες το 2010,
    κρίνοντας ότι η δίκη δεν υπήρξε δίκαιη.
body:
  en: |
    The Revolutionary Committee was proclaimed on 24 September 1922 by Colonel Nikolaos
    Plastiras, Colonel Stylianos Gonatas and Commander Dimitrios Fokas. Aircraft dropped
    its manifesto over Athens the next day: the King to abdicate, parliament to be
    dissolved, a government acceptable to the Entente, and the Eastern Thrace front to be
    reinforced at once. The ships reached Lavrio on 26 September with about 12,000 men
    and supporting warships, and the government in Athens had nothing to put against
    them. Constantine abdicated on 27 September in favour of his eldest son, George II,
    and left for Italy, where he died at Palermo on 11 January 1923. Revolutionary troops
    entered Athens on 28 September. Sotirios Krokidas formed a government and Gonatas
    replaced him on 27 November.

    Eight political and military leaders of the 1920 to 1922 governments were arrested and
    charged with high treason. The indictment was that they had damaged the national
    interest and strained relations with the Allies, and so caused the defeat: a charge
    of political misjudgement tried as a capital crime. The court martial opened on 13
    November 1922 and gave its verdict on 28 November. Six were sentenced to death:
    Dimitrios Gounaris, Petros Protopapadakis and Nikolaos Stratos, all former prime
    ministers, the foreign minister Georgios Baltatzis, the minister of military affairs
    Nikolaos Theotokis, and General Georgios Hatzianestis. General Xenophon Stratigos and
    Admiral Michail Goudas received life imprisonment.

    The six were shot at Goudi within hours. Gounaris was gravely ill with typhus and was
    carried to the firing squad from his hospital bed. Britain withdrew its minister from
    Athens in protest and broke off relations; Swedish and Dutch appeals for clemency had
    already failed. Whether the executions were a judicial murder or a legitimate
    reckoning with the men who lost Anatolia was argued in Greece for the rest of the
    century, and the argument tracked the Venizelist and royalist division exactly. In
    2010 the Areios Pagos annulled the convictions on the ground that the trial had not
    been fair. The revolution led on to the abolition of the monarchy: George II left the
    country in December 1923 and the Second Hellenic Republic was proclaimed on 25 March
    1924.
  el: |
    Η Επαναστατική Επιτροπή ανακηρύχθηκε στις 24 Σεπτεμβρίου 1922 από τον συνταγματάρχη Νικόλαο
    Πλαστήρα, τον συνταγματάρχη Στυλιανό Γονατά και τον πλωτάρχη Δημήτριο Φωκά. Αεροπλάνα
    έριξαν το μανιφέστο πάνω από την Αθήνα την επομένη: παραίτηση του βασιλιά, διάλυση της
    Βουλής, κυβέρνηση αποδεκτή από την Αντάντ και άμεση ενίσχυση του μετώπου της Ανατολικής
    Θράκης. Τα πλοία έφτασαν στο Λαύριο στις 26 Σεπτεμβρίου με περίπου 12.000 άνδρες και
    συνοδεία πολεμικών, και η κυβέρνηση των Αθηνών δεν είχε τίποτε να τους αντιτάξει. Ο
    Κωνσταντίνος παραιτήθηκε στις 27 Σεπτεμβρίου υπέρ του πρωτότοκου γιου του Γεωργίου Β΄ και
    έφυγε για την Ιταλία, όπου πέθανε στο Παλέρμο στις 11 Ιανουαρίου 1923. Τα επαναστατικά
    τμήματα μπήκαν στην Αθήνα στις 28 Σεπτεμβρίου. Ο Σωτήριος Κροκιδάς σχημάτισε κυβέρνηση και
    τον διαδέχθηκε ο Γονατάς στις 27 Νοεμβρίου.

    Οκτώ πολιτικοί και στρατιωτικοί ηγέτες των κυβερνήσεων του 1920 ως 1922 συνελήφθησαν και
    κατηγορήθηκαν για εσχάτη προδοσία. Το κατηγορητήριο έλεγε ότι είχαν βλάψει το εθνικό
    συμφέρον και είχαν κλονίσει τις σχέσεις με τους Συμμάχους, προκαλώντας έτσι την ήττα:
    κατηγορία για πολιτική αστοχία που δικάστηκε ως κεφαλικό έγκλημα. Το έκτακτο στρατοδικείο
    άνοιξε στις 13 Νοεμβρίου 1922 και εξέδωσε την απόφασή του στις 28 Νοεμβρίου. Έξι
    καταδικάστηκαν σε θάνατο: ο Δημήτριος Γούναρης, ο Πέτρος Πρωτοπαπαδάκης και ο Νικόλαος
    Στράτος, και οι τρεις πρώην πρωθυπουργοί, ο υπουργός Εξωτερικών Γεώργιος Μπαλτατζής, ο
    υπουργός Στρατιωτικών Νικόλαος Θεοτόκης και ο στρατηγός Γεώργιος Χατζηανέστης. Ο στρατηγός
    Ξενοφών Στρατηγός και ο ναύαρχος Μιχαήλ Γούδας καταδικάστηκαν σε ισόβια.

    Οι έξι τυφεκίστηκαν στο Γουδί μέσα σε λίγες ώρες. Ο Γούναρης ήταν βαριά άρρωστος από τύφο
    και μεταφέρθηκε στο εκτελεστικό απόσπασμα από το νοσοκομειακό του κρεβάτι. Η Βρετανία
    ανακάλεσε τον πρεσβευτή της από την Αθήνα σε ένδειξη διαμαρτυρίας και διέκοψε τις σχέσεις·
    οι σουηδικές και ολλανδικές παρεμβάσεις για επιείκεια είχαν ήδη αποτύχει. Το αν οι
    εκτελέσεις ήταν δικαστική δολοφονία ή νόμιμη απόδοση ευθυνών στους ανθρώπους που έχασαν την
    Ανατολία συζητήθηκε στην Ελλάδα για τον υπόλοιπο αιώνα, και η συζήτηση ακολούθησε ακριβώς
    τη διαχωριστική γραμμή βενιζελικών και βασιλικών. Το 2010 ο Άρειος Πάγος ακύρωσε τις
    καταδίκες με το σκεπτικό ότι η δίκη δεν υπήρξε δίκαιη. Η επανάσταση οδήγησε στην κατάργηση
    της μοναρχίας: ο Γεώργιος Β΄ έφυγε από τη χώρα τον Δεκέμβριο του 1923 και η Β΄ Ελληνική
    Δημοκρατία ανακηρύχθηκε στις 25 Μαρτίου 1924.
