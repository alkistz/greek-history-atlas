id: ioannidis-coup-1973
title:
  en: The Ioannidis Coup
  el: Το πραξικόπημα Ιωαννίδη
summary:
  en: >
    Eight days after the Polytechnic was cleared, the commander of the Military Police
    deposed Papadopoulos in a bloodless coup inside the regime and put him under house
    arrest. Brigadier Dimitrios Ioannidis took no office himself. A lieutenant general
    was made President and a lawyer Prime Minister while Ioannidis governed from the ESA
    headquarters, which is why Greek accounts call him the invisible dictator. The
    elections promised for 1974 were cancelled, censorship and the interrogation cells
    were tightened, and within eight months his Cyprus policy had destroyed the regime.
  el: >
    Οκτώ μέρες μετά την εκκένωση του Πολυτεχνείου, ο διοικητής της Στρατιωτικής
    Αστυνομίας καθαίρεσε τον Παπαδόπουλο με αναίμακτο εσωτερικό πραξικόπημα και τον
    έθεσε σε κατ' οίκον περιορισμό. Ο ταξίαρχος Δημήτριος Ιωαννίδης δεν ανέλαβε ο ίδιος
    κανένα αξίωμα. Πρόεδρος έγινε ένας αντιστράτηγος και πρωθυπουργός ένας δικηγόρος,
    ενώ ο Ιωαννίδης κυβερνούσε από το αρχηγείο της ΕΣΑ, γι' αυτό και η ελληνική
    βιβλιογραφία τον αποκαλεί αόρατο δικτάτορα. Οι εκλογές που είχαν υποσχεθεί για το
    1974 ματαιώθηκαν, η λογοκρισία και τα ανακριτικά κρατητήρια σκλήρυναν, και μέσα σε
    οκτώ μήνες η πολιτική του για την Κύπρο διέλυσε το καθεστώς.
body:
  en: |
    The stated charge against Papadopoulos was that he had betrayed the revolution of
    21 April by opening the system up. The occasion was the Polytechnic. Ioannidis
    argued that the liberalisation had produced the disorder and that the army had to
    take the regime back. On 25 November 1973 he deposed the President, dismissed the
    civilian government of Spyros Markezinis appointed seven weeks earlier, and
    installed Lieutenant General Phaedon Gizikis as President with Adamantios
    Androutsopoulos as Prime Minister.

    Power now ran through a police organisation rather than a cabinet. The Military
    Police, ESA, held the interrogation centre known as EAT-ESA in Athens, where
    prisoners were beaten, hung by the wrists and kept standing for days; its officers
    were tried separately in 1975 and the evidence given at that trial is the reason the
    place is documented at all. Martial law and censorship, which had been relaxed in
    1973, went back to their earlier severity.

    Ioannidis had one foreign policy, which was enosis with Cyprus, and one obstacle to
    it, which was Archbishop Makarios. That policy produced the coup in Nicosia on
    15 July 1974, the Turkish landing five days later, and the collapse of the regime
    eight days after that. At the trials that followed he was sentenced to life for the
    coup of 1967 and to seven further life sentences for the Polytechnic. He never left
    custody and died in 2010.
  el: |
    Η κατηγορία εναντίον του Παπαδόπουλου ήταν ότι πρόδωσε την «επανάσταση της 21ης
    Απριλίου» ανοίγοντας το σύστημα. Η αφορμή ήταν το Πολυτεχνείο. Ο Ιωαννίδης
    υποστήριξε ότι η φιλελευθεροποίηση γέννησε την αναταραχή και ότι ο στρατός όφειλε να
    πάρει πίσω το καθεστώς. Στις 25 Νοεμβρίου 1973 καθαίρεσε τον πρόεδρο, διέλυσε την
    πολιτική κυβέρνηση Μαρκεζίνη που είχε οριστεί επτά εβδομάδες νωρίτερα, και
    εγκατέστησε πρόεδρο τον αντιστράτηγο Φαίδωνα Γκιζίκη με πρωθυπουργό τον Αδαμάντιο
    Ανδρουτσόπουλο.

    Η εξουσία περνούσε πλέον μέσα από έναν αστυνομικό μηχανισμό και όχι από υπουργικό
    συμβούλιο. Η ΕΣΑ διατηρούσε στην Αθήνα το ανακριτικό κέντρο του ΕΑΤ-ΕΣΑ, όπου
    κρατούμενοι ξυλοκοπούνταν, κρεμιούνταν από τους καρπούς και κρατιούνταν όρθιοι επί
    μέρες. Οι αξιωματικοί του δικάστηκαν χωριστά το 1975 και οι καταθέσεις εκείνης της
    δίκης είναι ο λόγος που ο τόπος αυτός είναι καταγεγραμμένος. Ο στρατιωτικός νόμος
    και η λογοκρισία, που είχαν χαλαρώσει το 1973, επανήλθαν στην παλιά τους αυστηρότητα.

    Ο Ιωαννίδης είχε μία εξωτερική πολιτική, την ένωση της Κύπρου με την Ελλάδα, και ένα
    εμπόδιο σε αυτήν, τον αρχιεπίσκοπο Μακάριο. Αυτή η πολιτική οδήγησε στο πραξικόπημα
    της Λευκωσίας στις 15 Ιουλίου 1974, στην τουρκική απόβαση πέντε μέρες μετά και στην
    κατάρρευση του καθεστώτος οκτώ μέρες αργότερα. Στις δίκες που ακολούθησαν
    καταδικάστηκε σε ισόβια για το πραξικόπημα του 1967 και σε επτά ακόμη ισόβια για το
    Πολυτεχνείο. Δεν βγήκε ποτέ από τη φυλακή και πέθανε το 2010.
