id: battle-of-crete
title:
  en: The Battle of Crete
  el: Η Μάχη της Κρήτης
summary:
  en: >
    Germany took Crete in twelve days by dropping paratroops on its airfields, the first
    airborne invasion of an island ever attempted. Maleme fell on the second day and
    decided the campaign; the garrison was evacuated from the south coast and organised
    resistance ended on 1 June 1941. Cretan civilians fought beside the Allied troops with
    shotguns and farm tools, and the Germans answered with the first mass reprisals of the
    occupation, at Kondomari and Kandanos. The airborne divisions lost so heavily that
    Hitler ordered no further large drops, and the king and his government left for Egypt
    to spend the rest of the war in exile.
  el: >
    Η Γερμανία κατέλαβε την Κρήτη σε δώδεκα μέρες ρίχνοντας αλεξιπτωτιστές στα αεροδρόμιά
    της, στην πρώτη αερομεταφερόμενη εισβολή σε νησί που επιχειρήθηκε ποτέ. Το Μάλεμε έπεσε
    τη δεύτερη μέρα και έκρινε την εκστρατεία: η φρουρά αποσύρθηκε από τη νότια ακτή και η
    οργανωμένη αντίσταση έληξε την 1η Ιουνίου 1941. Οι Κρητικοί πολέμησαν πλάι στους
    συμμαχικούς σχηματισμούς με κυνηγετικά όπλα και εργαλεία, και οι Γερμανοί απάντησαν με
    τα πρώτα ομαδικά αντίποινα της Κατοχής, στο Κοντομαρί και στην Κάνδανο. Οι απώλειες των
    αερομεταφερόμενων μεραρχιών ήταν τόσο βαριές που ο Χίτλερ απαγόρευσε νέες μεγάλες
    ρίψεις, ενώ ο βασιλιάς και η κυβέρνηση έφυγαν για την Αίγυπτο και πέρασαν εξόριστοι
    τον υπόλοιπο πόλεμο.
body:
  en: |
    Operation Merkur opened at dawn on 20 May 1941 against Maleme, Chania, Rethymno and
    Heraklion. Crete was held by some 40,000 British, New Zealand, Australian and Greek
    troops under Major-General Bernard Freyberg, many of them landed from the mainland
    days earlier without artillery, transport or air cover. The first day cost the
    Fallschirmjäger of General Kurt Student so dearly that the operation was close to
    failure; it was saved on the night of 20 to 21 May, when New Zealand units gave up
    Hill 107 above the Maleme airfield. The Germans took the field the next morning and
    began landing reinforcements by transport aircraft.

    German casualties came to about 5,894, with 1,032 killed, and 284 aircraft lost. The
    Allies lost roughly 23,000, most of them prisoners: more than 3,579 Commonwealth
    killed or missing and 12,254 captured, with over 544 Greeks killed or missing and
    5,225 captured. King George II and the government crossed the White Mountains on foot
    and were taken off the south coast on the night of 23 to 24 May; the surviving Allied
    troops were lifted from Sfakia between 28 May and 1 June. The last organised
    resistance ended with the surrender of 1 June, and Student took command of the island.

    Because armed civilians had fought, the Germans treated the population as illegal
    combatants. Firing squads shot villagers at Kondomari on 2 June 1941, and Kandanos
    was razed on 3 June with about 180 of its inhabitants killed. Crete was designated
    Festung Kreta and garrisoned to the end of the war: its reduced garrison of some
    10,000 men did not surrender until 12 May 1945. The cost to the German airborne arm
    ended its career as an assault force, and the victory secured the southern Aegean
    five weeks before the invasion of the Soviet Union.
  el: |
    Η επιχείρηση Ερμής άνοιξε την αυγή της 20ής Μαΐου 1941 εναντίον του Μάλεμε, των Χανίων,
    του Ρεθύμνου και του Ηρακλείου. Την Κρήτη κρατούσαν περίπου 40.000 Βρετανοί,
    Νεοζηλανδοί, Αυστραλοί και Έλληνες υπό τον υποστράτηγο Μπέρναρντ Φρέιμπεργκ, πολλοί
    αποβιβασμένοι από την ηπειρωτική Ελλάδα λίγες μέρες νωρίτερα, χωρίς πυροβολικό,
    μεταφορικά μέσα ή αεροπορική κάλυψη. Η πρώτη μέρα στοίχισε στους αλεξιπτωτιστές του
    στρατηγού Κουρτ Στούντεντ τόσο ακριβά ώστε η επιχείρηση κόντεψε να αποτύχει. Τη
    διέσωσε η νύχτα της 20ής προς 21η Μαΐου, όταν οι νεοζηλανδικές μονάδες εγκατέλειψαν το
    ύψωμα 107 πάνω από το αεροδρόμιο του Μάλεμε. Οι Γερμανοί το κατέλαβαν το επόμενο πρωί
    και άρχισαν να προσγειώνουν ενισχύσεις με μεταγωγικά.

    Οι γερμανικές απώλειες έφτασαν τους 5.894 άνδρες, από τους οποίους 1.032 νεκροί, και
    284 αεροσκάφη. Οι συμμαχικές ήταν περίπου 23.000, κατά το μεγαλύτερο μέρος αιχμάλωτοι:
    πάνω από 3.579 νεκροί ή αγνοούμενοι της Κοινοπολιτείας και 12.254 αιχμάλωτοι, με πάνω
    από 544 Έλληνες νεκρούς ή αγνοούμενους και 5.225 αιχμαλώτους. Ο Γεώργιος Β΄ και η
    κυβέρνηση πέρασαν τα Λευκά Όρη με τα πόδια και παραλήφθηκαν από τη νότια ακτή τη νύχτα
    της 23ης προς 24η Μαΐου. Τα υπολείμματα των συμμαχικών δυνάμεων απομακρύνθηκαν από τη
    Χώρα Σφακίων μεταξύ 28 Μαΐου και 1ης Ιουνίου, και η οργανωμένη αντίσταση έληξε με την
    παράδοση της 1ης Ιουνίου. Ο Στούντεντ ανέλαβε τη διοίκηση του νησιού.

    Επειδή είχαν πολεμήσει ένοπλοι πολίτες, οι Γερμανοί αντιμετώπισαν τον πληθυσμό ως
    παράνομους μαχητές. Στο Κοντομαρί εκτελέστηκαν χωρικοί στις 2 Ιουνίου 1941 και στις 3
    Ιουνίου ισοπεδώθηκε η Κάνδανος, με περίπου 180 νεκρούς κατοίκους. Η Κρήτη ονομάστηκε
    Festung Kreta και έμεινε φρουρούμενη ως το τέλος του πολέμου: η μειωμένη φρουρά των
    10.000 περίπου ανδρών παραδόθηκε μόλις στις 12 Μαΐου 1945. Το τίμημα τερμάτισε τη
    σταδιοδρομία του γερμανικού αερομεταφερόμενου όπλου ως δύναμης εφόδου, ενώ η νίκη
    εξασφάλισε το νότιο Αιγαίο πέντε εβδομάδες πριν από την εισβολή στη Σοβιετική Ένωση.
