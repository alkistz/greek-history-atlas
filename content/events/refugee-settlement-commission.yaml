id: refugee-settlement-commission
title:
  en: The settlement of the Asia Minor refugees
  el: Η αποκατάσταση των προσφύγων της Μικράς Ασίας
summary:
  en: >
    The compulsory exchange of populations agreed at Lausanne put between 1.2 and 1.5
    million Orthodox Christians into a country of under six million. The League of Nations
    created an autonomous Refugee Settlement Commission, which began work in Athens on 11
    November 1923, borrowed abroad and was given the land the departing Muslims had left.
    By the time it closed at the end of 1930 it had settled 578,824 people in 2,085 rural
    settlements and built some 27,600 urban dwellings. The 1928 census counted 1,221,849
    refugees in all, of whom 1,164,267 had come from Asia Minor: roughly one inhabitant
    in five, and the two figures are often quoted against each other as though one of
    them were wrong.
  el: >
    Η υποχρεωτική ανταλλαγή πληθυσμών που συμφωνήθηκε στη Λωζάνη έφερε στην Ελλάδα, μια
    χώρα κάτω των έξι εκατομμυρίων, ανάμεσα σε 1,2 και 1,5 εκατομμύριο ορθόδοξους
    χριστιανούς. Η Κοινωνία των Εθνών συγκρότησε αυτόνομη Επιτροπή Αποκαταστάσεως Προσφύγων,
    που άρχισε να λειτουργεί στην Αθήνα στις 11 Νοεμβρίου 1923, δανείστηκε από το εξωτερικό
    και πήρε ως περιουσία τη γη που άφησαν οι μουσουλμάνοι. Ως το κλείσιμό της, στα τέλη του
    1930, είχε εγκαταστήσει 578.824 ανθρώπους σε 2.085 αγροτικούς συνοικισμούς και είχε
    χτίσει περί τις 27.600 αστικές κατοικίες. Η απογραφή του 1928 μέτρησε 1.221.849
    πρόσφυγες συνολικά, από τους οποίους 1.164.267 είχαν έρθει από τη Μικρά Ασία:
    περίπου έναν στους πέντε κατοίκους, και οι δύο αριθμοί συχνά αντιπαρατίθενται σαν
    να ήταν ο ένας από τους δύο λάθος.
body:
  en: |
    The Convention on the Exchange of Greek and Turkish Populations, signed at Lausanne on
    30 January 1923, made compulsory a movement most of whose Christians had already fled.
    Between 1.2 and 1.5 million Orthodox Christians came to Greece and some 355,000 to
    500,000 Muslims left it; the Greeks of Constantinople and the Muslims of Western Thrace
    were exempted. The Greek state had just lost a war, defaulted on its credit and changed
    its regime, and it could not house or feed them. At its own request the League of
    Nations set up the Refugee Settlement Commission under a Geneva protocol of late
    September 1923, and the Commission opened in Athens on 11 November.

    It was deliberately built to be independent of Greek politics. It had its own legal
    personality and four members: two named by Athens, Stephanos Delta and Perikles
    Argyropoulos, and two by the League, with an American as chairman. Henry Morgenthau
    senior, the former United States ambassador in Constantinople, held the chair first and
    was followed by Charles P. Howland and Charles B. Eddy; John Campbell of the Bank of
    England sat as the British member. Two foreign refugee loans, floated in 1924 and 1928,
    raised roughly 12.3 million pounds. Its other endowment was land: the abandoned
    exchangeable properties of Muslims and Bulgarians, state land and monastery estates,
    some five million stremmata of arable in all.

    The settlement was overwhelmingly rural and overwhelmingly northern. Macedonia took
    638,253 refugees, 52.2 per cent of the total, and Western Thrace 107,607. Land that had
    been worked by Muslim and Slav-speaking cultivators was redistributed to Anatolian and
    Pontic families, and Greek Macedonia went from a province of mixed religion and language
    to an overwhelmingly Greek-speaking one within a decade. That is the fact that made the
    conquests of 1912, 1913 and 1919 permanent. The urban half of the story is written into
    the map of Athens, Piraeus and Thessaloniki: Nea Smyrni, Nea Ionia, Nea Philadelpheia,
    Kokkinia, Drapetsona, Kalamaria, Nea Moudania, most of them beginning as quarters of
    wood and tin.

    The economic consequence was an industrial workforce Greece had not had before. Refugee
    carpet weaving, textiles, silk and above all tobacco processing grew fast, and tobacco
    grown by refugees in Macedonia and Thrace became the country's leading export, which is
    why the collapse of tobacco prices after 1929 hit the refugee population first and
    hardest. Different sources count families, persons and settlements on different bases
    and to different cut-off years, so the totals are orders of magnitude rather than
    audited figures; the census count of 1928 is the firm one. The Commission was dissolved
    at the end of December 1930, its assets and obligations passing to the Greek state,
    rural settlement to the Ministry of Agriculture and urban settlement to the Ministry of
    Welfare. Compensation for what had been left behind in Anatolia was never paid, and the
    Ankara Convention of 1930 closed that question against the refugees.
  el: |
    Η Σύμβαση περί ανταλλαγής των ελληνικών και τουρκικών πληθυσμών, που υπογράφηκε στη
    Λωζάνη στις 30 Ιανουαρίου 1923, κατέστησε υποχρεωτική μια μετακίνηση που για τους
    περισσότερους χριστιανούς είχε ήδη συντελεστεί με τη φυγή. Ήρθαν στην Ελλάδα 1,2 έως 1,5
    εκατομμύριο ορθόδοξοι και έφυγαν 355.000 έως 500.000 μουσουλμάνοι· εξαιρέθηκαν οι Έλληνες
    της Κωνσταντινούπολης και οι μουσουλμάνοι της Δυτικής Θράκης. Το ελληνικό κράτος είχε
    μόλις χάσει έναν πόλεμο, είχε χρεοκοπημένη πίστη και αλλαγμένο πολίτευμα, και δεν
    μπορούσε ούτε να τους στεγάσει ούτε να τους θρέψει. Με δική του αίτηση η Κοινωνία των
    Εθνών συγκρότησε την Επιτροπή Αποκαταστάσεως Προσφύγων με πρωτόκολλο της Γενεύης στα
    τέλη Σεπτεμβρίου 1923, και η Επιτροπή άνοιξε στην Αθήνα στις 11 Νοεμβρίου.

    Είχε σχεδιαστεί ώστε να είναι ανεξάρτητη από την ελληνική πολιτική. Διέθετε δική της
    νομική προσωπικότητα και τέσσερα μέλη: δύο οριζόμενα από την Αθήνα, τον Στέφανο Δέλτα
    και τον Περικλή Αργυρόπουλο, και δύο από την Κοινωνία των Εθνών, με Αμερικανό πρόεδρο.
    Πρώτος προήδρευσε ο Χένρυ Μοργκεντάου, πρώην πρεσβευτής των ΗΠΑ στην Κωνσταντινούπολη,
    και ακολούθησαν οι Τσαρλς Χάουλαντ και Τσαρλς Έντι· βρετανικό μέλος ήταν ο Τζον Κάμπελ
    της Τράπεζας της Αγγλίας. Δύο προσφυγικά δάνεια του εξωτερικού, του 1924 και του 1928,
    απέφεραν περίπου 12,3 εκατομμύρια λίρες. Η άλλη περιουσία της ήταν η γη: οι
    εγκαταλελειμμένες ανταλλάξιμες ιδιοκτησίες μουσουλμάνων και Βουλγάρων, δημόσιες εκτάσεις
    και μοναστηριακά κτήματα, περίπου πέντε εκατομμύρια στρέμματα καλλιεργήσιμης γης.

    Η αποκατάσταση ήταν κατά κύριο λόγο αγροτική και κατά κύριο λόγο βόρεια. Η Μακεδονία
    δέχθηκε 638.253 πρόσφυγες, το 52,2% του συνόλου, και η Δυτική Θράκη 107.607. Γη που
    καλλιεργούσαν μουσουλμάνοι και σλαβόφωνοι μοιράστηκε σε μικρασιατικές και ποντιακές
    οικογένειες, και η ελληνική Μακεδονία μετατράπηκε μέσα σε μια δεκαετία από επαρχία
    μεικτής θρησκείας και γλώσσας σε συντριπτικά ελληνόφωνη. Αυτό είναι το γεγονός που
    έκανε μόνιμες τις κατακτήσεις του 1912, του 1913 και του 1919. Το αστικό σκέλος είναι
    γραμμένο στον χάρτη της Αθήνας, του Πειραιά και της Θεσσαλονίκης: Νέα Σμύρνη, Νέα Ιωνία,
    Νέα Φιλαδέλφεια, Κοκκινιά, Δραπετσώνα, Καλαμαριά, Νέα Μουδανιά, οι περισσότερες
    ξεκινώντας ως συνοικίες από σανίδες και λαμαρίνα.

    Η οικονομική συνέπεια ήταν ένα εργατικό δυναμικό που η Ελλάδα δεν είχε ως τότε.
    Ταπητουργία, υφαντουργία, μεταξουργία και προπάντων η επεξεργασία καπνού αναπτύχθηκαν
    γρήγορα, και ο καπνός που καλλιεργούσαν πρόσφυγες στη Μακεδονία και τη Θράκη έγινε το
    πρώτο εξαγώγιμο προϊόν της χώρας· γι' αυτό και η κατάρρευση των τιμών του μετά το 1929
    χτύπησε πρώτους και σκληρότερα τους πρόσφυγες. Οι πηγές μετρούν οικογένειες, άτομα και
    συνοικισμούς με διαφορετικές βάσεις και διαφορετικά χρονικά όρια, ώστε τα σύνολα να
    δίνουν τάξη μεγέθους και όχι ελεγμένο αριθμό· το βέβαιο στοιχείο είναι η απογραφή του
    1928. Η Επιτροπή διαλύθηκε στα τέλη Δεκεμβρίου 1930 και η περιουσία και οι υποχρεώσεις
    της πέρασαν στο ελληνικό κράτος, η αγροτική αποκατάσταση στο Υπουργείο Γεωργίας και η
    αστική στο Υπουργείο Προνοίας. Αποζημίωση για όσα είχαν αφήσει πίσω τους στην Ανατολία
    δεν δόθηκε ποτέ, και η Σύμβαση της Άγκυρας του 1930 έκλεισε το ζήτημα εις βάρος τους.
