id: gorgopotamos-viaduct
title:
  en: "The destruction of the Gorgopotamos viaduct: Operation Harling"
  el: "Η ανατίναξη της γέφυρας του Γοργοποτάμου: η επιχείρηση Χάρλινγκ"
summary:
  en: >
    A twelve-man British sabotage party dropped into central Greece in September 1942 to
    cut the railway carrying supplies to Rommel. On the night of 25 November 1942 it blew
    two spans of the Gorgopotamos viaduct with 86 andartes of ELAS and 52 of EDES holding
    off the Italian guard. The Italians repaired the bridge in nineteen days and El Alamein
    had already been won, so the military effect was small. The political effect was not:
    it was the only joint operation the two rival resistance armies ever carried out, and
    it convinced London to keep a permanent mission in Greece with arms and gold to give.
  el: >
    Βρετανικό κλιμάκιο δώδεκα ανδρών ρίχτηκε με αλεξίπτωτα στην κεντρική Ελλάδα τον
    Σεπτέμβριο του 1942 με εντολή να κόψει τον σιδηρόδρομο που τροφοδοτούσε τον Ρόμμελ. Τη
    νύχτα της 25ης Νοεμβρίου 1942 ανατίναξε δύο ανοίγματα της γέφυρας του Γοργοποτάμου,
    ενώ 86 αντάρτες του ΕΛΑΣ και 52 του ΕΔΕΣ καθήλωναν την ιταλική φρουρά. Οι Ιταλοί
    επισκεύασαν τη γέφυρα σε δεκαεννέα μέρες και το Ελ Αλαμέιν είχε ήδη κριθεί, οπότε το
    στρατιωτικό αποτέλεσμα ήταν μικρό. Το πολιτικό δεν ήταν: υπήρξε η μοναδική κοινή
    επιχείρηση των δύο αντίπαλων αντάρτικων στρατών και έπεισε το Λονδίνο να κρατήσει
    μόνιμη αποστολή στην Ελλάδα, με όπλα και χρυσές λίρες στα χέρια της.
body:
  en: |
    The party, under Brigadier Eddie Myers of the Royal Engineers with Christopher
    Woodhouse as his second, jumped on the night of 30 September 1942 after a first
    attempt on 28 September failed. Its orders were to destroy one of the three viaducts
    on the Thessaloniki to Athens line, Gorgopotamos, Asopos or Papadia, which carried
    German supplies to the North African front. Gorgopotamos was chosen. The British made
    contact with Aris Velouchiotis's ELAS and, after several weeks of searching, with
    Napoleon Zervas's EDES in Epirus.

    About 150 men went in on the night of 25 November 1942. The Greeks assaulted the
    Italian guard posts at each end of the bridge and held them through a firefight of
    roughly an hour and a half while the British demolition party worked on the piers. Two
    spans came down. The IV Ferrovieri railway engineer battalion had the line open again
    in nineteen days, and the Second Battle of El Alamein had been decided three weeks
    before the raid, so the operation cut nothing that mattered to Rommel. Reprisals
    followed in the villages around the bridge.

    What it changed was the British relationship with the Greek resistance. It was the
    first major sabotage success of the Special Operations Executive in occupied Europe,
    and London converted the Harling party into the standing British Military Mission.
    From then on British supplies were the lever by which Britain tried to control
    EAM and ELAS, and EDES's dependence on those supplies made it Britain's instrument
    against ELAS when the two turned on each other a year later. The same mission blew
    the Asopos viaduct in June 1943 alone, after ELAS declined to take part. Gorgopotamos
    became the national commemoration of the resistance and, in time, a contested
    political occasion in its own right: the anniversary of 1964 ended in violence between
    left and right.
  el: |
    Το κλιμάκιο, υπό τον ταξίαρχο του Μηχανικού Έντι Μάγιερς με υπαρχηγό τον Κρίστοφερ
    Γουντχάουζ, πήδηξε τη νύχτα της 30ής Σεπτεμβρίου 1942, αφού μια πρώτη απόπειρα στις 28
    Σεπτεμβρίου απέτυχε. Είχε εντολή να καταστρέψει μία από τις τρεις γέφυρες της γραμμής
    Θεσσαλονίκης προς Αθήνα, τον Γοργοπόταμο, τον Ασωπό ή την Παπαδιά, από όπου περνούσαν
    οι γερμανικές προμήθειες για το βορειοαφρικανικό μέτωπο. Επελέγη ο Γοργοπόταμος. Οι
    Βρετανοί ήρθαν σε επαφή με τον ΕΛΑΣ του Άρη Βελουχιώτη και, ύστερα από εβδομάδες
    αναζήτησης, με τον ΕΔΕΣ του Ναπολέοντα Ζέρβα στην Ήπειρο.

    Περίπου 150 άνδρες επιτέθηκαν τη νύχτα της 25ης Νοεμβρίου 1942. Οι Έλληνες χτύπησαν τα
    ιταλικά φυλάκια στις δύο άκρες της γέφυρας και τα κράτησαν καθηλωμένα σε μάχη μιάμισης
    περίπου ώρας, όσο το βρετανικό κλιμάκιο ανατινάξεων δούλευε στα βάθρα. Δύο ανοίγματα
    έπεσαν. Το ιταλικό τάγμα σιδηροδρομικού μηχανικού IV Ferrovieri άνοιξε ξανά τη γραμμή
    σε δεκαεννέα μέρες, και η δεύτερη μάχη του Ελ Αλαμέιν είχε κριθεί τρεις εβδομάδες πριν
    από την επιδρομή, οπότε η επιχείρηση δεν έκοψε τίποτα που να μετρούσε για τον Ρόμμελ.
    Στα χωριά γύρω από τη γέφυρα ακολούθησαν αντίποινα.

    Αυτό που άλλαξε ήταν η βρετανική σχέση με την ελληνική Αντίσταση. Ήταν η πρώτη μεγάλη
    επιτυχία δολιοφθοράς της SOE στην κατεχόμενη Ευρώπη, και το Λονδίνο μετέτρεψε το
    κλιμάκιο Χάρλινγκ σε μόνιμη Βρετανική Στρατιωτική Αποστολή. Από εκεί και πέρα ο
    βρετανικός εφοδιασμός ήταν ο μοχλός με τον οποίο η Βρετανία προσπάθησε να ελέγξει το
    ΕΑΜ και τον ΕΛΑΣ, και η εξάρτηση του ΕΔΕΣ από αυτόν τον εφοδιασμό τον έκανε βρετανικό
    εργαλείο εναντίον του ΕΛΑΣ όταν οι δύο στράφηκαν ο ένας εναντίον του άλλου έναν χρόνο
    αργότερα. Η ίδια αποστολή ανατίναξε μόνη της τη γέφυρα του Ασωπού τον Ιούνιο του 1943,
    αφού ο ΕΛΑΣ αρνήθηκε να συμμετάσχει. Ο Γοργοπόταμος έγινε η εθνική επέτειος της
    Αντίστασης και, με τον καιρό, πολιτικά αμφισβητούμενη επέτειος: ο εορτασμός του 1964
    κατέληξε σε συγκρούσεις Αριστεράς και Δεξιάς.
