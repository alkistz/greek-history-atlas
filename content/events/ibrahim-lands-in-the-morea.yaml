id: ibrahim-lands-in-the-morea
title:
  en: Ibrahim Pasha Lands in the Morea
  el: Η απόβαση του Ιμπραήμ στον Μοριά
summary:
  en: >
    Ibrahim Pasha, son of Muhammad Ali of Egypt, landed at Methoni in the south-western
    Peloponnese in late February 1825 with a European-trained army unlike anything the
    Greeks had faced. The revolutionary government was just coming out of a civil war, and
    within four months he had taken the Navarino forts, broken the Greek forces at
    Sphacteria and Maniaki and entered Tripolitsa. His campaign came closer than any other
    to ending the revolution, and the fear that he would empty the Morea of its people was
    one of the arguments that moved Britain, France and Russia to intervene.
  el: >
    Ο Ιμπραήμ πασάς, γιος του Μεχμέτ Αλή της Αιγύπτου, αποβιβάστηκε στη Μεθώνη, στη
    νοτιοδυτική Πελοπόννησο, στα τέλη Φεβρουαρίου 1825 με στρατό ευρωπαϊκής εκπαίδευσης,
    διαφορετικό από οτιδήποτε είχαν αντιμετωπίσει οι Έλληνες. Η επαναστατική διοίκηση μόλις
    έβγαινε από εμφύλιο πόλεμο, και μέσα σε τέσσερις μήνες ο Ιμπραήμ είχε καταλάβει τα κάστρα
    του Ναβαρίνου, είχε συντρίψει τις ελληνικές δυνάμεις στη Σφακτηρία και στο Μανιάκι και
    είχε μπει στην Τριπολιτσά. Η εκστρατεία του έφτασε πιο κοντά από κάθε άλλη στο να
    τερματίσει την Επανάσταση, και ο φόβος ότι θα ερήμωνε τον Μοριά από τους κατοίκους του
    ήταν ένα από τα επιχειρήματα που ώθησαν τη Βρετανία, τη Γαλλία και τη Ρωσία να
    επέμβουν.
body:
  en: |
    Sultan Mahmud II, unable to put down the revolt with his own forces, turned in 1824 to
    Muhammad Ali, the governor of Egypt, whose army had been drilled on European lines by
    French instructors, for the price of Crete and the Peloponnese. Egyptian forces had
    already crushed the rising in Crete and destroyed Kasos, and Ibrahim's expedition
    crossed to the Morea from Crete. The Greeks had spent 1824 fighting each other. In the
    second of the civil wars of 1823–1825 the government of Georgios Kountouriotis, backed by
    the islanders and the Roumeliot captains, defeated the Peloponnesian chiefs, and by the
    spring Kolokotronis was a prisoner on Hydra.

    The fleet completed its crossing in the last days of February 1825. Most accounts give 23
    or 24 February and some 26 February, and no Greek date in Old Style could be confirmed.
    About 4,000 infantry and 400 cavalry came ashore at Methoni, which with Koroni had stayed
    in Ottoman hands throughout the war, and a second force of some 7,000 followed three
    weeks later. On 8 May (26 April Old Style) Ibrahim's troops stormed the island of Sphacteria, where the Hydriot captain Anastasios Tsamados was
    killed and Mavrokordatos escaped by sea, and both Navarino forts surrendered within
    weeks. On 1 June (20 May Old Style) Papaflessas, the minister who had gone out to stop
    him, was killed with most of his men at Maniaki.

    The government released Kolokotronis and made him commander-in-chief in the
    Peloponnese, but he could not meet Ibrahim's infantry in the open field and fell back on
    raids and ambushes. Ibrahim entered Tripolitsa in June and pushed on into the Argolid
    towards Nafplio, where on 25 June (13 June Old Style) a small force under Makriyannis
    and Dimitrios Ypsilantis threw him back at the Mills of Lerna, his first defeat on land
    in the Peloponnese. His method was to burn villages, cut down olive groves and orchards and
    carry off the inhabitants as slaves. In December he took his army to the siege of
    Messolonghi, which fell in April 1826.

    By the end of 1825 his army had overrun most of the Peloponnese, and reports that
    he meant to remove its Greek population and resettle the land with Egyptians alarmed
    opinion in Britain and Russia, whether or not they were true. The Protocol of St
    Petersburg of April 1826 followed, then the Treaty of London of July 1827 and Navarino.
    His landing is the point at which the war stopped being one the Greeks could decide by
    themselves.
  el: |
    Ο σουλτάνος Μαχμούτ Β΄, ανίκανος να καταστείλει την εξέγερση με τις δικές του δυνάμεις,
    στράφηκε το 1824 στον Μεχμέτ Αλή, τον διοικητή της Αιγύπτου, του οποίου ο στρατός είχε
    εκπαιδευτεί με ευρωπαϊκά πρότυπα από γάλλους εκπαιδευτές, με αντάλλαγμα την Κρήτη και την
    Πελοπόννησο. Οι αιγυπτιακές δυνάμεις είχαν ήδη συντρίψει την εξέγερση στην Κρήτη και
    καταστρέψει την Κάσο, και η εκστρατεία του Ιμπραήμ πέρασε στον Μοριά από την Κρήτη. Οι
    Έλληνες είχαν περάσει το 1824 πολεμώντας μεταξύ τους. Στον
    δεύτερο από τους εμφυλίους του 1823–1825 η κυβέρνηση του Γεωργίου Κουντουριώτη, με τη
    στήριξη των νησιωτών και των ρουμελιωτών οπλαρχηγών, νίκησε τους πελοποννήσιους
    αρχηγούς, και ως την άνοιξη ο Κολοκοτρώνης ήταν φυλακισμένος στην Ύδρα.

    Ο στόλος ολοκλήρωσε τη διάβαση τις τελευταίες μέρες του Φεβρουαρίου 1825. Οι
    περισσότερες αφηγήσεις δίνουν 23 ή 24 Φεβρουαρίου και ορισμένες 26 Φεβρουαρίου, ενώ δεν
    στάθηκε δυνατό να επιβεβαιωθεί ελληνική ημερομηνία με το παλαιό ημερολόγιο. Περίπου 4.000
    πεζοί και 400 ιππείς αποβιβάστηκαν στη Μεθώνη, που μαζί με την Κορώνη είχε μείνει σε
    οθωμανικά χέρια σε όλη τη διάρκεια του πολέμου, και μια δεύτερη δύναμη περίπου 7.000
    ανδρών ακολούθησε τρεις εβδομάδες αργότερα. Στις 8 Μαΐου (26 Απριλίου με το παλαιό ημερολόγιο) τα στρατεύματα του Ιμπραήμ κατέλαβαν
    εξ εφόδου τη Σφακτηρία, όπου σκοτώθηκε ο υδραίος καπετάνιος Αναστάσιος Τσαμαδός και ο
    Μαυροκορδάτος διέφυγε από τη θάλασσα, και τα δύο κάστρα του Ναβαρίνου παραδόθηκαν μέσα σε
    λίγες εβδομάδες. Την 1η Ιουνίου (20 Μαΐου με το παλαιό ημερολόγιο) ο Παπαφλέσσας, ο
    υπουργός που είχε βγει να τον σταματήσει, σκοτώθηκε μαζί με τους περισσότερους άνδρες
    του στο Μανιάκι.

    Η κυβέρνηση αποφυλάκισε τον Κολοκοτρώνη και τον διόρισε αρχιστράτηγο στην Πελοπόννησο,
    εκείνος όμως δεν μπορούσε να αντιμετωπίσει το πεζικό του Ιμπραήμ σε ανοιχτό πεδίο και
    στράφηκε σε επιδρομές και ενέδρες. Ο Ιμπραήμ μπήκε στην Τριπολιτσά τον Ιούνιο και
    προχώρησε στην Αργολίδα προς το Ναύπλιο, όπου στις 25 Ιουνίου (13 Ιουνίου με το παλαιό
    ημερολόγιο) μια μικρή δύναμη υπό τον Μακρυγιάννη και τον Δημήτριο Υψηλάντη τον απέκρουσε
    στους Μύλους της Λέρνας, η πρώτη του ήττα στην ξηρά στην Πελοπόννησο. Η μέθοδός του ήταν να
    καίει χωριά, να κόβει ελαιώνες και περιβόλια και να παίρνει τους κατοίκους σκλάβους. Τον
    Δεκέμβριο οδήγησε τον στρατό του στην πολιορκία του Μεσολογγίου, που έπεσε τον Απρίλιο
    του 1826.

    Ως το τέλος του 1825 ο στρατός του είχε σαρώσει το μεγαλύτερο μέρος
    της Πελοποννήσου, και οι πληροφορίες ότι σκόπευε να απομακρύνει τον ελληνικό πληθυσμό και
    να εποικίσει τη γη με Αιγυπτίους ανησύχησαν την κοινή γνώμη στη Βρετανία και στη Ρωσία,
    είτε ήταν αληθινές είτε όχι. Ακολούθησαν το Πρωτόκολλο της Πετρούπολης τον Απρίλιο του
    1826, η Συνθήκη του Λονδίνου τον Ιούλιο του 1827 και το Ναβαρίνο. Η απόβασή του είναι το
    σημείο όπου ο πόλεμος έπαψε να κρίνεται μόνο από τους Έλληνες.
