    note: >
      The landing date is not settled: public sources give 23, 24 and 26 February 1825 and
      none found states the Old Style date explicitly, so 24 February is stored and the text
      gives the range. Sphacteria, Maniaki and Lerna dates convert cleanly between the Old
      Style and New Style forms the sources give. Place `methoni` is new.
