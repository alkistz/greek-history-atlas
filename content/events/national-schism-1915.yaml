id: national-schism-1915
title:
  en: "The National Schism: Venizelos against Constantine"
  el: "Ο Εθνικός Διχασμός: η ρήξη Βενιζέλου και Κωνσταντίνου"
summary:
  en: >
    Britain offered Greece territory in Asia Minor for joining the Entente. Venizelos
    wanted to take it; King Constantine held to neutrality and forced his prime minister
    out in March 1915. Venizelos won the election that followed and was dismissed a
    second time in October, on the very day Allied troops began landing at Thessaloniki.
    It was the first time since 1875 that the Crown had removed a prime minister with a
    parliamentary majority behind him, and it divided the country into Venizelist and
    royalist camps that would purge each other for the next twenty years.
  el: >
    Η Βρετανία πρόσφερε στην Ελλάδα εδάφη στη Μικρά Ασία με αντάλλαγμα τη συμμετοχή της
    στην Αντάντ. Ο Βενιζέλος ήθελε να τα πάρει, ο βασιλιάς Κωνσταντίνος επέμενε στην
    ουδετερότητα και εξανάγκασε τον πρωθυπουργό του σε παραίτηση τον Μάρτιο του 1915.
    Ο Βενιζέλος κέρδισε τις εκλογές που ακολούθησαν και παύθηκε δεύτερη φορά τον Οκτώβριο,
    την ίδια ημέρα που τα συμμαχικά στρατεύματα άρχιζαν να αποβιβάζονται στη Θεσσαλονίκη.
    Ήταν η πρώτη φορά από το 1875 που το Στέμμα απομάκρυνε πρωθυπουργό με κοινοβουλευτική
    πλειοψηφία, και η χώρα χωρίστηκε σε βενιζελικούς και βασιλικούς που θα εκκαθάριζαν ο
    ένας τον άλλον για είκοσι χρόνια.
body:
  en: |
    The offer was concrete: Greek participation in the Dardanelles operation in exchange
    for compensation on the Anatolian coast. Venizelos saw in it the Megali Idea made
    practical, and argued that Greece's future could only be secured on the winning side.
    Constantine, brother-in-law of Kaiser Wilhelm II and a product of the Prussian
    military system, held to what he called unconditional neutrality. Ioannis Metaxas,
    deputy chief of the General Staff, resigned in February 1915 rather than endorse a
    Greek expedition to Gallipoli, and his technical objections gave the King's refusal
    a professional argument to stand on.

    Venizelos resigned on 6 March 1915. His Liberals won the election of 13 June with
    184 of 316 seats, but Constantine pleaded illness and delayed letting him form a
    government until August. When Bulgaria mobilised in September, Greece was bound to
    Serbia by the treaty of June 1913. Venizelos mobilised the army, invited an
    Anglo-French force to Thessaloniki, and on 4 October carried a parliamentary vote for
    war with Bulgaria by 152 to 102.

    Constantine dismissed him the next day. Alexandros Zaimis took office on 7 October,
    parliament was dissolved, and the Liberals boycotted the election of December 1915.
    Greece now had a king governing against the majority the electorate had returned, an
    Allied army on its soil, and within a year two rival governments. Some English
    accounts loosely date the second dismissal to December 1915, conflating it with the
    dissolution of parliament; the break came on 5 October.
  el: |
    Η προσφορά ήταν συγκεκριμένη: ελληνική συμμετοχή στην επιχείρηση των Δαρδανελλίων με
    αντάλλαγμα εδαφικές αποζημιώσεις στα μικρασιατικά παράλια. Ο Βενιζέλος είδε σε αυτήν τη
    Μεγάλη Ιδέα να γίνεται πρακτική πολιτική και υποστήριζε ότι το μέλλον της Ελλάδας
    εξασφαλιζόταν μόνο στο πλευρό των νικητών. Ο Κωνσταντίνος, γαμπρός του κάιζερ Γουλιέλμου
    Β΄ και προϊόν της πρωσικής στρατιωτικής σχολής, επέμενε σε αυτό που ονόμαζε ανεπιφύλακτη
    ουδετερότητα. Ο Ιωάννης Μεταξάς, υπαρχηγός του Γενικού Επιτελείου, παραιτήθηκε τον
    Φεβρουάριο του 1915 αντί να προσυπογράψει ελληνική εκστρατεία στην Καλλίπολη, και οι
    τεχνικές του αντιρρήσεις έδωσαν στην άρνηση του βασιλιά ένα επαγγελματικό έρεισμα.

    Ο Βενιζέλος παραιτήθηκε στις 6 Μαρτίου 1915. Οι Φιλελεύθεροι κέρδισαν τις εκλογές της
    13ης Ιουνίου με 184 από τις 316 έδρες, αλλά ο Κωνσταντίνος, επικαλούμενος την ασθένειά
    του, καθυστέρησε τον σχηματισμό κυβέρνησης ως τον Αύγουστο. Όταν η Βουλγαρία επιστράτευσε
    τον Σεπτέμβριο, η Ελλάδα δεσμευόταν απέναντι στη Σερβία από τη συνθήκη του Ιουνίου 1913.
    Ο Βενιζέλος κήρυξε επιστράτευση, κάλεσε αγγλογαλλική δύναμη στη Θεσσαλονίκη και στις 4
    Οκτωβρίου πέρασε από τη Βουλή την απόφαση για πόλεμο κατά της Βουλγαρίας με 152 ψήφους
    έναντι 102.

    Ο Κωνσταντίνος τον έπαυσε την επομένη. Ο Αλέξανδρος Ζαΐμης ανέλαβε στις 7 Οκτωβρίου, η
    Βουλή διαλύθηκε και οι Φιλελεύθεροι απείχαν από τις εκλογές του Δεκεμβρίου 1915. Η Ελλάδα
    είχε πλέον βασιλιά που κυβερνούσε εναντίον της πλειοψηφίας που είχε βγάλει το εκλογικό
    σώμα, συμμαχικό στρατό στο έδαφός της και, μέσα σε έναν χρόνο, δύο αντίπαλες κυβερνήσεις.
    Ορισμένες αγγλόφωνες αφηγήσεις τοποθετούν πρόχειρα τη δεύτερη παύση τον Δεκέμβριο του
    1915, συγχέοντάς την με τη διάλυση της Βουλής: η ρήξη έγινε στις 5 Οκτωβρίου.
