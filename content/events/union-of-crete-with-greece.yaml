id: union-of-crete-with-greece
title:
  en: The union of Crete with Greece
  el: Η Ένωση της Κρήτης με την Ελλάδα
summary:
  en: >
    The Greek flag was raised at the Firka fortress in Chania in the presence of King
    Constantine I and Prime Minister Eleftherios Venizelos, and the flag of the autonomous
    Cretan State came down for good. The legal basis was the Treaty of London, in which the
    Sultan renounced his rights over the island, completed by the Treaty of Athens, in which
    the Ottoman Empire recognised Greek sovereignty over it directly. Union closed a cycle
    of insurrections running from 1821 through 1841, 1858, 1866, 1878, 1889, 1895 and 1905.
    Crete was the last of the Balkan War acquisitions to be formally incorporated, and the
    day is still kept on the island every 1 December.
  el: >
    Η ελληνική σημαία υψώθηκε στο φρούριο Φιρκά στα Χανιά παρουσία του βασιλιά Κωνσταντίνου
    Α΄ και του πρωθυπουργού Ελευθερίου Βενιζέλου, και η σημαία της αυτόνομης Κρητικής
    Πολιτείας υποστελλόταν οριστικά. Νομική βάση ήταν η Συνθήκη του Λονδίνου, με την οποία ο
    σουλτάνος παραιτήθηκε από τα δικαιώματά του στο νησί, και η Συνθήκη των Αθηνών, με την
    οποία η Οθωμανική Αυτοκρατορία αναγνώρισε απευθείας την ελληνική κυριαρχία. Η Ένωση
    έκλεισε έναν κύκλο επαναστάσεων που ξεκινούσε από το 1821 και περνούσε από το 1841, το
    1858, το 1866, το 1878, το 1889, το 1895 και το 1905. Η Κρήτη ήταν το τελευταίο από τα
    εδάφη των Βαλκανικών Πολέμων που ενσωματώθηκε τυπικά, και η μέρα γιορτάζεται στο νησί
    κάθε 1η Δεκεμβρίου.
body:
  en: |
    Crete had been Greek in practice before it was Greek in law. Venizelos, who had refused
    for two years as prime minister to seat the Cretan deputies in the Greek Chamber while
    the Powers were watching, admitted them in 1912 once the war made the question moot.
    The Treaty of London of 17/30 May 1913 removed the Sultan's rights over the island in
    favour of the four allies. The Treaty of Athens of 1/14 November 1913 settled it
    bilaterally: the Ottoman Empire recognised Greek possession of Thessaloniki, Ioannina
    and their hinterlands and Greek sovereignty over Crete, with guarantees for the Muslims
    of the new territories.

    The ceremony on 1/14 December was held at the Firka fortress, where the flag of the
    union had gone up unilaterally in 1908 and been taken down again. A new flagstaff was
    raised for it. Cretan commentary counted the interval since the fall of Chania to the
    Ottomans in 1645 at 267 years, 7 months and 7 days. The Cretan State's white, blue and
    red flag, with its star for the Muslim population, was retired along with the island's
    coinage and stamps.

    The star had marked about 11 per cent of the population in 1911, largely Greek-speaking
    Muslims whose families had been on the island for centuries. They began to leave after
    the union, and those who remained were removed in the compulsory exchange of populations
    of 1923. For Venizelos the day closed a personal circuit: the lawyer who had proclaimed
    union from a mountain village in 1905, and been shelled for it, raised the flag eight
    years later as prime minister of the kingdom.
  el: |
    Η Κρήτη ήταν ελληνική στην πράξη πριν γίνει ελληνική στο δίκαιο. Ο Βενιζέλος, που ως
    πρωθυπουργός είχε αρνηθεί επί δύο χρόνια να δεχθεί τους Κρητικούς βουλευτές στην
    ελληνική Βουλή όσο τον παρακολουθούσαν οι Δυνάμεις, τους έβαλε στην αίθουσα το 1912,
    όταν ο πόλεμος είχε κάνει το ζήτημα άνευ αντικειμένου. Η Συνθήκη του Λονδίνου της 17/30
    Μαΐου 1913 αφαίρεσε από τον σουλτάνο τα δικαιώματά του στο νησί υπέρ των τεσσάρων
    συμμάχων. Η Συνθήκη των Αθηνών της 1/14 Νοεμβρίου 1913 το ρύθμισε διμερώς: η Οθωμανική
    Αυτοκρατορία αναγνώρισε την ελληνική κατοχή της Θεσσαλονίκης, των Ιωαννίνων και των
    ενδοχωρών τους, καθώς και την ελληνική κυριαρχία στην Κρήτη, με εγγυήσεις για τους
    μουσουλμάνους των νέων χωρών.

    Η τελετή της 1/14 Δεκεμβρίου έγινε στο φρούριο Φιρκά, εκεί όπου είχε υψωθεί μονομερώς η
    σημαία της Ένωσης το 1908 και είχε ξανακατέβει. Στήθηκε νέος ιστός γι' αυτήν. Οι
    Κρητικοί μετρούσαν τότε το διάστημα από την πτώση των Χανίων στους Οθωμανούς το 1645 σε
    267 χρόνια, 7 μήνες και 7 μέρες. Η λευκή, γαλάζια και κόκκινη σημαία της Πολιτείας, με
    το αστέρι για τον μουσουλμανικό πληθυσμό, αποσύρθηκε μαζί με το κρητικό νόμισμα και τα
    γραμματόσημα.

    Το αστέρι αντιστοιχούσε το 1911 σε περίπου 11 τοις εκατό του πληθυσμού, κυρίως
    ελληνόφωνους μουσουλμάνους με αιώνες παρουσίας στο νησί. Άρχισαν να φεύγουν μετά την
    Ένωση, και όσοι έμειναν απομακρύνθηκαν με την υποχρεωτική ανταλλαγή πληθυσμών του 1923.
    Για τον Βενιζέλο η μέρα έκλεινε έναν προσωπικό κύκλο: ο δικηγόρος που είχε κηρύξει την
    Ένωση από ένα ορεινό χωριό το 1905, και είχε δεχθεί κανονιοβολισμούς γι' αυτό, ύψωσε τη
    σημαία οκτώ χρόνια αργότερα ως πρωθυπουργός του βασιλείου.
