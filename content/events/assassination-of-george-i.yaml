id: assassination-of-george-i
title:
  en: The assassination of King George I
  el: Η δολοφονία του βασιλιά Γεωργίου Α΄
summary:
  en: >
    George I had been living in Thessaloniki since its capture, walking most afternoons
    with one aide and no guard, in order to make the Greek claim on the city visible to
    Bulgaria. On 5/18 March 1913, near the White Tower, a destitute Greek vagrant named
    Alexandros Schinas shot him once in the back and killed him. He was five months short
    of the golden jubilee of an accession that had lasted just under fifty years, the
    longest reign in modern Greek history, and had already told ministers he meant to
    abdicate on that anniversary. Constantine I succeeded at the head of a victorious army.
  el: >
    Ο Γεώργιος Α΄ ζούσε στη Θεσσαλονίκη από την απελευθέρωσή της, περπατώντας τα
    περισσότερα απογεύματα με έναν μόνο υπασπιστή και χωρίς φρουρά, ώστε η ελληνική αξίωση
    στην πόλη να είναι ορατή προς τη Βουλγαρία. Στις 5/18 Μαρτίου 1913, κοντά στον Λευκό
    Πύργο, ένας άπορος Έλληνας αλήτης, ο Αλέξανδρος Σχινάς, τον πυροβόλησε μία φορά στην
    πλάτη και τον σκότωσε. Απείχε πέντε μήνες από το χρυσό ιωβηλαίο μιας βασιλείας που
    κράτησε λίγο λιγότερο από πενήντα χρόνια, τη μακροβιότερη της νεότερης Ελλάδας, και είχε
    ήδη πει στους υπουργούς του ότι σκόπευε να παραιτηθεί εκείνη την επέτειο. Τον διαδέχθηκε
    ο Κωνσταντίνος Α΄, επικεφαλής ενός νικηφόρου στρατού.
body:
  en: |
    The King had moved to Thessaloniki in November 1912 and stayed there deliberately. The
    city was held by Greek and Bulgarian troops at once and its ownership was an open
    question; a resident sovereign was the strongest argument Athens could make without
    firing on an ally. His habit of walking unguarded was part of the same demonstration.

    Schinas shot him from close range on the afternoon of 5/18 March; the bullet passed
    through his heart and he died almost at once. In custody he said variously that the
    King had refused him money and that he was a socialist. The government called him an
    alcoholic vagrant and no conspiracy was ever proved. On 6 May he fell some thirty feet
    from a window of the examining magistrate's office at the gendarmerie building and
    died. The official account was an escape attempt; suicide after torture and murder in
    custody were both suspected at the time and the question has never been settled.

    Constantine succeeded on the same day, at the peak of his popularity, the commander who
    had taken Thessaloniki and Ioannina. He took the regnal number I rather than the
    Byzantine numbering some had urged on him, a choice that told against the imperial
    expectations attached to his name. The change of sovereign mattered more than the
    manner of it: within three years Constantine's view of his own authority and his
    dynastic ties to Berlin produced the National Schism with Venizelos, and the country
    that had just doubled in size spent the next decade divided against itself.
  el: |
    Ο βασιλιάς είχε μετακομίσει στη Θεσσαλονίκη τον Νοέμβριο του 1912 και έμενε εκεί
    σκόπιμα. Την πόλη κρατούσαν ταυτόχρονα ελληνικά και βουλγαρικά στρατεύματα και το σε
    ποιον ανήκε ήταν ανοιχτό ζήτημα. Ένας μόνιμα εγκατεστημένος μονάρχης ήταν το ισχυρότερο
    επιχείρημα που μπορούσε να προβάλει η Αθήνα χωρίς να πυροβολήσει σύμμαχο. Η συνήθειά του
    να περπατά αφρούρητος ήταν μέρος της ίδιας επίδειξης.

    Ο Σχινάς τον πυροβόλησε από κοντινή απόσταση το απόγευμα της 5/18 Μαρτίου. Η σφαίρα
    διαπέρασε την καρδιά του και πέθανε σχεδόν ακαριαία. Στην ανάκριση είπε άλλοτε ότι ο
    βασιλιάς του είχε αρνηθεί χρήματα και άλλοτε ότι ήταν σοσιαλιστής. Η κυβέρνηση τον
    παρουσίασε ως αλκοολικό αλήτη και καμία συνωμοσία δεν αποδείχθηκε ποτέ. Στις 6 Μαΐου
    έπεσε από παράθυρο του γραφείου του ανακριτή στο κτίριο της χωροφυλακής, από ύψος
    περίπου εννέα μέτρων, και σκοτώθηκε. Η επίσημη εκδοχή ήταν απόπειρα απόδρασης. Ήδη τότε
    υπήρχαν υποψίες για αυτοκτονία μετά από βασανιστήρια ή για δολοφονία υπό κράτηση, και το
    ερώτημα δεν έκλεισε ποτέ.

    Ο Κωνσταντίνος ανέβηκε στον θρόνο την ίδια μέρα, στο απόγειο της δημοτικότητάς του, ως ο
    στρατηλάτης που είχε πάρει τη Θεσσαλονίκη και τα Ιωάννινα. Πήρε τον αριθμό Α΄ και όχι
    τη βυζαντινή αρίθμηση που του πρότειναν ορισμένοι, επιλογή που έκοβε τον δρόμο στις
    αυτοκρατορικές προσδοκίες γύρω από το όνομά του. Η αλλαγή του μονάρχη μέτρησε
    περισσότερο από τον τρόπο της: μέσα σε τρία χρόνια η αντίληψη του Κωνσταντίνου για την
    εξουσία του και οι δυναστικοί δεσμοί του με το Βερολίνο γέννησαν τον Εθνικό Διχασμό με
    τον Βενιζέλο, και η χώρα που μόλις είχε διπλασιαστεί πέρασε την επόμενη δεκαετία
    χωρισμένη στα δύο.
