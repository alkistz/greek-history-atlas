id: louis-spyridon
name: {en: Spyridon Louis, el: Σπυρίδων Λούης}
also_known_as: [{en: Spyros Louis, el: Σπύρος Λούης}]
born: {date: 1873-01-12, precision: day, place: marousi}
died: {date: 1940-03-26, precision: day, place: marousi}
roles: [athlete]
summary:
  en: >
    Water carrier from Marousi who won the marathon at the first modern Olympic Games on
    10 April 1896 in 2 hours 58 minutes and 50 seconds, first of seventeen starters, in
    front of a crowd of sixty to eighty thousand. The Crown Prince ran the last lap
    beside him. He never raced again, and spent the rest of his life in the village he
    had started from.
  el: >
    Νερουλάς από το Μαρούσι, που κέρδισε τον μαραθώνιο των πρώτων σύγχρονων Ολυμπιακών
    Αγώνων στις 10 Απριλίου 1896 σε 2 ώρες 58 λεπτά και 50 δευτερόλεπτα, πρώτος από
    δεκαεπτά δρομείς, μπροστά σε πλήθος εξήντα ως ογδόντα χιλιάδων. Ο διάδοχος έτρεξε
    δίπλα του τον τελευταίο γύρο. Δεν ξαναγωνίστηκε ποτέ και πέρασε την υπόλοιπη ζωή του
    στο χωριό από το οποίο είχε ξεκινήσει.
body:
  en: |
    The marathon was invented for the Athens Games by Michel Bréal, who proposed a race
    from Marathon to the stadium commemorating a messenger's run that no ancient source
    records. Thirteen of the seventeen starters were Greek. Louis was one of them, a man
    who carried water by mule from Marousi into Athens and had no athletic career of any
    kind.

    He came into the Panathenaic Stadium alone on 10 April 1896. Crown Prince Constantine
    and Prince George left the royal box and ran the last lap beside him; King George
    stood. In a Games that Greece had staged on charity three years after going
    bankrupt, and in a decade that would end with the rout of 1897, the victory carried
    a weight out of all proportion to the event. Louis declined the offers that followed
    and went home. He appeared in public once more, at the Berlin Olympics of 1936, and
    died at Marousi in 1940.
  el: |
    Τον μαραθώνιο τον επινόησε για τους Αγώνες της Αθήνας ο Μισέλ Μπρεάλ, που πρότεινε
    αγώνα από τον Μαραθώνα ως το Στάδιο εις ανάμνηση μιας διαδρομής αγγελιοφόρου που
    καμία αρχαία πηγή δεν καταγράφει. Από τους δεκαεπτά δρομείς οι δεκατρείς ήταν
    Έλληνες. Ένας από αυτούς ήταν ο Λούης, άνθρωπος που κουβαλούσε νερό με μουλάρι από το
    Μαρούσι στην Αθήνα και δεν είχε κανενός είδους αθλητική σταδιοδρομία.

    Μπήκε μόνος στο Παναθηναϊκό Στάδιο στις 10 Απριλίου 1896. Ο διάδοχος Κωνσταντίνος και
    ο πρίγκιπας Γεώργιος άφησαν το βασιλικό θεωρείο και έτρεξαν δίπλα του τον τελευταίο
    γύρο, ενώ ο βασιλιάς Γεώργιος σηκώθηκε όρθιος. Σε Αγώνες που η Ελλάδα είχε στήσει με
    ερανικά χρήματα τρία χρόνια μετά την πτώχευση, και σε μια δεκαετία που θα τελείωνε με
    την κατάρρευση του 1897, η νίκη απέκτησε βάρος δυσανάλογο προς το γεγονός. Ο Λούης
    αρνήθηκε τις προσφορές που ακολούθησαν και γύρισε σπίτι. Εμφανίστηκε δημοσίως άλλη μια
    φορά, στους Ολυμπιακούς Αγώνες του Βερολίνου το 1936, και πέθανε στο Μαρούσι το 1940.
sources:
