id: scobie
name: {en: Ronald Scobie, el: Ρόναλντ Σκόμπι}
born: {date: 1893-06-08, precision: day}
died: {date: 1969-02-23, precision: day}
roles: [military]
summary:
  en: >
    British lieutenant-general who commanded all forces in Greece from the Caserta
    Agreement of September 1944, Greek and guerrilla as well as British. His order of 1
    December 1944 requiring ELAS to disband precipitated the Dekemvriana, and he fought
    the battle of Athens under Churchill's instruction to hold the city by force.
  el: >
    Βρετανός αντιστράτηγος που διοίκησε όλες τις δυνάμεις στην Ελλάδα από τη Συμφωνία της
    Καζέρτας του Σεπτεμβρίου 1944, ελληνικές και αντάρτικες μαζί με τις βρετανικές. Η
    διαταγή του της 1ης Δεκεμβρίου 1944 για τη διάλυση του ΕΛΑΣ πυροδότησε τα Δεκεμβριανά,
    και έδωσε τη μάχη της Αθήνας με εντολή του Τσόρτσιλ να κρατήσει την πόλη με τη βία.
body:
  en: |
    Scobie had commanded the garrison of Tobruk and was given British III Corps and the
    Greek command in 1944. Under Caserta the Greek government placed the guerrilla armies
    under his orders, so that a British officer held formal authority over ELAS and EDES
    alike. He entered Athens on 14 October 1944, four days before the Greek government
    arrived.

    On 1 December he ordered ELAS to disband by the tenth. The order was within his
    authority and it was the moment the occupation's unresolved question became a battle.
    When the fighting started he was confined with the government to a perimeter in
    central Athens; Churchill's telegram told him to act as if he were in a conquered city
    with rebellion in progress, and he was reinforced from the Italian front and used
    artillery and aircraft inside the capital. He signed the truce with ELAS on 11
    January 1945 and left Greece later that year. Greek opinion on him has never been
    divided along any line but the one that divides opinion on the Dekemvriana themselves.
  el: |
    Ο Σκόμπι είχε διοικήσει τη φρουρά του Τομπρούκ και ανέλαβε το βρετανικό III σώμα
    στρατού και τη διοίκηση της Ελλάδας το 1944. Βάσει της Καζέρτας η ελληνική κυβέρνηση
    υπήγαγε στις διαταγές του τους αντάρτικους στρατούς, ώστε Βρετανός αξιωματικός να έχει
    τυπική εξουσία τόσο στον ΕΛΑΣ όσο και στον ΕΔΕΣ. Μπήκε στην Αθήνα στις 14 Οκτωβρίου
    1944, τέσσερις μέρες πριν από την άφιξη της ελληνικής κυβέρνησης.

    Την 1η Δεκεμβρίου διέταξε τη διάλυση του ΕΛΑΣ ως τις δέκα του μήνα. Η διαταγή ήταν
    μέσα στα όρια της εξουσίας του, και ήταν η στιγμή που το άλυτο ερώτημα της Κατοχής
    έγινε μάχη. Όταν άρχισαν οι συγκρούσεις βρέθηκε μαζί με την κυβέρνηση περιορισμένος σε
    έναν κλοιό στο κέντρο της Αθήνας. Το τηλεγράφημα του Τσόρτσιλ του έλεγε να ενεργήσει
    σαν να βρισκόταν σε κατακτημένη πόλη με εξέγερση σε εξέλιξη, και ενισχύθηκε από το
    ιταλικό μέτωπο και χρησιμοποίησε πυροβολικό και αεροπορία μέσα στην πρωτεύουσα.
    Υπέγραψε την ανακωχή με τον ΕΛΑΣ στις 11 Ιανουαρίου 1945 και έφυγε από την Ελλάδα
    μέσα στη χρονιά. Η ελληνική γνώμη γι' αυτόν δεν χωρίστηκε ποτέ κατά άλλη γραμμή από
    εκείνη που χωρίζει τη γνώμη για τα ίδια τα Δεκεμβριανά.
sources: [{id: close-1995}, {id: gerolymatos-2016}]
