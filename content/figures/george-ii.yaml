id: george-ii
name: {en: George II, el: Γεώργιος Β΄}
born: {date: 1890-07-19, precision: day}
died: {date: 1947-04-01, precision: day, place: athens}
roles: [monarch]
summary:
  en: >
    King of the Hellenes from 1922 to 1924 and again from 1935 to 1947. Deposed with the
    proclamation of the Republic, he was brought back by the plebiscite of November 1935 and
    within nine months had signed the decrees that gave Ioannis Metaxas a dictatorship. He
    left Greece again in 1941, spent the war in exile and returned after the plebiscite of
    1946.
  el: >
    Βασιλιάς των Ελλήνων από το 1922 ως το 1924 και ξανά από το 1935 ως το 1947. Εκθρονίστηκε
    με την ανακήρυξη της Δημοκρατίας, επανήλθε με το δημοψήφισμα του Νοεμβρίου 1935 και μέσα
    σε εννέα μήνες υπέγραψε τα διατάγματα που έδωσαν δικτατορικές εξουσίες στον Ιωάννη Μεταξά.
    Έφυγε πάλι από την Ελλάδα το 1941, πέρασε τον πόλεμο στην εξορία και επέστρεψε μετά το
    δημοψήφισμα του 1946.
body:
  en: |
    George succeeded his father Constantine I in September 1922, when the revolutionary
    officers who had just taken power allowed the dynasty one more chance. It did not last.
    He left the country on 19 December 1923 on what was formally leave of absence, and the
    Fourth National Assembly deposed the House of Glücksburg on 25 March 1924. He spent
    eleven years abroad, mostly in London.

    The plebiscite of 3 November 1935, held under martial law with coloured ballot papers and
    an official result of 97.87 per cent, brought him back; he landed at Phaleron from the
    cruiser Elli on 25 November. He began better than his sponsors wanted, insisting on a
    general amnesty and an end to the purge of republican officers, which cost him Kondylis.
    But when the parliament elected in January 1936 deadlocked and the caretaker prime
    minister died, he appointed Metaxas, and on 4 August 1936 he signed away the
    constitutional guarantees. He supported the dictatorship until Metaxas died in January
    1941.

    He left again in 1941 ahead of the German advance, and his war was spent in Cairo and
    London arguing about whether Greece would have him back. A plebiscite held in 1946, during
    the civil war and under conditions its critics disputed, said it would. He died in Athens
    the following spring.
  el: |
    Ο Γεώργιος διαδέχθηκε τον πατέρα του Κωνσταντίνο Α΄ τον Σεπτέμβριο του 1922, όταν οι
    επαναστάτες αξιωματικοί που είχαν μόλις πάρει την εξουσία έδωσαν στη δυναστεία μια ακόμη
    ευκαιρία. Δεν κράτησε. Εγκατέλειψε τη χώρα στις 19 Δεκεμβρίου 1923, τυπικά σε άδεια, και η
    Δ΄ Εθνοσυνέλευση κήρυξε έκπτωτους τους Γλύξμπουργκ στις 25 Μαρτίου 1924. Πέρασε έντεκα
    χρόνια στο εξωτερικό, κυρίως στο Λονδίνο.

    Τον επανέφερε το δημοψήφισμα της 3ης Νοεμβρίου 1935, που έγινε υπό στρατιωτικό νόμο με
    χρωματιστά ψηφοδέλτια και επίσημο αποτέλεσμα 97,87%· αποβιβάστηκε στο Φάληρο από το
    καταδρομικό Έλλη στις 25 Νοεμβρίου. Ξεκίνησε καλύτερα απ' ό,τι ήθελαν όσοι τον έφεραν,
    απαιτώντας γενική αμνηστία και τερματισμό της εκκαθάρισης των δημοκρατικών αξιωματικών,
    πράγμα που του στοίχισε τον Κονδύλη. Όταν όμως η Βουλή του Ιανουαρίου 1936 έφτασε σε
    αδιέξοδο και πέθανε ο υπηρεσιακός πρωθυπουργός, διόρισε τον Μεταξά, και στις 4 Αυγούστου
    1936 υπέγραψε την αναστολή των συνταγματικών εγγυήσεων. Στήριξε το καθεστώς ως τον θάνατο
    του Μεταξά τον Ιανουάριο του 1941.

    Έφυγε ξανά το 1941 μπροστά στη γερμανική προέλαση και πέρασε τον πόλεμο στο Κάιρο και το
    Λονδίνο, διαπραγματευόμενος αν η Ελλάδα θα τον δεχόταν πίσω. Δημοψήφισμα του 1946, μέσα
    στον Εμφύλιο και υπό συνθήκες που οι επικριτές του αμφισβήτησαν, απάντησε καταφατικά.
    Πέθανε στην Αθήνα την άνοιξη του επόμενου χρόνου.
