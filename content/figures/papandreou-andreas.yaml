id: papandreou-andreas
name: {en: Andreas Papandreou, el: Ανδρέας Παπανδρέου}
born: {date: 1919-02-05, precision: day, place: chios-town}
died: {date: 1996-06-23, precision: day, place: athens}
roles: [statesman]
summary:
  en: >
    Economist trained and employed in the United States who returned to Greek politics
    in the 1960s, founded PASOK in 1974 and led it to the first single-party government
    of the left in Greek history in 1981. He was Prime Minister from 1981 to 1989 and
    again from 1993 to 1996. His governments built the National Health System, rewrote
    family law and recognised the wartime resistance, and they financed a much larger
    state by borrowing.
  el: >
    Οικονομολόγος με σπουδές και ακαδημαϊκή καριέρα στις Ηνωμένες Πολιτείες, που
    επέστρεψε στην ελληνική πολιτική τη δεκαετία του 1960, ίδρυσε το ΠΑΣΟΚ το 1974 και το
    οδήγησε το 1981 στην πρώτη μονοκομματική κυβέρνηση της αριστεράς στην ελληνική
    ιστορία. Ήταν πρωθυπουργός από το 1981 ως το 1989 και ξανά από το 1993 ως το 1996. Οι
    κυβερνήσεις του δημιούργησαν το Εθνικό Σύστημα Υγείας, ξαναέγραψαν το οικογενειακό
    δίκαιο και αναγνώρισαν την Εθνική Αντίσταση, και χρηματοδότησαν ένα πολύ μεγαλύτερο
    κράτος με δανεισμό.
body:
  en: |
    Papandreou was the son of Georgios Papandreou and spent the dictatorship abroad,
    organising opposition to the colonels. He came
    back in 1974 and founded PASOK within months of the junta's fall, building it out of
    resistance networks and the part of the electorate that had lost the Civil War and
    been kept outside the state ever since. It took 13.58 per cent at its first election
    and an absolute majority seven years later.

    The programme was national independence, popular sovereignty and social liberation,
    and the campaign word was Allagi, Change. In office he recognised the National
    Resistance of 1941 to 1944 by law, let the civil-war refugees come home, introduced
    civil marriage, decriminalised adultery, abolished the dowry, equalised the position
    of spouses and created the National Health System. The constitutional revision of
    1986 removed the reserve powers of the presidency, finishing the parliamentary
    system Karamanlis had qualified.

    He did not carry out the promises to leave the European Community or remove the
    American bases; the defence agreement of 1983 kept the bases and the structural
    funds became one of the government's main resources. Wage indexation, public hiring
    and welfare spending were paid for with debt, which rose from roughly 28 per cent of
    GDP in 1981 to about 80 per cent by 1990 and is where most accounts of the later
    crisis begin. He returned to power in 1993, left office in January 1996 and died
    five months later.
  el: |
    Ο Παπανδρέου ήταν γιος του Γεωργίου Παπανδρέου και πέρασε τη δικτατορία στο
    εξωτερικό, οργανώνοντας την αντιδικτατορική δράση. Επέστρεψε το 1974 και ίδρυσε το ΠΑΣΟΚ λίγους μήνες μετά την
    πτώση της χούντας, στηριγμένο στα δίκτυα της αντίστασης και σε εκείνο το κομμάτι του
    εκλογικού σώματος που είχε χάσει τον Εμφύλιο και έμενε από τότε έξω από το κράτος.
    Στις πρώτες του εκλογές πήρε 13,58% και επτά χρόνια αργότερα απόλυτη πλειοψηφία.

    Το πρόγραμμα ήταν εθνική ανεξαρτησία, λαϊκή κυριαρχία και κοινωνική απελευθέρωση, και
    η λέξη της εκστρατείας ήταν η Αλλαγή. Στην κυβέρνηση αναγνώρισε με νόμο την Εθνική
    Αντίσταση του 1941 ως 1944, επέτρεψε την επιστροφή των πολιτικών προσφύγων του
    Εμφυλίου, θέσπισε τον πολιτικό γάμο, αποποινικοποίησε τη μοιχεία, κατάργησε την
    προίκα, εξίσωσε τους συζύγους και δημιούργησε το Εθνικό Σύστημα Υγείας. Η
    συνταγματική αναθεώρηση του 1986 αφαίρεσε τις εφεδρικές εξουσίες της προεδρίας,
    ολοκληρώνοντας το κοινοβουλευτικό σύστημα που ο Καραμανλής είχε αφήσει μισό.

    Δεν υλοποίησε τις υποσχέσεις για έξοδο από την Ευρωπαϊκή Κοινότητα και απομάκρυνση
    των αμερικανικών βάσεων: η αμυντική συμφωνία του 1983 διατήρησε τις βάσεις και τα
    διαρθρωτικά ταμεία έγιναν βασικός πόρος της κυβέρνησης. Η τιμαριθμική αναπροσαρμογή
    των μισθών, οι προσλήψεις και οι κοινωνικές δαπάνες πληρώθηκαν με χρέος, που ανέβηκε
    από περίπου 28% του ΑΕΠ το 1981 σε περίπου 80% το 1990 και από εκεί ξεκινούν οι
    περισσότερες αφηγήσεις της μετέπειτα κρίσης. Επανήλθε στην εξουσία το 1993, άφησε την
    πρωθυπουργία τον Ιανουάριο του 1996 και πέθανε πέντε μήνες αργότερα.
