id: vafiadis
name: {en: Markos Vafeiadis, el: Μάρκος Βαφειάδης}
also_known_as: [{en: General Markos, el: Στρατηγός Μάρκος}]
born: {date: 1906-01-28, precision: day}
died: {date: 1992-02-22, precision: day, place: athens}
roles: [military, revolutionary]
summary:
  en: >
    Commander of the Democratic Army of Greece from October 1946 and prime minister of the
    Provisional Democratic Government proclaimed in December 1947. He argued for keeping the war a
    guerrilla war, lost that argument to Nikos Zachariadis, and was removed from command in August
    1948 and from all office in January 1949. He returned to Greece in old age and died in Athens in
    1992.
  el: >
    Διοικητής του Δημοκρατικού Στρατού Ελλάδας από τον Οκτώβριο του 1946 και πρωθυπουργός της
    Προσωρινής Δημοκρατικής Κυβέρνησης που ανακηρύχθηκε τον Δεκέμβριο του 1947. Υποστήριξε ότι ο
    πόλεμος έπρεπε να παραμείνει ανταρτοπόλεμος, έχασε τη διαμάχη από τον Νίκο Ζαχαριάδη και
    απομακρύνθηκε από τη διοίκηση τον Αύγουστο του 1948 και από κάθε αξίωμα τον Ιανουάριο του 1949.
    Επέστρεψε στην Ελλάδα σε μεγάλη ηλικία και πέθανε στην Αθήνα το 1992.
body:
  en: |
    Vafeiadis was born in Anatolia, at Tosya by the usual attribution, though some sources give
    Senkaya in Erzurum, and came to Greece as a refugee after 1922. He joined the communist party,
    was imprisoned and exiled under Metaxas, and commanded ELAS units in Macedonia during the
    occupation. In October 1946 he took charge of the scattered bands in the mountains, which were
    named the Democratic Army of Greece two months later.

    As its commander he built a force that at its peak numbered around fifty thousand, a large
    proportion of them women, and that held ground across the northern ranges without ever taking a
    town. He was made chairman and war minister of the Provisional Democratic Government in
    December 1947, an office without a capital: the attempt to take Konitsa and install the
    government there failed in the first days of 1948.

    His quarrel with Zachariadis was about how to fight. Vafeiadis wanted mobile guerrilla warfare
    and thought a regular army with fixed positions could not survive American-equipped divisions.
    Zachariadis wanted a conventional army capable of holding territory and of being recognised as
    a state. Vafeiadis was removed from command in August 1948, stripped of his offices in January
    1949 and sent to the Soviet Union, where he remained for decades. The argument between them has
    been refought by every subsequent generation of the Greek Left.
  el: |
    Ο Βαφειάδης γεννήθηκε στη Μικρά Ασία, στην Τοσία κατά τη συνήθη απόδοση, αν και ορισμένες πηγές
    δίνουν το Σένκαγια του Ερζερούμ, και ήρθε στην Ελλάδα πρόσφυγας μετά το 1922. Εντάχθηκε στο
    κομμουνιστικό κόμμα, φυλακίστηκε και εξορίστηκε επί Μεταξά και διοίκησε τμήματα του ΕΛΑΣ στη
    Μακεδονία στη διάρκεια της Κατοχής. Τον Οκτώβριο του 1946 ανέλαβε τις διάσπαρτες ομάδες του
    βουνού, που δύο μήνες αργότερα ονομάστηκαν Δημοκρατικός Στρατός Ελλάδας.

    Ως διοικητής του συγκρότησε δύναμη που στο απόγειό της έφτασε τις πενήντα χιλιάδες μαχητές, σε
    μεγάλο ποσοστό γυναίκες, και που κράτησε έδαφος στις βόρειες οροσειρές χωρίς ποτέ να πάρει
    πόλη. Τον Δεκέμβριο του 1947 ορίστηκε πρόεδρος και υπουργός Στρατιωτικών της Προσωρινής
    Δημοκρατικής Κυβέρνησης, αξίωμα χωρίς πρωτεύουσα: η προσπάθεια να καταληφθεί η Κόνιτσα και να
    εγκατασταθεί εκεί η κυβέρνηση απέτυχε τις πρώτες μέρες του 1948.

    Η διαφωνία του με τον Ζαχαριάδη αφορούσε τον τρόπο του πολέμου. Ο Βαφειάδης ήθελε κινητό
    ανταρτοπόλεμο και θεωρούσε ότι τακτικός στρατός σε στατικές θέσεις δεν άντεχε απέναντι σε
    μεραρχίες εξοπλισμένες από τους Αμερικανούς. Ο Ζαχαριάδης ήθελε τακτικό στρατό ικανό να κρατά
    έδαφος και να αναγνωριστεί ως κράτος. Ο Βαφειάδης απομακρύνθηκε από τη διοίκηση τον Αύγουστο
    του 1948, απογυμνώθηκε από τα αξιώματά του τον Ιανουάριο του 1949 και στάλθηκε στη Σοβιετική
    Ένωση, όπου έμεινε επί δεκαετίες. Η διαμάχη των δύο έχει ξαναδοθεί από κάθε επόμενη γενιά της
    ελληνικής Αριστεράς.
