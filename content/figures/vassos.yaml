id: vassos
name: {en: Timoleon Vassos, el: Τιμολέων Βάσσος}
roles: [military]
summary:
  en: >
    Greek colonel and royal aide-de-camp who landed near Kolymbari in Crete on 14
    February 1897 with about 1,500 men and proclaimed the island annexed in the king's
    name. The Powers answered with an international squadron and a blockade that pinned
    him where he stood, and his landing is the act that carried Greece into the war of
    1897.
  el: >
    Έλληνας συνταγματάρχης και υπασπιστής του βασιλιά, που αποβιβάστηκε κοντά στο
    Κολυμπάρι της Κρήτης στις 14 Φεβρουαρίου 1897 με περίπου 1.500 άνδρες και κήρυξε την
    προσάρτηση του νησιού στο όνομα του βασιλιά. Οι Δυνάμεις απάντησαν με διεθνή μοίρα
    και αποκλεισμό που τον καθήλωσαν εκεί που βρισκόταν, και η απόβασή του είναι η πράξη
    που έσυρε την Ελλάδα στον πόλεμο του 1897.
body:
  en: |
    Vassos was sent to Crete while the Deligiannis government was still insisting it
    wanted no war. His instructions were to occupy the island in the name of George I,
    and the proclamation he issued on landing declared the union of Crete with Greece.
    Widely read Greek accounts date the landing to 7 February Old Style; the records of
    the international squadron support 14 February New Style, and the atlas follows
    them.

    He never got the chance to fight a campaign. The six Powers shelled insurgent
    positions at Akrotiri on 21 February and blockaded the island from 21 March, which
    left his force ashore and immobile while the war was decided in Thessaly. His life
    dates are not securely established: sources give his birth as around 1836 in Athens
    and his death as October 1929, without agreement on the days, and the atlas records
    neither.
  el: |
    Ο Βάσσος στάλθηκε στην Κρήτη ενώ η κυβέρνηση Δηλιγιάννη επέμενε ακόμη ότι δεν ήθελε
    πόλεμο. Οι εντολές του ήταν να καταλάβει το νησί στο όνομα του Γεωργίου Α΄, και η
    προκήρυξη που εξέδωσε κατά την απόβαση κήρυσσε την ένωση της Κρήτης με την Ελλάδα.
    Διαδεδομένα ελληνικά αφηγήματα τοποθετούν την απόβαση στις 7 Φεβρουαρίου με το παλαιό
    ημερολόγιο. Τα αρχεία της διεθνούς μοίρας στηρίζουν τη 14η Φεβρουαρίου με το νέο, και
    ο άτλαντας τα ακολουθεί.

    Ποτέ δεν πρόλαβε να δώσει εκστρατεία. Οι έξι Δυνάμεις βομβάρδισαν θέσεις των
    επαναστατών στο Ακρωτήρι στις 21 Φεβρουαρίου και απέκλεισαν το νησί από τις 21
    Μαρτίου, αφήνοντας τη δύναμή του ακινητοποιημένη στη στεριά όσο ο πόλεμος κρινόταν
    στη Θεσσαλία. Οι χρονολογίες της ζωής του δεν είναι ασφαλώς τεκμηριωμένες: οι πηγές
    δίνουν τη γέννησή του γύρω στο 1836 στην Αθήνα και τον θάνατό του τον Οκτώβριο του
    1929, χωρίς να συμφωνούν στις ημέρες, και ο άτλαντας δεν καταγράφει καμία από τις δύο.
