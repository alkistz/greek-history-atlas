    result: clean
    langs: [en, el]
    by: both texts read; dates, roles and event links checked, individual figures not independently sourced
    note: >
      Born on Hydra on 9 April 1855 as Greek and English Wikipedia give it, with no calendar stated. A birth in the Greek state in 1855 was registered Old Style, so the stored date is twelve days on, 21 April. His death in 1935 postdates the calendar reform and needs no conversion.
