id: zachariadis
name: {en: Nikos Zachariadis, el: Νίκος Ζαχαριάδης}
born: {date: 1903-04-27, precision: day}
died: {date: 1973-08-01, precision: day}
roles: [revolutionary]
summary:
  en: >
    General Secretary of the Greek Communist Party from 1931 to 1936 and again from 1945 to 1956,
    and the man who took the KKE into the Civil War. He carried the decision to abstain from the
    1946 election, sided with Moscow against Tito in 1948, and turned a guerrilla army into a
    conventional one in time to lose the war in fixed positions.
  el: >
    Γενικός γραμματέας του ΚΚΕ από το 1931 ως το 1936 και ξανά από το 1945 ως το 1956, και ο
    άνθρωπος που οδήγησε το κόμμα στον Εμφύλιο. Πέρασε την απόφαση της αποχής από τις εκλογές του
    1946, τάχθηκε με τη Μόσχα εναντίον του Τίτο το 1948 και μετέτρεψε έναν αντάρτικο στρατό σε
    τακτικό ακριβώς εγκαίρως ώστε να χάσει τον πόλεμο σε στατικές θέσεις.
body:
  en: |
    Zachariadis was born at Adrianople, worked as a seaman and was trained in Moscow before the
    Comintern installed him at the head of the Greek party in 1931. Arrested under Metaxas, he
    spent the occupation in Dachau and returned to Greece in 1945 to resume the leadership of
    a party that had come out of the resistance as the largest political force in the country and
    had then been disarmed at Varkiza.

    The decisions of the next four years were his. The KKE abstained from the election of March
    1946; the Provisional Democratic Government was proclaimed in December 1947; Markos Vafeiadis
    was removed in 1948 and 1949 for opposing the shift from guerrilla warfare to the defence of
    fixed lines on Grammos and Vitsi. Zachariadis also took the Soviet side in the Tito-Stalin
    split, which cost the Democratic Army the Yugoslav frontier in July 1949 and with it its supply
    line and its refuge.

    After the defeat he led the exiled party from Eastern Europe until 1956, when the
    de-Stalinisation of the Soviet bloc removed him. He was expelled from the KKE, sent into
    internal exile in Siberia and died at Surgut in 1973. Greek accounts of him range from the
    hardliner who destroyed the Left by strategic incompetence to the leader of a movement whose
    defeat was already decided in Washington and London; almost nobody in Greece writes about him
    without an argument attached.
  el: |
    Ο Ζαχαριάδης γεννήθηκε στην Αδριανούπολη, δούλεψε ναυτικός και εκπαιδεύτηκε στη Μόσχα πριν η
    Κομιντέρν τον τοποθετήσει επικεφαλής του ελληνικού κόμματος το 1931. Συνελήφθη επί Μεταξά,
    πέρασε την Κατοχή στο Νταχάου και επέστρεψε στην Ελλάδα το 1945 για να αναλάβει ξανά
    την ηγεσία ενός κόμματος που είχε βγει από την Αντίσταση ως η μεγαλύτερη πολιτική δύναμη της
    χώρας και είχε στη συνέχεια αφοπλιστεί στη Βάρκιζα.

    Οι αποφάσεις της επόμενης τετραετίας ήταν δικές του. Το ΚΚΕ απείχε από τις εκλογές του Μαρτίου
    1946, η Προσωρινή Δημοκρατική Κυβέρνηση ανακηρύχθηκε τον Δεκέμβριο του 1947, ο Μάρκος
    Βαφειάδης απομακρύνθηκε το 1948 και το 1949 επειδή αντιτάχθηκε στη στροφή από τον ανταρτοπόλεμο
    στην υπεράσπιση σταθερών γραμμών στον Γράμμο και στο Βίτσι. Ο Ζαχαριάδης τάχθηκε επίσης με τη
    σοβιετική πλευρά στη ρήξη Τίτο και Στάλιν, κάτι που στοίχισε στον Δημοκρατικό Στρατό τα
    γιουγκοσλαβικά σύνορα τον Ιούλιο του 1949 και μαζί τους τον ανεφοδιασμό και το καταφύγιό του.

    Μετά την ήττα ηγήθηκε του εξόριστου κόμματος από την ανατολική Ευρώπη ως το 1956, όταν η
    αποσταλινοποίηση του σοβιετικού μπλοκ τον απομάκρυνε. Διαγράφηκε από το ΚΚΕ, στάλθηκε σε
    εσωτερική εξορία στη Σιβηρία και πέθανε στο Σουργκούτ το 1973. Οι ελληνικές αναγνώσεις του
    κυμαίνονται από τον σκληροπυρηνικό που κατέστρεψε την Αριστερά με στρατηγική ανεπάρκεια ως τον
    ηγέτη ενός κινήματος του οποίου η ήττα είχε ήδη κριθεί στην Ουάσιγκτον και στο Λονδίνο. Σχεδόν
    κανείς στην Ελλάδα δεν γράφει γι' αυτόν χωρίς μια διαμάχη από πίσω.
sources: [{id: close-1995}, {id: gerolymatos-2016}]
