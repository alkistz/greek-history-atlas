id: kucuk
name: {en: Fazıl Küçük, el: Φαζίλ Κιουτσούκ}
born: {date: 1906-03-14, precision: day, place: nicosia}
died: {date: 1984-01-15, precision: day, place: london}
roles: [statesman]
summary:
  en: >
    Physician and newspaper publisher who led the Turkish Cypriot community through the end of
    British rule and became the first Vice-President of the Republic of Cyprus on 16 August 1960.
    He argued for partition against union with Greece, and held the vice-presidential veto that
    the constitution gave his community. He withdrew from the organs of the republic with the other
    Turkish Cypriot office-holders after the breakdown of December 1963 and held the office
    nominally until 1973.
  el: >
    Γιατρός και εκδότης εφημερίδας που ηγήθηκε της τουρκοκυπριακής κοινότητας στο τέλος της
    βρετανικής κυριαρχίας και έγινε ο πρώτος Αντιπρόεδρος της Κυπριακής Δημοκρατίας στις 16
    Αυγούστου 1960. Υποστήριζε τη διχοτόμηση απέναντι στην ένωση με την Ελλάδα και κατείχε την
    αντιπροεδρική αρνησικυρία που το σύνταγμα έδινε στην κοινότητά του. Αποχώρησε από τα όργανα της
    δημοκρατίας μαζί με τους υπόλοιπους Τουρκοκυπρίους αξιωματούχους μετά την κατάρρευση του
    Δεκεμβρίου 1963 και κράτησε το αξίωμα τυπικά ως το 1973.
body:
  en: |
    Küçük was born in Nicosia, trained as a doctor and founded a newspaper through which he built
    the political organisation of a community that was a minority of roughly one in five on an
    island where the majority demanded union with Greece. From the early 1950s he argued that if
    self-determination applied to Cyprus it applied to both communities, and therefore that the
    answer was taksim, partition, rather than enosis.

    The EOKA campaign from 1955 gave that argument force. Turkish Cypriot organisations formed in
    response, and the first sustained intercommunal killings date from 1958. At London in February
    1959 Küçük signed for the Turkish Cypriots the agreement that made Cyprus independent and
    barred both union and partition, and he was returned unopposed as vice-president of the new
    republic, taking office with Makarios on 16 August 1960.

    The constitution he had accepted gave his community a veto over foreign affairs, defence and
    security, seats and posts weighted at 30 and 40 per cent, and separate municipalities in the
    five main towns that were never established. When Makarios proposed on 30 November 1963 to
    remove the veto and unify the municipalities, Küçük and the Turkish Cypriot leadership refused,
    reading the amendments as the dismantling of the guarantees on which the state had been
    accepted. Intercommunal fighting followed, the Turkish Cypriot members left the organs of the
    republic, and the office Küçük held became an empty title he retained until 1973.
  el: |
    Ο Κιουτσούκ γεννήθηκε στη Λευκωσία, σπούδασε ιατρική και ίδρυσε εφημερίδα μέσω της οποίας
    έχτισε την πολιτική οργάνωση μιας κοινότητας που αποτελούσε μειονότητα περίπου ενός στους πέντε
    σε ένα νησί όπου η πλειοψηφία ζητούσε ένωση με την Ελλάδα. Από τις αρχές της δεκαετίας του 1950
    υποστήριζε ότι αν η αυτοδιάθεση ίσχυε για την Κύπρο, ίσχυε και για τις δύο κοινότητες, και
    επομένως ότι η απάντηση ήταν το ταξίμ, η διχοτόμηση, και όχι η ένωση.

    Ο αγώνας της ΕΟΚΑ από το 1955 έδωσε βάρος σε αυτό το επιχείρημα. Τουρκοκυπριακές οργανώσεις
    συγκροτήθηκαν ως απάντηση, και οι πρώτες συστηματικές διακοινοτικές δολοφονίες χρονολογούνται
    από το 1958. Στο Λονδίνο τον Φεβρουάριο του 1959 ο Κιουτσούκ υπέγραψε για τους Τουρκοκυπρίους
    τη συμφωνία που έκανε την Κύπρο ανεξάρτητη και απαγόρευε τόσο την ένωση όσο και τη διχοτόμηση,
    και αναδείχθηκε χωρίς αντίπαλο αντιπρόεδρος της νέας δημοκρατίας, αναλαμβάνοντας μαζί με τον
    Μακάριο στις 16 Αυγούστου 1960.

    Το σύνταγμα που είχε αποδεχθεί έδινε στην κοινότητά του αρνησικυρία στα εξωτερικά, στην άμυνα
    και στην ασφάλεια, έδρες και θέσεις σταθμισμένες στο 30 και στο 40 τοις εκατό, και χωριστούς
    δήμους στις πέντε μεγάλες πόλεις που δεν εφαρμόστηκαν ποτέ. Όταν ο Μακάριος πρότεινε στις 30
    Νοεμβρίου 1963 να καταργηθεί η αρνησικυρία και να ενοποιηθούν οι δήμοι, ο Κιουτσούκ και η
    τουρκοκυπριακή ηγεσία αρνήθηκαν, διαβάζοντας τις τροποποιήσεις ως κατεδάφιση των εγγυήσεων με
    τις οποίες είχε γίνει αποδεκτό το κράτος. Ακολούθησαν διακοινοτικές συγκρούσεις, οι
    Τουρκοκύπριοι αποχώρησαν από τα όργανα της δημοκρατίας, και το αξίωμα που κατείχε ο Κιουτσούκ
    έγινε κενός τίτλος τον οποίο διατήρησε ως το 1973.
sources: [{id: ker-lindsay-2011}, {id: holland-1998}]
