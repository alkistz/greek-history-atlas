id: trikoupis-charilaos
name: {en: Charilaos Trikoupis, el: Χαρίλαος Τρικούπης}
born: {date: 1832-01-01, precision: year, place: nafplio}
died: {date: 1896-04-11, precision: day, place: cannes}
roles: [statesman, diplomat]
summary:
  en: >
    Seven times prime minister and the man who built the physical state: nine hundred
    kilometres of railway, the harbour at Piraeus, the road network, all of it on
    foreign loans. He forced George I to accept in 1875 that the king could appoint only
    a government with the declared confidence of parliament, which made Greece
    parliamentary. In December 1893 he told the Chamber that the state could not pay its
    debts, and the borrowing and the achievement ended together.
  el: >
    Επτά φορές πρωθυπουργός και ο άνθρωπος που έχτισε το υλικό κράτος: εννιακόσια
    χιλιόμετρα σιδηροδρόμου, το λιμάνι του Πειραιά, το οδικό δίκτυο, όλα με δάνεια από το
    εξωτερικό. Το 1875 ανάγκασε τον Γεώργιο Α΄ να δεχθεί ότι ο βασιλιάς μπορεί να
    αναθέτει μόνο σε κυβέρνηση με τη δεδηλωμένη εμπιστοσύνη της Βουλής, και έτσι η Ελλάδα
    έγινε κοινοβουλευτική. Τον Δεκέμβριο του 1893 ανακοίνωσε στη Βουλή ότι το κράτος δεν
    μπορούσε να πληρώσει τα χρέη του, και ο δανεισμός και το έργο τελείωσαν μαζί.
body:
  en: |
    Trikoupis was born at Nafplio in 1832, the son of the historian and foreign minister
    Spyridon Trikoupis. Greek reference works give his birthday as 11 July and English
    ones as 11 June; the atlas records the year only. He entered politics by way of
    diplomacy in London, and came to national attention in June 1874 with an anonymous
    newspaper article headed Who is to blame?, which argued that the fault for Greece's
    unstable governments lay with a king who appointed ministries without majorities. He
    was identified as its author and briefly imprisoned. Within a year George I had
    conceded the point.

    In office from 1875 onwards, alternating with his rival Theodoros Deligiannis, he
    treated the state as something to be built rather than distributed. He was foreign
    minister during the Berlin negotiations that led to the cession of Thessaly and
    Arta. He reorganised the army and the tax system, and he borrowed abroad on a scale
    the currant trade could not support. When France raised its tariffs in 1892 and the
    currant price collapsed, the arithmetic ran out.

    He announced the default on 10 December 1893 Old Style. The phrase attached to him
    ever since, that regrettably we are bankrupt, is absent from the parliamentary
    record. He lost the election of 1895 so heavily that he lost his own seat, withdrew
    to Cannes and died there on 11 April 1896, five days after the Olympic Games he had
    refused to fund opened in Athens.
  el: |
    Ο Τρικούπης γεννήθηκε στο Ναύπλιο το 1832, γιος του ιστορικού και υπουργού
    Εξωτερικών Σπυρίδωνα Τρικούπη. Τα ελληνικά έργα αναφοράς δίνουν ως ημέρα γέννησής
    του την 11η Ιουλίου και τα αγγλικά την 11η Ιουνίου. Ο άτλαντας καταγράφει μόνο τη
    χρονιά. Μπήκε στην πολιτική μέσω της διπλωματίας στο Λονδίνο και έγινε πανελλήνια
    γνωστός τον Ιούνιο του 1874 με ανώνυμο άρθρο με τίτλο «Τις πταίει;», που υποστήριζε
    ότι η ευθύνη για τις ασταθείς ελληνικές κυβερνήσεις βάραινε έναν βασιλιά που διόριζε
    υπουργεία χωρίς πλειοψηφία. Αναγνωρίστηκε ως συντάκτης και φυλακίστηκε για λίγο. Μέσα
    σε έναν χρόνο ο Γεώργιος Α΄ είχε υποχωρήσει.

    Στην εξουσία από το 1875 και μετά, εναλλασσόμενος με τον αντίπαλό του Θεόδωρο
    Δηλιγιάννη, αντιμετώπισε το κράτος ως κάτι που χτίζεται και όχι που μοιράζεται. Ήταν
    υπουργός Εξωτερικών στις διαπραγματεύσεις του Βερολίνου που οδήγησαν στην παραχώρηση
    της Θεσσαλίας και της Άρτας. Αναδιοργάνωσε τον στρατό και το φορολογικό σύστημα, και
    δανείστηκε από το εξωτερικό σε κλίμακα που το εμπόριο της σταφίδας δεν μπορούσε να
    στηρίξει. Όταν η Γαλλία ύψωσε τους δασμούς της το 1892 και η τιμή της σταφίδας
    κατέρρευσε, τα νούμερα δεν έβγαιναν πια.

    Ανακοίνωσε τη στάση πληρωμών στις 10 Δεκεμβρίου 1893. Η φράση που του αποδίδεται από
    τότε, ότι δυστυχώς επτωχεύσαμεν, απουσιάζει από τα πρακτικά της Βουλής. Έχασε τις
    εκλογές του 1895 τόσο βαριά που έχασε και τη δική του έδρα, αποσύρθηκε στις Κάννες
    και πέθανε εκεί στις 11 Απριλίου 1896, πέντε μέρες αφότου άνοιξαν στην Αθήνα οι
    Ολυμπιακοί Αγώνες που είχε αρνηθεί να χρηματοδοτήσει.
