id: koretz
name: {en: Zvi Koretz, el: Τσβι Κόρετς}
born: {date: 1884-06-02, precision: day}
died: {date: 1945-06-03, precision: day}
roles: [cleric]
summary:
  en: >
    Chief Rabbi of Thessaloniki from 1933 and, from December 1942, president of the
    Judenrat the Germans imposed on the community. He held that office through the
    deportation of some 45,200 of the city's Jews to Auschwitz between March and August
    1943, was himself deported to Bergen-Belsen on 7 August 1943, and died of typhus days
    after liberation. What he did and what he could have done are still fought over by
    historians and by the survivors' descendants.
  el: >
    Αρχιρραβίνος της Θεσσαλονίκης από το 1933 και, από τον Δεκέμβριο του 1942, πρόεδρος του
    Judenrat που επέβαλαν οι Γερμανοί στην κοινότητα. Κράτησε το αξίωμα καθ' όλη την
    εκτόπιση περίπου 45.200 Εβραίων της πόλης στο Άουσβιτς, από τον Μάρτιο ως τον Αύγουστο
    του 1943, εκτοπίστηκε ο ίδιος στο Μπέργκεν-Μπέλσεν στις 7 Αυγούστου 1943 και πέθανε από
    τύφο λίγες μέρες μετά την απελευθέρωση. Το τι έκανε και το τι θα μπορούσε να είχε κάνει
    παραμένουν αντικείμενο σύγκρουσης ανάμεσα σε ιστορικούς και σε απογόνους επιζώντων.
body:
  en: |
    Koretz was born in Galicia, trained in Vienna and came to Thessaloniki in 1933 as
    chief rabbi of a Sephardic community that had been there since 1492 and that had, at
    the start of the occupation, about 50,000 members. He was arrested by the Germans in
    1941 and held in Vienna, returned in January 1942, and was installed as president of
    the Judenrat in December 1942 by the German administration.

    In that position he transmitted German orders to the community, including the
    registration and the ghetto orders that preceded the transports, and he is recorded
    as having told Jews that the deportations were a resettlement in Poland. His defenders
    argue that he was lied to as systematically as everyone else, that he had no force and
    no information, and that he stayed when he could have fled; his accusers point to
    Rabbi Elias Barzilai of Athens, who destroyed his community's register and went to the
    mountains rather than surrender names, and ask why Koretz did not do the same. The
    difference between the two cities in survival rates is stark enough that the question
    has never gone away. Koretz was deported to Bergen-Belsen with his family on 7 August
    1943, three days before the last transport left Thessaloniki, and died of typhus at
    Tröbitz in Germany on 3 June 1945 after liberation from a transport out of the camp.
  el: |
    Ο Κόρετς γεννήθηκε στη Γαλικία, σπούδασε στη Βιέννη και ήρθε στη Θεσσαλονίκη το 1933 ως
    αρχιρραβίνος μιας σεφαραδίτικης κοινότητας που βρισκόταν εκεί από το 1492 και αριθμούσε
    στην αρχή της Κατοχής περίπου 50.000 μέλη. Συνελήφθη από τους Γερμανούς το 1941 και
    κρατήθηκε στη Βιέννη, επέστρεψε τον Ιανουάριο του 1942 και τοποθετήθηκε πρόεδρος του
    Judenrat τον Δεκέμβριο του 1942 από τη γερμανική διοίκηση.

    Από τη θέση αυτή μετέφερε στην κοινότητα τις γερμανικές διαταγές, ανάμεσά τους τις
    εντολές απογραφής και εγκλεισμού στα γκέτο που προηγήθηκαν των συρμών, και καταγράφεται
    ότι είπε σε Εβραίους πως οι εκτοπίσεις ήταν μετεγκατάσταση στην Πολωνία. Όσοι τον
    υπερασπίζονται υποστηρίζουν ότι του είπαν ψέματα τόσο συστηματικά όσο και σε όλους τους
    άλλους, ότι δεν είχε ούτε δύναμη ούτε πληροφόρηση και ότι έμεινε ενώ μπορούσε να φύγει.
    Όσοι τον κατηγορούν επικαλούνται τον ραβίνο Ηλία Μπαρζιλάι της Αθήνας, που κατέστρεψε
    το μητρώο της κοινότητάς του και ανέβηκε στο βουνό αντί να παραδώσει ονόματα, και
    ρωτούν γιατί ο Κόρετς δεν έκανε το ίδιο. Η διαφορά των δύο πόλεων στα ποσοστά επιβίωσης
    είναι αρκετά μεγάλη ώστε το ερώτημα να μην έχει φύγει ποτέ. Ο Κόρετς εκτοπίστηκε με την
    οικογένειά του στο Μπέργκεν-Μπέλσεν στις 7 Αυγούστου 1943, τρεις μέρες πριν αναχωρήσει
    ο τελευταίος συρμός από τη Θεσσαλονίκη, και πέθανε από τύφο στο Τρέμπιτς της Γερμανίας
    στις 3 Ιουνίου 1945, μετά την απελευθέρωση μιας αποστολής που είχε βγει από το
    στρατόπεδο.
sources: [{id: mazower-1993}, {id: mazower-2000}]
