id: zografos
name: {en: Georgios Christakis-Zografos, el: Γεώργιος Χρηστάκης-Ζωγράφος}
born: {date: 1863-03-08, precision: day, place: paris}
died: {date: 1920-06-24, precision: day, place: athens}
roles: [statesman, diplomat]
summary:
  en: >
    Greek foreign minister in 1913 who resigned to become president of the provisional
    government of Northern Epirus, proclaimed at Argyrokastro in February 1914. He
    negotiated the Protocol of Corfu with Albania and dissolved his own government when
    the Greek army returned in October.
  el: >
    Υπουργός Εξωτερικών της Ελλάδας το 1913, παραιτήθηκε για να γίνει πρόεδρος της προσωρινής
    κυβέρνησης της Βορείου Ηπείρου, που ανακηρύχθηκε στο Αργυρόκαστρο τον Φεβρουάριο του 1914.
    Διαπραγματεύτηκε με την Αλβανία το Πρωτόκολλο της Κερκύρας και διέλυσε ο ίδιος την κυβέρνησή
    του όταν ο ελληνικός στρατός επανήλθε τον Οκτώβριο.
body:
  en: |
    Zografos came from a wealthy Epirot family with roots at Kestorati and was born in
    Paris. He entered Greek politics in the 1890s, served as foreign minister in 1913, and
    resigned over the Protocol of Florence, which assigned the districts his family came
    from to Albania.

    He took the presidency of the Northern Epirote provisional government in February 1914
    and negotiated the Protocol of Corfu in May, which secured autonomy for Korytsa and
    Argyrokastro under nominal Albanian sovereignty: the best terms anyone obtained for
    the region and terms that lasted seven years on paper and rather less in practice. He
    dissolved the provisional government in October 1914 when Greek troops returned, and
    died in Athens in 1920, a year before the Conference of Ambassadors annulled
    everything he had negotiated.
  el: |
    Ο Ζωγράφος καταγόταν από εύπορη ηπειρωτική οικογένεια με ρίζες στο Κεστοράτι και γεννήθηκε
    στο Παρίσι. Μπήκε στην ελληνική πολιτική τη δεκαετία του 1890, υπηρέτησε ως υπουργός
    Εξωτερικών το 1913 και παραιτήθηκε εξαιτίας του Πρωτοκόλλου της Φλωρεντίας, που παραχωρούσε
    στην Αλβανία τις επαρχίες από τις οποίες καταγόταν η οικογένειά του.

    Ανέλαβε την προεδρία της προσωρινής κυβέρνησης της Βορείου Ηπείρου τον Φεβρουάριο του 1914
    και διαπραγματεύτηκε τον Μάιο το Πρωτόκολλο της Κερκύρας, που εξασφάλιζε αυτονομία για την
    Κορυτσά και το Αργυρόκαστρο υπό ονομαστική αλβανική κυριαρχία: οι καλύτεροι όροι που πέτυχε
    ποτέ κανείς για την περιοχή, και όροι που κράτησαν επτά χρόνια στα χαρτιά και αρκετά
    λιγότερο στην πράξη. Διέλυσε την προσωρινή κυβέρνηση τον Οκτώβριο του 1914, όταν επανήλθαν
    τα ελληνικά στρατεύματα, και πέθανε στην Αθήνα το 1920, έναν χρόνο πριν η Διάσκεψη των
    Πρεσβευτών ακυρώσει όλα όσα είχε διαπραγματευτεί.
