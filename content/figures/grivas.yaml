id: grivas
name: {en: Georgios Grivas, el: Γεώργιος Γρίβας}
also_known_as: [{en: Digenis, el: Διγενής}]
born: {date: 1897-06-06, precision: day}
died: {date: 1974-01-27, precision: day, place: limassol}
roles: [military]
summary:
  en: >
    Cypriot-born officer of the Greek army who founded and led EOKA, the organisation whose armed
    campaign against British rule in Cyprus ran from April 1955 to March 1959. He fought for union
    with Greece and refused to accept independence as a substitute, accepting the Zurich and London
    agreements only under protest. He returned to Cyprus in the 1960s to command the Greek Cypriot
    forces and again in the 1970s to found EOKA-B against Makarios.
  el: >
    Κυπριακής καταγωγής αξιωματικός του ελληνικού στρατού, ιδρυτής και αρχηγός της ΕΟΚΑ, της
    οργάνωσης της οποίας ο ένοπλος αγώνας κατά της βρετανικής κυριαρχίας στην Κύπρο κράτησε από τον
    Απρίλιο του 1955 ως τον Μάρτιο του 1959. Πολέμησε για την ένωση με την Ελλάδα και αρνήθηκε να
    δεχθεί την ανεξαρτησία ως υποκατάστατο, αποδεχόμενος τις συμφωνίες Ζυρίχης και Λονδίνου μόνο
    υπό διαμαρτυρία. Επέστρεψε στην Κύπρο τη δεκαετία του 1960 για να διοικήσει τις
    ελληνοκυπριακές δυνάμεις και ξανά τη δεκαετία του 1970 για να ιδρύσει την ΕΟΚΑ Β΄ εναντίον του
    Μακαρίου.
body:
  en: |
    Grivas was born at Trikomo in British Cyprus and made his career in the Greek army, serving in
    Asia Minor and in Albania. He prepared the Cypriot campaign for several years before it began,
    with Makarios's knowledge, and opened it thirty minutes after midnight on 1 April 1955 with
    coordinated bombings in Nicosia, Famagusta, Limassol and Larnaca. The leaflet announcing it was
    signed Digenis, after the hero of the Byzantine frontier ballads, and he was known by that name
    for the rest of his life.

    The four years that followed made him the most wanted man on the island and the most decorated
    figure of the Greek Cypriot Right. They also made him the author of a campaign whose Greek
    Cypriot civilian dead were substantially its own work: EOKA killed informers, opponents of the
    armed struggle and members of the Cypriot Left, and that record is still fought over in Cyprus.
    He issued a leaflet accepting the Zurich and London agreements on 9 March 1959 and left the
    island, believing the settlement a betrayal of the aim he had fought for.

    His birth date is itself disputed. The usual date is 6 June 1897 in the Gregorian calendar,
    23 May 1897 Old Style, but Grivas gave 23 May 1898 on enrolling at the military academy. He
    returned to Cyprus twice more, as commander of the Greek Cypriot National Guard in the 1960s
    and clandestinely in the 1970s to build EOKA-B against Makarios and for enosis. He died at
    Limassol on 27 January 1974, six months before the coup his organisation had prepared and the
    Turkish invasion that answered it.
  el: |
    Ο Γρίβας γεννήθηκε στο Τρίκωμο της βρετανικής Κύπρου και σταδιοδρόμησε στον ελληνικό στρατό,
    υπηρετώντας στη Μικρά Ασία και στην Αλβανία. Ετοίμαζε τον κυπριακό αγώνα επί αρκετά χρόνια πριν
    ξεκινήσει, εν γνώσει του Μακαρίου, και τον άνοιξε τριάντα λεπτά μετά τα μεσάνυχτα της 1ης
    Απριλίου 1955 με συντονισμένες βομβιστικές ενέργειες σε Λευκωσία, Αμμόχωστο, Λεμεσό και
    Λάρνακα. Η προκήρυξη που τον ανήγγειλε υπογραφόταν ΔΙΓΕΝΗΣ, από τον ήρωα των ακριτικών
    τραγουδιών, και με αυτό το όνομα έμεινε γνωστός ως το τέλος της ζωής του.

    Τα τέσσερα χρόνια που ακολούθησαν τον έκαναν τον πιο καταζητούμενο άνθρωπο του νησιού και το
    εμβληματικό πρόσωπο της ελληνοκυπριακής Δεξιάς. Τον έκαναν επίσης υπεύθυνο ενός αγώνα του
    οποίου οι Ελληνοκύπριοι νεκροί άμαχοι ήταν σε μεγάλο βαθμό δικό του έργο: η ΕΟΚΑ σκότωσε
    πληροφοριοδότες, αντιπάλους του ένοπλου αγώνα και μέλη της κυπριακής Αριστεράς, και το ζήτημα
    αυτό εξακολουθεί να διχάζει την Κύπρο. Εξέδωσε προκήρυξη αποδοχής των συμφωνιών Ζυρίχης και
    Λονδίνου στις 9 Μαρτίου 1959 και έφυγε από το νησί, θεωρώντας τη ρύθμιση προδοσία του σκοπού
    για τον οποίο είχε πολεμήσει.

    Η ίδια η ημερομηνία γέννησής του αμφισβητείται. Η συνήθης είναι η 6η Ιουνίου 1897 με το νέο
    ημερολόγιο, 23 Μαΐου 1897 με το παλαιό, αλλά ο ίδιος ο Γρίβας δήλωσε 23 Μαΐου 1898 όταν
    κατατάχθηκε στη Σχολή Ευελπίδων. Επέστρεψε στην Κύπρο δύο ακόμη φορές, ως διοικητής της
    ελληνοκυπριακής Εθνικής Φρουράς τη δεκαετία του 1960 και παράνομα τη δεκαετία του 1970 για να
    οργανώσει την ΕΟΚΑ Β΄ εναντίον του Μακαρίου και υπέρ της ένωσης. Πέθανε στη Λεμεσό στις 27
    Ιανουαρίου 1974, έξι μήνες πριν από το πραξικόπημα που είχε προετοιμάσει η οργάνωσή του και
    την τουρκική εισβολή που το απάντησε.
sources: [{id: holland-1998}, {id: holland-markides-2006}]
