id: lambrakis
name: {en: Grigoris Lambrakis, el: Γρηγόρης Λαμπράκης}
born: {date: 1912-04-03, precision: day}
died: {date: 1963-05-27, precision: day, place: thessaloniki}
roles: [statesman]
summary:
  en: >
    Physician, professor of obstetrics, Balkan Games champion and EDA member of parliament for
    Piraeus, and the best-known figure of the Greek peace movement. He was clubbed on the head in
    a Thessaloniki street on 22 May 1963 by men from far-right paramilitary circles and died five
    days later. The investigation traced the attack to senior gendarmerie and army officers in the
    city. His death made the word para-state central to Greek politics, and the single letter Z,
    he lives, became the emblem of the movement that followed him.
  el: >
    Γιατρός, καθηγητής της Μαιευτικής, πρωταθλητής των Βαλκανικών Αγώνων και βουλευτής Πειραιώς με
    την ΕΔΑ, το πιο γνωστό πρόσωπο του ελληνικού κινήματος ειρήνης. Χτυπήθηκε στο κεφάλι σε δρόμο
    της Θεσσαλονίκης στις 22 Μαΐου 1963 από ανθρώπους των ακροδεξιών παρακρατικών κύκλων και πέθανε
    πέντε μέρες αργότερα. Η ανάκριση συνέδεσε την επίθεση με ανώτερους αξιωματικούς της χωροφυλακής
    και του στρατού στην πόλη. Ο θάνατός του έφερε τη λέξη παρακράτος στο κέντρο της ελληνικής
    πολιτικής, και το γράμμα Ζ, ζει, έγινε το έμβλημα του κινήματος που τον ακολούθησε.
body:
  en: |
    Lambrakis came from Kerasitsa in Arcadia, won Balkan Games titles as an athlete and taught
    obstetrics at the University of Athens. He was elected to parliament for Piraeus on the EDA
    list, the legal vehicle of a Left whose party remained banned under Law 509/1947, and became
    the public face of the Greek campaign against nuclear weapons.

    On 21 April 1963 the police banned the Marathon to Athens peace march. Lambrakis walked the
    route alone, holding a placard, protected by parliamentary immunity that the police could not
    override. The photographs made him a national figure within
    a month.

    He was killed for it. After speaking at a peace meeting in Thessaloniki on the evening of 22
    May, he was struck on the head with a club by one of two men on a three-wheeled delivery
    vehicle, in front of a crowd and with police present. He died on 27 May. The investigating
    magistrate Christos Sartzetakis followed the case into the Thessaloniki gendarmerie and army
    command and several officers were prosecuted, though the convictions eventually obtained were
    limited and how far the responsibility ran is still argued. Half a million people are estimated
    to have attended the funeral in Athens on 28 May. The letter Z, for zei, he lives, appeared on
    walls across the country, and gave its title to Vassilis Vassilikos's novel of 1966 and to
    Costa-Gavras's film of 1969.
  el: |
    Ο Λαμπράκης καταγόταν από την Κερασίτσα Αρκαδίας, κέρδισε τίτλους στους Βαλκανικούς Αγώνες ως αθλητής και
    δίδασκε Μαιευτική στο Πανεπιστήμιο Αθηνών. Εξελέγη βουλευτής Πειραιώς με το
    ψηφοδέλτιο της ΕΔΑ, του νόμιμου οχήματος μιας Αριστεράς της οποίας το κόμμα παρέμενε
    απαγορευμένο βάσει του Νόμου 509/1947, και έγινε το δημόσιο πρόσωπο του ελληνικού αγώνα κατά
    των πυρηνικών όπλων.

    Στις 21 Απριλίου 1963 η αστυνομία απαγόρευσε την πορεία ειρήνης Μαραθώνα προς Αθήνα. Ο
    Λαμπράκης βάδισε μόνος τη διαδρομή κρατώντας ένα πανό, καλυμμένος από βουλευτική ασυλία την
    οποία η αστυνομία δεν μπορούσε να παρακάμψει. Οι φωτογραφίες τον
    έκαναν πανελλήνια μορφή μέσα σε έναν μήνα.

    Γι' αυτό σκοτώθηκε. Αφού μίλησε σε αντιπολεμική συγκέντρωση στη Θεσσαλονίκη το βράδυ της 22ας
    Μαΐου, τον χτύπησε στο κεφάλι με λοστό ο ένας από δύο άνδρες πάνω σε τρίκυκλο, μπροστά σε
    πλήθος και με παρόντες αστυνομικούς. Πέθανε στις 27 Μαΐου. Ο ανακριτής Χρήστος Σαρτζετάκης
    ακολούθησε την υπόθεση μέσα στη χωροφυλακή και στη στρατιωτική διοίκηση της Θεσσαλονίκης και
    ορισμένοι αξιωματικοί παραπέμφθηκαν, αν και οι καταδίκες που τελικά επιτεύχθηκαν ήταν
    περιορισμένες και το πόσο ψηλά έφτανε η ευθύνη παραμένει υπό διαμάχη. Υπολογίζεται ότι μισό
    εκατομμύριο άνθρωποι παρακολούθησαν την κηδεία στην Αθήνα στις 28 Μαΐου. Το γράμμα Ζ, δηλαδή
    ζει, εμφανίστηκε σε τοίχους σε όλη τη χώρα και έδωσε τον τίτλο στο μυθιστόρημα του Βασίλη
    Βασιλικού το 1966 και στην ταινία του Κώστα Γαβρά το 1969.
sources: [{id: beaton-2019}, {id: kalyvas-2015}]
