# Atoms: areas whose sovereignty history is identical throughout 1821 to the present.
#
# Atoms dissolve whole NUTS3 units (`nuts3`), and `parts` takes less than a whole unit,
# in one of two ways. Where a frontier cut an island group off a mainland unit, `bbox`
# picks the polygon parts whose bounds fall inside a box (w, s, e, n). Where a frontier
# ran through a unit on land, `cut` names a line in cuts.yaml and `side` takes what lies
# inside or outside it. Either way the atom listing the whole unit gets the remainder.
#
# `external: true` marks atoms outside the modern Greek state. They are excluded from
# area totals and only drawn while a control row covers them.
#
# NUTS 2021 codes, Eurostat Nuts2json 03M.

- id: peloponnese
  name: {en: Peloponnese, el: Πελοπόννησος}
  nuts3: [EL651, EL652, EL653, EL632, EL633]

- id: attica
  name: {en: Attica, el: Αττική}
  nuts3: [EL301, EL302, EL303, EL304, EL305, EL306, EL307]
  # EL307 minus Kythira and Antikythera, which the `ionian` atom takes by bbox.

- id: sterea
  name: {en: Eastern Central Greece, el: Ανατολική Στερεά Ελλάδα}
  nuts3: [EL641, EL643, EL644, EL645]
  # Fthiotida and Evrytania south of the 1832 frontier; `sterea-north` takes the rest.

- id: sterea-north
  name: {en: Domokos and the northern Agrafa, el: Δομοκός και βόρεια Άγραφα}
  # North of the 1832 Arta-Volos line, so Ottoman with Thessaly until 1881.
  parts:
    - {nuts3: EL644, cut: kingdom-1832, side: outside}
    - {nuts3: EL643, cut: kingdom-1832, side: outside}

- id: evvoia
  name: {en: Euboea, el: Εύβοια}
  nuts3: [EL642]

- id: aitoloakarnania
  name: {en: Aetolia-Acarnania, el: Αιτωλοακαρνανία}
  nuts3: [EL631]

- id: cyclades
  name: {en: Cyclades, el: Κυκλάδες}
  nuts3: [EL422]

- id: ionian
  name: {en: Ionian Islands, el: Ιόνια Νησιά}
  nuts3: [EL621, EL622, EL623, EL624]
  # Kythira and Antikythera were Ionian, so British until 1864 and not Greek in 1832.
  parts:
    - {nuts3: EL307, bbox: [22.8, 35.7, 23.4, 36.5]}

- id: thessaly
  name: {en: Thessaly, el: Θεσσαλία}
  nuts3: [EL611, EL612, EL613]
  # What the Convention of 1881 ceded: EL613 minus the Sporades (`sporades`) and the
  # Othrys coast (`pteleos`), and EL611 and EL612 south of the 1881 frontier
  # (`thessaly-north` takes the rest).

- id: thessaly-north
  name: {en: Elassona and northern Thessaly, el: Ελασσόνα και βόρεια Θεσσαλία}
  # Left Ottoman by the line of 1881, and taken in the First Balkan War.
  parts:
    - {nuts3: EL612, cut: kingdom-1881, side: outside}
    - {nuts3: EL611, cut: kingdom-1881, side: outside}

- id: pteleos
  name: {en: Pteleos and the Othrys coast, el: Πτελεός και παράλια της Όθρυος}
  # South of the 1832 line, so Greek from the start, though inside modern Magnesia.
  parts:
    - {nuts3: EL613, cut: kingdom-1832, side: inside}

- id: sporades
  name: {en: Northern Sporades, el: Βόρειες Σποράδες}
  # Greek from 1832 with the Cyclades, half a century before the Thessalian mainland.
  parts:
    - {nuts3: EL613, bbox: [23.36, 38.9, 24.5, 39.6]}

- id: arta
  name: {en: Arta, el: Άρτα}
  nuts3: [EL541]
  # East of the Arachthos, ceded in 1881. `preveza` takes the rest of the unit.

- id: preveza
  name: {en: Preveza, el: Πρέβεζα}
  # West of the Arachthos, which the line of 1881 followed: Ottoman until 1912.
  parts:
    - {nuts3: EL541, cut: kingdom-1881, side: outside}

- id: epirus
  name: {en: Epirus, el: Ήπειρος}
  nuts3: [EL542, EL543]

- id: macedonia-west
  name: {en: Western Macedonia, el: Δυτική Μακεδονία}
  nuts3: [EL531, EL532, EL533]

- id: macedonia-central
  name: {en: Central Macedonia, el: Κεντρική Μακεδονία}
  nuts3: [EL521, EL522, EL523, EL524, EL525, EL526, EL527]

- id: macedonia-east
  name: {en: Eastern Macedonia, el: Ανατολική Μακεδονία}
  nuts3: [EL514, EL515]

- id: thrace-west
  name: {en: Western Thrace, el: Δυτική Θράκη}
  nuts3: [EL511, EL512, EL513]

- id: crete
  name: {en: Crete, el: Κρήτη}
  nuts3: [EL431, EL432, EL433, EL434]

- id: lesvos-limnos
  name: {en: Lesvos and Limnos, el: Λέσβος και Λήμνος}
  nuts3: [EL411]

- id: chios
  name: {en: Chios, el: Χίος}
  nuts3: [EL413]

- id: samos-ikaria
  name: {en: Samos and Ikaria, el: Σάμος και Ικαρία}
  nuts3: [EL412]
  # Samos was an autonomous principality 1834-1912. Ikaria declared itself a free
  # state in July 1912. v0 treats both as one unit following Samos.

- id: dodecanese
  name: {en: Dodecanese, el: Δωδεκάνησα}
  nuts3: [EL421]

# ------------------------------------------------------------- outside modern Greece
# No Ottoman baseline: rows exist only where a polity on this map is involved.

- id: thrace-east
  name: {en: Eastern Thrace, el: Ανατολική Θράκη}
  nuts3: [TR211, TR212, TR213]
  external: true

- id: imbros-tenedos
  name: {en: Imbros and Tenedos, el: Ίμβρος και Τένεδος}
  parts:
    - {nuts3: TR222, bbox: [25.6, 39.7, 26.1, 40.3]}
  external: true

- id: smyrna
  name: {en: Smyrna zone, el: Ζώνη της Σμύρνης}
  nuts3: [TR310]
  # The Sèvres zone was smaller than the modern province. Approximation.
  external: true

- id: epirus-north
  name: {en: Northern Epirus, el: Βόρεια Ήπειρος}
  nuts3: [AL033, AL034, AL035]
  external: true

- id: cyprus
  name: {en: Cyprus, el: Κύπρος}
  nuts3: [CY000]
  # The island south of the 1974 ceasefire line; `cyprus-north` takes the rest. The
  # two share one history until August 1974.
  external: true

- id: cyprus-north
  name: {en: Northern Cyprus, el: Βόρεια Κύπρος}
  parts:
    - {nuts3: CY000, cut: north-cyprus-1974, side: inside}
  external: true
